<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --blue:   #00d4ff; --blue2: #3b82f6;
  --green:  #00ff88; --green2:#22c55e;
  --gold:   #ffd700; --gold2: #f59e0b;
  --purple: #a855f7; --purple2:#c084fc;
  --orange: #ff6b35; --red:   #ff4d8d;
  --bg:     #060b18;
  --card:   rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.07);
  --muted:  rgba(255,255,255,0.3);
  --dim:    rgba(255,255,255,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:#fff;
     height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ── Background ── */
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.12;animation:drift 14s ease-in-out infinite;}
.o1{width:420px;height:420px;background:var(--blue);   top:-120px;left:-120px;animation-delay:0s;}
.o2{width:360px;height:360px;background:var(--purple); bottom:-80px;right:-80px;animation-delay:-5s;}
.o3{width:260px;height:260px;background:var(--gold);   top:45%;left:60%;animation-delay:-9s;}
.o4{width:200px;height:200px;background:var(--green);  bottom:30%;left:5%;animation-delay:-3s;}
@keyframes drift{0%,100%{transform:translate(0,0);}33%{transform:translate(25px,-25px);}66%{transform:translate(-16px,16px);}}
body::before{content:'';position:fixed;inset:0;
  background-image:radial-gradient(rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:28px 28px;pointer-events:none;z-index:0;}

/* ── Ticker ── */
.ticker-wrap{position:relative;z-index:2;background:rgba(255,255,255,.025);
             border-bottom:1px solid var(--border);padding:5px 0;overflow:hidden;
             flex-shrink:0;display:none;}
.ticker-track{display:flex;animation:tick 45s linear infinite;width:max-content;}
.ticker-track:hover{animation-play-state:paused;}
.tick-item{display:inline-flex;align-items:center;gap:7px;padding:0 20px;
           font-size:11px;font-weight:500;border-right:1px solid var(--border);white-space:nowrap;}
.tick-sym{color:var(--blue);font-weight:700;letter-spacing:.3px;}
.tick-chg{font-weight:600;}
@keyframes tick{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.up{color:var(--green);}.dn{color:var(--red);}.fl{color:var(--muted);}

/* ── Header ── */
.header{position:relative;z-index:2;display:flex;align-items:center;
        justify-content:space-between;padding:10px 22px;
        border-bottom:1px solid var(--border);flex-shrink:0;
        background:rgba(6,11,24,.8);backdrop-filter:blur(12px);}
.h-left{display:flex;align-items:center;gap:14px;}
.h-title{font-size:16px;font-weight:800;letter-spacing:-.4px;
         background:linear-gradient(135deg,#fff 0%,var(--blue) 50%,var(--purple) 100%);
         -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.mkt-pill{font-size:10px;padding:3px 10px;border-radius:12px;font-weight:700;letter-spacing:.3px;}
.mkt-pill.open  {background:rgba(0,255,136,.1);color:var(--green);border:1px solid rgba(0,255,136,.25);}
.mkt-pill.closed{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border);}
.h-right{display:flex;align-items:center;gap:10px;}
.upd-lbl{font-size:10px;color:var(--muted);}
.refresh-btn{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#060b18;
             border:none;padding:6px 14px;border-radius:8px;cursor:pointer;
             font-size:11px;font-weight:700;font-family:'Inter',sans-serif;transition:opacity .2s;}
.refresh-btn:hover{opacity:.85;}
.refresh-btn:disabled{opacity:.4;cursor:not-allowed;}
/* ── Load bar ── */
.load-bar{height:2px;background:var(--border);flex-shrink:0;position:relative;z-index:2;overflow:hidden;}
.load-fill{position:absolute;top:0;left:-30%;width:30%;height:100%;
           background:linear-gradient(90deg,var(--blue),var(--purple));
           animation:lbar 1.1s ease-in-out infinite;display:none;}
@keyframes lbar{0%{left:-30%;}100%{left:110%;}}

/* ── Tabs ── */
.tabs{position:relative;z-index:2;display:flex;gap:6px;padding:10px 22px;
      border-bottom:1px solid var(--border);flex-shrink:0;
      background:rgba(6,11,24,.7);backdrop-filter:blur(10px);}
.tab{padding:8px 22px;border-radius:8px;cursor:pointer;font-size:11.5px;font-weight:600;
     color:var(--muted);border:1px solid transparent;transition:all .18s;letter-spacing:.2px;
     white-space:nowrap;display:flex;align-items:center;gap:0;}
.tab.active{color:var(--blue);border-color:rgba(0,212,255,.3);
            background:rgba(0,212,255,.08);text-shadow:0 0 12px rgba(0,212,255,.4);}
.tab:hover:not(.active){color:rgba(255,255,255,.7);background:rgba(255,255,255,.04);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}

/* ── Panels ── */
.panels{flex:1;overflow-y:auto;padding:16px 22px;position:relative;z-index:1;}
.panel{display:none;}
.panel.active{display:block;}

/* ── Loading ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
         padding:40px 20px;gap:10px;color:var(--muted);font-size:11px;letter-spacing:.5px;}
/* Portfolio progress loader */
.ld-spin{width:26px;height:26px;border:2.5px solid rgba(255,255,255,.08);border-top-color:var(--blue);border-radius:50%;animation:ldspin .75s linear infinite;flex-shrink:0;}
@keyframes ldspin{to{transform:rotate(360deg);}}
.ld-pct{font-size:15px;font-weight:800;letter-spacing:-.3px;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ld-bar{width:180px;height:2px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden;margin-top:2px;}
.ld-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width .35s ease;width:0%;}
.ld-lbl{font-size:10px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;text-align:center;}
.ring-lbl{font-size:10px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;}
/* Thin sweep line for other panels */
.mini-line{width:140px;height:2px;background:rgba(255,255,255,.07);border-radius:2px;
           overflow:hidden;position:relative;flex-shrink:0;}
.mini-line::after{content:'';position:absolute;top:0;left:-50%;width:50%;height:100%;
                  background:linear-gradient(90deg,transparent,var(--blue),var(--purple),transparent);
                  animation:lbar .9s ease-in-out infinite;}

/* ── Glass card ── */
.glass{background:var(--card);border:1px solid var(--border);border-radius:16px;
       padding:16px;backdrop-filter:blur(20px);
       box-shadow:0 4px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05);
       position:relative;overflow:hidden;}
.glass::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
               background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);}
.g-hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px;
       padding-bottom:12px;border-bottom:1px solid var(--border);}
.g-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.g-title{font-size:.68em;font-weight:700;letter-spacing:2px;text-transform:uppercase;
         color:var(--muted);}
.g-sub{font-size:.6em;color:var(--dim);margin-left:auto;}

/* ── KPI cards ── */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
.kpi{border-radius:14px;padding:14px 16px;border:1px solid;backdrop-filter:blur(20px);
     position:relative;overflow:hidden;transition:transform .2s;}
.kpi:hover{transform:translateY(-2px);}
.kpi-glow{position:absolute;right:-20px;bottom:-20px;width:90px;height:90px;
          border-radius:50%;filter:blur(36px);opacity:.18;}
.kpi-icon{font-size:1.3em;margin-bottom:5px;display:block;}
.kpi-lbl{font-size:.56em;font-weight:700;letter-spacing:2px;text-transform:uppercase;
         color:var(--muted);margin-bottom:3px;}
.kpi-val{font-size:1.1em;font-weight:800;letter-spacing:-.4px;line-height:1;}
.kpi-sub{font-size:.58em;color:var(--dim);margin-top:4px;}
.kpi-delta{font-size:.6em;font-weight:700;padding:2px 6px;border-radius:5px;
           display:inline-block;margin-top:4px;}
.du{background:rgba(0,255,136,.12);color:var(--green);}
.dd{background:rgba(255,77,141,.12);color:var(--red);}
.df{background:rgba(255,255,255,.05);color:var(--muted);}

.kpi.blue  {background:linear-gradient(135deg,rgba(0,212,255,.08),rgba(0,212,255,.03));border-color:rgba(0,212,255,.2);}
.kpi.blue  .kpi-val{color:var(--blue); text-shadow:0 0 20px rgba(0,212,255,.35);}
.kpi.blue  .kpi-glow{background:var(--blue);}
.kpi.green {background:linear-gradient(135deg,rgba(0,255,136,.08),rgba(0,255,136,.03));border-color:rgba(0,255,136,.2);}
.kpi.green .kpi-val{color:var(--green);text-shadow:0 0 20px rgba(0,255,136,.35);}
.kpi.green .kpi-glow{background:var(--green);}
.kpi.gold  {background:linear-gradient(135deg,rgba(255,215,0,.08),rgba(255,215,0,.03));border-color:rgba(255,215,0,.2);}
.kpi.gold  .kpi-val{color:var(--gold); text-shadow:0 0 20px rgba(255,215,0,.35);}
.kpi.gold  .kpi-glow{background:var(--gold);}
.kpi.purple{background:linear-gradient(135deg,rgba(168,85,247,.08),rgba(168,85,247,.03));border-color:rgba(168,85,247,.2);}
.kpi.purple .kpi-val{color:var(--purple);text-shadow:0 0 20px rgba(168,85,247,.35);}
.kpi.purple .kpi-glow{background:var(--purple);}
.kpi.orange{background:linear-gradient(135deg,rgba(255,107,53,.08),rgba(255,107,53,.03));border-color:rgba(255,107,53,.2);}
.kpi.orange .kpi-val{color:var(--orange);text-shadow:0 0 20px rgba(255,107,53,.35);}
.kpi.orange .kpi-glow{background:var(--orange);}
.kpi.red   {background:linear-gradient(135deg,rgba(255,77,141,.08),rgba(255,77,141,.03));border-color:rgba(255,77,141,.2);}
.kpi.red   .kpi-val{color:var(--red);  text-shadow:0 0 20px rgba(255,77,141,.35);}
.kpi.red   .kpi-glow{background:var(--red);}

/* ── Section header ── */
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.sec-line{width:3px;height:14px;border-radius:2px;flex-shrink:0;}
.sec-text{font-size:.72em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
          color:rgba(255,255,255,.55);}
.sec-cnt{font-size:.6em;color:var(--muted);font-weight:500;margin-left:auto;}

/* ── Stock cards ── */
.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:18px;}
.scard{background:var(--card);border:1px solid var(--border);border-radius:14px;
       padding:14px;position:relative;overflow:hidden;
       transition:border-color .2s,transform .2s;cursor:default;
       backdrop-filter:blur(16px);}
.scard:hover{border-color:rgba(0,212,255,.25);transform:translateY(-1px);}
.scard-accent{position:absolute;top:0;left:0;right:0;height:2px;}
.scard.up   .scard-accent{background:linear-gradient(90deg,var(--green),transparent);}
.scard.dn   .scard-accent{background:linear-gradient(90deg,var(--red),transparent);}
.scard.fl   .scard-accent{background:linear-gradient(90deg,rgba(255,255,255,.15),transparent);}
.scard.shim .scard-accent{background:linear-gradient(90deg,var(--gold),transparent);
                           animation:blink .9s infinite;}
.scard-sym{font-size:13px;font-weight:800;letter-spacing:.3px;margin-top:2px;}
.scard.up  .scard-sym{color:var(--blue);}
.scard.dn  .scard-sym{color:var(--blue);}
.scard.fl  .scard-sym{color:var(--blue);}
.scard.shim .scard-sym{color:var(--muted);}
.live-tag{font-size:8px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:6px;
          vertical-align:middle;letter-spacing:.4px;}
.live-tag.live{background:rgba(0,255,136,.12);color:var(--green);}
.live-tag.sheet{background:rgba(255,255,255,.06);color:var(--muted);}
.live-tag.off{background:rgba(255,77,141,.1);color:var(--red);}
.scard-name{font-size:10px;color:var(--muted);margin-bottom:10px;font-weight:400;
            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:9px;}
.s-price{font-size:20px;font-weight:800;letter-spacing:-.5px;}
.scard.up  .s-price{color:var(--green);text-shadow:0 0 16px rgba(0,255,136,.25);}
.scard.dn  .s-price{color:var(--red);  text-shadow:0 0 16px rgba(255,77,141,.25);}
.scard.fl  .s-price{color:rgba(255,255,255,.85);}
.scard.shim .s-price{color:var(--dim);}
.chg-pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;}
.chg-pill.up{background:rgba(0,255,136,.1);color:var(--green);}
.chg-pill.dn{background:rgba(255,77,141,.1);color:var(--red);}
.chg-pill.fl{background:rgba(255,255,255,.06);color:var(--muted);}
.s-meta{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;}
.s-meta-row{font-size:9.5px;color:rgba(255,255,255,.6);}
.s-meta-row .ml{color:var(--muted);font-weight:500;}
/* P&L bar */
.pnl-section{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.pnl-label{font-size:9px;color:var(--muted);margin-bottom:4px;font-weight:500;}
.pnl-num{font-size:14px;font-weight:800;letter-spacing:-.3px;}
.pnl-num.up{color:var(--green);}
.pnl-num.dn{color:var(--red);}
.pnl-track{height:3px;background:var(--dim);border-radius:2px;margin-top:5px;overflow:hidden;}
.pnl-bar{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.pnl-bar.up{background:linear-gradient(90deg,var(--green2),var(--green));}
.pnl-bar.dn{background:linear-gradient(90deg,var(--red),#ff8fab);}
.no-pnl{font-size:9px;color:var(--dim);margin-top:8px;padding-top:8px;
        border-top:1px solid var(--border);}
/* Raw toggle */
.raw-tog{font-size:9px;color:rgba(0,212,255,.6);cursor:pointer;display:block;margin-top:5px;}
.raw-box{background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:6px;
         padding:8px;font-size:8px;color:var(--muted);font-family:monospace;
         overflow:auto;max-height:120px;margin-top:4px;display:none;line-height:1.6;}

/* ── Chart ── */
.chart-wrap{position:relative;height:180px;margin-bottom:16px;}

/* ── Table ── */
.tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;
          overflow:hidden;margin-bottom:14px;backdrop-filter:blur(16px);}
.tbl-wrap::before{content:'';display:block;height:1px;
                  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);}
table.dt{width:100%;border-collapse:collapse;}
table.dt th{text-align:left;padding:8px 12px;font-size:.58em;color:var(--muted);
            text-transform:uppercase;letter-spacing:1.5px;
            background:rgba(255,255,255,.02);border-bottom:1px solid var(--border);}
table.dt td{padding:9px 12px;font-size:.78em;border-bottom:1px solid rgba(255,255,255,.03);}
table.dt tr:last-child td{border-bottom:none;}
table.dt tr:hover td{background:rgba(255,255,255,.02);}
.sym-c{color:var(--blue);font-weight:700;letter-spacing:.3px;}

/* ── Two col ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}

/* ── Dividend Calendar ── */
.dv-wrap{padding:16px;overflow-y:auto;height:100%;padding-bottom:40px;}
.dv-ctrl{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:12px;}
.dv-ctrl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.dv-ctrl-row:last-child{margin-bottom:0;}
.dv-search{flex:1;min-width:150px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-size:.72em;padding:6px 10px;outline:none;font-family:inherit;}
.dv-search:focus{border-color:var(--blue);background:rgba(0,212,255,.06);}
.dv-search::placeholder{color:var(--muted);}
.dv-chips{display:flex;gap:5px;flex-wrap:wrap;}
.dv-chip{padding:4px 11px;border-radius:20px;font-size:.62em;font-weight:700;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:transparent;transition:all .15s;font-family:inherit;}
.dv-chip:hover{background:rgba(255,255,255,.06);}
.dv-chip.active{background:rgba(0,212,255,.15);border-color:rgba(0,212,255,.45);color:var(--blue);}
.dv-sel{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;color:#fff;font-size:.65em;font-weight:600;padding:5px 10px;outline:none;font-family:inherit;cursor:pointer;}
.dv-sel option{background:#060b18;}
.dv-count{font-size:.62em;color:var(--muted);margin-left:auto;white-space:nowrap;}
.dv-tbl-wrap{overflow-x:auto;margin-bottom:12px;border-radius:10px;border:1px solid var(--border);}
.dv-tbl{width:100%;border-collapse:collapse;font-size:.72em;}
.dv-tbl thead th{padding:9px 12px;text-align:left;font-size:.78em;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);background:rgba(255,255,255,.025);white-space:nowrap;cursor:pointer;user-select:none;transition:color .15s;}
.dv-tbl thead th:hover{color:#fff;}
.dv-tbl thead th.srt-asc::after{content:' ↑';color:var(--blue);}
.dv-tbl thead th.srt-desc::after{content:' ↓';color:var(--blue);}
.dv-tbl tbody tr{border-bottom:1px solid rgba(255,255,255,.04);transition:background .12s;}
.dv-tbl tbody tr:hover{background:rgba(255,255,255,.04);}
.dv-tbl tbody tr.upcoming{background:rgba(0,255,136,.03);border-left:2px solid rgba(0,255,136,.3);}
.dv-tbl tbody tr.holding{background:rgba(255,215,0,.06);border-left:2px solid rgba(255,215,0,.4);}
.dv-tbl tbody tr.holding:hover{background:rgba(255,215,0,.10);}
.dv-tbl tbody tr.holding.upcoming{background:rgba(255,215,0,.08);border-left:2px solid rgba(0,255,136,.5);}
.dv-holding-tag{display:inline-block;padding:1px 6px;background:rgba(255,215,0,.15);color:#ffd700;border:1px solid rgba(255,215,0,.3);border-radius:6px;font-size:.72em;font-weight:700;margin-left:5px;vertical-align:middle;}
.dv-profit{color:#ffd700;font-weight:700;}
.dv-tbl tbody td{padding:8px 12px;white-space:nowrap;}
.dv-code{font-weight:700;color:var(--blue);cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;transition:color .15s;}
.dv-code:hover{color:#7dd3fc;}
/* ── Stock chart modal ── */
#dvChartModal{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);align-items:center;justify-content:center;}
#dvChartModal.open{display:flex;}
#dvChartBox{background:#0f1117;border:1px solid rgba(255,255,255,.1);border-radius:16px;width:min(96vw,1080px);height:min(90vh,640px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.7);}
#dvChartHeader{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.07);gap:12px;flex-shrink:0;}
#dvChartSymbolLbl{font-size:1.05em;font-weight:800;color:#fff;letter-spacing:.5px;}
#dvChartExchLbl{font-size:.7em;font-weight:600;color:var(--muted);background:rgba(255,255,255,.06);padding:2px 8px;border-radius:6px;}
#dvChartClose{margin-left:auto;background:rgba(255,255,255,.06);border:none;color:rgba(255,255,255,.6);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:1.1em;display:flex;align-items:center;justify-content:center;transition:background .15s;}
#dvChartClose:hover{background:rgba(255,80,80,.2);color:#ff5050;}
#dvChartBody{flex:1;overflow:hidden;position:relative;}
#dvChartBody .tv-spinner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:.85em;}
.tv-spinner-ring{width:36px;height:36px;border:3px solid rgba(255,255,255,.08);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.dv-dps{font-weight:800;color:var(--gold);}
.dv-badge{padding:2px 7px;border-radius:10px;font-size:.78em;font-weight:700;letter-spacing:.2px;display:inline-block;}
.dv-badge.final{background:rgba(0,255,136,.1);color:var(--green);border:1px solid rgba(0,255,136,.2);}
.dv-badge.interim{background:rgba(0,212,255,.1);color:var(--blue);border:1px solid rgba(0,212,255,.2);}
.dv-badge.other{background:rgba(168,85,247,.1);color:var(--purple);border:1px solid rgba(168,85,247,.2);}
.dv-date{color:#fff;font-weight:600;}
.dv-date-sub{color:var(--muted);font-size:.88em;}
.dv-soon{display:inline-block;padding:1px 6px;background:rgba(0,255,136,.15);color:var(--green);border-radius:6px;font-size:.75em;font-weight:700;margin-left:4px;vertical-align:middle;}
.dv-no-data{text-align:center;padding:40px;color:var(--muted);font-size:.8em;}
.dv-pagination{display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;padding:6px 0;}
.dv-pg-btn{padding:5px 11px;border-radius:7px;font-size:.65em;font-weight:700;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:transparent;font-family:inherit;transition:all .15s;min-width:32px;text-align:center;}
.dv-pg-btn:hover{background:rgba(255,255,255,.07);color:#fff;}
.dv-pg-btn.active{background:rgba(0,212,255,.18);border-color:rgba(0,212,255,.5);color:var(--blue);}
.dv-pg-btn:disabled{opacity:.3;cursor:not-allowed;}
.dv-pg-info{font-size:.62em;color:var(--muted);padding:0 6px;}
.dv-charts-row{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-bottom:16px;}
.dv-chart-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;backdrop-filter:blur(16px);}
.dv-chart-lbl{font-size:.58em;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
@media(max-width:700px){.dv-charts-row{grid-template-columns:1fr;}.dv-pagination{gap:4px;}}

/* ── INSIGHTS ── */
.ins-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
.ins-sum-card{border-radius:12px;padding:12px 14px;border:1px solid;
              display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);}
.ins-sum-card.sell  {background:rgba(255,77,141,.07);border-color:rgba(255,77,141,.2);}
.ins-sum-card.watch {background:rgba(255,215,0,.07); border-color:rgba(255,215,0,.2);}
.ins-sum-card.hold  {background:rgba(0,255,136,.07); border-color:rgba(0,255,136,.2);}
.ins-sum-card.buy   {background:rgba(0,212,255,.07); border-color:rgba(0,212,255,.2);}
.ins-sum-ico{font-size:20px;flex-shrink:0;}
.ins-sum-num{font-size:22px;font-weight:800;line-height:1;}
.ins-sum-card.sell  .ins-sum-num{color:var(--red);}
.ins-sum-card.watch .ins-sum-num{color:var(--gold);}
.ins-sum-card.hold  .ins-sum-num{color:var(--green);}
.ins-sum-card.buy   .ins-sum-num{color:var(--blue);}
.ins-sum-lbl{font-size:.6em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
             color:var(--muted);margin-top:2px;}

/* Insight card */
.ins-list{display:flex;flex-direction:column;gap:10px;}
.ins-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
          padding:14px 16px;backdrop-filter:blur(16px);
          position:relative;overflow:hidden;transition:border-color .2s;}
.ins-card:hover{border-color:rgba(255,255,255,.12);}
.ins-card::after{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;border-radius:0;}
.ins-card.sell  ::after,.ins-card.sell ::after {background:var(--red);}
.ins-card.watch ::after{background:var(--gold);}
.ins-card.hold  ::after{background:var(--green);}
.ins-card.buy   ::after{background:var(--blue);}
.ins-card.info  ::after{background:var(--purple);}
/* Fix: use left border instead of pseudo-element */
.ins-card{border-left-width:3px;}
.ins-card.sell  {border-left-color:var(--red);}
.ins-card.watch {border-left-color:var(--gold);}
.ins-card.hold  {border-left-color:var(--green);}
.ins-card.buy   {border-left-color:var(--blue);}
.ins-card.info  {border-left-color:var(--purple);}

.ins-top{display:flex;align-items:flex-start;gap:12px;}
.ins-ico{font-size:18px;flex-shrink:0;margin-top:1px;}
.ins-main{flex:1;min-width:0;}
.ins-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;}
.ins-sym{font-size:12px;font-weight:800;color:var(--blue);letter-spacing:.3px;}
.ins-co{font-size:10px;color:var(--muted);font-weight:400;}
.sig-tag{font-size:.58em;font-weight:800;padding:2px 8px;border-radius:8px;
         letter-spacing:.8px;text-transform:uppercase;flex-shrink:0;}
.sig-tag.sell  {background:rgba(255,77,141,.15); color:var(--red);}
.sig-tag.watch {background:rgba(255,215,0,.15);  color:var(--gold);}
.sig-tag.hold  {background:rgba(0,255,136,.12);  color:var(--green);}
.sig-tag.buy   {background:rgba(0,212,255,.12);  color:var(--blue);}
.sig-tag.info  {background:rgba(168,85,247,.12); color:var(--purple);}
.urgency-tag{font-size:.55em;font-weight:600;padding:1px 6px;border-radius:6px;
             letter-spacing:.5px;text-transform:uppercase;}
.urgency-tag.high  {background:rgba(255,107,53,.15);color:var(--orange);}
.urgency-tag.medium{background:rgba(255,255,255,.07);color:var(--muted);}
.urgency-tag.low   {background:rgba(255,255,255,.04);color:var(--dim);}
.ins-title{font-size:12px;font-weight:700;color:rgba(255,255,255,.9);margin-bottom:4px;}
.ins-desc{font-size:11px;color:var(--muted);line-height:1.55;margin-bottom:8px;}

/* Insight metrics row */
.ins-metrics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.ins-metric{background:rgba(255,255,255,.04);border:1px solid var(--border);
            border-radius:6px;padding:4px 9px;font-size:10px;}
.ins-metric .iml{color:var(--muted);font-weight:500;margin-right:4px;}
.ins-metric .imv{font-weight:700;color:rgba(255,255,255,.85);}

/* Insight action */
.ins-action{background:rgba(255,255,255,.03);border:1px solid var(--border);
            border-radius:8px;padding:8px 10px;font-size:10.5px;line-height:1.5;
            display:flex;gap:8px;align-items:flex-start;}
.ins-action-ico{font-size:13px;flex-shrink:0;margin-top:1px;}
.ins-action-text{color:rgba(255,255,255,.75);}
.ins-action strong{color:#fff;}

/* ── Empty / Error ── */
.empty{padding:36px;text-align:center;color:var(--muted);font-size:12px;
       line-height:1.8;letter-spacing:.3px;}
.empty a{color:var(--blue);text-decoration:none;}
.empty-ico{font-size:32px;margin-bottom:8px;}
.err-box{padding:12px 14px;background:rgba(255,77,141,.06);
         border:1px solid rgba(255,77,141,.2);border-radius:10px;
         color:var(--red);font-size:11px;margin-bottom:10px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.fade-in{animation:fadeUp .4s ease both;}
/* ── Gold purity switcher ── */
.gpurity-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.gpurity-tab{
  flex:1;min-width:80px;text-align:center;
  padding:8px 4px;border-radius:10px;cursor:pointer;
  font-size:.7em;font-weight:700;letter-spacing:.6px;text-transform:uppercase;
  border:1px solid rgba(255,215,0,.18);
  color:rgba(255,215,0,.55);background:rgba(255,215,0,.04);
  transition:all .2s;user-select:none;
}
.gpurity-tab:hover{background:rgba(255,215,0,.1);color:rgba(255,215,0,.85);}
.gpurity-tab.active{
  background:rgba(255,215,0,.14);border-color:rgba(255,215,0,.55);
  color:var(--gold);box-shadow:0 0 14px rgba(255,215,0,.15);
}
.gpurity-price{text-align:center;padding:12px 0 6px;}
.gpurity-price .gp-val{
  font-size:2.4em;font-weight:800;color:var(--gold);
  letter-spacing:-1px;text-shadow:0 0 24px rgba(255,215,0,.3);
}
.gpurity-price .gp-label{
  font-size:.58em;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;
}
.gpurity-price .gp-delta{font-size:.78em;font-weight:600;margin-top:4px;}
.gprice-sub-row{display:flex;gap:10px;margin:8px 0 14px;}
.gprice-sub-cell{
  flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
  border-radius:10px;padding:8px 10px;text-align:center;cursor:pointer;
  transition:border-color .18s;
}
.gprice-sub-cell:hover{border-color:rgba(255,215,0,.3);}
.gprice-sub-cell .gsc-label{font-size:.6em;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px;}
.gprice-sub-cell .gsc-val{font-size:.92em;font-weight:700;color:rgba(255,215,0,.85);}
.up-text{color:var(--green);} .dn-text{color:var(--red);}

/* ── Analyze section ──────────────────────────────────────────────── */
.az-wrap{margin-top:6px;}
.az-search{width:100%;box-sizing:border-box;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 14px;color:#fff;font-size:.85em;outline:none;transition:border-color .2s,box-shadow .2s;}
.az-search:focus{border-color:rgba(168,85,247,.5);box-shadow:0 0 0 3px rgba(168,85,247,.08);}
.az-search::placeholder{color:rgba(255,255,255,.3);}
.az-results{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 12px;min-height:28px;}
.az-chip{padding:3px 9px;border-radius:7px;font-size:.72em;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:rgba(255,255,255,.65);transition:all .15s;white-space:nowrap;}
.az-chip:hover,.az-chip.sel{background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.4);color:#c084fc;}
.az-chip.in-port{border-color:rgba(255,215,0,.3);color:#ffd700;background:rgba(255,215,0,.06);}
.az-chip.in-port:hover,.az-chip.in-port.sel{background:rgba(255,215,0,.14);}
.az-card{cursor:pointer;border:1px solid rgba(168,85,247,.2);border-radius:12px;padding:14px 16px;background:rgba(168,85,247,.04);transition:all .2s;margin-top:4px;}
.az-card:hover{border-color:rgba(168,85,247,.5);background:rgba(168,85,247,.09);transform:translateY(-1px);box-shadow:0 4px 20px rgba(168,85,247,.15);}
.az-card-hdr{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap;}
.az-sym{font-size:1em;font-weight:800;color:#c084fc;letter-spacing:.3px;}
.az-name{font-size:.73em;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.az-hint{font-size:.68em;color:rgba(168,85,247,.55);margin-left:auto;white-space:nowrap;}
.az-price{font-size:1.5em;font-weight:800;color:#fff;margin-bottom:4px;}
.az-sector{font-size:.7em;color:var(--muted);margin-bottom:10px;}
.az-empty{color:var(--muted);font-size:.8em;padding:8px 0;}
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb o1"></div><div class="orb o2"></div>
  <div class="orb o3"></div><div class="orb o4"></div>
</div>

<!-- Ticker -->
<div class="ticker-wrap" id="tickerWrap">
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<!-- Progress bar -->
<div class="load-bar" style="position:relative;z-index:2;">
  <div class="load-fill" id="loadFill"></div>
</div>

<!-- Header -->
<div class="header">
  <div class="h-left">
    <span class="h-title">📈 CSE Stock Dashboard</span>
    <span class="mkt-pill" id="mktPill">—</span>
  </div>
  <div class="h-right">
    <span class="upd-lbl" id="updLbl">Starting…</span>
    <button class="refresh-btn" id="refreshBtn" onclick="startLoad()" disabled>↺ Refresh</button>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <div class="tab active" onclick="switchTab(0)">💼 Portfolio</div>
  <div class="tab"        onclick="switchTab(1)">🏅 Gold</div>
  <div class="tab"        onclick="switchTab(2)">💰 Dividends</div>
  <div class="tab"        onclick="switchTab(3)">💡 Insights</div>
</div>

<!-- Panels -->
<div class="panels">
  <div class="panel active" id="p0">
    <div class="loading" id="l0">
      <div class="ld-spin"></div>
      <div class="ld-pct" id="ringPct">0%</div>
      <div class="ld-bar"><div class="ld-fill" id="llFill"></div></div>
      <div class="ld-lbl" id="ringLbl">Reading your stocks…</div>
    </div>
    <div id="c0" style="display:none"></div>
  </div>
  <div class="panel" id="p1">
    <div class="loading" id="l1"><div class="mini-line"></div><div>Click tab to load gold data</div></div>
    <div id="c1" style="display:none"></div>
  </div>
  <div class="panel" id="p2">
    <div class="loading" id="l2"><div class="mini-line"></div><div>Click tab to load dividends</div></div>
    <div id="c2" style="display:none"></div>
  </div>
  <div class="panel" id="p3">
    <div class="loading" id="l3"><div class="mini-line"></div><div>Waiting for portfolio data…</div></div>
    <div id="c3" style="display:none"></div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────
var _stocks=[], _live={}, _liveQ=[], _liveTotal=0, _liveDone=0;
var _goldLoaded=false, _goldLoading=false, _divLoaded=false, _portChart=null, _goldChart=null;
var _screenerAll=[];
var _goldPh=[], _goldPrice24K=0, _goldPurity='24K'; // purity switcher state

// ── Helpers ────────────────────────────────────────────────────────
function fr(n,d){return n===null||n===undefined||n===''?'—':Number(n).toLocaleString('en-IN',{minimumFractionDigits:d===undefined?2:d,maximumFractionDigits:d===undefined?2:d});}
function fs(n){var v=Number(n);if(!v&&v!==0)return '—';if(Math.abs(v)>=1e9)return '₨\u202f'+(v/1e9).toFixed(2)+'B';if(Math.abs(v)>=1e6)return '₨\u202f'+(v/1e6).toFixed(2)+'M';if(Math.abs(v)>=1e3)return '₨\u202f'+(v/1e3).toFixed(1)+'K';return '₨\u202f'+v.toFixed(2);}
function fp(n){if(n===null||n===undefined)return '—';var v=Number(n);return (v>=0?'+':'')+v.toFixed(2)+'%';}
function fc(n){var v=Number(n);return v>0?'up':v<0?'dn':'fl';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function kpi(icon,lbl,val,sub,delta,type){
  return '<div class="kpi '+type+' fade-in">'+
    '<div class="kpi-glow"></div>'+
    '<span class="kpi-icon">'+icon+'</span>'+
    '<div class="kpi-lbl">'+lbl+'</div>'+
    '<div class="kpi-val">'+val+'</div>'+
    (sub?'<div class="kpi-sub">'+sub+'</div>':'')+
    (delta?'<span class="kpi-delta '+(delta.startsWith('+')?'du':delta.startsWith('-')?'dd':'df')+'">'+delta+'</span>':'')+
    '</div>';
}
function secHdr(txt,cnt,color){
  return '<div class="sec-hdr">'+
    '<div class="sec-line" style="background:'+(color||'var(--blue)')+'"></div>'+
    '<span class="sec-text">'+txt+'</span>'+
    (cnt!==undefined?'<span class="sec-cnt">'+cnt+' items</span>':'')+
    '</div>';
}
function mr(l,v){return '<div class="s-meta-row"><span class="ml">'+l+'</span> '+v+'</div>';}
function insMetric(l,v){return '<span class="ins-metric"><span class="iml">'+l+'</span><span class="imv">'+v+'</span></span>';}

// ── Tabs ───────────────────────────────────────────────────────────
function switchTab(i){
  document.querySelectorAll('.tab').forEach(function(t,j){t.classList.toggle('active',j===i);});
  document.querySelectorAll('.panel').forEach(function(p,j){p.classList.toggle('active',j===i);});
  if(i===1&&!_goldLoaded&&!_goldLoading) loadGoldData();
  if(i===2&&!_divLoaded)  loadDividendCalendar();
  if(i===3&&_liveDone>0)  renderInsights();
}
function tdot(i,s){var d=document.getElementById('td'+i);if(d)d.className='tdot'+(s?' '+s:'');}

// ── Stage 1 ────────────────────────────────────────────────────────
function startLoad(){
  _stocks=[];_live={};_liveQ=[];_liveTotal=0;_liveDone=0;_goldLoaded=false;_divLoaded=false;
  var btn=document.getElementById('refreshBtn');
  btn.disabled=true;
  document.getElementById('l0').style.display='flex';
  document.getElementById('c0').style.display='none';
  /* loadFill removed — progress tracked via llFill bar */
  document.getElementById('updLbl').textContent='Reading sheet…';
  tdot(0,'loading');tdot(3,'loading');
  setRing(0,'Reading your stocks…');

  google.script.run
    .withSuccessHandler(onSheetData)
    .withFailureHandler(function(e){
      document.getElementById('l0').innerHTML='<div class="err-box">'+esc(e.message)+'</div>';
      tdot(0,'err');btn.disabled=false;
    })
    .getCSESheetData();
}

function onSheetData(res){
  _stocks=res.stocks||[];
  renderShell(_stocks);
  setMktStatus();
  if(!_stocks.length){
    tdot(0,'done');tdot(3,'done');
    document.getElementById('refreshBtn').disabled=false;
    /* loadFill removed */
    return;
  }
  _liveTotal=_stocks.length;
  _liveDone=0;
  setRing(0,'Fetching all prices…');
  document.getElementById('updLbl').textContent='Fetching prices…';
  // Fire gold in background immediately (don't wait for tab click)
  if(!_goldLoaded&&!_goldLoading) loadGoldData(true);
  google.script.run
    .withSuccessHandler(onLOLCBatch)
    .withFailureHandler(function(e){
      // Fallback: sequential CSE per-card calls
      document.getElementById('updLbl').textContent='LOLC unavailable, trying CSE…';
      _liveQ=_stocks.map(function(s){return s.symbol;});
      fetchNext();
    })
    .getLOLCScreenerAll();
}

// ── Stage 2: Batch handler (LOLC screener) ─────────────────────────
function onLOLCBatch(screenerRows){
  // Build ticker → row map
  _screenerAll=screenerRows;
  var map={};
  screenerRows.forEach(function(row){ if(row.symbol) map[row.symbol.toUpperCase()]=row; });

  _stocks.forEach(function(s){
    var row=map[s.symbol.toUpperCase()];
    var r=row ? row : {success:false,symbol:s.symbol};
    r.symbol=s.symbol; // keep exact sheet symbol
    _live[s.symbol]=r;
    _liveDone++;
    updateCard(r);
  });

  setRing(100,'All prices loaded');
  document.getElementById('updLbl').textContent='All prices loaded';
  allLiveDone();
}

// ── Stage 2: Fallback sequential (CSE per-card) ────────────────────
function fetchNext(){
  if(!_liveQ.length){allLiveDone();return;}
  var sym=_liveQ.shift();
  google.script.run
    .withSuccessHandler(function(r){_live[r.symbol]=r;_liveDone++;onLive(r);fetchNext();})
    .withFailureHandler(function(){_liveDone++;fetchNext();})
    .getCSELivePrice(sym);
}

function onLive(r){
  updateCard(r);
  var pct=Math.round(_liveDone/_liveTotal*100);
  setRing(pct,'Live prices: '+_liveDone+' / '+_liveTotal);
  document.getElementById('updLbl').textContent='Live: '+_liveDone+'/'+_liveTotal;
}

function setRing(pct,lbl){
  var f=document.getElementById('llFill');
  if(f) f.style.width=pct+'%';
  var p=document.getElementById('ringPct');
  if(p) p.textContent=pct+'%';
  var l=document.getElementById('ringLbl');
  if(l&&lbl) l.textContent=lbl;
}

function allLiveDone(){
  buildTicker();
  updateKPIs();
  renderInsights();
  renderAnalyzeSection();
  tdot(0,'done');tdot(3,'done');
  document.getElementById('refreshBtn').disabled=false;
  /* loadFill removed */
  document.getElementById('updLbl').textContent='Updated '+new Date().toLocaleTimeString();
}

// ── Stage 3: Gold data ─────────────────────────────────────────────
function loadGoldData(background){
  if(_goldLoading||_goldLoaded) return;
  _goldLoading=true;
  tdot(1,'loading');
  var l1=document.getElementById('l1'),c1=document.getElementById('c1');
  if(!background){
    l1.innerHTML='<div class="mini-line"></div><div>Fetching gold prices…</div>';
    l1.style.display='flex';c1.style.display='none';
  }
  google.script.run
    .withSuccessHandler(function(d){
      _goldLoaded=true;_goldLoading=false;
      renderGold(d);
      tdot(1,'done');
    })
    .withFailureHandler(function(e){
      _goldLoading=false;
      if(!background){
        c1.innerHTML='<div class="err-box">Gold data error: '+esc(e.message)+'</div>';
        c1.style.display='block';l1.style.display='none';
      }
      tdot(1,'err');
    })
    .getGoldData();
}

// ── Stage 3: Dividend Calendar ────────────────────────────────────
var _divData=[], _dvRange='all', _dvType='all', _dvSort='pay_desc', _dvYear='', _dvPage=1;
var _dvPageSize=20, _dvCharts=[], _dvMyHoldings=false;

function loadDividendCalendar(){
  tdot(2,'loading');
  var l2=document.getElementById('l2'),c2=document.getElementById('c2');
  l2.innerHTML='<div class="mini-line"></div><div>Loading LOLC dividend calendar…</div>';
  l2.style.display='flex'; c2.style.display='none';
  google.script.run
    .withSuccessHandler(function(csv){
      _divLoaded=true;
      _divData=parseDivCSV(csv);

/* ── CSV parse helpers ── */
function parseDivCSV(csv){
  var lines=csv.split('\n'), rows=[];
  for(var i=1;i<lines.length;i++){
    var ln=lines[i].trim(); if(!ln) continue;
    var c=parseCsvLine(ln); if(c.length<5) continue;
    rows.push({
      ann:c[0].trim(), xd:c[1].trim(), pay:c[2].trim(),
      code:c[3].trim(), dps:parseFloat(c[4])||0,
      type:c[5]?c[5].trim():'', fy:c[6]?c[6].trim():'',
      payDate:parseDMY(c[2].trim()),
      annDate:parseDMY(c[0].trim()),
      xdDate: parseDMY(c[1].trim())
    });
  }
  rows.sort(function(a,b){
    return (b.payDate?b.payDate.getTime():0)-(a.payDate?a.payDate.getTime():0);
  });
  return rows;
}
function parseCsvLine(ln){
  var r=[],cur='',inQ=false;
  for(var i=0;i<ln.length;i++){
    var ch=ln[i];
    if(ch==='"'){inQ=!inQ;continue;}
    if(ch===','&&!inQ){r.push(cur);cur='';continue;}
    cur+=ch;
  }
  r.push(cur); return r;
}
function parseDMY(s){
  if(!s) return null;
  var p=s.split('/'); if(p.length!==3) return null;
  var d=parseInt(p[0]),m=parseInt(p[1])-1,y=parseInt(p[2]);
  return (isNaN(d)||isNaN(m)||isNaN(y))?null:new Date(y,m,d);
}
function fmtDMY(dt){
  if(!dt) return '—';
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function daysAway(dt){
  if(!dt) return null;
  var now=new Date(); now.setHours(0,0,0,0);
  return Math.round((dt.getTime()-now.getTime())/86400000);
}

/* ── Filter / sort helpers ── */
function dvGetFiltered(){
  var now=new Date(); now.setHours(0,0,0,0);
  var srch=((document.getElementById('dvSearch')||{}).value||'').trim().toUpperCase();
  return _divData.filter(function(r){
    if(_dvMyHoldings){
      var held=false;
      for(var si=0;si<_stocks.length;si++){
        if(_stocks[si].symbol.toUpperCase()===r.code.toUpperCase()&&_stocks[si].qty>0){held=true;break;}
      }
      if(!held) return false;
    }
    if(srch&&r.code.toUpperCase().indexOf(srch)<0) return false;
    if(_dvYear){
      if(!r.payDate||r.payDate.getFullYear()!==parseInt(_dvYear)) return false;
    } else {
      var rng=_dvRange;
      if(rng==='upcoming'){var d=daysAway(r.payDate);if(d===null||d<0)return false;}
      else if(rng==='month'){if(!r.payDate||r.payDate.getMonth()!==now.getMonth()||r.payDate.getFullYear()!==now.getFullYear())return false;}
      else if(rng==='3m'){var df=(r.payDate?r.payDate.getTime()-now.getTime():null);if(df===null||df<-90*86400000||df>90*86400000)return false;}
      else if(rng==='6m'){var df2=(r.payDate?r.payDate.getTime()-now.getTime():null);if(df2===null||df2<-180*86400000||df2>180*86400000)return false;}
      else if(rng==='year'){if(!r.payDate||r.payDate.getFullYear()!==now.getFullYear())return false;}
    }
    if(_dvType!=='all'){
      var tl=r.type.toLowerCase();
      if(_dvType==='final'){if(tl.indexOf('final')<0&&tl.indexOf('other')<0)return false;}
      else if(_dvType==='interim'){if(!['first','second','third','fourth','interim'].some(function(w){return tl.indexOf(w)>-1;}))return false;}
      else{if(r.type!==_dvType)return false;}
    }
    return true;
  }).sort(function(a,b){
    if(_dvSort==='pay_asc') return (a.payDate?a.payDate.getTime():0)-(b.payDate?b.payDate.getTime():0);
    if(_dvSort==='pay_desc') return (b.payDate?b.payDate.getTime():0)-(a.payDate?a.payDate.getTime():0);
    if(_dvSort==='dps_desc') return b.dps-a.dps;
    if(_dvSort==='dps_asc')  return a.dps-b.dps;
    if(_dvSort==='code_asc') return a.code.localeCompare(b.code);
    return 0;
  });
}

function updateCard(r){
  var card=document.getElementById('sc_'+r.symbol);

  if(!s)return;

  if(!r.success){
    card.className='scard fl fade-in';

    document.getElementById('meta_'+r.symbol).innerHTML='<div class="s-meta-row" style="color:var(--muted);grid-column:span 2">Price unavailable</div>';
    return;
  }

  var price=r.currentPrice||s.sheetPrice;
  // Colour card by P&L vs bought price (more useful than day change)
  var cc=s.boughtPrice>0?(price>=s.boughtPrice?'up':'dn'):'fl';
  card.className='scard '+cc+' fade-in';
  card.querySelector('.scard-sym').innerHTML=esc(r.symbol)+'<span class="live-tag live">live</span>';
  card.querySelector('.scard-name').textContent=r.companyName||s.name||'—';

  // Price row — show sector tag if available
  var pr=card.querySelector('.price-row');
  var sectorTag=r.sector?'<span style="font-size:.65em;color:var(--muted);margin-left:8px;font-weight:400;">'+esc(r.sector)+'</span>':'';
  pr.innerHTML='<span class="s-price">₨ '+price.toFixed(2)+'</span>'+sectorTag;

  // Meta grid — LOLC fields
  var mh='';
  if(r.pe>0)     mh+=mr('P/E',r.pe.toFixed(1)+(r.sectorPe>0?' <span style="color:var(--muted);font-size:.85em">(Sec '+r.sectorPe.toFixed(1)+')</span>':''));
  if(r.pbv>0)    mh+=mr('PBV',r.pbv.toFixed(2)+(r.sectorPbv>0?' <span style="color:var(--muted);font-size:.85em">('+r.sectorPbv.toFixed(2)+')</span>':''));
  if(r.eps>0)    mh+=mr('EPS','₨ '+r.eps.toFixed(2));
  if(r.nav>0)    mh+=mr('NAV','₨ '+r.nav.toFixed(2));
  if(r.roe>0)    mh+=mr('ROE',r.roe.toFixed(1)+'%');
  if(r.dps>0)    mh+=mr('DPS','₨ '+r.dps.toFixed(2));
  if(r.dy>0)     mh+=mr('DY',r.dy.toFixed(2)+'%');
  if(r.marketCap>0) mh+=mr('MCap','₨'+r.marketCap.toLocaleString('en-IN')+'Mn');
  if(r.foreignHolding>0) mh+=mr('Foreign',r.foreignHolding.toFixed(1)+'%');
  if(!mh) mh='<div class="s-meta-row" style="color:var(--muted);grid-column:span 2">No data from screener</div>';
  document.getElementById('meta_'+r.symbol).innerHTML=mh;

  // P&L
  var pe=document.getElementById('pnl_'+r.symbol);
  var pb=document.getElementById('pnlb_'+r.symbol);
  if(pe&&s.boughtPrice>0&&s.qty>0){
    var pnl=(price-s.boughtPrice)*s.qty;
    var pp=((price-s.boughtPrice)/s.boughtPrice)*100;
    var pc=pnl>=0?'up':'dn';
    pe.className='pnl-num '+pc;
    pe.textContent=fs(pnl)+' ('+fp(pp)+')';
    if(pb){pb.className='pnl-bar '+pc;pb.style.width=Math.min(Math.abs(pp)*2,100)+'%';}
  }

  // Raw toggle
  if(r.allFields&&!card.querySelector('.raw-tog')){
    var anchor=card.querySelector('.no-pnl')||card.querySelector('.pnl-section');
    if(anchor){
      var t=document.createElement('span');t.className='raw-tog';
      t.textContent='▶ raw API data';t.onclick=function(){toggleRaw(this);};
      var b=document.createElement('div');b.className='raw-box';
      b.textContent=JSON.stringify(r.allFields,null,2);
      anchor.parentNode.insertBefore(t,anchor.nextSibling);
      t.parentNode.insertBefore(b,t.nextSibling);
    }
  }
}

  }).join('');
  document.getElementById('tickerTrack').innerHTML=html+html;

}

var GOLD_PURITY={

  '22K':  { factor:22/24,            label:'22K / gram',    unit:'per gram',   grams:1  },

function renderGold(d){

  var lastEntry=(d.history&&d.history.length)?d.history[d.history.length-1]:{};

  var html='';

  // ── Purity Switcher + Price Card ──────────────────────────────────
  if(price>0||ph.length>0){

    var chg6m=0, first24=0, last24=0;

    if(ph.length>=2){
      var prevLkr=ph[ph.length-2].lkr*selInfo.factor;
      var diff=selPrice-prevLkr;
      var pct=prevLkr>0?(diff/prevLkr*100):0;
      var sign=diff>=0?'+':'';
      wkDelta=sign+'₨\u202f'+fr(Math.abs(diff),0)+' ('+sign+fr(pct,2)+'%)';

      '<div class="gp-label" id="gold-purity-label">'+selInfo.label+'</div>'+
      '<div class="gp-val" id="gold-purity-val">'+(selPrice>0?'₨\u202f'+fr(selPrice,0):'—')+'</div>'+
      '<div class="gp-delta '+(wkDelta&&diff>=0?'up-text':'dn-text')+'" id="gold-purity-delta">'+
        (wkDelta||'')+'</div>'+
    '</div>';

    // Sub-row: all three purities at a glance
    html+='<div class="gprice-sub-row">';
    ['24K','22K','8g'].forEach(function(k){
      var info=GOLD_PURITY[k];
      var p=price*info.factor;
      var active=(_goldPurity===k)?'border-color:rgba(255,215,0,.45);':'';
      html+='<div class="gprice-sub-cell" style="'+active+'" onclick="switchGoldPurity(\''+k+'\')">'+
        '<div class="gsc-label">'+(k==='8g'?'8g Pawn':k)+'</div>'+
        '<div class="gsc-val">'+(p>0?'₨\u202f'+fr(p,0):'—')+'</div>'+
      '</div>';
    });
    html+='</div>';

    // Chart

      '<div class="g-dot" style="background:var(--gold)"></div>'+
      '<span class="g-title" id="gold-chart-title">Gold Price — LKR/'+selInfo.unit+' (6 months)</span>'+

      kpi('💱','USD / LKR','₨ '+fr(lkrRate,2),'Exchange rate','','blue')+

  // ── My Gold Investment Insights ──
  if(lastInvested>0){

    var chg6m=ph.length>=2?((ph[ph.length-1].lkr-ph[0].lkr)/ph[0].lkr*100):0;

    html+='<div class="glass fade-in" style="margin-bottom:14px;">';
    html+='<div class="g-hdr"><div class="g-dot" style="background:var(--gold)"></div>'+
          '<span class="g-title">My Gold Investment</span></div>';

    // KPI row
    html+='<div class="kpi-row" style="margin-bottom:12px;">';

    html+=kpi(lastEarnings>=0?'📈':'📉','Earnings',fs(lastEarnings),'Profit / loss',(roi>=0?'+':'')+roi.toFixed(2)+'%',lastEarnings>=0?'green':'red');

    // Insights

      insHtml+=goldInsCard('✅','Healthy Gain — Hold',
        'Up <strong>'+roi.toFixed(1)+'%</strong> — solid return. Gold is performing well for you.',
        'hold','Hold your position. Gold works best as a long-term hedge. Only sell if you have a specific financial need.');

      insHtml+=goldInsCard('⚖️','Near Break-Even',
        'ROI is <strong>'+roi.toFixed(1)+'%</strong> — essentially flat. Could be a holding period or recent purchase.',
        'hold','Patience — gold moves in long cycles. If you bought recently, hold. If you have been holding a long time, review whether gold still fits your portfolio strategy.');
    } else if(roi<0&&roi>=-10){
      insHtml+=goldInsCard('📉','Small Loss — Monitor',
        'Down <strong>'+Math.abs(roi).toFixed(1)+'%</strong>. Not critical, but worth watching.',
        'watch','Gold downturns can be good accumulation opportunities if you have a long-term view. Do not panic-sell physical gold on short-term dips.');
    } else if(roi<-10){
      insHtml+=goldInsCard('🚨','Significant Loss — Review',
        'Down <strong>'+Math.abs(roi).toFixed(1)+'%</strong> ('+fs(lastEarnings)+'). Review your entry timing and thesis.',
        'watch','Consider whether the loss is due to LKR/USD movement or actual gold price decline. If macro factors are temporary, holding is usually the right call for gold.');
    }

    // Gold price trend vs your ROI
    if(chg6m!==0){
      if(chg6m>0&&roi>=chg6m){
        insHtml+=goldInsCard('🎯','Beating the Market',
          'Gold price is up <strong>'+chg6m.toFixed(1)+'%</strong> in 6 months, and your portfolio ROI is <strong>'+roi.toFixed(1)+'%</strong> — you are outperforming.',
          'hold','Your investment timing has been good. Continue to hold and let the appreciation compound.');
      } else if(chg6m>0&&roi<chg6m){
        insHtml+=goldInsCard('📊','Gold Trending Up',
          'Gold price has risen <strong>'+chg6m.toFixed(1)+'%</strong> over 6 months. Current uptrend favours holding.',
          'hold','Gold is in a positive trend. If you can add more at current prices, you are entering in an uptrend — be mindful of your cost average.');
      } else if(chg6m<-5){
        insHtml+=goldInsCard('💡','Gold in Correction — Accumulate?',
          'Gold price is down <strong>'+Math.abs(chg6m).toFixed(1)+'%</strong> over 6 months. Corrections are normal.',
          'buy','Historically, gold corrections are buying opportunities for long-term investors. If you have spare capital, this may be a good time to add to your position at lower prices.');
      }
    }

    // SL rupee context
    if(price>0&&lastInvested>0){
      var estGrams=lastInvested/price;
      if(estGrams>0){
        insHtml+=goldInsCard('🔢','Estimated Holdings',
          'At current price of ₨ '+fr(price,0)+'/g, your investment of '+fs(lastInvested)+' represents approximately <strong>'+estGrams.toFixed(2)+' grams</strong> of gold.',
          'info','This is an estimate based on your current investment value vs today\'s price. Actual grams depend on when you purchased.');
      }
    }

    if(insHtml) html+='<div style="display:flex;flex-direction:column;gap:8px;">'+insHtml+'</div>';
    html+='</div>';
  }

  c.innerHTML=html;

  // Draw chart for currently selected purity
  if(ph.length>0) setTimeout(function(){ _drawGoldChart(_goldPurity); }, 80);
}

// ── Gold purity switcher ───────────────────────────────────────────
function switchGoldPurity(k){
  if(!GOLD_PURITY[k]) return;
  _goldPurity=k;
  var info=GOLD_PURITY[k];
  var price=_goldPrice24K;
  var ph=_goldPh;

  // Update active tab styling
  document.querySelectorAll('.gpurity-tab').forEach(function(el,i){
    var keys=['24K','22K','8g'];
    el.classList.toggle('active', keys[i]===k);
  });
  // Update sub-row cells
  document.querySelectorAll('.gprice-sub-cell').forEach(function(el,i){
    var keys=['24K','22K','8g'];
    el.style.borderColor=keys[i]===k?'rgba(255,215,0,.45)':'';
  });

  // Update big price
  var selPrice=price*info.factor;
  var valEl=document.getElementById('gold-purity-val');
  var lblEl=document.getElementById('gold-purity-label');
  var dltEl=document.getElementById('gold-purity-delta');
  var ttlEl=document.getElementById('gold-chart-title');
  if(valEl) valEl.textContent=selPrice>0?'₨\u202f'+fr(selPrice,0):'—';
  if(lblEl) lblEl.textContent=info.label;
  if(ttlEl) ttlEl.textContent='Gold Price — LKR/'+info.unit+' (6 months)';

  // Week delta
  if(dltEl){
    if(ph.length>=2){
      var prevLkr=ph[ph.length-2].lkr*info.factor;
      var diff=selPrice-prevLkr;
      var pct=prevLkr>0?(diff/prevLkr*100):0;
      var sign=diff>=0?'+':'';
      dltEl.textContent=sign+'₨\u202f'+fr(Math.abs(diff),0)+' ('+sign+fr(pct,2)+'%)';
      dltEl.className='gp-delta '+(diff>=0?'up-text':'dn-text');
    } else { dltEl.textContent=''; }
  }

  // Redraw chart
  _drawGoldChart(k);
}

function _drawGoldChart(k){
  var info=GOLD_PURITY[k]||GOLD_PURITY['24K'];
  var ph=_goldPh;
  if(!ph||!ph.length) return;
  var ctx=document.getElementById('goldChart');
  if(!ctx) return;
  if(_goldChart) _goldChart.destroy();

  var labels  = ph.map(function(p){ return p.label; });
  var data    = ph.map(function(p){ return Math.round(p.lkr * info.factor); });
  var unitStr = info.unit;

  var canvas=ctx.getContext('2d');
  var grad=canvas.createLinearGradient(0,0,0,220);
  grad.addColorStop(0,'rgba(255,215,0,.28)');
  grad.addColorStop(1,'rgba(255,215,0,0)');

  _goldChart=new Chart(ctx,{
    type:'line',
    data:{
      labels:labels,
      datasets:[{
        label:'LKR / '+unitStr,
        data:data,
        borderColor:'rgba(255,215,0,.9)',
        backgroundColor:grad,
        borderWidth:2,
        pointRadius:3,
        pointBackgroundColor:'rgba(255,215,0,.9)',
        fill:true,
        tension:.35
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{callbacks:{
          label:function(c){
            return '₨\u202f'+Number(c.raw).toLocaleString('en-IN')+' / '+unitStr;
          }
        }}
      },
      scales:{
        x:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9,family:'Inter'},maxRotation:45},
           grid:{color:'rgba(255,255,255,.04)'}},
        y:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9,family:'Inter'},
                  callback:function(v){return v>=1000?(v/1000).toFixed(0)+'K':v;}},
           grid:{color:'rgba(255,255,255,.04)'}}
      }
    }
  });
}

function dvApply(){
  var filtered=dvGetFiltered();
  var total=filtered.length;
  var totalPages=Math.max(1,Math.ceil(total/_dvPageSize));
  if(_dvPage>totalPages) _dvPage=totalPages;
  var start=(_dvPage-1)*_dvPageSize;
  var shown=filtered.slice(start, start+_dvPageSize);

  var cntEl=document.getElementById('dvCount');
  if(cntEl) cntEl.textContent=total.toLocaleString('en-IN')+' record'+(total!==1?'s':'');

  var sortHdr=function(col,label){
    var cls='';
    if(_dvSort.startsWith(col)) cls=_dvSort.endsWith('_desc')?' srt-desc':' srt-asc';
    return '<th class="'+cls.trim()+'" onclick="dvColSort(\''+col+'\')">'+label+'</th>';
  };

  // Build holdings map: symbol(upper) → qty
  var heldMap={};
  _stocks.forEach(function(s){if(s.qty>0) heldMap[s.symbol.toUpperCase()]=s.qty;});

  var html='<div class="dv-tbl-wrap"><table class="dv-tbl"><thead><tr>'+
    sortHdr('pay','📅 Pay Date')+
    sortHdr('code','📌 Code')+
    sortHdr('dps','💰 DPS')+
    '<th>💎 Div. Profit</th>'+
    '<th>🏷 Type</th>'+
    '<th>📆 FY</th>'+
    '<th>📣 Ann. Date</th>'+
    '<th>🔄 XD Date</th>'+
    '</tr></thead><tbody>';

  if(!shown.length){
    html+='<tr><td colspan="8" class="dv-no-data">No records match your filters</td></tr>';
  } else {
    shown.forEach(function(r){
      var days=daysAway(r.payDate);
      var isUp=days!==null&&days>=0&&days<=7;
      var soonTag='';
      if(days!==null&&days>=0&&days<=60) soonTag='<span class="dv-soon">'+(days===0?'Today!':days===1?'Tomorrow':days+'d')+'</span>';
      var tl=r.type.toLowerCase();
      var bCls=tl.indexOf('final')>-1||tl.indexOf('other')>-1?'final':
               ['first','second','third','fourth','interim'].some(function(w){return tl.indexOf(w)>-1;})?'interim':'other';
      var codeUp=r.code.toUpperCase();
      var qty=heldMap[codeUp]||0;
      var isHeld=qty>0;
      var rowCls='';
      if(isHeld&&isUp) rowCls='holding upcoming';
      else if(isHeld) rowCls='holding';
      else if(isUp) rowCls='upcoming';
      var holdingTag=isHeld?'<span class="dv-holding-tag">🏦 '+qty+'</span>':'';
      var profitCell=isHeld?'<td class="dv-profit">₨\u202f'+(qty*r.dps).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+'</td>':'<td style="color:var(--muted)">—</td>';
      html+='<tr'+(rowCls?' class="'+rowCls+'"':'')+'>'+
        '<td class="dv-date">'+fmtDMY(r.payDate)+soonTag+'</td>'+
        '<td class="dv-code" onclick="dvOpenChart(\''+esc(r.code)+'\')" title="📈 View chart for '+esc(r.code)+'">'+esc(r.code)+holdingTag+'</td>'+
        '<td class="dv-dps">₨\u202f'+r.dps.toFixed(2)+'</td>'+
        profitCell+
        '<td><span class="dv-badge '+bCls+'">'+esc(r.type||'—')+'</span></td>'+
        '<td style="color:var(--muted)">'+esc(r.fy)+'</td>'+
        '<td class="dv-date-sub">'+fmtDMY(r.annDate)+'</td>'+
        '<td class="dv-date-sub">'+fmtDMY(r.xdDate)+'</td>'+
        '</tr>';
    });
  }
  html+='</tbody></table></div>';

  // Pagination controls
  if(totalPages>1){
    html+='<div class="dv-pagination">';
    html+='<button class="dv-pg-btn" onclick="dvGoPage('+(_dvPage-1)+')" '+(_dvPage===1?'disabled':'')+'>‹ Prev</button>';
    // Smart page window: show up to 7 page buttons
    var winStart=Math.max(1,_dvPage-3), winEnd=Math.min(totalPages,winStart+6);
    winStart=Math.max(1,winEnd-6);
    if(winStart>1){ html+='<button class="dv-pg-btn" onclick="dvGoPage(1)">1</button>'; if(winStart>2) html+='<span class="dv-pg-info">…</span>'; }
    for(var p=winStart;p<=winEnd;p++){
      html+='<button class="dv-pg-btn'+(_dvPage===p?' active':'')+'" onclick="dvGoPage('+p+')">'+p+'</button>';
    }
    if(winEnd<totalPages){ if(winEnd<totalPages-1) html+='<span class="dv-pg-info">…</span>'; html+='<button class="dv-pg-btn" onclick="dvGoPage('+totalPages+')">'+totalPages+'</button>'; }
    html+='<button class="dv-pg-btn" onclick="dvGoPage('+(_dvPage+1)+')" '+(_dvPage===totalPages?'disabled':'')+'>Next ›</button>';
    html+='<span class="dv-pg-info">Page '+_dvPage+' / '+totalPages+' &nbsp;('+total+' total)</span>';
    html+='</div>';
  }

  var wrap=document.getElementById('dvTableWrap');
  if(wrap) wrap.innerHTML=html;
}

function dvBuildCharts(){
  _dvCharts.forEach(function(c){try{c.destroy();}catch(e){}});
  _dvCharts=[];
  var now=new Date(), yr=now.getFullYear();
  var TIP={backgroundColor:'rgba(5,8,15,.95)',borderColor:'rgba(255,255,255,.1)',borderWidth:1,titleColor:'#fff',bodyColor:'rgba(255,255,255,.7)',padding:10};
  var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Chart 1: This-year monthly distribution (count + sum DPS)
  var mCnt=new Array(12).fill(0), mDps=new Array(12).fill(0);
  _divData.forEach(function(r){
    if(!r.payDate||r.payDate.getFullYear()!==yr) return;
    mCnt[r.payDate.getMonth()]++;
    mDps[r.payDate.getMonth()]+=r.dps;
  });

  // Chart 2: Top 15 stocks by total historical DPS
  var codeMap={};
  _divData.forEach(function(r){ codeMap[r.code]=(codeMap[r.code]||0)+r.dps; });
  var top15=Object.keys(codeMap).map(function(k){return{code:k,tot:codeMap[k]};})
    .sort(function(a,b){return b.tot-a.tot;}).slice(0,15);

  var COLS=['#00d4ff','#a855f7','#00ff88','#ffd700','#ff6b35','#ff4d8d','#38bdf8','#34d399'];

  var cHtml=
    '<div class="dv-chart-box">'+
      '<div class="dv-chart-lbl">📊 '+yr+' — Dividends by Month (Bars = count, Line = total DPS)</div>'+
      '<div style="position:relative;height:195px"><canvas id="dvMonthChart"></canvas></div>'+
    '</div>'+
    '<div class="dv-chart-box">'+
      '<div class="dv-chart-lbl">🏆 Top 15 Stocks · Cumulative DPS (All-time)</div>'+
      '<div style="position:relative;height:195px"><canvas id="dvTopChart"></canvas></div>'+
    '</div>';
  var cw=document.getElementById('dvChartsWrap');
  if(cw) cw.innerHTML=cHtml;

  var mc=document.getElementById('dvMonthChart');
  if(mc) _dvCharts.push(new Chart(mc,{
    type:'bar',
    data:{labels:MN,datasets:[
      {label:'# Dividends',data:mCnt,backgroundColor:'rgba(0,212,255,.22)',borderColor:'#00d4ff',borderWidth:1.5,borderRadius:4,yAxisID:'y'},
      {label:'Σ DPS (₨)',data:mDps.map(function(v){return Math.round(v*100)/100;}),
       type:'line',borderColor:'#ffd700',backgroundColor:'rgba(255,215,0,.1)',
       borderWidth:2,tension:0.4,fill:true,pointRadius:4,pointBackgroundColor:'#ffd700',yAxisID:'y2'}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{
        y:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9},stepSize:1},grid:{color:'rgba(255,255,255,.04)'},position:'left',title:{display:true,text:'Count',color:'rgba(0,212,255,.6)',font:{size:8}}},
        y2:{ticks:{color:'rgba(255,215,0,.5)',font:{size:9},callback:function(v){return '₨'+v.toFixed(0);}},grid:{display:false},position:'right',title:{display:true,text:'Σ DPS',color:'rgba(255,215,0,.6)',font:{size:8}}}
      },
      plugins:{legend:{labels:{color:'rgba(255,255,255,.5)',font:{size:9},boxWidth:10}},tooltip:{...TIP}}}}));

  var tc=document.getElementById('dvTopChart');
  if(tc) _dvCharts.push(new Chart(tc,{
    type:'bar',
    data:{
      labels:top15.map(function(r){return r.code.split('.')[0];}),
      datasets:[{label:'Total DPS (₨)',
        data:top15.map(function(r){return Math.round(r.tot*100)/100;}),
        backgroundColor:top15.map(function(_,i){return COLS[i%COLS.length]+'44';}),
        borderColor:top15.map(function(_,i){return COLS[i%COLS.length];}),
        borderWidth:1.5,borderRadius:4}]
    },
    options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
      scales:{
        x:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9},callback:function(v){return '₨'+v;}},grid:{color:'rgba(255,255,255,.04)'}},
        y:{ticks:{color:'rgba(255,255,255,.65)',font:{size:8,weight:'700'}},grid:{display:false}}
      },
      plugins:{legend:{display:false},tooltip:{...TIP,callbacks:{label:function(ctx){return ' Σ DPS: ₨'+ctx.parsed.x.toFixed(2);}}}}}}));
}

function glassKpi(lbl,val,color){
  return '<div class="glass" style="flex:1;min-width:140px;padding:12px 16px;text-align:center">'+
    '<div style="font-size:.55em;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px">'+lbl+'</div>'+
    '<div style="font-size:1.3em;font-weight:800;color:'+color+'">'+val+'</div></div>';
}
function goldInsCard(ico,title,desc,type,action){
  var borders={sell:'rgba(255,77,141,.25)',watch:'rgba(255,215,0,.25)',hold:'rgba(0,255,136,.25)',buy:'rgba(0,212,255,.25)',info:'rgba(168,85,247,.25)'};
  var accents={sell:'rgba(255,77,141,1)',watch:'rgba(255,215,0,1)',hold:'rgba(0,255,136,1)',buy:'rgba(0,212,255,1)',info:'rgba(168,85,247,1)'};
  var bgs={sell:'rgba(255,77,141,.06)',watch:'rgba(255,215,0,.06)',hold:'rgba(0,255,136,.06)',buy:'rgba(0,212,255,.06)',info:'rgba(168,85,247,.06)'};
  var bdr=borders[type]||borders.buy, acc=accents[type]||accents.buy, bg=bgs[type]||bgs.buy;
  return '<div style="background:'+bg+';border:1px solid '+bdr+';border-left:3px solid '+acc+';border-radius:10px;padding:12px 14px;">'+
    '<div style="display:flex;align-items:flex-start;gap:10px;">'+
      '<div style="font-size:16px;flex-shrink:0;margin-top:1px;">'+ico+'</div>'+
      '<div>'+
        '<div style="font-size:11px;font-weight:700;color:#fff;margin-bottom:4px;">'+title+'</div>'+
        '<div style="font-size:10.5px;color:var(--muted);line-height:1.5;margin-bottom:6px;">'+desc+'</div>'+
        '<div style="font-size:10px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:6px;padding:6px 9px;color:rgba(255,255,255,.7);">'+
          '💬 <strong>What to do:</strong> '+action+'</div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

// ── Insights ───────────────────────────────────────────────────────
function renderInsights(){
  var l=document.getElementById('l3'),c=document.getElementById('c3');
  l.style.display='none';c.style.display='block';

  var ins=[];

  _stocks.forEach(function(s){
    var r=_live[s.symbol];
    var price=(r&&r.success&&r.currentPrice)?r.currentPrice:s.sheetPrice;
    if(!price||!s.symbol)return;
    var pct=r&&r.success?Number(r.changePct||0):null;
    var hasPnl=s.boughtPrice>0&&s.qty>0;
    var pnlPct=hasPnl?((price-s.boughtPrice)/s.boughtPrice)*100:null;
    var pnlAmt=hasPnl?(price-s.boughtPrice)*s.qty:null;
    var co=(r&&r.companyName)||s.name||s.symbol;

    // ── Today's price movement ──
    if(pct!==null){
      if(pct>=8){
        ins.push({sym:s.symbol,co:co,t:'sell',urgency:'high',ico:'🎯',
          title:'Exceptional Single-Day Rally',
          desc:'Up '+pct.toFixed(1)+'% today — a rare move of this magnitude. Often signals an overextension short-term.',
          metrics:[['Today',fp(pct)],['Price','₨'+price.toFixed(2)]].concat(hasPnl?[['Your P&L',fs(pnlAmt)]]:[] ),
          action:'Consider trimming 25-50% of position to lock in gains. Set a stop-loss at today\'s open to protect downside if you hold.'});
      } else if(pct>=4){
        ins.push({sym:s.symbol,co:co,t:'watch',urgency:'medium',ico:'📈',
          title:'Strong Positive Session',
          desc:'Up '+pct.toFixed(1)+'% today with solid momentum.',
          metrics:[['Today',fp(pct)],['Price','₨'+price.toFixed(2)]],
          action:'Hold and monitor volume. A second consecutive up day with high volume confirms momentum. Watch for resistance levels.'});
      } else if(pct<=-8){
        ins.push({sym:s.symbol,co:co,t:'watch',urgency:'high',ico:'🚨',
          title:'Sharp Single-Day Decline',
          desc:'Down '+Math.abs(pct).toFixed(1)+'% today. Likely triggered by a specific announcement or sector sell-off.',
          metrics:[['Today',fp(pct)],['Price','₨'+price.toFixed(2)]].concat(r&&r.volume?[['Volume',r.volume>1000?(r.volume/1000).toFixed(0)+'K':''+r.volume]]:[] ),
          action:'Do NOT average down until you verify the cause. Check CSE announcements for this company immediately. Protect capital first.'});
      } else if(pct<=-4){
        ins.push({sym:s.symbol,co:co,t:'watch',urgency:'medium',ico:'⚠️',
          title:'Notable Decline Today',
          desc:'Down '+Math.abs(pct).toFixed(1)+'% — monitor for continuation.',
          metrics:[['Today',fp(pct)],['Price','₨'+price.toFixed(2)]],
          action:'Wait for the session to close before deciding. A daily close near the low is more bearish than a mid-day dip.'});
      }
    }

    // ── P&L signals ──
    if(hasPnl&&pnlPct!==null){
      if(pnlPct>=40){
        ins.push({sym:s.symbol,co:co,t:'sell',urgency:'high',ico:'💰',
          title:'Exceptional Profit — Strong Exit Case',
          desc:'You are up '+pnlPct.toFixed(1)+'% from your buy price. At this level, concentration risk grows and volatility impact is amplified.',
          metrics:[['P&L%',fp(pnlPct)],['P&L',fs(pnlAmt)],['Bought','₨'+s.boughtPrice.toFixed(2)],['Now','₨'+price.toFixed(2)]],
          action:'Consider exiting 30-50% and redeploying capital. A trailing stop-loss on the remainder protects your gains while allowing upside.'});
      } else if(pnlPct>=20){
        ins.push({sym:s.symbol,co:co,t:'sell',urgency:'medium',ico:'🏆',
          title:'Strong Profit — Consider Partial Exit',
          desc:'Up '+pnlPct.toFixed(1)+'% ('+fs(pnlAmt)+'). This is a solid return. Risk/reward starts shifting at these levels.',
          metrics:[['P&L%',fp(pnlPct)],['P&L',fs(pnlAmt)],['Invested',fs(s.boughtPrice*s.qty)]],
          action:'Take 20-30% off the table if you have no near-term catalyst in mind. Keep the rest with a stop-loss at cost basis.'});
      } else if(pnlPct>=8){
        ins.push({sym:s.symbol,co:co,t:'hold',urgency:'low',ico:'✅',
          title:'Healthy Gain — Hold Position',
          desc:'Up '+pnlPct.toFixed(1)+'% — you\'re ahead. This is the zone to hold with a plan.',
          metrics:[['P&L%',fp(pnlPct)],['P&L',fs(pnlAmt)]],
          action:'Set a mental stop-loss at breakeven. Let this run unless a fundamental deterioration occurs.'});
      } else if(pnlPct<=-25){
        ins.push({sym:s.symbol,co:co,t:'watch',urgency:'high',ico:'🔴',
          title:'Significant Loss — Urgent Review',
          desc:'Down '+Math.abs(pnlPct).toFixed(1)+'% ('+fs(pnlAmt)+'). This is a meaningful drawdown requiring active attention.',
          metrics:[['P&L%',fp(pnlPct)],['P&L',fs(pnlAmt)],['Bought','₨'+s.boughtPrice.toFixed(2)],['Now','₨'+price.toFixed(2)]],
          action:'Ask yourself: have the fundamentals changed? If yes, cut losses. If no, consider averaging down only with a clear thesis and defined maximum loss.'});
      } else if(pnlPct<=-10){
        ins.push({sym:s.symbol,co:co,t:'watch',urgency:'medium',ico:'📉',
          title:'Moderate Loss — Monitor',
          desc:'Down '+Math.abs(pnlPct).toFixed(1)+'% from cost ('+fs(pnlAmt)+'). Not yet critical but needs monitoring.',
          metrics:[['P&L%',fp(pnlPct)],['P&L',fs(pnlAmt)]],
          action:'Define your maximum acceptable loss for this position. If you don\'t have a stop-loss level set, set one now.'});
      } else if(Math.abs(pnlPct)<=3){
        ins.push({sym:s.symbol,co:co,t:'hold',urgency:'low',ico:'⚖️',
          title:'Near Break-Even',
          desc:'Within ±3% of your cost. The position is flat — neither in clear profit nor significant loss.',
          metrics:[['P&L%',fp(pnlPct)],['Bought','₨'+s.boughtPrice.toFixed(2)],['Now','₨'+price.toFixed(2)]],
          action:'Wait for a catalyst before adding more. This is a "patience" situation — hold unless the thesis has changed.'});
      }
    }

    // ── 52-week range ──
    if(r&&r.success&&r.yearHigh&&r.yearLow&&price){
      var range=r.yearHigh-r.yearLow||1;
      var pos=(price-r.yearLow)/range*100;
      if(pos<8){
        ins.push({sym:s.symbol,co:co,t:'buy',urgency:'medium',ico:'🔍',
          title:'Near 52-Week Low — Potential Value Zone',
          desc:'Price is within '+pos.toFixed(0)+'% of its yearly low. This can indicate value — or a fundamentally troubled company.',
          metrics:[['Price','₨'+price.toFixed(2)],['52W Low','₨'+r.yearLow.toFixed(2)],['52W High','₨'+r.yearHigh.toFixed(2)],['Pos',pos.toFixed(0)+'%']],
          action:'Investigate why it\'s near the low. If earnings are stable and it\'s macro/sector pressure, this could be a good entry. If company-specific, wait for clarity.'});
      } else if(pos>92){
        ins.push({sym:s.symbol,co:co,t:'watch',urgency:'low',ico:'🏔️',
          title:'Near 52-Week High',
          desc:'Trading at '+pos.toFixed(0)+'% of its 52-week range, close to the peak at ₨'+r.yearHigh.toFixed(2)+'.',
          metrics:[['Price','₨'+price.toFixed(2)],['52W High','₨'+r.yearHigh.toFixed(2)],['Range%',pos.toFixed(0)+'%']],
          action:'A breakout above the 52W high on high volume is a bullish signal. Failure to break out suggests resistance. Watch volume closely.'});
      }
    }

    // ── Fundamentals ──
    if(r&&r.success){
      if(r.dividendYield>6){
        ins.push({sym:s.symbol,co:co,t:'hold',urgency:'low',ico:'🏦',
          title:'High Dividend Yield',
          desc:'Yield of '+r.dividendYield.toFixed(2)+'% — significantly above typical CSE market yield. Attractive passive income.',
          metrics:[['Yield',r.dividendYield.toFixed(2)+'%'],['Price','₨'+price.toFixed(2)]],
          action:'Verify the payout ratio (dividends/earnings). High yield is only good if it\'s sustainable. A yield above 10% may signal a falling price, not genuine income.'});
      }
      if(r.pe>0&&r.pe<8){
        ins.push({sym:s.symbol,co:co,t:'buy',urgency:'low',ico:'💎',
          title:'Low P/E — Value Signal',
          desc:'P/E of '+r.pe.toFixed(1)+' is well below typical market valuations. May indicate undervaluation.',
          metrics:[['P/E',r.pe.toFixed(1)],['Price','₨'+price.toFixed(2)]].concat(r.eps?[['EPS',r.eps.toFixed(2)]]:[] ),
          action:'A low P/E is only valuable if earnings are stable. Check if this is a genuine undervaluation or a value trap (declining earnings). Compare to industry peers.'});
      } else if(r.pe>40){
        ins.push({sym:s.symbol,co:co,t:'info',urgency:'low',ico:'📊',
          title:'High P/E — Growth Premium',
          desc:'P/E of '+r.pe.toFixed(1)+' implies the market expects significant future earnings growth.',
          metrics:[['P/E',r.pe.toFixed(1)],['Price','₨'+price.toFixed(2)]],
          action:'High P/E stocks are very sensitive to earnings disappointments. Any guidance cut could trigger a sharp correction. Monitor quarterly results closely.'});
      }
    }
  });

  if(!ins.length){
    c.innerHTML='<div class="empty"><div class="empty-ico">💡</div>'+
      (_stocks.length&&!Object.keys(_live).length?
       'Waiting for live prices to complete…':
       'No active signals at this time.<br>All positions appear stable.<br><br><span style="color:var(--blue)">Add bought price (col C) + qty (col D) in UT_CRYPTO for P&L signals.</span>')+
      '</div>';
    return;
  }

  // Summary counts
  var counts={sell:0,watch:0,hold:0,buy:0,info:0};
  ins.forEach(function(i){counts[i.t]=(counts[i.t]||0)+1;});
  var total=ins.length;

  var html='<div class="ins-summary">';
  html+='<div class="ins-sum-card sell"><div class="ins-sum-ico">🔴</div><div><div class="ins-sum-num">'+counts.sell+'</div><div class="ins-sum-lbl">Sell Signals</div></div></div>';
  html+='<div class="ins-sum-card watch"><div class="ins-sum-ico">🟡</div><div><div class="ins-sum-num">'+(counts.watch+counts.info)+'</div><div class="ins-sum-lbl">Watch / Info</div></div></div>';
  html+='<div class="ins-sum-card hold"><div class="ins-sum-ico">🟢</div><div><div class="ins-sum-num">'+counts.hold+'</div><div class="ins-sum-lbl">Hold</div></div></div>';
  html+='<div class="ins-sum-card buy"><div class="ins-sum-ico">🔵</div><div><div class="ins-sum-num">'+counts.buy+'</div><div class="ins-sum-lbl">Buy Signals</div></div></div>';
  html+='</div>';
  html+=secHdr('All Signals',''+total,'var(--purple)');
  html+='<div class="ins-list">';

  var ord={sell:0,watch:1,buy:2,hold:3,info:4};
  ins.sort(function(a,b){
    var od=(ord[a.t]||5)-(ord[b.t]||5);
    if(od!==0)return od;
    var uo={high:0,medium:1,low:2};
    return (uo[a.urgency]||3)-(uo[b.urgency]||3);
  });

  ins.forEach(function(i){
    var urgColors={high:'var(--orange)',medium:'rgba(255,255,255,.4)',low:'rgba(255,255,255,.2)'};
    var mHtml=i.metrics.map(function(m){return insMetric(m[0],m[1]);}).join('');
    html+='<div class="ins-card '+i.t+' fade-in">'+
      '<div class="ins-top">'+
        '<div class="ins-ico">'+i.ico+'</div>'+
        '<div class="ins-main">'+
          '<div class="ins-header">'+
            '<span class="ins-sym">'+esc(i.sym)+'</span>'+
            '<span class="ins-co">'+esc(i.co)+'</span>'+
            '<span class="sig-tag '+i.t+'">'+i.t.toUpperCase()+'</span>'+
            '<span class="urgency-tag '+i.urgency+'">'+i.urgency.toUpperCase()+'</span>'+
          '</div>'+
          '<div class="ins-title">'+esc(i.title)+'</div>'+
          '<div class="ins-desc">'+esc(i.desc)+'</div>'+
          (mHtml?'<div class="ins-metrics">'+mHtml+'</div>':'')+
          '<div class="ins-action"><div class="ins-action-ico">💬</div>'+
            '<div class="ins-action-text"><strong>What to do:</strong> '+esc(i.action)+'</div>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '</div>';
  });
  html+='</div>';
  c.innerHTML=html;
}

// ── Market status ──────────────────────────────────────────────────
function setMktStatus(){
  var n=new Date(),h=n.getHours(),m=n.getMinutes(),d=n.getDay();
  var open=d>=1&&d<=5&&((h>9)||(h===9&&m>=30))&&((h<14)||(h===14&&m<=30));
  var p=document.getElementById('mktPill');
  p.textContent=open?'● Market Open':'○ Market Closed';
  p.className='mkt-pill '+(open?'open':'closed');
}

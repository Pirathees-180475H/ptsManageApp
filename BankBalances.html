<!-- 🏦 Bank Balances Modal Snippet -->
<style>
#bank-modal{
  position:fixed; top:10vh; left:calc(50vw - 400px);
  width:95%; max-width:800px; z-index:8000;
  background:rgba(6,11,24,.84);backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border:1px solid rgba(255,255,255,.11);border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
  display:none;flex-direction:column;overflow:hidden;
}
#bank-modal.open{display:flex;animation:bankModalIn .3s ease;}
@media(max-width:850px){ #bank-modal{ left:2.5%; } }
@media(max-width:600px){
  #bank-modal {
    top: 5vh;
    left: 2.5%;
    width: 95%;
    height: 90vh;
    border-radius: 12px;
    overflow-y: auto;
  }
  .bm-body {
    padding: 15px;
    gap: 15px;
    max-height: none;
    overflow-y: visible;
  }
  .bm-main-row {
    grid-template-columns: 1fr;
    gap: 15px;
  }
  .bm-list {
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .bm-side {
    order: -1;
  }
  .bm-chart-box {
    height: 150px;
  }
  .bm-bottom-row {
    grid-template-columns: 1fr;
    padding: 15px 15px 0;
  }
  .bm-rate-badge {
    display: none;
  }
  .bm-title {
    font-size: .55em;
  }
  .bm-item-amt{
    font-size: 1.1em;
  }
  .bm-total-val {
    font-size: 1.2em;
  }
}
@keyframes bankModalIn{from{opacity:0;transform:scale(.95) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.bm-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 13px 8px;border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;cursor:grab;user-select:none;
}
.bm-hdr:active{cursor:grabbing;}
.bm-title{font-size:.63em;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.35); display:flex; align-items:center; gap: 8px;}
.bm-close{background:none;border:none;color:rgba(255,255,255,.25);font-size:.85em;cursor:pointer;padding:2px 5px;line-height:1;font-family:inherit;}
.bm-close:hover{color:#fff;}
.bm-body{padding:20px 22px;display:flex;flex-direction:column;gap:20px;max-height: 70vh; overflow-y: auto;}
.bm-main-row{display:grid;grid-template-columns:1fr 220px;gap:24px;align-items:start;}
.bm-list{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.bm-item{
  background:rgba(255,255,255,.032);
  border:1px solid rgba(255,255,255,.06);
  border-radius:16px;
  padding:16px;
  transition:all .28s cubic-bezier(.4,0,.2,1);
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.bm-item:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 36px rgba(0,0,0,.4);
  background:rgba(255,255,255,.05);
  border-color:rgba(255,255,255,.1);
}
.bm-item::after{
  content:'';
  position:absolute;
  left:0;top:0;bottom:0;
  width:3px;
  background:var(--bank-color, #6366f1);
  box-shadow:2px 0 10px var(--bank-color, #6366f1);
  opacity:.7;
}

.bm-item-row{
  display:flex;
  align-items:center;
  gap:14px;
}
.bm-avatar{
  width:38px;height:38px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.65em;
  font-weight:800;
  flex-shrink:0;
}
.bm-info{
  flex:1;
  display:flex;
  flex-direction:column;
}
.bm-item-source{
  background:transparent;
  border:none;
  font-family:'Inter',sans-serif;
  font-size:10px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  outline:none;
  padding:3px 9px;
  border-radius:7px;
  width:fit-content;
  transition:all .2s;
}

.bm-item-amt{
  background:transparent;
  border:none;
  color:rgba(255,255,255,.6);
  font-family:'Inter',sans-serif;
  font-size:.80em;
  font-weight:700;
  outline:none;
  padding:2px 0;
  width:100%;
  letter-spacing:0.5px;
}
.bm-item-amt:focus{color:rgba(255,255,255,.95);}
.bm-item-usd{
  font-size:.68em;
  font-weight:600;
  color:rgba(255,255,255,.35);
  letter-spacing:.4px;
  padding-top:2px;
  font-family:'Inter',sans-serif;
}
.bm-rate-badge{
  display:flex;align-items:center;gap:5px;
  background:rgba(16,185,129,.08);
  border:1px solid rgba(16,185,129,.2);
  border-radius:10px;
  padding:4px 10px;
  font-family:'Inter',sans-serif;
  animation:fadeIn .4s ease;
}
.bm-rate-icon{font-size:.75em;}
.bm-rate-label{
  font-size:.55em;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:rgba(255,255,255,.35);
}
.bm-rate-val{
  font-size:.7em;
  font-weight:800;
  color:rgba(16,185,129,.9);
  letter-spacing:.5px;
}
.bm-rate-loading .bm-rate-val{color:rgba(255,255,255,.25);animation:pulse 1.2s ease infinite;}

.bm-side{
  display:flex;
  flex-direction:column;
  gap:16px;
}
.bm-chart-box{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:14px;height:180px;position:relative;}
.bm-total-box{background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:4px;}
.bm-total-lbl{font-size:.58em;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:3px;}
.bm-total-val{font-size:.80em;font-weight:800;color:rgba(255,255,255,.75);letter-spacing:0.5px;line-height:1.2;}
.bm-total-usd{font-size:.62em;font-weight:600;color:rgba(16,185,129,.6);letter-spacing:.4px;margin-top:3px;}

/* ── Transaction Table UI ── */
#bm-txn-overlay{
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(6,11,24,0.98); z-index:9000;
  display:none; flex-direction:column;
}
#bm-txn-overlay.open{ display:flex; animation: fadeIn 0.2s ease; }
.bm-txn-hdr{
  padding:15px 22px; border-bottom:1px solid rgba(255,255,255,0.06);
  display:flex; justify-content:space-between; align-items:center;
}
.bm-txn-body{ flex:1; overflow-y:auto; padding:0 22px; }
.bm-txn-table{
  width:100%; border-collapse:collapse; color:rgba(255,255,255,0.7);
  font-size:0.75em; margin-top:10px;
}
.bm-txn-table th{
  text-align:left; padding:12px 8px; border-bottom:1px solid rgba(255,255,255,0.1);
  text-transform:uppercase; letter-spacing:1px; color:rgba(255,255,255,0.3); font-size:0.85em;
}
.bm-txn-table td{ padding:12px 8px; border-bottom:1px solid rgba(255,255,255,0.03); }
.bm-txn-table tr:hover{ background:rgba(255,255,255,0.02); }
.bm-txn-btn-sm{
  background:none; border:none; cursor:pointer; padding:4px; border-radius:4px;
  transition:all 0.2s; font-size:1.1em;
}
.bm-txn-btn-del:hover{ background:rgba(239,68,68,0.15); color:#ef4444; }
.bm-txn-btn-edit:hover{ background:rgba(59,130,246,0.15); color:#3b82f6; }

/* ── Custom Confirm Dialog ── */
#bm-confirm-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.4); z-index: 10000;
  display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
#bm-confirm-overlay.open { display: flex; }
.bm-confirm-card {
  background: #111827; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px; width: 90%; max-width: 320px;
  padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  text-align: center;
}
.bm-confirm-msg { color: rgba(255,255,255,0.85); font-size: 0.85em; margin-bottom: 20px; line-height: 1.5; }
.bm-confirm-btns { display: flex; gap: 10px; justify-content: center; }
.bm-confirm-btn {
  padding: 8px 16px; border-radius: 6px; border: none; font-size: 0.75em;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.bm-confirm-btn-yes { background: #ef4444; color: #fff; }
.bm-confirm-btn-yes:hover { background: #dc2626; }
.bm-confirm-btn-no { background: rgba(255,255,255,0.1); color: #fff; }
.bm-confirm-btn-no:hover { background: rgba(255,255,255,0.15); }

/* Inline Edit Styles */
.bm-txn-inline-input {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 4px; color: #fff; font-size: 1em; padding: 4px 6px; width: 100%;
  font-family: inherit; outline: none;
}
.bm-txn-inline-input:focus { border-color: rgba(59,130,246,0.5); background: rgba(255,255,255,0.08); }

/* ── Bottom Row: Total + Converter ── */
.bm-bottom-row-upper{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  padding:20px 22px 0;
}
.bm-bottom-row-lower{
  padding:16px 22px 0;
}
.bm-transfer{
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  padding:10px 14px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.bm-trans-title{
  font-size:.52em;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:rgba(255,255,255,.3);
  margin-bottom:2px;
}
.bm-trans-row{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.bm-trans-group{
  display:flex;
  align-items:center;
  gap:8px;
}
.bm-trans-field{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.bm-trans-lbl{
  font-size:.52em;
  font-weight:700;
  letter-spacing:1.3px;
  text-transform:uppercase;
  color:rgba(255,255,255,.35);
}
.bm-trans-input-wrap{
  display:flex;
  align-items:center;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.09);
  border-radius:9px;
  padding:0 8px;
  height:30px;
}
.bm-trans-select, .bm-trans-input{
  background:transparent;
  border:none;
  color:#fff;
  font-family:'Inter',sans-serif;
  font-size:.75em;
  font-weight:600;
  outline:none;
  width:100%;
}
.bm-trans-select option{
  background:#1a1f2b;
  color:#fff;
}
.bm-trans-btn{
  background:rgba(0,212,255,.1);
  border:1px solid rgba(0,212,255,.2);
  border-radius:9px;
  color:rgba(0,212,255,.8);
  font-family:'Inter',sans-serif;
  font-size:.7em;
  font-weight:700;
  cursor:pointer;
  padding:6px;
  transition:all .2s;
  text-transform:uppercase;
  letter-spacing:1px;
}
.bm-trans-btn:disabled{opacity:0.5; cursor:wait;}
.bm-trans-btn:hover:not(:disabled){
  background:rgba(0,212,255,.2);
  border-color:rgba(0,212,255,.4);
}
.bm-converter{
  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.07);
  border-radius:12px;
  padding:10px 14px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.bm-conv-title{
  font-size:.52em;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:rgba(255,255,255,.3);
  margin-bottom:2px;
}
.bm-conv-row{
  display:flex;
  align-items:flex-end;
  gap:8px;
}
.bm-conv-field{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:4px;
}
.bm-conv-cur{
  font-size:.52em;
  font-weight:700;
  letter-spacing:1.3px;
  text-transform:uppercase;
  color:rgba(255,255,255,.35);
}
.bm-conv-input-wrap{
  display:flex;
  align-items:center;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.09);
  border-radius:9px;
  padding:0 10px;
  gap:5px;
  transition:border-color .2s,box-shadow .2s;
  height:32px;
}
.bm-conv-prefix{font-size:.75em;color:rgba(255,255,255,.2);}
.bm-conv-input{
  background:transparent;
  border:none;
  color:#fff;
  font-family:'Inter',monospace;
  font-size:.82em;
  font-weight:600;
  outline:none;
  padding:0;
  width:100%;
  letter-spacing:.2px;
}
.bm-conv-input::placeholder{color:rgba(255,255,255,.15);}
.bm-conv-input::-webkit-inner-spin-button,
.bm-conv-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.bm-conv-swap{
  background:rgba(0,212,255,.1);
  border:1px solid rgba(0,212,255,.2);
  border-radius:50%;
  width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  font-size:.9em;
  color:rgba(0,212,255,.8);
  cursor:pointer;
  flex-shrink:0;
  transition:all .2s ease;
  padding:0;
}
.bm-conv-swap:hover{
  background:rgba(0,212,255,.2);
  transform:rotate(180deg) scale(1.05);
  border-color:rgba(0,212,255,.4);
}
.bm-conv-hint{
  font-size:.55em;
  color:rgba(255,255,255,.22);
  letter-spacing:.3px;
  min-height:.9em;
  transition:color .2s;
  margin-top:2px;
}
.bm-conv-hint.active{
  color:rgba(16,185,129,.7);
}

.bm-foot{display:flex;justify-content:flex-end;gap:12px;padding:20px 22px 24px;border-top:1px solid rgba(255,255,255,.04);}
.bm-btn{display:flex;align-items:center;justify-content:center;padding:11px 22px;border-radius:14px;font-family:'Inter',sans-serif;font-size:.78em;font-weight:700;cursor:pointer;transition:all .25s ease;border:none;letter-spacing:.5px;}

.bm-btn-save{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.7);
  box-shadow:0 4px 15px rgba(0,0,0,.2);
}
.bm-btn-save:hover{
  background:rgba(255,255,255,.1);
  color:#fff;
  border-color:rgba(255,255,255,.2);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}
.bm-btn-save:active{transform:translateY(0);}
.bm-btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;}

@media(max-width:750px){
  .bm-main-row{grid-template-columns:1fr;gap:16px;}
  .bm-list{grid-template-columns:repeat(2,1fr);}
  .bm-bottom-row-upper{grid-template-columns:1fr;gap:12px;}
}
@media(max-width:500px){
  .bm-list{grid-template-columns:1fr;}
}
</style>

<div id="bank-modal">
  <div class="bm-hdr">
    <span class="bm-title">🏦 Bank Balances</span>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="bm-rate-badge" id="bmRateBadge" title="USD/LKR rate from Google Finance">
        <span class="bm-rate-icon">💱</span>
        <span class="bm-rate-label">USD/LKR</span>
        <span class="bm-rate-val" id="bmRateVal">—</span>
      </div>
      <button class="bm-close" onclick="moneyToggle()">✕</button>
    </div>
  </div>
  <div class="bm-body">
    <div id="bm-txn-overlay">
      <!-- Custom Confirm Inside -->
      <div id="bm-confirm-overlay">
        <div class="bm-confirm-card">
          <div class="bm-confirm-msg" id="bmConfirmMsg">Are you sure?</div>
          <div class="bm-confirm-btns">
            <button class="bm-confirm-btn bm-confirm-btn-no" onclick="bmConfirmClose(false)">Cancel</button>
            <button class="bm-confirm-btn bm-confirm-btn-yes" id="bmConfirmYes" onclick="bmConfirmClose(true)">Confirm</button>
          </div>
        </div>
      </div>
      <div class="bm-txn-hdr">
        <span class="bm-title">📋 Transactions</span>
        <button class="bm-close" onclick="bmHideTransactions()">✕</button>
      </div>
      <div class="bm-txn-body">
        <table class="bm-txn-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Source</th>
              <th>Dest</th>
              <th>Amount</th>
              <th>Ref</th>
              <th style="width:60px;"></th>
            </tr>
          </thead>
          <tbody id="bm-txn-list">
            <tr><td colspan="6" style="text-align:center;padding:40px;color:rgba(255,255,255,0.2);">Loading transactions...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="bm-main-row">
      <div class="bm-list" id="bmList">
        <div style="text-align:center;padding:20px;color:var(--muted);font-size:.8em;">Loading bank data…</div>
      </div>
      <div class="bm-side">
        <div class="bm-chart-box">
          <canvas id="bmChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Bottom Row: Total Balance + Converter -->
    <div class="bm-bottom-row-upper">
      <div class="bm-total-box">
        <span class="bm-total-lbl">Total Liquid Balance</span>
        <span class="bm-total-val" id="bmTotal">₨ 0.00</span>
        <span class="bm-total-usd" id="bmTotalUsd">≈ — USD</span>
      </div>

      <!-- USD ↔ LKR Converter -->
      <div class="bm-converter">
        <div class="bm-conv-title">💱 Convert</div>
        <div class="bm-conv-row">
          <div class="bm-conv-field">
            <label class="bm-conv-cur">USD</label>
            <div class="bm-conv-input-wrap">
              <span class="bm-conv-prefix">$</span>
              <input type="number" id="bm-conv-usd" class="bm-conv-input" placeholder="0.00" oninput="bmConvFromUsd()" step="any" min="0">
            </div>
          </div>
          <button class="bm-conv-swap" onclick="bmConvSwap()" title="Swap currencies">⇄</button>
          <div class="bm-conv-field">
            <label class="bm-conv-cur">LKR</label>
            <div class="bm-conv-input-wrap">
              <span class="bm-conv-prefix">₨</span>
              <input type="number" id="bm-conv-lkr" class="bm-conv-input" placeholder="0.00" oninput="bmConvFromLkr()" step="any" min="0">
            </div>
          </div>
        </div>
        <div class="bm-conv-hint" id="bm-conv-hint">Enter amount</div>
      </div>
    </div>

    <!-- Next Line: Bank Transfers -->
    <div class="bm-bottom-row-lower">
      <div class="bm-transfer">
        <div class="bm-trans-title">💸 Transfer</div>
        <div class="bm-trans-row">
          <div class="bm-trans-group">
            <div class="bm-trans-field">
              <label class="bm-trans-lbl">From</label>
              <div class="bm-trans-input-wrap">
                <select id="bm-trans-from" class="bm-trans-select"></select>
              </div>
            </div>
            <div class="bm-trans-field">
              <label class="bm-trans-lbl">To</label>
              <div class="bm-trans-input-wrap">
                <select id="bm-trans-to" class="bm-trans-select"></select>
              </div>
            </div>
          </div>
          <div class="bm-trans-group">
            <div class="bm-trans-field">
              <label class="bm-trans-lbl">Amount</label>
              <div class="bm-trans-input-wrap">
                <input type="number" id="bm-trans-amt" class="bm-trans-input" placeholder="0.00" step="any" min="0">
              </div>
            </div>
            <div class="bm-trans-field">
              <label class="bm-trans-lbl">Reference</label>
              <div class="bm-trans-input-wrap">
                <input type="text" id="bm-trans-ref" class="bm-trans-input" placeholder="Ref...">
              </div>
            </div>
          </div>
          <button class="bm-trans-btn" onclick="bmPerformTransfer()" style="margin-top:4px;">Transfer</button>
        </div>
      </div>
    </div>

  </div>
  <div class="bm-foot" style="justify-content: flex-end; gap: 8px;">
    <button class="bm-btn" style="background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.1); padding: 0 12px; height: 36px; display: flex; align-items: center; justify-content: center;" onclick="bmViewTransactions()" title="View Transactions">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
    </button>
    <button class="bm-btn bm-btn-save" id="bmSaveBtn" onclick="bmSave()" title="Save Changes" style="height: 36px; width: auto; padding: 0 12px;">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
    </button>
  </div>
</div>

<script>
// Utility function to escape HTML special characters
function esc(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ── Bank Balance Manager ──
var _bmData = [];
var _bmChart = null;
var _positionedBank = false;
var _bmTransactions = [];
var _bmEditingIdx = -1;
var _bmConfirmCallback = null;

function bmConfirm(msg, callback, isAlert) {
  _bmConfirmCallback = callback;
  document.getElementById('bmConfirmMsg').textContent = msg;
  const yesBtn = document.getElementById('bmConfirmYes');
  const noBtn = document.querySelector('.bm-confirm-btn-no');
  
  if (isAlert) {
    noBtn.style.display = 'none';
    yesBtn.textContent = 'OK';
    yesBtn.classList.remove('bm-confirm-btn-yes');
    yesBtn.style.background = 'rgba(255,255,255,0.1)';
  } else {
    noBtn.style.display = 'block';
    yesBtn.textContent = 'Confirm';
    yesBtn.classList.add('bm-confirm-btn-yes');
    yesBtn.style.background = '';
  }
  
  document.getElementById('bm-confirm-overlay').classList.add('open');
}

function bmAlert(msg, callback) {
  bmConfirm(msg, callback, true);
}

function bmConfirmClose(result) {
  document.getElementById('bm-confirm-overlay').classList.remove('open');
  if (_bmConfirmCallback) {
    _bmConfirmCallback(result);
    _bmConfirmCallback = null;
  }
}

function moneyToggle() {
  const p = document.getElementById('bank-modal');
  if (p.classList.contains('open')) {
    p.classList.remove('open');
  } else {
    if(!_positionedBank) {
      _positionedBank = true;
    }
    p.classList.add('open');
    bmLoad();
  }
}

// Draggable Bank Modal
document.addEventListener('DOMContentLoaded', function(){
  var panel = document.getElementById('bank-modal');
  if (!panel) return;
  var topbar = panel.querySelector('.bm-hdr');
  var _drag = false, _ox = 0, _oy = 0;
  
  function startDrag(cx, cy){
    var r = panel.getBoundingClientRect();
    _ox = cx - r.left;
    _oy = cy - r.top;
    _drag = true;
    topbar.style.cursor = 'grabbing';
  }
  function moveDrag(cx, cy){
    if(!_drag) return;
    var pw = panel.offsetWidth, ph = panel.offsetHeight;
    var maxX = window.innerWidth - pw;
    var maxY = window.innerHeight - ph;
    var nx = Math.max(0, Math.min(cx - _ox, maxX));
    var ny = Math.max(0, Math.min(cy - _oy, maxY));
    panel.style.left = nx + 'px';
    panel.style.top = ny + 'px';
  }
  function endDrag(){
    _drag = false;
    topbar.style.cursor = 'grab';
  }

  topbar.addEventListener('mousedown', function(e){ if(e.target.closest('button')) return; startDrag(e.clientX, e.clientY); });
  document.addEventListener('mousemove', function(e){ moveDrag(e.clientX, e.clientY); });
  document.addEventListener('mouseup', endDrag);

  topbar.addEventListener('touchstart', function(e){ if(e.target.closest('button')) return; var t=e.touches[0]; startDrag(t.clientX, t.clientY); },{passive:true});
  document.addEventListener('touchmove', function(e){ if(!_drag) return; e.preventDefault(); var t=e.touches[0]; moveDrag(t.clientX, t.clientY); },{passive:false});
  document.addEventListener('touchend', endDrag);
});

var _bmUsdRate = 0;

function bmLoad() {
  const list = document.getElementById('bmList');
  list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-size:.8em;"><div class="edm-spin" style="margin:0 auto 10px"></div>Fetching bank data…</div>';

  bmFetchRate();
  
  google.script.run
    .withSuccessHandler(function(data) {
      _bmData = data;
      bmRender();
    })
    .withFailureHandler(function(err) {
      list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--red);font-size:.8em;">⚠ ' + (err.message || err) + '</div>';
    })
    .getBankBalances();
}

function bmFetchRate() {
  const badge = document.getElementById('bmRateBadge');
  const valEl = document.getElementById('bmRateVal');
  if (badge) badge.classList.add('bm-rate-loading');
  if (valEl) valEl.textContent = '…';

  google.script.run
    .withSuccessHandler(function(rate) {
      _bmUsdRate = parseFloat(rate) || 0;
      if (valEl) valEl.textContent = _bmUsdRate > 0 ? _bmUsdRate.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) : 'N/A';
      if (badge) badge.classList.remove('bm-rate-loading');
      if (_bmData && _bmData.length) bmRender();
    })
    .withFailureHandler(function() {
      _bmUsdRate = 0;
      if (valEl) valEl.textContent = 'N/A';
      if (badge) badge.classList.remove('bm-rate-loading');
    })
    .getUsdToLkrRate();
}

const _BANK_COLORS = {
  'boc': { bg: '#fbbf24', fg: '#1f2937' },
  'hnb': { bg: '#1e3a8a', fg: '#ffffff' },
  'commercial': { bg: '#2563eb', fg: '#ffffff' },
  'sampath': { bg: '#ea580c', fg: '#ffffff' },
  'ntb': { bg: '#7dd3fc', fg: '#0c4a6e' }
};

function getBankStyle(name) {
  const n = (name||'').toLowerCase();
  for (let k in _BANK_COLORS) {
    if (n.includes(k)) return _BANK_COLORS[k];
  }
  return { bg: 'rgba(255,255,255,0.1)', fg: '#ffffff' };
}

function bmRender() {
  const list = document.getElementById('bmList');
  const totalEl = document.getElementById('bmTotal');
  
  if (!_bmData || !_bmData.length) {
    list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--muted);font-size:.8em;">No bank rows found in Portfolio G1:I10.</div>';
    totalEl.textContent = '₨ 0.00';
    if (_bmChart) _bmChart.destroy();
    _bmChart = null;
    return;
  }
  
  let total = 0;
  let html = '';
  
  _bmData.forEach((item, i) => {
    total += item.amount;
    const style = getBankStyle(item.source);
    const initials = (item.source || '??').substring(0, 3).toUpperCase();
    const usdAmt = (_bmUsdRate > 0) ? (item.amount / _bmUsdRate).toFixed(2) : null;
    const usdLine = usdAmt ? `<div class="bm-item-usd" id="bm-usd-${i}">≈ $${Number(usdAmt).toLocaleString('en-US',{minimumFractionDigits:2})} USD</div>` : `<div class="bm-item-usd" id="bm-usd-${i}">≈ — USD</div>`;
    html += `
      <div class="bm-item" style="--bank-color: ${style.bg}">
        <div class="bm-item-row">
          <div class="bm-avatar" style="background:${style.bg}; color:${style.fg}">${initials}</div>
          <div class="bm-info">
            <input type="text" id="bm-src-${i}" class="bm-item-source" style="background:${style.bg};color:${style.fg};" value="${esc(item.source)}" onchange="bmUpdateData(${i}, 'source', this.value)" placeholder="Bank Name">
            <input type="number" class="bm-item-amt" value="${item.amount}" onchange="bmUpdateData(${i}, 'amount', this.value)" step="0.01">
            ${usdLine}
          </div>
        </div>
      </div>
    `;
  });
  
  list.innerHTML = html;
  totalEl.textContent = '₨ ' + total.toLocaleString('en-IN', {minimumFractionDigits:2});
  bmUpdateTotalUsd(total);
  bmUpdateChart(total);
  bmPopulateTransferSelects();
}

function bmPopulateTransferSelects() {
  const fromSelect = document.getElementById('bm-trans-from');
  const toSelect = document.getElementById('bm-trans-to');
  if (!fromSelect || !toSelect) return;
  
  const fromVal = fromSelect.value;
  const toVal = toSelect.value;
  
  let options = '<option value="">Select Bank</option>';
  _bmData.forEach((item, i) => {
    options += `<option value="${i}">${esc(item.source)}</option>`;
  });
  
  fromSelect.innerHTML = options;
  toSelect.innerHTML = options;
  
  if (fromVal && fromSelect.querySelector(`option[value="${fromVal}"]`)) fromSelect.value = fromVal;
  if (toVal && toSelect.querySelector(`option[value="${toVal}"]`)) toSelect.value = toVal;
}

function bmPerformTransfer() {
  const fromIdx = document.getElementById('bm-trans-from').value;
  const toIdx = document.getElementById('bm-trans-to').value;
  const amtInput = document.getElementById('bm-trans-amt');
  const refInput = document.getElementById('bm-trans-ref');
  const amount = parseFloat(amtInput.value) || 0;
  const reference = (refInput.value || '').trim();
  
  if (fromIdx === "" || toIdx === "") {
    bmAlert("Please select both source and destination banks.");
    return;
  }
  if (fromIdx === toIdx) {
    bmAlert("Source and destination banks must be different.");
    return;
  }
  if (amount <= 0) {
    bmAlert("Please enter a valid transfer amount.");
    return;
  }
  
  const fromBank = _bmData[fromIdx];
  const toBank = _bmData[toIdx];
  
  if (amount > fromBank.amount) {
    bmConfirm(`Transfer amount (₨${amount}) exceeds source bank balance (₨${fromBank.amount}). Proceed anyway?`, function(ok) {
      if (ok) bmPerformTransferFinal(fromBank, toBank, amount, reference, amtInput, refInput);
    });
    return;
  }
  bmPerformTransferFinal(fromBank, toBank, amount, reference, amtInput, refInput);
}

function bmPerformTransferFinal(fromBank, toBank, amount, reference, amtInput, refInput) {
  const btn = document.querySelector('.bm-trans-btn');
  const oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '...';

  const txn = {
    date: new Date().toISOString(),
    source: fromBank.source,
    destination: toBank.source,
    amount: amount,
    reference: reference
  };

  console.log('[DEBUG_LOG] Performing transfer:', txn);

  google.script.run
    .withSuccessHandler(function(res) {
      console.log('[DEBUG_LOG] Transaction logged successfully:', res);
      // Perform local transfer update
      fromBank.amount -= amount;
      toBank.amount += amount;
      
      // Clear inputs
      amtInput.value = "";
      refInput.value = "";
      
      console.log('[DEBUG_LOG] Updating bank balances locally and on server.');
      // Save updated balances to Portfolio sheet
      google.script.run
        .withSuccessHandler(function(res2) {
          console.log('[DEBUG_LOG] Bank balances updated on server:', res2);
          btn.disabled = false;
          btn.textContent = oldText;
          // Re-render
          bmRender();
        })
        .withFailureHandler(function(err) {
          console.error('[DEBUG_LOG] Failed to update bank balances:', err);
          btn.disabled = false;
          btn.textContent = oldText;
          bmAlert("Transaction logged, but failed to update bank balances: " + (err.message || err));
          bmRender();
        })
        .updateBankBalances(_bmData);
    })
    .withFailureHandler(function(err) {
      console.error('[DEBUG_LOG] Failed to log transaction:', err);
      btn.disabled = false;
      btn.textContent = oldText;
      bmAlert("Failed to log transaction: " + (err.message || err));
    })
    .addBankTransaction(txn);
}

var _bmTransactions = [];

function bmViewTransactions() {
  const overlay = document.getElementById('bm-txn-overlay');
  overlay.classList.add('open');
  bmFetchTransactions();
}

function bmHideTransactions() {
  const overlay = document.getElementById('bm-txn-overlay');
  overlay.classList.remove('open');
}

function bmFetchTransactions() {
  const list = document.getElementById('bm-txn-list');
  list.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;"><div class="ld-spin" style="margin:0 auto"></div></td></tr>';

  google.script.run
    .withSuccessHandler(function(data) {
      _bmTransactions = data;
      bmRenderTransactions();
    })
    .withFailureHandler(function(err) {
      list.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#ef4444;">Failed to load: ' + err.message + '</td></tr>';
    })
    .getBankTransactions();
}

function bmRenderTransactions() {
  console.log('[DEBUG_LOG] bmRenderTransactions called with:', _bmTransactions);
  const list = document.getElementById('bm-txn-list');
  if (!_bmTransactions || !_bmTransactions.length) {
    list.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:rgba(255,255,255,0.2);">No transactions found.</td></tr>';
    return;
  }

  let html = '';
  _bmTransactions.forEach((t, i) => {
    let dateStr = 'N/A';
    try {
      const dt = new Date(t.date);
      if (!isNaN(dt.getTime())) {
        dateStr = dt.toLocaleDateString('en-GB', {day:'2-digit', month:'short'});
      } else {
        dateStr = String(t.date).substring(0, 10);
      }
    } catch(e) {
      console.error('[DEBUG_LOG] Error formatting date:', e, t.date);
    }
    
    if (_bmEditingIdx === i) {
      html += `
        <tr class="bm-txn-editing">
          <td>${dateStr}</td>
          <td>${esc(t.source)}</td>
          <td>${esc(t.destination)}</td>
          <td><input type="number" id="bm-edit-amt-${i}" class="bm-txn-inline-input" value="${t.amount}" step="any"></td>
          <td><input type="text" id="bm-edit-ref-${i}" class="bm-txn-inline-input" value="${esc(t.reference)}"></td>
          <td style="display:flex;gap:4px;justify-content:flex-end;">
            <button class="bm-txn-btn-sm" style="color:#10b981;" onclick="bmSaveInlineEdit(${i})" title="Save">✓</button>
            <button class="bm-txn-btn-sm" style="color:#ef4444;" onclick="bmCancelEdit()" title="Cancel">✕</button>
          </td>
        </tr>
      `;
    } else {
      html += `
        <tr>
          <td>${dateStr}</td>
          <td>${esc(t.source)}</td>
          <td>${esc(t.destination)}</td>
          <td style="font-weight:700;">₨ ${t.amount.toLocaleString()}</td>
          <td style="color:rgba(255,255,255,0.4);">${esc(t.reference)}</td>
          <td style="display:flex;gap:4px;justify-content:flex-end;">
            <button class="bm-txn-btn-sm" style="color:#fbbf24; border-color:rgba(251,191,36,0.2);" onclick="bmRollbackTxn(${i})" title="Rollback">↺</button>
            <button class="bm-txn-btn-sm bm-txn-btn-edit" onclick="bmEditTxn(${i})" title="Edit">✎</button>
            <button class="bm-txn-btn-sm bm-txn-btn-del" onclick="bmDeleteTxn(${i})" title="Delete">✕</button>
          </td>
        </tr>
      `;
    }
  });
  list.innerHTML = html;
}

function bmDeleteTxn(idx) {
  bmConfirm('Are you sure you want to delete this transaction?', function(ok) {
    if (!ok) return;
    const txn = _bmTransactions[idx];
    
    google.script.run
      .withSuccessHandler(function() {
        // Revert bank balances
        const sourceBank = _bmData.find(b => b.source === txn.source);
        const destBank = _bmData.find(b => b.source === txn.destination);
        if (sourceBank && destBank) {
          sourceBank.amount += txn.amount;
          destBank.amount -= txn.amount;
          
          // Save updated balances to Portfolio sheet
          google.script.run
            .withSuccessHandler(function() {
              bmRender();
            })
            .withFailureHandler(function(err) {
              bmAlert("Transaction deleted, but failed to update bank balances: " + (err.message || err));
              bmRender();
            })
            .updateBankBalances(_bmData);
        }
        
        _bmTransactions.splice(idx, 1);
        bmRenderTransactions();
      })
      .withFailureHandler(function(err) {
        bmAlert("Failed to delete: " + err.message);
      })
      .deleteBankTransaction(txn.row);
  });
}

function bmEditTxn(idx) {
  _bmEditingIdx = idx;
  bmRenderTransactions();
}

function bmCancelEdit() {
  _bmEditingIdx = -1;
  bmRenderTransactions();
}

function bmSaveInlineEdit(idx) {
  const txn = _bmTransactions[idx];
  const newAmt = parseFloat(document.getElementById(`bm-edit-amt-${idx}`).value) || 0;
  const newRef = document.getElementById(`bm-edit-ref-${idx}`).value;

  google.script.run
    .withSuccessHandler(function() {
      // Find and update local bank balance data
      const sourceBank = _bmData.find(b => b.source === txn.source);
      const destBank = _bmData.find(b => b.source === txn.destination);
      
      if (sourceBank && destBank) {
        // Reverse old txn impact
        sourceBank.amount += txn.amount;
        destBank.amount -= txn.amount;
        
        // Apply new txn impact
        sourceBank.amount -= newAmt;
        destBank.amount += newAmt;
        
        // Save updated balances to Portfolio sheet
        google.script.run
          .withSuccessHandler(function() {
            bmRender();
          })
          .withFailureHandler(function(err) {
            bmAlert("Transaction updated, but failed to update bank balances: " + (err.message || err));
            bmRender();
          })
          .updateBankBalances(_bmData);
      }

      txn.reference = newRef;
      txn.amount = newAmt;
      _bmEditingIdx = -1;
      bmRenderTransactions();
    })
    .withFailureHandler(function(err) {
      bmAlert("Failed to update: " + err.message);
    })
    .updateBankTransaction(txn.row, { reference: newRef, amount: newAmt });
}

function bmRollbackTxn(idx) {
  const originalTxn = _bmTransactions[idx];
  bmConfirm(`Rollback this transaction? This will create a new transaction swapping ${originalTxn.source} and ${originalTxn.destination}.`, function(ok) {
    if (!ok) return;

    const rollbackTxn = {
      date: new Date().toISOString(),
      source: originalTxn.destination,
      destination: originalTxn.source,
      amount: originalTxn.amount,
      reference: (originalTxn.reference || '') + " - rollbacked"
    };

    google.script.run
      .withSuccessHandler(function() {
        // Update local balances
        const sBank = _bmData.find(b => b.source === rollbackTxn.source);
        const dBank = _bmData.find(b => b.source === rollbackTxn.destination);
        if (sBank) sBank.amount -= rollbackTxn.amount;
        if (dBank) dBank.amount += rollbackTxn.amount;

        // Persist balance changes
        google.script.run
          .withSuccessHandler(function() {
            bmRender();
            bmFetchTransactions(); // Refresh list to see the new rollback entry
          })
          .withFailureHandler(function(err) {
            bmAlert("Rollback logged, but failed to update balances: " + (err.message || err));
            bmRender();
          })
          .updateBankBalances(_bmData);
      })
      .withFailureHandler(function(err) {
        bmAlert("Rollback failed: " + (err.message || err));
      })
      .addBankTransaction(rollbackTxn);
  });
}

function bmUpdateData(index, key, value) {
  if (key === 'amount') {
    _bmData[index].amount = parseFloat(value) || 0;
    const usdEl = document.getElementById('bm-usd-' + index);
    if (usdEl) {
      const usdAmt = (_bmUsdRate > 0) ? (_bmData[index].amount / _bmUsdRate) : null;
      usdEl.textContent = usdAmt !== null ? '≈ $' + usdAmt.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}) + ' USD' : '≈ — USD';
    }
  } else {
    _bmData[index].source = value;
    const style = getBankStyle(value);
    const inp = document.getElementById('bm-src-' + index);
    const itemEl = inp.closest('.bm-item');
    const avatar = itemEl.querySelector('.bm-avatar');
    if(inp) {
      inp.style.background = style.bg;
      inp.style.color = style.fg;
    }
    if(avatar) {
      avatar.style.background = style.bg;
      avatar.style.color = style.fg;
      avatar.textContent = (value || '??').substring(0, 3).toUpperCase();
    }
    if(itemEl) {
      itemEl.style.setProperty('--bank-color', style.bg);
    }
  }
  
  let total = _bmData.reduce((s, item) => s + item.amount, 0);
  document.getElementById('bmTotal').textContent = '₨ ' + total.toLocaleString('en-IN', {minimumFractionDigits:2});
  bmUpdateTotalUsd(total);
  bmUpdateChart(total);
}

function bmUpdateTotalUsd(total) {
  const el = document.getElementById('bmTotalUsd');
  if (!el) return;
  if (_bmUsdRate > 0) {
    const usd = total / _bmUsdRate;
    el.textContent = '≈ $' + usd.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' USD';
  } else {
    el.textContent = '≈ — USD';
  }
}

function bmUpdateChart(total) {
  const canvas = document.getElementById('bmChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const labels = _bmData.map(d => d.source);
  const data = _bmData.map(d => d.amount);
  const bgColors = labels.map(l => getBankStyle(l).bg);
  
  if (_bmChart) {
    _bmChart.data.labels = labels;
    _bmChart.data.datasets[0].data = data;
    _bmChart.data.datasets[0].backgroundColor = bgColors;
    _bmChart.data.datasets[0].borderColor = bgColors;
    _bmChart.update();
  } else {
    _bmChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: data,
          backgroundColor: bgColors,
          borderColor: bgColors,
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '70%',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(ctx) {
                const val = ctx.parsed;
                const pct = total > 0 ? ((val / total) * 100).toFixed(1) : 0;
                return ' ' + ctx.label + ': ₨ ' + val.toLocaleString() + ' (' + pct + '%)';
              }
            }
          }
        }
      }
    });
  }
}

function bmSave() {
  const btn = document.getElementById('bmSaveBtn');
  const oldHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<div class="ld-spin" style="width:16px;height:16px;border-width:2px;"></div>';
  
  google.script.run
    .withSuccessHandler(function() {
      btn.innerHTML = '✓';
      btn.style.color = 'var(--green)';
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = oldHtml;
        btn.style.color = '';
        moneyToggle();
        if (typeof reloadPage === 'function') {
          const activePage = document.querySelector('.spa-page.active').id.replace('page-', '');
          if (activePage === 'port' || activePage === 'cse') reloadPage(activePage);
        }
      }, 1000);
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.innerHTML = oldHtml;
      bmAlert('Failed to save: ' + (err.message || err));
    })
    .updateBankBalances(_bmData);
}

// ── USD ↔ LKR Converter ──
function bmConvFromUsd() {
  const usdInput = document.getElementById('bm-conv-usd');
  const lkrInput = document.getElementById('bm-conv-lkr');
  const hint = document.getElementById('bm-conv-hint');
  
  if (_bmUsdRate <= 0) {
    hint.textContent = '⏳ Fetching exchange rate...';
    hint.classList.remove('active');
    return;
  }

  const usd = parseFloat(usdInput.value) || 0;
  if (usd > 0) {
    const lkr = usd * _bmUsdRate;
    lkrInput.value = lkr.toFixed(2);
    hint.textContent = `₨${lkr.toFixed(2)} LKR @ ${_bmUsdRate.toFixed(2)}`;
    hint.classList.add('active');
  } else {
    lkrInput.value = '';
    hint.textContent = `Rate: ₨${_bmUsdRate.toFixed(2)}/USD`;
    hint.classList.remove('active');
  }
}

function bmConvFromLkr() {
  const usdInput = document.getElementById('bm-conv-usd');
  const lkrInput = document.getElementById('bm-conv-lkr');
  const hint = document.getElementById('bm-conv-hint');
  
  if (_bmUsdRate <= 0) {
    hint.textContent = '⏳ Fetching exchange rate...';
    hint.classList.remove('active');
    return;
  }

  const lkr = parseFloat(lkrInput.value) || 0;
  if (lkr > 0) {
    const usd = lkr / _bmUsdRate;
    usdInput.value = usd.toFixed(2);
    hint.textContent = `$${usd.toFixed(2)} USD @ ${_bmUsdRate.toFixed(2)}`;
    hint.classList.add('active');
  } else {
    usdInput.value = '';
    hint.textContent = `Rate: ₨${_bmUsdRate.toFixed(2)}/USD`;
    hint.classList.remove('active');
  }
}

function bmConvSwap() {
  const usdInput = document.getElementById('bm-conv-usd');
  const lkrInput = document.getElementById('bm-conv-lkr');
  const temp = usdInput.value;
  usdInput.value = lkrInput.value;
  lkrInput.value = temp;
  
  if (usdInput.value) {
    bmConvFromUsd();
  } else if (lkrInput.value) {
    bmConvFromLkr();
  }
}
</script>

<!-- ═══════════════════════════════════════════════════════════════
     BANK PAGE  —  liquid cash, self-contained
     ───────────────────────────────────────────────────────────
     Replaces the old #bank-modal that used to live in this file and
     stacked three overlays — modal → transactions → confirm — on top
     of each other. Four zones now, each an anchor of the tab rail:

       ① command bar   pinned · live USD/LKR · save · reload
       ② overview      hero + concentric arc dial + ring rows + 3 KPIs
       ③ passbooks     a shelf of bound savings books; open one and
                       its two-leaf spread carries the balance (left)
                       and its ruled ledger (right)
       ④ move money    transfer (with preview) + converter + pairs
       ⑤ transactions  inline ledger — search · filter · edit · CSV

     ③ is the only home for a balance edit, a rename and an account's
     history — all three used to live in three separate places.

     Every backend call from the modal is intact, none added:
       getBankBalances · updateBankBalances · getUsdToLkrRate
       getBankTransactions · addBankTransaction ·
       updateBankTransaction · deleteBankTransaction ·
       getAdditionalDropdownValues

     KPIs, sparklines, recent pairs and the ribbon are all derived
     client-side from those same two arrays — zero extra round trips.

     Talks to render.html through four hooks only:
       in  — bankLoad() · #bank-root      (_doShowPage, reloadPage)
       out — haptic() · reloadPage('port')

     moneyToggle() is redefined here as showPage('bank'), so the 💵
     button in every page header and the tool-wheel spoke keep working.

     Included from render.html via:  <?!= include('BankBalances'); ?>
═══════════════════════════════════════════════════════════════ -->
<style>
/* ═══════════════════════════════════════════════════════════════
   Every rule is prefixed #page-bank so it out-ranks render-style.html
   without !important. Palette is flow.html's — bright, few, distinct;
   no navy or dark-blue banks, which went muddy on this ground.
═══════════════════════════════════════════════════════════════ */

  --bk-cyan:#00d4ff; --bk-purple:#a855f7; --bk-gold:#ffd700;

  --bk-mut:rgba(255,255,255,.34);

}

/* ═══ ① COMMAND BAR ═══════════════════════════════════════════ */

/* ═══ SCROLLER ════════════════════════════════════════════════ */

/* ── the arc dial ──────────────────────────────────────────────

#page-bank .bk-arcs{position:relative;width:268px;height:268px;}

/* ═══ ③ ACCOUNTS — the passbook shelf ═════════════════════════

═══════════════════════════════════════════════════════════════ */
#page-bank .bk-mini{

/* paper block — the page edges peeking out of the fore-edge.

#page-bank .bk-pages{
  position:absolute;top:5px;bottom:5px;right:-1px;
  width:var(--bk-thick,9px);border-radius:0 5px 5px 0;

  <div class="bk-confirm-bg" id="bkConfirmBg">
    <div class="bk-confirm">
      <div class="bk-confirm-msg" id="bkConfirmMsg">Are you sure?</div>
      <div class="bk-confirm-btns">
        <button class="bk-cbtn no"  id="bkConfirmNo"  type="button" onclick="bkConfirmClose(false)">Cancel</button>
        <button class="bk-cbtn yes" id="bkConfirmYes" type="button" onclick="bkConfirmClose(true)">Confirm</button>
      </div>
    </div>
  </div>

  <div class="bk-toast" id="bkToast"></div>
</section>

<script>
/* ═══════════════════════════════════════════════════════════════
   BANK PAGE — state
   _bkData         [{row, source, amount}]  from getBankBalances()
   _bkTxns         [{row, date, source, destination, amount, reference}]
   _bkExtras       [String]                 non-bank dropdown values
   _bkDirty        {rowKey:true}            accounts edited but unsaved
═══════════════════════════════════════════════════════════════ */
var _bkData    = [];
var _bkTxns    = [];
var _bkExtras  = [];
var _bkRate    = 0;
var _bkDirty   = {};
var _bkEditRow = -1;
var _bkOpenBook = -1;   /* index of the passbook currently open, -1 = shelf */
var _bkPage    = 1;
var _bkQuery   = '';
var _bkBankFilter = 'all';
var _bkRangeDays  = 90;
/* Transfer fee — charged to the source only, never written to the sheet.
   Pinning keeps it across transfers instead of clearing it each time. */
var _bkFeePin  = false;
var _bkFeeVal  = 25;
const _BK_FEE_DEFAULT = 25;
var _bkConfirmCb  = null;
var _bkBuilt   = false;
var _bkPending = 0;
const _BK_PAGE_SIZE = 20;

/* ── Data colours, taken from the expense page's category palette
      (EXP_CAT_COLORS / EXP_FALLBACK in render.html) so a bank reads the
      same weight as a spend category. These are the muted 500-level
      hues, not the neon accents — the neon stays for UI chrome only. ── */
/* None of these may equal a colour in _BK_KNOWN below, or an unnamed
   account can come out the same shade as COMMERCIAL or SAMPATH. */
var _BK_PALETTE = ['#f97316','#ec4899','#38bdf8','#84cc16','#c084fc',
                   '#2dd4bf','#facc15','#94a3b8'];
var _BK_KNOWN = {
  /* Re-stepped so every pair clears the colour-blind separation floor:
     the old orange/red (NDB vs SAMPATH) and cyan/green (COMMERCIAL vs NTB)
     were indistinguishable to a deuteranope, and near-identical to anyone. */
  'boc':        {c:'#d97f0a', fg:'#1f2937', full:'Bank of Ceylon'},
  'hnb':        {c:'#8b5cf6', fg:'#ffffff', full:'Hatton National'},
  'commercial': {c:'#0aa8c7', fg:'#04222b', full:'Commercial Bank'},
  'sampath':    {c:'#f2385a', fg:'#ffffff', full:'Sampath Bank'},
  'ntb':        {c:'#4ade80', fg:'#04120a', full:'Nations Trust'}
};
function bkStyle(name){
  var n = String(name || '').toLowerCase();
  for (var k in _BK_KNOWN){ if (n.indexOf(k) > -1) return _BK_KNOWN[k]; }
  /* stable hue for anything not in the known list */
  var h = 0;
  for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0;
  var c = _BK_PALETTE[h % _BK_PALETTE.length];
  return {c:c, fg:'#04222b', full:''};
}
function bkColorOf(name){
  var n = String(name || '').toLowerCase();
  for (var i = 0; i < _bkData.length; i++){
    if (String(_bkData[i].source).toLowerCase() === n) return bkStyle(_bkData[i].source).c;
  }
  return 'rgba(255,255,255,.26)';
}

/* ── formatting ── */
/* escapes quotes too — these strings land inside value="" and title="" */
function bkEsc(s){
  var d = document.createElement('div');
  d.textContent = (s === 0 ? '0' : (s || ''));
  return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function bkLkr(n, dec){
  dec = dec || 0;
  return '₨ ' + (Number(n) || 0).toLocaleString('en-US', {minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function bkUsd(n){ return '$' + (Number(n) || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function bkPct(n, total){ return total > 0 ? (n / total * 100).toFixed(1) + '%' : '0%'; }
function bkTotal(){ return _bkData.reduce(function(s, b){ return s + (Number(b.amount) || 0); }, 0); }
function bkDate(v){ var d = new Date(v); return isNaN(d.getTime()) ? null : d; }
function bkDaysAgo(d){ return Math.floor((Date.now() - d.getTime()) / 86400000); }
function bkAgo(d){
  if (!d) return 'never';
  var n = bkDaysAgo(d);
  if (n <= 0) return 'today';
  if (n === 1) return 'yesterday';
  if (n < 30) return n + ' days ago';
  if (n < 365) return Math.round(n / 30) + ' mo ago';
  return Math.round(n / 365) + ' yr ago';
}

/* ═══ CONFIRM / TOAST ═════════════════════════════════════════ */
function bkConfirm(msg, cb, isAlert){
  _bkConfirmCb = cb;
  document.getElementById('bkConfirmMsg').textContent = msg;
  var yes = document.getElementById('bkConfirmYes'), no = document.getElementById('bkConfirmNo');
  no.style.display = isAlert ? 'none' : '';
  yes.textContent = isAlert ? 'OK' : 'Confirm';
  yes.classList.toggle('yes', !isAlert);
  document.getElementById('bkConfirmBg').classList.add('open');
}
function bkAlert(msg, cb){ bkConfirm(msg, cb, true); }
function bkConfirmClose(ok){
  document.getElementById('bkConfirmBg').classList.remove('open');
  var cb = _bkConfirmCb; _bkConfirmCb = null;
  if (cb) cb(ok);
}
var _bkToastT = null;
function bkToast(msg, kind){
  var t = document.getElementById('bkToast');
  t.textContent = msg;
  t.className = 'bk-toast show' + (kind ? ' ' + kind : '');
  clearTimeout(_bkToastT);
  _bkToastT = setTimeout(function(){ t.className = 'bk-toast' + (kind ? ' ' + kind : ''); }, 2600);
}

/* ═══ LOAD ════════════════════════════════════════════════════ */
function bankLoad(){
  _bkBuilt = false;
  _bkDirty = {};
  _bkEditRow = -1;
  _bkOpenBook = -1;
  _bkPage = 1;
  document.getElementById('bank-root').innerHTML =
    '<div class="bk-loading"><div class="bk-spin"></div><div>Loading bank data…</div></div>';
  bkRefreshSaveBtn();

  bkLoadFeePin();

  _bkPending = 2;
  function done(){ if (--_bkPending <= 0) bkBuild(); }

  google.script.run
    .withSuccessHandler(function(d){ _bkData = d || []; done(); })
    .withFailureHandler(function(e){
      document.getElementById('bank-root').innerHTML =
        '<div class="bk-loading"><div style="font-size:30px">⚠</div><div style="color:var(--red)">' +
        bkEsc(e.message || e) + '</div></div>';
      _bkPending = -99;
    })
    .getBankBalances();

  google.script.run
    .withSuccessHandler(function(t){ _bkTxns = t || []; done(); })
    .withFailureHandler(function(){ _bkTxns = []; done(); })
    .getBankTransactions();

  /* both of these only enrich the page — they never gate the first paint */
  bkFetchRate();
  google.script.run
    .withSuccessHandler(function(v){ _bkExtras = v || []; if (_bkBuilt) bkFillSelects(); })
    .withFailureHandler(function(){ _bkExtras = []; })
    .getAdditionalDropdownValues();
}

function bkFetchRate(){
  var badge = document.getElementById('bkFx'), val = document.getElementById('bkFxVal');
  badge.classList.add('loading');
  val.textContent = '…';
  google.script.run
    .withSuccessHandler(function(r){
      _bkRate = parseFloat(r) || 0;
      badge.classList.remove('loading');
      val.textContent = _bkRate > 0 ? _bkRate.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : 'N/A';
      /* patch only the USD captions — a full re-render here made the hero
         and the passbooks flash a second time right after first paint */
      if (_bkBuilt){ bkPaintUsd(); bkRefreshTransfer(); bkConvFromUsd(); }
    })
    .withFailureHandler(function(){
      _bkRate = 0; badge.classList.remove('loading'); val.textContent = 'N/A';
    })
    .getUsdToLkrRate();
}

/* every element that prints a USD figure carries its LKR amount on
   data-lkr, so the rate can land without redrawing whole sections */
function bkPaintUsd(){
  var nodes = document.querySelectorAll('[data-lkr]');
  for (var i = 0; i < nodes.length; i++){
    var el = nodes[i], amt = parseFloat(el.getAttribute('data-lkr')) || 0;
    var tail = el.getAttribute('data-usd-tail') || '';
    el.innerHTML = (_bkRate > 0 ? '\u2248 ' + bkUsd(amt / _bkRate) + ' USD' : '\u2248 \u2014 USD') + tail;
  }
  var rateHost = document.getElementById('bkHeroRate');
  if (rateHost) rateHost.innerHTML = _bkRate > 0 ? ' <em>@ ' + _bkRate.toFixed(2) + '</em>' : '';
}

/* ═══ BUILD — the page shell is written once, sections re-render ═ */
function bkBuild(){
  document.getElementById('bank-root').innerHTML =
    '<div id="bkSecOverview"></div>' +
    '<div id="bkSecAccounts"></div>' +
    '<div id="bkSecMove"></div>' +
    '<div id="bkSecTxns"></div>';
  _bkBuilt = true;
  bkRenderOverview();
  bkRenderAccounts();
  bkRenderMove();
  bkRenderTxnPanel();
  bkBindScrollSpy();
}

/* ═══ ② OVERVIEW ══════════════════════════════════════════════ */
function bkRenderOverview(){
  if (!_bkBuilt) return;
  var total = bkTotal();
  var host = document.getElementById('bkSecOverview');

  if (!_bkData.length){
    host.innerHTML = '<div class="bk-panel"><div class="bk-empty">' +
      'No bank rows found in Portfolio G1:I10. Add rows tagged BANK or TEMP to see them here.</div></div>';
    return;
  }

  var sorted = _bkData.slice().sort(function(a,b){ return b.amount - a.amount; });
  var stats = bkTxnStats();
  var rings = bkRings(sorted, total);

  host.innerHTML =
    '<div class="bk-hero">' +
      '<div class="bk-hero-in">' +
        '<div class="bk-arcs">' + bkArcSvg(rings, total) + '</div>' +
        '<div>' +
          '<div class="bk-hero-lbl"><i></i>Total liquid balance · ' + _bkData.length + ' account' + (_bkData.length === 1 ? '' : 's') + '</div>' +
          '<div class="bk-hero-amt">' + bkLkr(total, 2) + '</div>' +
          '<div class="bk-hero-usd" data-lkr="' + total + '" data-usd-tail="<span id=&quot;bkHeroRate&quot;></span>">' +
              (_bkRate > 0 ? '≈ ' + bkUsd(total / _bkRate) + ' USD' : '≈ — USD') +
              '<span id="bkHeroRate">' + (_bkRate > 0 ? ' <em>@ ' + _bkRate.toFixed(2) + '</em>' : '') + '</span>' +
          '</div>' +
          '<div class="bk-rings">' + rings.map(function(r){
              return '<div class="bk-ring" title="' + bkEsc(r.title) + '">' +
                '<i style="background:' + r.c + '"></i>' +
                '<b>' + bkEsc(r.name) + '</b>' +
                '<span class="bk-ring-amt">' + bkLkr(r.amount) + '</span>' +
                '<span class="bk-ring-pct">' + bkPct(r.amount, total) + '</span></div>';
            }).join('') + '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<div class="bk-panel">' +
      '<div class="bk-panel-hdr"><i style="background:var(--bk-cyan)"></i>Activity' +
        '<span class="bk-panel-sub">last 30 days</span></div>' +
      '<div class="bk-kpis">' +
        '<div class="bk-kpi"><span class="bk-kpi-k">Moved · 30 days</span>' +
          '<span class="bk-kpi-v">' + bkLkr(stats.moved30) + '</span>' +
          '<span class="bk-kpi-s">across ' + stats.count30 + ' transfer' + (stats.count30 === 1 ? '' : 's') + '</span></div>' +
        '<div class="bk-kpi"><span class="bk-kpi-k">Last transfer</span>' +
          '<span class="bk-kpi-v">' + (stats.last ? bkAgo(stats.last.d) : '—') + '</span>' +
          '<span class="bk-kpi-s">' + (stats.last
              ? bkEsc(stats.last.t.source) + ' → ' + bkEsc(stats.last.t.destination) + ' · ' + bkLkr(stats.last.t.amount)
              : 'no transfers logged') + '</span></div>' +
        (stats.idle
          ? '<div class="bk-kpi warn"><span class="bk-kpi-k">Idle &gt; 60 days</span>' +
            '<span class="bk-kpi-v">' + bkEsc(stats.idle.source) + '</span>' +
            '<span class="bk-kpi-s">' + bkLkr(stats.idle.amount) + ' untouched</span></div>'
          : '<div class="bk-kpi"><span class="bk-kpi-k">Idle accounts</span>' +
            '<span class="bk-kpi-v">None</span>' +
            '<span class="bk-kpi-s">every account moved &lt; 60d</span></div>') +
      '</div>' +
    '</div>';

}


/* derived facts — no extra backend calls */
function bkTxnStats(){
  var cut30 = Date.now() - 30 * 86400000, moved30 = 0, count30 = 0, last = null;
  var lastPer = {};
  _bkTxns.forEach(function(t){
    var d = bkDate(t.date);
    if (!d) return;
    if (d.getTime() >= cut30){ moved30 += Number(t.amount) || 0; count30++; }
    if (!last || d.getTime() > last.d.getTime()) last = {d:d, t:t};
    [t.source, t.destination].forEach(function(n){
      var k = String(n || '').toLowerCase();
      if (!lastPer[k] || d.getTime() > lastPer[k].getTime()) lastPer[k] = d;
    });
  });
  var idle = null;
  _bkData.forEach(function(b){
    var d = lastPer[String(b.source).toLowerCase()];
    var days = d ? bkDaysAgo(d) : 999;
    if (days > 60 && b.amount > 0 && (!idle || b.amount > idle.amount)) idle = b;
  });
  return {moved30:moved30, count30:count30, last:last, idle:idle, lastPer:lastPer};
}

/* ═══ THE ARC DIAL ════════════════════════════════════════════
   Concentric rings, one per holding, outermost = largest. Each ring
   is a full track with a coloured arc swept over it, so a 0.1%
   account is still a visible tick on its own circle instead of a
   sub-pixel pie slice. Past four holdings the tail folds into one
   "Other" ring — its members are listed in its tooltip.
═══════════════════════════════════════════════════════════════ */
var BK_MAX_RINGS = 4;

function bkRings(sorted, total){
  if (sorted.length <= BK_MAX_RINGS){
    return sorted.map(function(b){
      return {name:b.source, amount:b.amount, c:bkStyle(b.source).c,
              title:b.source + ' · ' + bkLkr(b.amount) + ' · ' + bkPct(b.amount, total)};
    });
  }
  var head = sorted.slice(0, BK_MAX_RINGS - 1).map(function(b){
    return {name:b.source, amount:b.amount, c:bkStyle(b.source).c,
            title:b.source + ' · ' + bkLkr(b.amount) + ' · ' + bkPct(b.amount, total)};
  });
  var tail = sorted.slice(BK_MAX_RINGS - 1);
  var sum  = tail.reduce(function(a, b){ return a + b.amount; }, 0);
  head.push({
    name:'Other · ' + tail.length + ' accounts',
    amount:sum,
    c:'#56637a',
    title:tail.map(function(b){ return b.source + ' ' + bkLkr(b.amount); }).join('  ·  ')
  });
  return head;
}

/* 276-unit box, rings stepped inward by 22 with a 15-wide stroke, so
   four of them clear the centred total without crowding it. */
function bkArcSvg(rings, total){
  var CX = 138, R0 = 120, STEP = 22, SW = 15;
  var track = '', arc = '';
  rings.forEach(function(r, i){
    var rad  = R0 - i * STEP;
    var circ = 2 * Math.PI * rad;
    var len  = total > 0 ? circ * Math.max(r.amount, 0) / total : 0;
    track += '<circle cx="' + CX + '" cy="' + CX + '" r="' + rad + '" fill="none" ' +
             'stroke="rgba(255,255,255,.05)" stroke-width="' + SW + '"></circle>';
    arc   += '<circle class="bk-arc" cx="' + CX + '" cy="' + CX + '" r="' + rad + '" fill="none" ' +
             'stroke="' + r.c + '" stroke-width="' + SW + '" stroke-linecap="round" ' +
             'stroke-dasharray="' + len.toFixed(1) + ' ' + circ.toFixed(1) + '" ' +
             'transform="rotate(-90 ' + CX + ' ' + CX + ')">' +
             '<title>' + bkEsc(r.name) + ' · ' + bkPct(r.amount, total) + '</title></circle>';
  });
  return '<svg viewBox="0 0 276 276" role="img" aria-label="Share of liquid cash by account">' +
    track + arc +
    '<text x="' + CX + '" y="' + (CX - 6) + '" text-anchor="middle" fill="rgba(255,255,255,.34)" ' +
      'font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="800" letter-spacing="1.8">TOTAL LIQUID</text>' +
    '<text x="' + CX + '" y="' + (CX + 19) + '" text-anchor="middle" fill="rgba(255,255,255,.92)" ' +
      'font-family="Inter,system-ui,sans-serif" font-size="22" font-weight="900" letter-spacing="-.8">' + bkLkr(total) + '</text>' +
  '</svg>';
}

/* ═══ ③ ACCOUNTS — the passbook shelf ═════════════════════════
   Closed books sit on a shelf; opening one turns to a two-leaf
   spread whose right page is that account's ledger. The book is
   therefore the only home for a balance edit, a rename, and an
   account's history — all three used to live in three places.
═══════════════════════════════════════════════════════════════ */
/* ── colour helpers ───────────────────────────────────────────
   Every shade on a cover is mixed here rather than in CSS, so the
   page doesn't depend on color-mix() being available.           */
function bkHexRgb(hex){
  var h = String(hex).replace('#','');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function bkMix(a, b, p){           /* p = how much of `a`, 0..1 */
  var A = bkHexRgb(a), B = bkHexRgb(b);
  return 'rgb(' + A.map(function(v, i){ return Math.round(v * p + B[i] * (1 - p)); }).join(',') + ')';
}
function bkAlpha(hex, a){
  var c = bkHexRgb(hex);
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
}
function bkBookVars(c){
  return '--bk-c:' + c + ';' +
    '--bk-cov1:'  + bkMix(c, '#0b1020', .32) + ';' +
    '--bk-cov2:'  + bkMix(c, '#070c18', .15) + ';' +
    '--bk-cov3:'  + bkMix(c, '#0a0f1c', .26) + ';' +
    '--bk-spn1:'  + bkMix(c, '#05080f', .54) + ';' +
    '--bk-spn2:'  + bkMix(c, '#05080f', .20) + ';' +
    '--bk-foil:'  + bkMix(c, '#fff8dc', .74) + ';' +
    '--bk-lite:'  + bkMix(c, '#ffffff', .70) + ';' +
    '--bk-seal1:' + bkMix(c, '#ffffff', .82) + ';' +
    '--bk-seal2:' + bkMix(c, '#06263a', .58) + ';' +
    '--bk-tint:'  + bkMix(c, '#ffffff', .22) + ';' +
    '--bk-tintb:' + bkMix(c, '#2b2318', .5)  + ';' +
    '--bk-ring:'  + bkAlpha(c, .42) + ';' +
    '--bk-glow:'  + bkAlpha(c, .22) + ';' +
    /* the watermarked page: near-white stock, the hue only in the
       monogram, the heavy rules, the figures and the gutter shadow */
    '--bk-wm:'    + bkAlpha(c, .12) + ';' +
    '--bk-fig:'   + bkMix(c, '#0a0e13', .14) + ';' +
    '--bk-ruleh:' + bkAlpha(bkMix(c, '#2b2318', .5), .55) + ';' +
    '--bk-gut:'   + bkAlpha(bkMix(c, '#2b2318', .45), .30) + ';' +
    '--bk-hov:'   + bkAlpha(c, .08) + ';';
}

/* ── this account's transfers, newest first, with a running balance ──
   The sheet stores no per-row balance, so replay backwards from the
   balance we hold now: the newest row closes at today's figure.     */
function bkLedgerRows(name, current){
  var mine = _bkTxns.filter(function(t){ return t.source === name || t.destination === name; });
  var running = current, out = [];
  mine.forEach(function(t){
    var amt = Number(t.amount) || 0;
    var isOut = (t.source === name);
    out.push({ t:t, isOut:isOut, amount:amt, after:running, d:bkDate(t.date) });
    running -= isOut ? -amt : amt;       /* undo this row to reach the one before */
  });
  return out;
}

function bkSpark(name, current){
  var rows = bkLedgerRows(name, current).slice(0, 7);
  var pts = [current];
  rows.forEach(function(r){ pts.unshift(r.after - (r.isOut ? -r.amount : r.amount)); });
  if (pts.length < 2) pts = [current, current];

  var w = 150, h = 34, min = Math.min.apply(null, pts), max = Math.max.apply(null, pts), rng = (max - min) || 1;
  var xy = pts.map(function(v, i){
    var x = (i / (pts.length - 1)) * (w - 2) + 1;
    var y = h - 4 - ((v - min) / rng) * (h - 9);
    return [x, y];
  });
  var line = xy.map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  var area = line + ' ' + (w - 1).toFixed(1) + ',' + (h - 1) + ' 1,' + (h - 1);
  var last = xy[xy.length - 1];
  var c = bkStyle(name).c;
  return '<svg width="100%" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<polygon points="' + area + '" fill="' + bkAlpha(c, .14) + '"/>' +
    '<polyline points="' + line + '" fill="none" stroke="' + bkMix(c, '#2b2318', .45) + '" stroke-width="1.4" ' +
      'stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="2.4" fill="' + bkMix(c, '#1a1208', .7) + '"/></svg>';
}

/* ── the shelf ───────────────────────────────────────────────── */
function bkRenderAccounts(){
  if (!_bkBuilt) return;
  var total = bkTotal();
  var stats = bkTxnStats();
  var host  = document.getElementById('bkSecAccounts');

  if (!_bkData.length){
    host.innerHTML =
      '<div class="bk-panel">' +
        '<div class="bk-panel-hdr"><i style="background:var(--bk-gold)"></i>Accounts</div>' +
        '<div class="bk-empty">No bank rows found in Portfolio G1:I10. ' +
          'Add rows tagged BANK or TEMP to see them here.</div>' +
      '</div>';
    return;
  }

  var books = _bkData.map(function(b, i){
    var st    = bkStyle(b.source);
    var dirty = !!_bkDirty[b.row];
    var lastD = stats.lastPer[String(b.source).toLowerCase()];
    /* only meaningful once there is a ledger to be idle against */
    var idle  = _bkTxns.length > 0 && (!lastD || bkDaysAgo(lastD) > 60);
    var mine  = _bkTxns.filter(function(t){ return t.source === b.source || t.destination === b.source; });
    /* fore-edge thickness reads the share of total, 7px → 20px */
    var thick = total > 0 ? 7 + Math.round((b.amount / total) * 34) : 9;
    if (thick > 20) thick = 20;

    var badges = '';
    if (dirty) badges += '<span class="bk-cbadge unsaved">● unsaved</span>';
    else if (idle) badges += '<span class="bk-cbadge idle">idle</span>';

    return '' +
    '<button class="bk-book' + (dirty ? ' dirty' : '') + (idle && !dirty ? ' idle' : '') + '" type="button" ' +
        'style="' + bkBookVars(st.c) + '--bk-thick:' + thick + 'px" ' +
        'onclick="bkOpenBook(' + i + ')" ' +
        'aria-label="Open the ' + bkEsc(b.source) + ' passbook">' +
      '<span class="bk-pages"></span>' +
      '<span class="bk-cover">' +
        '<span class="bk-spine"></span>' +
        '<span class="bk-badge-row">' + badges + '</span>' +
        '<span class="bk-foil">' + bkEsc(b.source || 'UNNAMED') + '</span>' +
        '<span class="bk-foil-sub">' + bkEsc(st.full || 'Savings account') + '</span>' +
        '<span class="bk-rule"></span>' +
        '<span class="bk-cover-mid">' +
          '<span class="bk-cover-lbl">Balance carried forward</span>' +
          '<span class="bk-cover-amt">' + bkLkr(b.amount, 2) + '</span>' +
          '<span class="bk-cover-usd" data-lkr="' + b.amount + '">' +
            (_bkRate > 0 ? '≈ ' + bkUsd(b.amount / _bkRate) + ' USD' : '≈ — USD') + '</span>' +
        '</span>' +
        '<span class="bk-cover-foot">' +
          '<span>' + mine.length + ' entr' + (mine.length === 1 ? 'y' : 'ies') + ' · ' + bkAgo(lastD) + '</span>' +
          '<span class="bk-share">' + bkPct(b.amount, total) + '</span>' +
        '</span>' +
      '</span>' +
    '</button>';
  }).join('');

  host.innerHTML =
    '<div class="bk-panel">' +
      '<div class="bk-panel-hdr"><i style="background:var(--bk-gold)"></i>Passbooks' +
        '<span class="bk-panel-sub" id="bkShelfSub">' + _bkData.length +
          ' on the shelf · tap one to open it</span></div>' +
      '<div class="bk-shelf-bar" id="bkShelfBar" style="display:none;">' +
        '<button class="bk-mini" type="button" onclick="bkCloseBook()">← Back to the shelf</button>' +
        '<span class="sp"></span>' +
        '<button class="bk-mini" type="button" onclick="bkFlipBook(-1)" title="Previous passbook">‹</button>' +
        '<button class="bk-mini" type="button" onclick="bkFlipBook(1)" title="Next passbook">›</button>' +
      '</div>' +
      '<div class="bk-shelf" id="bkShelf">' + books + '</div>' +
      '<div class="bk-spread" id="bkSpread"></div>' +
    '</div>';

  if (_bkOpenBook >= 0 && _bkOpenBook < _bkData.length) bkRenderSpread();
}

/* ── open / close / flip ─────────────────────────────────────── */
function bkOpenBook(i){
  _bkOpenBook = i;
  bkRenderSpread();
  if (typeof haptic === 'function') haptic('select');
}
function bkCloseBook(){
  _bkOpenBook = -1;
  var shelf = document.getElementById('bkShelf'), spread = document.getElementById('bkSpread'),
      bar = document.getElementById('bkShelfBar'), sub = document.getElementById('bkShelfSub');
  if (shelf)  shelf.classList.remove('hidden');
  if (spread){ spread.classList.remove('open'); spread.innerHTML = ''; }
  if (bar)    bar.style.display = 'none';
  if (sub)    sub.textContent = _bkData.length + ' on the shelf · tap one to open it';
  if (typeof haptic === 'function') haptic('tick');
}
function bkFlipBook(dir){
  if (_bkOpenBook < 0 || !_bkData.length) return;
  _bkOpenBook = (_bkOpenBook + dir + _bkData.length) % _bkData.length;
  bkRenderSpread();
  if (typeof haptic === 'function') haptic('tick');
}

/* ── the open spread ─────────────────────────────────────────── */
function bkRenderSpread(){
  var i = _bkOpenBook;
  var b = _bkData[i];
  var spread = document.getElementById('bkSpread');
  if (!b || !spread){ bkCloseBook(); return; }

  var st = bkStyle(b.source), total = bkTotal();

  var rows = bkLedgerRows(b.source, b.amount);
  var cut = Date.now() - 90 * 86400000, inAmt = 0, outAmt = 0;
  rows.forEach(function(r){
    if (!r.d || r.d.getTime() < cut) return;
    if (r.isOut) outAmt += r.amount; else inAmt += r.amount;
  });

  var shown = rows.slice(0, 12);
  var ledger = shown.length
    ? '<table class="bk-ledger">' +
        '<thead><tr>' +
          '<th style="width:62px">Date</th><th>Particulars</th>' +

            '<td class="part">' + bkEsc(other) +
              (r.t.reference ? '<i>' + bkEsc(r.t.reference) + '</i>' : '') + '</td>' +
            '<td class="r wd">' + (r.isOut  ? bkLkr(r.amount) : '') + '</td>' +
            '<td class="r dp">' + (!r.isOut ? bkLkr(r.amount) : '') + '</td>' +
            '<td class="r bal">' + bkLkr(r.after) + '</td>' +
          '</tr>';
        }).join('') +
        '<tr class="cf"><td colspan="4">Balance carried forward</td>' +
          '<td class="r">' + bkLkr(b.amount, 2) + '</td></tr>' +
      '</tbody></table>'
    : '<div class="bk-ledger-empty">No entries posted to this account yet.<br>' +
      'Transfers logged in Move Money appear here.</div>';

  spread.setAttribute('style', bkBookVars(st.c));

    '<div class="bk-spread-in">' +

      '<div class="bk-leaf left">' +
        '<span class="bk-wm">' + bkEsc(mono) + '</span>' +
        '<div class="bk-crest">' +
          '<div class="bk-crest-seal">' + bkEsc(mono) + '</div>' +

            '<span>' + bkEsc(st.full || 'Savings account') + '</span></div>' +
        '</div>' +

        '<div class="bk-stamp">' +
          '<div class="bk-stamp-lbl">Balance carried forward</div>' +
          '<div class="bk-stamp-amt" id="bkStampAmt">' + bkLkr(b.amount, 2) + '</div>' +
          '<div class="bk-stamp-sub">' +
            (_bkRate > 0 ? '≈ ' + bkUsd(b.amount / _bkRate) + ' USD · ' : '') +
            bkPct(b.amount, total) + ' of liquid</div>' +
        '</div>' +

        '<div class="bk-flow">' +
          '<div class="bk-flow-cell in"><span>Deposited · 90d</span><b>' + bkLkr(inAmt) + '</b></div>' +
          '<div class="bk-flow-cell out"><span>Withdrawn · 90d</span><b>' + bkLkr(outAmt) + '</b></div>' +
        '</div>' +

        '<div class="bk-trend">' +
          '<div class="bk-trend-lbl">Balance over the last ' + Math.min(rows.length, 7) + ' entries</div>' +
          bkSpark(b.source, b.amount) +
        '</div>' +

        '<div class="bk-leaf-acts">' +
          '<button class="bk-ink-btn primary" type="button" onclick="bkEditAmount(' + i + ')">✎ Edit balance</button>' +
          '<button class="bk-ink-btn" type="button" onclick="bkRenameAccount(' + i + ')">Rename</button>' +

      '</div>' +

  var bar = document.getElementById('bkShelfBar');
  if (bar) bar.style.display = 'flex';

/* ── edits, made on the open page ────────────────────────────── */
function bkEditAmount(i){
  if (_bkOpenBook !== i){ bkOpenBook(i); }
  var cell = document.getElementById('bkStampAmt');
  if (!cell || cell.querySelector('input')) return;
  var b = _bkData[i];
  cell.innerHTML = '<input type="number" step="0.01" value="' + b.amount + '" aria-label="' + bkEsc(b.source) + ' balance">';
  var inp = cell.querySelector('input');
  inp.focus(); inp.select();
  var done = false;
  function commit(){
    if (done) return;
    done = true;
    var v = parseFloat(inp.value);
    if (isNaN(v)) v = b.amount;
    if (v !== b.amount){ b.amount = v; _bkDirty[b.row] = true; if (typeof haptic === 'function') haptic('tick'); }
    bkRefreshSaveBtn();
    bkRenderAccounts();
    bkRenderOverview();
    bkRefreshTransfer();
  }
  inp.addEventListener('blur', commit);
  inp.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ inp.blur(); }
    if (e.key === 'Escape'){ done = true; bkRenderSpread(); }
  });
}

function bkRenameAccount(i){
  var b = _bkData[i];
  var name = window.prompt('Rename this account', b.source);
  if (name === null) return;
  name = name.trim();
  if (!name || name === b.source) return;
  b.source = name;
  _bkDirty[b.row] = true;
  bkRefreshSaveBtn();
  bkRenderAccounts();
  bkRenderOverview();
  bkRenderMove();
}

/* jump to Move Money with this account preselected as the source */
function bkTransferFrom(i){
  var sel = document.getElementById('bkFrom');
  if (sel){
    sel.value = 'bank_' + i;
    if (document.getElementById('bkTo').value === sel.value){
      var other = (i === 0 && _bkData.length > 1) ? 1 : 0;
      document.getElementById('bkTo').value = 'bank_' + other;
    }
    bkRefreshTransfer();
  }
  bkGoSec('bkSecMove');
}

function bkRefreshSaveBtn(){
  var n = Object.keys(_bkDirty).length;
  var btn = document.getElementById('bkSaveBtn');
  if (!btn) return;
  btn.disabled = n === 0;
  btn.classList.toggle('armed', n > 0);
  btn.textContent = n === 0 ? '💾 Saved' : '💾 Save ' + n + ' change' + (n === 1 ? '' : 's');
}

function bkSave(){
  var btn = document.getElementById('bkSaveBtn');
  var old = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Saving…';
  google.script.run
    .withSuccessHandler(function(){
      _bkDirty = {};
      bkRefreshSaveBtn();
      bkRenderAccounts();
      bkToast('Balances saved', 'good');
      if (typeof haptic === 'function') haptic('select');
      /* Summary reads the same Portfolio cells — keep it honest */
      if (typeof _spaLoaded !== 'undefined') _spaLoaded.port = false;
    })
    .withFailureHandler(function(e){
      btn.disabled = false;
      btn.textContent = old;
      bkAlert('Failed to save: ' + (e.message || e));
    })
    .updateBankBalances(_bkData);
}

/* ── the fee pin ──────────────────────────────────────────────
   Pinned, the fee survives each transfer and is remembered for the
   next visit; unpinned, it clears once the transfer is logged.
   Browser storage can throw or come back empty, so every read and
   write is guarded and the panel works without it.              */
function bkLoadFeePin(){
  try {
    var raw = localStorage.getItem('bkFeePin');
    if (raw){
      var o = JSON.parse(raw);
      _bkFeePin = !!o.on;
      _bkFeeVal = (typeof o.val === 'number' && o.val >= 0) ? o.val : _BK_FEE_DEFAULT;
    }
  } catch(e){ /* private window, blocked storage — carry on unpinned */ }
}
function bkSaveFeePin(){
  try { localStorage.setItem('bkFeePin', JSON.stringify({on:_bkFeePin, val:_bkFeeVal})); }
  catch(e){ /* nothing to do — the pin just won't outlive the session */ }
}
function bkApplyFeePin(){
  var inp = document.getElementById('bkFee'), pin = document.getElementById('bkFeePin');
  if (!inp || !pin) return;
  pin.classList.toggle('on', _bkFeePin);
  pin.setAttribute('aria-pressed', _bkFeePin ? 'true' : 'false');
  pin.title = _bkFeePin ? 'Fee is pinned — it stays between transfers' : 'Pin the fee so it stays between transfers';
  if (_bkFeePin) inp.value = _bkFeeVal;
  bkFeeHint();
}
function bkToggleFeePin(){
  _bkFeePin = !_bkFeePin;
  var inp = document.getElementById('bkFee');
  if (_bkFeePin){
    /* a pin with nothing to hold isn't a pin — start it at the default */
    var v = parseFloat(inp.value);
    _bkFeeVal = (!isNaN(v) && v > 0) ? v : _BK_FEE_DEFAULT;
    inp.value = _bkFeeVal;
  } else {
    inp.value = '';
  }
  bkSaveFeePin();
  bkApplyFeePin();
  bkRefreshTransfer();
  if (typeof haptic === 'function') haptic('tick');
}
function bkFeeTyped(){
  if (_bkFeePin){
    _bkFeeVal = parseFloat(document.getElementById('bkFee').value) || 0;
    bkSaveFeePin();
  }
  bkRefreshTransfer();
}
function bkFeeHint(){
  var h = document.getElementById('bkFeeHint');
  if (!h) return;
  h.textContent = _bkFeePin ? 'pinned at ₨' + _bkFeeVal.toLocaleString('en-US') + ' — stays after each transfer'
                            : 'charged to the source, not logged';
  h.classList.toggle('fee', _bkFeePin);
}

function bkRecentPairs(){
  var seen = {}, out = [];
  for (var i = 0; i < _bkTxns.length && out.length < 3; i++){
    var t = _bkTxns[i];
    var k = t.source + '→' + t.destination;
    if (seen[k]) continue;
    seen[k] = true;
    out.push({from:t.source, to:t.destination, amount:t.amount});
  }
  return out;
}
function bkUsePair(i){
  var p = bkRecentPairs()[i];
  if (!p) return;
  var from = document.getElementById('bkFrom'), to = document.getElementById('bkTo');
  bkSelectByName(from, p.from);
  bkSelectByName(to, p.to);
  document.getElementById('bkAmt').value = p.amount;
  bkRefreshTransfer();
  bkGoSec('bkSecMove');
}
function bkSelectByName(sel, name){
  for (var i = 0; i < sel.options.length; i++){
    if (sel.options[i].textContent === name){ sel.selectedIndex = i; return; }
  }
}

function bkFillSelects(){
  var from = document.getElementById('bkFrom'), to = document.getElementById('bkTo');
  if (!from || !to) return;
  var fv = from.value, tv = to.value;
  var opts = '<option value="">Select…</option>' +
    _bkData.map(function(b, i){ return '<option value="bank_' + i + '">' + bkEsc(b.source) + '</option>'; }).join('') +
    _bkExtras.map(function(v, i){ return '<option value="extra_' + i + '">' + bkEsc(v) + '</option>'; }).join('');
  from.innerHTML = opts;
  to.innerHTML = opts;
  if (fv && from.querySelector('option[value="' + fv + '"]')) from.value = fv;
  else if (_bkData.length) from.value = 'bank_0';
  if (tv && to.querySelector('option[value="' + tv + '"]')) to.value = tv;
  else if (_bkData.length > 1) to.value = 'bank_1';
}

function bkResolve(v){
  if (!v) return null;
  if (v.indexOf('bank_') === 0){
    var b = _bkData[parseInt(v.split('_')[1], 10)];
    return b ? {name:b.source, amount:b.amount, bank:b} : null;
  }
  var x = _bkExtras[parseInt(v.split('_')[1], 10)];
  return x ? {name:x, amount:null, bank:null} : null;
}

function bkSwapBanks(){
  var from = document.getElementById('bkFrom'), to = document.getElementById('bkTo');
  var a = from.value; from.value = to.value; to.value = a;
  bkRefreshTransfer();
}
function bkFillPct(p){
  var f = bkResolve(document.getElementById('bkFrom').value);
  if (!f || !f.bank) return;
  document.getElementById('bkAmt').value = Math.round(f.amount * p / 100 * 100) / 100;
  bkRefreshTransfer();
}

function bkRefreshTransfer(){
  var fromSel = document.getElementById('bkFrom');
  if (!fromSel) return;
  var f = bkResolve(fromSel.value);
  var t = bkResolve(document.getElementById('bkTo').value);
  var amt = parseFloat(document.getElementById('bkAmt').value) || 0;
  /* the fee rides on the source only: A pays amount + fee, B receives amount */
  var fee   = parseFloat(document.getElementById('bkFee').value) || 0;
  var debit = amt + fee;

  document.getElementById('bkFromBal').textContent = f ? (f.bank ? 'balance ' + bkLkr(f.amount) : 'not a tracked bank') : '';
  document.getElementById('bkToBal').textContent   = t ? (t.bank ? 'balance ' + bkLkr(t.amount) : 'not a tracked bank') : '';
  document.getElementById('bkAmtUsd').textContent  = (_bkRate > 0 && amt) ? '≈ ' + bkUsd(amt / _bkRate) + ' USD' : '≈ — USD';
  bkFeeHint();

  document.getElementById('bkPvFromName').textContent = f ? f.name : '—';
  document.getElementById('bkPvToName').textContent   = t ? t.name : '—';
  document.getElementById('bkPvFromOld').textContent  = (f && f.bank) ? bkLkr(f.amount) : '—';
  document.getElementById('bkPvToOld').textContent    = (t && t.bank) ? bkLkr(t.amount) : '—';

  var over = !!(f && f.bank && debit > f.amount);
  var fNew = document.getElementById('bkPvFromNew'), tNew = document.getElementById('bkPvToNew');
  fNew.textContent = (f && f.bank) ? bkLkr(f.amount - debit) : '—';
  tNew.textContent = (t && t.bank) ? bkLkr(t.amount + amt) : '—';
  fNew.className = over ? 'over' : 'down';
  tNew.className = 'up';

  var feeRow = document.getElementById('bkPvFeeRow');
  feeRow.style.display = fee > 0 ? '' : 'none';
  if (fee > 0) document.getElementById('bkPvFee').textContent = bkLkr(fee, 2);

  var cta = document.getElementById('bkCta');
  cta.classList.remove('over');
  if (!f || !t){ cta.disabled = true; cta.textContent = 'Pick a source and a destination'; }
  else if (fromSel.value === document.getElementById('bkTo').value){ cta.disabled = true; cta.textContent = 'Pick two different accounts'; }
  else if (amt <= 0){ cta.disabled = true; cta.textContent = 'Enter an amount'; }
  else if (over){ cta.disabled = false; cta.classList.add('over'); cta.textContent = '⚠ Transfer ' + bkLkr(amt) + ' — overdraws ' + f.name; }
  else if (fee > 0){ cta.disabled = false; cta.textContent = '⇄ Transfer ' + bkLkr(amt) + ' · ' + bkLkr(debit) + ' debited'; }
  else { cta.disabled = false; cta.textContent = '⇄ Transfer ' + bkLkr(amt); }
}

function bkTransfer(){
  var f = bkResolve(document.getElementById('bkFrom').value);
  var t = bkResolve(document.getElementById('bkTo').value);
  var amtEl = document.getElementById('bkAmt'), refEl = document.getElementById('bkRef');
  var feeEl = document.getElementById('bkFee');
  var amount = parseFloat(amtEl.value) || 0;
  var fee    = parseFloat(feeEl.value) || 0;
  var debit  = amount + fee;
  var reference = (refEl.value || '').trim();
  if (!f || !t || amount <= 0 || f.name === t.name) return;

  var run = function(){
    var cta = document.getElementById('bkCta');
    var old = cta.textContent;
    cta.disabled = true;
    cta.textContent = 'Transferring…';

    var txn = {
      date: new Date().toISOString(),
      source: f.name,
      destination: t.name,
      amount: amount,
      reference: reference
    };

    google.script.run
      .withSuccessHandler(function(){
        /* source pays the fee too; the destination only ever sees `amount`,
           which is also the figure the sheet keeps */
        if (f.bank) f.bank.amount -= debit;
        if (t.bank) t.bank.amount += amount;
        amtEl.value = ''; refEl.value = '';
        if (!_bkFeePin) feeEl.value = '';
        google.script.run
          .withSuccessHandler(function(){
            cta.disabled = false; cta.textContent = old;
            bkToast(fee > 0 ? 'Transferred ' + bkLkr(amount) + ' · ' + bkLkr(debit) + ' debited'
                            : 'Transferred ' + bkLkr(amount), 'good');
            if (typeof haptic === 'function') haptic('select');
            if (typeof _spaLoaded !== 'undefined') _spaLoaded.port = false;
            bkReloadTxns();
            bkRenderOverview(); bkRenderAccounts(); bkRefreshTransfer();
          })
          .withFailureHandler(function(e){
            cta.disabled = false; cta.textContent = old;
            bkAlert('Transfer logged, but balances did not save: ' + (e.message || e));
            bkRenderOverview(); bkRenderAccounts();
          })
          .updateBankBalances(_bkData);
      })
      .withFailureHandler(function(e){
        cta.disabled = false; cta.textContent = old;
        bkAlert('Failed to log transfer: ' + (e.message || e));
      })
      .addBankTransaction(txn);
  };

  if (f.bank && debit > f.amount){
    bkConfirm('This overdraws ' + f.name + ' by ' + bkLkr(debit - f.amount) +
              (fee > 0 ? ' (including the ' + bkLkr(fee) + ' fee)' : '') +
              '. Log it anyway?', function(ok){ if (ok) run(); });
    return;
  }
  run();
}

/* ── converter ── */
function bkConvFromUsd(){
  var u = document.getElementById('bkConvUsd'), l = document.getElementById('bkConvLkr'), h = document.getElementById('bkConvHint');
  if (!u) return;
  if (_bkRate <= 0){ h.textContent = '⏳ Fetching exchange rate…'; return; }
  var v = parseFloat(u.value) || 0;
  if (v > 0){ l.value = (v * _bkRate).toFixed(2); h.textContent = '✓ ' + bkLkr(v * _bkRate, 2) + ' at ' + _bkRate.toFixed(2); }
  else { l.value = ''; h.textContent = 'Rate ₨' + _bkRate.toFixed(2) + ' per USD'; }
}
function bkConvFromLkr(){
  var u = document.getElementById('bkConvUsd'), l = document.getElementById('bkConvLkr'), h = document.getElementById('bkConvHint');
  if (!l) return;
  if (_bkRate <= 0){ h.textContent = '⏳ Fetching exchange rate…'; return; }
  var v = parseFloat(l.value) || 0;
  if (v > 0){ u.value = (v / _bkRate).toFixed(2); h.textContent = '✓ ' + bkUsd(v / _bkRate) + ' at ' + _bkRate.toFixed(2); }
  else { u.value = ''; h.textContent = 'Rate ₨' + _bkRate.toFixed(2) + ' per USD'; }
}
function bkConvSwap(){
  var u = document.getElementById('bkConvUsd'), l = document.getElementById('bkConvLkr');
  var a = u.value; u.value = l.value; l.value = a;
  if (u.value) bkConvFromUsd(); else bkConvFromLkr();
}
function bkConvQuick(v){
  document.getElementById('bkConvUsd').value = v;
  bkConvFromUsd();
}

/* ═══ ⑤ TRANSACTIONS ══════════════════════════════════════════ */
function bkRenderTxnPanel(){
  if (!_bkBuilt) return;
  var banks = _bkData.map(function(b){ return b.source; });
  document.getElementById('bkSecTxns').innerHTML =
    '<div class="bk-panel">' +
      '<div class="bk-panel-hdr"><i style="background:var(--bk-pink)"></i>Transactions' +
        '<span class="bk-panel-sub" id="bkTxnMeta">—</span></div>' +
      '<div class="bk-filters">' +
        '<input class="bk-search" id="bkSearch" type="search" placeholder="Search source, destination or reference…" oninput="bkSearch(this.value)">' +
        '<select class="bk-sel" id="bkBankFilter" onchange="bkSetBankFilter(this.value)">' +
          '<option value="all">All banks</option>' +
          banks.map(function(b){ return '<option value="' + bkEsc(b) + '">' + bkEsc(b) + '</option>'; }).join('') +
        '</select>' +
        '<select class="bk-sel" id="bkRange" onchange="bkSetRange(this.value)">' +
          '<option value="90">Last 90 days</option>' +
          '<option value="30">Last 30 days</option>' +
          '<option value="365">Last year</option>' +
          '<option value="0">All time</option>' +
        '</select>' +
        '<button class="bk-mini" type="button" onclick="bkExportCsv()">↓ Export CSV</button>' +
      '</div>' +
      '<div class="bk-tbl-wrap">' +
        '<div class="bk-tbl-scroll">' +
          '<table class="bk-tbl">' +
            '<thead><tr>' +
              '<th style="width:84px">Date</th><th>Source</th><th>Destination</th>' +
              '<th class="r" style="width:128px">Amount</th><th>Reference</th>' +
              '<th class="r" style="width:108px">Actions</th>' +
            '</tr></thead>' +
            '<tbody id="bkTxnBody"></tbody>' +
          '</table>' +
        '</div>' +
        '<div class="bk-pager" id="bkPager"></div>' +
      '</div>' +
    '</div>';
  bkRenderTxns();
}

function bkFilteredTxns(){
  var cut = _bkRangeDays > 0 ? Date.now() - _bkRangeDays * 86400000 : 0;
  return _bkTxns.filter(function(t){
    if (cut){ var d = bkDate(t.date); if (!d || d.getTime() < cut) return false; }
    if (_bkBankFilter !== 'all' && t.source !== _bkBankFilter && t.destination !== _bkBankFilter) return false;
    if (_bkQuery){
      var hay = (t.source + ' ' + t.destination + ' ' + (t.reference || '') + ' ' + t.amount).toLowerCase();
      if (hay.indexOf(_bkQuery) === -1) return false;
    }
    return true;
  });
}

function bkGroupOf(d){
  if (!d) return 'Undated';
  var n = bkDaysAgo(d);
  if (n <= 0) return 'Today';
  if (n <= 7) return 'This week';
  if (n <= 31) return 'This month';
  return 'Earlier';
}

function bkRenderTxns(){
  var body = document.getElementById('bkTxnBody');
  if (!body) return;
  var rows = bkFilteredTxns();
  var pager = document.getElementById('bkPager');
  var meta  = document.getElementById('bkTxnMeta');

  if (!rows.length){
    body.innerHTML = '<tr><td colspan="6" class="bk-empty">' +
      (_bkTxns.length ? 'No transactions match these filters.' : 'No transactions logged yet.') + '</td></tr>';
    pager.innerHTML = '';
    meta.textContent = '0 of ' + _bkTxns.length;
    return;
  }

  var pages = Math.ceil(rows.length / _BK_PAGE_SIZE);
  if (_bkPage > pages) _bkPage = pages;
  if (_bkPage < 1) _bkPage = 1;
  var start = (_bkPage - 1) * _BK_PAGE_SIZE;
  var page = rows.slice(start, start + _BK_PAGE_SIZE);

  var html = '', grp = '';
  page.forEach(function(t){
    var idx = _bkTxns.indexOf(t);
    var d = bkDate(t.date);
    var g = bkGroupOf(d);
    if (g !== grp){ grp = g; html += '<tr class="grp"><td colspan="6">' + g + '</td></tr>'; }
    var dateStr = d ? d.toLocaleDateString('en-GB', {day:'2-digit', month:'short'}) : String(t.date).substring(0, 10);
    var rolled = /rollbacked|rolled back/i.test(t.reference || '');

    if (_bkEditRow === idx){
      html +=
        '<tr class="editing">' +
          '<td>' + dateStr + '</td>' +
          '<td><span class="bk-bchip"><i style="background:' + bkColorOf(t.source) + '"></i>' + bkEsc(t.source) + '</span></td>' +
          '<td><span class="bk-bchip"><i style="background:' + bkColorOf(t.destination) + '"></i>' + bkEsc(t.destination) + '</span></td>' +
          '<td class="r"><input class="bk-inline" id="bkEditAmt" type="number" step="any" value="' + t.amount + '"></td>' +
          '<td><input class="bk-inline" id="bkEditRef" type="text" value="' + bkEsc(t.reference) + '"></td>' +
          '<td class="r"><span class="bk-rowact">' +
            '<button class="bk-ra ok" type="button" title="Save" onclick="bkSaveEdit(' + idx + ')">✓</button>' +
            '<button class="bk-ra del" type="button" title="Cancel" onclick="bkCancelEdit()">✕</button>' +
          '</span></td>' +
        '</tr>';
    } else {
      html +=
        '<tr' + (rolled ? ' class="bk-rolled"' : '') + '>' +
          '<td>' + dateStr + '</td>' +
          '<td><span class="bk-bchip"><i style="background:' + bkColorOf(t.source) + '"></i>' + bkEsc(t.source) + '</span></td>' +
          '<td><span class="bk-bchip"><i style="background:' + bkColorOf(t.destination) + '"></i>' + bkEsc(t.destination) + '</span></td>' +
          '<td class="r"><span class="bk-amt">' + bkLkr(t.amount) + '</span></td>' +
          '<td><span class="bk-ref">' + (bkEsc(t.reference) || '—') + '</span>' +
            (rolled ? ' <span class="bk-tag">↺ rolled back</span>' : '') + '</td>' +
          '<td class="r"><span class="bk-rowact">' +
            '<button class="bk-ra back" type="button" title="Rollback" onclick="bkRollback(' + idx + ')">↺</button>' +
            '<button class="bk-ra edit" type="button" title="Edit" onclick="bkEditTxn(' + idx + ')">✎</button>' +
            '<button class="bk-ra del"  type="button" title="Delete" onclick="bkDeleteTxn(' + idx + ')">✕</button>' +
          '</span></td>' +
        '</tr>';
    }
  });
  body.innerHTML = html;

  var moved = rows.reduce(function(s, t){ return s + (Number(t.amount) || 0); }, 0);
  meta.textContent = rows.length + ' of ' + _bkTxns.length + ' · ' + bkLkr(moved) + ' moved';
  pager.innerHTML =
    '<button class="bk-pbtn" type="button" onclick="bkGoPage(' + (_bkPage - 1) + ')"' + (_bkPage === 1 ? ' disabled' : '') + '>‹ Prev</button>' +
    '<span class="bk-pinfo">Page ' + _bkPage + ' of ' + pages + ' · ' + rows.length + ' transaction' + (rows.length === 1 ? '' : 's') + '</span>' +
    '<button class="bk-pbtn" type="button" onclick="bkGoPage(' + (_bkPage + 1) + ')"' + (_bkPage === pages ? ' disabled' : '') + '>Next ›</button>';
}

function bkSearch(q){ _bkQuery = (q || '').toLowerCase().trim(); _bkPage = 1; bkRenderTxns(); }
function bkSetBankFilter(v){ _bkBankFilter = v; _bkPage = 1; bkRenderTxns(); }
function bkSetRange(v){ _bkRangeDays = parseInt(v, 10) || 0; _bkPage = 1; bkRenderTxns(); }
function bkGoPage(p){ _bkPage = p; bkRenderTxns(); }
function bkEditTxn(i){ _bkEditRow = i; bkRenderTxns(); }
function bkCancelEdit(){ _bkEditRow = -1; bkRenderTxns(); }

function bkReloadTxns(){
  google.script.run
    .withSuccessHandler(function(t){
      _bkTxns = t || [];
      bkRenderTxns();
      bkRenderMove();
      bkRenderAccounts();
      bkRenderOverview();
    })
    .withFailureHandler(function(){})
    .getBankTransactions();
}

function bkSaveEdit(i){
  var t = _bkTxns[i];
  var newAmt = parseFloat(document.getElementById('bkEditAmt').value) || 0;
  var newRef = document.getElementById('bkEditRef').value;
  var delta  = newAmt - t.amount;

  google.script.run
    .withSuccessHandler(function(){
      var src = _bkData.find(function(b){ return b.source === t.source; });
      var dst = _bkData.find(function(b){ return b.source === t.destination; });
      t.amount = newAmt;
      t.reference = newRef;
      _bkEditRow = -1;

      if ((src || dst) && delta !== 0){
        if (src) src.amount -= delta;
        if (dst) dst.amount += delta;
        google.script.run
          .withSuccessHandler(function(){
            bkToast('Transaction updated', 'good');
            bkRenderTxns(); bkRenderAccounts(); bkRenderOverview();
            if (typeof _spaLoaded !== 'undefined') _spaLoaded.port = false;
          })
          .withFailureHandler(function(e){
            bkAlert('Transaction updated, but balances did not save: ' + (e.message || e));
            bkRenderTxns(); bkRenderAccounts(); bkRenderOverview();
          })
          .updateBankBalances(_bkData);
      } else {
        bkToast('Transaction updated', 'good');
        bkRenderTxns();
      }
    })
    .withFailureHandler(function(e){ bkAlert('Failed to update: ' + (e.message || e)); })
    .updateBankTransaction(t.row, {reference:newRef, amount:newAmt});
}

function bkDeleteTxn(i){
  var t = _bkTxns[i];
  bkConfirm('Delete this ' + bkLkr(t.amount) + ' transfer from ' + t.source + ' to ' + t.destination + '? Balances will be reverted.', function(ok){
    if (!ok) return;
    google.script.run
      .withSuccessHandler(function(){
        var src = _bkData.find(function(b){ return b.source === t.source; });
        var dst = _bkData.find(function(b){ return b.source === t.destination; });
        _bkTxns.splice(i, 1);
        /* rows below the deleted one shift up by one in the sheet */
        _bkTxns.forEach(function(x){ if (x.row > t.row) x.row -= 1; });
        _bkEditRow = -1;

        if (src || dst){
          if (src) src.amount += t.amount;
          if (dst) dst.amount -= t.amount;
          google.script.run
            .withSuccessHandler(function(){
              bkToast('Transaction deleted', 'good');
              bkRenderTxns(); bkRenderAccounts(); bkRenderOverview(); bkRefreshTransfer();
              if (typeof _spaLoaded !== 'undefined') _spaLoaded.port = false;
            })
            .withFailureHandler(function(e){
              bkAlert('Transaction deleted, but balances did not save: ' + (e.message || e));
              bkRenderTxns(); bkRenderAccounts(); bkRenderOverview();
            })
            .updateBankBalances(_bkData);
        } else {
          bkToast('Transaction deleted', 'good');
          bkRenderTxns(); bkRenderOverview();
        }
      })
      .withFailureHandler(function(e){ bkAlert('Failed to delete: ' + (e.message || e)); })
      .deleteBankTransaction(t.row);
  });
}

function bkRollback(i){
  var o = _bkTxns[i];
  bkConfirm('Roll back this transfer? A new ' + bkLkr(o.amount) + ' transfer from ' + o.destination + ' back to ' + o.source + ' will be logged.', function(ok){
    if (!ok) return;
    var rb = {
      date: new Date().toISOString(),
      source: o.destination,
      destination: o.source,
      amount: o.amount,
      reference: (o.reference || '') + ' - rollbacked'
    };
    google.script.run
      .withSuccessHandler(function(){
        var src = _bkData.find(function(b){ return b.source === rb.source; });
        var dst = _bkData.find(function(b){ return b.source === rb.destination; });
        if (src) src.amount -= rb.amount;
        if (dst) dst.amount += rb.amount;
        google.script.run
          .withSuccessHandler(function(){
            bkToast('Rolled back ' + bkLkr(rb.amount), 'good');
            if (typeof _spaLoaded !== 'undefined') _spaLoaded.port = false;
            bkReloadTxns();
          })
          .withFailureHandler(function(e){
            bkAlert('Rollback logged, but balances did not save: ' + (e.message || e));
            bkReloadTxns();
          })
          .updateBankBalances(_bkData);
      })
      .withFailureHandler(function(e){ bkAlert('Rollback failed: ' + (e.message || e)); })
      .addBankTransaction(rb);
  });
}

function bkExportCsv(){
  var rows = bkFilteredTxns();
  if (!rows.length){ bkToast('Nothing to export', 'bad'); return; }
  var lines = ['Date,Source,Destination,Amount,Reference'];
  rows.forEach(function(t){
    var d = bkDate(t.date);
    var q = function(s){ return '"' + String(s === undefined || s === null ? '' : s).replace(/"/g, '""') + '"'; };
    lines.push([q(d ? d.toISOString().substring(0, 10) : t.date), q(t.source), q(t.destination), t.amount, q(t.reference)].join(','));
  });
  var blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'bank-transactions-' + new Date().toISOString().substring(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  bkToast('Exported ' + rows.length + ' rows', 'good');
}

/* ═══ TAB RAIL — scroll spy ═══════════════════════════════════ */
function bkGoSec(id){
  var el = document.getElementById(id);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  bkMarkTab(id);
  if (typeof haptic === 'function') haptic('tick');
}
function bkMarkTab(id){
  document.querySelectorAll('#bkTabs .bk-tab').forEach(function(t){
    t.classList.toggle('active', t.getAttribute('data-sec') === id);
  });
}
var _bkSpyBound = false;
function bkBindScrollSpy(){
  if (_bkSpyBound) return;
  _bkSpyBound = true;
  var root = document.getElementById('bank-root');
  var ids = ['bkSecOverview','bkSecAccounts','bkSecMove','bkSecTxns'];
  var ticking = false;
  root.addEventListener('scroll', function(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      ticking = false;
      var best = ids[0];
      ids.forEach(function(id){
        var el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top < 190) best = id;
      });
      bkMarkTab(best);
    });
  }, {passive:true});
}

/* Esc closes whatever is open, innermost first */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (document.getElementById('bkConfirmBg') && document.getElementById('bkConfirmBg').classList.contains('open')){ bkConfirmClose(false); return; }
  if (_bkOpenBook >= 0) bkCloseBook();
});

/* ── the 💵 button in every page header and the tool-wheel spoke ── */
function moneyToggle(){
  if (typeof showPage === 'function') showPage('bank');
}

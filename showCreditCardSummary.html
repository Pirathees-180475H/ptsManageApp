<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Roboto', 'Arial', sans-serif;
        background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        min-height: 100vh;
        padding: 0;
        margin: 0;
        color: #fff;
        overflow: hidden;
      }

      .container {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .card-wrapper {
        flex: 1;
        background: rgba(40, 40, 40, 0.8);
        padding: 20px;
        overflow-y: auto;
        animation: fadeInUp 0.8s ease;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #aaa;
        font-size: 1.2em;
      }

      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }

      thead {
        background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
      }

      thead th {
        padding: 18px 15px;
        text-align: left;
        font-weight: 600;
        font-size: 0.85em;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #fff;
        border: none;
      }

      thead th:first-child {
        border-top-left-radius: 0;
      }

      thead th:last-child {
        border-top-right-radius: 0;
      }

      tbody tr {
        background: rgba(50, 50, 50, 0.6);
        transition: all 0.3s ease;
      }

      tbody tr:hover {
        background: rgba(70, 70, 70, 0.8);
        transform: scale(1.01);
        box-shadow: 0 4px 12px rgba(255, 0, 0, 0.2);
      }

      tbody td {
        padding: 18px 15px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: #e0e0e0;
        font-size: 0.95em;
      }

      tbody tr:last-child td:first-child {
        border-bottom-left-radius: 12px;
      }

      tbody tr:last-child td:last-child {
        border-bottom-right-radius: 12px;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      .card-name {
        font-weight: 700;
        font-size: 1.1em;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .card-icon {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }

      .hsbc { background: #db0011; }
      .selan { background: #ffd700; }
      .amex { background: #006fcf; }
      .default-icon { background: #999; }

      .amount {
        font-weight: 600;
        font-size: 1.1em;
        color: #4CAF50;
      }

      .amount.warning {
        color: #ff9800;
      }

      .amount.danger {
        color: #f44336;
      }

      .status {
        display: inline-block;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 0.85em;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .status.settled {
        background: linear-gradient(135deg, #4CAF50, #45a049);
        color: #fff;
        box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
      }

      .status.pending {
        background: linear-gradient(135deg, #ff9800, #f57c00);
        color: #fff;
        box-shadow: 0 2px 8px rgba(255, 152, 0, 0.3);
      }

      .alert-indicator {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.85em;
        font-weight: 600;
      }

      .alert-indicator.ok {
        background: rgba(76, 175, 80, 0.2);
        color: #4CAF50;
        border: 1px solid rgba(76, 175, 80, 0.5);
      }

      .alert-indicator.alert {
        background: rgba(244, 67, 54, 0.2);
        color: #f44336;
        border: 1px solid rgba(244, 67, 54, 0.5);
      }

      .alert-indicator.warning {
        background: rgba(255, 152, 0, 0.2);
        color: #ff9800;
        border: 1px solid rgba(255, 152, 0, 0.5);
      }

      .date-info {
        color: #bbb;
        font-size: 0.9em;
      }

      .month-badge {
        display: inline-block;
        padding: 4px 12px;
        background: rgba(33, 150, 243, 0.2);
        border: 1px solid rgba(33, 150, 243, 0.4);
        border-radius: 12px;
        color: #64b5f6;
        font-size: 0.85em;
        font-weight: 500;
      }

      .empty-cell {
        color: #666;
        font-style: italic;
      }

      .error {
        background: rgba(244, 67, 54, 0.1);
        border: 1px solid #f44336;
        border-radius: 8px;
        padding: 20px;
        color: #ff6b6b;
        text-align: center;
      }

      /* Input field styling */
      .balance-input-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .balance-input {
        width: 140px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        color: #fff;
        font-size: 0.9em;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .balance-input:focus {
        outline: none;
        background: rgba(255, 255, 255, 0.15);
        border-color: #2196F3;
        box-shadow: 0 0 8px rgba(33, 150, 243, 0.3);
      }

      .balance-input::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }

      .save-btn {
        padding: 8px 16px;
        background: linear-gradient(135deg, #2196F3, #1976D2);
        border: none;
        border-radius: 6px;
        color: #fff;
        font-size: 0.85em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .save-btn:hover {
        background: linear-gradient(135deg, #1976D2, #1565C0);
        box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        transform: translateY(-2px);
      }

      .save-btn:active {
        transform: translateY(0);
      }

      .save-btn:disabled {
        background: rgba(100, 100, 100, 0.5);
        cursor: not-allowed;
        transform: none;
      }

      .save-btn.saving {
        background: rgba(255, 152, 0, 0.8);
      }

      .save-btn.success {
        background: linear-gradient(135deg, #4CAF50, #45a049);
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 1200px) {
        thead th,
        tbody td {
          padding: 12px 10px;
          font-size: 0.8em;
        }

        .balance-input {
          width: 120px;
          font-size: 0.85em;
        }
      }

      @media (max-width: 768px) {
        table {
          font-size: 0.75em;
        }

        .card-wrapper {
          padding: 15px 10px;
        }

        .balance-input {
          width: 100px;
          font-size: 0.8em;
        }

        .save-btn {
          padding: 6px 12px;
          font-size: 0.75em;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card-wrapper" id="cardWrapper">
        <div class="loading">Loading data from Google Sheets...</div>
      </div>
    </div>

    <script>
      // Store current data for saving
      let currentData = [];

      // Function to get card icon class based on card name
      function getCardIconClass(cardName) {
        const name = cardName.toLowerCase();
        if (name.includes('hsbc')) return 'hsbc';
        if (name.includes('selan')) return 'selan';
        if (name.includes('amex')) return 'amex';
        return 'default-icon';
      }

      // Function to format currency
      function formatCurrency(value) {
        if (!value && value !== 0) return '<span class="empty-cell">—</span>';
        const num = parseFloat(value.toString().replace(/,/g, ''));
        if (isNaN(num)) return value;
        return 'LKR ' + num.toLocaleString('en-IN', { maximumFractionDigits: 2 });
      }

      // Function to format status with toggle
      function formatStatusToggle(value, rowIndex) {
        const isSettled = (value === true || value === 'TRUE' || value === 'true');
        const statusClass = isSettled ? 'settled' : 'pending';
        const statusText = isSettled ? '✓ Settled' : '⚠ Pending';
        
        return `
          <div class="balance-input-wrapper">
            <span class="status ${statusClass}" id="status-display-${rowIndex}" style="cursor: pointer;" onclick="toggleStatus(${rowIndex})">
              ${statusText}
            </span>
            <button 
              class="save-btn" 
              id="save-status-btn-${rowIndex}"
              onclick="saveStatus(${rowIndex})"
              style="display: none;"
            >Save</button>
          </div>
        `;
      }

      // Function to toggle status
      function toggleStatus(rowIndex) {
        const display = document.getElementById(`status-display-${rowIndex}`);
        const saveBtn = document.getElementById(`save-status-btn-${rowIndex}`);
        
        // Toggle the status
        if (display.classList.contains('settled')) {
          display.classList.remove('settled');
          display.classList.add('pending');
          display.innerHTML = '⚠ Pending';
          currentData[rowIndex][3] = false;
        } else {
          display.classList.remove('pending');
          display.classList.add('settled');
          display.innerHTML = '✓ Settled';
          currentData[rowIndex][3] = true;
        }
        
        // Show save button
        saveBtn.style.display = 'inline-block';
      }

      // Function to save status
      function saveStatus(rowIndex) {
        const btn = document.getElementById(`save-status-btn-${rowIndex}`);
        const newValue = currentData[rowIndex][3];
        
        console.log('Saving status for row:', rowIndex + 4, 'Value:', newValue, 'Type:', typeof newValue);

        // Update button state
        btn.textContent = 'Saving...';
        btn.classList.add('saving');
        btn.disabled = true;

        // Call Google Apps Script to save the value
        google.script.run
          .withSuccessHandler(function(result) {
            console.log('Save successful:', result);
            btn.textContent = '✓ Saved';
            btn.classList.remove('saving');
            btn.classList.add('success');
            
            // Hide button after 2 seconds
            setTimeout(() => {
              btn.style.display = 'none';
              btn.textContent = 'Save';
              btn.classList.remove('success');
              btn.disabled = false;
            }, 2000);
          })
          .withFailureHandler(function(error) {
            console.error('Save failed:', error);
            alert('Error saving: ' + error.message);
            btn.textContent = 'Save';
            btn.classList.remove('saving');
            btn.disabled = false;
          })
          .saveMonthlySettled(rowIndex + 4, newValue); // +4 because data starts at row 4
      }

      // Function to get alert based on Last Statement Balance vs Total Due
      // Logic: If last statement balance >= total due, then "No Worry" (you've paid enough)
      //        If last statement balance < total due, then "Watch Out" (you still owe money)
      //        If no last statement balance entered, show "No Data"
      function getBalanceAlert(paymentAfterStatement, lastStatementBalance) {
      const paymentNum = parseFloat(paymentAfterStatement) || 0;
      const balanceNum = parseFloat(lastStatementBalance) || 0;
      
      if (!lastStatementBalance || lastStatementBalance === '') {
        return '<span class="alert-indicator warning">⚠ No Data</span>';
      }
      
      if (paymentNum > balanceNum) {
        return '<span class="alert-indicator ok">✓ No Worry</span>';
      } else {
        return '<span class="alert-indicator alert">⚠ Watch Out</span>';
      }
      }

      // Function to save last statement balance and refresh the alert
      function saveBalance(rowIndex) {
        const input = document.getElementById(`balance-input-${rowIndex}`);
        const btn = document.getElementById(`save-btn-${rowIndex}`);
        const value = input.value.trim();

        if (!value) {
          alert('Please enter a value');
          return;
        }

        // Update button state
        btn.textContent = 'Saving...';
        btn.classList.add('saving');
        btn.disabled = true;

        // Call Google Apps Script to save the value
        google.script.run
          .withSuccessHandler(function(result) {
            btn.textContent = '✓ Saved';
            btn.classList.remove('saving');
            btn.classList.add('success');
            
            // Update the alert indicator
            const alertCell = document.getElementById(`alert-${rowIndex}`);
            const paymentAfterStatement = currentData[rowIndex][6];
            alertCell.innerHTML = getBalanceAlert(paymentAfterStatement, value);
            
            // Update current data
            currentData[rowIndex][7] = value;
            
            // Reset button after 2 seconds
            setTimeout(() => {
              btn.textContent = 'Save';
              btn.classList.remove('success');
              btn.disabled = false;
            }, 2000);
          })
          .withFailureHandler(function(error) {
            alert('Error saving: ' + error.message);
            btn.textContent = 'Save';
            btn.classList.remove('saving');
            btn.disabled = false;
          })
          .saveLastStatementBalance(rowIndex + 4, value); // +4 because data starts at row 4
      }

      // Function to display data in table
      function displayData(data) {
        if (!data || data.length === 0) {
          document.getElementById('cardWrapper').innerHTML = 
            '<div class="error">No data found in the sheet.</div>';
          return;
        }

        currentData = data;

        // Create headers manually (removed "Used Amount")
        const headers = ['Card', 'Total Due', 'Current Month', 'Monthly Settled', 
                'Statement Date', 'Statement Due Date', 
                'Payment After Statement', 'Last Statement Balance', 'Alert'];

        let tableHTML = '<table><thead><tr>';
        
        // Create header row
        headers.forEach(header => {
          tableHTML += `<th>${header}</th>`;
        });
        tableHTML += '</tr></thead><tbody>';

        // Create data rows
        data.forEach((row, rowIndex) => {
          tableHTML += '<tr>';
          
          // Card (0), Total Due (1), Current Month (2), Monthly Settled (3), 
          // Statement Date (4), Statement Due Date (5), Used Amount (6) - SKIP, Last Statement Balance (7)
          
          row.forEach((cell, index) => {
            // Skip index 6 (Used Amount)
            if (index === 6) {
              tableHTML += `<td><span class="amount">${formatCurrency(cell)}</span></td>`;
              return;
            }
            
            if (index === 0) {
              // Card name column
              const iconClass = getCardIconClass(cell);
              tableHTML += `
                <td>
                  <div class="card-name">
                    <span class="card-icon ${iconClass}"></span>
                    ${cell}
                  </div>
                </td>`;
            } else if (index === 1) {
              // Total Due column
              tableHTML += `<td><span class="amount">${formatCurrency(cell)}</span></td>`;
            } else if (index === 2) {
              // Current Month column
              const content = cell && cell !== '' ? 
                `<span class="month-badge">${cell}</span>` : 
                '<span class="empty-cell">—</span>';
              tableHTML += `<td>${content}</td>`;
            } else if (index === 3) {
              // Monthly settled column - toggleable
              tableHTML += `<td>${formatStatusToggle(cell, rowIndex)}</td>`;
            } else if (index === 7) {
              // Last Statement Balance column - input field
              const currentValue = cell || '';
              tableHTML += `
                <td>
                  <div class="balance-input-wrapper">
                    <input 
                      type="number" 
                      class="balance-input" 
                      id="balance-input-${rowIndex}"
                      placeholder="Enter amount"
                      value="${currentValue}"
                      step="0.01"
                    />
                    <button 
                      class="save-btn" 
                      id="save-btn-${rowIndex}"
                      onclick="saveBalance(${rowIndex})"
                    >Save</button>
                  </div>
                </td>`;
            } else {
              // Date columns (4, 5)
              const content = cell && cell !== '' ? 
                `<span class="date-info">${cell}</span>` : 
                '<span class="empty-cell">—</span>';
              tableHTML += `<td>${content}</td>`;
            }
          });
          
          // Add alert column
          tableHTML += `<td id="alert-${rowIndex}">${getBalanceAlert(row[6], row[7])}</td>`;
          tableHTML += '</tr>';
        });

        tableHTML += '</tbody></table>';
        document.getElementById('cardWrapper').innerHTML = tableHTML;
      }

      // Function to show error
      function showError(error) {
        document.getElementById('cardWrapper').innerHTML = 
          `<div class="error">Error loading data: ${error.message}</div>`;
      }

      // Load data when page loads
      window.onload = function() {
        google.script.run
          .withSuccessHandler(displayData)
          .withFailureHandler(showError)
          .getCardData();
      };
    </script>
  </body>
</html>

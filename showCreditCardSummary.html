<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:    #05080f;
      --card:  rgba(255,255,255,0.035);
      --bdr:   rgba(255,255,255,0.07);
      --red:   #ff4d6d;
      --blue:  #00d4ff;
      --green: #00e676;
      --gold:  #ffd700;
      --amber: #fb923c;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:#fff;
      min-height:100vh;
      overflow-x:hidden;
    }

    /* bg */
    .bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
    .orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:0.1;animation:drift 14s ease-in-out infinite;}
    .o1{width:420px;height:420px;background:#ff4d6d;top:-120px;left:-120px;animation-delay:0s;}
    .o2{width:360px;height:360px;background:#00d4ff;bottom:-80px;right:-80px;animation-delay:-5s;}
    .o3{width:260px;height:260px;background:#ffd700;top:55%;left:55%;animation-delay:-9s;}
    @keyframes drift{0%,100%{transform:translate(0,0);}33%{transform:translate(25px,-25px);}66%{transform:translate(-18px,18px);}}
    body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,0.025) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0;}

    .page{position:relative;z-index:1;padding:18px;max-width:1400px;margin:0 auto;}

    /* header */
    .header{text-align:center;padding:14px 0 20px;}
    .header-chip{display:inline-block;padding:5px 16px;border-radius:20px;background:rgba(255,77,109,0.12);border:1px solid rgba(255,77,109,0.3);color:var(--red);font-size:.68em;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
    .header h1{font-size:1.8em;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#fff 0%,var(--red) 50%,var(--blue) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .header-sub{color:rgba(255,255,255,0.35);font-size:.78em;margin-top:5px;}

    /* loading */
    .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;gap:14px;}
    .spinner{width:44px;height:44px;border:3px solid rgba(255,77,109,0.15);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loading-txt{color:rgba(255,255,255,0.3);font-size:.82em;letter-spacing:2px;text-transform:uppercase;}

    /* glass */
    .glass{background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:18px;backdrop-filter:blur(20px);box-shadow:0 4px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.04);position:relative;overflow:hidden;}
    .glass::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);}
    .card-hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.05);}
    .card-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .card-title{font-size:.72em;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);}

    /* KPI strip */
    .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;animation:fadeUp .5s ease both;}
    .kpi{border-radius:16px;padding:16px 18px;border:1px solid;backdrop-filter:blur(20px);position:relative;overflow:hidden;transition:transform .2s;}
    .kpi:hover{transform:translateY(-3px);}
    .kpi-glow{position:absolute;right:-18px;bottom:-18px;width:100px;height:100px;border-radius:50%;filter:blur(40px);opacity:.2;}
    .kpi-icon{font-size:1.6em;margin-bottom:6px;display:block;}
    .kpi-label{font-size:.6em;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.33);margin-bottom:3px;}
    .kpi-value{font-size:1.5em;font-weight:800;letter-spacing:-1px;line-height:1;}
    .kpi-sub{font-size:.62em;color:rgba(255,255,255,.25);margin-top:4px;}
    .kpi.red   {background:linear-gradient(135deg,rgba(255,77,109,.09),rgba(255,77,109,.04));border-color:rgba(255,77,109,.22);}
    .kpi.red   .kpi-value{color:var(--red);text-shadow:0 0 20px rgba(255,77,109,.4);}
    .kpi.red   .kpi-glow{background:var(--red);}
    .kpi.blue  {background:linear-gradient(135deg,rgba(0,212,255,.09),rgba(0,212,255,.04));border-color:rgba(0,212,255,.22);}
    .kpi.blue  .kpi-value{color:var(--blue);text-shadow:0 0 20px rgba(0,212,255,.4);}
    .kpi.blue  .kpi-glow{background:var(--blue);}
    .kpi.green {background:linear-gradient(135deg,rgba(0,230,118,.09),rgba(0,230,118,.04));border-color:rgba(0,230,118,.22);}
    .kpi.green .kpi-value{color:var(--green);text-shadow:0 0 20px rgba(0,230,118,.4);}
    .kpi.green .kpi-glow{background:var(--green);}
    .kpi.gold  {background:linear-gradient(135deg,rgba(255,215,0,.09),rgba(255,215,0,.04));border-color:rgba(255,215,0,.22);}
    .kpi.gold  .kpi-value{color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,.4);}
    .kpi.gold  .kpi-glow{background:var(--gold);}

    /* top row layout */
    .top-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;animation:fadeUp .5s ease .1s both;}
    .chart-wrap{height:220px;position:relative;}

    /* CC cards grid */
    .cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px;margin-bottom:14px;animation:fadeUp .5s ease .15s both;}

    /* individual CC card */
    .cc-card{background:var(--card);border:1px solid var(--bdr);border-radius:18px;overflow:hidden;backdrop-filter:blur(20px);box-shadow:0 4px 24px rgba(0,0,0,.25);transition:transform .25s ease;}
    .cc-card:hover{transform:translateY(-4px);}

    .cc-top{padding:18px 18px 14px;position:relative;overflow:hidden;}
    .cc-top::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);}
    .cc-brand-strip{height:3px;position:absolute;top:0;left:0;right:0;border-radius:0;}

    .cc-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
    .cc-logo{width:44px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.65em;font-weight:800;letter-spacing:.5px;flex-shrink:0;border:1px solid rgba(255,255,255,.1);}
    .cc-name{font-size:1em;font-weight:700;color:#fff;}
    .cc-month{font-size:.65em;color:rgba(255,255,255,.35);margin-top:2px;}
    .cc-status-wrap{margin-left:auto;flex-shrink:0;}

    .cc-amounts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
    .amt-block{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:10px 12px;}
    .amt-lbl{font-size:.58em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:3px;}
    .amt-val{font-size:1.1em;font-weight:800;color:#fff;letter-spacing:-.5px;}
    .amt-val.danger{color:var(--red);}
    .amt-val.ok    {color:var(--green);}
    .amt-val.warn  {color:var(--amber);}

    .cc-dates{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
    .date-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:10px;padding:7px 12px;font-size:.63em;color:rgba(255,255,255,.45);flex:1;min-width:130px;}
    .date-chip .dc-icon{font-size:1.1em;flex-shrink:0;}
    .date-chip .dc-body{display:flex;flex-direction:column;gap:1px;}
    .date-chip .dc-label{font-size:.75em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.28);}
    .date-chip .dc-value{font-weight:700;color:#fff;font-size:1em;}
    .date-chip.due-chip{background:rgba(255,77,109,.06);border-color:rgba(255,77,109,.18);}
    .date-chip.due-chip .dc-value{color:var(--red);}
    .date-chip.stmt-chip{background:rgba(0,212,255,.06);border-color:rgba(0,212,255,.18);}
    .date-chip.stmt-chip .dc-value{color:var(--blue);}

    /* payment progress */
    .pay-progress{margin-bottom:12px;}
    .pay-prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;}
    .pay-prog-label{font-size:.6em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.3);}
    .pay-prog-pct{font-size:.7em;font-weight:800;}
    .pay-prog-bg{height:7px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden;}
    .pay-prog-fill{height:100%;border-radius:6px;transition:width 1.3s cubic-bezier(.4,0,.2,1);width:0;}

    /* balance input row */
    .balance-row{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;}
    .balance-lbl{font-size:.62em;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.3);flex-shrink:0;}
    .balance-input{flex:1;min-width:0;padding:7px 10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-size:.85em;font-weight:600;font-family:inherit;transition:border-color .2s,box-shadow .2s;}
    .balance-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,212,255,.12);}
    .balance-input::placeholder{color:rgba(255,255,255,.25);}
    .save-btn{padding:7px 14px;border:none;border-radius:8px;font-family:inherit;font-size:.75em;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .2s ease;background:linear-gradient(135deg,var(--blue),#0099cc);color:#fff;flex-shrink:0;}
    .save-btn:hover{box-shadow:0 4px 14px rgba(0,212,255,.35);transform:translateY(-1px);}
    .save-btn:disabled{background:rgba(255,255,255,.1);cursor:not-allowed;transform:none;box-shadow:none;}
    .save-btn.saving{background:rgba(255,152,0,.7);}
    .save-btn.success{background:linear-gradient(135deg,var(--green),#00aa55);}

    /* alert badge */
    .alert-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;font-size:.67em;font-weight:700;letter-spacing:.5px;margin-left:6px;flex-shrink:0;}
    .alert-ok   {background:rgba(0,230,118,.12);border:1px solid rgba(0,230,118,.25);color:var(--green);}
    .alert-warn {background:rgba(255,152,0,.12); border:1px solid rgba(255,152,0,.25); color:var(--amber);}
    .alert-bad  {background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.25);color:var(--red);}

    /* status toggle */
    .status-badge{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:10px;font-size:.7em;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .2s ease;user-select:none;border:1px solid;}
    .status-badge.settled{background:rgba(0,230,118,.12);border-color:rgba(0,230,118,.3);color:var(--green);}
    .status-badge.settled:hover{background:rgba(0,230,118,.2);box-shadow:0 0 14px rgba(0,230,118,.2);}
    .status-badge.pending{background:rgba(255,152,0,.12);border-color:rgba(255,152,0,.3);color:var(--amber);}
    .status-badge.pending:hover{background:rgba(255,152,0,.2);box-shadow:0 0 14px rgba(255,152,0,.2);}
    .save-status-btn{padding:5px 12px;border:none;border-radius:7px;font-family:inherit;font-size:.68em;font-weight:700;cursor:pointer;transition:all .2s;background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;}
    .save-status-btn:disabled{opacity:.5;cursor:not-allowed;}
    .save-status-btn.success{background:linear-gradient(135deg,var(--green),#00aa55);}

    /* error */
    .error-box{text-align:center;padding:60px;color:var(--red);font-size:.9em;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px;}

    @media(max-width:700px){
      .kpi-row{grid-template-columns:repeat(2,1fr);}
      .top-row{grid-template-columns:1fr;}
      .cc-grid{grid-template-columns:1fr;}
      .cc-amounts{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  </div>

  <div class="page" id="root">
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-txt">Loading Credit Card Data…</div>
    </div>
  </div>

<script>
/* ── state ── */
let currentData = [];

/* ── brand config per card name ── */
function brandCfg(name) {
  const n = (name||'').toLowerCase();
  if (n.includes('hsbc'))  return { color:'#db0011', bg:'linear-gradient(135deg,#db0011,#a00)', label:'HSBC',  dot:'#db0011' };
  if (n.includes('amex'))  return { color:'#006fcf', bg:'linear-gradient(135deg,#006fcf,#004a99)', label:'AMEX', dot:'#006fcf' };
  if (n.includes('selan')) return { color:'#ffd700', bg:'linear-gradient(135deg,#ffd700,#cc9900)', label:'SELAN',dot:'#ffd700' };
  if (n.includes('hnb'))   return { color:'#ff6b35', bg:'linear-gradient(135deg,#ff6b35,#cc4400)', label:'HNB',  dot:'#ff6b35' };
  if (n.includes('com'))   return { color:'#00d4ff', bg:'linear-gradient(135deg,#00d4ff,#0099cc)', label:'COM',  dot:'#00d4ff' };
  return { color:'#a855f7', bg:'linear-gradient(135deg,#a855f7,#7c3aed)', label:'CARD', dot:'#a855f7' };
}

function fmt(v) {
  if (!v && v!==0) return '—';
  const n = parseFloat((v+'').replace(/,/g,''));
  if (isNaN(n)) return v;
  return '₨ ' + Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function fmtDate(v) {
  if (!v || v === '' || v === 0) return '—';
  return (v + '').trim(); // stored as string — display as-is
}

function getAlertHTML(paymentAfterStatement, lastStatementBalance, id) {
  const pay = parseFloat((paymentAfterStatement+'').replace(/,/g,'')) || 0;
  const bal = parseFloat((lastStatementBalance+'').replace(/,/g,'')) || 0;
  if (!lastStatementBalance || lastStatementBalance==='') {
    return `<span class="alert-badge alert-warn" id="${id}">⚠ No Data</span>`;
  }
  if (pay > bal) {
    return `<span class="alert-badge alert-ok" id="${id}">✓ No Worry</span>`;
  }
  return `<span class="alert-badge alert-bad" id="${id}">⚠ Watch Out</span>`;
}

/* ── toggle status ── */
function toggleStatus(i) {
  const badge = document.getElementById(`status-badge-${i}`);
  const saveBtn = document.getElementById(`save-status-btn-${i}`);
  const isSettled = badge.classList.contains('settled');
  badge.classList.toggle('settled', !isSettled);
  badge.classList.toggle('pending', isSettled);
  badge.innerHTML = !isSettled ? '✓ Settled' : '⚠ Pending';
  currentData[i][3] = !isSettled;
  saveBtn.style.display = 'inline-flex';
}

/* ── save status ── */
function saveStatus(i) {
  const btn = document.getElementById(`save-status-btn-${i}`);
  btn.textContent='Saving…'; btn.disabled=true;
  google.script.run
    .withSuccessHandler(()=>{
      btn.textContent='✓ Saved'; btn.classList.add('success');
      setTimeout(()=>{ btn.style.display='none'; btn.textContent='Save'; btn.classList.remove('success'); btn.disabled=false; },2000);
    })
    .withFailureHandler(err=>{ alert('Error: '+err.message); btn.textContent='Save'; btn.disabled=false; })
    .saveMonthlySettled(i+4, currentData[i][3]);
}

/* ── save balance ── */
function saveBalance(i) {
  const input = document.getElementById(`bal-input-${i}`);
  const btn   = document.getElementById(`bal-btn-${i}`);
  const val   = input.value.trim();
  if (!val) { input.focus(); return; }
  btn.textContent='Saving…'; btn.classList.add('saving'); btn.disabled=true;
  google.script.run
    .withSuccessHandler(()=>{
      btn.textContent='✓ Saved'; btn.classList.remove('saving'); btn.classList.add('success');
      // update alert
      const alertEl = document.getElementById(`alert-${i}`);
      if (alertEl) {
        const newAlert = document.createElement('span');
        const pay = currentData[i][6];
        const bal = val;
        if (!bal) { newAlert.className='alert-badge alert-warn'; newAlert.id=`alert-${i}`; newAlert.textContent='⚠ No Data'; }
        else if (parseFloat((pay+'').replace(/,/g,''))>parseFloat((bal+'').replace(/,/g,''))) { newAlert.className='alert-badge alert-ok'; newAlert.id=`alert-${i}`; newAlert.textContent='✓ No Worry'; }
        else { newAlert.className='alert-badge alert-bad'; newAlert.id=`alert-${i}`; newAlert.textContent='⚠ Watch Out'; }
        alertEl.replaceWith(newAlert);
      }
      currentData[i][7]=val;
      setTimeout(()=>{ btn.textContent='Save'; btn.classList.remove('success'); btn.disabled=false; },2000);
    })
    .withFailureHandler(err=>{ alert('Error: '+err.message); btn.textContent='Save'; btn.classList.remove('saving'); btn.disabled=false; })
    .saveLastStatementBalance(i+4, val);
}

/* ── MAIN RENDER ── */
function displayData(data) {
  if (!data || !data.length) {
    document.getElementById('root').innerHTML='<div class="error-box">⚠️ No card data found.</div>';
    return;
  }
  currentData = data;

  const totalDue    = data.reduce((s,r)=>s+(parseFloat((r[1]+'').replace(/,/g,''))||0),0);
  const settledCnt  = data.filter(r=>r[3]===true||r[3]==='TRUE'||r[3]==='true').length;
  const pendingCnt  = data.length - settledCnt;
  const watchOutCnt = data.filter(r=>{
    const pay=parseFloat((r[6]+'').replace(/,/g,''))||0;
    const bal=parseFloat((r[7]+'').replace(/,/g,''))||0;
    return r[7] && pay<=bal;
  }).length;

  /* chart data */
  const chartLabels = data.map(r=>r[0]||'Card');
  const chartDues   = data.map(r=>parseFloat((r[1]+'').replace(/,/g,''))||0);
  const chartPays   = data.map(r=>parseFloat((r[6]+'').replace(/,/g,''))||0);
  const brandColors = data.map(r=>brandCfg(r[0]).color);

  /* cards HTML */
  const cardsHTML = data.map((row,i)=>{
    const b = brandCfg(row[0]);
    const isSettled = row[3]===true||row[3]==='TRUE'||row[3]==='true';
    const totalDueNum = parseFloat((row[1]+'').replace(/,/g,''))||0;
    const payNum      = parseFloat((row[6]+'').replace(/,/g,''))||0;
    const amtClass    = totalDueNum>50000?'danger':totalDueNum>20000?'warn':'ok';

    // payment progress
    const progPct    = totalDueNum>0 ? Math.min(payNum/totalDueNum*100,100) : 0;
    const progColor  = progPct>=100?'var(--green)':progPct>=60?'var(--amber)':'var(--red)';
    const progLabel  = progPct>=100?'Fully covered':progPct>0?progPct.toFixed(0)+'% covered':'No payment set';

    return `
    <div class="cc-card" style="border-color:${isSettled?'rgba(0,230,118,.18)':'rgba(255,255,255,.07)'}">
      <div class="cc-brand-strip" style="background:${b.bg};height:3px;position:absolute;top:0;left:0;right:0;"></div>
      <div class="cc-top">

        <div class="cc-header">
          <div class="cc-logo" style="background:${b.bg};box-shadow:0 0 14px ${b.color}44">${b.label}</div>
          <div style="flex:1">
            <div class="cc-name">${row[0]||'—'}</div>
            <div class="cc-month">📆 ${row[2]||'No month set'}</div>
          </div>
          <div class="cc-status-wrap">
            <span class="status-badge ${isSettled?'settled':'pending'}"
                  id="status-badge-${i}" onclick="toggleStatus(${i})">
              ${isSettled?'✓ Settled':'⚠ Pending'}
            </span>
            <button class="save-status-btn" id="save-status-btn-${i}"
                    onclick="saveStatus(${i})" style="display:none;margin-left:6px">Save</button>
          </div>
        </div>

        <div class="cc-amounts">
          <div class="amt-block" style="border-color:rgba(255,77,109,.15)">
            <div class="amt-lbl">💳 Total Due</div>
            <div class="amt-val ${amtClass}">${fmt(row[1])}</div>
          </div>
          <div class="amt-block" style="border-color:rgba(0,212,255,.12)">
            <div class="amt-lbl">💸 Payment After Statement</div>
            <div class="amt-val">${fmt(row[6])}</div>
          </div>
        </div>

        <div class="pay-progress">
          <div class="pay-prog-row">
            <span class="pay-prog-label">Payment coverage</span>
            <span class="pay-prog-pct" style="color:${progColor}">${progLabel}</span>
          </div>
          <div class="pay-prog-bg">
            <div class="pay-prog-fill" data-w="${progPct}" style="background:${progColor}"></div>
          </div>
        </div>

        <div class="cc-dates">
          <div class="date-chip stmt-chip">
            <span class="dc-icon">📋</span>
            <div class="dc-body">
              <span class="dc-label">Statement</span>
              <span class="dc-value">${fmtDate(row[4])}</span>
            </div>
          </div>
          <div class="date-chip due-chip">
            <span class="dc-icon">⏰</span>
            <div class="dc-body">
              <span class="dc-label">Due Date</span>
              <span class="dc-value">${fmtDate(row[5])}</span>
            </div>
          </div>
        </div>

        <div class="balance-row">
          <span class="balance-lbl">Last Statement Bal</span>
          <input class="balance-input" type="number" step="0.01"
                 id="bal-input-${i}" placeholder="Enter amount"
                 value="${row[7]||''}"/>
          <button class="save-btn" id="bal-btn-${i}" onclick="saveBalance(${i})">Save</button>
          ${getAlertHTML(row[6],row[7],`alert-${i}`)}
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('root').innerHTML = `
    <div class="header">
      <div class="header-chip">💳 Live · CC_SW_CL_INST</div>
      <h1>Credit Card Dashboard</h1>
      <div class="header-sub">Balance · Statements · Payment status</div>
    </div>

    <!-- KPIs -->
    <div class="kpi-row">
      <div class="kpi red">
        <div class="kpi-glow"></div>
        <span class="kpi-icon">💳</span>
        <div class="kpi-label">Total Due</div>
        <div class="kpi-value">${fmt(totalDue)}</div>
        <div class="kpi-sub">across all cards</div>
      </div>
      <div class="kpi ${settledCnt===data.length?'green':'gold'}">
        <div class="kpi-glow"></div>
        <span class="kpi-icon">✅</span>
        <div class="kpi-label">Settled</div>
        <div class="kpi-value">${settledCnt} / ${data.length}</div>
        <div class="kpi-sub">${pendingCnt>0?pendingCnt+' still pending':'all clear'}</div>
      </div>
      <div class="kpi ${watchOutCnt===0?'green':'red'}">
        <div class="kpi-glow"></div>
        <span class="kpi-icon">${watchOutCnt>0?'⚠️':'🛡️'}</span>
        <div class="kpi-label">Watch Out</div>
        <div class="kpi-value">${watchOutCnt} card${watchOutCnt!==1?'s':''}</div>
        <div class="kpi-sub">${watchOutCnt>0?'underpaid vs statement':'all payments clear'}</div>
      </div>
      <div class="kpi blue">
        <div class="kpi-glow"></div>
        <span class="kpi-icon">📊</span>
        <div class="kpi-label">Total Cards</div>
        <div class="kpi-value">${data.length}</div>
        <div class="kpi-sub">being tracked</div>
      </div>
    </div>

    <!-- Charts row -->
    <div class="top-row">
      <div class="glass">
        <div class="card-hdr">
          <div class="card-dot" style="background:#ff4d6d;box-shadow:0 0 6px #ff4d6d"></div>
          <div class="card-title">Total Due per Card</div>
        </div>
        <div class="chart-wrap"><canvas id="dueChart"></canvas></div>
      </div>
      <div class="glass">
        <div class="card-hdr">
          <div class="card-dot" style="background:#00d4ff;box-shadow:0 0 6px #00d4ff"></div>
          <div class="card-title">Due vs Payment After Statement</div>
        </div>
        <div class="chart-wrap"><canvas id="cmpChart"></canvas></div>
      </div>
    </div>

    <!-- CC card panels -->
    <div class="cc-grid">${cardsHTML}</div>
  `;

  /* animate progress bars */
  setTimeout(()=>{
    document.querySelectorAll('.pay-prog-fill').forEach(el=>{
      el.style.width = (el.dataset.w||0) + '%';
    });
  }, 350);

  const TIP = {backgroundColor:'rgba(5,8,15,0.95)',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,titleColor:'#fff',bodyColor:'rgba(255,255,255,0.65)',padding:12};
  Chart.defaults.color='rgba(255,255,255,0.4)';
  Chart.defaults.font.family='Inter';

  /* Donut: total due per card */
  new Chart(document.getElementById('dueChart'),{
    type:'doughnut',
    data:{
      labels:chartLabels,
      datasets:[{data:chartDues,backgroundColor:brandColors.map(c=>c+'44'),borderColor:brandColors,borderWidth:2,hoverOffset:10}]
    },
    options:{responsive:true,maintainAspectRatio:false,cutout:'65%',animation:{animateRotate:true,duration:1200},
      plugins:{
        legend:{position:'bottom',labels:{color:'rgba(255,255,255,.5)',font:{size:10},padding:12,usePointStyle:true,pointStyleWidth:7}},
        tooltip:{...TIP,callbacks:{label:ctx=>' '+ctx.label+': '+fmt(ctx.parsed)}}
      }
    }
  });

  /* Grouped bar: due vs payment */
  new Chart(document.getElementById('cmpChart'),{
    type:'bar',
    data:{
      labels:chartLabels,
      datasets:[
        {label:'Total Due',data:chartDues,backgroundColor:brandColors.map(c=>c+'44'),borderColor:brandColors,borderWidth:2,borderRadius:8,borderSkipped:false},
        {label:'Payment After Statement',data:chartPays,backgroundColor:'rgba(0,230,118,0.2)',borderColor:'#00e676',borderWidth:2,borderRadius:8,borderSkipped:false}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:1100},
      plugins:{
        legend:{labels:{color:'rgba(255,255,255,.5)',font:{size:10},usePointStyle:true}},
        tooltip:{...TIP,callbacks:{label:ctx=>' '+ctx.dataset.label+': '+fmt(ctx.parsed.y)}}
      },
      scales:{
        x:{ticks:{color:'rgba(255,255,255,.4)',font:{size:10}},grid:{color:'rgba(255,255,255,.04)'}},
        y:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9},callback:v=>'₨'+v.toLocaleString('en-IN')},grid:{color:'rgba(255,255,255,.04)'}}
      }
    }
  });
}

function showError(err) {
  document.getElementById('root').innerHTML=
    `<div class="error-box">⚠️ ${err.message||err}</div>`;
}

window.onload = function() {
  google.script.run
    .withSuccessHandler(displayData)
    .withFailureHandler(showError)
    .getCardData();
};
</script>
</body>
</html>

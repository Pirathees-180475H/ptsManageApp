/* ═══════════════════════════════════════════
   FORMATTING
═══════════════════════════════════════════ */
function portFmt(value, currency){
  currency = currency || 'LKR';
  if(value === null || value === undefined || value === '') return '—';
  var num = parseFloat(value.toString().replace(/,/g,''));
  if(isNaN(num)) return value;
  var f2 = Math.abs(num).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  return (num < 0 ? '-' : '') + (currency === 'USD' ? '$' : '₨') + f2;
}

function portFmtShort(n, currency){
  var sym = currency === 'USD' ? '$' : '₨';
  var a = Math.abs(n), s = n < 0 ? '-' : '';
  if(a >= 1e6) return s + sym + (a/1e6).toFixed(2) + 'M';
  if(a >= 1e3) return s + sym + Math.round(a/1e3) + 'K';
  return s + sym + a.toFixed(0);
}

function portTick(v){
  var a = Math.abs(v);
  return '₨' + (a >= 1e6 ? (v/1e6).toFixed(1)+'M' : a >= 1e3 ? Math.round(v/1e3)+'K' : v);
}

function portEsc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function portAnimateCounter(el, target, duration, prefix){
  duration = duration || 1400; prefix = prefix || '₨';
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    el.textContent = prefix + Math.abs(target).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
    return;
  }
  var start = performance.now();
  function upd(now){
    var pct  = Math.min((now - start) / duration, 1);
    var ease = 1 - Math.pow(1 - pct, 4);
    el.textContent = prefix + Math.abs(target * ease).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
    if(pct < 1) requestAnimationFrame(upd);
  }
  requestAnimationFrame(upd);
}

function portGetClass(cat){
  var c = (cat || '').toLowerCase();
  if(c.indexOf('earn')>=0 || c.indexOf('stock')>=0 || c.indexOf('gold')>=0 || c.indexOf('cash')>=0 || c.indexOf('saving')>=0) return 'positive';
  if(c.indexOf('due')>=0 || c.indexOf('splitwise')>=0 || c.indexOf('loan')>=0 || c.indexOf('borrow')>=0) return 'negative';
  return 'neutral';
}

function portShowToast(msg, type){

  t.textContent = msg;

  t.classList.add('show');
  clearTimeout(t._pt);
  t._pt = setTimeout(function(){ t.classList.remove('show'); }, 3400);
}

/* ═══════════════════════════════════════════
   SMALL SVG HELPERS
═══════════════════════════════════════════ */
function portSparkPath(values, w, h, pad){
  if(!values || values.length < 2) return null;
  pad = pad == null ? 3 : pad;
  var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
  var span = (max - min) || 1;
  var line = [], area = [];
  for(var i = 0; i < values.length; i++){
    var x = (i / (values.length - 1)) * w;
    var y = h - pad - ((values[i] - min) / span) * (h - pad * 2);
    line.push((i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1));
  }
  area = line.join(' ') + ' L' + w + ',' + h + ' L0,' + h + ' Z';
  return { line: line.join(' '), area: area };
}

function portSparkSvg(values, color, cls, w, h){
  var p = portSparkPath(values, w, h);
  if(!p) return '';
  var gid = 'pfsp' + Math.random().toString(36).slice(2,8);
  return '<svg class="' + cls + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<defs><linearGradient id="' + gid + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + color + '" stop-opacity=".35"/>' +
      '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + p.area + '" fill="url(#' + gid + ')"/>' +
    '<path d="' + p.line + '" fill="none" stroke="' + color + '" stroke-width="1.6" opacity=".75"/></svg>';
}

/* ═══════════════════════════════════════════
   MAIN RENDER
═══════════════════════════════════════════ */
function portDisplayPortfolio(data){
  var root = document.getElementById('port-root'); if(!root) return;

  var rawAssets = (data && data.assets) ? data.assets : (Array.isArray(data) ? data : []);
  var growth    = (data && data.growth) ? data.growth : [];
  var epfEtf    = (data && data.epfEtf) ? +data.epfEtf : 0;
  var aims      = (data && data.aims)   ? data.aims   : [];

  if(!rawAssets || !rawAssets.length){
    root.innerHTML = '<div class="error-box">No portfolio data found.</div>';
    return;
  }

  _portData = data;
  _portHidden = {};
  portDestroyCharts();

  /* ── split assets from total rows ── */
  var totalLKR = 0, totalUSD = 0, assets = [], totals = [];
  rawAssets.forEach(function(row){
    var cat = (row[0] || '').toString().trim();
    var amt = parseFloat((row[1] || 0).toString().replace(/,/g,'')) || 0;
    if(!cat) return;
    if(cat.toLowerCase().indexOf('total') >= 0) totals.push({ cat:cat, amt:amt });
    else assets.push({ cat:cat, amt:amt });
  });
  totals.forEach(function(t){
    if(t.cat.toLowerCase().indexOf('usd') >= 0) totalUSD = t.amt; else totalLKR = t.amt;
  });

  _portAssets   = assets;
  _portPos      = assets.filter(function(a){ return a.amt > 0; });
  _portGrowthAll = growth;
  _portTotals   = { lkr: totalLKR, usd: totalUSD, epf: epfEtf };

  var totalPositive = _portPos.reduce(function(s,a){ return s + a.amt; }, 0);

  /* colour per asset, stable across views */
  _portAssets.forEach(function(a, i){
    a.i     = i;
    a.color = PORT_PALETTE[i % PORT_PALETTE.length];
    a.pct   = totalPositive > 0 && a.amt > 0 ? (a.amt / totalPositive * 100) : 0;
    a.cls   = portGetClass(a.cat);
  });
  _portPos.forEach(function(a, i){ a.pi = i; });

  /* ── deltas from the growth log ── */
  var momPct = 0, momAbs = 0, ytdPct = 0, hasYtd = false;
  if(growth.length >= 2){
    var prev = growth[growth.length-2].amount, last = growth[growth.length-1].amount;
    if(prev > 0){ momPct = (last - prev) / prev * 100; momAbs = last - prev; }
    var back = growth.length > 12 ? growth.length - 13 : 0;
    var base = growth[back].amount;
    if(back !== growth.length-1 && base > 0){ ytdPct = (growth[growth.length-1].amount - base) / base * 100; hasYtd = true; }
  }

  var largest   = _portPos.length ? _portPos.reduce(function(b,a){ return a.amt > b.amt ? a : b; }) : { cat:'—', amt:0, pct:0 };
  var epfPct    = totalLKR > 0 ? (epfEtf / totalLKR * 100) : 0;
  var amounts   = growth.map(function(g){ return g.amount; });
  var firstDate = growth.length ? growth[0].date : '—';

  /* ── build ── */
  root.innerHTML =
    '<div id="portSecOverview">' +
      portHeroHtml(totalLKR, totalUSD, epfEtf, momPct, momAbs, ytdPct, hasYtd, amounts) +
      portKpisHtml(totalLKR, totalUSD, epfEtf, largest, epfPct, growth, amounts, firstDate) +
    '</div>' +
    '<div id="portSecAlloc" class="pf-bento">' +
      portAllocHtml() +
      portGoalsHtml(aims) +
    '</div>' +
    '<div id="portSecGrowth">' + portGrowthHtml(growth) + '</div>' +
    '<div id="portSecAssets" class="assets-section">' +
      '<div class="section-heading">All Assets &amp; Balances</div>' +
      portToolbarHtml() +
      '<div id="portAssetsBody"></div>' +
    '</div>';

  /* ── animate in ── */
  setTimeout(function(){
    var h = document.getElementById('portHeroAmt');
    var l = document.getElementById('portTileLkr');
    var u = document.getElementById('portTileUsd');
    if(h) portAnimateCounter(h, totalLKR, 1800, '₨');
    if(l) portAnimateCounter(l, totalLKR, 1600, '₨');
    if(u) portAnimateCounter(u, totalUSD, 1600, '$');
  }, 180);

  setTimeout(function(){
    var bars = document.querySelectorAll('#page-port [data-w]');
    for(var i = 0; i < bars.length; i++) bars[i].style.width = bars[i].dataset.w + '%';
  }, 320);

  portRenderAssets();
  portEnsureChart(_portChartIdx);
  if(growth.length) portBuildGrowthChart();
  buildPortTicker(_portAssets, totalLKR);
  portInitSpy();
  portTouchSync();
  portMarkTab('portSecOverview');
}

═══════════════════════════════════════════ */
function portHeroHtml(lkr, usd, epf, momPct, momAbs, ytdPct, hasYtd, amounts){
  var momCls = momPct > 0.5 ? 'up' : momPct < -0.5 ? 'down' : 'flat';
  var momArr = momPct > 0.5 ? '▲' : momPct < -0.5 ? '▼' : '→';
  var ytdCls = ytdPct > 0.5 ? 'up' : ytdPct < -0.5 ? 'down' : 'flat';
  var ytdArr = ytdPct > 0.5 ? '▲' : ytdPct < -0.5 ? '▼' : '→';

  var spark = '';
  var sp = portSparkPath(amounts, 800, 120, 8);
  if(sp){
    spark = '<svg class="pf-hero-spark" viewBox="0 0 800 120" preserveAspectRatio="none" aria-hidden="true">' +
      '<defs><linearGradient id="pfHeroG" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#2dd4bf" stop-opacity=".9"/>' +
        '<stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + sp.area + '" fill="url(#pfHeroG)"/>' +
      '<path d="' + sp.line + '" fill="none" stroke="#2dd4bf" stroke-width="2.5"/></svg>';
  }

  var ribbon = '', legend = '';
  var tot = _portPos.reduce(function(s,a){ return s + a.amt; }, 0);
  if(tot > 0){
    _portPos.forEach(function(a){
      ribbon += '<button class="pf-rib" type="button" style="width:' + a.pct.toFixed(2) + '%;background:' + a.color + '" ' +
        'title="' + portEsc(a.cat) + ' · ' + portFmt(a.amt) + ' · ' + a.pct.toFixed(1) + '%" ' +
        'aria-label="' + portEsc(a.cat) + '" onclick="portOpenAsset(' + a.i + ')"></button>';
      legend += '<span class="pf-rl"><i class="pf-rl-sw" style="background:' + a.color + '"></i>' +
        portEsc(a.cat) + ' ' + a.pct.toFixed(1) + '%</span>';
    });
  }

  return '<div class="pf-hero">' + spark +
    '<div class="pf-hero-inner">' +
      '<div class="pf-hero-top">' +
        '<div class="pf-hero-main">' +
          '<div class="pf-hero-label"><span class="hero-dot"></span>Net Worth · All currencies combined</div>' +
          '<div class="pf-hero-amt" id="portHeroAmt">' + portFmt(lkr) + '</div>' +

            (amounts.length >= 2 ? '<span class="pf-delta ' + momCls + '">' + momArr + ' ' + (momPct>=0?'+':'') + momPct.toFixed(1) + '% MoM</span>' : '') +
            (hasYtd ? '<span class="pf-delta ' + ytdCls + '">' + ytdArr + ' ' + (ytdPct>=0?'+':'') + ytdPct.toFixed(1) + '% 12M</span>' : '') +
            (amounts.length >= 2 ? '<span class="pf-delta-note">' + (momAbs>=0?'+':'-') + portFmt(Math.abs(momAbs)) + ' since last snapshot</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="pf-ccy-row">' +
          '<div class="pf-ccy lkr"><span class="pf-ccy-lbl">LKR Assets</span><span class="pf-ccy-val">' + portFmtShort(lkr) + '</span></div>' +
          '<div class="pf-ccy usd"><span class="pf-ccy-lbl">USD Assets</span><span class="pf-ccy-val">' + portFmt(usd,'USD') + '</span></div>' +
          '<div class="pf-ccy epf"><span class="pf-ccy-lbl">EPF + ETF</span><span class="pf-ccy-val">' + portFmtShort(epf) + '</span></div>' +
        '</div>' +

      (ribbon ? '<div class="pf-ribbon-wrap"><div class="pf-ribbon">' + ribbon + '</div>' +
                '<div class="pf-ribbon-legend">' + legend + '</div></div>' : '') +

function portEnsureChart(i){
  if(_portCharts[i] || !_portPos.length) return;
  var meta   = PORT_CHART_META[i];
  var canvas = document.getElementById(meta.id);
  if(!canvas || typeof Chart === 'undefined') return;

  var labels = _portPos.map(function(a){ return a.cat; });
  var colors = _portPos.map(function(a){ return a.color; });
  var alpha  = colors.map(function(c){ return c + '33'; });
  var values = portVisibleValues();

  var tip = {
    backgroundColor:PORT_TIP.backgroundColor, borderColor:PORT_TIP.borderColor, borderWidth:1,
    titleColor:PORT_TIP.titleColor, bodyColor:PORT_TIP.bodyColor, padding:PORT_TIP.padding
  };
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dur = reduce ? 0 : 1200;

  var cfg;
  if(meta.type === 'doughnut'){
    cfg = { type:'doughnut',
      data:{ labels:labels, datasets:[{ data:values, backgroundColor:alpha, borderColor:colors, borderWidth:2, hoverBorderWidth:3, hoverOffset:8 }] },
      options:{ responsive:true, maintainAspectRatio:true, cutout:'68%',
        animation:{ animateRotate:true, duration:dur },
        onHover:function(evt, els){ portDonutHover(els && els.length ? els[0].index : -1); },
        plugins:{ legend:{ display:false },
          tooltip:Object.assign({}, tip, { callbacks:{ label:function(c){ return ' ' + c.label + ': ' + portFmt(c.parsed); } } }) } } };
  } else if(meta.type === 'polarArea'){
    cfg = { type:'polarArea',
      data:{ labels:labels, datasets:[{ data:values, backgroundColor:alpha, borderColor:colors, borderWidth:2 }] },
      options:{ responsive:true, maintainAspectRatio:false, animation:{ duration:reduce ? 0 : 1400 },
        scales:{ r:{ ticks:{ display:false }, grid:{ color:'rgba(255,255,255,.06)' }, pointLabels:{ display:false } } },
        plugins:{ legend:{ display:false },
          tooltip:Object.assign({}, tip, { callbacks:{ label:function(c){ return ' ' + c.label + ': ' + portFmt(c.parsed.r); } } }) } } };
  } else {
    var horiz = meta.type === 'hbar';
    cfg = { type:'bar',
      data:{ labels:labels, datasets:[{ data:values, backgroundColor:alpha, borderColor:colors, borderWidth:2, borderRadius:horiz ? 6 : 8, borderSkipped:false }] },
      options:{ indexAxis: horiz ? 'y' : 'x', responsive:true, maintainAspectRatio:false, animation:{ duration:dur },
        plugins:{ legend:{ display:false },
          tooltip:Object.assign({}, tip, { callbacks:{ label:function(c){ return ' ' + portFmt(horiz ? c.parsed.x : c.parsed.y); } } }) },
        scales: horiz
          ? { x:{ ticks:{ color:'rgba(255,255,255,.4)', font:{ size:9 }, callback:portTick }, grid:{ color:'rgba(255,255,255,.05)' } },
              y:{ ticks:{ color:'rgba(255,255,255,.5)', font:{ size:9 } }, grid:{ display:false } } }
          : { x:{ ticks:{ color:'rgba(255,255,255,.4)', font:{ size:9 } }, grid:{ color:'rgba(255,255,255,.04)' } },
              y:{ ticks:{ color:'rgba(255,255,255,.4)', font:{ size:9 }, callback:portTick }, grid:{ color:'rgba(255,255,255,.05)' } } } } };
  }

  _portCharts[i] = new Chart(canvas, cfg);
  if(meta.type === 'doughnut'){ portRenderLegend(); portDonutHover(-1); }
}

function portAimsPhaseTotal(phase){
  var t = { amount:0, aim:0, remaining:0, count:0, done:0 };
  portAimsAll.forEach(function(a){
    if(a.phase !== phase) return;
    t.amount += a.amount; t.aim += a.aim; t.remaining += a.remaining; t.count++;
    if(a.aim > 0 && a.remaining <= 0) t.done++;
  });
  return t;
}

function portGoalsHtml(aims){
  portAimsAll = (aims || []).slice();

  var head = '<div class="card-header">' +
    '<span class="card-dot" style="background:var(--purple);box-shadow:0 0 6px var(--purple)"></span>' +
    '<span class="card-title">🎯 Remaining to Collect</span>';

  if(!portAimsAll.length){
    portAimsPhases = []; portAimsPhase = null;
    return '<div class="glass-card pf-goals">' + head + '</div>' +
           '<div class="pf-empty">No aim data</div></div>';
  }

  var seen = {}; portAimsPhases = [];
  portAimsAll.forEach(function(a){
    var p = a.phase || 1; a.phase = p;
    if(!seen[p]){ seen[p] = 1; portAimsPhases.push(p); }
  });
  portAimsPhases.sort(function(x,y){ return x - y; });
  portAimsPhase = portAimsPhases[portAimsPhases.length - 1];

  var pills = '<div class="pf-phase-pills" role="group" aria-label="Phase">';
  portAimsPhases.forEach(function(p){
    var t = portAimsPhaseTotal(p);
    var done = t.aim > 0 && t.remaining <= 0;
    pills += '<button class="pf-phase-pill' + (done ? ' done' : '') + (p === portAimsPhase ? ' active' : '') + '" ' +
      'type="button" data-phase="' + p + '" onclick="portSwitchAimPhase(' + p + ')">P' + p + (done ? ' ✓' : '') + '</button>';
  });
  pills += '</div>';

  return '<div class="glass-card pf-goals">' + head + pills + '</div>' +
    '<div id="portGoalsBody">' + portGoalsBodyHtml(portAimsPhase) + '</div></div>';
}

  var list = portAimsAll.filter(function(a){ return a.phase === phase; });
  if(!list.length) return '<div class="pf-empty">No aims in phase ' + phase + '</div>';

  var t      = portAimsPhaseTotal(phase);
  var isDone = t.aim > 0 && t.remaining <= 0;
  var pct    = t.aim > 0 ? Math.min(t.amount / t.aim * 100, 100) : 0;
  var C      = 2 * Math.PI * 34;
  var isLast = phase === portAimsPhases[portAimsPhases.length - 1];

  var ring = '<div class="pf-ring">' +
    '<svg width="86" height="86" viewBox="0 0 80 80" aria-hidden="true">' +

      '<circle class="fg" cx="40" cy="40" r="34" fill="none" stroke="url(#pfGoalG)" stroke-width="8" ' +
        'stroke-linecap="round" stroke-dasharray="' + (C * pct / 100).toFixed(1) + ' ' + C.toFixed(1) + '" ' +
        'transform="rotate(-90 40 40)"/>' +
      '<defs><linearGradient id="pfGoalG" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#a855f7"/></linearGradient></defs>' +
    '</svg><div class="pf-ring-txt">' + pct.toFixed(0) + '%</div></div>';

  var rows = list.map(function(a){
    var p      = a.aim > 0 ? Math.min(a.amount / a.aim * 100, 100) : 0;
    var barClr = p >= 80 ? 'var(--green)' : p >= 50 ? 'var(--gold)' : 'var(--blue)';
    var remClr = p >= 80 ? 'var(--green)' : p >= 50 ? 'var(--gold)' : '#94a3b8';
    var remLbl = a.remaining > 0 ? portFmt(a.remaining) : (a.aim > 0 ? '✓ Done' : '—');
    return '<div class="pf-aim">' +
      '<div class="pf-aim-top">' +
        '<span class="pf-aim-cat" title="' + portEsc(a.category) + '">' + portEsc(a.category) + '</span>' +
        '<span class="pf-aim-pct" style="color:' + barClr + '">' + p.toFixed(1) + '%</span>' +
      '</div>' +
      '<div class="pf-aim-bar"><div class="pf-aim-fill' + (p >= 80 ? ' near' : '') + '" ' +
        'style="background-color:' + barClr + '" data-w="' + p.toFixed(1) + '"></div></div>' +
      '<div class="pf-aim-nums">' +
        '<span class="pf-aim-cur">' + portFmt(a.amount) + ' of ' + portFmt(a.aim) + '</span>' +
        '<span class="pf-aim-rem" style="color:' + remClr + '">' + remLbl + '</span>' +
      '</div></div>';
  }).join('');

  return '<div class="pf-goal-head">' + ring +
      '<div class="pf-goal-meta">' +
        '<span class="pf-goal-phase">Phase ' + phase + (isLast ? ' · Latest' : '') + '</span>' +
        '<span class="pf-goal-amt">' + portFmt(t.amount) + '</span>' +
        '<span class="pf-goal-of">of ' + portFmt(t.aim) + ' · ' + t.done + '/' + t.count + ' targets met</span>' +
        '<span class="pf-goal-left" style="color:' + (isDone ? 'var(--green)' : 'var(--red2)') + '">' +
          (isDone ? '✓ Target reached' : portFmt(t.remaining) + ' left') + '</span>' +
      '</div></div>' +
    '<div class="pf-aims">' + rows + '</div>';
}

        '<button class="pf-toggle' + (_portShowProj ? ' active' : '') + '" id="portProjToggle" type="button" title="Linear projection" onclick="portToggleProj()"><i style="background:#fbbf24"></i> Projection</button>' +

function portRangedGrowth(){
  var n = { '6m':6, '1y':12, '2y':24 }[_portRange];
  if(!n || _portGrowthAll.length <= n) return _portGrowthAll.slice();
  return _portGrowthAll.slice(_portGrowthAll.length - n);
}

function portSetRange(r){
  _portRange = r;
  var btns = document.querySelectorAll('#page-port .pf-seg-btn[data-range]');
  for(var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].dataset.range === r);
  portBuildGrowthChart();
}

function portBuildGrowthChart(){
  var canvas = document.getElementById('portGrowthChart');
  if(!canvas || typeof Chart === 'undefined') return;
  var growth = portRangedGrowth();
  if(!growth.length) return;

  if(_portGrowthChart){ try{ _portGrowthChart.destroy(); }catch(e){} _portGrowthChart = null; }

  var ctx     = canvas.getContext('2d');
  var glabels = growth.map(function(g){ return g.date; });
  var amounts = growth.map(function(g){ return g.amount; });
  var notes   = growth.map(function(g){ return g.note; });
  var reduce  = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 3-point moving average */
  var ma = [];
  for(var m = 0; m < amounts.length; m++){
    ma.push(m < 2 ? null : (amounts[m-2] + amounts[m-1] + amounts[m]) / 3);
  }

  /* linear projection, next 3 points */
  var proj = [], fullProj = null, fullLabels = null;
  if(amounts.length >= 2){
    var n = amounts.length, sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
    for(var p = 0; p < n; p++){ sumX += p; sumY += amounts[p]; sumXY += p * amounts[p]; sumX2 += p * p; }
    var denom = n * sumX2 - sumX * sumX;
    if(denom !== 0){
      var slope = (n * sumXY - sumX * sumY) / denom;
      var inter = (sumY - slope * sumX) / n;
      var projLabels = [];
      for(var f = 1; f <= 3; f++){
        proj.push(Math.max(0, inter + slope * (n - 1 + f)));
        projLabels.push('Proj+' + f);
      }
      fullProj = [];
      for(var j = 0; j < amounts.length; j++) fullProj.push(null);
      fullProj[amounts.length - 1] = amounts[amounts.length - 1];  /* join the line */
      fullProj = fullProj.concat(proj);
      fullLabels = glabels.concat(projLabels);
    }
  }

  var fill = ctx.createLinearGradient(0, 0, 0, 240);
  fill.addColorStop(0, 'rgba(45,212,191,.38)');
  fill.addColorStop(1, 'rgba(45,212,191,.02)');

  var all  = fullProj ? amounts.concat(proj) : amounts;
  var lo   = Math.min.apply(null, all), hi = Math.max.apply(null, all);
  var step = Math.max(Math.pow(10, Math.floor(Math.log(Math.max(hi,1)) / Math.LN10) - 1), 1);
  var yMin = Math.max(0, Math.floor((lo * 0.94) / step) * step);
  var yMax = Math.ceil((hi * 1.04) / step) * step;
  if(yMax <= yMin) yMax = yMin + step;

  var datasets = [{
    label:'Portfolio Value', data:amounts,
    borderColor:'#2dd4bf', backgroundColor:fill, borderWidth:3, fill:true, tension:.38,
    pointBackgroundColor:amounts.map(function(v,i){ return notes[i] ? '#ffd700' : '#2dd4bf'; }),
    pointRadius:amounts.map(function(v,i){ return notes[i] ? 7 : 4; }),
    pointHoverRadius:9, pointBorderColor:'rgba(0,0,0,.5)', pointBorderWidth:2, order:1
  },{
    label:'MA (3-pt)', data:ma, hidden:!_portShowMA,
    borderColor:'#a855f7', borderWidth:2.5, fill:false, tension:.45,
    pointRadius:0, pointHoverRadius:5, pointBackgroundColor:'#a855f7', borderDash:[4,3], order:2
  }];

  if(fullProj){
    datasets.push({
      label:'Projection', data:fullProj, hidden:!_portShowProj,
      borderColor:'#fbbf24', borderWidth:2.5, fill:false, tension:.35,
      pointRadius:function(c){ return c.dataIndex >= amounts.length ? 5 : 0; },
      pointHoverRadius:7, pointBackgroundColor:'#fbbf24', pointBorderColor:'#fbbf24',
      borderDash:[8,4], order:3
    });
  }

  _portGrowthChart = new Chart(ctx, {
    type:'line',
    data:{ labels: fullLabels || glabels, datasets: datasets },
    options:{ responsive:true, maintainAspectRatio:false, animation:{ duration: reduce ? 0 : 1400 },
      interaction:{ mode:'index', intersect:false },
      plugins:{
        legend:{ display:true, position:'bottom',
          labels:{ color:'rgba(255,255,255,.4)', font:{ size:10 }, padding:10, boxWidth:12, usePointStyle:true, pointStyleWidth:6 } },
        tooltip:{ backgroundColor:'rgba(6,11,24,.96)', borderColor:'rgba(45,212,191,.3)', borderWidth:1,
          titleColor:'#2dd4bf', bodyColor:'rgba(255,255,255,.65)', padding:11,
          filter:function(item){ return item.parsed.y !== null && item.parsed.y !== undefined; },
          callbacks:{
            label:function(c){
              var base = ' ₨' + Number(c.parsed.y).toLocaleString('en-IN',{ minimumFractionDigits:0, maximumFractionDigits:0 });
              if(c.datasetIndex === 1) return ' MA:' + base;
              if(c.datasetIndex === 2) return ' 🔮' + base;
              var nt = notes[c.dataIndex];
              return nt ? [base, ' 📌 ' + nt] : base;
            } } } },
      scales:{
        x:{ ticks:{ color:'rgba(255,255,255,.45)', font:{ size:10 }, maxRotation:0, autoSkipPadding:14 },
            grid:{ color:'rgba(255,255,255,.04)' } },
        y:{ min:yMin, max:yMax,
            ticks:{ color:'rgba(255,255,255,.4)', font:{ size:10 }, callback:portTick },
            grid:{ color:'rgba(255,255,255,.05)' } } } }
  });

  /* stat tiles */
  var first = amounts[0] || 0, last = amounts[amounts.length - 1] || 0;
  var growPct = first > 0 ? (last - first) / first * 100 : 0;
  var ann = '—';
  if(amounts.length >= 2 && first > 0 && last > 0){
    var yrs = Math.max(amounts.length / 12, 0.08);
    var cagr = (Math.pow(last / first, 1 / yrs) - 1) * 100;
    if(isFinite(cagr)) ann = (cagr >= 0 ? '+' : '') + cagr.toFixed(1) + '%';
  }
  var gs = function(lbl, val, col){
    return '<div class="pf-gs"><div class="pf-gs-lbl">' + lbl + '</div>' +
      '<div class="pf-gs-val"' + (col ? ' style="color:' + col + '"' : '') + '>' + val + '</div></div>';
  };
  var statsEl = document.getElementById('portGrowthStats');
  if(statsEl){
    statsEl.innerHTML =
      gs('Start',  portFmtShort(first)) +
      gs('Latest', portFmtShort(last)) +
      gs('Growth', (growPct >= 0 ? '+' : '') + growPct.toFixed(1) + '%', growPct >= 0 ? '#00ff88' : '#ff4d8d') +
      gs('Ann. Rate', ann, '#a855f7') +
      gs('Entries', amounts.length);
  }

  var msEl = document.getElementById('portGrowthMilestones');
  if(msEl){
    msEl.innerHTML = growth.filter(function(g){ return g.note; })
      .map(function(g){ return '<span class="pf-ms">📌 ' + portEsc(g.date) + ' · ' + portEsc(g.note) + '</span>'; })
      .join('');
  }

  var maBtn = document.getElementById('portMAToggle');
  var pjBtn = document.getElementById('portProjToggle');
  if(maBtn) maBtn.classList.toggle('active', _portShowMA);
  if(pjBtn) pjBtn.classList.toggle('active', _portShowProj);
}

function portToggleMA(){
  _portShowMA = !_portShowMA;
  var btn = document.getElementById('portMAToggle');
  if(btn) btn.classList.toggle('active', _portShowMA);
  if(!_portGrowthChart) return;
  var ds = _portGrowthChart.data.datasets;
  if(ds.length > 1){ ds[1].hidden = !_portShowMA; _portGrowthChart.update(); }
}

function portToggleProj(){
  _portShowProj = !_portShowProj;
  var btn = document.getElementById('portProjToggle');
  if(btn) btn.classList.toggle('active', _portShowProj);
  if(!_portGrowthChart) return;
  var ds = _portGrowthChart.data.datasets;
  if(ds.length > 2){ ds[2].hidden = !_portShowProj; _portGrowthChart.update(); }
}

/* ═══════════════════════════════════════════
   ⑤ ASSETS — toolbar, card grid, drill-down
═══════════════════════════════════════════ */
function portToolbarHtml(){
  var chips = '';
  [['all','All'],['asset','Assets'],['owe','Owed'],['other','Other']].forEach(function(c){
    chips += '<button class="pf-chip' + (c[0] === _portFilter ? ' active' : '') + '" type="button" ' +
      'data-filter="' + c[0] + '" onclick="portSetFilter(\'' + c[0] + '\')">' + c[1] + '</button>';
  });

  return '<div class="pf-toolbar">' +
    '<label class="pf-search">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>' +
      '<input id="portSearch" type="search" placeholder="Search assets…" aria-label="Search assets" oninput="portSetQuery(this.value)">' +
    '</label>' +
    '<select class="pf-select" id="portSort" aria-label="Sort assets" onchange="portSetSort(this.value)">' +
      '<option value="val-desc">Value ↓</option>' +
      '<option value="val-asc">Value ↑</option>' +
      '<option value="name">Name A–Z</option>' +
      '<option value="type">Type</option>' +
    '</select>' +
    '<div class="pf-chips" role="group" aria-label="Filter">' + chips + '</div>' +
  '</div>';
}

function portSetFilter(f){
  _portFilter = f;
  var btns = document.querySelectorAll('#page-port .pf-chip[data-filter]');
  for(var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].dataset.filter === f);
  portRenderAssets();
}

function portSetSort(s){ _portSort = s; portRenderAssets(); }
function portSetQuery(q){ _portQuery = (q || '').toLowerCase().trim(); portRenderAssets(); }

function portFilteredAssets(){
  var out = _portAssets.filter(function(a){
    if(_portQuery && a.cat.toLowerCase().indexOf(_portQuery) < 0) return false;
    if(_portFilter === 'asset') return a.cls === 'positive';
    if(_portFilter === 'owe')   return a.cls === 'negative' || a.amt < 0;
    if(_portFilter === 'other') return a.cls === 'neutral' && a.amt >= 0;
    return true;
  });
  var s = _portSort;
  out.sort(function(x, y){
    if(s === 'val-asc')  return x.amt - y.amt;
    if(s === 'name')     return x.cat.localeCompare(y.cat);
    if(s === 'type')     return x.cls.localeCompare(y.cls) || y.amt - x.amt;
    return y.amt - x.amt;
  });
  return out;
}

function portRenderAssets(){
  var box = document.getElementById('portAssetsBody'); if(!box) return;
  var list = portFilteredAssets();

  if(!list.length){
    box.innerHTML = '<div class="pf-empty">No assets match “' + portEsc(_portQuery) + '”</div>';
    return;
  }

  box.innerHTML = portCardsHtml(list);

  setTimeout(function(){
    var bars = box.querySelectorAll('[data-w]');
    for(var i = 0; i < bars.length; i++) bars[i].style.width = bars[i].dataset.w + '%';
  }, 60);
}

function portBadge(a){
  var badge = a.cls === 'positive' ? 'badge-positive' : a.cls === 'negative' ? 'badge-negative' : 'badge-neutral';
  var text  = a.cls === 'positive' ? 'ASSET' : a.cls === 'negative' ? 'OWE' : 'OTHER';
  return '<span class="asset-badge ' + badge + '">' + text + '</span>';
}

function portAmtCls(a){
  return a.amt < 0 ? 'negative' : a.cls === 'positive' ? 'positive' : 'neutral';
}

function portCardsHtml(list){
  var html = '';
  list.forEach(function(a, n){
    html += '<button class="asset-card" type="button" style="animation-delay:' + Math.min(n * 35, 420) + 'ms" onclick="portOpenAsset(' + a.i + ')">' +
      '<span class="pf-accent" style="background:' + a.color + '"></span>' +
      '<span class="asset-card-top">' +
        '<span style="display:flex;align-items:center;gap:7px;flex:1;min-width:0">' +
          '<span class="pf-rank">#' + (n + 1) + '</span>' +
          '<span class="asset-name">' + portEsc(a.cat) + '</span></span>' +
        portBadge(a) +
      '</span>' +
      '<span class="asset-amount ' + portAmtCls(a) + '" style="display:block">' + portFmt(a.amt) + '</span>' +
      '<span class="pf-share">' +
        '<span class="asset-bar-wrap"><span class="asset-bar" style="display:block;background:' + a.color + '" data-w="' + a.pct.toFixed(1) + '"></span></span>' +
        '<span class="pf-share-pct">' + (a.amt > 0 ? a.pct.toFixed(1) + '%' : '—') + '</span>' +
      '</span>' +
    '</button>';
  });
  return '<div class="assets-grid">' + html + '</div>';
}

/* ── drill-down sheet ── */
function portOpenAsset(i){
  var a = _portAssets[i]; if(!a) return;
  var panel = document.getElementById('portSheetPanel');
  var sheet = document.getElementById('portSheet');
  if(!panel || !sheet) return;

  var ranked = _portAssets.filter(function(x){ return x.amt > 0; }).sort(function(x, y){ return y.amt - x.amt; });
  var rank   = ranked.indexOf(a) + 1;
  var amtCol = a.amt < 0 ? 'var(--red2)' : a.cls === 'positive' ? '#00ff88' : 'var(--blue)';
  var totPos = _portPos.reduce(function(s, x){ return s + x.amt; }, 0);
  var ofNet  = _portTotals.lkr > 0 ? (a.amt / _portTotals.lkr * 100) : 0;

  panel.innerHTML =
    '<span class="pf-sheet-grab"></span>' +
    '<div class="pf-sheet-head">' +
      '<span class="pf-sheet-dot" style="background:' + a.color + ';box-shadow:0 0 10px ' + a.color + '"></span>' +
      '<span class="pf-sheet-name">' + portEsc(a.cat) + '</span>' + portBadge(a) +
      (rank > 0 ? '<span class="pf-sheet-rank">RANK #' + rank + '</span>' : '') +
    '</div>' +
    '<div class="pf-sheet-amt" style="color:' + amtCol + '">' + portFmt(a.amt) + '</div>' +
    '<div class="pf-sheet-stats">' +
      '<div class="pf-ss"><div class="pf-ss-lbl">Of assets</div><div class="pf-ss-val" style="color:' + a.color + '">' + (a.amt > 0 ? a.pct.toFixed(1) + '%' : '—') + '</div></div>' +
      '<div class="pf-ss"><div class="pf-ss-lbl">Of net worth</div><div class="pf-ss-val">' + (a.amt !== 0 && _portTotals.lkr > 0 ? ofNet.toFixed(1) + '%' : '—') + '</div></div>' +
      '<div class="pf-ss"><div class="pf-ss-lbl">Rank</div><div class="pf-ss-val">' + (rank > 0 ? rank + ' / ' + ranked.length : '—') + '</div></div>' +
    '</div>' +
    (a.amt > 0 ? '<div class="pf-aim-bar"><div class="pf-aim-fill" style="background-color:' + a.color + ';width:' + a.pct.toFixed(1) + '%"></div></div>' : '') +
    '<div class="pf-ss" style="border-left:2px solid ' + a.color + '">' +
      '<div class="pf-ss-lbl">Share of ' + portFmtShort(totPos) + ' in positive balances</div>' +
      '<div class="pf-ss-val" style="font-size:12px;font-weight:600;color:rgba(255,255,255,.55)">' +
        (a.amt > 0 ? portFmt(a.amt) + ' of ' + portFmt(totPos) : 'Not counted — this row is a liability') + '</div>' +
    '</div>' +
    '<button class="pf-sheet-close" type="button" onclick="portCloseAsset()">Close</button>';

  sheet.classList.add('open');
  portHaptic();
}

function portCloseAsset(){
  var sheet = document.getElementById('portSheet');
  if(sheet) sheet.classList.remove('open');
}

/* ═══════════════════════════════════════════
   TICKER
═══════════════════════════════════════════ */
function buildPortTicker(assets, totalLKR){
  if(typeof _buildTick !== 'function') return;
  var fmt = function(n){ return '₨' + Math.abs(n).toLocaleString('en-IN',{ minimumFractionDigits:0, maximumFractionDigits:0 }); };
  var items = assets.map(function(a){
    var pct = totalLKR > 0 ? (a.amt / totalLKR * 100).toFixed(1) : '0.0';
    return '<span class="tick-item">' +
      '<span class="tick-sym">' + portEsc(a.cat.toUpperCase()) + '</span>' +
      ' <span style="color:rgba(255,255,255,.75)">' + fmt(a.amt) + '</span>' +
      (totalLKR > 0 && a.amt > 0 ? ' <span class="tick-chg ' + (a.amt < 0 ? 'fl' : 'fr') + '">' + pct + '%</span>' : '') +
    '</span>';
  });
  _buildTick('portTickerWrap', 'portTickerTrack', items, 40);
}

/* ═══════════════════════════════════════════
   KEYBOARD
═══════════════════════════════════════════ */
document.addEventListener('keydown', function(e){
  var pop = document.getElementById('portLogPop');
  var sheet = document.getElementById('portSheet');
  if(e.key === 'Enter' && pop && pop.classList.contains('open')){ portConfirmLog(); return; }
  if(e.key === 'Escape'){
    if(sheet && sheet.classList.contains('open')){ portCloseAsset(); return; }
    if(pop && pop.classList.contains('open')) portCloseLog();
  }
});
</script>

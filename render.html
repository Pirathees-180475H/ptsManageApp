<!-- ═══ EXPENSE FAB WHEEL (fixed, shown only on Expenses tab) ═══
     One hub in the corner. Tapping it blooms Add and View out along a

<div id="xfab-scrim" onclick="xfabClose()"></div>
<div id="xfab">
  <span class="xfab-pad" aria-hidden="true"></span>
  <span class="xfab-arc" aria-hidden="true"></span>
  <button id="ae-fab" class="xfab-arm" style="--a:-90deg" onclick="xfabRun(openAddExp)" title="Add Expense" aria-label="Add Expense"><span class="xfab-tip">Add</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
  <button id="md-fab" class="xfab-arm" style="--a:180deg;transition-delay:.05s" onclick="xfabRun(mdOpen)" title="This month's expenses" aria-label="This month's expenses"><span class="xfab-tip">View</span><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></svg></button>
  <button id="xfab-hub" onclick="xfabToggle()" aria-expanded="false" aria-controls="xfab" title="Expense actions" aria-label="Expense actions"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button>
</div>
<script>
/* ── quarter wheel: open / close / fire ─────────────────────── */
function xfabSet(open){
  var w=document.getElementById('xfab');
  if(!w) return;
  w.classList.toggle('open', open);
  /* the scrim covers the whole page, so it only goes up once the wheel is
     pinned by a click — a passing hover must not blank out the app */
  document.getElementById('xfab-scrim').classList.toggle('on', open && _xfabPinned);
  document.getElementById('xfab-hub').setAttribute('aria-expanded', open?'true':'false');
}
function xfabClose(){ _xfabPinned=false; xfabSet(false); }
function xfabToggle(){
  var w=document.getElementById('xfab');
  if(!w) return;
  /* hover may have opened it already — the first click then pins it */
  var open = w.classList.contains('open');
  if(open && !_xfabPinned){ _xfabPinned=true; xfabSet(true); }
  else { _xfabPinned=!open; xfabSet(!open); }
  if(typeof haptic==='function') haptic('step');
}
/* close first, then act — the overlay should not open behind a live wheel */
function xfabRun(fn){ _xfabPinned=false; xfabClose(); if(typeof fn==='function') fn(); }
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ _xfabPinned=false; xfabClose(); }
});

/* ── hover: open on pointer, close on a grace delay ──────────
   Driven from JS, not :hover — the arms sit 80px from the hub, and a CSS
   hover that lapses for a single frame on the way out there would snap the
   wheel shut just as you reach for a button. The delay also forgives the
   pointer clipping a corner of the pad. A click pins it open so it stays
   put regardless of where the pointer goes. */
var _xfabHoverT=null, _xfabPinned=false;
(function(){
  var w=document.getElementById('xfab');
  if(!w || !window.matchMedia || !window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;

  w.addEventListener('pointerenter', function(){
    if(_xfabHoverT){ clearTimeout(_xfabHoverT); _xfabHoverT=null; }
    xfabSet(true);
  });
  w.addEventListener('pointerleave', function(){
    if(_xfabPinned) return;
    if(_xfabHoverT) clearTimeout(_xfabHoverT);
    _xfabHoverT=setTimeout(function(){ _xfabHoverT=null; xfabClose(); }, 260);
  });
})();
</script>

<script>
/* ═══════════════════════════════════════════
   HAPTICS
   Short, precise vibration feedback — feedback, not alarms, so
   bursts stay under ~20ms and read as a mechanical detent rather
   than a notification. Silently no-ops when the device has no
   vibration motor (iOS Safari) or the user asked for reduced motion.

     haptic('tick')     one wheel detent
     haptic('select')   an item was chosen
     haptic('success')  a save landed
     haptic('error')    a save failed
     haptic(12)         or any raw ms / pattern array

   toolWheel and cardDeck call this lazily, so it is safe for them
   to load before this block runs.
═══════════════════════════════════════════ */
(function(){
  var PATTERNS = {
    tick:    8,               // wheel crossed into a new wedge — the detent
    step:    6,               // lighter tick (page switch, card cycle)
    open:    [0, 18],         // something sprang open
    select:  [0, 14, 30, 14], // committed to a choice
    success: [0, 12, 40, 12], // saved
    warn:    [0, 30, 60, 30], // careful
    error:   180,             // unmistakably bad — the only long one
    pop:     12               // card lifted / panel expanded
  };

  var supported = false;
  try { supported = (typeof navigator !== 'undefined' &&
                     typeof navigator.vibrate === 'function'); } catch(e){}

  var reduced = false;
  try {
    var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    reduced = !!mq.matches;
    if (mq.addEventListener) mq.addEventListener('change', function(e){ reduced = e.matches; });
    else if (mq.addListener) mq.addListener(function(e){ reduced = e.matches; });
  } catch(e){}

  function haptic(kind){
    if(!supported || reduced) return false;
    var p = (typeof kind === 'number' || Object.prototype.toString.call(kind) === '[object Array]')
              ? kind : PATTERNS[kind];
    if(p === undefined || p === null) return false;
    try { return navigator.vibrate(p); } catch(e){ return false; }
  }

  haptic.supported = supported;
  haptic.patterns  = PATTERNS;
  haptic.reduced   = function(){ return reduced; };

  window.haptic = haptic;
})();

/* ═══════════════════════════════════════════
   SPA ROUTER
═══════════════════════════════════════════ */
var _spaLoaded = {cse:false, cc:false, ca:false, exp:false, port:false, mf:false, sw:false};

/* ── Background preload state for Analyze modal tabs ── */
var _analyzePreloaded = { heatmap:false, majorexp:false };
var _analyzePreloadData = { majorexp:null };
/* heatmap uses _hmData/_hmYearTotals set directly & also a flag */

var _activePage = 'exp';
function _doShowPage(name){
  if(name !== _activePage) if(typeof haptic==='function')haptic('step');
  _activePage = name;

  // Show/hide the expense FAB wheel (Add + View) — only on Expenses tab
  var xfab=document.getElementById('xfab');
  if(xfab){
    xfab.classList.toggle('shown', name==='exp');
    if(name!=='exp') xfabClose();
  }

  // Show/hide MF Add Plan FAB — only on Money Flow tab
  var mfFab=document.getElementById('mf-fab');
  if(mfFab) mfFab.style.display = name==='mf' ? 'flex' : 'none';

  document.querySelectorAll('.spa-page').forEach(function(p){
    p.classList.remove('active');
  });
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.bnav-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.page===name);
  });

  // Investments FABs (edit holdings / add FD) follow its own sub-tab
  if(typeof invSyncFabs === 'function') invSyncFabs();

  if(!_spaLoaded[name]){
    _spaLoaded[name]=true;
    if(name==='cse')  cseStartLoad();
    if(name==='cc')   ccLoad();
    if(name==='ca')   caLoad();
    if(name==='exp')  expLoad();
    if(name==='port') portLoad();
    if(name==='mf')   mfLoad();
    if(name==='bank') bankLoad();
  }
}

function showPage(name){
  if(name==='port'){
    // Always require PIN for Summary tab — pass current page so cancel can return to it
    window._pinGuard(_activePage, function(){ _doShowPage('port'); });
  } else {
    _doShowPage(name);
  }
}

/* ── Per-tab Reload ─────────────────────────────── */
function reloadPage(name){
  // Animate the button
  var btn = document.querySelector('#page-'+name+' .pg-reload-btn');
  if(btn){ btn.style.opacity='.4'; btn.style.transform='rotate(180deg)'; }
  setTimeout(function(){ if(btn){ btn.style.transform=''; btn.style.opacity=''; } }, 500);

  // Reset loaded flag so _doShowPage triggers the load function again
  _spaLoaded[name] = false;

  // Re-trigger load (port re-uses existing PIN session — no re-auth needed)
  _spaLoaded[name]=false;
  if(name==='cse')  cseStartLoad();
  else if(name==='cc')   { document.getElementById('cc-root').innerHTML='<div class="loading"><div class="cc-spinner"></div><div class="loading-txt">Loading credit card data…</div></div>'; ccLoad(); _spaLoaded.cc=true; }

  else if(name==='exp')  { document.getElementById('exp-root').innerHTML='<div class="exp-loader"><div class="exp-spinner"></div><p style="color:rgba(255,255,255,.3);font-size:13px">Fetching expense data…</p></div>'; mdReset(); mdPrefetch(); expLoad(); _spaLoaded.exp=true; }

function initCmdPalette() {
  var input = document.getElementById('cmd-input');
  var bg = document.getElementById('cmd-palette-bg');

  window.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      toggleCmdPalette();
    }
    if (e.key === 'Escape' && bg.classList.contains('open')) {
      closeCmdPalette();
    }
  });

  input.addEventListener('input', function() {
    renderCmdList(this.value);
  });

  input.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      _cmdSelectedIdx = (_cmdSelectedIdx + 1) % _cmdFiltered.length;
      updateCmdSelection();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      _cmdSelectedIdx = (_cmdSelectedIdx - 1 + _cmdFiltered.length) % _cmdFiltered.length;
      updateCmdSelection();
    } else if (e.key === 'Enter') {
      var item = _cmdFiltered[_cmdSelectedIdx];
      if (item) {
        if (item.action) {
          window[item.action]();
        } else if (item.tab !== undefined) {
          showPage(item.id);
          invTab(item.tab);
        } else {
          showPage(item.id);
        }
        closeCmdPalette();
      }
    }
  });
}

function toggleCmdPalette() {
  var bg = document.getElementById('cmd-palette-bg');
  var input = document.getElementById('cmd-input');
  if (bg.classList.contains('open')) {
    closeCmdPalette();
  } else {
    bg.classList.add('open');
    input.value = '';
    _cmdSelectedIdx = 0;
    renderCmdList('');
    setTimeout(function() { input.focus(); }, 50);
  }
}

function closeCmdPalette() {
  document.getElementById('cmd-palette-bg').classList.remove('open');
}

function renderCmdList(query) {
  query = query.toLowerCase().trim();
  _cmdFiltered = _cmdPages.filter(function(p) {
    return p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query);
  });

  var list = document.getElementById('cmd-list');
  list.innerHTML = _cmdFiltered.map(function(p, i) {
    var clickAction = '';
    if (p.action) {
      clickAction = 'window.' + p.action + '();closeCmdPalette()';
    } else if (p.tab !== undefined) {
      clickAction = 'showPage(\'' + p.id + '\');invTab(\'' + p.tab + '\');closeCmdPalette()';
    } else {
      clickAction = 'showPage(\'' + p.id + '\');closeCmdPalette()';
    }
      
    return '<div class="cmd-item' + (i === 0 ? ' selected' : '') + '" onclick="' + clickAction + '">' +
      '<div class="cmd-icon">' + p.icon + '</div>' +
      '<div class="cmd-info">' +
        '<div class="cmd-name">' + p.name + '</div>' +
        '<div class="cmd-desc">' + p.desc + '</div>' +
      '</div>' +
      '<div class="cmd-key">↵</div>' +
    '</div>';
  }).join('');
  
  _cmdSelectedIdx = 0;
}

function updateCmdSelection() {
  var items = document.querySelectorAll('.cmd-item');
  items.forEach(function(el, i) {
    el.classList.toggle('selected', i === _cmdSelectedIdx);
    if (i === _cmdSelectedIdx) el.scrollIntoView({ block: 'nearest' });
  });
}

function catPanelOpen(categoryName) {

    .withSuccessHandler(function(data){ catPanelRender(data); })
    .withFailureHandler(function(err){

function catPanelClose() {
  document.getElementById('cat-alltime-panel').classList.remove('open');

function catPanelRender(data) {
  var body = document.getElementById('cat-p-body');
  if (!data || !data.success) {
    body.innerHTML = '<div class="cat-p-empty">⚠️ ' + (data ? data.error : 'Failed to load') + '</div>';
    return;
  }
  // Reverse: latest first
  _catEntriesAll = (data.entries || []).slice().reverse();
  _catEntries    = _catEntriesAll.slice();
  _catTotal      = data.total || 0;
  _catPage       = 0;
  _catSearchTerm = '';

  if (!_catEntriesAll.length) {
    body.innerHTML = '<div class="cat-p-empty">📭 No transactions found for ' + escHtml(data.category) + '.</div>';
    return;
  }

  var count  = _catEntriesAll.length;
  var avgAmt = count > 0 ? _catTotal / count : 0;
  document.getElementById('cat-p-sub').textContent = count + ' entries · All-time';

  // Stats bar + search
  var statsHtml = '<div class="cat-p-stats">'
    + '<div class="cat-p-stat"><div class="cat-p-stat-lbl">Total</div><div class="cat-p-stat-val">₨ ' + _catTotal.toLocaleString('en-IN') + '</div></div>'
    + '<div class="cat-p-stat"><div class="cat-p-stat-lbl">Entries</div><div class="cat-p-stat-val">' + count + '</div></div>'
    + '<div class="cat-p-stat"><div class="cat-p-stat-lbl">Avg per Entry</div><div class="cat-p-stat-val">₨ ' + Math.round(avgAmt).toLocaleString('en-IN') + '</div></div>'
    + '</div>'
    + '<div class="cat-p-search">'
    + '<input type="text" id="cat-p-search-input" class="cat-p-search-input" placeholder="Search by date or reference..." oninput="catPanelSearch(this.value)">'
    + '<button class="cat-p-search-clear" onclick="catPanelSearchClear()">✕ Clear</button>'
    + '</div>';

  body.innerHTML = statsHtml + '<div id="cat-p-table-wrap"></div>';
  catPanelPage(0);
}

function catPanelSearch(term) {
  _catSearchTerm = (term || '').toLowerCase().trim();
  if (!_catSearchTerm) {
    _catEntries = _catEntriesAll.slice();
  } else {
    _catEntries = _catEntriesAll.filter(function(e) {
      var dateMatch = e.dateLabel && e.dateLabel.toLowerCase().indexOf(_catSearchTerm) >= 0;
      var refMatch  = e.reference && e.reference.toLowerCase().indexOf(_catSearchTerm) >= 0;
      var amtMatch  = String(e.amount).indexOf(_catSearchTerm) >= 0;
      return dateMatch || refMatch || amtMatch;
    });
  }
  _catPage = 0;
  catPanelPage(0);
}

function catPanelSearchClear() {
  var inp = document.getElementById('cat-p-search-input');
  if (inp) inp.value = '';
  catPanelSearch('');
}

function catPanelPage(page) {
  _catPage = page;
  var count    = _catEntries.length;
  var pages    = Math.ceil(count / CAT_PAGE_SIZE) || 1;
  var start    = page * CAT_PAGE_SIZE;
  var end      = Math.min(start + CAT_PAGE_SIZE, count);
  var slice    = _catEntries.slice(start, end);

  // Handle no results
  if (!count) {
    document.getElementById('cat-p-table-wrap').innerHTML = '<div class="cat-p-empty">🔍 No entries match your search.</div>';
    return;
  }

  var html = '<table class="cat-p-table"><thead><tr><th>Date</th><th>Reference</th><th class="r">Amount</th></tr></thead><tbody>';
  slice.forEach(function(e) {
    var refCell = e.reference ? escHtml(e.reference) : '<span style="opacity:.35;">—</span>';
    html += '<tr>'
      + '<td class="col-date">' + escHtml(e.dateLabel) + '</td>'
      + '<td class="col-ref">'  + refCell + '</td>'
      + '<td class="col-amt">₨ ' + e.amount.toLocaleString('en-IN') + '</td>'
      + '</tr>';
  });
  // Page total footer
  var pageTotal = slice.reduce(function(s,e){return s+e.amount;},0);
  html += '<tr style="border-top:2px solid rgba(255,255,255,.1);">'
    + '<td colspan="2" style="font-weight:800;font-size:.8em;color:rgba(255,255,255,.7);padding:10px;">Page Total</td>'
    + '<td class="col-amt" style="font-weight:800;color:#fff;">₨ ' + pageTotal.toLocaleString('en-IN') + '</td>'
    + '</tr>';
  html += '</tbody></table>';

  // Pagination info - show filtered count if searching
  var pagerInfo = (start+1) + '–' + end + ' of ' + count;
  if (_catSearchTerm && count < _catEntriesAll.length) {
    pagerInfo += ' <span style="opacity:.5;">(filtered from ' + _catEntriesAll.length + ')</span>';
  }

  // Pagination controls
  html += '<div class="cat-p-pager">'
    + '<span class="cat-p-pager-info">' + pagerInfo + '</span>'
    + '<div class="cat-p-pager-btns">'
    + '<button class="cat-p-pager-btn" onclick="catPanelPage(0)" ' + (page===0?'disabled':'') + '>« First</button>'
    + '<button class="cat-p-pager-btn" onclick="catPanelPage(' + (page-1) + ')" ' + (page===0?'disabled':'') + '>‹ Prev</button>'
    + '<button class="cat-p-pager-btn" onclick="catPanelPage(' + (page+1) + ')" ' + (page>=pages-1?'disabled':'') + '>Next ›</button>'
    + '<button class="cat-p-pager-btn" onclick="catPanelPage(' + (pages-1) + ')" ' + (page>=pages-1?'disabled':'') + '>Last »</button>'
    + '</div></div>';

  document.getElementById('cat-p-table-wrap').innerHTML = html;
}

document.addEventListener('DOMContentLoaded', function(){

    var r = panel.getBoundingClientRect();
    _ox = e.clientX - r.left; _oy = e.clientY - r.top;
    _drag = true; hdr.style.cursor = 'grabbing';

    if(!_drag) return;

  });
  window.addEventListener('mouseup', function(){ _drag = false; hdr.style.cursor = 'grab'; });
});

   The readout uses the monthly table, so its numbers match the KPI strip

var EXP_MON_FULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
var _xsTok=0;
function expK(n){var a=Math.abs(n);return (n<0?'-':'')+(a>=1e5?Math.round(a/1e3)+'k':(a/1e3).toFixed(1).replace(/\.0$/,'')+'k');}

function expHeroHtml(c){

  var left=c.avgU-c.cur,pctU=c.avgU>0?c.cur/c.avgU*100:0;
  var fc=c.inProg&&c.el>0?c.rent+(c.cur-c.rent)/c.el*c.dim:c.cur;
  var burn=c.el>0?(c.cur-c.rent)/c.el:0;

  var tile=function(cls,lbl,val,sub,ids){ids=ids||{};
    return '<div class="xh-tile '+cls+'"'+(ids.t?' title="'+ids.t+'"':'')+'><b>'+lbl+'</b><span'+(ids.v?' id="'+ids.v+'"':'')+'>'+val+'</span><em'+(ids.s?' id="'+ids.s+'"':'')+'>'+sub+'</em></div>';};
  var ribbon=c.catList.map(function(x){return '<span title="'+escHtml(x.name)+' · '+x.pct.toFixed(0)+'%" style="flex:'+x.val+';background:'+x.col+'"></span>';}).join('');
  var legend=c.catList.slice(0,5).map(function(x){return '<span><i style="background:'+x.col+'"></i>'+esc(x.name)+' '+x.pct.toFixed(0)+'%</span>';}).join('');

  return '<section class="xh" id="expHero" aria-label="This month’s spending">'+

      '<div class="xh-chips">'+
        (c.inProg?chip('','xhPace','… vs '+pms+' pace')
                 :chip(mom>0?'bad':'ok','',(mom>0?'▲ +':'▼ ')+Math.abs(mom).toFixed(1)+'% vs '+pms))+
        chip('y','',pctU.toFixed(0)+'% of usual month')+
        chip(left<0?'bad':'',null,left>=0?expFr(left)+' left':expFr(-left)+' over usual')+
        '<span class="xh-badge" id="exp-badge">'+esc(c.label)+'</span>'+
      '</div>'+
      '<div class="xh-tiles">'+
        tile('r','Rent',expFr(c.rent),(c.cur>0?(c.rent/c.cur*100).toFixed(0):0)+'% of the month',{s:'xhRentSub'})+
        tile('s','Subs',expFr(c.subs),c.subsN?c.subsN+' item'+(c.subsN===1?'':'s'):c.subsNote,{s:'xhSubsSub',t:c.subsTip})+
        tile('','Variable',expFr(c.varSpd),'excl. rent &amp; subs')+
        tile('b','Last month',expFr(c.prevTot),pmo+' total')+

                 :tile('b','vs '+pms,(mom>0?'+':'')+mom.toFixed(1)+'%','change in total'))+

                 :tile('y','Usual month',expFr(c.avgU),'avg of finished months'))+
        (c.inProg?tile('y','Safe per day',expFr(Math.max(0,left)/Math.max(1,c.dim-c.el)),(c.dim-c.el)+' day'+(c.dim-c.el===1?'':'s')+' to go')
                 :tile('y','Avg per day',expFr(c.cur/c.dim),'over '+c.dim+' days'))+
        tile('','No-spend','…','burn '+expFr(burn)+'/day',{v:'xhNil'})+
      '</div>'+

      '<div class="xs-wait" id="xsBody"><div class="exp-spinner"></div><span>Loading daily spend…</span></div></div>'+
  '</section>';

/* one in-flight/finished strip request per month; expStripLoad reuses it */
var _xsReq=null;
function expStripFetch(m,y){
  var q={key:m+'-'+y,done:false,ok:false,res:null,cbs:[]};_xsReq=q;
  var fin=function(ok,res){q.done=true;q.ok=ok;q.res=res;q.cbs.forEach(function(f){f(ok,res);});q.cbs=[];};
  google.script.run.withSuccessHandler(function(r){fin(true,r);})
    .withFailureHandler(function(e){fin(false,e&&e.message||String(e));}).getExpenseStrip(m,y);
  return q;
}
function expStripLoad(c){
  var tok=++_xsTok;
  var fail=function(m){
    if(tok!==_xsTok)return;
    var b=document.getElementById('xsBody');if(b){b.className='xs-wait';b.innerHTML='<span>⚠️ Daily spend unavailable'+(m?' · '+esc(m):'')+'</span>';}
    ['xhPrevCum','xhNil'].forEach(function(id){var e=document.getElementById(id);if(e)e.textContent='—';});
    var p=document.getElementById('xhPace');if(p)p.textContent='— vs last month';
  };
  var key=(c.mon+1)+'-'+c.year,q=(_xsReq&&_xsReq.key===key)?_xsReq:expStripFetch(c.mon+1,c.year);
  var done=function(ok,r){

    if(!ok){fail(r);return;}
    if(!r||!r.success){fail(r&&r.error);return;}

function expStripRender(r,c){
  var days=r.days||[],pd=r.prevDays||[],dim=days.length||c.dim,el=Math.min(c.el,dim);
  var mo=EXP_MON_FULL[c.mon],ms=mo.substring(0,3),pms=EXP_MON_FULL[(c.mon+11)%12].substring(0,3);
  var fw=(new Date(c.year,c.mon,1).getDay()+6)%7;           // Monday-first index of day 1
  var WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var i,mx=0,nonRent=0,cum=0,pcum=0,nil=0,rentDay=0;
  for(i=0;i<el;i++){var x=days[i];if(x.t>mx)mx=x.t;nonRent+=x.t;cum+=x.t+x.r;if(!x.t&&!x.r)nil++;if(x.r>0&&!rentDay)rentDay=i+1;}
  for(i=0;i<Math.min(el,pd.length);i++)pcum+=pd[i].t+pd[i].r;
  var hasPrev=pd.some(function(x){return x.t||x.r;});
  if(!mx)mx=1;
  var hOf=function(v){return v>0?8+92*Math.min(v,mx)/mx:0;};
  /* bar colour = GitHub contribution scale: the day's spot between the month's
     lowest and highest spend day picks one of four greens (dim = low, bright = high) */
  var mn=Infinity,maxD=0,minD=0;
  for(i=0;i<el;i++){var t=days[i].t;if(t>0&&t<mn){mn=t;minD=i+1;}if(t>0&&t===mx)maxD=i+1;}
  var XS_GH=['#0e4429','#006d32','#26a641','#39d353'];
  var colOf=function(v){
    var f=mx>mn?(v-mn)/(mx-mn):0;
    return XS_GH[Math.min(3,Math.floor(f*4))];
  };
  var burn=el>0?nonRent/el:0;

  /* biggest three days get a value label */
  var top=days.slice(0,el).map(function(x,j){return {j:j,t:x.t};}).filter(function(o){return o.t>0;})
    .sort(function(a,b){return b.t-a.t;}).slice(0,3).map(function(o){return o.j;});

  /* subscriptions: paid this month; and last month's ones not charged yet (expected) */
  var paid={},exp={},seen={};
  (r.subs||[]).forEach(function(s){(paid[s.day]=paid[s.day]||[]).push(s);seen[s.keyword]=1;});
  if(c.inProg)(r.prevSubs||[]).forEach(function(s){if(seen[s.keyword])return;var d=Math.min(Math.max(s.day,el+1),dim);(exp[d]=exp[d]||[]).push(s);});
  var expN=Object.keys(exp).reduce(function(n,k){return n+exp[k].length;},0);

  var cols='',axis='';
  for(var d=1;d<=dim;d++){
    var o=days[d-1],fut=d>el,wd=(d-1+fw)%7,wk=Math.floor((d-1+fw)/7),cls='xs-col'+(wk%2?' wb':'');
    var h=0,inner='';
    if(fut){cls+=' fut';}
    else if(o.r>0){cls+=' rent';h=100;inner='<span class="xs-rt">RENT '+expK(o.r)+'</span>';}
    else if(!o.t){cls+=' nil';inner='<span class="xs-ok">✓</span>';}
    else{h=hOf(o.t);if(top.indexOf(d-1)>=0||d===minD)inner='<span class="xs-val">'+expK(o.t)+'</span>';
      if(d===maxD)cls+=' hi';else if(d===minD)cls+=' lo';}
    if(d===el&&c.inProg){cls+=' today';inner+='<span class="xs-tdy">TODAY</span>';}
    cols+='<button type="button" class="'+cls+'" data-d="'+d+'" style="--h:'+h.toFixed(1)+'%;--c:'+(o.t>0?colOf(o.t):'transparent')+'" aria-label="'+escHtml(xsDayText(d))+'"><span class="xs-bar"></span>'+inner+'</button>';
    var mk=(paid[d]?'<i class="p"></i>':'')+(exp[d]?'<i class="e"></i>':'');
    /* phone shows 1, 5, 10 … plus today; a multiple of 5 right next to today is dropped so labels don't collide */
    var showNum=(d===1||d%5===0)&&!(c.inProg&&d!==el&&Math.abs(d-el)<=1);
    axis+='<span class="xs-day'+(showNum?' m':'')+(d===el&&c.inProg?' t':'')+'"><b>'+d+'</b><em>'+WD[wd].charAt(0)+'</em><s>'+mk+'</s></span>';
  }
  function xsDayText(d){
    var o=days[d-1],dt=WD[(d-1+fw)%7]+' '+d+' '+ms,bits=[];
    if(d>el)bits.push(c.inProg?'still to come':'no data');
    else{ if(o.r>0)bits.push('rent '+expFr(o.r)); bits.push(o.t?expFr(o.t)+(o.r>0?' other':''):(o.r>0?'':'no spend')); }
    if(d===maxD&&d<=el)bits.push('highest day');else if(d===minD&&d<=el&&maxD!==minD)bits.push('lowest day');
    (paid[d]||[]).forEach(function(s){bits.push(s.reference+' '+expFr(s.amount));});
    (exp[d]||[]).forEach(function(s){bits.push(s.reference+' expected (~'+expFr(s.amount)+')');});
    return dt+' · '+bits.join(' · ');
  }

  var body=document.getElementById('xsBody');if(!body)return;
  body.className='xs-body';
  body.innerHTML=
    '<div class="xs-plot" style="--n:'+dim+'"><span class="xs-avg" style="bottom:'+hOf(burn).toFixed(1)+'%"><em>avg '+expK(burn)+'/day</em></span>'+cols+'</div>'+
    '<div class="xs-axis" style="--n:'+dim+'">'+axis+'</div>'+
    '<div class="xs-info" id="xsInfo" aria-live="polite"></div>'+
    '<div class="xs-leg"><span>Less<i class="g"></i>More</span><span><i class="p"></i>subscription</span>'+(c.inProg?'<span><i class="e"></i>expected</span>':'')+
      '<span><i class="r"></i>rent</span><span class="ok">✓ no-spend</span><span class="xs-hint">tap a day</span></div>';

  var info=document.getElementById('xsInfo'),plot=body.querySelector('.xs-plot');
  var show=function(d){
    var t=xsDayText(d),k=t.indexOf(' · ');
    info.innerHTML='<b>'+esc(t.substring(0,k))+'</b>'+esc(t.substring(k));
    var s=plot.querySelector('.sel');if(s)s.classList.remove('sel');
    var b=plot.querySelector('[data-d="'+d+'"]');if(b)b.classList.add('sel');
  };
  var pickD=function(e){var b=e.target.closest&&e.target.closest('.xs-col');if(b)show(+b.dataset.d);};
  plot.addEventListener('click',pickD);plot.addEventListener('mouseover',pickD);plot.addEventListener('focusin',pickD);
  show(el>0?el:1);

  /* fill the readout bits that need daily data */
  var set=function(id,t){var e=document.getElementById(id);if(e)e.textContent=t;};
  set('xhNil',nil+' day'+(nil===1?'':'s'));
  if(rentDay)set('xhRentSub','paid '+rentDay+' '+ms+' · '+(c.cur>0?(c.rent/c.cur*100).toFixed(0):0)+'%');
  if(expN)set('xhSubsSub',c.subsN+' paid · '+expN+' expected');
  if(c.inProg){
    set('xhPrevCum',hasPrev?expFr(pcum):'—');
    var p=document.getElementById('xhPace');
    if(p){
      if(hasPrev&&pcum>0){var pace=(cum-pcum)/pcum*100;p.textContent=(pace>0?'▲ +':'▼ ')+Math.abs(pace).toFixed(1)+'% vs '+pms+' pace';p.className='xh-chip '+(pace>0?'bad':'ok');}
      else p.textContent='No '+pms+' daily data';
    }
  }
}

/* run render jobs a frame at a time; a newer expBuild supersedes older ones */
var _expJobTok=0;
function expRunJobs(jobs){
  var tok=++_expJobTok,i=0,raf=window.requestAnimationFrame||function(f){return setTimeout(f,16);};
  (function next(){
    if(tok!==_expJobTok||i>=jobs.length)return;
    var t0=Date.now();
    do{ try{jobs[i++]();}catch(e){if(window.console)console.error('Expense chart',e);} }
    while(i<jobs.length&&Date.now()-t0<8);
    raf(function(){setTimeout(next,0);});
  })();
}

function expBuild(D){

  var transVal=['uber','uber work','bus fair'].reduce(function(s,nm){var c=cats.find(function(x){return x.name.toLowerCase()===nm;});return s+(c?c.values[li]||0:0);},0);

  var lyYtd=prevYr?sum(yg[prevYr].months.map(function(m,i){return ytdKeys.indexOf(expMonKey(expSl(m)))>=0?yg[prevYr].totals[i]:0;})):0;
  var ytdPct=lyYtd>0?(ytd-lyYtd)/lyYtd*100:0;

  /* Per-year summary (was the year cards) — now lives in the YoY chart */
  /* The latest column is still filling up when it is this calendar month — a few
     days of spend would otherwise read as the year's "best" month and drag avg/mo down. */
  var _now=new Date(),_lm=latest.match(/20\d{2}/);

  var inProgYr=inProgKey?_lm[0]:null;

      .filter(function(x){return !(yr===inProgYr&&x.k===inProgKey);});
    var dv=done.map(function(x){return x.v;}),a=dv.length?sum(dv)/dv.length:0;

    return {yr:yr,total:t,avg:a,n:g.months.length,partial:yr===inProgYr,best:best,worst:worst,color:EXP_YR_COLORS[yi%EXP_YR_COLORS.length]};
  });
  yrInfo.forEach(function(y,yi){y.yoy=null;if(yi>0&&yrInfo[yi-1].avg>0)y.yoy=(y.avg-yrInfo[yi-1].avg)/yrInfo[yi-1].avg*100;});
  var yrStrip=yrInfo.map(function(y){

  }).join('');

  var subsNote, subsTip='';

  }

  /* header hero context — month of the latest column; "in progress" when it is this calendar month */
  var hMon=expMonIdx(expMonKey(expSl(latest))),hYrM=latest.match(/20\d{2}/),hYr=hYrM?+hYrM[0]:_now.getFullYear();

    cur:cur,rent:rentVal,subs:subsVal,subsN:subs.count||0,subsNote:subsNote,subsTip:subsTip,varSpd:varSpd,prevTot:prev,
    avgU:doneTot.length?sum(doneTot)/doneTot.length:avg,
    catList:catCur.filter(function(x){return x.val>0;}).map(function(x){return {name:x.name,val:x.val,pct:cur>0?x.val/cur*100:0,col:x.name.toLowerCase()==='rent'?'#f59e0b':expCc(x.name,x.i)};})};

      (lyYtd?'<div class="pill '+(ytdPct>0?'bad':'good')+'"><em>📆 YTD vs '+prevYr+'</em><strong>'+(ytdPct>0?'▲ +':'▼ ')+Math.abs(ytdPct).toFixed(1)+'%</strong></div>':'')+

  });
  jobs.push(function(){
    buildExpTicker(cur, avg, 0, 0);  /* budget/remaining fed from edm if loaded */

    preloadAnalyzeData();
  });
  expRunJobs(jobs);
}

/* Squarified treemap → absolutely positioned tiles; click opens the all-time drilldown */
function expTreemap(el,items){
  function draw(){
    var W=el.clientWidth,H=el.clientHeight;if(!W)return;
    var total=items.reduce(function(s,x){return s+x.v;},0),scale=W*H/total;
    var nodes=items.map(function(x){return Object.assign({a:x.v*scale},x);}),out=[];
    var r={x:0,y:0,w:W,h:H};
    function worst(row,side){var s=row.reduce(function(t,n){return t+n.a;},0),mx=Math.max.apply(null,row.map(function(n){return n.a;})),mn=Math.min.apply(null,row.map(function(n){return n.a;}));return Math.max(side*side*mx/(s*s),s*s/(side*side*mn));}
    function lay(row){var s=row.reduce(function(t,n){return t+n.a;},0);
      if(r.w>=r.h){var w=s/r.h,y=r.y;row.forEach(function(n){var h=n.a/w;out.push(Object.assign({x:r.x,y:y,w:w,h:h},n));y+=h;});r.x+=w;r.w-=w;}
      else{var h2=s/r.w,x=r.x;row.forEach(function(n){var w2=n.a/h2;out.push(Object.assign({x:x,y:r.y,w:w2,h:h2},n));x+=w2;});r.y+=h2;r.h-=h2;}}
    var row=[];
    while(nodes.length){var side=Math.min(r.w,r.h),nx=nodes[0];
      if(!row.length||worst(row.concat([nx]),side)<=worst(row,side)){row.push(nodes.shift());}else{lay(row);row=[];}}
    if(row.length)lay(row);
    el.innerHTML=out.map(function(t){
      var big=t.w>110&&t.h>70,mid=t.w>64&&t.h>38;
      return '<button type="button" class="tm-t" style="left:'+t.x+'px;top:'+t.y+'px;width:'+t.w+'px;height:'+t.h+'px;--c:'+t.color+'" title="'+t.name+' · '+expFr(t.v)+' ('+t.pct.toFixed(1)+'%) — click for all entries" onclick="catPanelOpen(\''+t.name.replace(/'/g,"\\'")+'\')">'+
        (mid?'<span class="tm-n">'+t.name+'</span><span class="tm-v">₨'+expF(t.v)+'</span>':'<span class="tm-n" style="font-size:9px">'+t.pct.toFixed(0)+'%</span>')+
        (big?'<span class="tm-p">'+t.pct.toFixed(1)+'% of all · this mo ₨'+expF(t.last)+' <span class="delta '+(t.trend>5?'up':t.trend<-5?'dn':'nt')+'">'+(t.trend>=0?'▲':'▼')+Math.abs(t.trend).toFixed(0)+'%</span></span>':'')+
        '<span class="tm-go">↗</span></button>';
    }).join('');
  }
  draw();
  if(window.ResizeObserver)new ResizeObserver(draw).observe(el);
}

/* ═══════════════════════════════════════════
   BACKGROUND PRELOAD for Analyze modals
   (heatmap, major exp)
═══════════════════════════════════════════ */
function preloadAnalyzeData() {
  // Heatmap data
  if (typeof hmLoad === 'function' && !_analyzePreloaded.heatmap) {
    _analyzePreloaded.heatmap = true;
    try {
      var yr = new Date().getFullYear();
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            _hmData = res;
            var yrs = [];
            for (var y = yr - 4; y <= yr + 1; y++) { yrs.push(y); }
            google.script.run
              .withSuccessHandler(function(yrRes) {
                if (yrRes && yrRes.success) _hmYearTotals = yrRes.totals;
              })
              .getExpenseYearTotals(yrs);
          }
        })
        .getExpenseHeatmapData(yr);
    } catch(e) { _analyzePreloaded.heatmap = false; }
  }

  // Major EXP data
  if (!_analyzePreloaded.majorexp) {
    _analyzePreloaded.majorexp = true;
    google.script.run
      .withSuccessHandler(function(res) {
        _analyzePreloadData.majorexp = res;
      })
      .withFailureHandler(function() {
        _analyzePreloaded.majorexp = false;
      })
      .getMajorExpData();
  }

}

/* ═══════════════════════════════════════════
   PIN MODAL — Summary tab only, every visit
═══════════════════════════════════════════ */
(function(){
  var PIN = '9965';
  var _pinEntry = '';
  var _pinCb    = null;
  var _pinAttempts = 0;

  var bg   = document.getElementById('pin-modal-bg');
  var dots = bg.querySelectorAll('.pin-dot');
  var errEl= bg.querySelector('.pin-err-msg');

  function pinDots(){
    for(var i=0;i<dots.length;i++){
      dots[i].classList.toggle('filled', i < _pinEntry.length);
      dots[i].classList.remove('error');
    }
  }
  function pinShake(){
    for(var i=0;i<dots.length;i++) dots[i].classList.add('error');
  }
  function pinErr(msg){ errEl.textContent=msg; errEl.classList.add('show'); }
  function pinErrHide(){ errEl.classList.remove('show'); }

  function pinReset(){
    _pinEntry=''; _pinAttempts=0; pinDots(); pinErrHide();
  }

  function pinPress(val){
    pinErrHide();
    if(val==='del'){
      if(_pinEntry.length>0){ _pinEntry=_pinEntry.slice(0,-1); pinDots(); }
      return;
    }
    if(_pinEntry.length>=4) return;
    _pinEntry+=val; pinDots();
    if(_pinEntry.length===4) pinCheck();
  }

  function pinCheck(){
    if(_pinEntry===PIN){
      bg.classList.remove('open');
      pinReset();
      if(_pinCb){ _pinCb(); _pinCb=null; }
    } else {
      _pinAttempts++;
      pinShake();
      pinErr(_pinAttempts>=3 ? 'Wrong PIN ('+_pinAttempts+' tries)' : 'Incorrect PIN');
      setTimeout(function(){ _pinEntry=''; pinDots(); }, 500);
    }
  }

  // Wire up buttons
  var keys = bg.querySelectorAll('.pin-key');
  for(var k=0;k<keys.length;k++){
    (function(btn){
      btn.addEventListener('click', function(){
        btn.classList.add('pressed');
        setTimeout(function(){ btn.classList.remove('pressed'); },120);
        pinPress(btn.getAttribute('data-v'));
      });
    })(keys[k]);
  }

  // Physical keyboard — only active when modal is open
  document.addEventListener('keydown', function(e){
    if(!bg.classList.contains('open')) return;
    if(e.key>='0'&&e.key<='9') pinPress(e.key);
    else if(e.key==='Backspace') pinPress('del');
    else if(e.key==='Escape'){ window._pinCancel(); }
  });

  // Expose global so showPage can call it
  var _pinPrevPage = 'exp';
  window._pinGuard = function(prevPage, cb){
    pinReset();
    _pinCb = cb;
    _pinPrevPage = prevPage || 'exp';
    bg.classList.add('open');
  };

  window._pinCancel = function(){
    bg.classList.remove('open');
    pinReset();
    _doShowPage(_pinPrevPage);
  };
})();

/* ═══════════════════════════════════════════════════
   ADD EXPENSE OVERLAY — prefetch / open / close / bridge

   Two things are warmed on boot by aePrefetch(), neither of
   which anything waits for:
     • the modal's own HTML  (getAddExpHtmlContent)
     • the whole month's rows (getExpenseMonth)
   The overlay then opens on an iframe that is already built,
   and the month goes in through postMessage — so opening it
   and stepping between days costs no round trip.
═══════════════════════════════════════════════════ */
(function(){
  var _html    = null;    /* the patched srcdoc, once fetched   */
  var _injected= false;   /* srcdoc has been handed to the iframe */
  var _ready   = false;   /* the iframe has loaded and can listen */
  var _month   = null;    /* getExpenseMonth() payload           */
  var _monthAt = 0;       /* when we fetched it                  */
  var _pending = false;
  var MONTH_TTL = 5 * 60 * 1000;   /* revalidate quietly after 5 min */

  /* ── The google.script.run shim injected into the iframe ── */
  var FNS = ['getExpenseRow','getExpenseMonth','updateExpenseCells'];
  var BRIDGE_SCRIPT = [
    '(function(){',
    '  var _cbs={};',
    '  window.addEventListener("message",function(e){',
    '    if(!e.data||e.data.type!=="gsres")return;',
    '    var c=_cbs[e.data.cbId];',
    '    if(!c)return;',
    '    if(e.data.isErr)c._f&&c._f(e.data.payload);',
    '    else c._s&&c._s(e.data.payload);',
    '    delete _cbs[e.data.cbId];',
    '  });',
    '  var FNS=' + JSON.stringify(FNS) + ';',
    '  function mk(){',
    '    var o={_s:null,_f:null};',
    '    o.withSuccessHandler=function(c){o._s=c;return o;};',
    '    o.withFailureHandler=function(c){o._f=c;return o;};',
    '    FNS.forEach(function(fn){',
    '      o[fn]=function(){',
    '        var id=Math.random().toString(36).slice(2);',
    '        _cbs[id]={_s:o._s,_f:o._f};',
    '        o._s=null;o._f=null;',
    '        window.parent.postMessage({type:"gsrun",fn:fn,args:Array.prototype.slice.call(arguments),cbId:id},"*");',
    '      };',
    '    });',
    '    return o;',
    '  }',
    '  var _runner=mk();',
    '  var run={',
    '    withSuccessHandler:function(c){_runner=mk();_runner._s=c;return _runner;},',
    '    withFailureHandler:function(c){_runner._f=c;return _runner;}',
    '  };',
    '  FNS.forEach(function(fn){',
    '    run[fn]=function(){_runner[fn].apply(_runner,arguments);_runner=mk();};',
    '  });',
    '  window.google={script:{run:run}};',
    '})();' 
  ].join('\n');

  /* ── Relay: parent listens for the iframe's gsrun messages ── */
  window.addEventListener('message', function(e) {
    if (!e.data) return;
    var iframe = document.getElementById('ae-iframe');

    /* the modal says it is up and wants the cached month */
    if (e.data.type === 'aeready') {
      _ready = true;
      _post({type:'aemonth', payload:_month, stale:_stale()});
      return;
    }
    /* the modal saved cells — keep the parent's copy in step */
    if (e.data.type === 'aesaved') {
      if (_month && _month.days && e.data.dateKey) {
        var day = _month.days[e.data.dateKey] || (_month.days[e.data.dateKey] = {});
        var cells = e.data.cells || {};
        Object.keys(cells).forEach(function(col) {
          if (col === 'B')  { _month.B  = cells[col]; return; }
          if (col === 'D2') { _month.D2 = cells[col]; return; }
          if (cells[col] === '' || cells[col] === null) delete day[col];
          else day[col] = cells[col];
        });
      }
      if (_activePage === 'exp' && typeof reloadPage === 'function') reloadPage('exp');
      return;
    }
    /* Esc inside the iframe closes the overlay */
    if (e.data.type === 'aeclose') { closeAddExp(); return; }
    /* the modal's day calendar wants a month's budget — answered from
       monthDetail's cache, the same read the Month tab shows */
    if (e.data.type === 'aeplanreq') {
      var pm = e.data.month, py = e.data.year;
      if (typeof mdPlanFor === 'function')
        mdPlanFor(pm, py, function(plan){ _post({type:'aeplan', month:pm, year:py, plan:plan}); });
      return;
    }
    if (e.data.type !== 'gsrun') return;

    if (!iframe || !iframe.contentWindow) return;
    google.script.run
      .withSuccessHandler(function(r) {
        iframe.contentWindow.postMessage({type:'gsres', cbId:e.data.cbId, isErr:false, payload:r}, '*');
      })
      .withFailureHandler(function(err) {
        iframe.contentWindow.postMessage({type:'gsres', cbId:e.data.cbId, isErr:true, payload:err}, '*');
      })
      [e.data.fn].apply(null, e.data.args);
  });

  function _post(msg) {
    var iframe = document.getElementById('ae-iframe');
    if (_ready && iframe && iframe.contentWindow) iframe.contentWindow.postMessage(msg, '*');
  }
  function _stale() {
    return !_monthAt || (new Date().getTime() - _monthAt) > MONTH_TTL;
  }

  /* ── Warm both halves on boot; nothing blocks on either ── */
  function fetchMonth(then) {
    if (_pending) return;
    _pending = true;
    google.script.run
      .withSuccessHandler(function(res) {
        _pending = false;
        if (res && !res.error) { _month = res; _monthAt = new Date().getTime(); }
        if (then) then();
      })
      .withFailureHandler(function() { _pending = false; if (then) then(); })
      .getExpenseMonth();
  }

  window.aePrefetch = function() {
    if (!_html) {
      google.script.run
        .withSuccessHandler(function(html) {
          _html = html.replace('</head>', '<script>' + BRIDGE_SCRIPT + '<\/script></head>');
          inject();
        })
        .withFailureHandler(function(){ /* the FAB falls back to fetching on open */ })
        .getAddExpHtmlContent();
    }
    fetchMonth();
  };

  function inject() {
    if (_injected || !_html) return;
    _injected = true;
    var iframe = document.getElementById('ae-iframe');
    if (!iframe) return;
    iframe.onload = function() {
      var l = document.getElementById('ae-loading');
      if (l) l.style.display = 'none';
      iframe.style.display = 'block';
    };
    iframe.srcdoc = _html;
  }

  /* ── Open overlay ── */
  window.openAddExp = function(focusCol) {
    var overlay = document.getElementById('ae-overlay');
    overlay.classList.add('open');

    if (_html) {
      inject();
    } else {
      google.script.run
        .withSuccessHandler(function(html) {
          _html = html.replace('</head>', '<script>' + BRIDGE_SCRIPT + '<\/script></head>');
          inject();
        })
        .withFailureHandler(function(err) {
          var l = document.getElementById('ae-loading');
          if (l) l.innerHTML = '<span style="color:#ff4d6d">Failed to load: ' + (err && err.message || err) + '</span>';
        })
        .getAddExpHtmlContent();
    }

    /* show what we have, then quietly refresh if it has aged */
    _post({type:'aemonth', payload:_month, stale:_stale(), focus:focusCol || null});
    if (_stale()) fetchMonth(function(){ _post({type:'aemonth', payload:_month, stale:false}); });
  };

  /* budgets saved in Month Detail — recolour the modal's calendar */
  window.aePlanChanged = function(m, y, plan) {
    _post({type:'aeplan', month:m, year:y, plan:plan});
  };

  /* ── Close overlay ── */
  window.closeAddExp = function() {
    document.getElementById('ae-overlay').classList.remove('open');
  };

  /* Close on backdrop click */
  document.getElementById('ae-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeAddExp();
  });

  /* Escape closes it; Ctrl/⌘L opens it on today's food row
     (the shortcut the old Quick Add used) */
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeAddExp();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'l') {
      e.preventDefault();
      openAddExp('C');
    }
  });
})();

/* ═══════════════════════════════════════════
   CALCULATOR
═══════════════════════════════════════════ */
(function(){
  var _expr = '';
  var _history = [];
  var _hasResult = false;
  var _ops = ['+','-','*','/','+'];
  var _positioned = false; // true after first open → uses top/left

  /* ── Drag ── */
  document.addEventListener('DOMContentLoaded', function(){
    var panel   = document.getElementById('calc-panel');
    var topbar  = panel.querySelector('.calc-topbar');
    var _drag   = false, _ox = 0, _oy = 0;

    function startDrag(cx, cy){
      var r = panel.getBoundingClientRect();
      _ox = cx - r.left;
      _oy = cy - r.top;
      _drag = true;
      topbar.style.cursor = 'grabbing';
    }
    function moveDrag(cx, cy){
      if(!_drag) return;
      var pw = panel.offsetWidth, ph = panel.offsetHeight;
      var maxX = window.innerWidth  - pw;
      var maxY = window.innerHeight - ph;
      var nx = Math.max(0, Math.min(cx - _ox, maxX));
      var ny = Math.max(0, Math.min(cy - _oy, maxY));
      panel.style.left   = nx + 'px';
      panel.style.top    = ny + 'px';
      panel.style.bottom = 'auto';
    }
    function endDrag(){
      _drag = false;
      topbar.style.cursor = 'grab';
    }

    topbar.addEventListener('mousedown',  function(e){ if(e.target.closest('button')) return; startDrag(e.clientX, e.clientY); });
    document.addEventListener('mousemove', function(e){ moveDrag(e.clientX, e.clientY); });
    document.addEventListener('mouseup',   endDrag);

    topbar.addEventListener('touchstart', function(e){ if(e.target.closest('button')) return; var t=e.touches[0]; startDrag(t.clientX, t.clientY); },{passive:true});
    document.addEventListener('touchmove', function(e){ if(!_drag) return; e.preventDefault(); var t=e.touches[0]; moveDrag(t.clientX, t.clientY); },{passive:false});
    document.addEventListener('touchend',  endDrag);
  });

  // --- CALENDAR LOGIC (Pikaday) ---
  var _positionedCal  = false;
  var _cachedHolidays = {};
  var _cachedNotes    = null; // null means not loaded, [] means empty
  var _pikaCal        = null;
  var _calHeatmapOn   = false; // expense heatmap toggle state
  var _cachedDailyExpenses = {}; // { year: { 'YYYY-MM-DD': total, ... } }

  function _calBuildEventMap(holidays, notes, year) {
    var map = {};
    var monthNames = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];

    // Add Holidays
    (holidays || []).forEach(function(h) {
      if (!h || !h.date) return;
      var dateStr = h.date.toString();
      monthNames.forEach(function(mn, mi) {
        if (dateStr.indexOf(mn) === 0) {
          var match = dateStr.match(/(\d{1,2})/);
          if (match) {
            var d = parseInt(match[1], 10);
            var key = year + '-' + String(mi + 1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
            if (!map[key]) map[key] = [];
            map[key].push({ type: 'holiday', desc: h.desc });
          }
        }
      });
    });

    // Add Notes
    (notes || []).forEach(function(n) {
      if (!n.calendar || !n.date) return;
      // Parse yyyy-MM-dd explicitly to avoid Date() timezone ambiguity
      var parts = n.date.split('-');
      var nYear = parseInt(parts[0], 10);
      var nMonth = parseInt(parts[1], 10);
      var nDay = parseInt(parts[2], 10);

      if (n.yearly || nYear === year) {
        var key = year + '-' + String(nMonth).padStart(2,'0') + '-' + String(nDay).padStart(2,'0');
        if (!map[key]) map[key] = [];
        map[key].push({ type: 'note', desc: n.reference });
      }
    });

    return map;
  }

  function _calRenderEventList(year, month, map) {
    var shortMonths = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    map = map || {};
    var cardsHtml = '', count = 0;

    // Separate holidays and notes
    var holidays = [];
    var notesByDesc = {};

    Object.keys(map).sort().forEach(function(key) {
      var parts = key.split('-');
      var y = parseInt(parts[0], 10);
      var m = parseInt(parts[1], 10) - 1;
      var d = parseInt(parts[2], 10);
      if (y === year && m === month) {
        map[key].forEach(function(ev) {
          if (ev.type === 'holiday') {
            holidays.push({ day: d, ev: ev });
          } else {
            if (!notesByDesc[ev.desc]) notesByDesc[ev.desc] = [];
            notesByDesc[ev.desc].push({ day: d });
          }
        });
      }
    });

    // Build day-range segments for a sorted list of days
    function buildRangeSegments(days) {
      var sorted = days.slice().sort(function(a, b) { return a.day - b.day; });
      var segments = [];
      var start = sorted[0].day, end = sorted[0].day;
      for (var k = 1; k < sorted.length; k++) {
        if (sorted[k].day === end + 1) {
          end = sorted[k].day;
        } else {
          segments.push({ start: start, end: end });
          start = sorted[k].day;
          end = sorted[k].day;
        }
      }
      segments.push({ start: start, end: end });
      return segments;
    }

    function formatSegments(segs) {
      return segs.map(function(s) {
        return s.start === s.end ? '' + s.start : s.start + '\u2013' + s.end;
      }).join(', ');
    }

    // Render holidays (each on its own card)
    holidays.forEach(function(item) {
      cardsHtml += '<div class="cal-hol-card">';
      cardsHtml += '<div class="cal-hol-date"><div class="cal-hol-day">' + item.day + '</div>';
      cardsHtml += '<div class="cal-hol-month">' + shortMonths[month] + '</div></div>';
      cardsHtml += '<div class="cal-hol-name">' + item.ev.desc + '</div>';
      cardsHtml += '</div>';
      count++;
    });

    // Render notes — one card per description, showing all day ranges
    var noteDescs = Object.keys(notesByDesc).sort();
    noteDescs.forEach(function(desc) {
      var segments = buildRangeSegments(notesByDesc[desc]);
      var dayHtml = '<div class="cal-hol-day">' + formatSegments(segments) + '</div>';
      cardsHtml += '<div class="cal-note-card">';
      cardsHtml += '<div class="cal-hol-date">' + dayHtml;
      cardsHtml += '<div class="cal-hol-month">' + shortMonths[month] + '</div></div>';
      cardsHtml += '<div class="cal-hol-name">📝 ' + desc + '</div>';
      cardsHtml += '</div>';
      count++;
    });

    var html = '<div class="cal-holidays-title">Events & Holidays</div>';
    html += count > 0
      ? '<div class="cal-holidays-scroll">' + cardsHtml + '</div>'
      : '<div class="cal-no-holidays">✨ No events this month</div>';
    var sec = document.getElementById('cal-holidays-section');
    if (sec) sec.innerHTML = html;
  }

  // ── Expense Calendar Heatmap ──
  function _getHeatmapLevel(total, maxExp) {
    if (total === 0) return 0;
    var ratio = total / maxExp;
    if (ratio <= 0.1)  return 1;
    if (ratio <= 0.25) return 2;
    if (ratio <= 0.45) return 3;
    if (ratio <= 0.7)  return 4;
    return 5;
  }

  function _applyHeatmapColors() {
    var pika = _pikaCal;
    if (!pika || !pika.calendars) return;
    var year  = pika.calendars[0].year;
    var month = pika.calendars[0].month;
    var expMap = _cachedDailyExpenses[year] || {};

    var maxExp = 0;
    Object.keys(expMap).forEach(function(k) {
      var parts = k.split('-');
      var ky = parseInt(parts[0], 10);
      var km = parseInt(parts[1], 10) - 1;
      if (ky === year && km === month) {
        if (expMap[k] > maxExp) maxExp = expMap[k];
      }
    });

    var cells = document.querySelectorAll('#cal-pikaday-container td[data-day]');
    cells.forEach(function(td) {
      var btn = td.querySelector('.pika-button');
      if (!btn) return;
      var d = parseInt(btn.getAttribute('data-pika-day'),   10);
      var m = parseInt(btn.getAttribute('data-pika-month'), 10);
      var y = parseInt(btn.getAttribute('data-pika-year'),  10);
      if (isNaN(d) || isNaN(m) || isNaN(y)) return;
      var key = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');

      td.classList.remove('cal-hm-l0','cal-hm-l1','cal-hm-l2','cal-hm-l3','cal-hm-l4','cal-hm-l5');

      if (_calHeatmapOn) {
        var expTotal = expMap[key] || 0;
        var level = _getHeatmapLevel(expTotal, maxExp || 1);
        td.classList.add('cal-hm-l' + level);
        td.title = expTotal > 0 ? 'Rs. ' + expTotal.toLocaleString(undefined, {minimumFractionDigits:2}) : '';
      }
    });
  }

  function _loadDailyExpenses(year, callback) {
    if (_cachedDailyExpenses[year]) {
      if (callback) callback();
      return;
    }
    google.script.run
      .withSuccessHandler(function(res) {
        _cachedDailyExpenses[year] = (res && res.success) ? (res.data || {}) : {};
        if (callback) callback();
      })
      .withFailureHandler(function() {
        _cachedDailyExpenses[year] = {};
        if (callback) callback();
      })
      .getDailyExpensesForYear(year);

  window._toggleHeatmap = function() {
    _calHeatmapOn = !_calHeatmapOn;
    var toggle = document.getElementById('cal-hm-toggle');

    if (_calHeatmapOn && _pikaCal) {

        _applyHeatmapColors();

      if (_pikaCal._v) _pikaCal.draw();

  };

  window.calToggle = function() {
    var p = document.getElementById('cal-panel');
    var opening = !p.classList.contains('open');

    if (opening && !_pikaCal) {
      _pikaCal = new Pikaday({
        field:          document.createElement('input'),

          previousMonth : '<',
          nextMonth     : '>',
          months        : ['January','February','March','April','May','June',
                           'July','August','September','October','November','December'],
          weekdays      : ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
          weekdaysShort : ['Su','Mo','Tu','We','Th','Fr','Sa']
        },
        onDraw: function(pika) {

          if (!inst || !inst.calendars) return;

          // Mark event TD cells
          var cells = document.querySelectorAll('#cal-pikaday-container td[data-day]');
          cells.forEach(function(td) {
            var btn = td.querySelector('.pika-button');
            if (!btn) return;
            var d = parseInt(btn.getAttribute('data-pika-day'),   10);
            var m = parseInt(btn.getAttribute('data-pika-month'), 10);
            var y = parseInt(btn.getAttribute('data-pika-year'),  10);
            if (isNaN(d) || isNaN(m) || isNaN(y)) return;
            var key = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
            if (map[key]) {
              var hasNote = map[key].some(function(e){ return e.type==='note'; });

              if (hasHol) td.classList.add('is-holiday');
              else td.classList.remove('is-holiday');

              if (hasNote) td.classList.add('is-note');

              td.title = map[key].map(function(e){ return e.desc; }).join(' | ');
            } else {
              td.classList.remove('is-holiday', 'is-note');
              td.removeAttribute('title');
            }
          });

          // Render event list
          _calRenderEventList(year, month, map);

          // Apply heatmap colors if active
          if (_calHeatmapOn) {
            if (!_cachedDailyExpenses[year]) {
              _loadDailyExpenses(year, function() {
                _applyHeatmapColors();
              });
            } else {
              _applyHeatmapColors();
            }
          }

          // Clear map list and show loading if year changed
          var sec = document.getElementById('cal-holidays-section');
          if (!_cachedHolidays[year]) {
            if (sec) sec.innerHTML = '<div class="cal-holidays-title">Events & Holidays</div>'

            google.script.run
              .withSuccessHandler(function(data) {

                if (inst._v) inst.draw();
              })
              .getBankHolidays(year);
          }

          // Fetch notes if not yet loaded
          if (_cachedNotes === null) {
            google.script.run
              .withSuccessHandler(function(res) {
                _cachedNotes = (res && res.success) ? res.data : [];
                inst._eventMap = _calBuildEventMap(_cachedHolidays[year], _cachedNotes, year);
                if (inst._v) inst.draw();
              })
              .getNotesData();
          }
        }
      });
    }

    if (opening && !_positionedCal) {
      var vw = window.innerWidth, vh = window.innerHeight;
      var pw = parseInt(getComputedStyle(p).width) || 292;
      var ph = 500;
      var navH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nav-h')) || 62;
      if (vw <= 480) {
        p.style.left = Math.max(8, (vw - pw) / 2) + 'px';
      } else if (vw <= 768) {
        p.style.left = Math.max(8, vw - pw - 12) + 'px';
      } else {
        p.style.left = '12px';
      }
      p.style.top    = Math.max(8, vh - navH - 14 - ph) + 'px';
      p.style.bottom = 'auto';
      p.style.right  = 'auto';
      _positionedCal = true;
    }

    p.classList.toggle('open');
    document.querySelectorAll('.pg-cal-btn').forEach(function(b) {
      b.classList.toggle('cal-active', opening);
    });
  };

  window.calClose = function() {
    document.getElementById('cal-panel').classList.remove('open');
    document.querySelectorAll('.pg-cal-btn').forEach(function(b) {
      b.classList.remove('cal-active');
    });
  };

  // Draggable calendar (mouse + touch, clamped to viewport)
  (function(){
    var panel = document.getElementById('cal-panel');
    if (!panel) return;
    var topbar = panel.querySelector('.cal-topbar');
    var _drag = false, _ox = 0, _oy = 0;

    function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

    function startDrag(cx, cy){
      var r = panel.getBoundingClientRect();
      _ox = cx - r.left;
      _oy = cy - r.top;
      _drag = true;
      topbar.style.cursor = 'grabbing';
      panel.style.bottom = 'auto';
      panel.style.right  = 'auto';
      panel.style.left   = r.left + 'px';
      panel.style.top    = r.top  + 'px';
    }

    function moveDrag(cx, cy){
      if (!_drag) return;
      var pw = panel.offsetWidth, ph = panel.offsetHeight;
      var nx = clamp(cx - _ox, 0, window.innerWidth  - pw);
      var ny = clamp(cy - _oy, 0, window.innerHeight - ph);
      panel.style.left = nx + 'px';
      panel.style.top  = ny + 'px';
    }

    function endDrag(){
      if (!_drag) return;
      _drag = false;
      topbar.style.cursor = 'grab';
    }

    topbar.addEventListener('mousedown', function(e){
      if (e.target.closest('.cal-close')) return;
      startDrag(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', function(e){ moveDrag(e.clientX, e.clientY); });
    window.addEventListener('mouseup',   endDrag);

    topbar.addEventListener('touchstart', function(e){
      if (e.target.closest('.cal-close')) return;
      var t = e.touches[0];
      startDrag(t.clientX, t.clientY);
    }, {passive: true});
    window.addEventListener('touchmove', function(e){
      if (!_drag) return;
      e.preventDefault();
      var t = e.touches[0];
      moveDrag(t.clientX, t.clientY);
    }, {passive: false});
    window.addEventListener('touchend', endDrag);
  })();

  window.calcToggle = function(){
    var p = document.getElementById('calc-panel');
    var opening = !p.classList.contains('open');
    // On first open: convert from bottom/left CSS to absolute top/left so dragging works
    if(opening && !_positioned){
      p.style.bottom = 'auto';
      var navH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nav-h')) || 62;
      var calcH = 420; // approximate panel height
      p.style.top  = Math.max(8, window.innerHeight - navH - 10 - calcH) + 'px';
      p.style.left = '12px';
      _positioned = true;
    }
    p.classList.toggle('open');
    document.querySelectorAll('.pg-calc-btn').forEach(function(b){
      b.classList.toggle('calc-active', opening);
    });
  };

  window.calcClose = function(){
    document.getElementById('calc-panel').classList.remove('open');
    document.querySelectorAll('.pg-calc-btn').forEach(function(b){
      b.classList.remove('calc-active');
    });
  };

  window.calcInput = function(v){
    var opChars = ['+','-','*','/','+','%'];
    if(_hasResult){
      // after a result: operator continues chain, digit starts fresh
      _expr = (opChars.indexOf(v) >= 0)
        ? document.getElementById('calc-result').textContent + v
        : v;
      _hasResult = false;
    } else {
      var last = _expr.slice(-1);
      // replace trailing operator instead of stacking
      if(opChars.indexOf(v) >= 0 && opChars.indexOf(last) >= 0){
        _expr = _expr.slice(0,-1) + v;
      } else {
        // prevent double decimal in current number segment
        if(v === '.'){
          var segs = _expr.split(/[\+\-\*\/\%]/);
          if(segs[segs.length-1].indexOf('.') >= 0) return;
        }
        _expr += v;
      }
    }
    _refresh();
  };

  window.calcClear = function(){
    _expr = '';
    _hasResult = false;
    document.getElementById('calc-result').textContent = '0';
    document.getElementById('calc-result').className = 'calc-result';
    document.getElementById('calc-expr').textContent = '';
  };

  window.calcDel = function(){
    if(_hasResult){ calcClear(); return; }
    _expr = _expr.slice(0,-1);
    _refresh();
  };

  window.calcEval = function(){
    if(!_expr) return;
    var raw = _expr;
    var disp = raw.replace(/\*/g,'×').replace(/\//g,'÷');
    try {
      if(!/^[\d\.\+\-\*\/\%\s]+$/.test(raw)) throw 0;
      /* jshint ignore:start */
      var res = Function('"use strict";return (' + raw + ')')();
      /* jshint ignore:end */
      if(!isFinite(res)) throw 0;
      var resStr = parseFloat(res.toFixed(10)).toString();
      _history.push({ expr: disp, result: resStr });
      _renderHistory();
      document.getElementById('calc-result').textContent = resStr;
      document.getElementById('calc-result').className = 'calc-result';
      document.getElementById('calc-expr').textContent = disp + ' =';
      _expr = resStr;
      _hasResult = true;
    } catch(e){
      document.getElementById('calc-result').textContent = 'Error';
      document.getElementById('calc-result').className = 'calc-result calc-err';
      _hasResult = false;
    }
  };

  // keyboard support
  document.addEventListener('keydown', function(e){
    if(!document.getElementById('calc-panel').classList.contains('open')) return;
    var k = e.key;
    if(k>='0'&&k<='9'||k==='.') { calcInput(k); e.preventDefault(); return; }
    if(k==='+'||k==='-'||k==='*'||k==='/'||k==='%') { calcInput(k); e.preventDefault(); return; }
    if(k==='Enter'||k==='=') { calcEval(); e.preventDefault(); return; }
    if(k==='Backspace') { calcDel(); e.preventDefault(); return; }
    if(k==='Escape') { calcClose(); e.preventDefault(); return; }
    if(k.toLowerCase()==='c') { calcClear(); e.preventDefault(); }
  });

  // paste support — strip currency/commas, keep digits, operators, decimal
  document.addEventListener('paste', function(e){
    if(!document.getElementById('calc-panel').classList.contains('open')) return;
    // don't intercept if focus is inside an input/textarea (e.g. budget editor)
    var tag = document.activeElement && document.activeElement.tagName;
    if(tag === 'INPUT' || tag === 'TEXTAREA') return;
    e.preventDefault();
    var raw = (e.clipboardData || window.clipboardData).getData('text') || '';
    // Remove currency symbols, spaces, commas, keep only: 0-9 . + - * / %
    var clean = raw.replace(/[₨$€£¥,\s]/g,'').replace(/[^0-9.\+\-\*\/%]/g,'');
    if(!clean) return;
    // If we have a result and pasted value looks like a pure number, start fresh chain with operator
    if(_hasResult && /^[\d.]+$/.test(clean)) {
      _expr = document.getElementById('calc-result').textContent + '+' + clean;
      _hasResult = false;
    } else {
      if(_hasResult){ _expr = ''; _hasResult = false; }
      _expr += clean;
    }
    _refresh();
  });

  function _refresh(){
    var disp = _expr.replace(/\*/g,'×').replace(/\//g,'÷');
    document.getElementById('calc-expr').textContent = disp;
    if(!_expr){
      document.getElementById('calc-result').textContent = '0';
      document.getElementById('calc-result').className = 'calc-result';
      return;
    }
    // live preview while typing
    try {
      if(/^[\d\.\+\-\*\/\%\s]+$/.test(_expr)){
        /* jshint ignore:start */
        var preview = Function('"use strict";return (' + _expr + ')')();
        /* jshint ignore:end */
        if(isFinite(preview)){
          document.getElementById('calc-result').textContent = parseFloat(preview.toFixed(10)).toString();
          document.getElementById('calc-result').className = 'calc-result';
        }
      }
    } catch(e){}
  }

  function _renderHistory(){
    var box = document.getElementById('calc-history');
    if(!_history.length) return;
    var html = '<div class="calc-hist-empty" id="calc-hist-empty" style="display:none"></div>'
      + _history.slice().reverse().map(function(h){
          return '<div class="calc-hist-item">'
            + h.expr + ' = <span class="ch-res">' + h.result + '</span>'
            + '</div>';
        }).join('');
    box.innerHTML = html;
    box.scrollTop = 0; // newest at top
  }
})();

/* helper: inject content into a ticker wrap */
function _buildTick(wrapId, trackId, items, speed){
  var wrap = document.getElementById(wrapId);
  var track = document.getElementById(trackId);
  if(!wrap || !track || !items.length) return;
  var html = items.join('');
  track.innerHTML = html + html;          // duplicate for seamless loop
  track.style.animationDuration = (speed||45)+'s';
  wrap.style.display = 'block';
}

/* ── Expenses ticker ── */
function buildExpTicker(cur, avg, budget, remaining){
  var fmt = function(n){ return '₨'+Math.round(Math.abs(n)).toLocaleString('en-IN'); };
  var remCls = remaining < 0 ? 'fl' : 'fr';
  var items = [
    '<span class="tick-item"><span class="tick-sym">THIS MONTH</span> <span style="color:rgba(255,255,255,.75)">' + fmt(cur) + '</span></span>',
    budget > 0
      ? '<span class="tick-item"><span class="tick-sym">BUDGET</span> <span style="color:rgba(255,255,255,.75)">' + fmt(budget) + '</span></span>'
      : '',
    budget > 0
      ? '<span class="tick-item"><span class="tick-sym">REMAINING</span> <span class="tick-chg ' + remCls + '">' + (remaining < 0 ? '−' : '+') + fmt(remaining) + '</span></span>'
      : '',
    '<span class="tick-item"><span class="tick-sym">MONTHLY AVG</span> <span style="color:rgba(255,255,255,.75)">' + fmt(avg) + '</span></span>',
  ].filter(Boolean);
  _buildTick('expTickerWrap', 'expTickerTrack', items, 30);
}




</script>

<script>
/* ═══════════════════════════════════════════════════════════════
   PTS Toast + Chart Skeleton (global utilities)
═══════════════════════════════════════════════════════════════ */
(function(){
  window.PTS = window.PTS || {};

  /* ── Toast ─────────────────────────────────────────────────── */
  function ensureToastContainer(){
    var c = document.getElementById('pts-toast-c');
    if (!c){
      c = document.createElement('div');
      c.id = 'pts-toast-c';
      (document.body || document.documentElement).appendChild(c);
    }
    return c;
  }
  var ICONS = {info:'ℹ',success:'✓',ok:'✓',error:'⚠',err:'⚠',warn:'⚠',loading:'⟳'};
  PTS.toast = function(msg, kind, ms){
    kind = kind || 'info';
    if (ms === undefined) ms = kind === 'loading' ? 0 : (kind === 'error' || kind === 'err' ? 5000 : 3200);
    var c = ensureToastContainer();
    var t = document.createElement('div');
    t.className = 'pts-toast pts-t-' + kind;
    t.setAttribute('role', kind === 'error' || kind === 'err' ? 'alert' : 'status');
    var ic = document.createElement('span'); ic.className = 'pts-t-ic'; ic.textContent = ICONS[kind] || 'ℹ';
    var sp = document.createElement('span'); sp.className = 'pts-t-msg'; sp.textContent = String(msg);
    var x  = document.createElement('button'); x.className = 'pts-t-x'; x.type='button';
    x.setAttribute('aria-label','Dismiss'); x.textContent = '×';
    t.appendChild(ic); t.appendChild(sp); t.appendChild(x);
    c.appendChild(t);
    requestAnimationFrame(function(){ t.classList.add('show'); });
    var to = ms > 0 ? setTimeout(remove, ms) : null;
    function remove(){
      if (to) clearTimeout(to);
      t.classList.remove('show');
      setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 280);
    }
    x.onclick = remove;
    return { dismiss: remove, el: t };
  };
  PTS.toastClearAll = function(){
    var c = document.getElementById('pts-toast-c');
    if (c) c.innerHTML = '';
  };
  // Don't clobber any existing helpers used inside modals — only set if free
  if (typeof window.toast === 'undefined') window.toast = PTS.toast;

  /* ── Chart skeleton ────────────────────────────────────────── */
  function findSkelAncestor(el){
    // Prefer immediate parent; fall back to a known wrapper class within 3 levels.
    var p = el.parentElement;
    if (!p) return null;
    // Skip if parent is too tiny (e.g. inline chart) — but default ok
    return p;
  }
  function markSkel(canvas){
    if (!canvas || canvas.__ptsCharted) return;
    var p = findSkelAncestor(canvas);
    if (p) p.classList.add('pts-skel-active');
  }
  function unmarkSkel(canvas){
    if (!canvas) return;
    canvas.__ptsCharted = true;
    var el = canvas.parentElement;
    var hops = 0;
    while (el && hops < 4){
      if (el.classList && el.classList.contains('pts-skel-active')){
        el.classList.remove('pts-skel-active');
        return;
      }
      el = el.parentElement; hops++;
    }
  }
  PTS.skel    = function(target){ var c = (typeof target === 'string') ? document.getElementById(target) : target; if (c) markSkel(c); };
  PTS.unskel  = function(target){ var c = (typeof target === 'string') ? document.getElementById(target) : target; if (c) unmarkSkel(c); };

  // Register Chart.js plugin so skeleton clears automatically on first paint
  function registerPlugin(){
    if (typeof Chart === 'undefined' || !Chart.register || Chart.__ptsPlugin) return false;
    try {
      Chart.register({
        id: 'pts-skel-clear',
        beforeInit: function(chart){ if (chart && chart.canvas) unmarkSkel(chart.canvas); },
        afterDestroy: function(chart){ if (chart && chart.canvas) chart.canvas.__ptsCharted = false; }
      });
      Chart.__ptsPlugin = true;
      return true;
    } catch(e) { return false; }
  }

  // Watch for new canvases and auto-apply skeleton
  function scan(root){
    var nodes = (root || document).querySelectorAll('canvas');
    for (var i = 0; i < nodes.length; i++) markSkel(nodes[i]);
  }
  function init(){
    ensureToastContainer();
    // Try registering Chart plugin now and retry until Chart loads
    if (!registerPlugin()){
      var tries = 0;
      var iv = setInterval(function(){
        if (registerPlugin() || ++tries > 60) clearInterval(iv);
      }, 100);
    }
    scan();
    try {
      var mo = new MutationObserver(function(muts){
        for (var i = 0; i < muts.length; i++){
          var nodes = muts[i].addedNodes;
          for (var j = 0; j < nodes.length; j++){
            var n = nodes[j];
            if (!n || n.nodeType !== 1) continue;
            if (n.tagName === 'CANVAS') markSkel(n);
            else if (n.querySelectorAll) {
              var inner = n.querySelectorAll('canvas');
              for (var k = 0; k < inner.length; k++) markSkel(inner[k]);
            }
          }
        }
      });
      mo.observe(document.body, { childList:true, subtree:true });
    } catch(e) {}
  }
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PTS Finance</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════════
   SHARED / RESET
═══════════════════════════════════════════ */
:root{
  --bg:#060b18; --card:rgba(255,255,255,0.04); --bdr:rgba(255,255,255,0.07);
  --red:#ff4d6d; --green:#00e676; --blue:#00d4ff; --purple:#a855f7;
  --gold:#ffd700; --amber:#fb923c; --teal:#2dd4bf;
  --green2:#22c55e; --blue2:#3b82f6; --orange:#ff6b35; --red2:#ff4d8d;
  --muted:rgba(255,255,255,0.3); --dim:rgba(255,255,255,0.12);
  --nav-h:62px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:#fff;}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0;}

/* bg orbs */
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.1;animation:drift 14s ease-in-out infinite;}
.o1{width:420px;height:420px;background:var(--blue);  top:-120px;left:-120px;}
.o2{width:360px;height:360px;background:var(--purple);bottom:-80px;right:-80px;animation-delay:-5s;}
.o3{width:260px;height:260px;background:var(--gold);  top:45%;left:60%;animation-delay:-9s;}
.o4{width:200px;height:200px;background:var(--green); bottom:30%;left:5%;animation-delay:-3s;}

/* keyframes */
@keyframes drift{0%,100%{transform:translate(0,0);}33%{transform:translate(25px,-25px);}66%{transform:translate(-16px,16px);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes pls{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes lbar{0%{left:-30%;}100%{left:110%;}}
@keyframes dotpulse{0%,100%{opacity:.25;}50%{opacity:1;}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
@keyframes tick{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
.fade-in{animation:fadeUp .4s ease both;}
.up{color:var(--green);} .dn{color:var(--red2);} .fl{color:var(--muted);}

/* ═══════════════════════════════════════════
   SPA LAYOUT
═══════════════════════════════════════════ */
.spa-page{
  position:fixed;top:0;left:0;right:0;
  height:calc(100vh - var(--nav-h));
  display:none;flex-direction:column;
  overflow:hidden;z-index:1;
}
.spa-page.active{display:flex;}

/* ─── Bottom Nav ─── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  height:var(--nav-h);
  background:rgba(6,11,24,.92);
  border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(20px);
  display:flex;align-items:center;
  z-index:100;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.bnav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;padding:8px 4px;
  background:none;border:none;cursor:pointer;
  color:var(--muted);font-family:inherit;
  transition:color .2s;position:relative;
}
.bnav-btn.active{color:#fff;}
.bnav-btn.active::before{
  content:'';position:absolute;top:0;left:25%;right:25%;
  height:2px;border-radius:0 0 3px 3px;
  background:linear-gradient(90deg,var(--blue),var(--purple));
}
.bnav-ico{font-size:1.3em;line-height:1;}
.bnav-lbl{font-size:.58em;font-weight:700;letter-spacing:.8px;text-transform:uppercase;}

/* ═══════════════════════════════════════════
   CSE PAGE
═══════════════════════════════════════════ */
/* Ticker */
.ticker-wrap{position:relative;z-index:2;background:rgba(255,255,255,.025);
             border-bottom:1px solid var(--bdr);padding:5px 0;overflow:hidden;
             flex-shrink:0;display:none;}
.ticker-track{display:flex;animation:tick 45s linear infinite;width:max-content;}
.ticker-track:hover{animation-play-state:paused;}
.tick-item{display:inline-flex;align-items:center;gap:7px;padding:0 20px;
           font-size:11px;font-weight:500;border-right:1px solid var(--bdr);white-space:nowrap;}
.tick-sym{color:var(--blue);font-weight:700;}
.tick-chg{font-weight:600;}

/* CSE Header */
#page-cse .cse-header{
  position:relative;z-index:2;display:flex;align-items:center;
  justify-content:space-between;padding:10px 16px;
  border-bottom:1px solid var(--bdr);flex-shrink:0;
  background:rgba(6,11,24,.85);backdrop-filter:blur(12px);
}
.h-title{font-size:15px;font-weight:800;letter-spacing:-.4px;
         background:linear-gradient(135deg,#fff 0%,var(--blue) 50%,var(--purple) 100%);
         -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.mkt-pill{font-size:10px;padding:3px 10px;border-radius:12px;font-weight:700;}
.mkt-pill.open {background:rgba(0,255,136,.1);color:var(--green);border:1px solid rgba(0,255,136,.25);}
.mkt-pill.closed{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--bdr);}
.h-right{display:flex;align-items:center;gap:8px;}
.upd-lbl{font-size:10px;color:var(--muted);}
.refresh-btn{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#060b18;
             border:none;padding:6px 12px;border-radius:8px;cursor:pointer;
             font-size:11px;font-weight:700;font-family:inherit;transition:opacity .2s;}
.refresh-btn:hover{opacity:.85;}
.refresh-btn:disabled{opacity:.4;cursor:not-allowed;}

/* Load bar */
.load-bar{height:2px;background:var(--bdr);flex-shrink:0;position:relative;z-index:2;overflow:hidden;}
.load-fill{position:absolute;top:0;left:-30%;width:30%;height:100%;
           background:linear-gradient(90deg,var(--blue),var(--purple));
           animation:lbar 1.1s ease-in-out infinite;display:none;}

/* Tabs */
.tabs{position:relative;z-index:2;display:flex;gap:4px;padding:8px 16px;
      border-bottom:1px solid var(--bdr);flex-shrink:0;
      background:rgba(6,11,24,.7);backdrop-filter:blur(10px);
      overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:6px 14px;border-radius:8px;cursor:pointer;font-size:11px;font-weight:600;
     color:var(--muted);border:1px solid transparent;transition:all .18s;
     letter-spacing:.2px;white-space:nowrap;flex-shrink:0;}
.tab.active{color:var(--blue);border-color:rgba(0,212,255,.3);
            background:rgba(0,212,255,.08);text-shadow:0 0 12px rgba(0,212,255,.4);}
.tab:hover:not(.active){color:rgba(255,255,255,.7);background:rgba(255,255,255,.04);}
.tdot{display:inline-block;width:6px;height:6px;border-radius:50%;
      background:var(--muted);margin-left:5px;vertical-align:middle;transition:background .3s;}
.tdot.loading{background:transparent!important;border:none;width:auto;height:auto;
              border-radius:0;font-size:11px;letter-spacing:1px;color:var(--blue);vertical-align:middle;}
.tdot.loading::after{content:'···';animation:dotpulse 1.1s ease-in-out infinite;}
.tdot.done{background:var(--green);}
.tdot.err{background:var(--red);}

/* Panels */
.panels{flex:1;overflow-y:auto;padding:14px 16px;position:relative;z-index:1;
        -webkit-overflow-scrolling:touch;}
.panel{display:none;}
.panel.active{display:block;}

/* CSE Loading */
#page-cse .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
                   padding:48px;gap:14px;color:var(--muted);font-size:12px;
                   letter-spacing:1px;text-transform:uppercase;}
.ll-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:240px;}
.ll-bar{width:100%;height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.ll-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--purple));
         transition:width .35s ease;width:0%;}
.ll-pct{font-size:13px;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--purple));
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.ring-lbl{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;}
.mini-line{width:130px;height:2px;background:rgba(255,255,255,.07);border-radius:2px;
           overflow:hidden;position:relative;flex-shrink:0;}
.mini-line::after{content:'';position:absolute;top:0;left:-50%;width:50%;height:100%;
                  background:linear-gradient(90deg,transparent,var(--blue),var(--purple),transparent);
                  animation:lbar .9s ease-in-out infinite;}

/* CSE Glass card */
#page-cse .glass{background:var(--card);border:1px solid var(--bdr);border-radius:14px;
                 padding:14px;backdrop-filter:blur(20px);
                 box-shadow:0 4px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05);
                 position:relative;overflow:hidden;}
#page-cse .glass::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
                         background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);}
.g-hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px;
       padding-bottom:10px;border-bottom:1px solid var(--bdr);}
.g-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.g-title{font-size:.65em;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.g-sub{font-size:.58em;color:var(--dim);margin-left:auto;}

/* CSE KPI */
#page-cse .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:14px;}
#page-cse .kpi{border-radius:12px;padding:12px 14px;border:1px solid;backdrop-filter:blur(20px);
               position:relative;overflow:hidden;transition:transform .2s;}
#page-cse .kpi:hover{transform:translateY(-2px);}
#page-cse .kpi-glow{position:absolute;right:-20px;bottom:-20px;width:80px;height:80px;
                    border-radius:50%;filter:blur(36px);opacity:.18;}
.kpi-icon{font-size:1.2em;margin-bottom:4px;display:block;}
.kpi-lbl{font-size:.54em;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.kpi-val{font-size:1em;font-weight:800;letter-spacing:-.4px;line-height:1;}
.kpi-sub{font-size:.56em;color:var(--dim);margin-top:3px;}
.kpi-delta{font-size:.58em;font-weight:700;padding:2px 6px;border-radius:5px;display:inline-block;margin-top:4px;}
.du{background:rgba(0,255,136,.12);color:var(--green);}
.dd{background:rgba(255,77,141,.12);color:var(--red);}
.df{background:rgba(255,255,255,.05);color:var(--muted);}
#page-cse .kpi.blue  {background:linear-gradient(135deg,rgba(0,212,255,.08),rgba(0,212,255,.03));border-color:rgba(0,212,255,.2);}
#page-cse .kpi.blue  .kpi-val{color:var(--blue);}
#page-cse .kpi.green {background:linear-gradient(135deg,rgba(0,255,136,.08),rgba(0,255,136,.03));border-color:rgba(0,255,136,.2);}
#page-cse .kpi.green .kpi-val{color:var(--green);}
#page-cse .kpi.gold  {background:linear-gradient(135deg,rgba(255,215,0,.08),rgba(255,215,0,.03));border-color:rgba(255,215,0,.2);}
#page-cse .kpi.gold  .kpi-val{color:var(--gold);}
#page-cse .kpi.purple{background:linear-gradient(135deg,rgba(168,85,247,.08),rgba(168,85,247,.03));border-color:rgba(168,85,247,.2);}
#page-cse .kpi.purple .kpi-val{color:var(--purple);}
#page-cse .kpi.orange{background:linear-gradient(135deg,rgba(255,107,53,.08),rgba(255,107,53,.03));border-color:rgba(255,107,53,.2);}
#page-cse .kpi.orange .kpi-val{color:var(--orange);}
#page-cse .kpi.red   {background:linear-gradient(135deg,rgba(255,77,141,.08),rgba(255,77,141,.03));border-color:rgba(255,77,141,.2);}
#page-cse .kpi.red   .kpi-val{color:var(--red);}

/* Section header */
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.sec-line{width:3px;height:13px;border-radius:2px;flex-shrink:0;}
.sec-text{font-size:.68em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.55);}
.sec-cnt{font-size:.58em;color:var(--muted);font-weight:500;margin-left:auto;}

/* Stock cards */
.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px;}
.scard{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:12px;
       position:relative;overflow:hidden;transition:border-color .2s,transform .2s;backdrop-filter:blur(16px);}
.scard:hover{border-color:rgba(0,212,255,.25);transform:translateY(-1px);}
.scard-accent{position:absolute;top:0;left:0;right:0;height:2px;}
.scard.up   .scard-accent{background:linear-gradient(90deg,var(--green),transparent);}
.scard.dn   .scard-accent{background:linear-gradient(90deg,var(--red),transparent);}
.scard.fl   .scard-accent{background:linear-gradient(90deg,rgba(255,255,255,.15),transparent);}
.scard.shim .scard-accent{background:linear-gradient(90deg,var(--gold),transparent);animation:blink .9s infinite;}
.scard-sym{font-size:13px;font-weight:800;letter-spacing:.3px;color:var(--blue);margin-top:2px;}
.live-tag{font-size:8px;font-weight:700;padding:1px 6px;border-radius:6px;margin-left:5px;vertical-align:middle;}
.live-tag.live {background:rgba(0,255,136,.12);color:var(--green);}
.live-tag.sheet{background:rgba(255,255,255,.06);color:var(--muted);}
.live-tag.off  {background:rgba(255,77,141,.1);color:var(--red);}
.scard-name{font-size:10px;color:var(--muted);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.price-row{display:flex;align-items:baseline;gap:7px;margin-bottom:7px;}
.s-price{font-size:18px;font-weight:800;letter-spacing:-.5px;}
.scard.up  .s-price{color:var(--green);}
.scard.dn  .s-price{color:var(--red);}
.scard.fl  .s-price{color:rgba(255,255,255,.85);}
.scard.shim .s-price{color:var(--dim);}
.chg-pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;}
.chg-pill.up{background:rgba(0,255,136,.1);color:var(--green);}
.chg-pill.dn{background:rgba(255,77,141,.1);color:var(--red);}
.chg-pill.fl{background:rgba(255,255,255,.06);color:var(--muted);}
.s-meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px;}
.s-meta-row{font-size:9.5px;color:rgba(255,255,255,.6);}
.s-meta-row .ml{color:var(--muted);font-weight:500;}
.pnl-section{margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr);}
.pnl-label{font-size:9px;color:var(--muted);margin-bottom:3px;font-weight:500;}
.pnl-num{font-size:13px;font-weight:800;}
.pnl-num.up{color:var(--green);}
.pnl-num.dn{color:var(--red);}
.pnl-track{height:3px;background:var(--dim);border-radius:2px;margin-top:4px;overflow:hidden;}
.pnl-bar{height:100%;border-radius:2px;transition:width .8s cubic-bezier(.4,0,.2,1);}
.pnl-bar.up{background:linear-gradient(90deg,var(--green2),var(--green));}
.pnl-bar.dn{background:linear-gradient(90deg,var(--red),#ff8fab);}
.no-pnl{font-size:9px;color:var(--dim);margin-top:6px;padding-top:6px;border-top:1px solid var(--bdr);}
.raw-tog{font-size:9px;color:rgba(0,212,255,.6);cursor:pointer;display:block;margin-top:4px;}
.raw-box{background:rgba(0,0,0,.4);border:1px solid var(--bdr);border-radius:6px;
         padding:7px;font-size:8px;color:var(--muted);font-family:monospace;
         overflow:auto;max-height:100px;margin-top:4px;display:none;line-height:1.6;}

/* CSE Chart */
#page-cse .chart-wrap{position:relative;height:160px;margin-bottom:14px;}

/* Dividend cards */
.div-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;margin-bottom:12px;}
.div-card{background:var(--card);border:1px solid var(--bdr);border-radius:11px;
          padding:12px;backdrop-filter:blur(16px);transition:border-color .2s;}
.div-card:hover{border-color:rgba(255,215,0,.25);}
.div-co{font-size:11px;font-weight:700;color:var(--blue);margin-bottom:2px;}
.div-sym{font-size:10px;color:var(--muted);margin-bottom:5px;}
.div-type{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.div-amt{font-size:16px;font-weight:800;color:var(--gold);text-shadow:0 0 14px rgba(255,215,0,.3);margin-bottom:3px;}
.div-dt{font-size:9px;color:var(--muted);}

/* Insights */
.ins-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px;}
.ins-sum-card{border-radius:11px;padding:11px 12px;border:1px solid;display:flex;align-items:center;gap:9px;backdrop-filter:blur(16px);}
.ins-sum-card.sell {background:rgba(255,77,141,.07);border-color:rgba(255,77,141,.2);}
.ins-sum-card.watch{background:rgba(255,215,0,.07); border-color:rgba(255,215,0,.2);}
.ins-sum-card.hold {background:rgba(0,255,136,.07); border-color:rgba(0,255,136,.2);}
.ins-sum-card.buy  {background:rgba(0,212,255,.07); border-color:rgba(0,212,255,.2);}
.ins-sum-ico{font-size:18px;flex-shrink:0;}
.ins-sum-num{font-size:20px;font-weight:800;line-height:1;}
.ins-sum-card.sell  .ins-sum-num{color:var(--red);}
.ins-sum-card.watch .ins-sum-num{color:var(--gold);}
.ins-sum-card.hold  .ins-sum-num{color:var(--green);}
.ins-sum-card.buy   .ins-sum-num{color:var(--blue);}
.ins-sum-lbl{font-size:.55em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-top:2px;}
.ins-list{display:flex;flex-direction:column;gap:9px;}
.ins-card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;
          padding:13px 14px;backdrop-filter:blur(16px);border-left-width:3px;}
.ins-card.sell {border-left-color:var(--red);}
.ins-card.watch{border-left-color:var(--gold);}
.ins-card.hold {border-left-color:var(--green);}
.ins-card.buy  {border-left-color:var(--blue);}
.ins-card.info {border-left-color:var(--purple);}
.ins-top{display:flex;align-items:flex-start;gap:11px;}
.ins-ico{font-size:17px;flex-shrink:0;margin-top:1px;}
.ins-main{flex:1;min-width:0;}
.ins-header{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px;}
.ins-sym{font-size:12px;font-weight:800;color:var(--blue);}
.ins-co{font-size:10px;color:var(--muted);}
.sig-tag{font-size:.56em;font-weight:800;padding:2px 7px;border-radius:7px;letter-spacing:.8px;text-transform:uppercase;}
.sig-tag.sell {background:rgba(255,77,141,.15);color:var(--red);}
.sig-tag.watch{background:rgba(255,215,0,.15); color:var(--gold);}
.sig-tag.hold {background:rgba(0,255,136,.12); color:var(--green);}
.sig-tag.buy  {background:rgba(0,212,255,.12); color:var(--blue);}
.sig-tag.info {background:rgba(168,85,247,.12);color:var(--purple);}
.urgency-tag{font-size:.52em;font-weight:600;padding:1px 6px;border-radius:6px;text-transform:uppercase;}
.urgency-tag.high  {background:rgba(255,107,53,.15);color:var(--orange);}
.urgency-tag.medium{background:rgba(255,255,255,.07);color:var(--muted);}
.urgency-tag.low   {background:rgba(255,255,255,.04);color:var(--dim);}
.ins-title{font-size:12px;font-weight:700;color:rgba(255,255,255,.9);margin-bottom:3px;}
.ins-desc{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:7px;}
.ins-metrics{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px;}
.ins-metric{background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:6px;padding:4px 8px;font-size:10px;}
.ins-metric .iml{color:var(--muted);font-weight:500;margin-right:3px;}
.ins-metric .imv{font-weight:700;color:rgba(255,255,255,.85);}
.ins-action{background:rgba(255,255,255,.03);border:1px solid var(--bdr);border-radius:8px;
            padding:7px 10px;font-size:10px;line-height:1.5;display:flex;gap:7px;align-items:flex-start;}
.ins-action-ico{font-size:12px;flex-shrink:0;margin-top:1px;}
.ins-action-text{color:rgba(255,255,255,.75);}
.ins-action strong{color:#fff;}
.empty{padding:32px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8;}
.empty a{color:var(--blue);text-decoration:none;}
.empty-ico{font-size:30px;margin-bottom:8px;}
#page-cse .err-box{padding:11px 13px;background:rgba(255,77,141,.06);border:1px solid rgba(255,77,141,.2);
                   border-radius:9px;color:var(--red);font-size:11px;margin-bottom:9px;}

/* ═══════════════════════════════════════════
   CC PAGE
═══════════════════════════════════════════ */
#page-cc{overflow-y:auto;-webkit-overflow-scrolling:touch;}
#page-cc .page{position:relative;z-index:1;padding:16px;padding-bottom:24px;}

/* CC Header */
#page-cc .header{text-align:center;padding:12px 0 16px;}
.header-chip{display:inline-block;padding:4px 14px;border-radius:20px;background:rgba(255,77,109,.1);
             border:1px solid rgba(255,77,109,.28);color:var(--red);font-size:.65em;
             font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;}
#page-cc .header h1{font-size:1.6em;font-weight:800;letter-spacing:-1px;
                    background:linear-gradient(135deg,#fff 0%,var(--red) 50%,var(--blue) 100%);
                    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.header-sub{color:rgba(255,255,255,.35);font-size:.75em;margin-top:4px;}

/* CC Loading */
#page-cc .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:13px;}
.cc-spinner{width:40px;height:40px;border:3px solid rgba(255,77,109,.12);
            border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite;}
.loading-txt{color:rgba(255,255,255,.3);font-size:.78em;letter-spacing:2px;text-transform:uppercase;}

/* CC Glass */
#page-cc .glass{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:16px;
                backdrop-filter:blur(20px);box-shadow:0 4px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.04);
                position:relative;overflow:hidden;}
#page-cc .glass::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
                        background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);}
.card-hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.05);}
.card-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.card-title{font-size:.68em;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);}

/* CC KPI */
#page-cc .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;animation:fadeUp .5s ease both;}
#page-cc .kpi{border-radius:14px;padding:14px 16px;border:1px solid;backdrop-filter:blur(20px);position:relative;overflow:hidden;transition:transform .2s;}
#page-cc .kpi:hover{transform:translateY(-2px);}
#page-cc .kpi-glow{position:absolute;right:-16px;bottom:-16px;width:90px;height:90px;border-radius:50%;filter:blur(38px);opacity:.2;}
#page-cc .kpi-icon{font-size:1.5em;margin-bottom:5px;display:block;}
.kpi-label{font-size:.58em;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.33);margin-bottom:3px;}
.kpi-value{font-size:1.35em;font-weight:800;letter-spacing:-.8px;line-height:1;}
.kpi-sub-cc{font-size:.6em;color:rgba(255,255,255,.25);margin-top:3px;}
#page-cc .kpi.red   {background:linear-gradient(135deg,rgba(255,77,109,.09),rgba(255,77,109,.04));border-color:rgba(255,77,109,.22);}
#page-cc .kpi.red   .kpi-value{color:var(--red);}
#page-cc .kpi.red   .kpi-glow{background:var(--red);}
#page-cc .kpi.blue  {background:linear-gradient(135deg,rgba(0,212,255,.09),rgba(0,212,255,.04));border-color:rgba(0,212,255,.22);}
#page-cc .kpi.blue  .kpi-value{color:var(--blue);}
#page-cc .kpi.blue  .kpi-glow{background:var(--blue);}
#page-cc .kpi.green {background:linear-gradient(135deg,rgba(0,230,118,.09),rgba(0,230,118,.04));border-color:rgba(0,230,118,.22);}
#page-cc .kpi.green .kpi-value{color:var(--green);}
#page-cc .kpi.green .kpi-glow{background:var(--green);}
#page-cc .kpi.gold  {background:linear-gradient(135deg,rgba(255,215,0,.09),rgba(255,215,0,.04));border-color:rgba(255,215,0,.22);}
#page-cc .kpi.gold  .kpi-value{color:var(--gold);}
#page-cc .kpi.gold  .kpi-glow{background:var(--gold);}

/* CC chart wrap */
#page-cc .chart-wrap{height:200px;position:relative;}
.top-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;animation:fadeUp .5s ease .1s both;}

/* CC cards grid */
.cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-bottom:12px;animation:fadeUp .5s ease .15s both;}
.cc-card{background:var(--card);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;backdrop-filter:blur(20px);box-shadow:0 4px 24px rgba(0,0,0,.25);transition:transform .2s ease;position:relative;}
.cc-card:hover{transform:translateY(-3px);}
.cc-top{padding:16px 16px 12px;position:relative;}
.cc-top::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);}
.cc-header{display:flex;align-items:center;gap:11px;margin-bottom:12px;}
.cc-logo{width:40px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.62em;font-weight:800;letter-spacing:.5px;flex-shrink:0;border:1px solid rgba(255,255,255,.1);}
.cc-name{font-size:.95em;font-weight:700;color:#fff;}
.cc-month{font-size:.62em;color:rgba(255,255,255,.33);margin-top:2px;}
.cc-status-wrap{margin-left:auto;flex-shrink:0;}
.cc-amounts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}
.amt-block{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:9px;padding:9px 11px;}
.amt-lbl{font-size:.56em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:2px;}
.amt-val{font-size:1.05em;font-weight:800;color:#fff;letter-spacing:-.5px;}
.amt-val.danger{color:var(--red);}
.amt-val.ok    {color:var(--green);}
.amt-val.warn  {color:var(--amber);}
.cc-dates{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px;}
.date-chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:6px 11px;font-size:.6em;color:rgba(255,255,255,.42);flex:1;min-width:120px;}
.date-chip .dc-icon{font-size:1.1em;flex-shrink:0;}
.date-chip .dc-body{display:flex;flex-direction:column;gap:1px;}
.date-chip .dc-label{font-size:.75em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.26);}
.date-chip .dc-value{font-weight:700;color:#fff;font-size:1em;}
.date-chip.due-chip {background:rgba(255,77,109,.06);border-color:rgba(255,77,109,.18);}
.date-chip.due-chip .dc-value{color:var(--red);}
.date-chip.stmt-chip{background:rgba(0,212,255,.06);border-color:rgba(0,212,255,.18);}
.date-chip.stmt-chip .dc-value{color:var(--blue);}
.pay-progress{margin-bottom:10px;}
.pay-prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.pay-prog-label{font-size:.58em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.28);}
.pay-prog-pct{font-size:.68em;font-weight:800;}
.pay-prog-bg{height:6px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden;}
.pay-prog-fill{height:100%;border-radius:5px;transition:width 1.2s cubic-bezier(.4,0,.2,1);width:0;}
.balance-row{display:flex;align-items:center;gap:7px;padding:9px 12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:9px;}
.balance-lbl{font-size:.5em;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.22);flex-shrink:0;white-space:nowrap;}
.balance-input{flex:1;min-width:0;padding:8px 12px;background:rgba(0,212,255,.05);border:1.5px solid rgba(0,212,255,.18);border-radius:8px;color:#fff;font-size:.9em;font-weight:700;font-family:inherit;transition:border-color .2s;}
.balance-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,212,255,.12);}
.balance-input::placeholder{color:rgba(255,255,255,.18);font-weight:400;}
.save-btn{padding:7px 12px;border:none;border-radius:7px;font-family:inherit;font-size:.72em;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .2s;background:linear-gradient(135deg,var(--blue),#0099cc);color:#fff;flex-shrink:0;}
.save-btn.saving {background:rgba(255,152,0,.7);}
.save-btn.success{background:linear-gradient(135deg,var(--green),#00aa55);}
.save-btn:disabled{opacity:.5;cursor:not-allowed;}
.alert-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;font-size:.65em;font-weight:700;margin-left:5px;flex-shrink:0;}
.alert-ok  {background:rgba(0,230,118,.12);border:1px solid rgba(0,230,118,.25);color:var(--green);}
.alert-warn{background:rgba(255,152,0,.12); border:1px solid rgba(255,152,0,.25); color:var(--amber);}
.alert-bad {background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.25);color:var(--red);}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:9px;font-size:.68em;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .2s;user-select:none;border:1px solid;}
.status-badge.settled{background:rgba(0,230,118,.12);border-color:rgba(0,230,118,.3);color:var(--green);}
.status-badge.pending{background:rgba(255,152,0,.12);border-color:rgba(255,152,0,.3);color:var(--amber);}
.save-status-btn{padding:4px 10px;border:none;border-radius:6px;font-family:inherit;font-size:.65em;font-weight:700;cursor:pointer;transition:all .2s;background:linear-gradient(135deg,var(--purple),#7c3aed);color:#fff;}
.save-status-btn.success{background:linear-gradient(135deg,var(--green),#00aa55);}
.save-status-btn:disabled{opacity:.5;}
#page-cc .error-box{text-align:center;padding:48px;color:var(--red);font-size:.88em;}

/* ═══════════════════════════════════════════
   RESPONSIVE (mobile-first)
═══════════════════════════════════════════ */
@media(max-width:600px){
  #page-cc .kpi-row{grid-template-columns:repeat(2,1fr);}
  .top-row{grid-template-columns:1fr;}
  .cc-grid{grid-template-columns:1fr;}
  .ins-summary{grid-template-columns:repeat(2,1fr);}
  .stock-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
}
@media(max-width:400px){
  #page-cc .kpi-row{grid-template-columns:1fr 1fr;}
  .ins-summary{grid-template-columns:repeat(2,1fr);}
}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px;}

/* ═══════════════════════════════════════════
   EXPENSE PAGE
═══════════════════════════════════════════ */
#page-exp{overflow-y:auto;-webkit-overflow-scrolling:touch;}
#page-exp .exp-page{position:relative;z-index:1;padding:16px 16px 28px;}
#page-exp .exp-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
#page-exp .exp-hdr h1{font-size:19px;font-weight:700;}
#page-exp .exp-hdr p{font-size:12px;color:var(--muted);margin-top:3px;}
#page-exp .exp-badge{padding:4px 13px;border-radius:20px;font-size:11px;font-weight:600;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 0 14px rgba(99,102,241,.4);}
#page-exp .exp-loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:80px 0;}
#page-exp .exp-spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.08);
  border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite;}
#page-exp .sec-lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:12px;padding-left:8px;border-left:3px solid #6366f1;}
#page-exp .kpi-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-bottom:16px;}
#page-exp .kpi{border-radius:14px;padding:13px 15px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);position:relative;overflow:hidden;}
#page-exp .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
#page-exp .kpi.c0::before{background:linear-gradient(90deg,#6366f1,#8b5cf6);}
#page-exp .kpi.c1::before{background:linear-gradient(90deg,#06b6d4,#0ea5e9);}
#page-exp .kpi.c2::before{background:linear-gradient(90deg,#f59e0b,#fb923c);}
#page-exp .kpi.c3::before{background:linear-gradient(90deg,#10b981,#34d399);}
#page-exp .kpi.c4::before{background:linear-gradient(90deg,#f97316,#f59e0b);}
#page-exp .kpi.c5::before{background:linear-gradient(90deg,#ec4899,#f43f5e);}
#page-exp .kpi-lbl{font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;}
#page-exp .kpi-val{font-size:17px;font-weight:700;letter-spacing:-.4px;}
#page-exp .kpi-sub{font-size:10px;color:var(--muted);margin-top:3px;}
#page-exp .delta{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;margin-top:4px;display:inline-block;}
#page-exp .delta.up{background:rgba(239,68,68,.15);color:#ef4444;}
#page-exp .delta.dn{background:rgba(16,185,129,.15);color:#10b981;}
#page-exp .delta.nt{background:rgba(148,163,184,.1);color:var(--muted);}
#page-exp .yr-strip{display:flex;gap:11px;margin-bottom:16px;flex-wrap:wrap;}
#page-exp .yr-card{flex:1;min-width:170px;border-radius:14px;padding:14px 16px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);
  position:relative;overflow:hidden;}
#page-exp .yr-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
#page-exp .yr-card:nth-child(1)::before{background:linear-gradient(90deg,#6366f1,#8b5cf6);}
#page-exp .yr-card:nth-child(2)::before{background:linear-gradient(90deg,#06b6d4,#0ea5e9);}
#page-exp .yr-card:nth-child(3)::before{background:linear-gradient(90deg,#10b981,#34d399);}
#page-exp .yr-card:nth-child(4)::before{background:linear-gradient(90deg,#f59e0b,#fb923c);}
#page-exp .yr-card-yr{font-size:20px;font-weight:800;letter-spacing:-1px;margin-bottom:4px;}
#page-exp .yr-card-total{font-size:12px;font-weight:600;margin-bottom:2px;}
#page-exp .yr-card-meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:5px;}
#page-exp .yr-card-m{font-size:10px;color:var(--muted);}
#page-exp .yr-card-m strong{color:#fff;font-weight:600;}
#page-exp .yr-yoy{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:600;
  padding:2px 7px;border-radius:10px;margin-top:6px;}
#page-exp .yr-yoy.up{background:rgba(239,68,68,.15);color:#ef4444;}
#page-exp .yr-yoy.dn{background:rgba(16,185,129,.15);color:#10b981;}
#page-exp .pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;}
#page-exp .pill{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:500;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(8px);}
#page-exp .pill em{color:var(--muted);font-style:normal;margin-right:3px;}
#page-exp .pill.warn strong{color:#f59e0b;}
#page-exp .pill.good strong{color:#10b981;}
#page-exp .pill.bad  strong{color:#ef4444;}
#page-exp .pill.info strong{color:#06b6d4;}
#page-exp .pill.pur  strong{color:#8b5cf6;}
#page-exp .row{display:grid;gap:12px;margin-bottom:12px;}
#page-exp .r3{grid-template-columns:repeat(3,1fr);}
#page-exp .r2{grid-template-columns:repeat(2,1fr);}
#page-exp .r1{grid-template-columns:1fr;}
#page-exp .r21{grid-template-columns:2fr 1fr;}
#page-exp .cbox{border-radius:16px;padding:14px 14px 10px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);}
#page-exp .ctitle{font-size:12px;font-weight:600;margin-bottom:2px;}
#page-exp .csub{font-size:10px;color:var(--muted);margin-bottom:10px;}
#page-exp .cwrap canvas{max-height:210px;}
#page-exp .cwrap.tall canvas{max-height:250px;}
#page-exp .ig{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px;}
#page-exp .ic{border-radius:14px;padding:13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);}
#page-exp .ic-ico{font-size:18px;margin-bottom:6px;}
#page-exp .ic-lbl{font-size:10px;color:var(--muted);font-weight:500;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px;}
#page-exp .ic-val{font-size:14px;font-weight:700;}
#page-exp .ic-val.good{color:#10b981;} #page-exp .ic-val.bad{color:#ef4444;} #page-exp .ic-val.warn{color:#f59e0b;}
#page-exp .ic-val.info{color:#06b6d4;} #page-exp .ic-val.pur{color:#8b5cf6;} #page-exp .ic-val.nt{color:var(--muted);}
#page-exp .ic-desc{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.5;}
#page-exp .exp-err{text-align:center;padding:48px;color:#ef4444;}
@media(max-width:600px){
  #page-exp .kpi-strip{grid-template-columns:repeat(2,1fr);}
  #page-exp .r3,#page-exp .r2,#page-exp .r21{grid-template-columns:1fr;}
  #page-exp .ig{grid-template-columns:repeat(2,1fr);}
}

/* ═══════════════════════════════════════════
   PORTFOLIO SUMMARY PAGE
═══════════════════════════════════════════ */
#page-port{overflow-y:auto;-webkit-overflow-scrolling:touch;}
#page-port .page-wrap{position:relative;z-index:1;padding:16px;padding-bottom:24px;}
#page-port .port-header{text-align:center;padding:18px 0 22px;}
#page-port .header-tag{display:inline-block;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);
  color:var(--blue);font-size:.68em;font-weight:600;letter-spacing:3px;text-transform:uppercase;
  padding:5px 14px;border-radius:20px;margin-bottom:10px;}
#page-port .port-header h1{font-size:1.7em;font-weight:800;
  background:linear-gradient(135deg,#fff 0%,var(--blue) 50%,var(--purple) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:-1px;line-height:1.1;}
#page-port .header-sub{color:rgba(255,255,255,.38);font-size:.78em;margin-top:5px;}
#page-port .hero-cards{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:18px;}
#page-port .hero-card{position:relative;border-radius:20px;padding:20px;overflow:hidden;border:1px solid;backdrop-filter:blur(20px);}
#page-port .hero-card.lkr{background:linear-gradient(135deg,rgba(255,215,0,.08),rgba(255,150,0,.04));
  border-color:rgba(255,215,0,.25);box-shadow:0 0 40px rgba(255,215,0,.08),inset 0 1px 0 rgba(255,255,255,.06);}
#page-port .hero-card.usd{background:linear-gradient(135deg,rgba(0,255,136,.08),rgba(0,212,255,.04));
  border-color:rgba(0,255,136,.25);box-shadow:0 0 40px rgba(0,255,136,.08),inset 0 1px 0 rgba(255,255,255,.06);}
#page-port .hero-card-icon{font-size:1.7em;margin-bottom:7px;display:block;}
#page-port .hero-card-label{font-size:.66em;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.38);margin-bottom:4px;}
#page-port .hero-card-amount{font-size:1.5em;font-weight:800;letter-spacing:-1px;line-height:1;}
#page-port .hero-card.lkr .hero-card-amount{color:var(--gold);text-shadow:0 0 30px rgba(255,215,0,.4);}
#page-port .hero-card.usd .hero-card-amount{color:#00ff88;text-shadow:0 0 30px rgba(0,255,136,.4);}
#page-port .hero-card-glow{position:absolute;right:-20px;bottom:-20px;width:110px;height:110px;border-radius:50%;filter:blur(40px);opacity:.22;}
#page-port .hero-card.lkr .hero-card-glow{background:#ffd700;}
#page-port .hero-card.usd .hero-card-glow{background:#00ff88;}
#page-port .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:16px;}
#page-port .gauge-row{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:16px;}
#page-port .glass-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  border-radius:18px;padding:16px;backdrop-filter:blur(20px);
  box-shadow:0 4px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.05);position:relative;overflow:hidden;}
#page-port .glass-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);}
#page-port .card-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
#page-port .card-dot{width:8px;height:8px;border-radius:50%;}
#page-port .card-title{font-size:.68em;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.45);}
#page-port canvas{max-height:210px;}
#page-port .assets-section{margin-bottom:16px;}
#page-port .section-heading{font-size:.65em;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,.3);margin-bottom:11px;display:flex;align-items:center;gap:10px;}
#page-port .section-heading::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06);}
#page-port .assets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px;}
#page-port .asset-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  border-radius:14px;padding:13px;position:relative;overflow:hidden;}
#page-port .asset-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;}
#page-port .asset-name{font-size:.74em;font-weight:500;color:rgba(255,255,255,.48);line-height:1.3;flex:1;}
#page-port .asset-badge{font-size:.56em;font-weight:700;padding:2px 6px;border-radius:6px;letter-spacing:1px;text-transform:uppercase;margin-left:5px;flex-shrink:0;}
#page-port .badge-positive{background:rgba(0,255,136,.15);color:#00ff88;}
#page-port .badge-negative{background:rgba(255,77,141,.15);color:var(--red2);}
#page-port .badge-neutral {background:rgba(0,212,255,.15);color:var(--blue);}
#page-port .asset-amount{font-size:1.25em;font-weight:700;letter-spacing:-.4px;color:#fff;}
#page-port .asset-amount.positive{color:#00ff88;}
#page-port .asset-amount.negative{color:var(--red2);}
#page-port .asset-amount.neutral {color:var(--blue);}
#page-port .asset-bar-wrap{margin-top:7px;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;}
#page-port .asset-bar{height:100%;border-radius:2px;transition:width 1.2s cubic-bezier(.4,0,.2,1);width:0;}
#page-port .log-btn{display:inline-flex;align-items:center;gap:7px;margin-top:11px;padding:9px 20px;
  border-radius:12px;border:1px solid rgba(255,215,0,.35);background:rgba(255,215,0,.09);
  color:var(--gold);font-family:'Inter',sans-serif;font-size:.74em;font-weight:700;letter-spacing:1px;
  cursor:pointer;transition:all .2s;}
#page-port .log-btn:hover:not(:disabled){background:rgba(255,215,0,.18);border-color:rgba(255,215,0,.65);transform:translateY(-1px);}
#page-port .log-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
#page-port .log-btn .btn-spin{width:12px;height:12px;border-radius:50%;
  border:2px solid rgba(255,215,0,.25);border-top-color:var(--gold);animation:spin .7s linear infinite;display:none;}
#page-port .log-btn.logging .btn-spin{display:block;}
#page-port .log-btn.logging .btn-ico{display:none;}
#page-port .log-note-wrap{display:none;margin-top:9px;}
#page-port .log-note-wrap.open{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
#page-port .log-note-input{background:rgba(255,255,255,.05);border:1px solid rgba(255,215,0,.25);
  border-radius:9px;padding:8px 13px;color:#fff;font-size:.74em;font-family:'Inter',sans-serif;
  width:230px;outline:none;transition:border-color .2s;}
#page-port .log-note-input:focus{border-color:rgba(255,215,0,.55);}
#page-port .log-confirm-btn{padding:8px 15px;border-radius:9px;border:1px solid rgba(255,215,0,.4);
  background:rgba(255,215,0,.15);color:var(--gold);font-size:.74em;font-weight:700;
  cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;}
#page-port .port-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50vh;gap:13px;}
#page-port .port-spinner{width:42px;height:42px;border:3px solid rgba(0,212,255,.12);
  border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
#page-port .port-loading-txt{color:rgba(255,255,255,.3);font-size:.82em;letter-spacing:1px;}
#page-port .error-box{background:rgba(255,77,141,.08);border:1px solid rgba(255,77,141,.25);
  border-radius:14px;padding:22px;text-align:center;color:var(--red2);font-size:.88em;}
.port-toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%) translateY(70px);
  background:rgba(6,11,24,.97);border:1px solid rgba(255,255,255,.1);border-radius:14px;
  padding:11px 20px;font-size:.78em;font-weight:600;backdrop-filter:blur(20px);
  z-index:200;white-space:nowrap;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s ease;
  opacity:0;display:flex;align-items:center;gap:8px;font-family:'Inter',sans-serif;}
.port-toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.port-toast.success{border-color:rgba(255,215,0,.4);color:var(--gold);}
.port-toast.info   {border-color:rgba(0,212,255,.35);color:var(--blue);}
.port-toast.error  {border-color:rgba(255,77,141,.35);color:var(--red2);}
@media(max-width:600px){
  #page-port .hero-cards,#page-port .charts-row,#page-port .gauge-row{grid-template-columns:1fr;}
  #page-port .assets-grid{grid-template-columns:1fr 1fr;}
  #page-port .port-header h1{font-size:1.45em;}
}
</style>
</head>

<script>
/* ═══════════════════════════════════════════
   SPA ROUTER
═══════════════════════════════════════════ */
var _spaLoaded = {cse:false, cc:false, exp:false, port:false};

function showPage(name){
  document.querySelectorAll('.spa-page').forEach(function(p){
    p.classList.remove('active');
  });
  document.getElementById('page-'+name).classList.add('active');
  document.querySelectorAll('.bnav-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.page===name);
  });
  if(!_spaLoaded[name]){
    _spaLoaded[name]=true;
    if(name==='cse')  cseStartLoad();
    if(name==='cc')   ccLoad();
    if(name==='exp')  expLoad();
    if(name==='port') portLoad();
  }
}

window.onload = function(){ showPage('cse'); };

/* ═══════════════════════════════════════════
   CSE / PORTFOLIO PAGE JS
═══════════════════════════════════════════ */
var _stocks=[], _live={}, _liveQ=[], _liveTotal=0, _liveDone=0;
var _goldLoaded=false, _divLoaded=false, _portChart=null, _goldChart=null;

function fr(n,d){return n===null||n===undefined||n===''?'—':Number(n).toLocaleString('en-IN',{minimumFractionDigits:d===undefined?2:d,maximumFractionDigits:d===undefined?2:d});}
function fs(n){var v=Number(n);if(!v&&v!==0)return '—';if(Math.abs(v)>=1e9)return '₨\u202f'+(v/1e9).toFixed(2)+'B';if(Math.abs(v)>=1e6)return '₨\u202f'+(v/1e6).toFixed(2)+'M';if(Math.abs(v)>=1e3)return '₨\u202f'+(v/1e3).toFixed(1)+'K';return '₨\u202f'+v.toFixed(2);}
function fp(n){if(n===null||n===undefined)return '—';var v=Number(n);return (v>=0?'+':'')+v.toFixed(2)+'%';}
function fc(n){var v=Number(n);return v>0?'up':v<0?'dn':'fl';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function cseKpi(icon,lbl,val,sub,delta,type){
  return '<div class="kpi '+type+' fade-in">'+
    '<div class="kpi-glow"></div>'+
    '<span class="kpi-icon">'+icon+'</span>'+
    '<div class="kpi-lbl">'+lbl+'</div>'+
    '<div class="kpi-val">'+val+'</div>'+
    (sub?'<div class="kpi-sub">'+sub+'</div>':'')+
    (delta?'<span class="kpi-delta '+(delta.startsWith('+')?'du':delta.startsWith('-')?'dd':'df')+'">'+delta+'</span>':'')+
    '</div>';
}
function secHdr(txt,cnt,color){
  return '<div class="sec-hdr">'+
    '<div class="sec-line" style="background:'+(color||'var(--blue)')+'"></div>'+
    '<span class="sec-text">'+txt+'</span>'+
    (cnt!==undefined?'<span class="sec-cnt">'+cnt+' items</span>':'')+
    '</div>';
}
function mr(l,v){return '<div class="s-meta-row"><span class="ml">'+l+'</span> '+v+'</div>';}
function insMetric(l,v){return '<span class="ins-metric"><span class="iml">'+l+'</span><span class="imv">'+v+'</span></span>';}

function switchTab(i){
  document.querySelectorAll('.tab').forEach(function(t,j){t.classList.toggle('active',j===i);});
  document.querySelectorAll('.panel').forEach(function(p,j){p.classList.toggle('active',j===i);});
  if(i===1&&!_goldLoaded) loadGoldData();
  if(i===2&&!_divLoaded)  loadDividendsForHoldings();
  if(i===3&&_liveDone>0)  renderInsights();
}
function tdot(i,s){var d=document.getElementById('td'+i);if(d)d.className='tdot'+(s?' '+s:'');}

function cseStartLoad(){
  _stocks=[];_live={};_liveQ=[];_liveTotal=0;_liveDone=0;_goldLoaded=false;_divLoaded=false;
  var btn=document.getElementById('refreshBtn');
  btn.disabled=true;
  document.getElementById('l0').style.display='flex';
  document.getElementById('c0').style.display='none';
  document.getElementById('loadFill').style.display='block';
  document.getElementById('updLbl').textContent='Reading…';
  tdot(0,'loading');tdot(3,'loading');
  setRing(0,'Reading your stocks…');
  google.script.run
    .withSuccessHandler(onSheetData)
    .withFailureHandler(function(e){
      document.getElementById('l0').innerHTML='<div class="err-box">'+esc(e.message)+'</div>';
      tdot(0,'err');btn.disabled=false;
    })
    .getCSESheetData();
}

function onSheetData(res){
  _stocks=res.stocks||[];
  renderShell(_stocks);
  setMktStatus();
  if(!_stocks.length){
    tdot(0,'done');tdot(3,'done');
    document.getElementById('refreshBtn').disabled=false;
    document.getElementById('loadFill').style.display='none';
    return;
  }
  _liveTotal=_stocks.length;
  _liveQ=_stocks.map(function(s){return s.symbol;});
  fetchNext();
}

function fetchNext(){
  if(!_liveQ.length){allLiveDone();return;}
  var sym=_liveQ.shift();
  google.script.run
    .withSuccessHandler(function(r){_live[r.symbol]=r;_liveDone++;onLive(r);fetchNext();})
    .withFailureHandler(function(){_liveDone++;fetchNext();})
    .getCSELivePrice(sym);
}

function setRing(pct,lbl){
  var f=document.getElementById('llFill');if(f)f.style.width=pct+'%';
  var p=document.getElementById('ringPct');if(p)p.textContent=pct+'%';
  var l=document.getElementById('ringLbl');if(l&&lbl)l.textContent=lbl;
}

function onLive(r){
  updateCard(r);
  var pct=Math.round(_liveDone/_liveTotal*100);
  setRing(pct,'Live: '+_liveDone+' / '+_liveTotal);
  document.getElementById('updLbl').textContent='Live: '+_liveDone+'/'+_liveTotal;
}

function allLiveDone(){
  buildTicker();updateKPIs();renderInsights();
  tdot(0,'done');tdot(3,'done');
  document.getElementById('refreshBtn').disabled=false;
  document.getElementById('loadFill').style.display='none';
  document.getElementById('updLbl').textContent='Updated '+new Date().toLocaleTimeString();
}

function loadGoldData(){
  tdot(1,'loading');
  var l1=document.getElementById('l1'),c1=document.getElementById('c1');
  l1.innerHTML='<div class="mini-line"></div><div>Fetching gold prices…</div>';
  l1.style.display='flex';c1.style.display='none';
  google.script.run
    .withSuccessHandler(function(d){_goldLoaded=true;renderGold(d);tdot(1,'done');})
    .withFailureHandler(function(e){c1.innerHTML='<div class="err-box">Gold error: '+esc(e.message)+'</div>';c1.style.display='block';l1.style.display='none';tdot(1,'err');})
    .getGoldData();
}

function loadDividendsForHoldings(){
  tdot(2,'loading');
  var l2=document.getElementById('l2'),c2=document.getElementById('c2');
  l2.innerHTML='<div class="mini-line"></div><div>Fetching dividends…</div>';
  l2.style.display='flex';c2.style.display='none';
  var heldSymbols=_stocks.filter(function(s){return s.qty>0;}).map(function(s){return s.symbol;});
  google.script.run
    .withSuccessHandler(function(d){_divLoaded=true;renderDividends(d.dividends||[],d.month||'');tdot(2,'done');})
    .withFailureHandler(function(e){c2.innerHTML='<div class="err-box">'+esc(e.message)+'</div>';c2.style.display='block';l2.style.display='none';tdot(2,'err');})
    .getCSEDividendsForHoldings(heldSymbols);
}

function renderShell(stocks){
  var l=document.getElementById('l0'),c=document.getElementById('c0');
  l.style.display='none';c.style.display='block';
  if(!stocks.length){c.innerHTML='<div class="empty"><div class="empty-ico">📭</div>No stocks found in UT_CRYPTO A20:A29.</div>';return;}
  var html='<div id="kpiZone"></div><div id="chartZone"></div>';
  html+=secHdr('Holdings',''+stocks.length+' stocks','var(--blue)');
  html+='<div class="stock-grid" id="stockGrid">';
  stocks.forEach(function(s){
    var p=s.sheetPrice;
    html+='<div class="scard shim fade-in" id="sc_'+s.symbol+'">';
    html+='<div class="scard-accent"></div>';
    html+='<div class="scard-sym">'+esc(s.symbol)+'<span class="live-tag sheet">sheet</span></div>';
    html+='<div class="scard-name">'+(esc(s.name)||'—')+'</div>';
    html+='<div class="price-row"><span class="s-price">₨ '+(p?p.toFixed(2):'—')+'</span></div>';
    html+='<div class="s-meta" id="meta_'+s.symbol+'"><div class="s-meta-row" style="color:var(--muted);grid-column:span 2;font-size:10px;">⏳ Fetching…</div></div>';
    if(s.boughtPrice>0&&s.qty>0){
      html+='<div class="pnl-section"><div class="pnl-label">'+s.qty+' @ ₨'+s.boughtPrice.toFixed(2)+'</div>';
      html+='<div class="pnl-num fl" id="pnl_'+s.symbol+'">Awaiting…</div>';
      html+='<div class="pnl-track"><div class="pnl-bar fl" id="pnlb_'+s.symbol+'" style="width:0%"></div></div></div>';
    } else {
      html+='<div class="no-pnl">Add col C (bought) + col D (qty) for P&L</div>';
    }
    html+='</div>';
  });
  html+='</div>';
  c.innerHTML=html;
}

function updateCard(r){
  var card=document.getElementById('sc_'+r.symbol);if(!card)return;
  var s=getStock(r.symbol);if(!s)return;
  if(!r.success){
    card.className='scard fl fade-in';
    card.querySelector('.scard-sym').innerHTML=esc(r.symbol)+'<span class="live-tag off">offline</span>';
    document.getElementById('meta_'+r.symbol).innerHTML='<div class="s-meta-row" style="color:var(--muted);grid-column:span 2">Unavailable</div>';
    return;
  }
  var price=r.currentPrice||s.sheetPrice;
  var cc=fc(r.changePct);
  card.className='scard '+cc+' fade-in';
  card.querySelector('.scard-sym').innerHTML=esc(r.symbol)+'<span class="live-tag live">live</span>';
  card.querySelector('.scard-name').textContent=r.companyName||s.name||'—';
  var pr=card.querySelector('.price-row');
  pr.innerHTML='<span class="s-price">₨ '+price.toFixed(2)+'</span>'+(r.changePct!==undefined?'<span class="chg-pill '+cc+'">'+fp(r.changePct)+'</span>':'');
  var mh='';
  if(r.change!==undefined) mh+=mr('Chg','₨ '+Number(r.change).toFixed(2));
  if(r.dayHigh)  mh+=mr('H','₨ '+r.dayHigh.toFixed(2));
  if(r.dayLow)   mh+=mr('L','₨ '+r.dayLow.toFixed(2));
  if(r.volume)   mh+=mr('Vol',r.volume>1000?(r.volume/1000).toFixed(0)+'K':''+r.volume);
  if(r.yearHigh) mh+=mr('52↑','₨ '+r.yearHigh.toFixed(2));
  if(r.yearLow)  mh+=mr('52↓','₨ '+r.yearLow.toFixed(2));
  if(r.pe>0)     mh+=mr('P/E',r.pe.toFixed(1));
  if(r.dividendYield>0) mh+=mr('Div%',r.dividendYield.toFixed(2)+'%');
  if(!mh) mh='<div class="s-meta-row" style="color:var(--muted);grid-column:span 2">Limited data</div>';
  document.getElementById('meta_'+r.symbol).innerHTML=mh;
  var pe=document.getElementById('pnl_'+r.symbol),pb=document.getElementById('pnlb_'+r.symbol);
  if(pe&&s.boughtPrice>0&&s.qty>0){
    var pnl=(price-s.boughtPrice)*s.qty,pp=((price-s.boughtPrice)/s.boughtPrice)*100,pc=pnl>=0?'up':'dn';

    if(r&&r.success){
      if(r.dividendYield>6) ins.push({sym:s.symbol,co:co,t:'hold',urgency:'low',ico:'🏦',title:'High Dividend Yield',desc:'Yield '+r.dividendYield.toFixed(2)+'% — above market average.',metrics:[['Yield',r.dividendYield.toFixed(2)+'%']],action:'Verify payout ratio. Yield >10% may signal falling price, not genuine income.'});
      if(r.pe>0&&r.pe<8) ins.push({sym:s.symbol,co:co,t:'buy',urgency:'low',ico:'💎',title:'Low P/E — Value Signal',desc:'P/E '+r.pe.toFixed(1)+' — below typical valuations.',metrics:[['P/E',r.pe.toFixed(1)]],action:'Check if genuine undervaluation or value trap (declining earnings). Compare to peers.'});
      else if(r.pe>40) ins.push({sym:s.symbol,co:co,t:'info',urgency:'low',ico:'📊',title:'High P/E',desc:'P/E '+r.pe.toFixed(1)+' — growth premium priced in.',metrics:[['P/E',r.pe.toFixed(1)]],action:'Very sensitive to earnings misses. Monitor quarterly results closely.'});
    }
  });
  if(!ins.length){
    c.innerHTML='<div class="empty"><div class="empty-ico">💡</div>'+(_stocks.length&&!Object.keys(_live).length?'Waiting for live prices…':'No active signals. All positions stable.<br><br><span style="color:var(--blue)">Add bought price (col C) + qty (col D) for P&L signals.</span>')+'</div>';
    return;
  }
  var counts={sell:0,watch:0,hold:0,buy:0,info:0};
  ins.forEach(function(i){counts[i.t]=(counts[i.t]||0)+1;});
  var html='<div class="ins-summary"><div class="ins-sum-card sell"><div class="ins-sum-ico">🔴</div><div><div class="ins-sum-num">'+counts.sell+'</div><div class="ins-sum-lbl">Sell</div></div></div><div class="ins-sum-card watch"><div class="ins-sum-ico">🟡</div><div><div class="ins-sum-num">'+(counts.watch+counts.info)+'</div><div class="ins-sum-lbl">Watch</div></div></div><div class="ins-sum-card hold"><div class="ins-sum-ico">🟢</div><div><div class="ins-sum-num">'+counts.hold+'</div><div class="ins-sum-lbl">Hold</div></div></div><div class="ins-sum-card buy"><div class="ins-sum-ico">🔵</div><div><div class="ins-sum-num">'+counts.buy+'</div><div class="ins-sum-lbl">Buy</div></div></div></div>';
  html+=secHdr('All Signals',''+ins.length,'var(--purple)');
  html+='<div class="ins-list">';
  var ord={sell:0,watch:1,buy:2,hold:3,info:4};
  ins.sort(function(a,b){var od=(ord[a.t]||5)-(ord[b.t]||5);if(od!==0)return od;var uo={high:0,medium:1,low:2};return (uo[a.urgency]||3)-(uo[b.urgency]||3);});
  ins.forEach(function(i){
    var mHtml=i.metrics.map(function(m){return insMetric(m[0],m[1]);}).join('');
    html+='<div class="ins-card '+i.t+' fade-in"><div class="ins-top"><div class="ins-ico">'+i.ico+'</div><div class="ins-main"><div class="ins-header"><span class="ins-sym">'+esc(i.sym)+'</span><span class="ins-co">'+esc(i.co)+'</span><span class="sig-tag '+i.t+'">'+i.t.toUpperCase()+'</span><span class="urgency-tag '+i.urgency+'">'+i.urgency.toUpperCase()+'</span></div><div class="ins-title">'+esc(i.title)+'</div><div class="ins-desc">'+esc(i.desc)+'</div>'+(mHtml?'<div class="ins-metrics">'+mHtml+'</div>':'')+'<div class="ins-action"><div class="ins-action-ico">💬</div><div class="ins-action-text"><strong>What to do:</strong> '+esc(i.action)+'</div></div></div></div></div>';
  });
  html+='</div>';
  c.innerHTML=html;
}

function setMktStatus(){

function ccBrandCfg(name){
  var n=(name||'').toLowerCase();
  if(n.includes('hsbc'))  return {color:'#db0011',bg:'linear-gradient(135deg,#db0011,#a00)',label:'HSBC', dot:'#db0011'};
  if(n.includes('amex'))  return {color:'#006fcf',bg:'linear-gradient(135deg,#006fcf,#004a99)',label:'AMEX', dot:'#006fcf'};
  if(n.includes('selan')) return {color:'#ffd700',bg:'linear-gradient(135deg,#ffd700,#cc9900)',label:'SELAN',dot:'#ffd700'};
  if(n.includes('hnb'))   return {color:'#ff6b35',bg:'linear-gradient(135deg,#ff6b35,#cc4400)',label:'HNB',  dot:'#ff6b35'};
  if(n.includes('com'))   return {color:'#00d4ff',bg:'linear-gradient(135deg,#00d4ff,#0099cc)',label:'COM',  dot:'#00d4ff'};
  return {color:'#a855f7',bg:'linear-gradient(135deg,#a855f7,#7c3aed)',label:'CARD',dot:'#a855f7'};
}

function ccFmt(v){
  if(!v&&v!==0)return '—';
  var n=parseFloat((v+'').replace(/,/g,''));
  if(isNaN(n))return v;
  return '₨ '+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function ccFmtDate(v){if(!v||v===''||v===0)return '—';return (v+'').trim();}

function ccGetAlertHTML(paymentAfterStatement,lastStatementBalance,id){
  var pay=parseFloat((paymentAfterStatement+'').replace(/,/g,''))||0;
  var bal=parseFloat((lastStatementBalance+'').replace(/,/g,''))||0;
  if(!lastStatementBalance||lastStatementBalance==='') return '<span class="alert-badge alert-warn" id="'+id+'">⚠ No Data</span>';
  if(pay>bal) return '<span class="alert-badge alert-ok" id="'+id+'">✓ No Worry</span>';
  return '<span class="alert-badge alert-bad" id="'+id+'">⚠ Watch Out</span>';
}

var EXP_CAT_COLORS={
  'Food':'#f59e0b','Super market':'#10b981','Uber':'#6366f1',

var EXP_FALLBACK=['#6366f1','#8b5cf6','#06b6d4','#f59e0b','#10b981','#ec4899','#f97316','#ef4444','#84cc16','#64748b'];
var EXP_YR_COLORS=['#6366f1','#06b6d4','#10b981','#f59e0b','#ec4899','#f97316'];
var EXP_MON_ORDER=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function expCc(name,i){return EXP_CAT_COLORS[name]||EXP_FALLBACK[i%EXP_FALLBACK.length];}
function expSl(s){var p=s.trim().split(/\s+/);if(p.length<2)return s.substring(0,6);var m=p[0].substring(0,3);if(m.toUpperCase()==='OTC')m='Oct';return m+" '"+p[p.length-1].substring(2);}
function expF(n){return n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString('en-IN');}
function expFr(n){return '₨ '+Math.round(n).toLocaleString('en-IN');}
var EXP_GC='rgba(255,255,255,0.05)',EXP_TC='#475569';
var EXP_LEG={labels:{color:'#94a3b8',boxWidth:10,padding:14,font:{size:11}}};
function expSc(stacked){
  return {
    x:{grid:{color:EXP_GC},ticks:{color:EXP_TC,maxRotation:35},stacked:!!stacked},
    y:{grid:{color:EXP_GC},ticks:{color:EXP_TC,callback:function(v){return '₨'+expF(v);}},stacked:!!stacked}
  };
}
function expMonKey(lbl){return lbl.split(' ')[0];}
function expMonIdx(k){var i=EXP_MON_ORDER.findIndex(function(m){return m.toLowerCase()===k.toLowerCase();});return i>=0?i:11;}

function expLoad(){

    .withSuccessHandler(function(d){try{expBuild(d);}catch(e){expShowErr('Render error: '+e.message);}})

function expBuild(D){
  var months=D.months,totals=D.monthlyTotals,cats=D.categories,yg=D.yearGroups,latest=D.latestMonth;
  var labels=months.map(expSl),n=months.length,li=n-1;
  var years=Object.keys(yg).sort();
  var cur=totals[li]||0,prev=totals[li-1]||0;
  var mom=prev>0?(cur-prev)/prev*100:0;
  var avg=totals.reduce(function(a,b){return a+b;},0)/(n||1);
  var bestI=totals.indexOf(Math.min.apply(null,totals));
  var worstI=totals.indexOf(Math.max.apply(null,totals));
  var catCur=cats.map(function(c,i){return {name:c.name,val:c.values[li]||0,i:i};}).sort(function(a,b){return b.val-a.val;});
  var topCat=catCur[0]||{name:'–',val:0};
  var rentObj=cats.find(function(c){return c.name.toLowerCase()==='rent';});
  var rentVal=rentObj?rentObj.values[li]||0:0;
  var varSpd=cur-rentVal,rentPct=cur>0?rentVal/cur*100:0;
  var foodObj=cats.find(function(c){return c.name.toLowerCase()==='food';});
  var foodVal=foodObj?foodObj.values[li]||0:0,foodPct=cur>0?foodVal/cur*100:0;
  var discNames=['movies & outing','party','dress and appearance'];
  var discVal=cats.filter(function(c){return discNames.includes(c.name.toLowerCase());}).reduce(function(s,c){return s+(c.values[li]||0);},0);
  var discPct=cur>0?discVal/cur*100:0;
  var momArr=totals.map(function(v,i){return i===0?0:v-totals[i-1];});
  var catAll=cats.map(function(c,i){return {name:c.name,tot:c.values.reduce(function(s,v){return s+v;},0),i:i};}).sort(function(a,b){return b.tot-a.tot;});
  var transVal=['uber','uber work','bus fair'].reduce(function(s,nm){var c=cats.find(function(x){return x.name.toLowerCase()===nm;});return s+(c?c.values[li]||0:0);},0);

  var yrCards=years.map(function(yr,yi){
    var g=yg[yr];
    var yrTotal=g.totals.reduce(function(a,b){return a+b;},0);
    var yrAvg=yrTotal/(g.months.length||1);
    var yrBestI=g.totals.indexOf(Math.min.apply(null,g.totals));
    var yrWorstI=g.totals.indexOf(Math.max.apply(null,g.totals));
    var yoyHtml='';
    if(yi>0){var prevYr=years[yi-1];var prevTotal=yg[prevYr].totals.reduce(function(a,b){return a+b;},0);

var PORT_PALETTE=['#00d4ff','#00ff88','#ffd700','#a855f7','#ff6b35','#ff4d8d','#38bdf8','#34d399','#fbbf24','#c084fc','#fb923c','#f472b6'];

function portFmt(value,currency){
  currency=currency||'LKR';
  if(!value&&value!==0)return '—';
  var num=parseFloat(value.toString().replace(/,/g,''));
  if(isNaN(num))return value;
  var f2=Math.abs(num).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  var sign=num<0?'-':'';
  return sign+(currency==='USD'?'$':'₨')+f2;
}

function portAnimateCounter(el,target,duration,prefix){
  duration=duration||1400;prefix=prefix||'₨';
  var start=performance.now();
  function upd(now){
    var pct=Math.min((now-start)/duration,1);
    var ease=1-Math.pow(1-pct,4);
    var val=target*ease;
    el.textContent=prefix+Math.abs(val).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
    if(pct<1)requestAnimationFrame(upd);
  }
  requestAnimationFrame(upd);
}

function portGetClass(cat){
  var c=cat.toLowerCase();
  if(c.includes('earn')||c.includes('stock')||c.includes('gold')||c.includes('cash')||c.includes('saving'))return 'positive';
  if(c.includes('due')||c.includes('splitwise')||c.includes('loan')||c.includes('borrow'))return 'negative';
  return 'neutral';
}

function portShowToast(msg,type){
  var t=document.getElementById('portToast');if(!t)return;
  t.textContent=msg;t.className='port-toast '+(type||'info');
  void t.offsetWidth;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},3400);
}

function portStartLog(){
  var wrap=document.getElementById('portLogNoteWrap');if(!wrap)return;
  wrap.classList.toggle('open');
  if(wrap.classList.contains('open')){var inp=document.getElementById('portLogNoteInput');if(inp){inp.value='';inp.focus();}}
}

function portConfirmLog(){
  var btn=document.getElementById('portLogBtn'),wrap=document.getElementById('portLogNoteWrap');
  var note=(document.getElementById('portLogNoteInput')||{}).value||'';
  if(btn){btn.disabled=true;btn.classList.add('logging');}
  if(wrap)wrap.classList.remove('open');
  google.script.run
    .withSuccessHandler(function(result){
      if(btn){btn.disabled=false;btn.classList.remove('logging');}
      if(result&&!result.logged){portShowToast('⏭️ '+result.message,'error');return;}
      portShowToast('✅ '+result.message+' — refreshing…','success');
      google.script.run
        .withSuccessHandler(function(data){portDisplayPortfolio(data);portShowToast('✅ Growth chart updated!','success');})
        .withFailureHandler(function(err){portShowToast('⚠️ Logged but refresh failed: '+(err.message||err),'error');})
        .getPortfolioData();
    })
    .withFailureHandler(function(err){
      if(btn){btn.disabled=false;btn.classList.remove('logging');}
      portShowToast('⚠️ '+(err.message||err),'error');
    })
    .logPortfolioAmount(note);
}

document.addEventListener('keydown',function(e){
  var wrap=document.getElementById('portLogNoteWrap');
  if(e.key==='Enter'&&wrap&&wrap.classList.contains('open'))portConfirmLog();
});

function portLoad(){
  google.script.run
    .withSuccessHandler(portDisplayPortfolio)
    .withFailureHandler(portShowError)
    .getPortfolioData();
}

function portShowError(err){
  document.getElementById('port-root').innerHTML='<div class="error-box">⚠️ Error loading portfolio<br><small style="opacity:.6">'+(err.message||err)+'</small></div>';
}

function portDisplayPortfolio(data){
  var rawAssets=(data&&data.assets)?data.assets:(Array.isArray(data)?data:[]);
  var growthData=(data&&data.growth)?data.growth:[];
  if(!rawAssets||!rawAssets.length){document.getElementById('port-root').innerHTML='<div class="error-box">No portfolio data found.</div>';return;}
  var totalLKR=0,totalUSD=0,assets=[],portTotals=[];
  rawAssets.forEach(function(row){
    var cat=(row[0]||'').trim();
    var amt=parseFloat((row[1]||0).toString().replace(/,/g,''))||0;
    if(!cat)return;
    if(cat.toLowerCase().includes('total'))portTotals.push({cat:cat,amt:amt});
    else assets.push({cat:cat,amt:amt});
  });
  portTotals.forEach(function(t){if(t.cat.toLowerCase().includes('usd'))totalUSD=t.amt;else totalLKR=t.amt;});
  var posAssets=assets.filter(function(a){return a.amt>0;});
  var totalPositive=posAssets.reduce(function(s,a){return s+a.amt;},0);

  var assetCards=assets.map(function(a,i){
    var cls=portGetClass(a.cat);
    var badge=cls==='positive'?'badge-positive':cls==='negative'?'badge-negative':'badge-neutral';
    var badgeText=cls==='positive'?'ASSET':cls==='negative'?'OWE':'OTHER';
    var amtCls=a.amt<0?'negative':cls==='positive'?'positive':'neutral';
    var barPct=totalPositive>0&&a.amt>0?(a.amt/totalPositive*100).toFixed(1):0;
    var barColor=PORT_PALETTE[i%PORT_PALETTE.length];
    return '<div class="asset-card" data-bar="'+barPct+'" data-color="'+barColor+'">'+
      '<div class="asset-card-top"><div class="asset-name">'+a.cat+'</div><span class="asset-badge '+badge+'">'+badgeText+'</span></div>'+
      '<div class="asset-amount '+amtCls+'">'+portFmt(a.amt)+'</div>'+
      (a.amt>0?'<div class="asset-bar-wrap"><div class="asset-bar" style="background:'+barColor+'"></div></div>':'')+
    '</div>';
  }).join('');

  document.getElementById('port-root').innerHTML=
    '<div class="port-header">'+
      '<div class="header-tag">Live Dashboard</div>'+
      '<h1>Portfolio Summary</h1>'+
      '<div class="header-sub">Updated just now</div>'+
      '<button class="log-btn" id="portLogBtn" onclick="portStartLog()"><span class="btn-ico">💾</span><div class="btn-spin"></div> Log Portfolio Value</button>'+
      '<div class="log-note-wrap" id="portLogNoteWrap">'+
        '<input class="log-note-input" id="portLogNoteInput" type="text" placeholder="Optional note (e.g. Saudi money, bonus…)" maxlength="60">'+
        '<button class="log-confirm-btn" onclick="portConfirmLog()">✓ Confirm</button>'+
      '</div>'+
    '</div>'+
    '<div class="hero-cards">'+
      '<div class="hero-card lkr"><div class="hero-card-glow"></div><span class="hero-card-icon">🏦</span><div class="hero-card-label">Total Portfolio · LKR</div><div class="hero-card-amount" id="portLkrCounter">'+portFmt(totalLKR)+'</div></div>'+
      '<div class="hero-card usd"><div class="hero-card-glow"></div><span class="hero-card-icon">💵</span><div class="hero-card-label">Total Portfolio · USD</div><div class="hero-card-amount" id="portUsdCounter">'+portFmt(totalUSD,'USD')+'</div></div>'+
    '</div>'+
    '<div class="charts-row">'+
      '<div class="glass-card"><div class="card-header"><div class="card-dot" style="background:#a855f7;box-shadow:0 0 6px #a855f7"></div><div class="card-title">Asset Allocation</div></div><canvas id="portDonutChart"></canvas></div>'+
      '<div class="glass-card"><div class="card-header"><div class="card-dot" style="background:#00d4ff;box-shadow:0 0 6px #00d4ff"></div><div class="card-title">Value Comparison</div></div><canvas id="portBarChart"></canvas></div>'+
    '</div>'+
    '<div class="gauge-row">'+
      '<div class="glass-card"><div class="card-header"><div class="card-dot" style="background:#00ff88;box-shadow:0 0 6px #00ff88"></div><div class="card-title">Polar Distribution</div></div><canvas id="portPolarChart"></canvas></div>'+
      '<div class="glass-card"><div class="card-header"><div class="card-dot" style="background:#ffd700;box-shadow:0 0 6px #ffd700"></div><div class="card-title">Horizontal Bars</div></div><canvas id="portHbarChart"></canvas></div>'+
    '</div>'+
    (growthData.length>0?
      '<div class="assets-section">'+
        '<div class="section-heading">📈 Growth Trajectory</div>'+
        '<div class="glass-card" style="margin-bottom:16px">'+
          '<div class="card-header"><div class="card-dot" style="background:#2dd4bf;box-shadow:0 0 6px #2dd4bf"></div><div class="card-title">Portfolio Value Over Time</div></div>'+
          '<div id="portGrowthStats" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div>'+
          '<canvas id="portGrowthChart" style="max-height:190px"></canvas>'+
          '<div id="portGrowthMilestones" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:11px"></div>'+
        '</div>'+
      '</div>':'')+
    '<div class="assets-section"><div class="section-heading">All Assets &amp; Balances</div><div class="assets-grid">'+assetCards+'</div></div>';

  setTimeout(function(){
    var lEl=document.getElementById('portLkrCounter'),uEl=document.getElementById('portUsdCounter');
    if(lEl)portAnimateCounter(lEl,totalLKR,1600,'₨');
    if(uEl)portAnimateCounter(uEl,totalUSD,1600,'$');
  },200);

  setTimeout(function(){
    document.querySelectorAll('#page-port .asset-card[data-bar]').forEach(function(card){
      var bar=card.querySelector('.asset-bar');if(bar)bar.style.width=card.dataset.bar+'%';
    });
  },400);

  portBuildCharts(posAssets);
  if(growthData.length>0)setTimeout(function(){portBuildGrowthChart(growthData);},300);
}

function portBuildCharts(posAssets){
  var labels=posAssets.map(function(a){return a.cat;});
  var values=posAssets.map(function(a){return a.amt;});
  var colors=posAssets.map(function(_,i){return PORT_PALETTE[i%PORT_PALETTE.length];});
  var colAlpha=colors.map(function(c){return c+'33';});
  var TIP3={backgroundColor:'rgba(6,11,24,.95)',borderColor:'rgba(255,255,255,.1)',borderWidth:1,titleColor:'#fff',bodyColor:'rgba(255,255,255,.7)',padding:11};
  var tickCb=function(v){return '₨'+(v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':v);};

  new Chart(document.getElementById('portDonutChart'),{type:'doughnut',
    data:{labels:labels,datasets:[{data:values,backgroundColor:colAlpha,borderColor:colors,borderWidth:2,hoverBorderWidth:3,hoverOffset:8}]},
    options:{responsive:true,cutout:'68%',animation:{animateRotate:true,duration:1200},
      plugins:{legend:{position:'bottom',labels:{color:'rgba(255,255,255,.5)',font:{size:9},padding:9,boxWidth:9,usePointStyle:true,pointStyleWidth:7}},
        tooltip:{backgroundColor:TIP3.backgroundColor,borderColor:TIP3.borderColor,borderWidth:1,titleColor:TIP3.titleColor,bodyColor:TIP3.bodyColor,padding:11,
          callbacks:{label:function(ctx){return ' '+ctx.label+': '+portFmt(ctx.parsed);}}}}}});

  new Chart(document.getElementById('portBarChart'),{type:'bar',
    data:{labels:labels,datasets:[{data:values,backgroundColor:colAlpha,borderColor:colors,borderWidth:2,borderRadius:8,borderSkipped:false}]},
    options:{responsive:true,animation:{duration:1200},
      plugins:{legend:{display:false},tooltip:{backgroundColor:TIP3.backgroundColor,borderColor:TIP3.borderColor,borderWidth:1,titleColor:TIP3.titleColor,bodyColor:TIP3.bodyColor,padding:11,callbacks:{label:function(ctx){return ' '+portFmt(ctx.parsed.y);}}}},
      scales:{x:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9}},grid:{color:'rgba(255,255,255,.04)'}},
        y:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9},callback:tickCb},grid:{color:'rgba(255,255,255,.05)'}}}}});

  new Chart(document.getElementById('portPolarChart'),{type:'polarArea',
    data:{labels:labels,datasets:[{data:values,backgroundColor:colAlpha,borderColor:colors,borderWidth:2}]},
    options:{responsive:true,animation:{duration:1400},
      scales:{r:{ticks:{display:false},grid:{color:'rgba(255,255,255,.06)'},pointLabels:{display:false}}},
      plugins:{legend:{display:false},tooltip:{backgroundColor:TIP3.backgroundColor,borderColor:TIP3.borderColor,borderWidth:1,titleColor:TIP3.titleColor,bodyColor:TIP3.bodyColor,padding:11,callbacks:{label:function(ctx){return ' '+ctx.label+': '+portFmt(ctx.parsed.r);}}}}}});

  new Chart(document.getElementById('portHbarChart'),{type:'bar',
    data:{labels:labels,datasets:[{data:values,backgroundColor:colAlpha,borderColor:colors,borderWidth:2,borderRadius:6}]},
    options:{indexAxis:'y',responsive:true,animation:{duration:1200},
      plugins:{legend:{display:false},tooltip:{backgroundColor:TIP3.backgroundColor,borderColor:TIP3.borderColor,borderWidth:1,titleColor:TIP3.titleColor,bodyColor:TIP3.bodyColor,padding:11,callbacks:{label:function(ctx){return ' '+portFmt(ctx.parsed.x);}}}},
      scales:{x:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9},callback:tickCb},grid:{color:'rgba(255,255,255,.05)'}},
        y:{ticks:{color:'rgba(255,255,255,.5)',font:{size:9}},grid:{display:false}}}}});
}

function portBuildGrowthChart(growth){
  var canvas=document.getElementById('portGrowthChart');if(!canvas)return;
  var ctx=canvas.getContext('2d');
  var glabels=growth.map(function(g){return g.date;});
  var amounts=growth.map(function(g){return g.amount;});
  var notes=growth.map(function(g){return g.note;});
  var fill=ctx.createLinearGradient(0,0,0,190);
  fill.addColorStop(0,'rgba(45,212,191,.38)');fill.addColorStop(1,'rgba(45,212,191,.02)');
  new Chart(ctx,{type:'line',data:{labels:glabels,datasets:[{label:'Portfolio Value',data:amounts,
    borderColor:'#2dd4bf',backgroundColor:fill,borderWidth:3,fill:true,tension:.38,
    pointBackgroundColor:amounts.map(function(v,i){return notes[i]?'#ffd700':'#2dd4bf';}),
    pointRadius:amounts.map(function(v,i){return notes[i]?7:4;}),
    pointHoverRadius:9,pointBorderColor:'rgba(0,0,0,.5)',pointBorderWidth:2}]},
    options:{responsive:true,animation:{duration:1600},
      plugins:{legend:{display:false},tooltip:{backgroundColor:'rgba(6,11,24,.96)',borderColor:'rgba(45,212,191,.3)',borderWidth:1,titleColor:'#2dd4bf',bodyColor:'rgba(255,255,255,.65)',padding:11,
        callbacks:{title:function(c){return glabels[c[0].dataIndex];},
          label:function(c){var n2=notes[c.dataIndex];var base=' ₨'+Number(c.parsed.y).toLocaleString('en-IN',{minimumFractionDigits:0});return n2?[base,' 📌 '+n2]:base;}}}},
      scales:{x:{ticks:{color:'rgba(255,255,255,.45)',font:{size:10},maxRotation:0},grid:{color:'rgba(255,255,255,.04)'}},
        y:{min:Math.floor((Math.min.apply(null,amounts)*.94)/1e5)*1e5,max:Math.ceil((Math.max.apply(null,amounts)*1.04)/1e5)*1e5,
          ticks:{color:'rgba(255,255,255,.4)',font:{size:10},callback:function(v){return '₨'+(v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':v);}},
          grid:{color:'rgba(255,255,255,.05)'}}}}});

  var first=amounts[0]||0,last=amounts[amounts.length-1]||0;
  var growPct=first>0?((last-first)/first*100):0;
  var statsEl=document.getElementById('portGrowthStats');
  if(statsEl){
    var pill2=function(lbl,val,col){return '<div style="flex:1;min-width:90px;background:rgba(45,212,191,.07);border:1px solid rgba(45,212,191,.16);border-radius:11px;padding:9px 12px;text-align:center"><div style="font-size:.58em;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.32);margin-bottom:2px">'+lbl+'</div><div style="font-size:1em;font-weight:800;color:'+(col||'#2dd4bf')+'">'+val+'</div></div>';};
    var fmtM=function(v){return '₨'+(v/1e6).toFixed(2)+'M';};
    statsEl.innerHTML=pill2('Start',fmtM(first))+pill2('Latest',fmtM(last))+pill2('Growth',(growPct>=0?'+':'')+growPct.toFixed(1)+'%',growPct>=0?'#00ff88':'#ff4d8d')+pill2('Entries',growth.length);
  }
  var msEl=document.getElementById('portGrowthMilestones');
  if(msEl)msEl.innerHTML=growth.filter(function(g){return g.note;}).map(function(g){return '<span style="font-size:.65em;padding:3px 9px;border-radius:6px;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.25);color:#ffd700">📌 '+g.date+' · '+g.note+'</span>';}).join('');
}
</script>

<!-- ═══════════════════════════════════════════════════════════════════
     EXPENSE HEATMAP — the Year scope of the month workspace
     ─────────────────────────────────────────────────────────────
     Lives inside monthDetail's #md-panel, so it wears that panel's
     tokens and carries no chrome of its own: the shell supplies the
     command bar, the year stepper and the budget drawer.

     Colour does one job here. A single blue ramp carries magnitude —
     the same five steps the month ribbon uses — and the only other
     hues are status (over / under plan, always with a word beside
     them) and one purple that means "a Major EXP item" and nothing
     else. The old per-month gradient accents are gone: they coloured
     by identity what the cells already encode as magnitude.

     Talks to the shell through four calls only:
       mdOpenMonth(y, m)      a month card or bar
       mdOpenDay(y, m, d)     a day cell
       mdGoYear(y)            a year bar
       mdSwitchScope('major') a Major EXP row in the rail
     and reads _mdBudget (monthDetail's live control plan) to draw the
     plan line, when a month has been read.
═══════════════════════════════════════════════════════════════════ -->
<style>
.hm-wrap{
  --hm-pane:#12151B; --hm-field:#0F1218;
  --hm-line:rgba(255,255,255,.08); --hm-line2:rgba(255,255,255,.13);
  --hm-ink:#E9EEF4; --hm-ink2:#98A2B1; --hm-ink3:#6C7788;
  --hm-acc:#2E6BE6;
  --hm-good:#14B88A; --hm-warn:#F0A92A; --hm-crit:#DC4B4B; --hm-tag:#B79BFF;
  --hm-num:'Sora','Inter',ui-monospace,monospace;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:var(--hm-ink);width:100%;height:100%;
  display:flex;flex-direction:column;overflow:hidden;background:transparent;
}
.hm-wrap *{box-sizing:border-box;}
.hm-wrap button{font-family:inherit;}

/* ── KPI strip ── */
.hm-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;
  padding:16px 18px 0;flex-shrink:0;}
.hm-kpi{padding:12px 13px;border-radius:12px;background:var(--hm-pane);
  border:1px solid var(--hm-line);}
.hm-kpi-lbl{font-size:9.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--hm-ink3);margin-bottom:7px;}
.hm-kpi-val{font-family:var(--hm-num);font-size:19px;font-weight:700;letter-spacing:-.6px;
  line-height:1;font-variant-numeric:tabular-nums;}
.hm-kpi-foot{display:flex;align-items:center;gap:5px;margin-top:6px;}
.hm-kpi-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.hm-kpi-sub{font-size:11px;color:var(--hm-ink2);}

/* ── body: main + rail ── */
.hm-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 18px;
  display:flex;gap:16px;align-items:flex-start;}
.hm-scroll::-webkit-scrollbar{width:6px;}
.hm-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;}
.hm-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;}
.hm-rail{width:322px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;}

.hm-card{padding:14px 15px;border-radius:12px;background:var(--hm-pane);
  border:1px solid var(--hm-line);}
.hm-eye{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap;}
.hm-eye h2{margin:0;font-size:10px;font-weight:700;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--hm-ink3);}
.hm-rule{flex:1;height:1px;background:var(--hm-line);min-width:12px;}

/* ── category chips ── */
.hm-chips{display:flex;flex-wrap:wrap;gap:6px;}
.hm-chip{padding:5px 11px;border-radius:999px;border:1px solid var(--hm-line2);
  background:var(--hm-pane);color:var(--hm-ink2);font-size:11.5px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.hm-chip:hover{color:var(--hm-ink);border-color:rgba(255,255,255,.24);}
.hm-chip.active{background:var(--hm-acc);border-color:var(--hm-acc);color:#fff;}
.hm-chip i{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

/* ── the ramp: one hue, five steps ── */
.hm-cell{width:18px;height:18px;border-radius:4px;background:#12161C;
  border:0;padding:0;display:block;}
.hm-cell.l1{background:#16222F;}
.hm-cell.l2{background:#1D3B5C;}
.hm-cell.l3{background:#24568C;}
.hm-cell.l4{background:#2E70BD;}
.hm-cell.l5{background:#4A96EA;}
button.hm-cell{cursor:pointer;}
button.hm-cell:hover{outline:2px solid var(--hm-ink2);outline-offset:1px;}
.hm-cell.today{box-shadow:0 0 0 2px var(--hm-pane),0 0 0 3.5px var(--hm-ink);}

.hm-legend{display:flex;align-items:center;gap:5px;}
.hm-legend span.t{font-size:10.5px;color:var(--hm-ink3);}
.hm-legend .hm-cell{width:13px;height:13px;}

/* ── month cards ── */
.hm-months{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px;}
.hm-mcard{padding:12px;border-radius:12px;background:var(--hm-pane);
  border:1px solid var(--hm-line);color:inherit;cursor:pointer;}
.hm-mcard:hover{background:#161A21;border-color:rgba(255,255,255,.22);}
.hm-mcard.now{border-color:var(--hm-acc);}
.hm-mcard-hd{display:flex;align-items:baseline;gap:6px;margin-bottom:9px;}
.hm-mcard-nm{font-size:12.5px;font-weight:600;}
.hm-mcard-tot{margin-left:auto;font-family:var(--hm-num);font-size:11px;color:var(--hm-ink2);}
.hm-grid{display:grid;grid-template-columns:repeat(7,18px);gap:3px;justify-content:center;}
.hm-dow{font-size:8.5px;text-align:center;color:var(--hm-ink3);line-height:1;}

/* ── month totals against plan ── */
.hm-trend{display:flex;align-items:flex-end;gap:10px;height:104px;}
.hm-tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;border:0;background:transparent;padding:0;}
.hm-tcol:hover .hm-tbar{filter:brightness(1.3);}
.hm-tbox{position:relative;width:100%;height:78px;display:flex;align-items:flex-end;}
.hm-tbar{width:100%;border-radius:4px 4px 0 0;background:#2E70BD;min-height:2px;}
.hm-tbar.over{background:var(--hm-crit);}
.hm-tplan{position:absolute;left:0;right:0;height:2px;background:var(--hm-ink2);border-radius:1px;}
.hm-tlbl{font-size:9.5px;color:var(--hm-ink3);}
.hm-key{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--hm-ink2);}
.hm-key i{width:9px;height:9px;border-radius:2px;}
.hm-key i.line{width:14px;height:2px;border-radius:1px;background:var(--hm-ink2);}

/* ── year strip ── */
.hm-years{display:flex;gap:8px;}
.hm-ycol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:8px 4px;border-radius:10px;border:1px solid var(--hm-line);
  background:var(--hm-field);cursor:pointer;color:inherit;}
.hm-ycol:hover{border-color:rgba(255,255,255,.22);}
.hm-ycol.on{border-color:var(--hm-acc);background:rgba(46,107,230,.10);}
.hm-ycol b{font-family:var(--hm-num);font-size:12px;font-weight:600;}
.hm-ycol span{font-family:var(--hm-num);font-size:10.5px;color:var(--hm-ink2);}

/* ── rail rows ── */
.hm-row{display:flex;align-items:center;gap:9px;padding:7px 8px;margin:0 -8px;
  border-radius:8px;border:0;background:transparent;color:inherit;
  width:calc(100% + 16px);text-align:left;cursor:pointer;}
.hm-row:hover{background:rgba(255,255,255,.04);}
.hm-row .amt{margin-left:auto;font-family:var(--hm-num);font-size:12px;
  font-weight:600;flex-shrink:0;}
.hm-row .note{font-size:11px;color:var(--hm-ink3);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.hm-bar{height:6px;border-radius:3px;background:var(--hm-field);overflow:hidden;}
.hm-bar i{display:block;height:100%;border-radius:3px;background:#2E70BD;}
.hm-catrow{margin-bottom:10px;}
.hm-cattop{display:flex;align-items:baseline;gap:8px;margin-bottom:5px;}
.hm-cattop .nm{font-size:12px;font-weight:500;}
.hm-cattop .amt{margin-left:auto;font-family:var(--hm-num);font-size:12px;font-weight:600;}
.hm-cattop .pct{font-family:var(--hm-num);font-size:10.5px;color:var(--hm-ink3);
  min-width:28px;text-align:right;}
.hm-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--hm-tag);}

.hm-empty,.hm-loading,.hm-error{padding:44px 16px;text-align:center;
  font-size:12.5px;color:var(--hm-ink2);width:100%;}
.hm-error{color:#F09B9B;}

@media(max-width:1080px){
  .hm-scroll{flex-direction:column;}
  .hm-rail{width:100%;}
  .hm-kpis{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media(max-width:620px){
  .hm-kpis{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px 12px 0;}
  .hm-scroll{padding:12px;}
  .hm-months{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
}
</style>

<div class="hm-wrap">
  <div class="hm-kpis" id="hmKpis"></div>
  <div class="hm-scroll" id="hmScroll">
    <div class="hm-loading">Reading the year…</div>
  </div>
</div>

<script>
/* ═══ state ═══ */
var _hmYear = new Date().getFullYear();
var _hmData = null;
var _hmYearTotals = [];
var _hmActiveCat = 'all';
var _hmMonthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var _hmMonthFull  = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];
var _hmDow = ['S','M','T','W','T','F','S'];

/* ═══ helpers ═══ */
function hmFmt(n){
  n = Number(n) || 0;
  if(n >= 1e6) return '₨ ' + (n/1e6).toFixed(2) + 'M';
  if(n >= 1e3) return '₨ ' + Math.round(n/1e3) + 'K';
  return '₨ ' + Math.round(n).toLocaleString('en-IN');
}
function hmFmtFull(n){ return '₨ ' + Math.round(Number(n)||0).toLocaleString('en-IN'); }
function hmEsc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* quote a name safely for an inline onclick */
function hmQ(s){ return "'" + String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'") + "'"; }

/* the five magnitude steps, shared with the month ribbon */
function hmLevel(val, maxVal){
  if(!val || val <= 0 || maxVal <= 0) return 0;
  var r = val / maxVal;
  if(r <= .08) return 1;
  if(r <= .20) return 2;
  if(r <= .40) return 3;
  if(r <= .65) return 4;
  return 5;
}
function hmDayVal(dayData){
  if(!dayData) return 0;
  if(_hmActiveCat === 'all') return dayData.total || 0;
  return (dayData.cats && dayData.cats[_hmActiveCat]) || 0;
}
/* the monthly plan, when monthDetail has read a month */
function hmPlan(){
  try{
    if(typeof _mdBudget === 'undefined' || !_mdBudget) return 0;
    var t = 0;
    Object.keys(_mdBudget).forEach(function(k){ t += (_mdBudget[k] || 0); });
    return t;
  }catch(e){ return 0; }
}

/* the shell's stepper drives the year now (mdStep in monthDetail);
   kept as a thin alias so anything still calling it keeps working */
function hmNav(dir){
  if(typeof mdStep === 'function' && typeof _mdScope !== 'undefined' && _mdScope === 'year'){
    mdStep(dir); return;
  }
  _hmYear += dir;
  hmLoad();
}

/* ═══ load ═══ */
function hmLoad(){
  if(typeof mdSyncBar === 'function') mdSyncBar();
  document.getElementById('hmScroll').innerHTML =
    '<div class="hm-loading">Reading ' + _hmYear + '…</div>';
  document.getElementById('hmKpis').innerHTML = '';

  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.success){
        _hmData = res;
        var yrs = [];
        for(var y = _hmYear - 4; y <= _hmYear + 1; y++){ yrs.push(y); }
        google.script.run
          .withSuccessHandler(function(yrRes){
            if(yrRes && yrRes.success) _hmYearTotals = yrRes.totals;
            hmRender(res);
          })
          .withFailureHandler(function(){ hmRender(res); })
          .getExpenseYearTotals(yrs);
      } else {
        document.getElementById('hmScroll').innerHTML =
          '<div class="hm-error">⚠ ' + hmEsc(res ? res.error : 'Failed to read the year') + '</div>';
      }
    })
    .withFailureHandler(function(){
      document.getElementById('hmScroll').innerHTML =
        '<div class="hm-error">⚠ Could not reach the sheet.</div>';
    })
    .getExpenseHeatmapData(_hmYear);
}

/* ═══ render ═══ */
function hmRender(d){
  var data = d.data || {};
  var cats = d.categories || [];
  var monthTotals = d.monthlyTotals || [];
  var daysInMonths = d.daysInMonths || [];
  var now = new Date();
  var curMonth = now.getMonth(), curDate = now.getDate();
  var isThisYear = (_hmYear === now.getFullYear());

  /* ── one pass over the year: totals, peak day, per-category, per-day ── */
  var globalMax = 0, totalSpend = 0, activeDays = 0;
  var peakVal = 0, peakKey = '';
  var catTotals = {}, dayList = [];

  Object.keys(data).forEach(function(key){
    var v = hmDayVal(data[key]);
    if(v > globalMax) globalMax = v;
    var t = data[key].total || 0;
    if(t > 0){ totalSpend += t; activeDays++; dayList.push({key:key, val:t}); }
    if(t > peakVal){ peakVal = t; peakKey = key; }
    var dc = data[key].cats || {};
    Object.keys(dc).forEach(function(c){ catTotals[c] = (catTotals[c] || 0) + dc[c]; });
  });

  var activeMonths = 0;
  for(var mi = 0; mi < 12; mi++){ if(monthTotals[mi] > 0) activeMonths++; }
  var avgDay = activeDays > 0 ? totalSpend / activeDays : 0;
  var avgMonth = activeMonths > 0 ? totalSpend / activeMonths : 0;
  var plan = hmPlan();
  var overList = plan > 0
    ? monthTotals.map(function(t,i){ return t > plan ? _hmMonthNames[i] : null; }).filter(Boolean)
    : [];

  var best = -1, worst = -1;
  for(var bi = 0; bi < 12; bi++){
    if(monthTotals[bi] <= 0) continue;
    if(best < 0 || monthTotals[bi] < monthTotals[best]) best = bi;
    if(worst < 0 || monthTotals[bi] > monthTotals[worst]) worst = bi;
  }

  /* ── KPI strip ── */
  var kpis = [
    { lbl:'Total spent',     val:hmFmt(totalSpend),
      sub:activeDays + (activeDays === 1 ? ' day recorded' : ' days recorded') },
    { lbl:'Average / month', val:hmFmt(avgMonth),
      sub:plan > 0 ? 'plan ' + hmFmt(plan) : activeMonths + ' months with spend',
      dot:plan > 0 ? (avgMonth > plan ? 'crit' : 'good') : '' },
    { lbl:'Average / day',   val:hmFmt(avgDay), sub:'across the year' },
    { lbl:'Peak day',        val:hmFmt(peakVal),
      sub:peakKey ? hmDayLabel(peakKey) : '—', dot:peakVal > 0 ? 'tag' : '' },
    { lbl:'Quietest month',  val:best >= 0 ? _hmMonthFull[best] : '—',
      sub:best >= 0 ? hmFmt(monthTotals[best]) : 'no data', dot:best >= 0 ? 'good' : '' },
    plan > 0
      ? { lbl:'Months over plan', val:overList.length + ' of ' + activeMonths,
          sub:overList.slice(0,3).join(', ') || 'none over plan',
          dot:overList.length ? 'crit' : 'good' }
      : { lbl:'Heaviest month', val:worst >= 0 ? _hmMonthFull[worst] : '—',
          sub:worst >= 0 ? hmFmt(monthTotals[worst]) : 'no data', dot:worst >= 0 ? 'crit' : '' }
  ];
  var dotCol = { good:'var(--hm-good)', crit:'var(--hm-crit)',
                 warn:'var(--hm-warn)', tag:'var(--hm-tag)' };
  document.getElementById('hmKpis').innerHTML = kpis.map(function(k){
    return '<div class="hm-kpi">' +
      '<div class="hm-kpi-lbl">' + k.lbl + '</div>' +
      '<div class="hm-kpi-val">' + k.val + '</div>' +
      '<div class="hm-kpi-foot">' +
        (k.dot ? '<span class="hm-kpi-dot" style="background:' + dotCol[k.dot] + '"></span>' : '') +
        '<span class="hm-kpi-sub">' + hmEsc(k.sub) + '</span>' +
      '</div></div>';
  }).join('');

  /* ══ main column ══ */
  var h = '<div class="hm-main">';

  /* category filter */
  h += '<div class="hm-chips">';
  h += '<button type="button" class="hm-chip' + (_hmActiveCat === 'all' ? ' active' : '') +
       '" onclick="hmSetCat(\'all\')">All spending</button>';
  cats.forEach(function(c){
    h += '<button type="button" class="hm-chip' + (_hmActiveCat === c.name ? ' active' : '') +
      '" onclick="hmSetCat(' + hmEsc(hmQ(c.name)) + ')">' +
      '<i style="background:' + (c.color || '#2E70BD') + '"></i>' + hmEsc(c.name) + '</button>';
  });
  h += '</div>';

  /* legend + month cards */
  h += '<section>';
  h += '<div class="hm-eye"><h2>Daily spend' +
       (_hmActiveCat !== 'all' ? ' · ' + hmEsc(_hmActiveCat) : '') + '</h2>' +
       '<span class="hm-rule"></span>' +
       '<span class="hm-legend"><span class="t">No spend</span>' +
       '<span class="hm-cell"></span><span class="t" style="margin-left:4px">Low</span>' +
       '<span class="hm-cell l1"></span><span class="hm-cell l2"></span>' +
       '<span class="hm-cell l3"></span><span class="hm-cell l4"></span>' +
       '<span class="hm-cell l5"></span><span class="t">High</span></span></div>';

  h += '<div class="hm-months">';
  for(var m = 0; m < 12; m++){
    var dim = daysInMonths[m] || new Date(_hmYear, m + 1, 0).getDate();
    var lead = new Date(_hmYear, m, 1).getDay();
    var isNow = isThisYear && m === curMonth;

    h += '<div class="hm-mcard' + (isNow ? ' now' : '') + '" role="button" tabindex="0"' +
         ' onclick="mdOpenMonth(' + _hmYear + ',' + (m + 1) + ')"' +
         ' title="Open ' + _hmMonthFull[m] + ' ' + _hmYear + '">';
    h += '<div class="hm-mcard-hd"><span class="hm-mcard-nm">' + _hmMonthNames[m] + '</span>' +
         '<span class="hm-mcard-tot">' + hmFmt(monthTotals[m] || 0) + '</span></div>';

    h += '<div class="hm-grid" style="margin-bottom:4px">';
    for(var wd = 0; wd < 7; wd++) h += '<span class="hm-dow">' + _hmDow[wd] + '</span>';
    h += '</div>';

    h += '<div class="hm-grid">';
    for(var p = 0; p < lead; p++) h += '<span class="hm-cell"></span>';
    for(var day = 1; day <= dim; day++){
      var key = _hmYear + '-' + String(m + 1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      var val = hmDayVal(data[key]);
      var isToday = isThisYear && m === curMonth && day === curDate;
      var cls = 'hm-cell l' + hmLevel(val, globalMax) + (isToday ? ' today' : '');
      var when = day + ' ' + _hmMonthNames[m];
      if(val > 0){
        h += '<button type="button" class="' + cls + '"' +
             ' onclick="event.stopPropagation();mdOpenDay(' + _hmYear + ',' + (m + 1) + ',' + day + ')"' +
             ' title="' + when + ' — ' + hmFmtFull(val) + '"' +
             ' aria-label="' + when + ', ' + hmFmtFull(val) + '"></button>';
      } else {
        h += '<span class="' + cls + '" title="' + when + ' — nothing recorded"></span>';
      }
    }
    h += '</div></div>';
  }
  h += '</div></section>';

  /* month totals against plan */
  var peakMonth = Math.max.apply(null, monthTotals.concat([plan, 1]));
  h += '<section class="hm-card">';
  h += '<div class="hm-eye"><h2>Month totals' + (plan > 0 ? ' against plan' : '') + '</h2>' +
       '<span class="hm-rule"></span>' +
       '<span class="hm-key"><i style="background:#2E70BD"></i>' +
         (plan > 0 ? 'Within plan' : 'Spend') + '</span>' +
       (plan > 0
         ? '<span class="hm-key"><i style="background:var(--hm-crit)"></i>Over plan</span>' +
           '<span class="hm-key"><i class="line"></i>Plan</span>'
         : '') +
       '</div>';
  h += '<div class="hm-trend">';
  for(var t = 0; t < 12; t++){
    var mt = monthTotals[t] || 0;
    var over = plan > 0 && mt > plan;
    h += '<button type="button" class="hm-tcol"' +
         ' onclick="mdOpenMonth(' + _hmYear + ',' + (t + 1) + ')"' +
         ' title="' + _hmMonthFull[t] + ' — ' + hmFmtFull(mt) + '">' +
         '<span class="hm-tbox">' +
           '<span class="hm-tbar' + (over ? ' over' : '') + '" style="height:' +
             Math.round(mt / peakMonth * 78) + 'px"></span>' +
           (plan > 0 ? '<span class="hm-tplan" style="bottom:' +
             Math.round(plan / peakMonth * 78) + 'px"></span>' : '') +
         '</span>' +
         '<span class="hm-tlbl">' + _hmMonthNames[t] + '</span></button>';
  }
  h += '</div></section>';

  /* year strip */
  if(_hmYearTotals && _hmYearTotals.length){
    h += '<section class="hm-card">';
    h += '<div class="hm-eye"><h2>Across the years</h2><span class="hm-rule"></span></div>';
    h += '<div class="hm-years">';
    _hmYearTotals.forEach(function(yt){
      h += '<button type="button" class="hm-ycol' + (yt.year === _hmYear ? ' on' : '') +
        '" onclick="mdGoYear(' + yt.year + ')" title="Show ' + yt.year + '">' +
        '<b>' + yt.year + '</b><span>' + hmFmt(yt.total) + '</span></button>';
    });
    h += '</div></section>';
  }
  h += '</div>';

  /* ══ right rail ══ */
  h += '<aside class="hm-rail">';

  /* where it went */
  var catRows = Object.keys(catTotals).map(function(c){ return {name:c, val:catTotals[c]}; })
    .sort(function(a,b){ return b.val - a.val; }).slice(0, 7);
  var catPeak = catRows.length ? catRows[0].val : 1;
  h += '<div class="hm-card"><div class="hm-eye"><h2>Where it went</h2>' +
       '<span class="hm-rule"></span></div>';
  if(!catRows.length){
    h += '<div class="hm-empty" style="padding:16px 0">Nothing recorded this year.</div>';
  } else {
    catRows.forEach(function(c){
      var pct = totalSpend > 0 ? (c.val / totalSpend * 100) : 0;
      h += '<div class="hm-catrow"><div class="hm-cattop">' +
        '<span class="nm">' + hmEsc(c.name) + '</span>' +
        '<span class="amt">' + hmFmt(c.val) + '</span>' +
        '<span class="pct">' + pct.toFixed(0) + '%</span></div>' +
        '<div class="hm-bar"><i style="width:' + (c.val / catPeak * 100).toFixed(1) + '%"></i></div></div>';
    });
  }
  h += '</div>';

  /* heaviest days */
  dayList.sort(function(a,b){ return b.val - a.val; });
  var topDays = dayList.slice(0, 5);
  h += '<div class="hm-card"><div class="hm-eye"><h2>Heaviest days</h2>' +
       '<span class="hm-rule"></span></div>';
  if(!topDays.length){
    h += '<div class="hm-empty" style="padding:16px 0">No days recorded yet.</div>';
  } else {
    topDays.forEach(function(x){
      var pp = x.key.split('-');
      var mm = parseInt(pp[1],10), dd = parseInt(pp[2],10);
      h += '<button type="button" class="hm-row"' +
        ' onclick="mdOpenDay(' + _hmYear + ',' + mm + ',' + dd + ')">' +
        '<span class="hm-cell l' + hmLevel(x.val, globalMax) + '"></span>' +
        '<span style="font-size:12px;flex-shrink:0">' + dd + ' ' + _hmMonthNames[mm - 1] + '</span>' +
        '<span class="note">' + hmTopCat(x.key) + '</span>' +
        '<span class="amt">' + hmFmt(x.val) + '</span></button>';
    });
  }
  h += '</div>';

  /* major purchases this year */
  h += '<div class="hm-card"><div class="hm-eye"><h2>Major purchases ' + _hmYear + '</h2>' +
       '<span class="hm-rule"></span></div>' + hmMajorRows() + '</div>';

  h += '</aside>';

  document.getElementById('hmScroll').innerHTML = h;
}

/* the biggest category on one day, for the rail's note column */
function hmTopCat(key){
  var dc = (_hmData && _hmData.data[key] && _hmData.data[key].cats) || {};
  var best = '', bv = 0;
  Object.keys(dc).forEach(function(c){ if(dc[c] > bv){ bv = dc[c]; best = c; } });
  return hmEsc(best);
}

/* Major EXP items bought this year — the cross-link into the Major scope */
function hmMajorRows(){
  var pre = (typeof _analyzePreloadData !== 'undefined') && _analyzePreloadData.majorexp;
  if(!pre || !pre.success || !pre.data || !pre.data.length){
    return '<div class="hm-empty" style="padding:16px 0">Nothing tracked yet.</div>';
  }
  var rows = pre.data.filter(function(r){
    if(r.bought !== true || !r.boughtDate) return false;
    var dt = new Date(r.boughtDate);
    return !isNaN(dt.getTime()) && dt.getFullYear() === _hmYear;
  }).sort(function(a,b){ return (b.price||0) - (a.price||0); }).slice(0, 5);

  if(!rows.length){
    return '<div class="hm-empty" style="padding:16px 0">None bought in ' + _hmYear + '.</div>';
  }
  return rows.map(function(r){
    var dt = new Date(r.boughtDate);
    return '<button type="button" class="hm-row"' +
      ' onclick="mdSwitchScope(\'major\')" title="Open the Major scope">' +
      '<span class="hm-dot"></span>' +
      '<span style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        hmEsc(r.reference || 'Item') + '</span>' +
      '<span class="note" style="flex-shrink:0">' + _hmMonthNames[dt.getMonth()] + '</span>' +
      '<span class="amt">' + hmFmt(r.price) + '</span></button>';
  }).join('');
}

function hmSetCat(catName){
  _hmActiveCat = catName;
  if(_hmData) hmRender(_hmData);
}

function hmDayLabel(key){
  var p = key.split('-');
  return parseInt(p[2],10) + ' ' + _hmMonthNames[parseInt(p[1],10) - 1];
}

/* Auto-load disabled — the shell calls hmLoad() when the Year scope opens */
</script>

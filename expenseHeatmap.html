<!-- ═══════════════════════════════════════════════════════════════════
     EXPENSE HEATMAP — Full Year Financial Heatmap
     Each month as a separate block · Day-of-week aligned columns
═══════════════════════════════════════════════════════════════════ -->
<style>
:root {
  --hm-bg:   rgba(30, 41, 59, 0.35);
  --hm-bdr:  rgba(255, 255, 255, 0.07);
  --hm-dim:  #94a3b8;
  --hm-text: #f1f5f9;
  --hm-red:   #ef4444;
}

.hm-wrap{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--hm-text);
  width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;}

/* ── Header ── */
.hm-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;background:rgba(15,23,42,.5);backdrop-filter:blur(8px);}
.hm-hdr-l{display:flex;align-items:center;gap:10px;min-width:0;}
.hm-hdr-icon{font-size:1.3em;flex-shrink:0;}
.hm-hdr-title{font-size:.7em;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  background:linear-gradient(135deg,#6366f1,#06b6d4);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  white-space:nowrap;}
.hm-nav{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.hm-nav-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:8px;color:var(--hm-dim);width:30px;height:30px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:.72em;}
.hm-nav-btn:hover{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.18);}
.hm-nav-lbl{font-size:.65em;font-weight:700;color:rgba(255,255,255,.6);
  min-width:65px;text-align:center;letter-spacing:.3px;}

/* ── KPI Strip ── */
.hm-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:12px 18px 0;
  flex-shrink:0;}
.hm-kpi{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);
  border-radius:11px;padding:10px 11px;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);}
.hm-kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;pointer-events:none;}
.hm-kpi.k0::before{background:linear-gradient(90deg,#6366f1,#8b5cf6);}
.hm-kpi.k1::before{background:linear-gradient(90deg,#10b981,#34d399);}
.hm-kpi.k2::before{background:linear-gradient(90deg,#ef4444,#f97316);}
.hm-kpi.k3::before{background:linear-gradient(90deg,#06b6d4,#0ea5e9);}
.hm-kpi.k4::before{background:linear-gradient(90deg,#f59e0b,#fb923c);}
.hm-kpi.k5::before{background:linear-gradient(90deg,#ec4899,#f43f5e);}
.hm-kpi-val{font-size:1.2em;font-weight:900;letter-spacing:-.5px;line-height:1.2;}
.hm-kpi-lbl{font-size:.46em;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:rgba(255,255,255,.35);margin-top:2px;}

/* ── Scroll area ── */
.hm-scroll{flex:1;overflow-y:auto;padding:10px 18px 14px;
  scrollbar-width:none;-ms-overflow-style:none;}
.hm-scroll::-webkit-scrollbar{display:none;}

/* ── Glass card ── */
.hm-glass{background:var(--hm-bg);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border:1px solid var(--hm-bdr);
  border-radius:16px;margin-bottom:12px;padding:16px;
  box-shadow:0 8px 32px rgba(0,0,0,.2);position:relative;overflow:hidden;}
.hm-glass::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
  pointer-events:none;}

/* ── Section header ── */
.hm-sec-hdr{font-size:.55em;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:rgba(255,255,255,.25);margin:0 0 10px;display:flex;align-items:center;gap:10px;}
.hm-sec-hdr::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05);}

/* ── Category filter chips ── */
.hm-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.hm-chip{font-size:.5em;font-weight:700;padding:4px 10px;border-radius:12px;
  border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:all .15s;
  background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);letter-spacing:.3px;text-transform:uppercase;}
.hm-chip:hover{background:rgba(255,255,255,.08);color:#fff;}
.hm-chip.active{background:rgba(99,102,241,.2);border-color:#6366f1;color:#a5b4fc;box-shadow:0 0 12px rgba(99,102,241,.15);}
.hm-chip.all{background:rgba(99,102,241,.12);border-color:rgba(99,102,241,.25);color:#a5b4fc;}
.hm-chip.all.active{background:rgba(99,102,241,.25);border-color:#6366f1;color:#fff;}

/* ── Monthly bar chart ── */
.hm-month-bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;padding:4px 0;}
.hm-mbar-col{display:flex;flex-direction:column;align-items:center;gap:3px;}
.hm-mbar-bar-wrap{width:100%;height:50px;border-radius:4px;
  background:rgba(255,255,255,.03);position:relative;overflow:hidden;display:flex;align-items:flex-end;}
.hm-mbar-bar{width:100%;border-radius:3px 3px 0 0;min-height:2px;
  transition:height .6s ease;position:relative;}
.hm-mbar-lbl{font-size:.42em;font-weight:600;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:.3px;}
.hm-mbar-val{font-size:.38em;font-weight:700;color:rgba(255,255,255,.4);margin-top:-1px;}

/* ── LEGEND ── */
.hm-legend{display:flex;align-items:center;gap:8px;padding:6px 0 2px;flex-wrap:wrap;}
.hm-leg-lbl{font-size:.45em;font-weight:600;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:.6px;}
.hm-leg-strip{display:flex;gap:3px;align-items:center;}
.hm-leg-dot{width:16px;height:16px;border-radius:3px;border:1px solid rgba(255,255,255,.08);}
.hm-leg-note{font-size:.42em;color:rgba(255,255,255,.15);margin-left:4px;}

/* ── MONTHLY CALENDAR BLOCKS ── */
.hm-months{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}

/* Each month is a separate card */
.hm-month-card{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);
  border-radius:14px;padding:12px 10px 10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);position:relative;overflow:hidden;}
.hm-month-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  pointer-events:none;}
.hm-month-card::after{content:'';position:absolute;right:-20px;bottom:-20px;
  width:60px;height:60px;border-radius:50%;filter:blur(30px);opacity:.1;pointer-events:none;}
/* Each month gets a distinct colored accent */
.hm-month-card.m0::before{background:linear-gradient(90deg,#6366f1,#8b5cf6);}
.hm-month-card.m1::before{background:linear-gradient(90deg,#f59e0b,#fb923c);}
.hm-month-card.m2::before{background:linear-gradient(90deg,#10b981,#34d399);}
.hm-month-card.m3::before{background:linear-gradient(90deg,#06b6d4,#0ea5e9);}
.hm-month-card.m4::before{background:linear-gradient(90deg,#ec4899,#f43f5e);}
.hm-month-card.m5::before{background:linear-gradient(90deg,#8b5cf6,#a855f7);}
.hm-month-card.m6::before{background:linear-gradient(90deg,#f97316,#f59e0b);}
.hm-month-card.m7::before{background:linear-gradient(90deg,#14b8a6,#2dd4bf);}
.hm-month-card.m8::before{background:linear-gradient(90deg,#e11d48,#fb7185);}
.hm-month-card.m9::before{background:linear-gradient(90deg,#6366f1,#818cf8);}
.hm-month-card.m10::before{background:linear-gradient(90deg,#d946ef,#e879f9);}
.hm-month-card.m11::before{background:linear-gradient(90deg,#0ea5e9,#38bdf8);}

/* Month header inside card */
.hm-month-hdr{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;padding:0 2px;}
.hm-month-name{font-size:.58em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,255,255,.7);}
.hm-month-total{font-size:.5em;font-weight:700;color:var(--hm-dim);}

/* Day-of-week row */
.hm-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;
  margin-bottom:3px;padding:0 2px;}
.hm-weekday{font-size:.4em;font-weight:700;text-transform:uppercase;
  color:rgba(255,255,255,.18);text-align:center;letter-spacing:.5px;}

/* Calendar grid — 7 columns for days */
.hm-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}

/* Each day cell */
.hm-day-wrap{position:relative;width:100%;padding-bottom:100%;}
.hm-day{position:absolute;inset:0;border-radius:5px;display:flex;align-items:center;
  justify-content:center;font-size:.5em;font-weight:700;transition:all .15s;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
  color:rgba(255,255,255,.2);cursor:default;
  flex-direction:column;gap:1px;line-height:1;}
.hm-day:hover{transform:scale(1.2);z-index:5;border-color:rgba(255,255,255,.3);}
.hm-day .hm-day-num{font-size:1em;font-weight:800;line-height:1;}
.hm-day .hm-day-amt{font-size:.55em;font-weight:600;opacity:.7;line-height:1;}

/* Today */
.hm-day.today{border-color:rgba(99,102,241,.7) !important;
  box-shadow:0 0 10px rgba(99,102,241,.3),inset 0 0 10px rgba(99,102,241,.08) !important;}
.hm-day.today .hm-day-num{color:#a5b4fc !important;}

/* Empty cells (days beyond month) */
.hm-day.empty{background:transparent !important;border-color:transparent !important;cursor:default;}
.hm-day.empty:hover{transform:none;}

/* Intensity levels — GREEN→AMBER→RED */
.hm-day.l0{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.06);color:rgba(255,255,255,.2);}
.hm-day.l0 .hm-day-amt{color:transparent;}
.hm-day.l1{background:rgba(16,185,129,.14);border-color:rgba(16,185,129,.18);color:rgba(16,185,129,.9);}
.hm-day.l2{background:rgba(245,158,11,.16);border-color:rgba(245,158,11,.22);color:#fbbf24;}
.hm-day.l3{background:rgba(249,115,22,.2);border-color:rgba(249,115,22,.28);color:#fb923c;}
.hm-day.l4{background:rgba(239,68,68,.26);border-color:rgba(239,68,68,.34);color:#fca5a5;}
.hm-day.l5{background:rgba(185,28,28,.38);border-color:rgba(185,28,28,.48);color:#fecaca;
  box-shadow:inset 0 0 12px rgba(185,28,28,.12);}
/* Active spend cells show amount */
.hm-day.has-spend{cursor:pointer;}
.hm-day.has-spend .hm-day-amt{display:block;}
.hm-day .hm-day-amt{display:none;}

/* ── Day detail popup (inside glass card at bottom) ── */
.hm-detail{display:none;margin-top:14px;padding:14px;border-radius:12px;
  background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.06);}
.hm-detail.open{display:block;animation:fadeUp .2s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.hm-detail-date{font-size:.62em;font-weight:700;color:rgba(255,255,255,.65);margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase;}
.hm-detail-total{font-size:1em;font-weight:800;margin-bottom:10px;}
.hm-detail-cats{display:flex;flex-direction:column;gap:4px;}
.hm-detail-cat{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:7px;
  font-size:.58em;font-weight:600;background:rgba(255,255,255,.025);}
.hm-detail-cat-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.hm-detail-cat-name{color:rgba(255,255,255,.55);flex:1;}
.hm-detail-cat-amt{font-weight:700;color:rgba(255,255,255,.85);}

/* ── Loading / Error ── */
.hm-loading{text-align:center;padding:40px 16px;color:var(--hm-dim);font-size:.72em;}
.hm-error{text-align:center;padding:40px 16px;color:var(--hm-red);font-size:.72em;}

/* ── Empty state ── */
.hm-empty{text-align:center;padding:30px 16px;}
.hm-empty-icon{font-size:2.5em;margin-bottom:8px;opacity:.4;}
.hm-empty-text{font-size:.7em;color:var(--hm-dim);}

/* ── Legend colors for dots ── */
.hm-leg-dot.l0{background:rgba(255,255,255,.03);}
.hm-leg-dot.l1{background:rgba(16,185,129,.14);}
.hm-leg-dot.l2{background:rgba(245,158,11,.16);}
.hm-leg-dot.l3{background:rgba(249,115,22,.2);}
.hm-leg-dot.l4{background:rgba(239,68,68,.26);}
.hm-leg-dot.l5{background:rgba(185,28,28,.38);}

/* ── Responsive ── */
@media(max-width:1024px){
  .hm-months{grid-template-columns:repeat(2,1fr);gap:12px;}
}
@media(max-width:760px){
  .hm-months{grid-template-columns:repeat(2,1fr);gap:10px;}
  .hm-month-card{padding:10px 8px 8px;border-radius:12px;}
  .hm-day{border-radius:4px;font-size:.45em;}
}
@media(max-width:640px){
  .hm-scroll{padding:6px 10px 8px;}
  .hm-glass{padding:10px;border-radius:12px;margin-bottom:8px;}
  .hm-hdr{padding:10px 12px;}
  .hm-hdr-title{font-size:.6em;}
  .hm-kpis{grid-template-columns:repeat(3,1fr);padding:8px 10px 0;gap:6px;}
  .hm-kpi-val{font-size:1em;}
  .hm-kpi{padding:8px 9px;}
  .hm-months{grid-template-columns:repeat(2,1fr);gap:8px;}
  .hm-month-card{padding:8px 6px 6px;border-radius:10px;}
  .hm-month-name{font-size:.5em;}
  .hm-weekday{font-size:.35em;}
  .hm-day{border-radius:3px;font-size:.4em;}
  .hm-day .hm-day-amt{display:none !important;}
  .hm-mbar-bar-wrap{height:36px;}
}
@media(max-width:430px){
  .hm-months{grid-template-columns:repeat(1,1fr);gap:8px;}
  .hm-kpis{grid-template-columns:repeat(2,1fr);}
  .hm-kpi-val{font-size:.85em;}
  .hm-kpi-lbl{font-size:.4em;}
  .hm-day{font-size:.5em;border-radius:4px;}
  .hm-nav-btn{width:26px;height:26px;font-size:.65em;}
  .hm-nav-lbl{min-width:52px;font-size:.5em;}
}
</style>

<div class="hm-wrap">
  <div class="hm-hdr">
    <div class="hm-hdr-l">
      <span class="hm-hdr-icon">🔥</span>
      <span class="hm-hdr-title">Expense Heatmap</span>
    </div>
    <div class="hm-nav">
      <button class="hm-nav-btn" onclick="hmNav(-1)">◀</button>
      <span class="hm-nav-lbl" id="hmYearLbl">—</span>
      <button class="hm-nav-btn" onclick="hmNav(1)">▶</button>
    </div>
  </div>

  <div class="hm-kpis" id="hmKpis">
    <div class="hm-kpi k0"><div class="hm-kpi-val" id="hmKpiTotal" style="color:#a5b4fc;">—</div><div class="hm-kpi-lbl">💰 Total</div></div>
    <div class="hm-kpi k1"><div class="hm-kpi-val" id="hmKpiBest" style="color:#34d399;">—</div><div class="hm-kpi-lbl">📈 Best Month</div></div>
    <div class="hm-kpi k2"><div class="hm-kpi-val" id="hmKpiWorst" style="color:#f87171;">—</div><div class="hm-kpi-lbl">📉 Worst Month</div></div>
    <div class="hm-kpi k3"><div class="hm-kpi-val" id="hmKpiAvg" style="color:#22d3ee;">—</div><div class="hm-kpi-lbl">📊 Avg/Day</div></div>
    <div class="hm-kpi k4"><div class="hm-kpi-val" id="hmKpiPeak" style="color:#fbbf24;">—</div><div class="hm-kpi-lbl">⚡ Peak Day</div></div>
    <div class="hm-kpi k5"><div class="hm-kpi-val" id="hmKpiAvgMo" style="color:#f472b6;">—</div><div class="hm-kpi-lbl">📅 Avg/Month</div></div>
  </div>

  <div class="hm-scroll" id="hmScroll">
    <div class="hm-loading">
      <div style="font-size:2em;margin-bottom:8px;">🔥</div>
      Loading heatmap…
    </div>
  </div>
</div>

<script>
/* ── State ── */
var _hmYear = new Date().getFullYear();
var _hmData = null;
var _hmActiveCat = 'all';
var _hmMonthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var _hmWeekdays = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

/* ── Format ── */
function hmFmt(n){
  if(n === undefined || n === null || isNaN(n)) return '—';
  if(n >= 100000) return '₨ ' + Math.round(n/1000) + 'k';
  if(n >= 1000) return '₨ ' + Math.round(n).toLocaleString();
  return '₨ ' + Math.round(n);
}
function hmFmtFull(n){
  if(n === undefined || n === null || isNaN(n)) return '—';
  return '₨ ' + Math.round(n).toLocaleString();
}

/* ── Navigation ── */
function hmNav(dir){
  _hmYear += dir;
  hmLoad();
}

/* ── Load ── */
function hmLoad(){
  document.getElementById('hmYearLbl').textContent = _hmYear;
  document.getElementById('hmScroll').innerHTML =
    '<div class="hm-loading"><div style="font-size:2em;margin-bottom:8px;">🔥</div>Loading heatmap…</div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.success){
        _hmData = res;
        hmRender(res);
      } else {
        document.getElementById('hmScroll').innerHTML =
          '<div class="hm-error">⚠ '+(res?res.error:'Failed')+'</div>';
      }
    })
    .withFailureHandler(function(){
      document.getElementById('hmScroll').innerHTML =
        '<div class="hm-error">⚠ Error loading data</div>';
    })
    .getExpenseHeatmapData(_hmYear);
}

/* ── Intensity level (0-5) ── */
function hmLevel(val, maxVal){
  if(!val || val <= 0) return 0;
  if(maxVal <= 0) return 0;
  var r = val / maxVal;
  if(r <= 0.08) return 1;
  if(r <= 0.2)  return 2;
  if(r <= 0.4)  return 3;
  if(r <= 0.65) return 4;
  return 5;
}

/* ── Day value by filter ── */
function hmDayVal(dayData){
  if(!dayData) return 0;
  if(_hmActiveCat === 'all') return dayData.total || 0;
  return (dayData.cats && dayData.cats[_hmActiveCat]) || 0;
}

/* ── Render ── */
function hmRender(d){
  var data = d.data || {};
  var cats = d.categories || [];
  var monthTotals = d.monthlyTotals || [];
  var daysInMonths = d.daysInMonths || [];
  var yearTotal = d.yearTotal || 0;
  var curMonth = new Date().getMonth();
  var curDate = new Date().getDate();

  // Stats — only consider months that have expense data
  var activeMonthCount = 0;
  for(var mi = 0; mi < 12; mi++){
    if(monthTotals[mi] > 0) activeMonthCount++;
  }
  var totalDays = 0, totalSpend = 0, maxDayVal = 0, maxDayKey = '';
  for(var key in data){
    var dv = data[key].total || 0;
    totalSpend += dv; totalDays++;
    if(dv > maxDayVal){ maxDayVal = dv; maxDayKey = key; }
  }
  var avgDay = totalDays > 0 ? totalSpend / totalDays : 0;

  // Best month = LOWEST expense, Worst month = HIGHEST expense
  var bestMoVal = Infinity, bestMoI = 0, worstMoVal = -1, worstMoI = 0;
  for(var mi = 0; mi < 12; mi++){
    var mt = monthTotals[mi];
    if(mt > 0){
      if(mt < bestMoVal){ bestMoVal = mt; bestMoI = mi; }
      if(mt > worstMoVal){ worstMoVal = mt; worstMoI = mi; }
    }
  }
  if(bestMoVal === Infinity) bestMoVal = 0;
  if(worstMoVal <= 0) worstMoVal = 0;

  // Global max for scaling
  var globalMax = 0;
  for(var k in data){ var v = hmDayVal(data[k]); if(v > globalMax) globalMax = v; }
  if(globalMax <= 0) globalMax = 1;

  // KPIs
  document.getElementById('hmKpiTotal').textContent = hmFmtFull(yearTotal);
  document.getElementById('hmKpiBest').textContent = _hmMonthNames[bestMoI] + ' ' + hmFmtFull(bestMoVal);
  document.getElementById('hmKpiWorst').textContent = _hmMonthNames[worstMoI] + ' ' + hmFmtFull(worstMoVal);
  document.getElementById('hmKpiAvg').textContent = hmFmtFull(avgDay);
  document.getElementById('hmKpiPeak').textContent = maxDayKey ? hmFmtFull(maxDayVal) + ' (' + maxDayKey.slice(5) + ')' : '—';
  document.getElementById('hmKpiAvgMo').textContent = hmFmtFull(activeMonthCount > 0 ? yearTotal / activeMonthCount : 0);

  var html = '';

  // ── Category chips ──
  html += '<div class="hm-glass"><div class="hm-sec-hdr"><span>🎯</span>Filter Category</div><div class="hm-chips">';
  html += '<span class="hm-chip all ' + (_hmActiveCat === 'all' ? 'active' : '') + '" onclick="hmSetCat(\'all\')">📊 All</span>';
  cats.forEach(function(c){
    html += '<span class="hm-chip ' + (_hmActiveCat === c.name ? 'active' : '') + '" style="' + (_hmActiveCat === c.name ? 'border-color:' + c.color : '') + '" onclick="hmSetCat(\'' + c.name.replace(/'/g,"\\'") + '\')"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + c.color + ';margin-right:5px;vertical-align:middle;"></span>' + c.name + '</span>';
  });
  html += '</div></div>';

  // ── Monthly bar chart ──
  var maxMonth = 1;
  monthTotals.forEach(function(mt){ if(mt > maxMonth) maxMonth = mt; });
  html += '<div class="hm-glass"><div class="hm-sec-hdr"><span>📊</span>Monthly Totals</div><div class="hm-month-bars">';
  monthTotals.forEach(function(mt, i){
    var pct = maxMonth > 0 ? Math.max(2, (mt / maxMonth) * 100) : 2;
    var barColor = (i === bestMoI) ? '#34d399' : (i === worstMoI) ? '#f87171' : '#6366f1';
    html += '<div class="hm-mbar-col"><div class="hm-mbar-bar-wrap"><div class="hm-mbar-bar" style="height:' + pct + '%;background:' + barColor + ';box-shadow:0 0 8px ' + barColor + '40;"></div></div><div class="hm-mbar-lbl">' + _hmMonthNames[i] + '</div><div class="hm-mbar-val">' + hmFmt(mt) + '</div></div>';
  });
  html += '</div></div>';

  // ── Legend ──
  html += '<div class="hm-glass"><div class="hm-sec-hdr"><span>🗺️</span>' + _hmYear + ' Daily Spend' + (_hmActiveCat !== 'all' ? ' — ' + _hmActiveCat : '') + '</div>';
  html += '<div class="hm-legend"><span class="hm-leg-lbl">Low</span><div class="hm-leg-strip">';
  for(var li = 0; li <= 5; li++){
    html += '<div class="hm-leg-dot l' + li + '"></div>';
  }
  html += '</div><span class="hm-leg-lbl">High</span>';
  html += '<span class="hm-leg-note">· Max: ' + hmFmtFull(globalMax) + '</span></div>';

  // ── Month blocks ──
  html += '<div class="hm-months">';

  for(var m = 0; m < 12; m++){
    var dim = daysInMonths[m];        // days in month
    var firstDay = new Date(_hmYear, m, 1).getDay(); // 0=Sun
    // Convert Sun(0)→6, Mon(1)→0, Tue(2)→1, etc.
    var startOffset = (firstDay === 0) ? 6 : firstDay - 1;

    html += '<div class="hm-month-card m' + m + '">';
    html += '<div class="hm-month-hdr"><span class="hm-month-name">' + _hmMonthNames[m] + '</span><span class="hm-month-total">' + hmFmt(monthTotals[m]) + '</span></div>';

    // Weekday headers
    html += '<div class="hm-weekdays">';
    for(var wd = 0; wd < 7; wd++){
      html += '<div class="hm-weekday">' + _hmWeekdays[wd].charAt(0) + '</div>';
    }
    html += '</div>';

    // Calendar grid
    html += '<div class="hm-cal-grid">';

    // Empty cells before first day
    for(var pad = 0; pad < startOffset; pad++){
      html += '<div class="hm-day-wrap"><div class="hm-day empty"></div></div>';
    }

    // Actual days
    for(var day = 1; day <= dim; day++){
      var key = _hmYear + '-' + String(m+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      var dayData = data[key];
      var val = hmDayVal(dayData);
      var level = hmLevel(val, globalMax);
      var hasSpend = val > 0;
      var isToday = (m === curMonth && day === curDate && _hmYear === new Date().getFullYear());

      var cls = 'hm-day';
      if(hasSpend) cls += ' has-spend';
      if(isToday) cls += ' today';
      if(level > 0) cls += ' l' + level;

      html += '<div class="hm-day-wrap">';
      html += '<div class="' + cls + '"' + (hasSpend ? ' onclick="hmShowDay(\'' + key + '\')"' : '') + ' title="' + _hmMonthNames[m] + ' ' + day + ': ' + hmFmtFull(val) + '">';
      html += '<span class="hm-day-num">' + day + '</span>';
      if(hasSpend) html += '<span class="hm-day-amt">' + hmFmt(val) + '</span>';
      html += '</div></div>';
    }

    html += '</div>'; // cal-grid
    html += '</div>'; // month-card
  }

  html += '</div>'; // months

  // Day detail
  html += '<div class="hm-detail" id="hmDetail"></div>';
  html += '</div>'; // glass

  document.getElementById('hmScroll').innerHTML = html;
}

/* ── Category filter ── */
function hmSetCat(catName){
  _hmActiveCat = catName;
  if(_hmData) hmRender(_hmData);
}

/* ── Day detail ── */
function hmShowDay(dateKey){
  var el = document.getElementById('hmDetail');
  if(!el) return;
  var d = _hmData ? _hmData.data[dateKey] : null;
  if(!d || !d.total){ el.classList.remove('open'); return; }

  var p = dateKey.split('-');
  var label = _hmMonthNames[parseInt(p[1],10)-1] + ' ' + parseInt(p[2],10) + ', ' + p[0];

  var html = '<div class="hm-detail-date">📅 ' + label + '</div>';
  html += '<div class="hm-detail-total" style="color:#a5b4fc;">Total: ' + hmFmtFull(d.total) + '</div>';

  if(d.cats && Object.keys(d.cats).length > 0){
    html += '<div class="hm-detail-cats">';
    var sorted = Object.keys(d.cats).sort(function(a,b){ return d.cats[b] - d.cats[a]; });
    sorted.forEach(function(cn){
      var ci = (_hmData.categories||[]).find(function(c){ return c.name === cn; });
      var color = ci ? ci.color : '#94a3b8';
      var amt = d.cats[cn];
      var pct = d.total > 0 ? ((amt/d.total)*100).toFixed(1) : 0;
      html += '<div class="hm-detail-cat"><span class="hm-detail-cat-dot" style="background:' + color + ';"></span><span class="hm-detail-cat-name">' + cn + '</span><span class="hm-detail-cat-amt">' + hmFmtFull(amt) + ' <span style="font-weight:400;color:rgba(255,255,255,.3);font-size:.82em;">(' + pct + '%)</span></span></div>';
    });
    html += '</div>';
  }

  el.innerHTML = html;
  el.classList.add('open');
}

/* ── Init ── */
hmLoad();
</script>

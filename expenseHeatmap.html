<!-- ═══════════════════════════════════════════════════════════════════
     EXPENSE HEATMAP — the Year scope of the month workspace
     ─────────────────────────────────────────────────────────────
     Lives inside monthDetail's #md-panel, so it wears that panel's
     tokens and carries no chrome of its own: the shell supplies the
     command bar, the year stepper and the budget drawer.

     Colour does one job here. The four GitHub contribution greens carry
     magnitude (each day ranked against the year's other spend days, in
     quarters; the same greens the month calendar uses), and the only other
     hues are status (over / under plan, always with a word beside
     them) and one purple that means "a Major EXP item" and nothing
     else. The old per-month gradient accents are gone: they coloured
     by identity what the cells already encode as magnitude.

     Talks to the shell through four calls only:
       mdOpenMonth(y, m)      a month card or bar
       mdOpenDay(y, m, d)     a day cell
       mdGoYear(y)            a year bar
       mdSwitchScope('major') a Major EXP row in the rail
     and reads _mdBudget (monthDetail's live control plan) to draw the
     plan line, when a month has been read.
═══════════════════════════════════════════════════════════════════ -->
<style>
.yrs-wrap{
  /* the expense page's glass surfaces and indigo accent */
  --yrs-pane:rgba(255,255,255,.04); --yrs-field:rgba(255,255,255,.03);
  --yrs-line:rgba(255,255,255,.08); --yrs-line2:rgba(255,255,255,.13);
  --yrs-ink:#fff; --yrs-ink2:rgba(255,255,255,.7); --yrs-ink3:rgba(255,255,255,.42);
  --yrs-acc:#6366f1;
  --yrs-good:#10b981; --yrs-warn:#f59e0b; --yrs-crit:#ef4444; --yrs-tag:#8b5cf6;
  --yrs-num:'Inter',system-ui,-apple-system,sans-serif;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  color:var(--yrs-ink);width:100%;height:100%;
  display:flex;flex-direction:column;overflow:hidden;background:transparent;
}
.yrs-wrap *{box-sizing:border-box;}
.yrs-wrap button{font-family:inherit;}

/* ── KPI strip ── */
.yrs-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;
  padding:16px 18px 0;flex-shrink:0;}
.yrs-kpi{padding:12px 13px;border-radius:14px;background:var(--yrs-pane);
  border:1px solid var(--yrs-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  position:relative;overflow:hidden;}
.yrs-kpi::before,.yrs-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#6366f1,#8b5cf6);}
.yrs-kpi-lbl{font-size:9.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--yrs-ink3);margin-bottom:7px;}
.yrs-kpi-val{font-family:var(--yrs-num);font-size:19px;font-weight:700;letter-spacing:-.6px;
  line-height:1;font-variant-numeric:tabular-nums;}
.yrs-kpi-foot{display:flex;align-items:center;gap:5px;margin-top:6px;}
.yrs-kpi-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.yrs-kpi-sub{font-size:11px;color:var(--yrs-ink2);}

/* ── body: main + rail ── */
.yrs-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 18px;
  display:flex;gap:16px;align-items:flex-start;}
.yrs-scroll::-webkit-scrollbar{width:6px;}
.yrs-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;}
.yrs-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;}
.yrs-rail{width:322px;flex-shrink:0;display:flex;flex-direction:column;gap:12px;}

.yrs-card{padding:14px 15px;border-radius:16px;background:var(--yrs-pane);
  border:1px solid var(--yrs-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  position:relative;overflow:hidden;}
.yrs-eye{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap;}
.yrs-eye h2{margin:0;font-size:11px;font-weight:600;letter-spacing:1px;line-height:1.2;
  text-transform:uppercase;color:rgba(255,255,255,.45);padding-left:8px;border-left:3px solid #6366f1;}
.yrs-rule{flex:1;height:1px;background:var(--yrs-line);min-width:12px;}

/* ── category chips ── */
.yrs-chips{display:flex;flex-wrap:wrap;gap:6px;}
.yrs-chip{padding:5px 11px;border-radius:999px;border:1px solid var(--yrs-line2);
  background:var(--yrs-pane);color:var(--yrs-ink2);font-size:11.5px;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.yrs-chip:hover{color:var(--yrs-ink);border-color:rgba(255,255,255,.24);}
.yrs-chip.active{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-color:transparent;color:#fff;
  box-shadow:0 0 12px rgba(99,102,241,.4);}
.yrs-chip i{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

/* ── the scale: four GitHub greens, lightest quarter → heaviest;
   each cell's colour is set inline by hmHeat() ── */
.yrs-cell{width:18px;height:18px;border-radius:4px;background:#161b22;
  border:0;padding:0;display:block;position:static;flex:none;}
button.yrs-cell{cursor:pointer;}
button.yrs-cell:hover{outline:2px solid #fff;outline-offset:1px;}
.yrs-cell.today{box-shadow:0 0 0 2px #060b18,0 0 0 3.5px var(--yrs-ink);}

.yrs-legend{display:flex;align-items:center;gap:6px;}
.yrs-legend span.t{font-size:10.5px;color:var(--yrs-ink3);}
.yrs-legend .yrs-cell{width:13px;height:13px;}
.yrs-legend .st{display:flex;gap:3px;}
.yrs-legend .st i{width:13px;height:13px;border-radius:3px;}

/* ── hover card — lives on <body> so no glass ancestor can clip it ── */
.yrs-tip{position:fixed;z-index:9700;pointer-events:none;width:260px;max-width:calc(100vw - 16px);
  padding:11px 13px;border-radius:12px;background:rgba(10,15,30,.95);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 36px rgba(0,0,0,.6);
  font-family:'Inter',system-ui,sans-serif;color:#fff;opacity:0;transition:opacity .12s;}
.yrs-tip.on{opacity:1;}
.yrs-tip .d{font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#a5b4fc;}
.yrs-tip .t{font-size:22px;font-weight:800;letter-spacing:-.6px;margin:3px 0 2px;font-variant-numeric:tabular-nums;}
.yrs-tip .s{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:8px;}
.yrs-tip .it{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid rgba(255,255,255,.07);font-size:12px;}
.yrs-tip .it i{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.yrs-tip .it .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.yrs-tip .it .x small{color:rgba(255,255,255,.45);margin-left:5px;font-size:10.5px;}
.yrs-tip .it b{font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0;}
.yrs-tip .more{font-size:11px;color:rgba(255,255,255,.45);padding-top:5px;}

/* ── month cards ── */
.yrs-months{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px;}
.yrs-mcard{padding:12px;border-radius:14px;background:var(--yrs-pane);
  border:1px solid var(--yrs-line);color:inherit;cursor:pointer;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
.yrs-mcard:hover{background:rgba(255,255,255,.06);border-color:rgba(99,102,241,.38);}
.yrs-mcard.now{border-color:var(--yrs-acc);}
.yrs-mcard-hd{display:flex;align-items:baseline;gap:6px;margin-bottom:9px;}
.yrs-mcard-nm{font-size:12.5px;font-weight:600;}
.yrs-mcard-tot{margin-left:auto;font-family:var(--yrs-num);font-size:11px;color:var(--yrs-ink2);}
.yrs-grid{display:grid;grid-template-columns:repeat(7,18px);
  grid-auto-rows:18px;gap:3px;justify-content:center;}
.yrs-dow{font-size:8.5px;text-align:center;color:var(--yrs-ink3);line-height:1;}

/* ── month totals against plan ── */
.yrs-trend{display:flex;align-items:flex-end;gap:10px;height:104px;}
.yrs-tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;border:0;background:transparent;padding:0;}
.yrs-tcol:hover .yrs-tbar{filter:brightness(1.3);}
.yrs-tbox{position:relative;width:100%;height:78px;display:flex;align-items:flex-end;}
.yrs-tbar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#8b5cf6,#6366f1);min-height:2px;}
.yrs-tbar.over{background:var(--yrs-crit);}
.yrs-tplan{position:absolute;left:0;right:0;height:2px;background:var(--yrs-ink2);border-radius:1px;}
.yrs-tlbl{font-size:9.5px;color:var(--yrs-ink3);}
.yrs-key{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--yrs-ink2);}
.yrs-key i{width:9px;height:9px;border-radius:2px;}
.yrs-key i.line{width:14px;height:2px;border-radius:1px;background:var(--yrs-ink2);}

/* ── year strip ── */
.yrs-years{display:flex;gap:8px;}
.yrs-ycol{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:8px 4px;border-radius:10px;border:1px solid var(--yrs-line);
  background:var(--yrs-field);cursor:pointer;color:inherit;}
.yrs-ycol:hover{border-color:rgba(255,255,255,.22);}
.yrs-ycol.on{border-color:var(--yrs-acc);background:rgba(99,102,241,.14);}
.yrs-ycol b{font-family:var(--yrs-num);font-size:12px;font-weight:600;}
.yrs-ycol span{font-family:var(--yrs-num);font-size:10.5px;color:var(--yrs-ink2);}

/* ── rail rows ── */
.yrs-row{display:flex;align-items:center;gap:9px;padding:7px 8px;margin:0 -8px;
  border-radius:8px;border:0;background:transparent;color:inherit;
  width:calc(100% + 16px);text-align:left;cursor:pointer;}
.yrs-row:hover{background:rgba(255,255,255,.04);}
.yrs-row .amt{margin-left:auto;font-family:var(--yrs-num);font-size:12px;
  font-weight:600;flex-shrink:0;}
.yrs-row .note{font-size:11px;color:var(--yrs-ink3);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.yrs-bar{height:6px;border-radius:3px;background:var(--yrs-field);overflow:hidden;}
.yrs-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#6366f1,#8b5cf6);}
.yrs-catrow{margin-bottom:10px;}
.yrs-cattop{display:flex;align-items:baseline;gap:8px;margin-bottom:5px;}
.yrs-cattop .nm{font-size:12px;font-weight:500;}
.yrs-cattop .amt{margin-left:auto;font-family:var(--yrs-num);font-size:12px;font-weight:600;}
.yrs-cattop .pct{font-family:var(--yrs-num);font-size:10.5px;color:var(--yrs-ink3);
  min-width:28px;text-align:right;}
.yrs-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--yrs-tag);}

.yrs-empty,.yrs-loading,.yrs-error{padding:44px 16px;text-align:center;
  font-size:12.5px;color:var(--yrs-ink2);width:100%;}
.yrs-error{color:#fca5a5;}

@media(max-width:1080px){
  .yrs-scroll{flex-direction:column;}
  .yrs-rail{width:100%;}
  .yrs-kpis{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media(max-width:620px){
  .yrs-kpis{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px 12px 0;}
  .yrs-scroll{padding:12px;}
  .yrs-months{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
}
</style>

<div class="yrs-wrap">
  <div class="yrs-kpis" id="hmKpis"></div>
  <div class="yrs-scroll" id="hmScroll">
    <div class="yrs-loading">Reading the year…</div>
  </div>
</div>

<script>
/* ═══ state ═══ */
var _hmYear = new Date().getFullYear();
var _hmData = null;
var _hmYearTotals = [];
var _hmActiveCat = 'all';
var _hmMonthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var _hmMonthFull  = ['January','February','March','April','May','June',
                     'July','August','September','October','November','December'];
var _hmDow = ['S','M','T','W','T','F','S'];

/* ═══ helpers ═══ */
function hmFmt(n){
  n = Number(n) || 0;
  if(n >= 1e6) return '₨ ' + (n/1e6).toFixed(2) + 'M';
  if(n >= 1e3) return '₨ ' + Math.round(n/1e3) + 'K';
  return '₨ ' + Math.round(n).toLocaleString('en-IN');
}
function hmFmtFull(n){ return '₨ ' + Math.round(Number(n)||0).toLocaleString('en-IN'); }
function hmEsc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
/* quote a name safely for an inline onclick */
function hmQ(s){ return "'" + String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'") + "'"; }

/* The four GitHub contribution greens, by quarter of the year's
   spend days. Same greens as MD_GREENS in monthDetail. */
var HM_GREENS = ['#0e4429','#006d32','#26a641','#39d353'];
function hmHeat(t){ return HM_GREENS[Math.min(3, Math.floor(Math.max(0, t) * 4))]; }
/* Where a day sits among the year's spend days, 0 (lightest) … 1 (heaviest).
   Ranking rather than dividing by the peak keeps one rent day from
   washing every other day out to green. */
var _hmSorted = [];
function hmRank(v){
  var n = _hmSorted.length;
  if(!v || n < 2) return n ? .5 : 0;
  var lo = 0, hi = n;
  while(lo < hi){ var mid = (lo + hi) >> 1; if(_hmSorted[mid] < v) lo = mid + 1; else hi = mid; }
  return lo / (n - 1);
}
function hmCellStyle(v){ return v > 0 ? ' style="background:' + hmHeat(hmRank(v)) + '"' : ''; }
function hmDayVal(dayData){
  if(!dayData) return 0;
  if(_hmActiveCat === 'all') return dayData.total || 0;
  return (dayData.cats && dayData.cats[_hmActiveCat]) || 0;
}
/* the monthly plan, when monthDetail has read a month */
function hmPlan(){
  try{
    if(typeof _mdBudget === 'undefined' || !_mdBudget) return 0;
    var t = 0;
    Object.keys(_mdBudget).forEach(function(k){ t += (_mdBudget[k] || 0); });
    return t;
  }catch(e){ return 0; }
}

/* the shell's stepper drives the year now (mdStep in monthDetail);
   kept as a thin alias so anything still calling it keeps working */
function hmNav(dir){
  if(typeof mdStep === 'function' && typeof _mdScope !== 'undefined' && _mdScope === 'year'){
    mdStep(dir); return;
  }
  _hmYear += dir;
  hmLoad();
}

/* ═══ load ═══ */
function hmLoad(){
  if(typeof mdSyncBar === 'function') mdSyncBar();
  document.getElementById('hmScroll').innerHTML =
    '<div class="yrs-loading">Reading ' + _hmYear + '…</div>';
  document.getElementById('hmKpis').innerHTML = '';

  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.success){
        _hmData = res;
        var yrs = [];
        for(var y = _hmYear - 4; y <= _hmYear + 1; y++){ yrs.push(y); }
        google.script.run
          .withSuccessHandler(function(yrRes){
            if(yrRes && yrRes.success) _hmYearTotals = yrRes.totals;
            hmRender(res);
          })
          .withFailureHandler(function(){ hmRender(res); })
          .getExpenseYearTotals(yrs);
      } else {
        document.getElementById('hmScroll').innerHTML =
          '<div class="yrs-error">⚠ ' + hmEsc(res ? res.error : 'Failed to read the year') + '</div>';
      }
    })
    .withFailureHandler(function(){
      document.getElementById('hmScroll').innerHTML =
        '<div class="yrs-error">⚠ Could not reach the sheet.</div>';
    })
    .getExpenseHeatmapData(_hmYear);
}

/* ═══ render ═══ */
function hmRender(d){
  var data = d.data || {};
  var cats = d.categories || [];
  var monthTotals = d.monthlyTotals || [];
  var daysInMonths = d.daysInMonths || [];
  var now = new Date();
  var curMonth = now.getMonth(), curDate = now.getDate();
  var isThisYear = (_hmYear === now.getFullYear());

  /* ── one pass over the year: totals, peak day, per-category, per-day ── */
  var globalMax = 0, totalSpend = 0, activeDays = 0;
  var peakVal = 0, peakKey = '';
  var catTotals = {}, dayList = [];

  Object.keys(data).forEach(function(key){
    var v = hmDayVal(data[key]);
    if(v > globalMax) globalMax = v;
    var t = data[key].total || 0;
    if(t > 0){ totalSpend += t; activeDays++; dayList.push({key:key, val:t}); }
    if(t > peakVal){ peakVal = t; peakKey = key; }
    var dc = data[key].cats || {};
    Object.keys(dc).forEach(function(c){ catTotals[c] = (catTotals[c] || 0) + dc[c]; });
  });

  _hmSorted = Object.keys(data).map(function(k){ return hmDayVal(data[k]); })
    .filter(function(v){ return v > 0; }).sort(function(a,b){ return a - b; });

  var activeMonths = 0;
  for(var mi = 0; mi < 12; mi++){ if(monthTotals[mi] > 0) activeMonths++; }
  var avgDay = activeDays > 0 ? totalSpend / activeDays : 0;
  var avgMonth = activeMonths > 0 ? totalSpend / activeMonths : 0;
  var plan = hmPlan();
  var overList = plan > 0
    ? monthTotals.map(function(t,i){ return t > plan ? _hmMonthNames[i] : null; }).filter(Boolean)
    : [];

  var best = -1, worst = -1;
  for(var bi = 0; bi < 12; bi++){
    if(monthTotals[bi] <= 0) continue;
    if(best < 0 || monthTotals[bi] < monthTotals[best]) best = bi;
    if(worst < 0 || monthTotals[bi] > monthTotals[worst]) worst = bi;
  }

  /* ── KPI strip ── */
  var kpis = [
    { lbl:'Total spent',     val:hmFmt(totalSpend),
      sub:activeDays + (activeDays === 1 ? ' day recorded' : ' days recorded') },
    { lbl:'Average / month', val:hmFmt(avgMonth),
      sub:plan > 0 ? 'plan ' + hmFmt(plan) : activeMonths + ' months with spend',
      dot:plan > 0 ? (avgMonth > plan ? 'crit' : 'good') : '' },
    { lbl:'Average / day',   val:hmFmt(avgDay), sub:'across the year' },
    { lbl:'Peak day',        val:hmFmt(peakVal),
      sub:peakKey ? hmDayLabel(peakKey) : '—', dot:peakVal > 0 ? 'tag' : '' },
    { lbl:'Quietest month',  val:best >= 0 ? _hmMonthFull[best] : '—',
      sub:best >= 0 ? hmFmt(monthTotals[best]) : 'no data', dot:best >= 0 ? 'good' : '' },
    plan > 0
      ? { lbl:'Months over plan', val:overList.length + ' of ' + activeMonths,
          sub:overList.slice(0,3).join(', ') || 'none over plan',
          dot:overList.length ? 'crit' : 'good' }
      : { lbl:'Heaviest month', val:worst >= 0 ? _hmMonthFull[worst] : '—',
          sub:worst >= 0 ? hmFmt(monthTotals[worst]) : 'no data', dot:worst >= 0 ? 'crit' : '' }
  ];
  var dotCol = { good:'var(--yrs-good)', crit:'var(--yrs-crit)',
                 warn:'var(--yrs-warn)', tag:'var(--yrs-tag)' };
  document.getElementById('hmKpis').innerHTML = kpis.map(function(k){
    return '<div class="yrs-kpi">' +
      '<div class="yrs-kpi-lbl">' + k.lbl + '</div>' +
      '<div class="yrs-kpi-val">' + k.val + '</div>' +
      '<div class="yrs-kpi-foot">' +
        (k.dot ? '<span class="yrs-kpi-dot" style="background:' + dotCol[k.dot] + '"></span>' : '') +
        '<span class="yrs-kpi-sub">' + hmEsc(k.sub) + '</span>' +
      '</div></div>';
  }).join('');

  /* ══ main column ══ */
  var h = '<div class="yrs-main">';

  /* category filter */
  h += '<div class="yrs-chips">';
  h += '<button type="button" class="yrs-chip' + (_hmActiveCat === 'all' ? ' active' : '') +
       '" onclick="hmSetCat(\'all\')">All spending</button>';
  cats.forEach(function(c){
    h += '<button type="button" class="yrs-chip' + (_hmActiveCat === c.name ? ' active' : '') +
      '" onclick="hmSetCat(' + hmEsc(hmQ(c.name)) + ')">' +
      '<i style="background:' + (c.color || '#6366f1') + '"></i>' + hmEsc(c.name) + '</button>';
  });
  h += '</div>';

  /* legend + month cards */
  h += '<section>';
  h += '<div class="yrs-eye"><h2>Daily spend' +
       (_hmActiveCat !== 'all' ? ' · ' + hmEsc(_hmActiveCat) : '') + '</h2>' +
       '<span class="yrs-rule"></span>' +
       '<span class="yrs-legend"><span class="t">No spend</span>' +
       '<span class="yrs-cell"></span><span class="t" style="margin-left:6px">Low</span>' +
       '<span class="st">' + HM_GREENS.map(function(c){ return '<i style="background:' + c + '"></i>'; }).join('') +
       '</span><span class="t">High</span></span></div>';

  h += '<div class="yrs-months">';
  for(var m = 0; m < 12; m++){
    var dim = daysInMonths[m] || new Date(_hmYear, m + 1, 0).getDate();
    var lead = new Date(_hmYear, m, 1).getDay();
    var isNow = isThisYear && m === curMonth;

    h += '<div class="yrs-mcard' + (isNow ? ' now' : '') + '" role="button" tabindex="0"' +
         ' onclick="mdOpenMonth(' + _hmYear + ',' + (m + 1) + ')"' +
         ' title="Open ' + _hmMonthFull[m] + ' ' + _hmYear + '">';
    h += '<div class="yrs-mcard-hd"><span class="yrs-mcard-nm">' + _hmMonthNames[m] + '</span>' +
         '<span class="yrs-mcard-tot">' + hmFmt(monthTotals[m] || 0) + '</span></div>';

    h += '<div class="yrs-grid" style="margin-bottom:4px">';
    for(var wd = 0; wd < 7; wd++) h += '<span class="yrs-dow">' + _hmDow[wd] + '</span>';
    h += '</div>';

    h += '<div class="yrs-grid">';
    for(var p = 0; p < lead; p++) h += '<span class="yrs-cell"></span>';
    for(var day = 1; day <= dim; day++){
      var key = _hmYear + '-' + String(m + 1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      var val = hmDayVal(data[key]);
      var isToday = isThisYear && m === curMonth && day === curDate;
      var cls = 'yrs-cell' + (isToday ? ' today' : '');
      var when = day + ' ' + _hmMonthNames[m];
      if(val > 0){
        h += '<button type="button" class="' + cls + '" data-hmkey="' + key + '"' + hmCellStyle(val) +
             ' onclick="event.stopPropagation();mdOpenDay(' + _hmYear + ',' + (m + 1) + ',' + day + ')"' +
             ' aria-label="' + when + ', ' + hmFmtFull(val) + '"></button>';
      } else {
        h += '<span class="' + cls + '" data-hmkey="' + key + '"></span>';
      }
    }
    h += '</div></div>';
  }
  h += '</div></section>';

  /* month totals against plan */
  var peakMonth = Math.max.apply(null, monthTotals.concat([plan, 1]));
  h += '<section class="yrs-card">';
  h += '<div class="yrs-eye"><h2>Month totals' + (plan > 0 ? ' against plan' : '') + '</h2>' +
       '<span class="yrs-rule"></span>' +
       '<span class="yrs-key"><i style="background:#6366f1"></i>' +
         (plan > 0 ? 'Within plan' : 'Spend') + '</span>' +
       (plan > 0
         ? '<span class="yrs-key"><i style="background:var(--yrs-crit)"></i>Over plan</span>' +
           '<span class="yrs-key"><i class="line"></i>Plan</span>'
         : '') +
       '</div>';
  h += '<div class="yrs-trend">';
  for(var t = 0; t < 12; t++){
    var mt = monthTotals[t] || 0;
    var over = plan > 0 && mt > plan;
    h += '<button type="button" class="yrs-tcol"' +
         ' onclick="mdOpenMonth(' + _hmYear + ',' + (t + 1) + ')"' +
         ' title="' + _hmMonthFull[t] + ' — ' + hmFmtFull(mt) + '">' +
         '<span class="yrs-tbox">' +
           '<span class="yrs-tbar' + (over ? ' over' : '') + '" style="height:' +
             Math.round(mt / peakMonth * 78) + 'px"></span>' +
           (plan > 0 ? '<span class="yrs-tplan" style="bottom:' +
             Math.round(plan / peakMonth * 78) + 'px"></span>' : '') +
         '</span>' +
         '<span class="yrs-tlbl">' + _hmMonthNames[t] + '</span></button>';
  }
  h += '</div></section>';

  /* year strip */
  if(_hmYearTotals && _hmYearTotals.length){
    h += '<section class="yrs-card">';
    h += '<div class="yrs-eye"><h2>Across the years</h2><span class="yrs-rule"></span></div>';
    h += '<div class="yrs-years">';
    _hmYearTotals.forEach(function(yt){
      h += '<button type="button" class="yrs-ycol' + (yt.year === _hmYear ? ' on' : '') +
        '" onclick="mdGoYear(' + yt.year + ')" title="Show ' + yt.year + '">' +
        '<b>' + yt.year + '</b><span>' + hmFmt(yt.total) + '</span></button>';
    });
    h += '</div></section>';
  }
  h += '</div>';

  /* ══ right rail ══ */
  h += '<aside class="yrs-rail">';

  /* where it went */
  var catRows = Object.keys(catTotals).map(function(c){ return {name:c, val:catTotals[c]}; })
    .sort(function(a,b){ return b.val - a.val; }).slice(0, 7);
  var catPeak = catRows.length ? catRows[0].val : 1;
  h += '<div class="yrs-card"><div class="yrs-eye"><h2>Where it went</h2>' +
       '<span class="yrs-rule"></span></div>';
  if(!catRows.length){
    h += '<div class="yrs-empty" style="padding:16px 0">Nothing recorded this year.</div>';
  } else {
    catRows.forEach(function(c){
      var pct = totalSpend > 0 ? (c.val / totalSpend * 100) : 0;
      h += '<div class="yrs-catrow"><div class="yrs-cattop">' +
        '<span class="nm">' + hmEsc(c.name) + '</span>' +
        '<span class="amt">' + hmFmt(c.val) + '</span>' +
        '<span class="pct">' + pct.toFixed(0) + '%</span></div>' +
        '<div class="yrs-bar"><i style="width:' + (c.val / catPeak * 100).toFixed(1) + '%"></i></div></div>';
    });
  }
  h += '</div>';

  /* heaviest days */
  dayList.sort(function(a,b){ return b.val - a.val; });
  var topDays = dayList.slice(0, 5);
  h += '<div class="yrs-card"><div class="yrs-eye"><h2>Heaviest days</h2>' +
       '<span class="yrs-rule"></span></div>';
  if(!topDays.length){
    h += '<div class="yrs-empty" style="padding:16px 0">No days recorded yet.</div>';
  } else {
    topDays.forEach(function(x){
      var pp = x.key.split('-');
      var mm = parseInt(pp[1],10), dd = parseInt(pp[2],10);
      h += '<button type="button" class="yrs-row"' +
        ' onclick="mdOpenDay(' + _hmYear + ',' + mm + ',' + dd + ')">' +
        '<span class="yrs-cell"' + hmCellStyle(x.val) + '></span>' +
        '<span style="font-size:12px;flex-shrink:0">' + dd + ' ' + _hmMonthNames[mm - 1] + '</span>' +
        '<span class="note">' + hmTopCat(x.key) + '</span>' +
        '<span class="amt">' + hmFmt(x.val) + '</span></button>';
    });
  }
  h += '</div>';

  /* major purchases this year */
  h += '<div class="yrs-card"><div class="yrs-eye"><h2>Major purchases ' + _hmYear + '</h2>' +
       '<span class="yrs-rule"></span></div>' + hmMajorRows() + '</div>';

  h += '</aside>';

  var scroll = document.getElementById('hmScroll');
  scroll.innerHTML = h;
  hmWireTip(scroll);
}

/* ═══ hover card — the day's total, then every entry with its reference ═══ */
function hmTipEl(){
  var el = document.getElementById('yrs-tip');
  if(!el){
    el = document.createElement('div');
    el.id = 'yrs-tip'; el.className = 'yrs-tip'; el.setAttribute('role','tooltip');
    document.body.appendChild(el);
  }
  return el;
}
function hmCatColor(name){
  var cats = (_hmData && _hmData.categories) || [];
  for(var i = 0; i < cats.length; i++) if(cats[i].name === name) return cats[i].color;
  return '#94a3b8';
}
function hmTipHtml(key){
  var dd = _hmData && _hmData.data && _hmData.data[key];
  var p = key.split('-'), dt = new Date(+p[0], +p[1] - 1, +p[2]);
  var head = dt.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
  var val = hmDayVal(dd);
  if(!val) return '<div class="d">' + head + '</div><div class="s" style="margin:4px 0 0">Nothing recorded</div>';

  /* entries with references when the backend sends them; categories otherwise */
  var rows = (dd.items || []).filter(function(it){ return _hmActiveCat === 'all' || it.c === _hmActiveCat; })
    .map(function(it){ return {c:it.c, r:it.r, a:it.a}; });
  if(!rows.length){
    rows = Object.keys(dd.cats || {}).filter(function(c){ return _hmActiveCat === 'all' || c === _hmActiveCat; })
      .map(function(c){ return {c:c, r:'', a:dd.cats[c]}; });
  }
  rows.sort(function(a,b){ return b.a - a.a; });
  var shown = rows.slice(0, 8);
  var t = hmRank(val);
  var feel = t < .34 ? 'A light day' : t < .67 ? 'An average day' : 'A heavy day';
  return '<div class="d">' + head + (_hmActiveCat !== 'all' ? ' · ' + hmEsc(_hmActiveCat) : '') + '</div>' +
    '<div class="t">' + hmFmtFull(val) + '</div>' +
    '<div class="s">' + feel + ' for ' + _hmYear + ' · ' + rows.length + (rows.length === 1 ? ' entry' : ' entries') + '</div>' +
    shown.map(function(it){
      return '<div class="it"><i style="background:' + hmCatColor(it.c) + '"></i>' +
        '<span class="x">' + hmEsc(it.r || it.c) + (it.r ? '<small>' + hmEsc(it.c) + '</small>' : '') + '</span>' +
        '<b>' + Math.round(it.a).toLocaleString('en-IN') + '</b></div>';
    }).join('') +
    (rows.length > shown.length ? '<div class="more">+ ' + (rows.length - shown.length) + ' more</div>' : '');
}
function hmWireTip(host){
  if(host._hmTip) return;
  host._hmTip = true;
  var tip = hmTipEl();
  host.addEventListener('mouseover', function(ev){
    var c = ev.target.closest && ev.target.closest('[data-hmkey]');
    if(!c){ tip.classList.remove('on'); return; }
    tip.innerHTML = hmTipHtml(c.getAttribute('data-hmkey'));
    tip.classList.add('on');
  });
  host.addEventListener('mousemove', function(ev){
    if(!tip.classList.contains('on')) return;
    var w = tip.offsetWidth, h = tip.offsetHeight;
    var x = ev.clientX + 16, y = ev.clientY + 16;
    if(x + w > window.innerWidth - 8)  x = ev.clientX - w - 16;
    if(y + h > window.innerHeight - 8) y = ev.clientY - h - 16;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  });
  host.addEventListener('mouseleave', function(){ tip.classList.remove('on'); });
}

/* the biggest category on one day, for the rail's note column */
function hmTopCat(key){
  var dc = (_hmData && _hmData.data[key] && _hmData.data[key].cats) || {};
  var best = '', bv = 0;
  Object.keys(dc).forEach(function(c){ if(dc[c] > bv){ bv = dc[c]; best = c; } });
  return hmEsc(best);
}

/* Major EXP items bought this year — the cross-link into the Major scope */
function hmMajorRows(){
  var pre = (typeof _analyzePreloadData !== 'undefined') && _analyzePreloadData.majorexp;
  if(!pre || !pre.success || !pre.data || !pre.data.length){
    return '<div class="yrs-empty" style="padding:16px 0">Nothing tracked yet.</div>';
  }
  var rows = pre.data.filter(function(r){
    if(r.bought !== true || !r.boughtDate) return false;
    var dt = new Date(r.boughtDate);
    return !isNaN(dt.getTime()) && dt.getFullYear() === _hmYear;
  }).sort(function(a,b){ return (b.price||0) - (a.price||0); }).slice(0, 5);

  if(!rows.length){
    return '<div class="yrs-empty" style="padding:16px 0">None bought in ' + _hmYear + '.</div>';
  }
  return rows.map(function(r){
    var dt = new Date(r.boughtDate);
    return '<button type="button" class="yrs-row"' +
      ' onclick="mdSwitchScope(\'major\')" title="Open the Major scope">' +
      '<span class="yrs-dot"></span>' +
      '<span style="font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        hmEsc(r.reference || 'Item') + '</span>' +
      '<span class="note" style="flex-shrink:0">' + _hmMonthNames[dt.getMonth()] + '</span>' +
      '<span class="amt">' + hmFmt(r.price) + '</span></button>';
  }).join('');
}

function hmSetCat(catName){
  _hmActiveCat = catName;
  if(_hmData) hmRender(_hmData);
}

function hmDayLabel(key){
  var p = key.split('-');
  return parseInt(p[2],10) + ' ' + _hmMonthNames[parseInt(p[1],10) - 1];
}

/* Auto-load disabled — the shell calls hmLoad() when the Year scope opens */
</script>

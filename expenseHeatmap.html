<!-- ═══════════════════════════════════════════════════════════════════
     EXPENSE HEATMAP — Full Year Financial Heatmap
     Each month as a separate block · Day-of-week aligned columns
═══════════════════════════════════════════════════════════════════ -->
<style>
:root {
  --hm-bg:   rgba(6,11,24,.72);
  --hm-bdr:  rgba(255, 255, 255, 0.08);
  --hm-dim:  #94a3b8;
  --hm-text: #f1f5f9;
  --hm-red:   #ef4444;
  --hm-card-bg: rgba(6,11,24,.72);
  --hm-card-bdr: rgba(255,255,255,.05);
  --hm-card-radius: 16px;
}

.hm-wrap{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--hm-text);
  width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;}

/* ── Header ── */
.hm-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:10px 13px 8px;border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;background:rgba(6,11,24,.72);backdrop-filter:blur(12px);}
.hm-hdr-l{display:flex;align-items:center;gap:10px;min-width:0;}
.hm-hdr-icon{font-size:1.1em;flex-shrink:0;}
.hm-hdr-title{font-size:.63em;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:rgba(255,255,255,.35);
  background:none;-webkit-background-clip:unset;-webkit-text-fill-color:unset;background-clip:unset;
  white-space:nowrap;}
.hm-nav{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.hm-nav-btn{background:rgba(6,11,24,.72);border:1px solid rgba(255,255,255,.08);
  border-radius:8px;color:rgba(255,255,255,.45);width:30px;height:30px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:.72em;}
.hm-nav-btn:hover{background:rgba(6,11,24,.82);color:#fff;border-color:rgba(255,255,255,.15);}
.hm-nav-lbl{font-size:.65em;font-weight:700;color:rgba(255,255,255,.5);
  min-width:65px;text-align:center;letter-spacing:.3px;}

/* ── KPI Row — consistent with cardAnalysis ca-kpi-row ── */
.hm-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;padding:12px 18px 0;
  flex-shrink:0;}
.hm-kpi{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:14px 16px;
  backdrop-filter:blur(20px);position:relative;overflow:hidden;transition:transform .2s;
  box-shadow:none;}
.hm-kpi:hover{transform:translateY(-2px);box-shadow:none;background:var(--card);border-color:var(--bdr);}
.hm-kpi::after,.hm-kpi::before{display:none;}
.hm-kpi-icon{font-size:1.4em;margin-bottom:5px;display:block;}
.hm-kpi-lbl{font-size:.58em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,255,255,.33);margin-bottom:3px;}
.hm-kpi-val{font-size:1.3em;font-weight:800;letter-spacing:-.5px;line-height:1;}
.hm-kpi-sub{font-size:.6em;color:rgba(255,255,255,.25);margin-top:3px;}

/* ── Scroll area ── */
.hm-scroll{flex:1;overflow-y:auto;padding:10px 18px 14px;
  scrollbar-width:none;-ms-overflow-style:none;}
.hm-scroll::-webkit-scrollbar{display:none;}

/* ── Glass card — consistent with cardAnalysis ca-chart-box ── */
.hm-glass{background:var(--card);border:1px solid var(--bdr);border-radius:16px;padding:16px;
  margin-bottom:12px;backdrop-filter:blur(20px);position:relative;overflow:hidden;
  box-shadow:none;}
.hm-glass::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
  pointer-events:none;}

/* ── Section header ── */
.hm-sec-hdr{font-size:.55em;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.2);margin:0 0 10px;display:flex;align-items:center;gap:10px;}
.hm-sec-hdr::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06);}

/* ── Category filter chips ── */
.hm-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.hm-chip{font-size:.5em;font-weight:700;padding:5px 12px;border-radius:14px;
  border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:all .2s;
  background:rgba(6,11,24,.72);color:rgba(255,255,255,.45);letter-spacing:.3px;text-transform:uppercase;}
.hm-chip:hover{background:rgba(6,11,24,.82);color:#fff;border-color:rgba(255,255,255,.18);}
.hm-chip.active{background:rgba(99,102,241,.28);border-color:#6366f1;color:#c7d2fe;box-shadow:0 0 18px rgba(99,102,241,.3);}
.hm-chip.all{background:rgba(99,102,241,.18);border-color:rgba(99,102,241,.35);color:#c7d2fe;}
.hm-chip.all.active{background:rgba(99,102,241,.35);border-color:#6366f1;color:#fff;}

/* ── Monthly bar chart ── */
.hm-month-bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;padding:4px 0;}
.hm-mbar-col{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;}
.hm-mbar-bar-wrap{width:100%;height:50px;border-radius:5px;
  background:rgba(6,11,24,.72);position:relative;overflow:hidden;display:flex;align-items:flex-end;
  border:1px solid rgba(255,255,255,.04);}
.hm-mbar-bar{width:100%;border-radius:3px 3px 0 0;min-height:2px;
  transition:height .6s ease;position:relative;}
.hm-mbar-lbl{font-size:.42em;font-weight:700;color:rgba(255,255,255,.18);text-transform:uppercase;letter-spacing:.4px;}
.hm-mbar-val{font-size:.38em;font-weight:700;color:rgba(255,255,255,.35);margin-top:-1px;}

/* Bar tooltip — appears on hover */
.hm-bar-tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:rgba(6,11,24,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.12);border-radius:8px;
  padding:5px 11px;font-size:.9em;font-weight:800;white-space:nowrap;
  color:#f1f5f9;pointer-events:none;opacity:0;transition:opacity .2s ease,transform .2s ease;
  z-index:20;box-shadow:0 8px 28px rgba(0,0,0,.55);line-height:1.4;}
.hm-bar-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:rgba(255,255,255,.12);}
.hm-mbar-col:hover .hm-bar-tip{opacity:1;transform:translateX(-50%) translateY(-3px);}
.hm-mbar-col:hover .hm-mbar-bar{transform:scaleY(1.12);transform-origin:bottom;}
.hm-mbar-col:hover .hm-mbar-val{color:#f1f5f9;font-size:.52em;}
.hm-mbar-col:hover .hm-mbar-lbl{color:rgba(255,255,255,.45);}

/* ── LEGEND ── */
.hm-legend{display:flex;align-items:center;gap:8px;padding:6px 0 2px;flex-wrap:wrap;}
.hm-leg-lbl{font-size:.45em;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.6px;}
.hm-leg-strip{display:flex;gap:3px;align-items:center;}
.hm-leg-dot{width:16px;height:16px;border-radius:4px;border:1px solid rgba(255,255,255,.08);}
.hm-leg-note{font-size:.42em;font-weight:600;color:rgba(255,255,255,.2);margin-left:4px;}

/* ── MONTHLY CALENDAR BLOCKS ── */
.hm-months{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}

/* Each month is a separate card */
.hm-month-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:14px 14px;
  backdrop-filter:blur(20px);transition:transform .2s;position:relative;overflow:hidden;}
.hm-month-card:hover{transform:translateY(-2px);}
.hm-month-card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;opacity:.9;}
.hm-month-card::before{display:none;}
.hm-month-card.m0::after{background:linear-gradient(#6366f1,#8b5cf6);box-shadow:2px 0 12px #6366f1;}
.hm-month-card.m1::after{background:linear-gradient(#f59e0b,#f97316);box-shadow:2px 0 12px #f59e0b;}
.hm-month-card.m2::after{background:linear-gradient(#10b981,#059669);box-shadow:2px 0 12px #10b981;}
.hm-month-card.m3::after{background:linear-gradient(#06b6d4,#0ea5e9);box-shadow:2px 0 12px #06b6d4;}
.hm-month-card.m4::after{background:linear-gradient(#ec4899,#f43f5e);box-shadow:2px 0 12px #ec4899;}
.hm-month-card.m5::after{background:linear-gradient(#8b5cf6,#a855f7);box-shadow:2px 0 12px #8b5cf6;}
.hm-month-card.m6::after{background:linear-gradient(#f97316,#f59e0b);box-shadow:2px 0 12px #f97316;}
.hm-month-card.m7::after{background:linear-gradient(#14b8a6,#2dd4bf);box-shadow:2px 0 12px #14b8a6;}
.hm-month-card.m8::after{background:linear-gradient(#e11d48,#fb7185);box-shadow:2px 0 12px #e11d48;}
.hm-month-card.m9::after{background:linear-gradient(#6366f1,#8b5cf6);box-shadow:2px 0 12px #6366f1;}
.hm-month-card.m10::after{background:linear-gradient(#d946ef,#e879f9);box-shadow:2px 0 12px #d946ef;}
.hm-month-card.m11::after{background:linear-gradient(#0ea5e9,#38bdf8);box-shadow:2px 0 12px #0ea5e9;}

/* Month header inside card */
.hm-month-hdr{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;padding:0 2px;}
.hm-month-name{font-size:.58em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,255,255,.8);}
.hm-month-total{font-size:.5em;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.3px;}

/* Day-of-week row */
.hm-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;
  margin-bottom:4px;padding:0 2px;}
.hm-weekday{font-size:.4em;font-weight:700;text-transform:uppercase;
  color:rgba(255,255,255,.25);text-align:center;letter-spacing:.5px;}

/* Calendar grid — 7 columns for days */
.hm-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}

/* Each day cell — brighter default state */
.hm-day-wrap{position:relative;width:100%;padding-bottom:100%;}
.hm-day{position:absolute;inset:0;border-radius:5px;display:flex;align-items:center;
  justify-content:center;font-size:.5em;font-weight:700;transition:all .18s ease;
  background:rgba(15,23,42,.04);border:1px solid rgba(255,255,255,.07);
  color:rgba(255,255,255,.35);cursor:default;
  flex-direction:column;gap:1px;line-height:1;}
.hm-day:hover{transform:scale(1.22);z-index:10;
  border-color:rgba(255,255,255,.35);box-shadow:0 6px 24px rgba(0,0,0,.5);}
.hm-day .hm-day-num{font-size:1em;font-weight:800;line-height:1;}
.hm-day .hm-day-amt{font-size:.55em;font-weight:700;opacity:.85;line-height:1;}

/* Today — vibrant blue gradient like render.html */
.hm-day.today{background:linear-gradient(135deg,rgba(14,165,233,.45),rgba(37,99,235,.4)) !important;
  border-color:#0ea5e9 !important;
  box-shadow:0 0 20px rgba(14,165,233,.45),inset 0 0 20px rgba(14,165,233,.12) !important;}
.hm-day.today .hm-day-num{color:#f1f5f9 !important;font-size:1.15em;text-shadow:0 0 10px rgba(14,165,233,.5);}

/* Empty cells (days beyond month) */
.hm-day.empty{background:transparent !important;border-color:transparent !important;cursor:default;}
.hm-day.empty:hover{transform:none;}

/* Intensity levels — GREEN→AMBER→RED — vibrant, eye-catching like render.html calendar */
.hm-day.l0{background:rgba(0,230,118,.15);border-color:rgba(0,230,118,.25);color:rgba(74,222,128,.8);}
.hm-day.l0 .hm-day-amt{color:transparent;}
.hm-day.l1{background:rgba(255,200,50,.22);border-color:rgba(255,200,50,.35);color:#fde047;box-shadow:inset 0 0 0 1px rgba(255,200,50,.15);}
.hm-day.l2{background:rgba(255,160,50,.3);border-color:rgba(255,160,50,.45);color:#fdba74;box-shadow:inset 0 0 0 1px rgba(255,160,50,.2);}
.hm-day.l3{background:rgba(255,100,50,.4);border-color:rgba(255,100,50,.5);color:#fca5a5;box-shadow:inset 0 0 0 1px rgba(255,100,50,.25);}
.hm-day.l4{background:rgba(255,50,50,.5);border-color:rgba(255,50,50,.55);color:#fca5a5;box-shadow:inset 0 0 0 1px rgba(255,50,50,.3);}
.hm-day.l5{background:rgba(220,30,30,.65);border-color:rgba(255,50,50,.6);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,50,50,.35),0 0 14px rgba(255,50,50,.3);}
/* Active spend cells show amount */
.hm-day.has-spend{cursor:pointer;}
.hm-day.has-spend .hm-day-amt{display:block;}
.hm-day .hm-day-amt{display:none;}

/* ── Modal — consistent with cardAnalysis ca-modal ── */
#hm-month-overlay,#hm-day-overlay{
  display:none;position:fixed;inset:0;z-index:9500;
  background:rgba(0,0,0,.6);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:16px;
}
#hm-month-overlay.open,#hm-day-overlay.open{display:flex;}
#hm-month-modal,#hm-day-modal{
  background:#0f172a;border:1px solid rgba(255,255,255,.12);
  border-radius:20px;width:100%;max-width:720px;
  max-height:85vh;display:flex;flex-direction:column;
  box-shadow:0 25px 50px -12px rgba(0,0,0,.5);
  animation:hmmIn .25s ease;position:relative;overflow:hidden;
}
#hm-day-modal{max-width:520px;height:auto;max-height:min(90vh,700px);}
#hm-month-modal::before,#hm-day-modal::before{display:none;}
@keyframes hmmIn{
  from{opacity:0;transform:scale(.94) translateY(10px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.hmm-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.hmm-title{font-size:.72em;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#fff;}
.hmm-sub{font-size:.65em;color:rgba(255,255,255,.35);margin-top:3px;font-weight:500;text-transform:none;letter-spacing:0;}
.hmm-close{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
  color:rgba(255,255,255,.5);border-radius:8px;width:28px;height:28px;
  cursor:pointer;font-size:.8em;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;font-weight:700;}
.hmm-close:hover{background:rgba(239,68,68,.2);color:#f87171;border-color:rgba(239,68,68,.3);}

/* Search bar */
.hmm-search-wrap{padding:10px 18px 0;flex-shrink:0;}
.hmm-search{
  width:100%;padding:8px 12px;border-radius:8px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  color:#fff;font-size:.75em;font-family:inherit;outline:none;transition:border-color .15s;
  box-sizing:border-box;
}
.hmm-search:focus{border-color:rgba(168,85,247,.5);background:rgba(255,255,255,.06);}
.hmm-search::placeholder{color:rgba(255,255,255,.25);}

/* Body / table area */
.hmm-body{overflow-y:auto;flex:1;padding:12px 18px;}
.hmm-body::-webkit-scrollbar{width:4px;}
.hmm-body::-webkit-scrollbar-track{background:transparent;}
.hmm-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px;}
.hmm-loading{display:flex;align-items:center;justify-content:center;gap:10px;
  padding:40px;color:rgba(255,255,255,.35);font-size:12px;}
.hmm-spin{width:24px;height:24px;border:2px solid rgba(168,85,247,.2);
  border-top-color:#a855f7;border-radius:50%;animation:hmmSpin .8s linear infinite;flex-shrink:0;}
@keyframes hmmSpin{to{transform:rotate(360deg)}}
.hmm-empty{text-align:center;padding:40px 16px;color:rgba(255,255,255,.3);font-size:.8em;}
.hmm-err{text-align:center;padding:40px 16px;color:#ef4444;font-size:.8em;}

/* Table — consistent with cardAnalysis ca-table */
.hmm-table{width:100%;border-collapse:collapse;font-size:.78em;}
.hmm-table th{font-size:.62em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,255,255,.35);padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.06);
  text-align:left;background:rgba(255,255,255,.02);white-space:nowrap;}
.hmm-table th:last-child{text-align:right;}
.hmm-table td{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.04);
  vertical-align:middle;color:rgba(255,255,255,.6);white-space:nowrap;}
.hmm-table tr:hover td{background:rgba(255,255,255,.03);}
.hmm-table .hmm-cat-dot{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;vertical-align:middle;}
.hmm-table .hmm-amt{font-weight:700;text-align:right;color:#f1f5f9;white-space:nowrap;}
.hmm-table .hmm-date{font-weight:600;color:rgba(255,255,255,.5);white-space:nowrap;}
.hmm-table .hmm-ref{color:rgba(255,255,255,.4);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hmm-table .hmm-cat{font-size:.92em;}

/* Day modal category list */
.hmm-day-cats{display:flex;flex-direction:column;gap:4px;padding:4px 0;}
.hmm-day-cat{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;
  font-size:.65em;font-weight:600;background:rgba(255,255,255,.03);}
.hmm-day-cat-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.hmm-day-cat-name{color:rgba(255,255,255,.55);flex:1;}
.hmm-day-cat-amt{font-weight:700;color:rgba(255,255,255,.85);}
.hmm-day-total{font-size:1em;font-weight:800;margin-bottom:8px;padding:0 8px;}
.hmm-day-date{font-size:.65em;font-weight:700;color:rgba(255,255,255,.55);margin-bottom:4px;padding:0 8px;letter-spacing:.5px;text-transform:uppercase;}

/* Pagination */
.hmm-pag{display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;
  background:rgba(255,255,255,.02);}
.hmm-pag-info{font-size:.65em;color:rgba(255,255,255,.3);}
.hmm-pag-btns{display:flex;align-items:center;gap:6px;}
.hmm-pag-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.55);border-radius:9px;padding:5px 12px;cursor:pointer;
  font-size:.65em;font-weight:600;transition:all .12s;font-family:inherit;text-transform:uppercase;letter-spacing:.3px;}
.hmm-pag-btn:hover{color:#fff;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15);}
.hmm-pag-btn:disabled{opacity:.3;cursor:not-allowed;pointer-events:none;}
.hmm-pag-num{font-size:.65em;font-weight:700;color:rgba(255,255,255,.5);min-width:60px;text-align:center;}

/* ── Loading / Error ── */
.hm-loading{text-align:center;padding:40px 16px;color:var(--hm-dim);font-size:.72em;}
.hm-error{text-align:center;padding:40px 16px;color:var(--hm-red);font-size:.72em;}

/* ── Empty state ── */
.hm-empty{text-align:center;padding:30px 16px;}
.hm-empty-icon{font-size:2.5em;margin-bottom:8px;opacity:.4;}
.hm-empty-text{font-size:.7em;color:var(--hm-dim);}

/* ── Legend colors for dots — matching vibrant levels above ── */
.hm-leg-dot.l0{background:rgba(0,230,118,.2);border:1px solid rgba(0,230,118,.3);}
.hm-leg-dot.l1{background:rgba(255,200,50,.3);}
.hm-leg-dot.l2{background:rgba(255,160,50,.4);}
.hm-leg-dot.l3{background:rgba(255,100,50,.5);}
.hm-leg-dot.l4{background:rgba(255,50,50,.6);}
.hm-leg-dot.l5{background:rgba(220,30,30,.7);border-color:rgba(255,50,50,.4);}

/* ── Responsive ── */
@media(max-width:1024px){
  .hm-months{grid-template-columns:repeat(2,1fr);gap:12px;}
}
@media(max-width:760px){
  .hm-months{grid-template-columns:repeat(2,1fr);gap:10px;}
  .hm-month-card{padding:10px 10px 10px;}
  .hm-day{border-radius:4px;font-size:.45em;}
}
@media(max-width:700px){
  .hm-kpis{grid-template-columns:repeat(3,1fr);}
  .hm-kpi{padding:12px 14px;}
}
@media(max-width:640px){
  .hm-scroll{padding:6px 10px 8px;}
  .hm-glass{padding:10px;margin-bottom:8px;}
  .hm-hdr{padding:10px 12px;}
  .hm-hdr-title{font-size:.6em;}
  .hm-kpis{grid-template-columns:repeat(3,1fr);padding:8px 10px 0;gap:6px;}
  .hm-kpi-val{font-size:1.1em;}
  .hm-months{grid-template-columns:repeat(2,1fr);gap:8px;}
  .hm-month-card{padding:8px 8px 8px;}
  .hm-month-name{font-size:.5em;}
  .hm-weekday{font-size:.35em;}
  .hm-day{border-radius:3px;font-size:.4em;}
  .hm-day .hm-day-amt{display:none !important;}
  .hm-mbar-bar-wrap{height:36px;}
}
@media(max-width:430px){
  .hm-months{grid-template-columns:repeat(1,1fr);gap:8px;}
  .hm-kpis{grid-template-columns:repeat(2,1fr);}
  .hm-kpi-val{font-size:.95em;}
  .hm-day{font-size:.5em;border-radius:4px;}
  .hm-nav-btn{width:26px;height:26px;font-size:.65em;}
  .hm-nav-lbl{min-width:52px;font-size:.5em;}
}

<script>
/* ── State ── */
var _hmYear = new Date().getFullYear();
var _hmData = null;
var _hmYearTotals = [];
var _hmActiveCat = 'all';
var _hmMonthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var _hmWeekdays = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

/* ── Format ── */
function hmFmt(n){
  if(n === undefined || n === null || isNaN(n)) return '—';
  if(n >= 100000) return '₨ ' + Math.round(n/1000) + 'k';
  if(n >= 1000) return '₨ ' + Math.round(n).toLocaleString();
  return '₨ ' + Math.round(n);
}
function hmFmtFull(n){
  if(n === undefined || n === null || isNaN(n)) return '—';
  return '₨ ' + Math.round(n).toLocaleString();
}

/* ── Navigation ── */
function hmNav(dir){
  _hmYear += dir;
  hmLoad();
}

/* ── Load ── */
function hmLoad(){
  document.getElementById('hmYearLbl').textContent = _hmYear;
  document.getElementById('hmScroll').innerHTML =
    '<div class="hm-loading"><div style="font-size:2em;margin-bottom:8px;">🔥</div>Loading heatmap…</div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.success){
        _hmData = res;
        // Fetch year totals too
        var yrs = [];
        for(var y = _hmYear - 4; y <= _hmYear + 1; y++){ yrs.push(y); }
        google.script.run
          .withSuccessHandler(function(yrRes){
            if(yrRes && yrRes.success) _hmYearTotals = yrRes.totals;
            hmRender(res);
          })
          .withFailureHandler(function(){ hmRender(res); })
          .getExpenseYearTotals(yrs);
      } else {
        document.getElementById('hmScroll').innerHTML =
          '<div class="hm-error">⚠ '+(res?res.error:'Failed')+'</div>';
      }
    })
    .withFailureHandler(function(){
      document.getElementById('hmScroll').innerHTML =
        '<div class="hm-error">⚠ Error loading data</div>';
    })
    .getExpenseHeatmapData(_hmYear);
}

/* ── Intensity level (0-5) ── */
function hmLevel(val, maxVal){
  if(!val || val <= 0) return 0;
  if(maxVal <= 0) return 0;
  var r = val / maxVal;
  if(r <= 0.08) return 1;
  if(r <= 0.2)  return 2;
  if(r <= 0.4)  return 3;
  if(r <= 0.65) return 4;
  return 5;
}

/* ── Day value by filter ── */
function hmDayVal(dayData){
  if(!dayData) return 0;
  if(_hmActiveCat === 'all') return dayData.total || 0;
  return (dayData.cats && dayData.cats[_hmActiveCat]) || 0;
}

/* ── Render ── */
function hmRender(d){
  var data = d.data || {};
  var cats = d.categories || [];
  var monthTotals = d.monthlyTotals || [];
  var daysInMonths = d.daysInMonths || [];
  var yearTotal = d.yearTotal || 0;
  var curMonth = new Date().getMonth();
  var curDate = new Date().getDate();

  // Stats — only consider months that have expense data
  var activeMonthCount = 0;
  for(var mi = 0; mi < 12; mi++){
    if(monthTotals[mi] > 0) activeMonthCount++;
  }
  var totalDays = 0, totalSpend = 0, maxDayVal = 0, maxDayKey = '';
  for(var key in data){
    var dv = data[key].total || 0;
    totalSpend += dv; totalDays++;
    if(dv > maxDayVal){ maxDayVal = dv; maxDayKey = key; }
  }
  var avgDay = totalDays > 0 ? totalSpend / totalDays : 0;

  // Best month = LOWEST expense, Worst month = HIGHEST expense
  var bestMoVal = Infinity, bestMoI = 0, worstMoVal = -1, worstMoI = 0;
  for(var mi = 0; mi < 12; mi++){
    var mt = monthTotals[mi];
    if(mt > 0){
      if(mt < bestMoVal){ bestMoVal = mt; bestMoI = mi; }
      if(mt > worstMoVal){ worstMoVal = mt; worstMoI = mi; }
    }
  }
  if(bestMoVal === Infinity) bestMoVal = 0;
  if(worstMoVal <= 0) worstMoVal = 0;

  // Global max for scaling
  var globalMax = 0;
  for(var k in data){ var v = hmDayVal(data[k]); if(v > globalMax) globalMax = v; }
  if(globalMax <= 0) globalMax = 1;

  // KPIs
  document.getElementById('hmKpiTotal').textContent = hmFmtFull(yearTotal);
  document.getElementById('hmKpiBest').textContent = _hmMonthNames[bestMoI] + ' ' + hmFmtFull(bestMoVal);
  document.getElementById('hmKpiWorst').textContent = _hmMonthNames[worstMoI] + ' ' + hmFmtFull(worstMoVal);
  document.getElementById('hmKpiAvg').textContent = hmFmtFull(avgDay);
  document.getElementById('hmKpiPeak').textContent = maxDayKey ? hmFmtFull(maxDayVal) + ' (' + maxDayKey.slice(5) + ')' : '—';
  document.getElementById('hmKpiAvgMo').textContent = hmFmtFull(activeMonthCount > 0 ? yearTotal / activeMonthCount : 0);

  var html = '';

  // ── Category chips ──
  html += '<div class="hm-glass"><div class="hm-sec-hdr"><span>🎯</span>Filter Category</div><div class="hm-chips">';
  html += '<span class="hm-chip all ' + (_hmActiveCat === 'all' ? 'active' : '') + '" onclick="hmSetCat(\'all\')">📊 All</span>';
  cats.forEach(function(c){
    html += '<span class="hm-chip ' + (_hmActiveCat === c.name ? 'active' : '') + '" style="' + (_hmActiveCat === c.name ? 'border-color:' + c.color : '') + '" onclick="hmSetCat(\'' + c.name.replace(/'/g,"\\'") + '\')"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:' + c.color + ';margin-right:5px;vertical-align:middle;"></span>' + c.name + '</span>';
  });
  html += '</div></div>';

  // ── Monthly bar chart ──
  var maxMonth = 1;
  monthTotals.forEach(function(mt){ if(mt > maxMonth) maxMonth = mt; });
  html += '<div class="hm-glass"><div class="hm-sec-hdr"><span>📊</span>Monthly Totals</div><div class="hm-month-bars">';
  monthTotals.forEach(function(mt, i){
    var pct = maxMonth > 0 ? Math.max(2, (mt / maxMonth) * 100) : 2;
    var barColor = (i === bestMoI) ? '#10b981' : (i === worstMoI) ? '#ef4444' : '#6366f1';
    html += '<div class="hm-mbar-col" style="cursor:pointer;" onclick="hmMonthOpen(' + i + ')" title="Click to view ' + _hmMonthNames[i] + ' expenses"><div class="hm-mbar-bar-wrap"><div class="hm-mbar-bar" style="height:' + pct + '%;background:' + barColor + ';box-shadow:0 0 8px ' + barColor + '40;"></div><div class="hm-bar-tip">' + hmFmtFull(mt) + '</div></div><div class="hm-mbar-lbl">' + _hmMonthNames[i] + '</div><div class="hm-mbar-val">' + hmFmt(mt) + '</div></div>';
  });
  html += '</div></div>';

  // ── Yearly Totals Chart ──
  if(_hmYearTotals && _hmYearTotals.length > 0){
    var maxYr = 1;
    _hmYearTotals.forEach(function(yt){ if(yt.total > maxYr) maxYr = yt.total; });
    var curYr = _hmYear;
    var bestYr = _hmYearTotals.reduce(function(a,b){ return (a.total < b.total) ? a : b; });
    var worstYr = _hmYearTotals.reduce(function(a,b){ return (a.total > b.total) ? a : b; });
    html += '<div class="hm-glass"><div class="hm-sec-hdr"><span>📅</span>Yearly Totals</div><div class="hm-month-bars">';
    _hmYearTotals.forEach(function(yt){
      var pct = maxYr > 0 ? Math.max(3, (yt.total / maxYr) * 100) : 3;
      var barColor = yt.year === curYr ? '#8b5cf6' : (yt.year === bestYr.year ? '#10b981' : (yt.year === worstYr.year ? '#ef4444' : '#6366f1'));
      html += '<div class="hm-mbar-col" style="cursor:pointer;" onclick="hmYearOpen(' + yt.year + ')" title="Click to view ' + yt.year + ' expenses"><div class="hm-mbar-bar-wrap" style="height:64px;"><div class="hm-mbar-bar" style="height:' + pct + '%;background:' + barColor + ';box-shadow:0 0 8px ' + barColor + '40;border-radius:4px 4px 0 0;"></div><div class="hm-bar-tip">' + hmFmtFull(yt.total) + '</div></div><div class="hm-mbar-lbl">' + yt.year + '</div><div class="hm-mbar-val">' + hmFmt(yt.total) + '</div></div>';
    });
    html += '</div></div>';
  }

  // ── Legend ──
  html += '<div class="hm-glass"><div class="hm-sec-hdr"><span>🗺️</span>' + _hmYear + ' Daily Spend' + (_hmActiveCat !== 'all' ? ' — ' + _hmActiveCat : '') + '</div>';
  html += '<div class="hm-legend"><span class="hm-leg-lbl">Low</span><div class="hm-leg-strip">';
  for(var li = 0; li <= 5; li++){
    html += '<div class="hm-leg-dot l' + li + '"></div>';
  }
  html += '</div><span class="hm-leg-lbl">High</span>';
  html += '<span class="hm-leg-note">· Max: ' + hmFmtFull(globalMax) + '</span></div>';

  // ── Month blocks ──
  html += '<div class="hm-months">';

  for(var m = 0; m < 12; m++){
    var dim = daysInMonths[m];        // days in month
    var firstDay = new Date(_hmYear, m, 1).getDay(); // 0=Sun
    // Convert Sun(0)→6, Mon(1)→0, Tue(2)→1, etc.
    var startOffset = (firstDay === 0) ? 6 : firstDay - 1;

    html += '<div class="hm-month-card m' + m + '">';
    html += '<div class="hm-month-hdr"><span class="hm-month-name">' + _hmMonthNames[m] + '</span><span class="hm-month-total">' + hmFmt(monthTotals[m]) + '</span></div>';

    // Weekday headers
    html += '<div class="hm-weekdays">';
    for(var wd = 0; wd < 7; wd++){
      html += '<div class="hm-weekday">' + _hmWeekdays[wd].charAt(0) + '</div>';
    }
    html += '</div>';

    // Calendar grid
    html += '<div class="hm-cal-grid">';

    // Empty cells before first day
    for(var pad = 0; pad < startOffset; pad++){
      html += '<div class="hm-day-wrap"><div class="hm-day empty"></div></div>';
    }

    // Actual days
    for(var day = 1; day <= dim; day++){
      var key = _hmYear + '-' + String(m+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      var dayData = data[key];
      var val = hmDayVal(dayData);
      var level = hmLevel(val, globalMax);
      var hasSpend = val > 0;
      var isToday = (m === curMonth && day === curDate && _hmYear === new Date().getFullYear());

      var cls = 'hm-day';
      if(hasSpend) cls += ' has-spend';
      if(isToday) cls += ' today';
      cls += ' l' + level;

      html += '<div class="hm-day-wrap">';
      html += '<div class="' + cls + '"' + (hasSpend ? ' onclick="hmShowDay(\'' + key + '\')"' : '') + ' title="' + _hmMonthNames[m] + ' ' + day + ': ' + hmFmtFull(val) + '">';
      html += '<span class="hm-day-num">' + day + '</span>';
      if(hasSpend) html += '<span class="hm-day-amt">' + hmFmt(val) + '</span>';
      html += '</div></div>';
    }

    html += '</div>'; // cal-grid
    html += '</div>'; // month-card
  }

  html += '</div>'; // months

  html += '</div>'; // glass (legend + months)

  document.getElementById('hmScroll').innerHTML = html;
}

/* ── Category filter ── */
function hmSetCat(catName){
  _hmActiveCat = catName;
  if(_hmData) hmRender(_hmData);
}

/* ── Day detail modal ── */
function hmShowDay(dateKey){
  var d = _hmData ? _hmData.data[dateKey] : null;
  if(!d || !d.total) return;

  var p = dateKey.split('-');
  var label = _hmMonthNames[parseInt(p[1],10)-1] + ' ' + parseInt(p[2],10) + ', ' + p[0];
  var mIdx = parseInt(p[1], 10) - 1;
  var dayNum = parseInt(p[2], 10);

  document.getElementById('hmd-title').textContent = '📅 ' + label + ' Expenses';
  document.getElementById('hmd-sub').textContent = 'Total: ' + hmFmtFull(d.total);
  document.getElementById('hm-day-overlay').classList.add('open');
  document.getElementById('hmd-body').innerHTML = '<div class="hmm-loading"><div class="hmm-spin"></div>Loading entries…</div>';

  // Fetch day-level entries with references from server
  google.script.run
    .withSuccessHandler(function(data){
      if(!data || !data.success){
        // Fallback: show just category aggregates
        renderDayCategories(label, d);
        return;
      }
      // Filter entries for this specific day
      var dayEntries = (data.entries || []).filter(function(e){ return e.day === dayNum; });
      renderDayEntries(label, d, dayEntries);
    })
    .withFailureHandler(function(){
      // Fallback: show just category aggregates
      renderDayCategories(label, d);
    })
    .getCurrentMonthExpensesList(mIdx + 1, parseInt(p[0], 10));
}

/* Render day with just category aggregates (fallback) */
function renderDayCategories(label, d){
  var html = '<div class="hmm-day-date">📅 ' + label + '</div>';
  html += '<div class="hmm-day-total" style="color:#a5b4fc;">Total: ' + hmFmtFull(d.total) + '</div>';

  if(d.cats && Object.keys(d.cats).length > 0){
    html += '<div class="hmm-day-cats">';
    var sorted = Object.keys(d.cats).sort(function(a,b){ return d.cats[b] - d.cats[a]; });
    sorted.forEach(function(cn){
      var ci = (_hmData.categories||[]).find(function(c){ return c.name === cn; });
      var color = ci ? ci.color : '#94a3b8';
      var amt = d.cats[cn];
      var pct = d.total > 0 ? ((amt/d.total)*100).toFixed(1) : 0;
      html += '<div class="hmm-day-cat"><span class="hmm-day-cat-dot" style="background:' + color + ';"></span><span class="hmm-day-cat-name">' + cn + '</span><span class="hmm-day-cat-amt">' + hmFmtFull(amt) + ' <span style="font-weight:400;color:rgba(255,255,255,.3);font-size:.82em;">(' + pct + '%)</span></span></div>';
    });
    html += '</div>';
  }

  document.getElementById('hmd-body').innerHTML = html;
}

/* Render day with full entries including references */
function renderDayEntries(label, d, dayEntries){
  var html = '<div class="hmm-day-date">📅 ' + label + '</div>';
  html += '<div class="hmm-day-total" style="color:#a5b4fc;">Total: ' + hmFmtFull(d.total) + '</div>';

  if(dayEntries.length > 0){
    html += '<table class="hmm-table" style="margin-top:8px;"><thead><tr><th>Category</th><th>Reference</th><th style="text-align:right">Amount</th></tr></thead><tbody>';
    dayEntries.forEach(function(e){
      var ci = (_hmData.categories||[]).find(function(c){ return c.name === e.category; });
      var color = ci ? ci.color : '#94a3b8';
      html += '<tr>' +
        '<td class="hmm-cat"><span class="hmm-cat-dot" style="background:' + color + '"></span>' + (e.category || '—') + '</td>' +
        '<td class="hmm-ref">' + (e.reference || '—') + '</td>' +
        '<td class="hmm-amt">₨ ' + Math.round(e.amount).toLocaleString() + '</td>' +
        '</tr>';
    });
    html += '</tbody></table>';
  } else {
    // Fallback: show categories
    if(d.cats && Object.keys(d.cats).length > 0){
      html += '<div class="hmm-day-cats">';
      var sorted = Object.keys(d.cats).sort(function(a,b){ return d.cats[b] - d.cats[a]; });
      sorted.forEach(function(cn){
        var ci = (_hmData.categories||[]).find(function(c){ return c.name === cn; });
        var color = ci ? ci.color : '#94a3b8';
        var amt = d.cats[cn];
        var pct = d.total > 0 ? ((amt/d.total)*100).toFixed(1) : 0;
        html += '<div class="hmm-day-cat"><span class="hmm-day-cat-dot" style="background:' + color + ';"></span><span class="hmm-day-cat-name">' + cn + '</span><span class="hmm-day-cat-amt">' + hmFmtFull(amt) + ' <span style="font-weight:400;color:rgba(255,255,255,.3);font-size:.82em;">(' + pct + '%)</span></span></div>';
      });
      html += '</div>';
    }
  }

  document.getElementById('hmd-body').innerHTML = html;
}

function hmDayClose(){
  document.getElementById('hm-day-overlay').classList.remove('open');
}

/* ── Init ── */
hmLoad();

/* ══════════════════════════════════════════
   MONTH EXPENSE DETAIL MODAL
══════════════════════════════════════════ */
var _hmmMonth = -1;
var _hmmYear = -1;
var _hmmAllEntries = [];
var _hmmPage = 0;
var _hmmPageSize = 20;
var _hmmCats = [];

function hmMonthOpen(monthIdx){
  _hmmMonth = monthIdx;
  _hmmYear = _hmYear;
  _hmmPage = 0;
  _hmmCats = (_hmData && _hmData.categories) || [];
  document.getElementById('hm-month-overlay').classList.add('open');
  document.getElementById('hmm-title').textContent = '📋 ' + _hmMonthNames[monthIdx] + ' ' + _hmYear + ' Expenses';
  document.getElementById('hmm-sub').textContent = 'Loading…';
  document.getElementById('hmm-body').innerHTML = '<div class="hmm-loading"><div class="hmm-spin"></div>Loading entries…</div>';
  document.getElementById('hmm-search').value = '';

  var reqM = monthIdx + 1;
  google.script.run
    .withSuccessHandler(function(data){
      if(!data || !data.success){
        document.getElementById('hmm-body').innerHTML = '<div class="hmm-err">⚠ ' + (data ? data.error : 'Failed') + '</div>';
        return;
      }
      _hmmAllEntries = data.entries || [];
      var totalAmount = _hmmAllEntries.reduce(function(sum, e){ return sum + (e.amount || 0); }, 0);
      document.getElementById('hmm-sub').textContent = _hmMonthNames[_hmmMonth] + ' · ' + _hmmAllEntries.length + ' entries · Total: ' + hmFmtFull(totalAmount);
      hmMonthRender();
    })
    .withFailureHandler(function(){
      document.getElementById('hmm-body').innerHTML = '<div class="hmm-err">⚠ Error loading month data</div>';
    })
    .getCurrentMonthExpensesList(reqM, _hmYear);
}

function hmMonthClose(){
  document.getElementById('hm-month-overlay').classList.remove('open');
  _hmmAllEntries = [];
  _hmmPage = 0;
}

/* ── Year navigation from yearly totals bar ── */
function hmYearOpen(year){
  _hmYear = year;
  hmLoad();
}

function hmMonthRender(){
  var query = (document.getElementById('hmm-search').value || '').trim().toLowerCase();
  var filtered = _hmmAllEntries;

  // Apply search filter
  if(query){
    filtered = _hmmAllEntries.filter(function(e){
      return (e.category && e.category.toLowerCase().indexOf(query) >= 0) ||
             (e.reference && e.reference.toLowerCase().indexOf(query) >= 0) ||
             String(e.amount).indexOf(query) >= 0 ||
             String(e.day).indexOf(query) >= 0;
    });
  }

  // Sort by day ascending
  filtered.sort(function(a, b){ return a.day - b.day; });

  // Calculate filtered total
  var filteredTotal = filtered.reduce(function(sum, e){ return sum + (e.amount || 0); }, 0);

  var totalPages = Math.max(1, Math.ceil(filtered.length / _hmmPageSize));
  if(_hmmPage >= totalPages) _hmmPage = totalPages - 1;
  if(_hmmPage < 0) _hmmPage = 0;

  var start = _hmmPage * _hmmPageSize;
  var pageEntries = filtered.slice(start, start + _hmmPageSize);

  // Build table
  if(filtered.length === 0){
    document.getElementById('hmm-body').innerHTML = '<div class="hmm-empty">' + (query ? 'No expenses match your search.' : 'No expenses found for this month.') + '</div>';
  } else {
    var html = '<table class="hmm-table"><thead><tr><th>Date</th><th>Category</th><th>Reference</th><th style="text-align:right">Amount</th></tr></thead><tbody>';
    pageEntries.forEach(function(e){
      var ci = _hmmCats.find(function(c){ return c.name === e.category; });
      var color = ci ? ci.color : '#94a3b8';
      var dateStr = String(e.day).padStart(2,'0') + ' ' + _hmMonthNames[_hmmMonth];
      html += '<tr>' +
        '<td class="hmm-date">' + dateStr + '</td>' +
        '<td class="hmm-cat"><span class="hmm-cat-dot" style="background:' + color + '"></span>' + e.category + '</td>' +
        '<td class="hmm-ref">' + (e.reference || '—') + '</td>' +
        '<td class="hmm-amt">₨ ' + Math.round(e.amount).toLocaleString() + '</td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    document.getElementById('hmm-body').innerHTML = html;
  }

  // Pagination
  document.getElementById('hmm-pag-info').textContent = 'Showing ' + (filtered.length > 0 ? (start + 1) + '–' + Math.min(start + _hmmPageSize, filtered.length) : '0') + ' of ' + filtered.length;
  document.getElementById('hmm-pg-num').textContent = (_hmmPage + 1) + ' / ' + totalPages;
  document.getElementById('hmm-pg-prev').disabled = (_hmmPage <= 0);
  document.getElementById('hmm-pg-next').disabled = (_hmmPage >= totalPages - 1);

  // Update subtitle with filtered total
  var subEl = document.getElementById('hmm-sub');
  if(subEl){
    var baseLabel = _hmMonthNames[_hmmMonth];
    var searchNote = query ? ' · Search: ' + hmFmtFull(filteredTotal) : ' · Total: ' + hmFmtFull(filteredTotal);
    subEl.textContent = baseLabel + ' · ' + filtered.length + ' entries' + searchNote;
  }
}

function hmMonthPage(dir){
  _hmmPage += dir;
  hmMonthRender();
}

function hmMonthFilter(){
  _hmmPage = 0;
  hmMonthRender();
}
</script>

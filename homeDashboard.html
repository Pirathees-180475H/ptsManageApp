<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    :root {
      --bg:#05080f; --card:rgba(255,255,255,.033); --border:rgba(255,255,255,.07);
      --red:#ff4d6d; --green:#00e676; --blue:#00d4ff; --purple:#a855f7;
      --gold:#ffd700; --amber:#f59e0b; --teal:#2dd4bf;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:#fff;height:100vh;overflow:hidden;}
    body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.025) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0;}
    .orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:.09;animation:drift 16s ease-in-out infinite;pointer-events:none;}
    .o1{width:500px;height:500px;background:#ff4d6d;top:-160px;left:-140px;}
    .o2{width:420px;height:420px;background:#00e676;bottom:-120px;right:-100px;animation-delay:-6s;}
    .o3{width:300px;height:300px;background:#a855f7;top:40%;left:50%;animation-delay:-11s;}
    .o4{width:220px;height:220px;background:#00d4ff;top:60%;left:5%;animation-delay:-3s;}
    @keyframes drift{0%,100%{transform:translate(0,0);}40%{transform:translate(20px,-20px);}70%{transform:translate(-15px,15px);}}

    .page{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;padding:14px 18px;gap:10px;overflow:hidden;}

    /* header */
    .hdr{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .hdr-left{display:flex;align-items:center;gap:12px;}
    .hdr-logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,rgba(0,212,255,.22),rgba(168,85,247,.18));border:1px solid rgba(0,212,255,.28);display:flex;align-items:center;justify-content:center;font-size:1.15em;}
    .hdr-title{font-size:1.1em;font-weight:800;letter-spacing:-.4px;background:linear-gradient(135deg,#fff 0%,var(--blue) 55%,var(--purple) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .hdr-sub{font-size:.6em;color:rgba(255,255,255,.28);font-weight:500;margin-top:1px;}
    .hdr-right{display:flex;align-items:center;gap:8px;}
    .ts{font-size:.62em;color:rgba(255,255,255,.32);font-weight:600;background:var(--card);border:1px solid var(--border);padding:5px 11px;border-radius:18px;}
    .live{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pls 2s ease infinite;}
    @keyframes pls{0%,100%{opacity:1;}50%{opacity:.35;}}

    /* kpi bar */
    .kpi-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;flex-shrink:0;}
    .kpi{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:10px 14px;backdrop-filter:blur(20px);display:flex;align-items:center;gap:11px;transition:transform .2s;animation:fadeUp .5s ease both;}
    .kpi:hover{transform:translateY(-2px);}
    .kpi-ico{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.95em;}
    .kpi-label{font-size:.56em;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:1px;}
    .kpi-value{font-size:1.15em;font-weight:800;letter-spacing:-.5px;}
    .kpi-sub{font-size:.58em;color:rgba(255,255,255,.28);margin-top:1px;}

    /* grid */
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;flex:1;min-height:0;}

    /* tile */
    .tile{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:15px;backdrop-filter:blur(20px);display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s;animation:fadeUp .55s ease both;}
    .tile:hover{transform:translateY(-3px);}
    .tile::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);}
    .tile[data-m=cc]   {--ac:#00d4ff;}
    .tile[data-m=sw]   {--ac:#a855f7;}
    .tile[data-m=exp]  {--ac:#ff4d6d;}
    .tile[data-m=inv]  {--ac:#ffd700;}
    .tile[data-m=mf]   {--ac:#00e676;}
    .tile[data-m=port] {--ac:#2dd4bf;}
    .tile::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 3px 3px 0;background:var(--ac);box-shadow:0 0 10px var(--ac);opacity:.65;transition:opacity .25s;}
    .tile:hover::after{opacity:1;}
    .tile:hover{border-color:color-mix(in srgb,var(--ac) 28%,var(--border));box-shadow:0 14px 42px color-mix(in srgb,var(--ac) 14%,transparent);}

    /* tile header */
    .thdr{display:flex;align-items:center;gap:9px;}
    .tico{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.9em;background:color-mix(in srgb,var(--ac) 14%,transparent);border:1px solid color-mix(in srgb,var(--ac) 28%,transparent);}
    .tname{font-size:.72em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.48);flex:1;}
    .tarrow{font-size:.68em;color:color-mix(in srgb,var(--ac) 55%,transparent);background:color-mix(in srgb,var(--ac) 10%,transparent);border:1px solid color-mix(in srgb,var(--ac) 18%,transparent);padding:2px 8px;border-radius:7px;transition:all .2s;font-weight:700;}
    .tile:hover .tarrow{background:color-mix(in srgb,var(--ac) 22%,transparent);color:var(--ac);}

    /* tile big */
    .tbig-lbl{font-size:.6em;color:rgba(255,255,255,.28);font-weight:500;}
    .tbig-row{display:flex;align-items:baseline;gap:8px;}
    .tbig{font-size:1.45em;font-weight:800;letter-spacing:-.6px;color:var(--ac);text-shadow:0 0 28px color-mix(in srgb,var(--ac) 40%,transparent);line-height:1;}
    .delta{font-size:.58em;font-weight:700;padding:1px 6px;border-radius:5px;}
    .delta.up{background:rgba(0,230,118,.12);color:var(--green);}
    .delta.dn{background:rgba(255,77,109,.12);color:var(--red);}
    .delta.fl{background:rgba(255,255,255,.06);color:rgba(255,255,255,.28);}

    /* tile body metrics */
    .tbody{display:flex;flex-direction:column;gap:0;}
    .mrow{display:flex;align-items:baseline;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03);}
    .mrow:last-child{border-bottom:none;}
    .mlbl{font-size:.62em;color:rgba(255,255,255,.32);font-weight:500;}
    .mval{font-size:.78em;font-weight:700;text-align:right;}
    .mval.ac{color:var(--ac);}
    .mval.g{color:var(--green);}
    .mval.r{color:var(--red);}
    .mval.m{color:rgba(255,255,255,.28);}

    /* badges */
    .badge{display:inline-block;font-size:.52em;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:5px;}
    .badge.g{background:rgba(0,230,118,.14);color:var(--green);border:1px solid rgba(0,230,118,.22);}
    .badge.a{background:rgba(245,158,11,.14);color:#f59e0b;border:1px solid rgba(245,158,11,.22);}
    .badge.b{background:rgba(0,212,255,.1);color:var(--blue);border:1px solid rgba(0,212,255,.18);}

    /* cc card rows */
    .cc-row{display:flex;align-items:center;gap:7px;padding:4px 7px;border-radius:7px;background:rgba(255,255,255,.022);border:1px solid rgba(255,255,255,.045);margin-bottom:4px;}
    .cc-name{font-size:.66em;font-weight:600;color:rgba(255,255,255,.65);flex:1;}
    .cc-bal{font-size:.72em;font-weight:700;}

    /* chart wrap */
    .cwrap{position:relative;flex-shrink:0;}
    .cwrap canvas{display:block;}

    /* doughnut legend */
    .dleg{display:flex;gap:10px;justify-content:center;margin-top:5px;flex-wrap:wrap;}
    .dleg-item{display:flex;align-items:center;gap:5px;font-size:.58em;color:rgba(255,255,255,.45);}
    .dleg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

    /* add-expense tile (inside portfolio tile as secondary action) */
    .quick-add{margin-top:6px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.18);cursor:pointer;transition:background .2s;}
    .quick-add:hover{background:rgba(245,158,11,.15);}
    .qa-icon{font-size:1em;}
    .qa-body{flex:1;}
    .qa-title{font-size:.68em;font-weight:700;color:#f59e0b;}
    .qa-sub{font-size:.58em;color:rgba(255,255,255,.3);}
    .qa-arr{font-size:.68em;color:rgba(245,158,11,.5);font-weight:700;}

    /* loading */
    .loading{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:14px;color:rgba(255,255,255,.28);font-size:.82em;}
    .spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.06);border-top-color:var(--blue);animation:sp .9s linear infinite;}
    @keyframes sp{to{transform:rotate(360deg);}}

    @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
    .kpi:nth-child(1){animation-delay:.04s;} .kpi:nth-child(2){animation-delay:.08s;}
    .kpi:nth-child(3){animation-delay:.12s;} .kpi:nth-child(4){animation-delay:.16s;}
    .tile:nth-child(1){animation-delay:.12s;} .tile:nth-child(2){animation-delay:.18s;}
    .tile:nth-child(3){animation-delay:.24s;} .tile:nth-child(4){animation-delay:.30s;}
    .tile:nth-child(5){animation-delay:.36s;} .tile:nth-child(6){animation-delay:.42s;}
    ::-webkit-scrollbar{width:3px;} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px;}
  </style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div>
<div class="page" id="page"><div class="loading"><div class="spin"></div>Loading command centre…</div></div>

<script>
/* ── helpers ── */
function fmt(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  var a=Math.abs(n);
  return a>=1000000?(n/1000000).toFixed(2)+'M':a>=1000?(n/1000).toFixed(1)+'k':Number(n).toFixed(0);
}
function fmtFull(n){ return n||n===0 ? Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}) : '—'; }
function pct(a,b){ return b ? (a-b)/b*100 : 0; }
function shortMonth(s){
  s=(s||'').toString().trim().toUpperCase();
  var map={JAN:'Jan',FEB:'Feb',MAR:'Mar',APR:'Apr',MAY:'May',JUN:'Jun',JUL:'Jul',AUG:'Aug',SEP:'Sep',OCT:'Oct',NOV:'Nov',DEC:'Dec',JUNE:'Jun',JULY:'Jul',SEPT:'Sep',OTC:'Oct'};
  var part=s.split(/[\s\/\-]/)[0];
  return map[part]||map[part.slice(0,3)]||part.slice(0,3);
}

/* ── navigate to module ── */
function navTo(m){
  var fn={cc:'showCreditCardSummary',sw:'getFriendBalances',exp:'showExpenseDashboard',
          inv:'showInvestmentDashboard',mf:'showInvestFlow',port:'showPortfolioSummary',add:'showAddExpense'}[m];
  if(fn){ google.script.run[fn](); setTimeout(function(){google.script.host.close();},150); }
}

/* ── chart defaults ── */
function initChartDefaults(){
  Chart.defaults.color='rgba(255,255,255,0.38)';
  Chart.defaults.font.family='Inter';
}
var TIP={backgroundColor:'rgba(5,8,15,.96)',borderColor:'rgba(255,255,255,.1)',borderWidth:1,
         titleColor:'#fff',bodyColor:'rgba(255,255,255,.55)',padding:9,
         titleFont:{size:10,weight:'700'},bodyFont:{size:10}};

/* ── build gradient ── */
function grad(ctx,h,r,g,b,a1,a2){
  var gr=ctx.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'rgba('+r+','+g+','+b+','+a1+')');
  gr.addColorStop(1,'rgba('+r+','+g+','+b+','+a2+')');
  return gr;
}

/* ── render ── */
function render(D){
  var page=document.getElementById('page');
  var exp=D.expenses||{}, cc=D.creditCards||{}, inv=D.investments||{}, mf=D.moneyFlow||{}, port=D.portfolio||{};

  var now=new Date();
  var ts=now.toLocaleDateString('en-US',{weekday:'short',day:'numeric',month:'short',year:'numeric'})
       +' · '+now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});

  /* ── KPIs ── */
  var monthSpend  = exp.thisTotal||0, prevSpend=exp.prevTotal||0;
  var spendDelta  = pct(monthSpend,prevSpend);
  var swBal       = cc.swBalance!=null?cc.swBalance:null;
  var savingPct   = mf.savingPct||0;
  var portTotal   = port.total||0;   // net worth = portfolio (investments already inside it)
  var ccTotal     = (cc.cards||[]).reduce(function(s,c){return s+c.balance;},0);
  var invEarn     = (inv.utEarnings||0)+(inv.stockEarnings||0)+(inv.goldEarnings||0);

  var kpiHtml=`
    <div class="kpi-bar">
      <div class="kpi">
        <div class="kpi-ico" style="background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.24)">💎</div>
        <div><div class="kpi-label">Portfolio / Net Worth</div>
          <div class="kpi-value" style="color:#2dd4bf">${portTotal>0?'LKR '+fmt(portTotal):'—'}</div>
          <div class="kpi-sub">all assets combined</div></div>
      </div>
      <div class="kpi">
        <div class="kpi-ico" style="background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.24)">💸</div>
        <div><div class="kpi-label">Monthly Spend</div>
          <div class="kpi-value" style="color:#ff4d6d">${monthSpend?'LKR '+fmt(monthSpend):'—'}</div>
          <div class="kpi-sub">${exp.latestMonth||'latest month'}</div></div>
      </div>
      <div class="kpi">
        <div class="kpi-ico" style="background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.24)">🤝</div>
        <div><div class="kpi-label">Splitwise Balance</div>
          <div class="kpi-value" style="color:${swBal>0?'#00e676':swBal<0?'#ff4d6d':'rgba(255,255,255,.35)'}">${swBal!==null?(swBal>=0?'+':'')+fmt(swBal)+' LKR':'—'}</div>
          <div class="kpi-sub">${swBal>=0?'net owed to you':'net you owe'}</div></div>
      </div>
      <div class="kpi">
        <div class="kpi-ico" style="background:rgba(0,230,118,.1);border:1px solid rgba(0,230,118,.2)">📈</div>
        <div><div class="kpi-label">Savings Rate</div>
          <div class="kpi-value" style="color:#00e676">${savingPct?savingPct.toFixed(1)+'%':'—'}</div>
          <div class="kpi-sub">${mf.month||'latest month'}</div></div>
      </div>
    </div>`;

  /* ── CC tile ── */
  var ccUnsettled=(cc.cards||[]).filter(function(c){return !c.settled;}).length;
  var ccCardRows=(cc.cards||[]).map(function(c){
    var cls=c.balance>0?'r':'g';
    var badge=c.settled?'<span class="badge g">✓ Settled</span>':'<span class="badge a">Pending</span>';
    return `<div class="cc-row"><span class="cc-name">💳 ${c.name}</span>${badge}<span class="cc-bal ${cls}">${fmt(c.balance)}</span></div>`;
  }).join('');
  var ccTile=`
    <div class="tile" data-m="cc" onclick="navTo('cc')">
      <div class="thdr"><div class="tico">💳</div><div class="tname">Credit Cards</div><div class="tarrow">Open →</div></div>
      <div><div class="tbig-lbl">Total Outstanding</div>
        <div class="tbig-row">
          <div class="tbig">${ccTotal>0?'LKR '+fmt(ccTotal):'—'}</div>
          ${ccUnsettled>0?'<span class="delta dn">⚠ '+ccUnsettled+' pending</span>':'<span class="delta up">✓ All settled</span>'}
        </div></div>
      <div class="tbody">${ccCardRows}</div>
      <div class="cwrap" style="height:75px"><canvas id="cvsCC" height="75"></canvas></div>
    </div>`;

  /* ── Splitwise tile ── */
  var swTile=`
    <div class="tile" data-m="sw" onclick="navTo('sw')">
      <div class="thdr"><div class="tico">🤝</div><div class="tname">Splitwise</div><div class="tarrow">Open →</div></div>
      <div><div class="tbig-lbl">${swBal>=0?'People owe you':'You owe net'}</div>
        <div class="tbig" style="color:${swBal>=0?'var(--green)':'var(--red)'};text-shadow:0 0 28px ${swBal>=0?'rgba(0,230,118,.4)':'rgba(255,77,109,.4)'}">${swBal!==null?(swBal>=0?'+':'')+fmtFull(swBal)+' LKR':'—'}</div></div>
      <div class="tbody">
        <div class="mrow"><span class="mlbl">Sheet recorded balance</span><span class="mval ac">${swBal!==null?fmtFull(swBal)+' LKR':'—'}</span></div>
        <div class="mrow"><span class="mlbl">Status</span><span class="mval ${swBal>0?'g':swBal<0?'r':'m'}">${swBal>0?'Owed to you':swBal<0?'You owe':'Balanced'}</span></div>
        <div class="mrow"><span class="mlbl">Live data via Splitwise API</span><span class="mval m">click to load</span></div>
      </div>
      <div style="margin-top:auto;padding-top:6px;text-align:center">
        <div style="font-size:.58em;color:rgba(255,255,255,.18);border:1px dashed rgba(168,85,247,.2);border-radius:8px;padding:8px">
          Click to fetch live friend balances &amp; recent transactions
        </div>
      </div>
    </div>`;

  /* ── Expenses tile ── */
  var allM=(exp.allMonths||[]);
  var topCats=(exp.topCats||[]);
  var expCatRows=topCats.slice(0,2).map(function(c){
    return `<div class="mrow"><span class="mlbl">${c.name}</span><span class="mval ac">${fmt(c.val)}</span></div>`;
  }).join('');
  var dSign=spendDelta>=0?'▲':'▼';
  var dCls=spendDelta>=0?'dn':'up'; // spending up = bad
  var expTile=`
    <div class="tile" data-m="exp" onclick="navTo('exp')">
      <div class="thdr"><div class="tico">📊</div><div class="tname">Expenses</div><div class="tarrow">Open →</div></div>
      <div><div class="tbig-lbl">${exp.latestMonth||'Latest Month'}</div>
        <div class="tbig-row">
          <div class="tbig">${monthSpend?'LKR '+fmt(monthSpend):'—'}</div>
          ${prevSpend?`<span class="delta ${dCls}">${dSign} ${Math.abs(spendDelta).toFixed(1)}%</span>`:''}
        </div></div>
      <div class="tbody">${expCatRows}</div>
      <div class="cwrap" style="height:80px"><canvas id="cvsExp" height="80"></canvas></div>
    </div>`;

  /* ── Investments tile ── */
  var hasInvData = inv.month && (inv.utEarnings||inv.stockEarnings||inv.goldEarnings);
  var invTile=`
    <div class="tile" data-m="inv" onclick="navTo('inv')">
      <div class="thdr"><div class="tico">📈</div><div class="tname">Investments</div><div class="tarrow">Open →</div></div>
      <div><div class="tbig-lbl">Total Earnings · ${inv.month||''}</div>
        <div class="tbig-row">
          <div class="tbig" style="color:var(--gold)">${invEarn?(invEarn>=0?'+':'')+'LKR '+fmt(invEarn):'—'}</div>
        </div></div>
      <div class="tbody">
        <div class="mrow"><span class="mlbl">🏦 Unit Trust</span><span class="mval ${(inv.utEarnings||0)>=0?'g':'r'}">${fmt(inv.utEarnings)}</span></div>
        <div class="mrow"><span class="mlbl">📉 Stocks</span><span class="mval ${(inv.stockEarnings||0)>=0?'g':'r'}">${fmt(inv.stockEarnings)}</span></div>
        <div class="mrow"><span class="mlbl">🪙 Gold</span><span class="mval ${(inv.goldEarnings||0)>=0?'g':'r'}">${fmt(inv.goldEarnings)}</span></div>
      </div>
      ${hasInvData?`
      <div class="cwrap" style="height:80px"><canvas id="cvsInv" height="80"></canvas></div>
      <div class="dleg" id="invLeg"></div>`:''}
    </div>`;

  /* ── Money Flow tile ── */
  var savColor=savingPct>=30?'var(--green)':savingPct>=15?'var(--amber)':'var(--red)';
  var mfTile=`
    <div class="tile" data-m="mf" onclick="navTo('mf')">
      <div class="thdr"><div class="tico">💰</div><div class="tname">Money Flow</div><div class="tarrow">Open →</div></div>
      <div><div class="tbig-lbl">Savings Rate · ${mf.month||''}</div>
        <div class="tbig" style="color:${savColor}">${savingPct?savingPct.toFixed(1)+'%':'—'}</div></div>
      <div class="tbody">
        <div class="mrow"><span class="mlbl">Income</span><span class="mval g">LKR ${fmt(mf.income)}</span></div>
        <div class="mrow"><span class="mlbl">Sent home</span><span class="mval ac">LKR ${fmt(mf.sentHome)}</span></div>
        <div class="mrow"><span class="mlbl">Invested</span><span class="mval ac">LKR ${fmt(mf.totalInvested)}</span></div>
      </div>
      <div class="cwrap" style="height:80px"><canvas id="cvsMf" height="80"></canvas></div>
    </div>`;

  /* ── Portfolio tile ── */
  var portTile=`
    <div class="tile" data-m="port" onclick="navTo('port')">
      <div class="thdr"><div class="tico">📁</div><div class="tname">Portfolio</div><div class="tarrow">Open →</div></div>
      <div><div class="tbig-lbl">Total Portfolio Value</div>
        <div class="tbig" style="color:var(--teal)">${portTotal>0?'LKR '+fmt(portTotal):'—'}</div></div>
      <div class="tbody">
        <div class="mrow"><span class="mlbl">Investments (UT + Stock + Gold)</span><span class="mval ac">LKR ${fmt((inv.utInvested||0)+(inv.stockInvested||0)+(inv.goldInvested||0))}</span></div>
        <div class="mrow"><span class="mlbl">Investment earnings (latest)</span><span class="mval ${invEarn>=0?'g':'r'}">${invEarn?(invEarn>=0?'+':'')+fmt(invEarn):' —'} LKR</span></div>
        <div style="margin-top:3px;font-size:.58em;color:rgba(255,255,255,.18)">🔒 Password protected</div>
      </div>
      <div class="quick-add" onclick="event.stopPropagation();navTo('add')">
        <div class="qa-icon">➕</div>
        <div class="qa-body">
          <div class="qa-title">Add / Edit Expense</div>
          <div class="qa-sub">Open today's daily log</div>
        </div>
        <div class="qa-arr">→</div>
      </div>
    </div>`;

  /* ── compose ── */
  page.innerHTML=`
    <div class="hdr">
      <div class="hdr-left">
        <div class="hdr-logo">🏠</div>
        <div><div class="hdr-title">PTS Command Centre</div><div class="hdr-sub">Your complete financial overview</div></div>
      </div>
      <div class="hdr-right"><div class="live"></div><div class="ts">${ts}</div></div>
    </div>
    ${kpiHtml}
    <div class="grid">
      ${ccTile}${swTile}${expTile}
      ${invTile}${mfTile}${portTile}
    </div>`;

  /* ── init charts after paint ── */
  setTimeout(function(){ initCharts(D); }, 80);
}

/* ══════════════════════════════════════════════
   CHARTS
══════════════════════════════════════════════ */
function initCharts(D){
  initChartDefaults();
  var exp=D.expenses||{}, cc=D.creditCards||{}, inv=D.investments||{}, mf=D.moneyFlow||{};

  /* ── 1. CC grouped bar: balance vs last statement ── */
  var cvsCC=document.getElementById('cvsCC');
  if(cvsCC && (cc.cards||[]).length>0){
    var ctx=cvsCC.getContext('2d');
    var cards=cc.cards.filter(function(c){return c.name;});
    new Chart(ctx,{
      type:'bar',
      data:{
        labels:cards.map(function(c){return c.name;}),
        datasets:[
          {label:'Current Balance',data:cards.map(function(c){return c.balance;}),
           backgroundColor:grad(ctx,75,0,212,255,.55,.15),borderColor:'#00d4ff',borderWidth:2,borderRadius:5,borderSkipped:false},
          {label:'Last Statement',data:cards.map(function(c){return c.lastStatement;}),
           backgroundColor:grad(ctx,75,168,85,247,.45,.12),borderColor:'#a855f7',borderWidth:2,borderRadius:5,borderSkipped:false}
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,animation:{duration:1000},
        plugins:{legend:{display:false},tooltip:{...TIP,callbacks:{label:function(c){return ' '+c.dataset.label+': LKR '+fmtFull(c.parsed.y);}}}},
        scales:{
          x:{ticks:{color:'rgba(255,255,255,.35)',font:{size:8},maxRotation:0},grid:{display:false}},
          y:{ticks:{color:'rgba(255,255,255,.25)',font:{size:8},callback:function(v){return fmt(v);}},grid:{color:'rgba(255,255,255,.04)'}}
        }
      }
    });
  }

  /* ── 2. Expenses bar sparkline: last 6-8 months ── */
  var cvsExp=document.getElementById('cvsExp');
  if(cvsExp && (exp.allMonths||[]).length>0){
    var ctx=cvsExp.getContext('2d');
    var months=exp.allMonths;
    var barGrad=grad(ctx,80,255,77,109,.7,.2);
    var latestIdx=months.length-1;
    new Chart(ctx,{
      type:'bar',
      data:{
        labels:months.map(function(m){return shortMonth(m.label);}),
        datasets:[{
          data:months.map(function(m){return m.total;}),
          backgroundColor:months.map(function(m,i){
            return i===latestIdx?'rgba(255,77,109,.75)':'rgba(255,77,109,.28)';
          }),
          borderColor:months.map(function(m,i){
            return i===latestIdx?'#ff4d6d':'rgba(255,77,109,.5)';
          }),
          borderWidth:2,borderRadius:5,borderSkipped:false
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:false,animation:{duration:1100},
        plugins:{legend:{display:false},tooltip:{...TIP,callbacks:{
          title:function(c){return months[c[0].dataIndex].label;},
          label:function(c){return ' LKR '+fmtFull(c.parsed.y);}
        }}},
        scales:{
          x:{ticks:{color:'rgba(255,255,255,.32)',font:{size:8},maxRotation:0},grid:{display:false}},
          y:{display:false}
        }
      }
    });
  }

  /* ── 3. Investments doughnut: UT / Stock / Gold ── */
  var cvsInv=document.getElementById('cvsInv');
  if(cvsInv && inv){
    var utE=Math.abs(inv.utEarnings||0), stE=Math.abs(inv.stockEarnings||0), goE=Math.abs(inv.goldEarnings||0);
    var total=utE+stE+goE;
    if(total>0){
      var ctx=cvsInv.getContext('2d');
      var DCOLORS=['#ffd700','#00d4ff','#2dd4bf'];
      var DLABELS=['Unit Trust','Stocks','Gold'];
      new Chart(ctx,{
        type:'doughnut',
        data:{
          labels:DLABELS,
          datasets:[{
            data:[utE,stE,goE],
            backgroundColor:DCOLORS.map(function(c){return c+'44';}),
            borderColor:DCOLORS,borderWidth:2,hoverOffset:8
          }]
        },
        options:{
          responsive:true,maintainAspectRatio:false,cutout:'70%',
          animation:{animateRotate:true,duration:1300},
          plugins:{
            legend:{display:false},
            tooltip:{...TIP,callbacks:{
              label:function(c){
                var v=c.parsed;
                var p=total>0?(v/total*100).toFixed(1):'0';
                return ' '+DLABELS[c.dataIndex]+': LKR '+fmtFull(v)+' ('+p+'%)';
              }
            }}
          }
        }
      });
      // custom HTML legend
      var leg=document.getElementById('invLeg');
      if(leg){
        leg.innerHTML=DLABELS.map(function(l,i){
          return '<div class="dleg-item"><div class="dleg-dot" style="background:'+DCOLORS[i]+'"></div>'+l+'</div>';
        }).join('');
      }
    }
  }

  /* ── 4. Money flow savings rate line chart ── */
  var cvsMf=document.getElementById('cvsMf');
  if(cvsMf && (mf.history||[]).length>1){
    var ctx=cvsMf.getContext('2d');
    var hist=mf.history;
    var lineGrad=grad(ctx,80,0,230,118,.55,.05);
    var savColor=mf.savingPct>=30?'#00e676':mf.savingPct>=15?'#f59e0b':'#ff4d6d';
    new Chart(ctx,{
      type:'line',
      data:{
        labels:hist.map(function(h){return shortMonth(h.month);}),
        datasets:[{
          label:'Savings Rate',
          data:hist.map(function(h){return h.savingPct;}),
          borderColor:savColor,
          backgroundColor:grad(ctx,80,0,230,118,.4,.03),
          borderWidth:2.5,fill:true,tension:.4,
          pointBackgroundColor:savColor,
          pointRadius:3,pointHoverRadius:5,
          pointBorderColor:'rgba(0,0,0,.6)',pointBorderWidth:1
        }]
      },
      options:{
        responsive:true,maintainAspectRatio:false,animation:{duration:1200},
        plugins:{legend:{display:false},tooltip:{...TIP,callbacks:{
          label:function(c){return ' Savings rate: '+c.parsed.y.toFixed(1)+'%';}
        }}},
        scales:{
          x:{ticks:{color:'rgba(255,255,255,.32)',font:{size:8},maxRotation:0},grid:{display:false}},
          y:{ticks:{color:'rgba(255,255,255,.25)',font:{size:8},callback:function(v){return v+'%';}},
             grid:{color:'rgba(255,255,255,.04)'},min:0}
        }
      }
    });
  }
}

/* ── boot ── */
google.script.run
  .withSuccessHandler(render)
  .withFailureHandler(function(err){
    document.getElementById('page').innerHTML=
      '<div class="loading" style="color:#ff4d6d">⚠ Failed to load: '+(err.message||err)+'</div>';
  })
  .getHomeData();
</script>
</body>
</html>

<!-- ═══════════════════════════════════════════════════════════════
     TRACKERS  —  every tracker in one modal
     ───────────────────────────────────────────────────────────
     Replaces the old tracker modal in render.html and the four
     include files (budgetTracker, smokingTracker, notesTracker,
     habbits). One layout for all of them:

       Overview       needs-attention list, coming-up notes, a tile
                      per tracker, and search across every tracker
       Money owed     Rotations (read only) · Claims
       Commitments    Subscriptions · Installments · Budget
       Life           Habits (smoke-free + junk/drink calendar)
                      Notes · Losses & lessons

     One side drawer replaces the old per-tracker forms.

     Backend — all already in Code.gs, nothing new:
       getRotationData
       getInsuranceData · add/update/deleteInsuranceClaim
       getSubscriptions · add/deleteSubscription
                        · add/deleteSubscriptionUsage
       getInstallments  · updateInstallmentStatus · addInstallmentToExpense
       getBudgetData    · saveBudgetEntry · deleteBudgetEntry
       getSmokingData   · getHabbitsData(month, year)
       getNotesData     · saveNote · deleteNotes
       getLossesData    · add/update/deleteLossEntry

     Hooks:
       out — trackerToggle(id?)  opens / closes; id jumps to a tracker
             trackerClose()
       in  — haptic() when present
     The .tk-trigger button sits next to the tool wheel in every page
     header and carries a badge with the needs-attention count.

     Included from render.html via:  <?!= include('trackers'); ?>
═══════════════════════════════════════════════════════════════ -->

<script>
(function(){
  /* ═══ helpers ═════════════════════════════════════════════ */
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DAY_MS = 864e5;
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function num(n){ return Math.round(Number(n)||0).toLocaleString('en-IN'); }
  function rs(n){ return '₨ '+num(n); }
  function sumOf(arr, f){ return arr.reduce(function(s,x){ return s+(Number(f(x))||0); },0); }
  function pl(n, w, many){ return n+' '+(n===1?w:(many||w+'s')); }
  function pct(a,b){ return b>0 ? Math.round(a/b*100) : 0; }
  function tap(k){ if(typeof haptic==='function') haptic(k); }
  function nowMonthLabel(){ var d=new Date(); return MON[d.getMonth()]+' '+d.getFullYear(); }
  /* "Sep 2026" / "September 2026" → month index (y*12+m), or null */
  function monthKey(s){
    if(!s) return null;
    var m=String(s).match(/([A-Za-z]{3})[A-Za-z]*\.?\s+(\d{4})/);
    if(m){ var i=MON.map(function(x){return x.toLowerCase();}).indexOf(m[1].toLowerCase()); if(i>=0) return +m[2]*12+i; }
    var d=new Date(s); return isNaN(d.getTime()) ? null : d.getFullYear()*12+d.getMonth();
  }
  function curMonthKey(){ var d=new Date(); return d.getFullYear()*12+d.getMonth(); }
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function parseYmd(s){ var p=String(s||'').split('-'); if(p.length<3) return null; var d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d.getTime())?null:d; }
  function initials(s){ return String(s||'?').trim().split(/\s+/).map(function(w){return w.charAt(0);}).join('').slice(0,2).toUpperCase() || '?'; }
  function linkify(t){ return t.replace(/(\bhttps?:\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig, function(u){ return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'; }); }
  function run(fn){
    var args=Array.prototype.slice.call(arguments,1);
    return new Promise(function(res,rej){
      google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null,args);
    });
  }
  function errText(e){ return (e && (e.message||e.error)) || String(e||'Unknown error'); }

  var IC = {
    home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    swap:'<path d="M7 7h13l-4-4M17 17H4l4 4"/>',
    shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
    repeat:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
    cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    pie:'<path d="M21 12A9 9 0 1 1 12 3v9z"/>',
    leaf:'<path d="M5 21c0-9 6-15 16-16-1 10-7 16-16 16z"/><path d="M5 21l7-7"/>',
    note:'<path d="M5 3h10l4 4v14H5z"/><path d="M9 12h6M9 16h6"/>',
    down:'<path d="M3 7l6 6 4-4 8 8"/><path d="M21 11v6h-6"/>'
  };
  function svg(k){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+IC[k]+'</svg>'; }

  /* ═══ tracker registry ════════════════════════════════════ */
  var TK = [
    { id:'ov',     name:'Overview',         icon:'home',   c:'#00d4ff', sub:'What needs you, across every tracker' },
    { id:'rot',    name:'Rotations',        icon:'swap',   c:'#3b82f6', grp:'Money owed to me', sub:'Money you lent, by person', load:'getRotationData' },
    { id:'ins',    name:'Claims',           icon:'shield', c:'#a855f7', grp:'Money owed to me', sub:'Insurance claims, newest first', load:'getInsuranceData', add:'New claim', form:'claim' },
    { id:'sub',    name:'Subscriptions',    icon:'repeat', c:'#10b981', grp:'Commitments', sub:'Monthly services and who chips in', load:'getSubscriptions', add:'Log subscription', form:'subscription entry' },
    { id:'inst',   name:'Installments',     icon:'cal',    c:'#f59e0b', grp:'Commitments', sub:'Tap a status to switch Pending ↔ Settled', load:'getInstallments' },
    { id:'budget', name:'Budget',           icon:'pie',    c:'#fb923c', grp:'Commitments', sub:'Planned vs spent for one-off plans', load:'getBudgetData', add:'Budget item', form:'budget item' },
    { id:'hab',    name:'Habits',           icon:'leaf',   c:'#4ade80', grp:'Life', sub:'Smoke-free streak, junk food and drinks', load:'getSmokingData' },
    { id:'notes',  name:'Notes',            icon:'note',   c:'#38bdf8', grp:'Life', sub:'Dated notes; flagged ones show on the calendar', load:'getNotesData', add:'New note', form:'note' },
    { id:'loss',   name:'Losses & lessons', icon:'down',   c:'#ef4444', grp:'Life', sub:'What it cost and what you learned', load:'getLossesData', add:'Record loss', form:'loss' }
  ];
  var ALIAS = { smoke:'hab', habbit:'hab', habits:'hab', claims:'ins', subs:'sub', losses:'loss', overview:'ov' };
  function meta(id){ for(var i=0;i<TK.length;i++) if(TK[i].id===id) return TK[i]; return TK[0]; }

  /* ═══ state + cache ═══════════════════════════════════════ */
  var TTL = 5*60*1000;
  var C = {};          /* id → { ok, data, err, at } */
  var P = {};          /* id → in-flight promise */
  var S = { cur:'ov', q:'', f:{}, open:{}, refs:{}, habM:new Date().getMonth()+1, habY:new Date().getFullYear(), form:null };

  function load(id, force){
    var m = meta(id);
    if(!m.load) return Promise.resolve(null);
    var c = C[id];
    if(!force && c && c.ok && (Date.now()-c.at) < TTL) return Promise.resolve(c);
    if(P[id]) return P[id];
    P[id] = run(m.load).then(function(r){
      if(r && r.success===false) C[id] = { ok:false, err:r.error||'Could not load', at:Date.now() };
      else C[id] = { ok:true, data:r||{}, at:Date.now() };
      return C[id];
    }, function(e){
      C[id] = { ok:false, err:errText(e), at:Date.now() };
      return C[id];
    }).then(function(r){ delete P[id]; return r; });
    return P[id];
  }
  function habKey(){ return 'habm:'+S.habY+'-'+S.habM; }
  function loadHabMonth(force){
    var k = habKey(), c = C[k];
    if(!force && c && c.ok) return Promise.resolve(c);
    if(P[k]) return P[k];
    P[k] = run('getHabbitsData', S.habM, S.habY).then(function(r){
      C[k] = (r && r.success) ? { ok:true, data:r, at:Date.now() } : { ok:false, err:(r&&r.error)||'Could not load', at:Date.now() };
      return C[k];
    }, function(e){ C[k] = { ok:false, err:errText(e), at:Date.now() }; return C[k]; })
      .then(function(r){ delete P[k]; return r; });
    return P[k];
  }
  function loadAll(force){
    return Promise.all(TK.filter(function(t){return t.load;}).map(function(t){ return load(t.id, force); }));
  }
  function data(id){ var c=C[id]; return c && c.ok ? c.data : null; }

  /* ═══ derived records (one shape per tracker) ═════════════ */
  function rotRows(){
    var d=data('rot'); if(!d) return [];
    var now=Date.now();
    return (d.rotations||[]).map(function(r){
      var t=Date.parse(r.givenDate), age=isNaN(t)?(parseInt(r.passedDays,10)||0):Math.floor((now-t)/DAY_MS);
      return { name:r.name, date:r.givenDate||'—', days:r.passedDays, remarks:r.remarks, amount:Number(r.amount)||0, returned:!!r.returned, age:age };
    });
  }
  function claimStage(c){
    if(c.isSettled) return 'settled';
    if(c.isRejected) return 'rejected';
    if(c.isApproved) return 'approved';
    if(c.isSubmitted) return 'waiting';
    return 'draft';
  }
  var STAGE = { draft:['Not submitted','open'], waiting:['Submitted','info'], approved:['Approved','done'], settled:['Settled','done'], rejected:['Rejected','bad'] };
  function claimRows(){
    var d=data('ins'); if(!d) return [];
    return (d.claims||[]).map(function(c){ var o={}; for(var k in c) o[k]=c[k]; o.amount=Number(c.amount)||0; o.stage=claimStage(c); return o; })
      .sort(function(a,b){ return (b.date||'') > (a.date||'') ? 1 : (b.date||'') < (a.date||'') ? -1 : 0; });
  }
  function instList(){
    var d=data('inst'); if(!d) return [];
    return (d.installments||[]).map(function(p){
      return { name:p.name, entries:(p.entries||[]).map(function(e){
        var s=String(e.status||'').toLowerCase();
        return { name:p.name, num:e.num, month:e.month, amount:Number(e.amount)||0, status:e.status, st:s==='settled'?'done':s==='pending'?'open':'off', mk:monthKey(e.month) };
      }) };
    });
  }
  function budgetGroups(){
    var d=data('budget'); if(!d) return [];
    var g={}, order=[];
    (d.data||[]).forEach(function(it){
      var p=it.parent||'Uncategorized';
      if(!g[p]){ g[p]={ parent:p, budget:Number(it.budget)||0, type:it.type||'', items:[], spent:0, excluded:0 }; order.push(p); }
      var a=Number(it.expenseAmount)||0;
      g[p].items.push(it); g[p].spent+=a; if(it.isInclude===false) g[p].excluded+=a;
    });
    return order.sort().map(function(p){ var x=g[p]; x.rem=x.budget-x.spent; x.over=x.budget>0 && x.spent>x.budget; return x; });
  }
  var CLOSED_WORDS = ['no need','closed','cancelled','stopped','expired','ended'];
  function subPlatforms(){
    var d=data('sub'); if(!d) return [];
    var map={}, order=[];
    (d.entries||[]).forEach(function(e){
      if(!e.platform) return;
      var k=e.platform.toLowerCase();
      if(!map[k]){ map[k]={ key:k, name:e.platform, entries:[] }; order.push(k); }
      e.usages = Array.isArray(e.usages) ? e.usages.map(String)
               : (e.usages!=null && e.usages!=='' ? String(e.usages).split(',').map(function(x){return x.trim();}).filter(Boolean) : []);
      map[k].entries.push(e);
    });
    return order.map(function(k){
      var p=map[k];
      p.closed=p.entries.some(function(e){ var n=String(e.note||'').toLowerCase(); return CLOSED_WORDS.some(function(w){ return n.indexOf(w)>=0; }); });
      p.total=sumOf(p.entries,function(e){return e.netCost;});
      p.latest=p.entries[p.entries.length-1];
      return p;
    });
  }
  function subMonthLabel(m){
    var s=String(m||'');
    if(s.length>15){ var d=new Date(s); if(!isNaN(d.getTime())) return MON[d.getMonth()]+' '+d.getFullYear(); }
    return s||'—';
  }
  function noteGroups(){
    var d=data('notes'); if(!d) return [];
    var sorted=(d.data||[]).slice().sort(function(a,b){ return (a.date||'') < (b.date||'') ? -1 : (a.date||'') > (b.date||'') ? 1 : 0; });
    var groups=[];
    sorted.forEach(function(n){
      var last=groups[groups.length-1];
      if(last && last.reference===n.reference){
        var ld=parseYmd(last.dates[last.dates.length-1]), cd=parseYmd(n.date);
        if(ld && cd && Math.round((cd-ld)/DAY_MS)===1){ last.dates.push(n.date); last.rows.push(n.row); last.note=n; return; }
      }
      groups.push({ reference:n.reference, dates:[n.date], rows:[n.row], note:n });
    });
    return groups.reverse();
  }
  /* next occurrence of a note from today (yearly notes roll forward) */
  function noteNext(n){
    var d=parseYmd(n.date); if(!d) return null;
    var t=new Date(); t.setHours(0,0,0,0);
    if(n.yearly){ var x=new Date(t.getFullYear(), d.getMonth(), d.getDate()); if(x<t) x=new Date(t.getFullYear()+1, d.getMonth(), d.getDate()); return x; }
    return d>=t ? d : null;
  }
  function lossRows(){
    var d=data('loss'); if(!d) return [];
    return (d.losses||[]).slice().sort(function(a,b){
      if(!!a.isConfirmLoss!==!!b.isConfirmLoss) return a.isConfirmLoss?-1:1;
      return (Number(b.amount)||0)-(Number(a.amount)||0);
    });
  }

  /* ═══ needs-attention (drives badges + overview) ══════════ */
  function attention(){
    var out=[], cm=curMonthKey();
    var due=[]; instList().forEach(function(p){ p.entries.forEach(function(e){ if(e.st==='open' && e.mk!=null && e.mk<=cm) due.push(e); }); });
    if(due.length){
      var late=due.filter(function(e){return e.mk<cm;}).length;
      out.push({ id:'inst', c:'#f59e0b', t:'<b>'+due.length+' installment'+(due.length>1?'s':'')+'</b> due this month'+(late?' · '+late+' from earlier months':''), a:rs(sumOf(due,function(e){return e.amount;})) });
    }
    var cl=claimRows();
    var draft=cl.filter(function(c){return c.stage==='draft';}), wait=cl.filter(function(c){return c.stage==='waiting';}), appr=cl.filter(function(c){return c.stage==='approved';});
    if(draft.length) out.push({ id:'ins', c:'#f59e0b', t:'<b>'+draft.length+' claim'+(draft.length>1?'s':'')+'</b> not submitted yet', a:rs(sumOf(draft,function(c){return c.amount;})) });
    if(wait.length)  out.push({ id:'ins', c:'#38bdf8', t:'<b>'+wait.length+' claim'+(wait.length>1?'s':'')+'</b> waiting on the insurer', a:rs(sumOf(wait,function(c){return c.amount;})) });
    if(appr.length)  out.push({ id:'ins', c:'#10b981', t:'<b>'+appr.length+' approved claim'+(appr.length>1?'s':'')+'</b> not paid out yet', a:rs(sumOf(appr,function(c){return c.amount;})) });
    var over=budgetGroups().filter(function(g){return g.over;});
    if(over.length) out.push({ id:'budget', c:'#ef4444', t:over.slice(0,3).map(function(g){return '<b>'+esc(g.parent)+'</b>';}).join(', ')+(over.length>3?' +'+(over.length-3):'')+' over budget', a:'+ '+rs(sumOf(over,function(g){return g.spent-g.budget;})) });
    var old=rotRows().filter(function(r){return !r.returned && r.age>60;});
    if(old.length){
      var who={}; old.forEach(function(r){ who[r.name]=(who[r.name]||0)+r.amount; });
      var names=Object.keys(who).sort(function(a,b){return who[b]-who[a];});
      out.push({ id:'rot', c:'#3b82f6', t:'<b>'+esc(names[0])+'</b>'+(names.length>1?' and '+(names.length-1)+' more':'')+' · lent over 60 days ago', a:rs(sumOf(old,function(r){return r.amount;})) });
    }
    var noLesson=lossRows().filter(function(l){ return l.isConfirmLoss && !String(l.lesson||'').trim(); });
    if(noLesson.length) out.push({ id:'loss', c:'#ef4444', t:'<b>'+noLesson.length+' confirmed loss'+(noLesson.length>1?'es':'')+'</b> without a lesson written down', a:rs(sumOf(noLesson,function(l){return l.amount;})) });
    return out;
  }
  function counts(){
    var n={}, cm=curMonthKey();
    n.inst = 0; instList().forEach(function(p){ p.entries.forEach(function(e){ if(e.st==='open' && e.mk!=null && e.mk<=cm) n.inst++; }); });
    n.ins  = claimRows().filter(function(c){return c.stage==='draft'||c.stage==='waiting'||c.stage==='approved';}).length;
    n.budget = budgetGroups().filter(function(g){return g.over;}).length;
    n.rot  = rotRows().filter(function(r){return !r.returned && r.age>60;}).length;
    n.loss = lossRows().filter(function(l){ return l.isConfirmLoss && !String(l.lesson||'').trim(); }).length;
    var d=data('notes'), t=new Date(); t.setHours(0,0,0,0);
    n.notes = d ? (d.data||[]).filter(function(x){ var nx=noteNext(x); return nx && (nx-t)/DAY_MS<=7; }).length : 0;
    return n;
  }
  var CNT_CLS = { inst:'open', ins:'open', budget:'bad', rot:'open', loss:'bad', notes:'info' };
  function updateBadge(){
    var total = attention().length;
    document.querySelectorAll('.tk-trigger .tk-badge').forEach(function(b){
      b.textContent = total>9 ? '9+' : String(total);
      b.hidden = !total;
    });
  }

  /* ═══ rail ════════════════════════════════════════════════ */
  function hitsFor(id, q){
    var out=[];
    function has(){ for(var i=0;i<arguments.length;i++) if(String(arguments[i]||'').toLowerCase().indexOf(q)>=0) return true; return false; }
    if(id==='rot') rotRows().forEach(function(r){ if(has(r.name,r.remarks)) out.push({ t:r.name, s:(r.remarks||r.date)+(r.returned?' · returned':' · pending'), a:r.amount }); });
    if(id==='ins') claimRows().forEach(function(c){ if(has(c.ref,c.provider,c.reason)) out.push({ t:c.ref, s:(c.provider||'')+' · '+STAGE[c.stage][0], a:c.amount }); });
    if(id==='sub') subPlatforms().forEach(function(p){ if(has(p.name) || p.entries.some(function(e){return has(e.plan,e.note,e.collectionFrom);})) out.push({ t:p.name, s:p.entries.length+' entries'+(p.closed?' · closed':''), a:p.total }); });
    if(id==='inst') instList().forEach(function(p){ if(has(p.name)) out.push({ t:p.name, s:p.entries.length+' payments', a:sumOf(p.entries.filter(function(e){return e.st==='open';}),function(e){return e.amount;}) }); });
    if(id==='budget') budgetGroups().forEach(function(g){ if(has(g.parent,g.type) || g.items.some(function(it){return has(it.expenseDesc);})) out.push({ t:g.parent, s:(g.type||'General')+' · '+g.items.length+' items', a:g.spent }); });
    if(id==='notes') noteGroups().forEach(function(g){ if(has(g.reference,g.note.category)) out.push({ t:g.reference, s:g.dates[0]+(g.note.category?' · '+g.note.category:''), a:null }); });
    if(id==='loss') lossRows().forEach(function(l){ if(has(l.ref,l.lesson)) out.push({ t:l.ref, s:l.lesson||'No lesson yet', a:l.amount }); });
    return out;
  }
  function renderRail(){
    var n=counts(), q=S.q, last=null, h='';
    TK.forEach(function(t){
      if(q && t.id!=='ov' && t.id!=='hab' && t.name.toLowerCase().indexOf(q)<0 && !hitsFor(t.id,q).length) return;
      if(q && t.id==='hab' && t.name.toLowerCase().indexOf(q)<0) return;
      if(t.grp && t.grp!==last){ h+='<div class="tk-grp">'+t.grp+'</div>'; last=t.grp; }
      var c=n[t.id]||0;
      h+='<button type="button" class="tk-ri'+(S.cur===t.id?' on':'')+'" data-go="'+t.id+'" style="--c:'+t.c+'"><span class="tk-ic" style="background:'+t.c+'22;color:'+t.c+'">'+svg(t.icon)+'</span><span class="tk-nm">'+t.name+'</span>'+(c?'<span class="tk-cnt '+CNT_CLS[t.id]+'">'+c+'</span>':'')+'</button>';
    });
    $('tk-nav').innerHTML = h;
  }

  /* ═══ view building blocks ════════════════════════════════ */
  function sum3(items){
    return '<div class="tk-sum">'+items.map(function(x){ return '<div'+(x[2]?' class="s'+x[2].slice(1)+'"':'')+'><small>'+x[0]+'</small><b class="'+(x[2]||'')+'">'+x[1]+'</b>'+(x[3]?'<em>'+x[3]+'</em>':'')+'</div>'; }).join('')+'</div>';
  }
  function ribbon(parts){
    var tot=sumOf(parts,function(p){return p[1];});
    if(!tot) return '';
    return '<div><div class="tk-rib">'+parts.map(function(p){ return p[1]>0?'<i style="width:'+(p[1]/tot*100).toFixed(2)+'%;background:'+p[2]+'"></i>':''; }).join('')+'</div>'+
      '<div class="tk-lg">'+parts.map(function(p){ return p[1]>0?'<span><i style="background:'+p[2]+'"></i>'+esc(p[0])+' '+pct(p[1],tot)+'%'+(p[3]?' · '+p[3]:'')+'</span>':''; }).join('')+'</div></div>';
  }
  function filterBar(id, opts, withSearch){
    var f=S.f[id]||opts[0][0];
    var h='<div class="tk-bar">'+opts.filter(function(o){ return o[0]==='all' || o[2]!==0 || o[0]===f; }).map(function(o){
      return '<button type="button" class="tk-chip'+(f===o[0]?' on':'')+'" data-filt="'+id+'|'+o[0]+'">'+o[1]+(o[2]!=null?' '+o[2]:'')+'</button>';
    }).join('');
    if(withSearch!==false) h+='<span class="tk-sp"></span><input class="tk-fq" id="tk-fq" type="search" placeholder="Filter this list" value="'+esc(S.q)+'" aria-label="Filter this list">';
    return h+'</div>';
  }
  function curFilter(id, def){ return S.f[id]||def; }
  function matches(){ var q=S.q; if(!q) return true; for(var i=0;i<arguments.length;i++) if(String(arguments[i]||'').toLowerCase().indexOf(q)>=0) return true; return false; }
  function groupOpen(id, key, idx){ var k=id+'|'+key; return S.open[k]!==undefined ? S.open[k] : !!S.q; }
  function group(id, key, idx, head, inner){
    return '<div class="tk-g'+(groupOpen(id,key,idx)?' open':'')+'" data-gkey="'+esc(id+'|'+key)+'" style="--gc:'+gcolor(key)+'">'+
      '<button type="button" class="tk-g-hd">'+head.av+'<span class="tk-g-nm"><b>'+esc(head.title)+'</b><small>'+head.sub+'</small></span>'+
      '<span class="tk-g-amt">'+head.amt+'<small>'+head.amtLbl+'</small></span><span class="tk-chev">›</span></button>'+
      (head.prog!=null?'<div class="tk-g-prog'+(head.progCls?' '+head.progCls:'')+'"><i style="width:'+Math.max(0,Math.min(100,head.prog)).toFixed(0)+'%"></i></div>':'')+
      '<div class="tk-g-rows">'+inner+'</div></div>';
  }
  function av(txt){ return '<span class="tk-av">'+esc(txt)+'</span>'; }
  /* each group gets its own colour, fixed by name so it never jumps around when filtering */
  var GC = ['#60a5fa','#f472b6','#34d399','#fbbf24','#a78bfa','#22d3ee','#fb7185','#a3e635','#fb923c','#2dd4bf','#e879f9','#facc15'];
  function gcolor(key){ var h=0; key=String(key||''); for(var i=0;i<key.length;i++) h=(h*31+key.charCodeAt(i))|0; return GC[Math.abs(h)%GC.length]; }
  function ref(id, obj){ var a=S.refs[id]||(S.refs[id]=[]); a.push(obj); return a.length-1; }
  function empty(msg){ return '<div class="tk-empty">'+msg+'</div>'; }
  function delBtn(act, i, label){ return '<button type="button" class="tk-mini del" data-act="'+act+'" data-i="'+i+'" data-confirm="1">'+(label||'Delete')+'</button>'; }

  /* ═══ Overview ════════════════════════════════════════════ */
  function vOverview(){
    if(S.q){
      var h='<div class="tk-sec">Results for “'+esc(S.q)+'”</div>', any=false;
      TK.forEach(function(t){
        if(!t.load || t.id==='hab') return;
        hitsFor(t.id, S.q).slice(0,8).forEach(function(x){
          any=true;
          h+='<button type="button" class="tk-hit" data-go="'+t.id+'" style="--c:'+t.c+'"><span class="tk-ic" style="background:'+t.c+'22;color:'+t.c+'">'+svg(t.icon)+'</span><span><b>'+esc(x.t)+'</b><small>'+t.name+' · '+esc(x.s)+'</small></span><span class="tk-am">'+(x.a!=null?rs(x.a):'')+'</span></button>';
        });
      });
      return any ? h : h+empty('Nothing in any tracker matches that.');
    }
    var att=attention(), h2='';
    if(att.length){
      h2+='<div class="tk-att"><div class="tk-att-hd">Needs attention · '+att.length+'</div>'+att.map(function(a){
        return '<button type="button" class="tk-att-row" data-go="'+a.id+'"><span class="dot" style="background:'+a.c+'"></span><span class="t">'+a.t+'</span><span class="a">'+a.a+'</span></button>';
      }).join('')+'</div>';
    } else {
      var loading=TK.some(function(t){ return t.load && !C[t.id]; });
      h2+='<div class="tk-att calm"><div class="tk-att-hd">'+(loading?'Checking your trackers…':'All clear')+'</div><div class="tk-att-none">'+(loading?'Loading every tracker in the background.':'No installments due, claims waiting or budgets over.')+'</div></div>';
    }
    /* coming up: notes in the next 14 days */
    var nd=data('notes');
    if(nd){
      var t0=new Date(); t0.setHours(0,0,0,0);
      var seen={}, up=[];
      (nd.data||[]).forEach(function(n){ var nx=noteNext(n); if(!nx) return; var dd=Math.round((nx-t0)/DAY_MS); if(dd>14) return; var k=n.reference+'|'+(n.category||''); if(seen[k] && seen[k].d<=nx) return; if(seen[k]) up.splice(up.indexOf(seen[k]),1); seen[k]={ n:n, d:nx, dd:dd }; up.push(seen[k]); });
      up.sort(function(a,b){return a.d-b.d;});
      if(up.length){
        h2+='<div class="tk-att up"><div class="tk-att-hd">Coming up · next 14 days</div>'+up.slice(0,6).map(function(u){
          var when = u.dd===0?'Today':u.dd===1?'Tomorrow':u.d.getDate()+' '+MON[u.d.getMonth()];
          return '<button type="button" class="tk-att-row" data-go="notes"><span class="dot" style="background:#38bdf8"></span><span class="t"><b>'+esc(u.n.reference)+'</b>'+(u.n.category?' · '+esc(u.n.category):'')+'</span><span class="a">'+when+'</span></button>';
        }).join('')+'</div>';
      }
    }
    h2+='<div class="tk-sec">All trackers</div><div class="tk-tiles">'+TK.filter(function(t){return t.load;}).map(function(t){
      var f=tileFigure(t.id);
      return '<button type="button" class="tk-tile" data-go="'+t.id+'" style="--c:'+t.c+'"><span class="th"><span class="tk-ic" style="background:'+t.c+'22;color:'+t.c+'">'+svg(t.icon)+'</span>'+t.name+'</span><span class="tv">'+f[0]+'</span><span class="ts">'+f[1]+'</span></button>';
    }).join('')+'</div>';
    return h2;
  }
  function tileFigure(id){
    var c=C[id];
    if(!c) return ['…','Loading'];

  var MILESTONES = [
    ['Blood pressure', 20/(24*60), 'back to normal'], ['Oxygen level', 8/24, 'back to normal'],
    ['Carbon monoxide', 1, 'drops out of blood'], ['Heart attack risk', 2, 'starts to fall'],

  function smokeStats(d){
    if(!d || !d.lastSmokeDate) return null;
    var last=new Date(d.lastSmokeDate); if(isNaN(last.getTime())) return null;
    var now=new Date(), ms=now-last; if(ms<0) return null;
    var days=Math.floor(ms/DAY_MS);
    var y=now.getFullYear()-last.getFullYear(), mo=now.getMonth()-last.getMonth(), dd=now.getDate()-last.getDate();
    if(dd<0){ mo--; dd+=new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
    if(mo<0){ y--; mo+=12; }
    var skipped=days*(Number(d.dailyCount)||0);
    return { last:last, days:days, fdays:ms/DAY_MS, hours:Math.floor(ms/36e5)%24, y:y, mo:mo, d:dd, skipped:skipped, saved:skipped*(Number(d.piecePrice)||0) };
  }
  function vHab(){
    var s=smokeStats(data('hab')), mc=C[habKey()], md=mc&&mc.ok?mc.data:null;
    var jd=md?(md.junkDays||[]):[], dr=md?(md.drinkDays||[]):[];
    var dim=new Date(S.habY, S.habM, 0).getDate();

  /* ═══ Notes ═══════════════════════════════════════════════ */
  function vNotes(){
    var d=data('notes'), all=(d&&d.data)||[], cats=(d&&d.categories)||[];

    var soon=all.filter(function(n){ var x=noteNext(n); return x && (x-t0)/DAY_MS<=30; }).length;
    var h=sum3([['Notes',all.length,''],['On calendar',all.filter(function(n){return n.calendar;}).length,'c-info'],['Next 30 days',soon,soon?'c-open':'']]);
    if(!all.length) return h+empty('No notes yet. Use “+ New note” to write one.');
    var used={}; all.forEach(function(n){ var c=n.category||'Uncategorized'; used[c]=(used[c]||0)+1; });
    var f=curFilter('notes','all');
    h+=filterBar('notes',[['all','All',all.length],['cal','On calendar',all.filter(function(n){return n.calendar;}).length]].concat(Object.keys(used).sort().map(function(c){return ['c:'+c, c, used[c]];})));
    var body='';
    noteGroups().forEach(function(g){

      if(f==='cal' && !n.calendar) return;

      if(!(amt>0)) return msg('Enter an amount above zero.');
      var out=segVal('out'), subm=segVal('sub')==='1';
      var p={ date:val('tkf-date'), ref:ref, provider:val('tkf-prov'), source:$('tkf-src').value, amount:amt,
              isSubmitted:subm, submittedDate:subm?val('tkf-subdate'):'', isApproved:out==='approved', isRejected:out==='rejected',
              isSettled:segVal('set')==='1', reason:val('tkf-reason') };
      if(f.rec){ p.rowIndex=parseInt(f.rec.rowIndex,10); job=run('updateInsuranceClaim', p); }
      else job=run('addInsuranceClaim', p);
    }
    else if(f.kind==='loss'){
      var lr=val('tkf-ref'), la=val('tkf-amt');
      if(!lr || !la) return msg('Enter a reference and an amount.');
      var conf=segVal('conf')==='1';
      job = f.rec ? run('updateLossEntry', f.rec.rowIndex, lr, la, val('tkf-lesson'), conf)
                  : run('addLossEntry', lr, la, val('tkf-lesson'), conf);
    }
    else if(f.kind==='budget'){
      var parent=val('tkf-parent');
      if(!parent) return msg('Enter the plan this item belongs to.');
      job=run('saveBudgetEntry', { row:f.rec?f.rec.row:null, parent:parent, type:val('tkf-type'), budget:numVal('tkf-budget'),
        expenseDesc:val('tkf-desc'), expenseAmount:numVal('tkf-amt'), isInclude:segVal('inc')!=='0' });
    }
    else if(f.kind==='sub'){
      var month=val('tkf-month'), plat=val('tkf-plat');
      if(!month || !plat) return msg('Month and platform are required.');
      var us=val('tkf-usage');
      job=run('addSubscription', { month:month, platform:plat, plan:val('tkf-plan'), cost:numVal('tkf-cost'), collections:numVal('tkf-coll'),
        collectionFrom:val('tkf-cfrom'), netCost:numVal('tkf-net'), note:val('tkf-note'),
        usages: us ? us.split(',').map(function(s){return s.trim();}).filter(Boolean) : [] });
    }
    else if(f.kind==='notes'){
      var nref=val('tkf-ref'), from=val('tkf-date');
      if(!nref) return msg('Write the note first.');
      if(!from) return msg('Pick a date.');
      var dates=[];
      if(segVal('multi')==='1'){
        var upto=val('tkf-upto');
        if(!upto) return msg('Pick the last day, or switch “Spans several days” off.');
        var d0=parseYmd(from), d1=parseYmd(upto);
        if(!d0 || !d1 || d1<d0) return msg('“Up to” must be on or after the first date.');
        if(Math.round((d1-d0)/DAY_MS)>366) return msg('A note can span at most a year.');
        for(var d=new Date(d0); d<=d1; d.setDate(d.getDate()+1)) dates.push(ymd(d));
      } else dates=[from];
      var notes=dates.map(function(dt){ return { row:null, date:dt, category:val('tkf-cat'), reference:nref, yearly:segVal('yr')==='1', calendar:segVal('cal')==='1' }; });
      job = f.rec
        ? run('deleteNotes', f.rec.rows).then(function(r){ if(r && r.success===false) throw new Error(r.error||'Could not replace the old note'); return run('saveNote', notes); })
        : run('saveNote', notes);
    }
    if(!job) return;
    btn.disabled=true; btn.textContent='Saving…';
    job.then(function(r){
      btn.disabled=false; btn.textContent='Save';
      if(r && r.success===false){ msg(r.error||'Could not save.'); tap('error'); return; }
      closeDrawer(); toast('Saved'); refresh(id);
    }, function(e){
      btn.disabled=false; btn.textContent='Save';
      msg('Could not save: '+errText(e)); tap('error');
    });
  }
  $('tk-dr-save').addEventListener('click', save);
  $('tk-dr-x').addEventListener('click', closeDrawer);
  $('tk-dr-cancel').addEventListener('click', closeDrawer);
  $('tk-add').addEventListener('click', function(){ if(meta(S.cur).add) openDrawer(S.cur); });
  $('tk-reload').addEventListener('click', function(){
    if(S.cur==='ov'){ TK.forEach(function(t){ if(t.load) delete C[t.id]; }); render(); ensure('ov', true); }
    else refresh(S.cur);
  });

  /* ═══ row actions ═════════════════════════════════════════ */
  function arm(btn, fn){
    if(btn.classList.contains('armed')){ btn.classList.remove('armed'); clearTimeout(btn._t); fn(); return; }
    btn.classList.add('armed'); btn._orig=btn._orig||btn.textContent; btn.textContent='Tap again to confirm';
    btn._t=setTimeout(function(){ btn.classList.remove('armed'); btn.textContent=btn._orig; }, 3000);
  }
  function act(fnName, args, id, okMsg, btn){
    if(btn){ btn.disabled=true; btn.classList.add('busy'); }
    run.apply(null, [fnName].concat(args)).then(function(r){
      if(r && r.success===false){ if(btn){ btn.disabled=false; btn.classList.remove('busy'); } toast(r.error||'That did not work', true); return; }
      toast(okMsg); if(id) refresh(id);
    }, function(e){
      if(btn){ btn.disabled=false; btn.classList.remove('busy'); }
      toast('Failed: '+errText(e), true);
    });
  }
  function doAction(b){
    var a=b.getAttribute('data-act'), i=+b.getAttribute('data-i'), x;
    switch(a){
      case 'retry': refresh(S.cur); break;
      case 'hab-nav':
        S.habM+=+b.getAttribute('data-dir');
        if(S.habM<1){ S.habM=12; S.habY--; } if(S.habM>12){ S.habM=1; S.habY++; }
        render(); loadHabMonth().then(function(){ if(S.cur==='hab') render(); });
        break;
      case 'ins-edit': openDrawer('ins', S.refs.ins[i]); break;
      case 'ins-del': x=S.refs.ins[i]; arm(b, function(){ act('deleteInsuranceClaim',[x.rowIndex],'ins','Claim deleted',b); }); break;
      case 'loss-edit': openDrawer('loss', S.refs.loss[i]); break;
      case 'loss-del': x=S.refs.loss[i]; arm(b, function(){ act('deleteLossEntry',[x.rowIndex],'loss','Loss deleted',b); }); break;
      case 'loss-st': x=S.refs.loss[i]; act('updateLossEntry',[x.rowIndex, x.ref, x.amount, x.lesson||'', !x.isConfirmLoss],'loss', x.isConfirmLoss?'Marked unconfirmed':'Marked confirmed', b); break;
      case 'bud-edit': openDrawer('budget', S.refs.budget[i]); break;
      case 'bud-addto': x=S.refs.budg[i]; openDrawer('budget', null); $('tkf-parent').value=x.parent; $('tkf-type').value=x.type||''; $('tkf-budget').value=x.budget; $('tk-dr-title').textContent='New item in '+x.parent; setTimeout(function(){ var d=$('tkf-desc'); if(d) d.focus(); },70); break;
      case 'bud-del': x=S.refs.budget[i]; arm(b, function(){ act('deleteBudgetEntry',[x.row],'budget','Item deleted',b); }); break;
      case 'note-edit': openDrawer('notes', S.refs.notes[i]); break;
      case 'note-del': x=S.refs.notes[i]; arm(b, function(){ act('deleteNotes',[x.rows],'notes', x.rows.length>1?x.rows.length+' notes deleted':'Note deleted', b); }); break;
      case 'inst-st':
        x=S.refs.inst[i];
        act('updateInstallmentStatus',[x.name, x.num, x.st==='open'?'Settled':'Pending', x.month, x.amount],'inst', x.st==='open'?'Marked settled':'Marked pending', b);
        break;
      case 'inst-add':
        x=S.refs.inst[i];
        var lka=new Date(Date.now()+(5*60+30)*60*1000), key=(lka.getUTCMonth()+1)+'-'+lka.getUTCDate(), mode=b.getAttribute('data-mode');
        act('addInstallmentToExpense',[x.name, x.amount, key, mode], null, mode==='other'?'Added to other expenses':mode==='card'?'Added to card':'Added to Splitwise', b);
        setTimeout(function(){ b.disabled=false; b.classList.remove('busy'); }, 2500);
        break;
      case 'sub-del': x=S.refs.sub[i]; arm(b, function(){ act('deleteSubscription',[x.rowIndex],'sub','Entry removed',b); }); break;
      case 'sub-again':
        x=S.refs.subp[i].latest;
        arm(b, function(){
          act('addSubscription',[{ month:nowMonthLabel(), platform:x.platform, plan:x.plan, cost:Number(x.cost)||0, collections:Number(x.collections)||0,
            collectionFrom:x.collectionFrom||'', netCost:Number(x.netCost)||0, note:x.note||'', usages:[] }],'sub','Logged for '+nowMonthLabel(), b);
        });
        break;
      case 'sub-ushow': var w=$('tk-ua-'+i); if(w){ w.hidden=!w.hidden; if(!w.hidden) $('tk-ui-'+i).focus(); } break;
      case 'sub-uadd':
        x=S.refs.sub[i]; var tv=val('tk-ui-'+i);
        if(!tv) return;
        act('addSubscriptionUsage',[{ rowIndex:x.rowIndex, usageText:tv }],'sub','Usage added', b);
        break;
      case 'sub-udel': x=S.refs.sub[i]; act('deleteSubscriptionUsage',[{ rowIndex:x.rowIndex, usageIndex:+b.getAttribute('data-u') }],'sub','Usage removed', b); break;
    }
  }

  /* ═══ delegated events ════════════════════════════════════ */
  $('tk-body').addEventListener('click', function(e){
    var t=e.target;
    var g=t.closest('[data-go]'); if(g){ go(g.getAttribute('data-go')); return; }
    var f=t.closest('[data-filt]'); if(f){ var p=f.getAttribute('data-filt').split('|'); S.f[p[0]]=p.slice(1).join('|'); render(); return; }
    var hd=t.closest('.tk-g-hd'); if(hd){ var box=hd.parentNode; box.classList.toggle('open'); S.open[box.getAttribute('data-gkey')]=box.classList.contains('open'); return; }
    var a=t.closest('[data-act]'); if(a && !a.disabled) doAction(a);
  });
  $('tk-body').addEventListener('input', function(e){
    if(e.target.id==='tk-fq'){ S.q=e.target.value.trim().toLowerCase(); $('tk-q').value=e.target.value; render(); }
  });
  $('tk-body').addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.getAttribute('data-enter')){ e.preventDefault(); var b=e.target.parentNode.querySelector('[data-act="'+e.target.getAttribute('data-enter')+'"]'); if(b) doAction(b); }
  });
  $('tk-nav').addEventListener('click', function(e){ var b=e.target.closest('[data-go]'); if(b) go(b.getAttribute('data-go')); });
  $('tk-q').addEventListener('input', function(){ S.q=this.value.trim().toLowerCase(); render(); });
  $('tk-overlay').addEventListener('click', function(e){ if(e.target===this) close(); });
  document.querySelectorAll('#tk-modal [data-tk-close]').forEach(function(b){ b.addEventListener('click', close); });
  document.addEventListener('keydown', function(e){
    if(e.key!=='Escape' || !isOpen()) return;
    if(S.form){ closeDrawer(); } else close();
  });

  /* ═══ warm up after boot so the header badge is current ═══ */
  function prefetch(){ loadAll().then(updateBadge); }
  window.addEventListener('load', function(){ setTimeout(prefetch, 5000); });
})();
</script>

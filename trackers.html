<!-- ═══════════════════════════════════════════════════════════════
     TRACKERS  —  every tracker in one modal
     ───────────────────────────────────────────────────────────
     Replaces the old tracker modal in render.html and the four
     include files (budgetTracker, smokingTracker, notesTracker,
     habbits). One layout for all of them:

       Overview       a card per tracker (picture + small chart; a tap
                      opens it) and search across every tracker
       Money owed     Rotations (read only) · Claims
       Commitments    Subscriptions · Installments · Budget
       Life           Habits (smoke-free + junk/drink calendar)
                      Notes · Losses & lessons

     One side drawer replaces the old per-tracker forms.

     Backend — all already in Code.gs, nothing new:
       getRotationData
       getInsuranceData · add/update/deleteInsuranceClaim
       getSubscriptions · add/deleteSubscription
                        · add/deleteSubscriptionUsage
       getInstallments  · updateInstallmentStatus · addInstallmentToExpense
       getBudgetData    · saveBudgetEntry · deleteBudgetEntry
       getSmokingData   · getHabbitsData(month, year)
       getNotesData     · saveNote · deleteNotes
       getLossesData    · add/update/deleteLossEntry

     Hooks:
       out — trackerToggle(id?)  opens / closes; id jumps to a tracker
             trackerClose()
       in  — haptic() when present
     The .tk-trigger button sits next to the tool wheel in every page
     header. No counts or badges anywhere — the trackers are opened
     on purpose, not nagged about.

     Included from render.html via:  <?!= include('trackers'); ?>
═══════════════════════════════════════════════════════════════ -->

#tk-modal .tk-daylist div{display:grid;grid-template-columns:26px 18px 1fr auto;gap:8px;align-items:center;font-size:11.5px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04);color:var(--tk-ink2);}
#tk-modal .tk-daylist div:last-child{border-bottom:0;}
#tk-modal .tk-daylist b{font-variant-numeric:tabular-nums;color:var(--tk-ink);}
#tk-modal .tk-daylist i{width:8px;height:8px;border-radius:2px;}

/* notes */
#tk-modal .tk-note{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--tk-bdr);border-radius:12px;background:rgba(255,255,255,.02);flex:none;}
#tk-modal .tk-nd{text-align:center;line-height:1.1;padding-top:2px;}
#tk-modal .tk-nd b{display:block;font-size:18px;font-weight:800;}
#tk-modal .tk-nd small{font-size:9.5px;color:var(--tk-mut);letter-spacing:.8px;font-weight:700;text-transform:uppercase;}
#tk-modal .tk-nt{min-width:0;}
#tk-modal .tk-nt .ref{font-size:13px;font-weight:600;word-break:break-word;}
#tk-modal .tk-nt .ref a{color:var(--tk-info);text-decoration:none;}
#tk-modal .tk-nt .meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:5px;font-size:11px;color:var(--tk-mut);}
#tk-modal .tk-note-acts{display:flex;gap:4px;}

/* drawer (one form for every tracker) */
#tk-modal .tk-drawer{position:absolute;top:0;right:0;bottom:0;width:360px;max-width:100%;background:rgba(10,15,30,.97);border-left:1px solid var(--tk-bdr);box-shadow:-20px 0 50px rgba(0,0,0,.45);transform:translateX(104%);opacity:.4;visibility:hidden;transition:transform .3s cubic-bezier(.22,.8,.26,1),opacity .3s ease,visibility 0s linear .3s;display:flex;flex-direction:column;z-index:5;will-change:transform;}
#tk-modal .tk-drawer.open{transform:none;opacity:1;visibility:visible;transition:transform .34s cubic-bezier(.22,.8,.26,1),opacity .2s ease;}
#tk-modal .tk-drawer.open .tk-dr-body > *{animation:tkRise .34s cubic-bezier(.22,.8,.26,1) both;}
#tk-modal .tk-drawer.open .tk-dr-body > *:nth-child(2){animation-delay:.03s;}
#tk-modal .tk-drawer.open .tk-dr-body > *:nth-child(3){animation-delay:.06s;}
#tk-modal .tk-drawer.open .tk-dr-body > *:nth-child(4){animation-delay:.09s;}
#tk-modal .tk-drawer.open .tk-dr-body > *:nth-child(n+5){animation-delay:.12s;}
#tk-modal .tk-drawer.swap .tk-dr-body{animation:tkFade .22s ease;}
@keyframes tkRise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
@keyframes tkFade{from{opacity:.2;}to{opacity:1;}}
#tk-modal .tk-scrim{position:absolute;inset:0;z-index:4;background:rgba(3,6,14,.5);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s;}
#tk-modal .tk-scrim.open{opacity:1;visibility:visible;transition:opacity .3s ease;}
#tk-modal .tk-dr-hd{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--tk-bdr);}
#tk-modal .tk-dr-hd b{font-size:14px;}
#tk-modal .tk-dr-body{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:11px;margin:0;}
#tk-modal .tk-f label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--tk-mut);margin-bottom:4px;}
#tk-modal .tk-f input,#tk-modal .tk-f select,#tk-modal .tk-f textarea{width:100%;background:var(--tk-field);border:1px solid var(--tk-bdr);border-radius:9px;color:var(--tk-ink);font:500 13px 'Inter',sans-serif;padding:8px 10px;color-scheme:dark;}
#tk-modal .tk-f textarea{resize:vertical;min-height:64px;}
#tk-modal .tk-f .hint{font-size:11px;color:var(--tk-mut);margin-top:4px;}
#tk-modal .tk-f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
#tk-modal .tk-seg{display:flex;gap:4px;flex-wrap:wrap;}
#tk-modal .tk-seg button{flex:1;min-width:0;height:30px;padding:0 8px;border-radius:8px;border:1px solid var(--tk-bdr);background:var(--tk-field);color:var(--tk-ink2);font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;}
#tk-modal .tk-seg button.on{border-color:rgba(99,102,241,.55);background:rgba(99,102,241,.18);color:#fff;}
#tk-modal .tk-dr-msg{font-size:12px;color:#ff7b7b;min-height:0;}
#tk-modal .tk-dr-msg:empty{display:none;}
#tk-modal .tk-dr-ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--tk-bdr);}

#tk-modal .tk-toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,20px);opacity:0;background:rgba(10,15,30,.96);border:1px solid rgba(16,185,129,.4);color:#6ee7b7;font-size:12px;font-weight:700;padding:8px 14px;border-radius:10px;transition:.2s;pointer-events:none;z-index:6;max-width:90%;text-align:center;}
#tk-modal .tk-toast.err{border-color:rgba(239,68,68,.5);color:#ff9b9b;}
#tk-modal .tk-toast.show{opacity:1;transform:translate(-50%,0);}

/* ── colour tones: the modal accent follows the open tracker, groups get their own ── */
#tk-modal .tk-hd{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--tk-acc) 35%,transparent);}

#tk-modal .tk-sec{color:color-mix(in srgb,var(--tk-acc) 60%,rgba(255,255,255,.6));}
#tk-modal .tk-sum > div{--sc:var(--tk-acc);background:linear-gradient(180deg,color-mix(in srgb,var(--sc) 10%,transparent),rgba(255,255,255,.02));border-color:color-mix(in srgb,var(--sc) 22%,transparent);}

#tk-modal .tk-g.open > .tk-g-hd{background:color-mix(in srgb,var(--gc) 8%,transparent);}
#tk-modal .tk-av{background:color-mix(in srgb,var(--gc,var(--tk-acc)) 18%,transparent);color:var(--gc,var(--tk-acc));}
#tk-modal .tk-g-nm small{color:color-mix(in srgb,var(--gc) 35%,rgba(255,255,255,.5));}
#tk-modal .tk-chev{color:var(--gc);}
#tk-modal .tk-g-tools{background:color-mix(in srgb,var(--gc) 6%,transparent);color:#aab6ca;}
#tk-modal .tk-g-prog i{background:var(--gc);}
#tk-modal .tk-row:hover{background:rgba(255,255,255,.025);}
#tk-modal .tk-dt{color:#8fa6cc;}
#tk-modal .tk-tx small{color:#a3a9b8;}
#tk-modal .tk-flow{color:#94a3b8;}
#tk-modal .tk-usage{background:rgba(167,139,250,.06);border:1px solid rgba(167,139,250,.14);}
#tk-modal .tk-usage-hd{color:#c4b5fd;}
#tk-modal .tk-note{border-left:3px solid rgba(56,189,248,.45);}
#tk-modal .tk-nd b{color:#7dd3fc;}
#tk-modal .tk-drawer{background:rgba(10,15,30,.97);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);}
#tk-modal .tk-dr-hd{box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--tk-acc) 35%,transparent);}
#tk-modal .tk-f label{color:color-mix(in srgb,var(--tk-acc) 45%,rgba(255,255,255,.55));}
#tk-modal .tk-f input:focus,#tk-modal .tk-f select:focus,#tk-modal .tk-f textarea:focus{border-color:color-mix(in srgb,var(--tk-acc) 55%,transparent);outline:none;}

/* ── card design ── */
#tk-modal{--tk-lift:0 1px 0 rgba(255,255,255,.05) inset,0 8px 24px -12px rgba(0,0,0,.55);}
/* summary cards: soft glass with a coloured glow in the corner */
#tk-modal .tk-sum > div{position:relative;overflow:hidden;border-radius:14px;padding:12px 14px 11px;box-shadow:var(--tk-lift);
  background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--sc) 20%,transparent),transparent 60%),linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));}
#tk-modal .tk-sum > div::before{content:'';position:absolute;left:14px;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--sc);}
#tk-modal .tk-sum b{font-size:19px;margin-top:3px;}
#tk-modal .tk-sum em{display:block;margin-top:1px;}
/* group cards */
#tk-modal .tk-g{border-radius:14px;box-shadow:var(--tk-lift);transition:border-color .18s,background .18s;}
#tk-modal .tk-g-hd{padding:12px 14px;}
#tk-modal .tk-av{width:34px;height:34px;border-radius:11px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gc,var(--tk-acc)) 30%,transparent);}
#tk-modal .tk-g-amt{font-size:13.5px;}
#tk-modal .tk-g-prog{height:3px;margin:0 14px;border-radius:3px;background:rgba(255,255,255,.06);}
#tk-modal .tk-g.open .tk-g-prog{margin-bottom:0;}
#tk-modal .tk-g-rows{border-top-color:color-mix(in srgb,var(--gc) 18%,transparent);margin-top:10px;}
#tk-modal .tk-g:not(.open) .tk-g-prog{margin-bottom:12px;}
#tk-modal .tk-g-hd .tk-chev{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 10%,transparent);}
/* rotation heat: more pending → redder card; all returned → calm green */
#tk-modal .tk-g.heat{background:linear-gradient(135deg,color-mix(in srgb,#ef4444 var(--hb),transparent),color-mix(in srgb,#ef4444 calc(var(--hb) / 3),transparent));
  border-color:color-mix(in srgb,#ef4444 var(--hl),transparent);border-left-color:var(--gc);}
#tk-modal .tk-g.heat > .tk-g-hd{background:none;}
#tk-modal .tk-g.heat .tk-g-amt{color:color-mix(in srgb,var(--gc) 70%,#fff);}
#tk-modal .tk-g.heat .tk-av{background:color-mix(in srgb,var(--gc) 26%,transparent);color:#fff;}
#tk-modal .tk-g.calm{background:linear-gradient(135deg,rgba(52,211,153,.06),transparent 70%);border-color:rgba(52,211,153,.2);border-left-color:#34d399;}
#tk-modal .tk-g.calm .tk-g-amt{color:#6ee7b7;}
/* rows */
#tk-modal .tk-row{margin:6px 8px;border-radius:10px;border:1px solid transparent;border-bottom:1px solid rgba(255,255,255,.04);}
#tk-modal .tk-row:hover{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.06);}
#tk-modal .tk-row.r-bad{background:linear-gradient(90deg,rgba(239,68,68,.16),rgba(239,68,68,.05));border-color:rgba(239,68,68,.3);box-shadow:inset 3px 0 0 #ef4444;}
#tk-modal .tk-row.r-bad .tk-tx b{color:#fecaca;}
#tk-modal .tk-row.r-bad .tk-dt{color:#fca5a5;}
#tk-modal .tk-row.r-warn{background:linear-gradient(90deg,rgba(250,204,21,.14),rgba(250,204,21,.04));border-color:rgba(250,204,21,.3);box-shadow:inset 3px 0 0 #facc15;}
#tk-modal .tk-row.r-warn .tk-tx b{color:#fef08a;}
#tk-modal .tk-row.r-warn .tk-dt{color:#fde047;}
#tk-modal .tk-row.r-warn .tk-am{color:#fde047;}
/* notes + hits */
#tk-modal .tk-note{border-radius:14px;box-shadow:var(--tk-lift);background:linear-gradient(90deg,rgba(56,189,248,.07),rgba(255,255,255,.015) 45%);}
#tk-modal .tk-nd{background:rgba(56,189,248,.1);border-radius:10px;padding:6px 0;}
#tk-modal .tk-hit{border-radius:12px;box-shadow:var(--tk-lift);background:linear-gradient(90deg,color-mix(in srgb,var(--c,#00d4ff) 8%,transparent),rgba(255,255,255,.015) 50%);}
/* habits boxes */
#tk-modal .tk-box{border-radius:15px;box-shadow:var(--tk-lift);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));}
#tk-modal .tk-kv div{border:1px solid rgba(255,255,255,.05);}
#tk-modal .tk-cal span{transition:transform .12s;}
#tk-modal .tk-cal span[title]:hover{transform:scale(1.08);}

/* ── overview cards: a picture and a small chart per tracker ── */
#tk-modal .tk-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;}
#tk-modal .tk-tile{position:relative;overflow:hidden;border-radius:20px;border:1px solid var(--tk-bdr);cursor:pointer;text-align:left;color:inherit;min-width:0;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 13%,transparent),rgba(255,255,255,.025) 55%);
  padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;min-height:262px;
  transition:transform .18s,border-color .18s,box-shadow .18s;}
#tk-modal .tk-tile:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 55%,transparent);
  box-shadow:0 18px 40px rgba(0,0,0,.35),0 0 0 1px color-mix(in srgb,var(--c) 25%,transparent);}
#tk-modal .tk-tile:active{transform:translateY(-1px) scale(.99);}
#tk-modal .tk-art{position:absolute;right:-26px;top:-30px;width:170px;height:170px;pointer-events:none;}
#tk-modal .tk-tile .th{display:flex;align-items:center;gap:10px;position:relative;font-size:14px;font-weight:800;}
#tk-modal .tk-tile .th .tk-ic{width:34px;height:34px;border-radius:11px;}
#tk-modal .tk-tile .th .tk-ic svg{width:17px;height:17px;}
#tk-modal .tk-tile .tv{position:relative;font-size:24px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#tk-modal .tk-tile .ts{position:relative;font-size:12px;color:var(--tk-ink2);margin-top:-8px;}
#tk-modal .tk-tile .viz{position:relative;margin-top:auto;min-width:0;}
#tk-modal .tk-tile .ft{position:relative;display:flex;justify-content:flex-end;font-size:11.5px;font-weight:700;padding-top:10px;border-top:1px solid var(--tk-bdr);
  color:color-mix(in srgb,var(--c) 60%,#fff);}

/* chart cards inside a tracker */
#tk-modal .tk-grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;flex:none;}
#tk-modal .tk-card{border-radius:16px;background:var(--tk-card);border:1px solid var(--tk-bdr);padding:15px 16px;display:flex;flex-direction:column;gap:12px;min-width:0;flex:none;
  position:relative;overflow:hidden;}
#tk-modal .tk-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--tk-acc),color-mix(in srgb,var(--tk-acc) 40%,#8b5cf6));opacity:.8;}
#tk-modal .tk-card h3{margin:0;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--tk-ink2);display:flex;align-items:center;gap:10px;}
#tk-modal .tk-card h3 .rule{flex:1;height:1px;background:var(--tk-bdr);}
#tk-modal .tk-card h3 .aux{font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--tk-mut);}
#tk-modal .tk-ovh{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--tk-ink2);}
#tk-modal .tk-ovh .rule{flex:1;height:1px;background:var(--tk-bdr);}
#tk-modal .tk-ovh .aux{font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--tk-mut);}

/* horizontal bars: label · track · value */
#tk-modal .tk-hb{display:flex;flex-direction:column;gap:10px;}
#tk-modal .tk-hb-r{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:12px;align-items:center;}

<script>
(function(){
  /* ═══ helpers ═════════════════════════════════════════════ */
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DAY_MS = 864e5;
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function num(n){ return Math.round(Number(n)||0).toLocaleString('en-IN'); }
  function rs(n){ return '₨ '+num(n); }
  function sumOf(arr, f){ return arr.reduce(function(s,x){ return s+(Number(f(x))||0); },0); }
  function pl(n, w, many){ return n+' '+(n===1?w:(many||w+'s')); }
  function pct(a,b){ return b>0 ? Math.round(a/b*100) : 0; }
  function tap(k){ if(typeof haptic==='function') haptic(k); }
  function nowMonthLabel(){ var d=new Date(); return MON[d.getMonth()]+' '+d.getFullYear(); }
  /* "Sep 2026" / "September 2026" → month index (y*12+m), or null */
  function monthKey(s){
    if(!s) return null;
    var m=String(s).match(/([A-Za-z]{3})[A-Za-z]*\.?\s+(\d{4})/);
    if(m){ var i=MON.map(function(x){return x.toLowerCase();}).indexOf(m[1].toLowerCase()); if(i>=0) return +m[2]*12+i; }
    var d=new Date(s); return isNaN(d.getTime()) ? null : d.getFullYear()*12+d.getMonth();
  }
  function curMonthKey(){ var d=new Date(); return d.getFullYear()*12+d.getMonth(); }
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function parseYmd(s){ var p=String(s||'').split('-'); if(p.length<3) return null; var d=new Date(+p[0],+p[1]-1,+p[2]); return isNaN(d.getTime())?null:d; }
  function initials(s){ return String(s||'?').trim().split(/\s+/).map(function(w){return w.charAt(0);}).join('').slice(0,2).toUpperCase() || '?'; }
  function linkify(t){ return t.replace(/(\bhttps?:\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig, function(u){ return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'; }); }
  function run(fn){
    var args=Array.prototype.slice.call(arguments,1);
    return new Promise(function(res,rej){
      google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null,args);
    });
  }
  function errText(e){ return (e && (e.message||e.error)) || String(e||'Unknown error'); }

  var IC = {
    home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
    swap:'<path d="M7 7h13l-4-4M17 17H4l4 4"/>',
    shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
    repeat:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>',
    cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    pie:'<path d="M21 12A9 9 0 1 1 12 3v9z"/>',
    leaf:'<path d="M5 21c0-9 6-15 16-16-1 10-7 16-16 16z"/><path d="M5 21l7-7"/>',
    note:'<path d="M5 3h10l4 4v14H5z"/><path d="M9 12h6M9 16h6"/>',
    down:'<path d="M3 7l6 6 4-4 8 8"/><path d="M21 11v6h-6"/>'
  };
  function svg(k){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+IC[k]+'</svg>'; }

  /* ═══ tracker registry ════════════════════════════════════ */
  var TK = [
    { id:'ov',     name:'Overview',         icon:'home',   c:'#818cf8', sub:'Every tracker at a glance · tap a card to open it' },
    { id:'rot',    name:'Rotations',        icon:'swap',   c:'#3b82f6', grp:'Money owed to me', sub:'Money you lent, by person', load:'getRotationData' },
    { id:'ins',    name:'Claims',           icon:'shield', c:'#a855f7', grp:'Money owed to me', sub:'Insurance claims, newest first', load:'getInsuranceData', add:'New claim', form:'claim' },
    { id:'sub',    name:'Subscriptions',    icon:'repeat', c:'#10b981', grp:'Commitments', sub:'Monthly services and who chips in', load:'getSubscriptions', add:'Log subscription', form:'subscription entry' },
    { id:'inst',   name:'Installments',     icon:'cal',    c:'#f59e0b', grp:'Commitments', sub:'Tap a status to switch Pending ↔ Settled', load:'getInstallments' },
    { id:'budget', name:'Budget',           icon:'pie',    c:'#fb923c', grp:'Commitments', sub:'Planned vs spent for one-off plans', load:'getBudgetData', add:'Budget item', form:'budget item' },
    { id:'hab',    name:'Habits',           icon:'leaf',   c:'#4ade80', grp:'Life', sub:'Smoke-free streak, junk food and drinks', load:'getSmokingData' },
    { id:'notes',  name:'Notes',            icon:'note',   c:'#38bdf8', grp:'Life', sub:'Dated notes; flagged ones show on the calendar', load:'getNotesData', add:'New note', form:'note' },
    { id:'loss',   name:'Losses & lessons', icon:'down',   c:'#ef4444', grp:'Life', sub:'What it cost and what you learned', load:'getLossesData', add:'Record loss', form:'loss' }
  ];
  var ALIAS = { smoke:'hab', habbit:'hab', habits:'hab', claims:'ins', subs:'sub', losses:'loss', overview:'ov' };
  function meta(id){ for(var i=0;i<TK.length;i++) if(TK[i].id===id) return TK[i]; return TK[0]; }

  /* ═══ state + cache ═══════════════════════════════════════ */
  var TTL = 5*60*1000;
  var C = {};          /* id → { ok, data, err, at } */
  var P = {};          /* id → in-flight promise */
  var S = { cur:'ov', q:'', f:{}, open:{}, refs:{}, habM:new Date().getMonth()+1, habY:new Date().getFullYear(), form:null };

  function load(id, force){
    var m = meta(id);
    if(!m.load) return Promise.resolve(null);
    var c = C[id];
    if(!force && c && c.ok && (Date.now()-c.at) < TTL) return Promise.resolve(c);
    if(P[id]) return P[id];
    P[id] = run(m.load).then(function(r){
      if(r && r.success===false) C[id] = { ok:false, err:r.error||'Could not load', at:Date.now() };
      else C[id] = { ok:true, data:r||{}, at:Date.now() };
      return C[id];
    }, function(e){
      C[id] = { ok:false, err:errText(e), at:Date.now() };
      return C[id];
    }).then(function(r){ delete P[id]; return r; });
    return P[id];
  }
  function habKey(){ return 'habm:'+S.habY+'-'+S.habM; }
  function loadHabMonth(force){
    var k = habKey(), c = C[k];
    if(!force && c && c.ok) return Promise.resolve(c);
    if(P[k]) return P[k];
    P[k] = run('getHabbitsData', S.habM, S.habY).then(function(r){
      C[k] = (r && r.success) ? { ok:true, data:r, at:Date.now() } : { ok:false, err:(r&&r.error)||'Could not load', at:Date.now() };
      return C[k];
    }, function(e){ C[k] = { ok:false, err:errText(e), at:Date.now() }; return C[k]; })
      .then(function(r){ delete P[k]; return r; });
    return P[k];
  }
  function loadAll(force){
    return Promise.all(TK.filter(function(t){return t.load;}).map(function(t){ return load(t.id, force); }).concat([loadHabMonth(force)]));
  }
  function data(id){ var c=C[id]; return c && c.ok ? c.data : null; }

  /* ═══ derived records (one shape per tracker) ═════════════ */
  function rotRows(){
    var d=data('rot'); if(!d) return [];
    var now=Date.now();
    return (d.rotations||[]).map(function(r){
      var t=Date.parse(r.givenDate), age=isNaN(t)?(parseInt(r.passedDays,10)||0):Math.floor((now-t)/DAY_MS);
      return { name:r.name, date:r.givenDate||'—', days:r.passedDays, remarks:r.remarks, amount:Number(r.amount)||0, returned:!!r.returned, age:age };
    });
  }
  function claimStage(c){
    if(c.isSettled) return 'settled';
    if(c.isRejected) return 'rejected';
    if(c.isApproved) return 'approved';
    if(c.isSubmitted) return 'waiting';
    return 'draft';
  }
  var STAGE = { draft:['Not submitted','open'], waiting:['Submitted','info'], approved:['Approved','done'], settled:['Settled','done'], rejected:['Rejected','bad'] };
  function claimRows(){
    var d=data('ins'); if(!d) return [];
    return (d.claims||[]).map(function(c){ var o={}; for(var k in c) o[k]=c[k]; o.amount=Number(c.amount)||0; o.stage=claimStage(c); return o; })
      .sort(function(a,b){ return (b.date||'') > (a.date||'') ? 1 : (b.date||'') < (a.date||'') ? -1 : 0; });
  }
  function instList(){
    var d=data('inst'); if(!d) return [];
    return (d.installments||[]).map(function(p){
      return { name:p.name, entries:(p.entries||[]).map(function(e){
        var s=String(e.status||'').toLowerCase();
        return { name:p.name, num:e.num, month:e.month, amount:Number(e.amount)||0, status:e.status, st:s==='settled'?'done':s==='pending'?'open':'off', mk:monthKey(e.month) };
      }) };
    });
  }
  function budgetGroups(){
    var d=data('budget'); if(!d) return [];
    var g={}, order=[];
    (d.data||[]).forEach(function(it){
      var p=it.parent||'Uncategorized';
      if(!g[p]){ g[p]={ parent:p, budget:Number(it.budget)||0, type:it.type||'', items:[], spent:0, excluded:0 }; order.push(p); }
      var a=Number(it.expenseAmount)||0;
      g[p].items.push(it); g[p].spent+=a; if(it.isInclude===false) g[p].excluded+=a;
    });
    return order.sort().map(function(p){ var x=g[p]; x.rem=x.budget-x.spent; x.over=x.budget>0 && x.spent>x.budget; return x; });
  }
  var CLOSED_WORDS = ['no need','closed','cancelled','stopped','expired','ended'];
  function subPlatforms(){
    var d=data('sub'); if(!d) return [];
    var map={}, order=[];
    (d.entries||[]).forEach(function(e){
      if(!e.platform) return;
      var k=e.platform.toLowerCase();
      if(!map[k]){ map[k]={ key:k, name:e.platform, entries:[] }; order.push(k); }
      e.usages = Array.isArray(e.usages) ? e.usages.map(String)
               : (e.usages!=null && e.usages!=='' ? String(e.usages).split(',').map(function(x){return x.trim();}).filter(Boolean) : []);
      map[k].entries.push(e);
    });
    return order.map(function(k){
      var p=map[k];
      p.closed=p.entries.some(function(e){ var n=String(e.note||'').toLowerCase(); return CLOSED_WORDS.some(function(w){ return n.indexOf(w)>=0; }); });
      p.total=sumOf(p.entries,function(e){return e.netCost;});
      p.latest=p.entries[p.entries.length-1];
      return p;
    });
  }
  function subMonthLabel(m){
    var s=String(m||'');
    if(s.length>15){ var d=new Date(s); if(!isNaN(d.getTime())) return MON[d.getMonth()]+' '+d.getFullYear(); }
    return s||'—';
  }
  function noteGroups(){
    var d=data('notes'); if(!d) return [];
    var sorted=(d.data||[]).slice().sort(function(a,b){ return (a.date||'') < (b.date||'') ? -1 : (a.date||'') > (b.date||'') ? 1 : 0; });
    var groups=[];
    sorted.forEach(function(n){
      var last=groups[groups.length-1];
      if(last && last.reference===n.reference){
        var ld=parseYmd(last.dates[last.dates.length-1]), cd=parseYmd(n.date);
        if(ld && cd && Math.round((cd-ld)/DAY_MS)===1){ last.dates.push(n.date); last.rows.push(n.row); last.note=n; return; }
      }
      groups.push({ reference:n.reference, dates:[n.date], rows:[n.row], note:n });
    });

  /* next occurrence of a note from today (yearly notes roll forward) */
  function noteNext(n){
    var d=parseYmd(n.date); if(!d) return null;
    var t=new Date(); t.setHours(0,0,0,0);
    if(n.yearly){ var x=new Date(t.getFullYear(), d.getMonth(), d.getDate()); if(x<t) x=new Date(t.getFullYear()+1, d.getMonth(), d.getDate()); return x; }
    return d>=t ? d : null;
  }
  function lossRows(){

    });
  }

  /* ═══ rail ════════════════════════════════════════════════ */
  function hitsFor(id, q){
    var out=[];
    function has(){ for(var i=0;i<arguments.length;i++) if(String(arguments[i]||'').toLowerCase().indexOf(q)>=0) return true; return false; }
    if(id==='rot') rotRows().forEach(function(r){ if(has(r.name,r.remarks)) out.push({ t:r.name, s:(r.remarks||r.date)+(r.returned?' · returned':' · pending'), a:r.amount }); });
    if(id==='ins') claimRows().forEach(function(c){ if(has(c.ref,c.provider,c.reason)) out.push({ t:c.ref, s:(c.provider||'')+' · '+STAGE[c.stage][0], a:c.amount }); });
    if(id==='sub') subPlatforms().forEach(function(p){ if(has(p.name) || p.entries.some(function(e){return has(e.plan,e.note,e.collectionFrom);})) out.push({ t:p.name, s:p.entries.length+' entries'+(p.closed?' · closed':''), a:p.total }); });
    if(id==='inst') instList().forEach(function(p){ if(has(p.name)) out.push({ t:p.name, s:p.entries.length+' payments', a:sumOf(p.entries.filter(function(e){return e.st==='open';}),function(e){return e.amount;}) }); });
    if(id==='budget') budgetGroups().forEach(function(g){ if(has(g.parent,g.type) || g.items.some(function(it){return has(it.expenseDesc);})) out.push({ t:g.parent, s:(g.type||'General')+' · '+g.items.length+' items', a:g.spent }); });
    if(id==='notes') noteGroups().forEach(function(g){ if(has(g.reference,g.note.category)) out.push({ t:g.reference, s:g.dates[0]+(g.note.category?' · '+g.note.category:''), a:null }); });
    if(id==='loss') lossRows().forEach(function(l){ if(has(l.ref,l.lesson)) out.push({ t:l.ref, s:l.lesson||'No lesson yet', a:l.amount }); });

  function renderRail(){

  function av(txt){ return '<span class="tk-av">'+esc(txt)+'</span>'; }
  /* each group gets its own colour, fixed by name so it never jumps around when filtering */
  var GC = ['#60a5fa','#f472b6','#34d399','#fbbf24','#a78bfa','#22d3ee','#fb7185','#a3e635','#fb923c','#2dd4bf','#e879f9','#facc15'];
  function gcolor(key){ var h=0; key=String(key||''); for(var i=0;i<key.length;i++) h=(h*31+key.charCodeAt(i))|0; return GC[Math.abs(h)%GC.length]; }

  function card(title, aux, inner){ return '<div class="tk-card"><h3>'+title+'<span class="rule"></span>'+(aux?'<span class="aux">'+aux+'</span>':'')+'</h3>'+inner+'</div>'; }

    }).join('')+'</div><div class="tk-vb-x">'+cols.map(function(c){ return '<span'+(c.hi?' class="hi"':'')+'>'+esc(c.l)+'</span>'; }).join('')+'</div></div>';

  function ring(p, c, size, label, sub){

      '<circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="7"/>'+
      (p>0?'<circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" stroke="'+c+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+h+' '+h+')"/>':'')+
      '<text class="rv" x="50%" y="'+(h+(sub?1:5))+'" text-anchor="middle">'+esc(label)+'</text>'+

  /* items: [fraction, colour, label, caption, sub?] */
  function rings(items, size){ return '<div class="tk-rings">'+items.map(function(x){ return '<div>'+ring(x[0],x[1],size||96,x[2],x[4])+'<span>'+esc(x[3])+'</span></div>'; }).join('')+'</div>'; }
  function dotAv(name){ return '<span class="tk-dotav" style="background:'+gcolor(name)+'">'+esc(initials(name).charAt(0))+'</span>'; }
  function ageColor(d){ return d>60?'#f59e0b':d>30?'#60a5fa':'#3b82f6'; }
  var STAGE_C = { draft:'#f59e0b', waiting:'#38bdf8', approved:'#a855f7', settled:'#10b981', rejected:'#ef4444' };
  function subColor(name, i){ var b=SUB_BRANDS[String(name).toLowerCase()]; return b?b.color:SUB_COLORS[i%SUB_COLORS.length]; }
  /* net subscription cost per month, the last n months, stacked by platform */
  function subMonths(n){
    var cm=curMonthKey(), ps=subPlatforms(), cols=[];
    for(var k=cm-n+1; k<=cm; k++) (function(k){
      cols.push({ l:MON[k%12], hi:k===cm, segs:ps.map(function(p,i){
        var v=sumOf(p.entries.filter(function(e){ return monthKey(subMonthLabel(e.month))===k; }),function(e){return e.netCost;});
        return [v, subColor(p.name,i), p.name+' · '+rs(v)];

    })(k);

  }
  /* open installment payments over the next n months (anything overdue lands in this month) */
  function instMonths(n){
    var cm=curMonthKey(), il=instList(), cols=[];
    for(var k=cm; k<cm+n; k++) (function(k){
      cols.push({ l:MON[k%12], hi:k===cm, segs:il.map(function(p){
        var v=sumOf(p.entries.filter(function(e){ return e.st==='open' && e.mk!=null && (k===cm ? e.mk<=cm : e.mk===k); }),function(e){return e.amount;});
        return [v, gcolor(p.name), p.name+' · '+rs(v)];
      }) });
    })(k);
    return cols;
  }
  /* each note once, at its next date, within `days` */
  function upcoming(days){
    var d=data('notes'); if(!d) return [];
    var t0=new Date(); t0.setHours(0,0,0,0);
    var at={}, out=[];
    (d.data||[]).forEach(function(n){
      var nx=noteNext(n); if(!nx) return;
      var dd=Math.round((nx-t0)/DAY_MS); if(dd>days) return;
      var k=n.reference;
      if(at[k]!=null){ if(out[at[k]].dd>dd) out[at[k]]={ n:n, d:nx, dd:dd }; return; }
      at[k]=out.length; out.push({ n:n, d:nx, dd:dd });
    });
    return out.sort(function(a,b){ return a.dd-b.dd; });
  }
  function leaf(d, c){ return '<div class="tk-leaf" style="--lc:'+c+'"><small>'+MON[d.getMonth()].toUpperCase()+'</small><b>'+d.getDate()+'</b></div>'; }
  function rotPeople(){

      var p=m[r.name]; p.loans.push(r); p.amt+=r.amount; p.oldest=Math.max(p.oldest, r.age||0);
    });

  /* ═══ Habits (smoking + junk/drink) ═══════════════════════ */
  var MILESTONES = [
    ['Blood pressure', 20/(24*60), 'back to normal'], ['Oxygen level', 8/24, 'back to normal'],
    ['Carbon monoxide', 1, 'drops out of blood'], ['Heart attack risk', 2, 'starts to fall'],
    ['Nerve endings', 3, 'start to regrow'], ['Circulation', 14, 'improves'],
    ['Lung function', 60, 'up to 30% better'], ['Coughing', 270, 'noticeably less']
  ];
  function smokeStats(d){
    if(!d || !d.lastSmokeDate) return null;
    var last=new Date(d.lastSmokeDate); if(isNaN(last.getTime())) return null;
    var now=new Date(), ms=now-last; if(ms<0) return null;
    var days=Math.floor(ms/DAY_MS);
    var y=now.getFullYear()-last.getFullYear(), mo=now.getMonth()-last.getMonth(), dd=now.getDate()-last.getDate();
    if(dd<0){ mo--; dd+=new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
    if(mo<0){ y--; mo+=12; }
    var skipped=days*(Number(d.dailyCount)||0);
    return { last:last, days:days, fdays:ms/DAY_MS, hours:Math.floor(ms/36e5)%24, y:y, mo:mo, d:dd, skipped:skipped, saved:skipped*(Number(d.piecePrice)||0) };
  }
  function vHab(){
    var s=smokeStats(data('hab')), mc=C[habKey()], md=mc&&mc.ok?mc.data:null;
    var jd=md?(md.junkDays||[]):[], dr=md?(md.drinkDays||[]):[];
    var dim=new Date(S.habY, S.habM, 0).getDate();
    var jm={}, dm={}; jd.forEach(function(e){ jm[e.day]=(jm[e.day]||0)+(Number(e.amount)||0); }); dr.forEach(function(e){ dm[e.day]=(dm[e.day]||0)+(Number(e.amount)||0); });
    var hit={}; Object.keys(jm).forEach(function(k){hit[k]=1;}); Object.keys(dm).forEach(function(k){hit[k]=1;});
    var h=sum3([['Smoke-free',s?pl(s.days,'day'):'—','c-done',s?rs(s.saved)+' saved':''],['Junk food · '+MON[S.habM-1],md?pl(Object.keys(jm).length,'day'):'…','c-open',md?rs(sumOf(jd,function(e){return e.amount;})):''],['Drinks · '+MON[S.habM-1],md?pl(Object.keys(dm).length,'day'):'…','c-bad',md?pl(dim-Object.keys(hit).length,'clean day'):'']]);
    h+='<div class="tk-hab"><div class="tk-box">';
    if(s){
      h+='<div class="tk-smk">'+ring(s.days/365,'#4ade80',104,Math.min(100,Math.round(s.days/365*100))+'%','to 1 year')+
        '<div style="min-width:0"><div class="tk-sec">Smoke-free since '+s.last.getDate()+' '+MON[s.last.getMonth()]+' '+s.last.getFullYear()+'</div>'+
        '<div class="tk-big">'+(s.y?s.y+'<small> y </small>':'')+s.mo+'<small> mo </small>'+s.d+'<small> d · '+s.hours+'h</small></div></div></div>'+
        '<div class="tk-kv"><div><small>Money saved</small><b>'+rs(s.saved)+'</b></div><div><small>Cigarettes skipped</small><b>'+num(s.skipped)+'</b></div><div><small>Packs avoided</small><b>'+num(Math.floor(s.skipped/20))+'</b></div><div><small>Life regained</small><b>'+(s.skipped*11/1440).toFixed(1)+' days</b></div></div>'+
        '<div class="tk-miles">'+MILESTONES.map(function(m){ var p=Math.min(100, s.fdays/m[1]*100); return '<div class="tk-mile" title="'+esc(m[0]+' '+m[2])+'"><span>'+m[0]+'</span><span class="tr"><i style="width:'+p.toFixed(0)+'%"></i></span><b>'+Math.floor(p)+'%</b></div>'; }).join('')+'</div>';
    } else {
      var hc=C.hab;
      h+='<div class="tk-sec">Smoking</div><div class="tk-empty">'+(hc&&!hc.ok?esc(hc.err):'Add a valid last smoke date in the Habbit sheet (A2) to start tracking.')+'</div>';
    }
    h+='</div><div class="tk-box"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><div class="tk-sec">Junk food &amp; drinks</div>'+
      '<div class="tk-mnav"><button type="button" class="tk-btn sq" data-act="hab-nav" data-dir="-1" aria-label="Previous month">‹</button><span>'+MON[S.habM-1]+' '+S.habY+'</span><button type="button" class="tk-btn sq" data-act="hab-nav" data-dir="1" aria-label="Next month">›</button></div></div>';
    if(!mc){ h+='<div class="tk-state"><div class="tk-spin"></div>Loading month…</div>'; }
    else if(!mc.ok){ h+='<div class="tk-state err">'+esc(mc.err)+'</div>'; }
    else {
      var first=new Date(S.habY, S.habM-1, 1).getDay(), t=new Date(), today=(t.getMonth()+1===S.habM && t.getFullYear()===S.habY)?t.getDate():0;
      h+='<div class="tk-cal">'+['Su','Mo','Tu','We','Th','Fr','Sa'].map(function(x){return '<span class="hd">'+x+'</span>';}).join('');
      for(var b=0;b<first;b++) h+='<span class="blank"></span>';
      for(var d=1; d<=dim; d++){
        var j=!!jm[d], k=!!dm[d];
        var tip=(j?'Junk '+rs(jm[d]):'')+(j&&k?' · ':'')+(k?'Drink '+rs(dm[d]):'');
        var gone=(S.habY*12+S.habM-1)<curMonthKey() || (today && d<=today);
        h+='<span class="'+(j&&k?'b':j?'j':k?'d':gone?'ok':'')+(d===today?' today':'')+'"'+(tip?' title="'+esc(tip)+'"':(gone?' title="Clean day"':''))+'>'+d+'</span>';
      }
      h+='</div><div class="tk-lg"><span><i style="background:#006d32"></i>Clean day</span><span><i style="background:#b45309"></i>Junk food</span><span><i style="background:#be123c"></i>Drink</span><span><i style="background:linear-gradient(135deg,#b45309 50%,#be123c 50%)"></i>Both</span></div>';
      var days=jd.map(function(e){return {d:e.day,a:e.amount,r:e.ref||'Junk food',c:'#b45309'};}).concat(dr.map(function(e){return {d:e.day,a:e.amount,r:e.ref||'Drink',c:'#be123c'};})).sort(function(a,b){return a.d-b.d;});
      h+= days.length ? '<div class="tk-daylist">'+days.map(function(x){ return '<div><b>'+x.d+'</b><i style="background:'+x.c+'"></i><span>'+esc(x.r)+'</span><b>'+rs(x.a)+'</b></div>'; }).join('')+'</div>'
                      : '<div class="tk-empty" style="padding:14px 0 4px">No junk food or drinks logged this month.</div>';
    }
    h+='<div class="tk-empty" style="padding:8px 0 0;text-align:left;font-size:11px">From the food and supermarket entries tagged junk / drink in the month ledger.</div></div></div>';
    return h;
  }

  /* ═══ Notes ═══════════════════════════════════════════════ */
  function vNotes(){
    var d=data('notes'), all=(d&&d.data)||[], cats=(d&&d.categories)||[];
    var t0=new Date(); t0.setHours(0,0,0,0);
    var soon=all.filter(function(n){ var x=noteNext(n); return x && (x-t0)/DAY_MS<=30; }).length;
    var h=sum3([['Notes',all.length,''],['On calendar',all.filter(function(n){return n.calendar;}).length,'c-info'],['Next 30 days',soon,soon?'c-open':'']]);
    if(!all.length) return h+empty('No notes yet. Use “+ New note” to write one.');
    var up=upcoming(90), lastX=-99, run='';
    up.forEach(function(u){
      var x=u.dd/90*100;
      run+='<i class="'+(u.dd<=14?'soon':'')+'" style="left:'+x.toFixed(2)+'%" title="'+esc(u.n.reference)+' · '+u.d.getDate()+' '+MON[u.d.getMonth()]+'"></i>';
      /* names are in the list below; the runway says how far off each one is, skipping labels that would touch */
      if(x-lastX>=11){ run+='<b style="left:'+Math.min(96,Math.max(4,x)).toFixed(2)+'%;color:'+(u.dd<=14?'#fcd34d':'#7dd3fc')+'">'+(u.dd===0?'today':u.dd+'d')+'</b>'; lastX=x; }
    });
    [0,30,60,90].forEach(function(d){ var dt=new Date(t0.getTime()+d*DAY_MS); run+='<em style="left:'+(d/90*100).toFixed(2)+'%">'+(d?dt.getDate()+' '+MON[dt.getMonth()]:'Today')+'</em>'; });
    h+=card('The next 90 days', up.length?pl(up.length,'note')+' · amber = within 14 days':'nothing coming up', '<div class="tk-run">'+run+'</div>');
    var used={}; all.forEach(function(n){ var c=n.category||'Uncategorized'; used[c]=(used[c]||0)+1; });
    var f=curFilter('notes','all');
    h+=filterBar('notes',[['all','All',all.length],['cal','On calendar',all.filter(function(n){return n.calendar;}).length]].concat(Object.keys(used).sort().map(function(c){return ['c:'+c, c, used[c]];})));
    var body='';
    noteGroups().forEach(function(g){
      var n=g.note, cat=n.category||'Uncategorized';

        (n.category?'<span class="tk-pill off">'+esc(n.category)+'</span>':'')+(n.calendar?'<span class="tk-pill info">Calendar</span>':'')+(n.yearly?'<span class="tk-pill done">Yearly</span>':'')+(range?'<span>'+range+'</span>':'')+'</div></div>'+

    $('tk-sub').textContent=m.sub||'';

    S.refs={};

  function go(id){

    load(id, force).then(function(){ if(S.cur===id) render(); });
    if(id==='hab') loadHabMonth(force).then(function(){ if(S.cur==='hab') render(); });
  }

      t=rec?'Edit budget item':'New budget item';
      h+=fld('Plan', inp('tkf-parent','text',b.parent||'',' list="tkf-parent-dl" placeholder="e.g. Ella trip"')+datalist('tkf-parent-dl',(bd.parents||[]).map(function(p){return p.name;})), 'Pick an existing plan to reuse its budget and type.')+
        '<div class="tk-f2">'+fld('Type', inp('tkf-type','text',b.type||'',' list="tkf-type-dl" placeholder="e.g. Trip"')+datalist('tkf-type-dl',bd.types||[]))+fld('Plan budget (₨)', inp('tkf-budget','number',b.budget!=null?b.budget:'',' min="0" step="0.01" inputmode="decimal"'))+'</div>'+
        fld('Expense description', inp('tkf-desc','text',b.expenseDesc||'',' placeholder="e.g. Hotel, 2 nights"'))+
        fld('Amount (₨)', inp('tkf-amt','number',b.expenseAmount!=null?b.expenseAmount:'',' min="0" step="0.01" inputmode="decimal"'))+
        fld('Counts as actual cost', seg('inc',[['1','Yes'],['0','No, exclude']], b.isInclude===false?'0':'1'), 'Excluded items still count toward spent, and are shown separately.');
    }
    else if(kind==='sub'){
      var s=rec||{};
      t='New subscription entry';
      var plats=subPlatforms().map(function(p){return p.name;});
      h+='<div class="tk-f2">'+fld('Month', inp('tkf-month','text',s.month||nowMonthLabel(),' placeholder="e.g. Sep 2026"'))+fld('Platform', inp('tkf-plat','text',s.platform||'',' list="tkf-plat-dl" placeholder="e.g. Netflix"')+datalist('tkf-plat-dl',plats))+'</div>'+
        '<div class="tk-f2">'+fld('Plan', inp('tkf-plan','text',s.plan||'',' placeholder="e.g. Premium"'))+fld('Collected from', inp('tkf-cfrom','text',s.collectionFrom||'',' placeholder="Optional"'))+'</div>'+
        '<div class="tk-f2">'+fld('Cost (₨)', inp('tkf-cost','number',s.cost!=null?s.cost:'',' min="0" step="0.01" inputmode="decimal"'))+fld('Collected (₨)', inp('tkf-coll','number',s.collections!=null?s.collections:'',' min="0" step="0.01" inputmode="decimal"'))+'</div>'+
        fld('Net cost (₨)', inp('tkf-net','number',s.netCost!=null?s.netCost:'',' step="0.01" inputmode="decimal"'), 'Fills in as cost − collected. You can change it.')+
        fld('Note', inp('tkf-note','text',s.note||'',' placeholder="Optional"'))+
        fld('Usage', inp('tkf-usage','text','',' placeholder="Comma-separated, e.g. Watched a film, Shared with Kasun"'));
    }
    else if(kind==='notes'){
      var g=rec, n=g?g.note:{};
      t=g?(g.rows.length>1?'Edit note ('+g.rows.length+' days)':'Edit note'):'New note';
      var multi=g && g.dates.length>1;
      h+=fld('Note', '<textarea id="tkf-ref" rows="3" placeholder="What to remember">'+esc(g?g.reference:'')+'</textarea>')+
        '<div class="tk-f2">'+fld('Date', inp('tkf-date','date',g?g.dates[0]:today))+fld('Category', inp('tkf-cat','text',n.category||'',' list="tkf-cat-dl" placeholder="e.g. Bills"')+datalist('tkf-cat-dl',((data('notes')||{}).categories)||[]))+'</div>'+
        fld('Spans several days', seg('multi',[['0','No'],['1','Yes']], multi?'1':'0'))+
        fld('Up to', inp('tkf-upto','date',multi?g.dates[g.dates.length-1]:''), '', 'tkf-upto-w')+
        '<div class="tk-f2">'+fld('Show on calendar', seg('cal',[['1','Yes'],['0','No']], n.calendar?'1':'0'))+fld('Repeat yearly', seg('yr',[['1','Yes'],['0','No']], n.yearly?'1':'0'))+'</div>';
    }
    h+='<div class="tk-dr-msg" id="tk-dr-msg"></div>';
    $('tk-dr-title').textContent=t;
    $('tk-form').innerHTML=h;
    syncFormVisibility();
    var btn=$('tk-dr-save'); btn.disabled=false; btn.textContent='Save';
    $('tk-form').scrollTop=0;
    var dr=$('tk-drawer'), was=dr.classList.contains('open');
    dr.classList.add('open'); dr.setAttribute('aria-hidden','false');
    $('tk-scrim').classList.add('open');
    if(was){ dr.classList.remove('swap'); void dr.offsetWidth; dr.classList.add('swap'); }
    setTimeout(function(){ var f=$('tk-form').querySelector('input:not([type=date]),textarea'); if(f) try{ f.focus({preventScroll:true}); }catch(_){} }, was?0:340);
  }
  function closeDrawer(){ var dr=$('tk-drawer'); if(!dr) return; dr.classList.remove('open','swap'); dr.setAttribute('aria-hidden','true'); $('tk-scrim').classList.remove('open'); S.form=null; }
  function syncFormVisibility(){
    var w=$('tkf-subdate-w'); if(w) w.hidden = segVal('sub')!=='1';
    var u=$('tkf-upto-w'); if(u) u.hidden = segVal('multi')!=='1';
  }
  /* form-level listeners: segment buttons, auto net, plan autofill */
  $('tk-form').addEventListener('click', function(e){
    var b=e.target.closest('.tk-seg button'); if(!b) return;
    b.parentNode.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===b); });
    syncFormVisibility();
  });
  $('tk-form').addEventListener('input', function(e){
    var id=e.target.id;
    if(id==='tkf-cost' || id==='tkf-coll'){ var n=numVal('tkf-cost')-numVal('tkf-coll'); $('tkf-net').value = n>0?n:0; }
    if(id==='tkf-parent'){
      var bd=data('budget')||{}, v=e.target.value.trim(), p=(bd.parents||[]).filter(function(x){return x.name===v;})[0];
      if(p){ $('tkf-budget').value=p.budget; var it=(bd.data||[]).filter(function(x){return x.parent===v;})[0]; if(it && it.type) $('tkf-type').value=it.type; }
    }
  });
  $('tk-form').addEventListener('submit', function(e){ e.preventDefault(); save(); });

  function save(){
    var f=S.form; if(!f) return;
    var btn=$('tk-dr-save'), job=null, id=f.kind;
    msg('');
    if(f.kind==='ins'){
      var ref=val('tkf-ref'), amt=numVal('tkf-amt');
      if(!ref) return msg('Enter a reference for the claim.');
      if(!(amt>0)) return msg('Enter an amount above zero.');
      var out=segVal('out'), subm=segVal('sub')==='1';
      var p={ date:val('tkf-date'), ref:ref, provider:val('tkf-prov'), source:$('tkf-src').value, amount:amt,
              isSubmitted:subm, submittedDate:subm?val('tkf-subdate'):'', isApproved:out==='approved', isRejected:out==='rejected',
              isSettled:segVal('set')==='1', reason:val('tkf-reason') };
      if(f.rec){ p.rowIndex=parseInt(f.rec.rowIndex,10); job=run('updateInsuranceClaim', p); }
      else job=run('addInsuranceClaim', p);
    }
    else if(f.kind==='loss'){
      var lr=val('tkf-ref'), la=val('tkf-amt');
      if(!lr || !la) return msg('Enter a reference and an amount.');
      var conf=segVal('conf')==='1';
      job = f.rec ? run('updateLossEntry', f.rec.rowIndex, lr, la, val('tkf-lesson'), conf)
                  : run('addLossEntry', lr, la, val('tkf-lesson'), conf);
    }
    else if(f.kind==='budget'){
      var parent=val('tkf-parent');
      if(!parent) return msg('Enter the plan this item belongs to.');
      job=run('saveBudgetEntry', { row:f.rec?f.rec.row:null, parent:parent, type:val('tkf-type'), budget:numVal('tkf-budget'),
        expenseDesc:val('tkf-desc'), expenseAmount:numVal('tkf-amt'), isInclude:segVal('inc')!=='0' });
    }
    else if(f.kind==='sub'){
      var month=val('tkf-month'), plat=val('tkf-plat');
      if(!month || !plat) return msg('Month and platform are required.');
      var us=val('tkf-usage');
      job=run('addSubscription', { month:month, platform:plat, plan:val('tkf-plan'), cost:numVal('tkf-cost'), collections:numVal('tkf-coll'),
        collectionFrom:val('tkf-cfrom'), netCost:numVal('tkf-net'), note:val('tkf-note'),
        usages: us ? us.split(',').map(function(s){return s.trim();}).filter(Boolean) : [] });
    }
    else if(f.kind==='notes'){
      var nref=val('tkf-ref'), from=val('tkf-date');
      if(!nref) return msg('Write the note first.');
      if(!from) return msg('Pick a date.');
      var dates=[];
      if(segVal('multi')==='1'){
        var upto=val('tkf-upto');
        if(!upto) return msg('Pick the last day, or switch “Spans several days” off.');
        var d0=parseYmd(from), d1=parseYmd(upto);
        if(!d0 || !d1 || d1<d0) return msg('“Up to” must be on or after the first date.');
        if(Math.round((d1-d0)/DAY_MS)>366) return msg('A note can span at most a year.');
        for(var d=new Date(d0); d<=d1; d.setDate(d.getDate()+1)) dates.push(ymd(d));
      } else dates=[from];
      var notes=dates.map(function(dt){ return { row:null, date:dt, category:val('tkf-cat'), reference:nref, yearly:segVal('yr')==='1', calendar:segVal('cal')==='1' }; });
      job = f.rec
        ? run('deleteNotes', f.rec.rows).then(function(r){ if(r && r.success===false) throw new Error(r.error||'Could not replace the old note'); return run('saveNote', notes); })
        : run('saveNote', notes);
    }
    if(!job) return;
    btn.disabled=true; btn.textContent='Saving…';
    job.then(function(r){
      btn.disabled=false; btn.textContent='Save';
      if(r && r.success===false){ msg(r.error||'Could not save.'); tap('error'); return; }
      closeDrawer(); toast('Saved'); refresh(id);
    }, function(e){
      btn.disabled=false; btn.textContent='Save';
      msg('Could not save: '+errText(e)); tap('error');
    });
  }
  $('tk-dr-save').addEventListener('click', save);
  $('tk-dr-x').addEventListener('click', closeDrawer);
  $('tk-dr-cancel').addEventListener('click', closeDrawer);
  $('tk-scrim').addEventListener('click', closeDrawer);
  $('tk-add').addEventListener('click', function(){ if(meta(S.cur).add) openDrawer(S.cur); });
  $('tk-reload').addEventListener('click', function(){
    if(S.cur==='ov'){ TK.forEach(function(t){ if(t.load) delete C[t.id]; }); render(); ensure('ov', true); }
    else refresh(S.cur);
  });

  /* ═══ row actions ═════════════════════════════════════════ */
  function arm(btn, fn){
    if(btn.classList.contains('armed')){ btn.classList.remove('armed'); clearTimeout(btn._t); fn(); return; }
    btn.classList.add('armed'); btn._orig=btn._orig||btn.textContent; btn.textContent='Tap again to confirm';
    btn._t=setTimeout(function(){ btn.classList.remove('armed'); btn.textContent=btn._orig; }, 3000);
  }
  function act(fnName, args, id, okMsg, btn){
    if(btn){ btn.disabled=true; btn.classList.add('busy'); }
    run.apply(null, [fnName].concat(args)).then(function(r){
      if(r && r.success===false){ if(btn){ btn.disabled=false; btn.classList.remove('busy'); } toast(r.error||'That did not work', true); return; }
      toast(okMsg); if(id) refresh(id);
    }, function(e){
      if(btn){ btn.disabled=false; btn.classList.remove('busy'); }
      toast('Failed: '+errText(e), true);
    });
  }
  function doAction(b){
    var a=b.getAttribute('data-act'), i=+b.getAttribute('data-i'), x;
    switch(a){
      case 'retry': refresh(S.cur); break;
      case 'hab-nav':
        S.habM+=+b.getAttribute('data-dir');
        if(S.habM<1){ S.habM=12; S.habY--; } if(S.habM>12){ S.habM=1; S.habY++; }
        render(); loadHabMonth().then(function(){ if(S.cur==='hab') render(); });
        break;
      case 'ins-edit': openDrawer('ins', S.refs.ins[i]); break;
      case 'ins-del': x=S.refs.ins[i]; arm(b, function(){ act('deleteInsuranceClaim',[x.rowIndex],'ins','Claim deleted',b); }); break;
      case 'loss-edit': openDrawer('loss', S.refs.loss[i]); break;
      case 'loss-del': x=S.refs.loss[i]; arm(b, function(){ act('deleteLossEntry',[x.rowIndex],'loss','Loss deleted',b); }); break;
      case 'loss-st': x=S.refs.loss[i]; act('updateLossEntry',[x.rowIndex, x.ref, x.amount, x.lesson||'', !x.isConfirmLoss],'loss', x.isConfirmLoss?'Marked unconfirmed':'Marked confirmed', b); break;
      case 'bud-edit': openDrawer('budget', S.refs.budget[i]); break;
      case 'bud-addto': x=S.refs.budg[i]; openDrawer('budget', null); $('tkf-parent').value=x.parent; $('tkf-type').value=x.type||''; $('tkf-budget').value=x.budget; $('tk-dr-title').textContent='New item in '+x.parent; setTimeout(function(){ var d=$('tkf-desc'); if(d) d.focus({preventScroll:true}); },350); break;
      case 'bud-del': x=S.refs.budget[i]; arm(b, function(){ act('deleteBudgetEntry',[x.row],'budget','Item deleted',b); }); break;
      case 'note-edit': openDrawer('notes', S.refs.notes[i]); break;
      case 'note-del': x=S.refs.notes[i]; arm(b, function(){ act('deleteNotes',[x.rows],'notes', x.rows.length>1?x.rows.length+' notes deleted':'Note deleted', b); }); break;
      case 'inst-st':
        x=S.refs.inst[i];
        act('updateInstallmentStatus',[x.name, x.num, x.st==='open'?'Settled':'Pending', x.month, x.amount],'inst', x.st==='open'?'Marked settled':'Marked pending', b);
        break;
      case 'inst-add':
        x=S.refs.inst[i];
        var lka=new Date(Date.now()+(5*60+30)*60*1000), key=(lka.getUTCMonth()+1)+'-'+lka.getUTCDate(), mode=b.getAttribute('data-mode');
        act('addInstallmentToExpense',[x.name, x.amount, key, mode], null, mode==='other'?'Added to other expenses':mode==='card'?'Added to card':'Added to Splitwise', b);
        setTimeout(function(){ b.disabled=false; b.classList.remove('busy'); }, 2500);
        break;
      case 'sub-del': x=S.refs.sub[i]; arm(b, function(){ act('deleteSubscription',[x.rowIndex],'sub','Entry removed',b); }); break;
      case 'sub-again':
        x=S.refs.subp[i].latest;
        arm(b, function(){
          act('addSubscription',[{ month:nowMonthLabel(), platform:x.platform, plan:x.plan, cost:Number(x.cost)||0, collections:Number(x.collections)||0,
            collectionFrom:x.collectionFrom||'', netCost:Number(x.netCost)||0, note:x.note||'', usages:[] }],'sub','Logged for '+nowMonthLabel(), b);
        });
        break;
      case 'sub-ushow': var w=$('tk-ua-'+i); if(w){ w.hidden=!w.hidden; if(!w.hidden) $('tk-ui-'+i).focus(); } break;
      case 'sub-uadd':
        x=S.refs.sub[i]; var tv=val('tk-ui-'+i);
        if(!tv) return;
        act('addSubscriptionUsage',[{ rowIndex:x.rowIndex, usageText:tv }],'sub','Usage added', b);
        break;
      case 'sub-udel': x=S.refs.sub[i]; act('deleteSubscriptionUsage',[{ rowIndex:x.rowIndex, usageIndex:+b.getAttribute('data-u') }],'sub','Usage removed', b); break;
    }
  }

  /* ═══ delegated events ════════════════════════════════════ */
  $('tk-body').addEventListener('click', function(e){
    var t=e.target;
    var g=t.closest('[data-go]'); if(g){ go(g.getAttribute('data-go')); return; }
    var f=t.closest('[data-filt]'); if(f){ var p=f.getAttribute('data-filt').split('|'); S.f[p[0]]=p.slice(1).join('|'); render(); return; }
    var hd=t.closest('.tk-g-hd'); if(hd){ var box=hd.parentNode; box.classList.toggle('open'); S.open[box.getAttribute('data-gkey')]=box.classList.contains('open'); return; }
    var a=t.closest('[data-act]'); if(a && !a.disabled) doAction(a);
  });
  $('tk-body').addEventListener('input', function(e){
    if(e.target.id==='tk-fq'){ S.q=e.target.value.trim().toLowerCase(); $('tk-q').value=e.target.value; render(); }
  });
  $('tk-body').addEventListener('keydown', function(e){
    if(e.key==='Enter' && e.target.getAttribute('data-enter')){ e.preventDefault(); var b=e.target.parentNode.querySelector('[data-act="'+e.target.getAttribute('data-enter')+'"]'); if(b) doAction(b); }
  });
  $('tk-nav').addEventListener('click', function(e){ var b=e.target.closest('[data-go]'); if(b) go(b.getAttribute('data-go')); });
  $('tk-q').addEventListener('input', function(){ S.q=this.value.trim().toLowerCase(); render(); });
  $('tk-overlay').addEventListener('click', function(e){ if(e.target===this) close(); });
  document.querySelectorAll('#tk-modal [data-tk-close]').forEach(function(b){ b.addEventListener('click', close); });
  document.addEventListener('keydown', function(e){
    if(e.key!=='Escape' || !isOpen()) return;
    if(S.form){ closeDrawer(); } else close();
  });

  /* ═══ warm up after boot so the trackers open instantly ═══ */
  function prefetch(){ loadAll(); }
  window.addEventListener('load', function(){ setTimeout(prefetch, 5000); });
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Monthly Expense Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  :root {
    --bg:    #0a0e1a;
    --glass: rgba(255,255,255,0.04);
    --bdr:   rgba(255,255,255,0.08);
    --acc:   #6366f1; --acc2: #8b5cf6;
    --grn:   #10b981; --red: #ef4444;
    --amb:   #f59e0b; --cyn: #06b6d4;
    --t1:    #f1f5f9; --t2: #94a3b8; --t3: #475569;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden;position:relative}
  body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(99,102,241,.12) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0}
  .orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.18;pointer-events:none;z-index:0;animation:drift 20s ease-in-out infinite alternate}
  .orb1{width:500px;height:500px;background:#6366f1;top:-200px;left:-100px;animation-duration:18s}
  .orb2{width:400px;height:400px;background:#8b5cf6;bottom:-100px;right:-100px;animation-duration:22s;animation-delay:-5s}
  .orb3{width:300px;height:300px;background:#06b6d4;top:40%;left:55%;animation-duration:16s;animation-delay:-8s}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,30px) scale(1.08)}}
  .page{position:relative;z-index:1;width:100%;padding:24px 20px 40px}

  /* header */
  .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .hdr h1{font-size:22px;font-weight:700}
  .hdr p{font-size:13px;color:var(--t2);margin-top:3px}
  .badge{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;
    background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 16px rgba(99,102,241,.4)}

  /* loader */
  .loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:80px 0}
  .spinner{width:48px;height:48px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* section label */
  .sec-lbl{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:1px;
    margin-bottom:12px;padding-left:2px;border-left:3px solid var(--acc);padding-left:8px}

  /* KPI strip */
  .kpi-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px}
  .kpi{border-radius:14px;padding:16px 18px;background:var(--glass);border:1px solid var(--bdr);
    backdrop-filter:blur(12px);position:relative;overflow:hidden}
  .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
  .kpi.c0::before{background:linear-gradient(90deg,var(--acc),var(--acc2))}
  .kpi.c1::before{background:linear-gradient(90deg,var(--cyn),#0ea5e9)}
  .kpi.c2::before{background:linear-gradient(90deg,var(--amb),#fb923c)}
  .kpi.c3::before{background:linear-gradient(90deg,var(--grn),#34d399)}
  .kpi.c4::before{background:linear-gradient(90deg,#f97316,var(--amb))}
  .kpi.c5::before{background:linear-gradient(90deg,#ec4899,#f43f5e)}
  .kpi-lbl{font-size:11px;font-weight:500;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
  .kpi-val{font-size:20px;font-weight:700;letter-spacing:-.5px}
  .kpi-sub{font-size:11px;color:var(--t2);margin-top:4px}
  .delta{font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;margin-top:6px;display:inline-block}
  .delta.up{background:rgba(239,68,68,.15);color:var(--red)}
  .delta.dn{background:rgba(16,185,129,.15);color:var(--grn)}
  .delta.nt{background:rgba(148,163,184,.1);color:var(--t2)}

  /* Year comparison strip */
  .yr-strip{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .yr-card{flex:1;min-width:200px;border-radius:14px;padding:18px 20px;
    background:var(--glass);border:1px solid var(--bdr);backdrop-filter:blur(12px);
    position:relative;overflow:hidden}
  .yr-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
  .yr-card:nth-child(1)::before{background:linear-gradient(90deg,#6366f1,#8b5cf6)}
  .yr-card:nth-child(2)::before{background:linear-gradient(90deg,#06b6d4,#0ea5e9)}
  .yr-card:nth-child(3)::before{background:linear-gradient(90deg,#10b981,#34d399)}
  .yr-card:nth-child(4)::before{background:linear-gradient(90deg,#f59e0b,#fb923c)}
  .yr-card-yr{font-size:24px;font-weight:800;letter-spacing:-1px;margin-bottom:6px}
  .yr-card-total{font-size:14px;font-weight:600;color:var(--t1);margin-bottom:4px}
  .yr-card-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
  .yr-card-m{font-size:11px;color:var(--t2)}
  .yr-card-m strong{color:var(--t1);font-weight:600}
  .yr-yoy{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
    padding:3px 9px;border-radius:12px;margin-top:8px}
  .yr-yoy.up{background:rgba(239,68,68,.15);color:var(--red)}
  .yr-yoy.dn{background:rgba(16,185,129,.15);color:var(--grn)}

  /* pills */
  .pills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
  .pill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;
    background:var(--glass);border:1px solid var(--bdr);backdrop-filter:blur(8px)}
  .pill em{color:var(--t2);font-style:normal;margin-right:4px}
  .pill.warn strong{color:var(--amb)}
  .pill.good strong{color:var(--grn)}
  .pill.bad  strong{color:var(--red)}
  .pill.info strong{color:var(--cyn)}
  .pill.pur  strong{color:var(--acc2)}

  /* chart grid */
  .row{display:grid;gap:16px;margin-bottom:16px}
  .r3{grid-template-columns:repeat(3,1fr)}
  .r2{grid-template-columns:repeat(2,1fr)}
  .r1{grid-template-columns:1fr}
  .r21{grid-template-columns:2fr 1fr}
  .cbox{border-radius:16px;padding:18px 18px 14px;background:var(--glass);border:1px solid var(--bdr);backdrop-filter:blur(12px)}
  .ctitle{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:2px}
  .csub{font-size:11px;color:var(--t2);margin-bottom:14px}
  .cwrap canvas{max-height:230px}
  .cwrap.tall canvas{max-height:280px}

  /* insights */
  .ig{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
  .ic{border-radius:14px;padding:16px;background:var(--glass);border:1px solid var(--bdr);backdrop-filter:blur(10px)}
  .ic-ico{font-size:22px;margin-bottom:8px}
  .ic-lbl{font-size:11px;color:var(--t2);font-weight:500;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
  .ic-val{font-size:16px;font-weight:700}
  .ic-val.good{color:var(--grn)} .ic-val.bad{color:var(--red)} .ic-val.warn{color:var(--amb)}
  .ic-val.info{color:var(--cyn)} .ic-val.pur{color:var(--acc2)}
  .ic-desc{font-size:11px;color:var(--t2);margin-top:4px;line-height:1.5}

  /* error */
  .err{text-align:center;padding:48px;color:var(--red)}
  .err-ico{font-size:40px;margin-bottom:12px}
</style>
</head>
<body>
<div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>
<div class="page">
  <div class="hdr">
    <div>
      <h1>📊 Monthly Expense Dashboard</h1>
      <p id="sub">Loading…</p>
    </div>
    <div class="badge" id="badge">–</div>
  </div>
  <div id="root">
    <div class="loader"><div class="spinner"></div><p style="color:var(--t2);font-size:13px">Fetching data…</p></div>
  </div>
</div>

<script>
// ── Category colours ──────────────────────────────────────────────
const CAT_COLORS = {
  'Food':'#f59e0b','Super market':'#10b981','Uber':'#6366f1',
  'Uber Work':'#8b5cf6','Movies & outing':'#ec4899','Other Expences':'#f97316',
  'Bus Fair':'#06b6d4','Party':'#ef4444','Dress and Appearance':'#84cc16','Rent':'#64748b'
};
const FALLBACK=['#6366f1','#8b5cf6','#06b6d4','#f59e0b','#10b981','#ec4899','#f97316','#ef4444','#84cc16','#64748b'];
const YR_COLORS=['#6366f1','#06b6d4','#10b981','#f59e0b','#ec4899','#f97316'];
const cc=(name,i)=>CAT_COLORS[name]||FALLBACK[i%FALLBACK.length];

// ── Formatters ────────────────────────────────────────────────────
const sl=s=>{
  const p=s.trim().split(/\s+/);
  if(p.length<2) return s.substring(0,6);
  let m=p[0].substring(0,3);
  if(m.toUpperCase()==='OTC') m='Oct';
  return m+" '"+p[p.length-1].substring(2);
};
const f =n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString('en-IN');
const fr=n=>'₨ '+Math.round(n).toLocaleString('en-IN');

// ── Chart defaults ────────────────────────────────────────────────
Chart.defaults.color='#94a3b8';
Chart.defaults.font.family="'Inter',sans-serif";
Chart.defaults.font.size=11;
const GC='rgba(255,255,255,0.05)',TC='#475569';
const sc=(stacked)=>({
  x:{grid:{color:GC},ticks:{color:TC,maxRotation:35},stacked:!!stacked},
  y:{grid:{color:GC},ticks:{color:TC,callback:v=>'₨'+f(v)},stacked:!!stacked}
});
const LEG={labels:{color:'#94a3b8',boxWidth:10,padding:14,font:{size:11}}};

// ── Build ─────────────────────────────────────────────────────────
function build(D) {
  const months    = D.months;
  const totals    = D.monthlyTotals;
  const cats      = D.categories;
  const yg        = D.yearGroups;   // { '2025': {months,indices,totals,catTotals}, ... }
  const latest    = D.latestMonth;
  const labels    = months.map(sl);
  const n         = months.length;
  const li        = n-1;

  // ── Sorted year list ──────────────────────────────────────────
  const years = Object.keys(yg).sort();

  // ── Overall derived ───────────────────────────────────────────
  const cur    = totals[li]||0;
  const prev   = totals[li-1]||0;
  const mom    = prev>0?(cur-prev)/prev*100:0;
  const avg    = totals.reduce((a,b)=>a+b,0)/(n||1);
  const bestI  = totals.indexOf(Math.min(...totals));
  const worstI = totals.indexOf(Math.max(...totals));

  const catCur  = cats.map((c,i)=>({name:c.name,val:c.values[li]||0,i})).sort((a,b)=>b.val-a.val);
  const topCat  = catCur[0]||{name:'–',val:0};
  const rentObj = cats.find(c=>c.name.toLowerCase()==='rent');
  const rentVal = rentObj?rentObj.values[li]||0:0;
  const varSpd  = cur-rentVal;
  const rentPct = cur>0?rentVal/cur*100:0;
  const foodObj = cats.find(c=>c.name.toLowerCase()==='food');
  const foodVal = foodObj?foodObj.values[li]||0:0;
  const foodPct = cur>0?foodVal/cur*100:0;
  const discNames=['movies & outing','party','dress and appearance'];
  const discVal = cats.filter(c=>discNames.includes(c.name.toLowerCase())).reduce((s,c)=>s+(c.values[li]||0),0);
  const discPct = cur>0?discVal/cur*100:0;
  const momArr  = totals.map((v,i)=>i===0?0:v-totals[i-1]);
  const catAll  = cats.map((c,i)=>({name:c.name,tot:c.values.reduce((s,v)=>s+v,0),i})).sort((a,b)=>b.tot-a.tot);
  const transVal= ['uber','uber work','bus fair'].reduce((s,nm)=>{
    const c=cats.find(x=>x.name.toLowerCase()===nm); return s+(c?c.values[li]||0:0);},0);

  // ── Year KPI cards HTML ───────────────────────────────────────
  const yrCards = years.map((yr,yi)=>{
    const g = yg[yr];
    const yrTotal   = g.totals.reduce((a,b)=>a+b,0);
    const yrAvg     = yrTotal/(g.months.length||1);
    const yrBestI   = g.totals.indexOf(Math.min(...g.totals));
    const yrWorstI  = g.totals.indexOf(Math.max(...g.totals));
    // YoY vs previous year
    let yoyHtml='';
    if(yi>0){
      const prevYr = years[yi-1];
      const prevTotal = yg[prevYr].totals.reduce((a,b)=>a+b,0);
      if(prevTotal>0){
        const yoyPct=(yrTotal-prevTotal)/prevTotal*100;
        yoyHtml=`<div class="yr-yoy ${yoyPct>0?'up':'dn'}">${yoyPct>0?'▲':'▼'} ${Math.abs(yoyPct).toFixed(1)}% vs ${prevYr}</div>`;
      }
    }
    return `<div class="yr-card">
      <div class="yr-card-yr">${yr}</div>
      <div class="yr-card-total">${fr(yrTotal)} total · ${g.months.length} months</div>
      <div class="yr-card-meta">
        <div class="yr-card-m"><span style="color:var(--t3)">Avg/mo</span> <strong>${fr(yrAvg)}</strong></div>
        <div class="yr-card-m"><span style="color:var(--t3)">Best</span> <strong style="color:var(--grn)">${sl(g.months[yrBestI]||'–')}</strong></div>
        <div class="yr-card-m"><span style="color:var(--t3)">Worst</span> <strong style="color:var(--red)">${sl(g.months[yrWorstI]||'–')}</strong></div>
      </div>
      ${yoyHtml}
    </div>`;
  }).join('');

  // ── Render skeleton ───────────────────────────────────────────
  document.getElementById('sub').textContent=`${n} months tracked · Latest: ${latest}`;
  document.getElementById('badge').textContent=latest;

  document.getElementById('root').innerHTML=`

  <!-- ── OVERALL KPIs ── -->
  <div class="sec-lbl">Overall</div>
  <div class="kpi-strip">
    <div class="kpi c0">
      <div class="kpi-lbl">Current Month</div>
      <div class="kpi-val">${fr(cur)}</div>
      <div class="delta ${mom>5?'up':mom<-5?'dn':'nt'}">${mom>=0?'▲':'▼'} ${Math.abs(mom).toFixed(1)}% MoM</div>
    </div>
    <div class="kpi c1">
      <div class="kpi-lbl">Avg Monthly</div>
      <div class="kpi-val">${fr(avg)}</div>
      <div class="kpi-sub">Over ${n} months</div>
    </div>
    <div class="kpi c2">
      <div class="kpi-lbl">Top Category</div>
      <div class="kpi-val" style="font-size:15px">${topCat.name}</div>
      <div class="kpi-sub">${fr(topCat.val)} this month</div>
    </div>
    <div class="kpi c3">
      <div class="kpi-lbl">Best Month</div>
      <div class="kpi-val" style="font-size:15px">${sl(months[bestI]||'–')}</div>
      <div class="kpi-sub">${fr(totals[bestI]||0)}</div>
    </div>
    <div class="kpi c4">
      <div class="kpi-lbl">Rent</div>
      <div class="kpi-val">${fr(rentVal)}</div>
      <div class="kpi-sub">${rentPct.toFixed(1)}% of total</div>
    </div>
    <div class="kpi c5">
      <div class="kpi-lbl">Variable Spend</div>
      <div class="kpi-val">${fr(varSpd)}</div>
      <div class="kpi-sub">Excl. rent</div>
    </div>
  </div>

  <!-- ── INSIGHT PILLS ── -->
  <div class="pills">
    <div class="pill ${rentPct>40?'warn':'good'}"><em>🏠 Rent</em><strong>${rentPct.toFixed(1)}%</strong></div>
    <div class="pill ${foodPct>30?'warn':''}"><em>🍜 Food</em><strong>${foodPct.toFixed(1)}%</strong></div>
    <div class="pill ${discPct>15?'warn':''}"><em>🎉 Discretionary</em><strong>${discPct.toFixed(1)}%</strong></div>
    <div class="pill info"><em>🚗 Transport</em><strong>${fr(transVal)}</strong></div>
    <div class="pill ${cur<avg?'good':'bad'}"><em>vs Avg</em><strong>${cur<avg?'Below avg ✓':'Above avg'}</strong></div>
    <div class="pill pur"><em>📉 Worst month</em><strong>${sl(months[worstI]||'–')}</strong></div>
    <div class="pill"><em>📈 All-time total</em><strong>${fr(totals.reduce((a,b)=>a+b,0))}</strong></div>
  </div>

  <!-- ── YEAR COMPARISON ── -->
  <div class="sec-lbl" style="margin-top:8px">Year Comparison</div>
  <div class="yr-strip">${yrCards}</div>

  <!-- Year comparison charts -->
  <div class="row r2" style="margin-bottom:16px">
    <div class="cbox">
      <div class="ctitle">📅 Year-over-Year Monthly Totals</div>
      <div class="csub">Same calendar month across years overlaid</div>
      <div class="cwrap tall"><canvas id="cYoY"></canvas></div>
    </div>
    <div class="cbox">
      <div class="ctitle">🏷️ Year-over-Year by Category</div>
      <div class="csub">Total per category grouped by year</div>
      <div class="cwrap tall"><canvas id="cYrCat"></canvas></div>
    </div>
  </div>

  <div class="row r1" style="margin-bottom:16px">
    <div class="cbox">
      <div class="ctitle">📊 Year-over-Year Avg Monthly Spend per Category</div>
      <div class="csub">Average monthly spend per category — compared across years</div>
      <div class="cwrap"><canvas id="cYrAvgCat"></canvas></div>
    </div>
  </div>

  <!-- ── ALL MONTHS ── -->
  <div class="sec-lbl" style="margin-top:8px">Monthly View</div>

  <!-- Trend + Donut -->
  <div class="row r21">
    <div class="cbox">
      <div class="ctitle">📈 Monthly Expense Trend</div>
      <div class="csub">Total spend each month + average line</div>
      <div class="cwrap tall"><canvas id="cTrend"></canvas></div>
    </div>
    <div class="cbox">
      <div class="ctitle">🍩 ${latest} — Breakdown</div>
      <div class="csub">Current month by category</div>
      <div class="cwrap"><canvas id="cDonut"></canvas></div>
    </div>
  </div>

  <!-- Stacked bar full width -->
  <div class="row r1">
    <div class="cbox">
      <div class="ctitle">📊 Monthly Spend by Category</div>
      <div class="csub">Stacked across all months</div>
      <div class="cwrap tall"><canvas id="cStack"></canvas></div>
    </div>
  </div>

  <!-- Top category lines + MoM delta -->
  <div class="row r2">
    <div class="cbox">
      <div class="ctitle">📉 Top Category Trends</div>
      <div class="csub">Top 4 categories over time</div>
      <div class="cwrap"><canvas id="cCatTrend"></canvas></div>
    </div>
    <div class="cbox">
      <div class="ctitle">📊 Month-on-Month Change</div>
      <div class="csub">Δ vs previous month</div>
      <div class="cwrap"><canvas id="cMom"></canvas></div>
    </div>
  </div>

  <!-- Category ranking -->
  <div class="row r1">
    <div class="cbox">
      <div class="ctitle">🏆 All-Time Category Ranking</div>
      <div class="csub">Total spend per category across all months</div>
      <div class="cwrap"><canvas id="cRank"></canvas></div>
    </div>
  </div>

  <!-- Insights -->
  <div class="ig" id="ig"></div>
  `;

  // ════════════════════════════════════════════════════════════
  // YEAR CHARTS
  // ════════════════════════════════════════════════════════════

  // Short month names (without year) for YoY x-axis
  // Build a merged list of unique short-month positions (Jan–Dec order)
  const MON_ORDER=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // For each year, map month-position → total
  // Month position derived from label: "Jun '25" → "Jun"
  function monKey(lbl){ return lbl.split(' ')[0]; } // "Jun"
  function monIdx(k){ const i=MON_ORDER.findIndex(m=>m.toLowerCase()===k.toLowerCase()); return i>=0?i:11; }

  // Collect all unique short-month keys present across all years
  const allMonKeys=[];
  years.forEach(yr=>{
    yg[yr].months.map(sl).forEach(lbl=>{
      const k=monKey(lbl);
      if(!allMonKeys.includes(k)) allMonKeys.push(k);
    });
  });
  allMonKeys.sort((a,b)=>monIdx(a)-monIdx(b));

  // Chart: YoY monthly totals (one line per year)
  const yoyDatasets = years.map((yr,yi)=>{
    const g=yg[yr];
    const map={};
    g.months.forEach((m,i)=>{ map[monKey(sl(m))]=g.totals[i]||0; });
    return {
      label: yr,
      data: allMonKeys.map(k=>map[k]!==undefined?map[k]:null),
      borderColor: YR_COLORS[yi%YR_COLORS.length],
      backgroundColor: YR_COLORS[yi%YR_COLORS.length]+'25',
      fill: false,
      tension: .4,
      pointRadius: 4,
      pointHoverRadius: 7,
      borderWidth: 2.5,
      spanGaps: false
    };
  });
  new Chart(document.getElementById('cYoY'),{type:'line',
    data:{labels:allMonKeys,datasets:yoyDatasets},
    options:{responsive:true,maintainAspectRatio:true,
      plugins:{legend:LEG,tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ₨${f(c.raw)}`}}},
      scales:sc()}});

  // Chart: YoY by category (grouped bar — one group per category, bar per year)
  const yrCatDatasets = years.map((yr,yi)=>{
    const g=yg[yr];
    return {
      label: yr,
      data: cats.map(c=>g.catTotals[c.name]||0),
      backgroundColor: YR_COLORS[yi%YR_COLORS.length]+'bb',
      borderWidth: 0,
      borderRadius: 4
    };
  });
  new Chart(document.getElementById('cYrCat'),{type:'bar',
    data:{labels:cats.map(c=>c.name),datasets:yrCatDatasets},
    options:{responsive:true,maintainAspectRatio:true,
      plugins:{legend:LEG,tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ₨${f(c.raw)}`}}},
      scales:sc()}});

  // Chart: YoY avg monthly spend per category
  const yrAvgCatDatasets = years.map((yr,yi)=>{
    const g=yg[yr];
    const moCnt=g.months.length||1;
    return {
      label: yr,
      data: cats.map(c=>(g.catTotals[c.name]||0)/moCnt),
      backgroundColor: YR_COLORS[yi%YR_COLORS.length]+'99',
      borderColor:     YR_COLORS[yi%YR_COLORS.length],
      borderWidth: 1,
      borderRadius: 4
    };
  });
  new Chart(document.getElementById('cYrAvgCat'),{type:'bar',
    data:{labels:cats.map(c=>c.name),datasets:yrAvgCatDatasets},
    options:{responsive:true,maintainAspectRatio:true,
      plugins:{legend:LEG,tooltip:{callbacks:{label:c=>` ${c.dataset.label} avg/mo: ₨${f(c.raw)}`}}},
      scales:sc()}});

  // ════════════════════════════════════════════════════════════
  // MONTHLY CHARTS
  // ════════════════════════════════════════════════════════════

  // Trend
  new Chart(document.getElementById('cTrend'),{type:'line',data:{labels,datasets:[
    {label:'Total Spend',data:totals,borderColor:'#6366f1',backgroundColor:'rgba(99,102,241,.12)',
     fill:true,tension:.4,pointBackgroundColor:'#6366f1',pointRadius:4,pointHoverRadius:7,borderWidth:2.5},
    {label:'Average',data:totals.map(()=>avg),borderColor:'rgba(239,68,68,.5)',borderDash:[5,5],
     borderWidth:1.5,fill:false,pointRadius:0,tension:0}
  ]},options:{responsive:true,maintainAspectRatio:true,
    plugins:{legend:LEG,tooltip:{callbacks:{label:c=>' ₨'+f(c.raw)}}},scales:sc()}});

  // Donut
  const dCats=catCur.filter(c=>c.val>0);
  new Chart(document.getElementById('cDonut'),{type:'doughnut',data:{
    labels:dCats.map(c=>c.name),
    datasets:[{data:dCats.map(c=>c.val),backgroundColor:dCats.map(c=>cc(c.name,c.i)),borderWidth:0,hoverOffset:8}]
  },options:{responsive:true,maintainAspectRatio:true,cutout:'62%',
    plugins:{legend:{...LEG,position:'bottom'},
      tooltip:{callbacks:{label:c=>' ₨'+f(c.raw)+' ('+((c.raw/cur)*100).toFixed(1)+'%)' }}}}});

  // Stacked bar
  new Chart(document.getElementById('cStack'),{type:'bar',data:{labels,
    datasets:cats.map((c,i)=>({label:c.name,data:c.values,backgroundColor:cc(c.name,i)+'cc',borderWidth:0,stack:'a'}))
  },options:{responsive:true,maintainAspectRatio:true,
    plugins:{legend:LEG,tooltip:{mode:'index',intersect:false,callbacks:{label:c=>' '+c.dataset.label+': ₨'+f(c.raw)}}},
    scales:sc(true)}});

  // Top 4 trends
  const top4=[...cats].sort((a,b)=>b.values.reduce((s,v)=>s+v,0)-a.values.reduce((s,v)=>s+v,0)).slice(0,4);
  new Chart(document.getElementById('cCatTrend'),{type:'line',data:{labels,
    datasets:top4.map(c=>({label:c.name,data:c.values,
      borderColor:cc(c.name,cats.indexOf(c)),backgroundColor:'transparent',
      tension:.4,pointRadius:3,pointHoverRadius:6,borderWidth:2}))
  },options:{responsive:true,maintainAspectRatio:true,
    plugins:{legend:LEG,tooltip:{callbacks:{label:c=>' ₨'+f(c.raw)}}},scales:sc()}});

  // MoM delta
  const momColors=momArr.map(v=>v>0?'rgba(239,68,68,.8)':v<0?'rgba(16,185,129,.8)':'rgba(148,163,184,.4)');
  new Chart(document.getElementById('cMom'),{type:'bar',data:{labels:labels.slice(1),
    datasets:[{label:'MoM Δ',data:momArr.slice(1),backgroundColor:momColors.slice(1),borderWidth:0,borderRadius:3}]
  },options:{responsive:true,maintainAspectRatio:true,
    plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' ₨'+f(Math.abs(c.raw))+(c.raw>=0?' ▲':' ▼')}}},
    scales:sc()}});

  // Category ranking
  new Chart(document.getElementById('cRank'),{type:'bar',data:{
    labels:catAll.map(c=>c.name),
    datasets:[{label:'All-time Total',data:catAll.map(c=>c.tot),
      backgroundColor:catAll.map((c,i)=>cc(c.name,c.i)+'cc'),borderWidth:0,borderRadius:4}]
  },options:{indexAxis:'y',responsive:true,maintainAspectRatio:true,
    plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' ₨'+f(c.raw)}}},
    scales:{x:{grid:{color:GC},ticks:{color:TC,callback:v=>'₨'+f(v)}},y:{grid:{color:'transparent'},ticks:{color:TC}}}}});

  // ════════════════════════════════════════════════════════════
  // INSIGHTS
  // ════════════════════════════════════════════════════════════
  const biggestMomIdx=momArr.slice(1).reduce((mx,v,i,a)=>Math.abs(v)>Math.abs(a[mx])?i:mx,0);
  const biggestMomVal=momArr[biggestMomIdx+1]||0;
  const biggestMomLbl=labels[biggestMomIdx+1]||'–';
  const topAllCat=catAll[0]||{name:'–',tot:0};
  const topAllPct=totals.reduce((a,b)=>a+b,0)>0?topAllCat.tot/totals.reduce((a,b)=>a+b,0)*100:0;
  const foodTrend=foodObj?foodObj.values.slice(-3):[];
  const foodDir=foodTrend.length>=2?(foodTrend[foodTrend.length-1]>foodTrend[0]?'↑ Rising':'↓ Falling'):'–';
  const rentVals=rentObj?rentObj.values.filter(v=>v>0):[];
  const avgRent=rentVals.length>0?rentVals.reduce((a,b)=>a+b,0)/rentVals.length:0;
  const abvAvg=totals.filter(v=>v>avg).length;
  const lowestCatCur=[...catCur].reverse()[0]||{name:'–',val:0};

  // Year-specific insight: best year
  const yrTotals=years.map(yr=>({yr,tot:yg[yr].totals.reduce((a,b)=>a+b,0)}));
  const bestYr=yrTotals.reduce((b,y)=>y.tot<b.tot?y:b,yrTotals[0]||{yr:'–',tot:0});
  const worstYr=yrTotals.reduce((b,y)=>y.tot>b.tot?y:b,yrTotals[0]||{yr:'–',tot:0});

  // YoY growth (last two years)
  let yoyInsight='–'; let yoyCls='nt';
  if(years.length>=2){
    const ya=years[years.length-2], yb=years[years.length-1];
    const ta=yg[ya].totals.reduce((a,b)=>a+b,0);
    const tb=yg[yb].totals.reduce((a,b)=>a+b,0);
    const pct=(tb-ta)/ta*100;
    yoyInsight=(pct>0?'▲ +':'▼ ')+Math.abs(pct).toFixed(1)+'% vs '+ya;
    yoyCls=pct>0?'bad':'good';
  }

  const ins=[
    {ico:'📊',lbl:'Above-Average Months',val:`${abvAvg} / ${n}`,cls:abvAvg>n/2?'bad':'good',
     desc:`${abvAvg} months exceeded avg of ₨${f(avg)}`},
    {ico:'📅',lbl:'Year-over-Year Spend',val:yoyInsight,cls:yoyCls,
     desc:years.map(yr=>`${yr}: ₨${f(yg[yr].totals.reduce((a,b)=>a+b,0))}`).join(' · ')},
    {ico:'🏆',lbl:'Best Year',val:bestYr.yr,cls:'good',
     desc:`₨${f(bestYr.tot)} total across ${(yg[bestYr.yr]||{months:[]}).months.length} months`},
    {ico:'⚠️',lbl:'Highest Year',val:worstYr.yr,cls:'bad',
     desc:`₨${f(worstYr.tot)} total across ${(yg[worstYr.yr]||{months:[]}).months.length} months`},
    {ico:'🍜',lbl:'Food Trend (last 3)',val:foodDir,cls:foodDir.includes('Rising')?'bad':'good',
     desc:foodTrend.map(v=>'₨'+f(v)).join(' → ')||'–'},
    {ico:'🏠',lbl:'Avg Rent',val:fr(avgRent),cls:'info',
     desc:`Consistent over ${rentVals.length} months. Currently ${fr(rentVal)}`},
    {ico:'🏷️',lbl:'Biggest All-Time Category',val:topAllCat.name,cls:'pur',
     desc:`₨${f(topAllCat.tot)} total — ${topAllPct.toFixed(1)}% of all spending`},
    {ico:'📈',lbl:'Biggest MoM Jump',val:`${biggestMomVal>=0?'+':''}${fr(biggestMomVal)}`,cls:biggestMomVal>0?'bad':'good',
     desc:`Happened in ${biggestMomLbl}`}
  ];

  document.getElementById('ig').innerHTML=ins.map(x=>`
    <div class="ic">
      <div class="ic-ico">${x.ico}</div>
      <div class="ic-lbl">${x.lbl}</div>
      <div class="ic-val ${x.cls}">${x.val}</div>
      <div class="ic-desc">${x.desc}</div>
    </div>`).join('');
}

// ── Fetch ─────────────────────────────────────────────────────────
google.script.run
  .withSuccessHandler(d=>{try{build(d);}catch(e){showErr('Render error: '+e.message);}})
  .withFailureHandler(e=>showErr(e.message||e.toString()))
  .getExpenseData();

function showErr(m){
  document.getElementById('root').innerHTML=`<div class="err"><div class="err-ico">⚠️</div><p>${m}</p></div>`;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Monthly Expense Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  :root {
    --bg:    #0a0e1a;
    --glass: rgba(255,255,255,0.04);
    --bdr:   rgba(255,255,255,0.08);
    --acc:   #6366f1; --acc2: #8b5cf6;
    --grn:   #10b981; --red: #ef4444;
    --amb:   #f59e0b; --cyn: #06b6d4;
    --t1:    #f1f5f9; --t2: #94a3b8; --t3: #475569;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;overflow-x:hidden;position:relative}
  body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(99,102,241,.12) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0}
  .orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.18;pointer-events:none;z-index:0;animation:drift 20s ease-in-out infinite alternate}
  .orb1{width:500px;height:500px;background:#6366f1;top:-200px;left:-100px;animation-duration:18s}
  .orb2{width:400px;height:400px;background:#8b5cf6;bottom:-100px;right:-100px;animation-duration:22s;animation-delay:-5s}
  .orb3{width:300px;height:300px;background:#06b6d4;top:40%;left:55%;animation-duration:16s;animation-delay:-8s}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,30px) scale(1.08)}}
  .page{position:relative;z-index:1;width:100%;padding:24px 20px 40px}

  /* header */
  .hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
  .hdr h1{font-size:22px;font-weight:700}
  .hdr p{font-size:13px;color:var(--t2);margin-top:3px}
  .badge{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:600;
    background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 0 16px rgba(99,102,241,.4)}

  /* loader */
  .loader{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:80px 0}
  .spinner{width:48px;height:48px;border:3px solid var(--bdr);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* section label */
  .sec-lbl{font-size:11px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:1px;
    margin-bottom:12px;padding-left:2px;border-left:3px solid var(--acc);padding-left:8px}

  /* KPI strip */
  .kpi-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:20px}
  .kpi{border-radius:14px;padding:16px 18px;background:var(--glass);border:1px solid var(--bdr);
    backdrop-filter:blur(12px);position:relative;overflow:hidden}
  .kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
  .kpi.c0::before{background:linear-gradient(90deg,var(--acc),var(--acc2))}
  .kpi.c1::before{background:linear-gradient(90deg,var(--cyn),#0ea5e9)}
  .kpi.c2::before{background:linear-gradient(90deg,var(--amb),#fb923c)}
  .kpi.c3::before{background:linear-gradient(90deg,var(--grn),#34d399)}
  .kpi.c4::before{background:linear-gradient(90deg,#f97316,var(--amb))}
  .kpi.c5::before{background:linear-gradient(90deg,#ec4899,#f43f5e)}
  .kpi-lbl{font-size:11px;font-weight:500;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
  .kpi-val{font-size:20px;font-weight:700;letter-spacing:-.5px}
  .kpi-sub{font-size:11px;color:var(--t2);margin-top:4px}
  .delta{font-size:11px;font-weight:600;padding:2px 7px;border-radius:10px;margin-top:6px;display:inline-block}
  .delta.up{background:rgba(239,68,68,.15);color:var(--red)}
  .delta.dn{background:rgba(16,185,129,.15);color:var(--grn)}
  .delta.nt{background:rgba(148,163,184,.1);color:var(--t2)}

  /* Year comparison strip */
  .yr-strip{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .yr-card{flex:1;min-width:200px;border-radius:14px;padding:18px 20px;
    background:var(--glass);border:1px solid var(--bdr);backdrop-filter:blur(12px);
    position:relative;overflow:hidden}
  .yr-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
  .yr-card:nth-child(1)::before{background:linear-gradient(90deg,#6366f1,#8b5cf6)}
  .yr-card:nth-child(2)::before{background:linear-gradient(90deg,#06b6d4,#0ea5e9)}
  .yr-card:nth-child(3)::before{background:linear-gradient(90deg,#10b981,#34d399)}
  .yr-card:nth-child(4)::before{background:linear-gradient(90deg,#f59e0b,#fb923c)}
  .yr-card-yr{font-size:24px;font-weight:800;letter-spacing:-1px;margin-bottom:6px}
  .yr-card-total{font-size:14px;font-weight:600;color:var(--t1);margin-bottom:4px}
  .yr-card-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
  .yr-card-m{font-size:11px;color:var(--t2)}
  .yr-card-m strong{color:var(--t1);font-weight:600}
  .yr-yoy{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
    padding:3px 9px;border-radius:12px;margin-top:8px}
  .yr-yoy.up{background:rgba(239,68,68,.15);color:var(--red)}
  .yr-yoy.dn{background:rgba(16,185,129,.15);color:var(--grn)}

  /* pills */
  .pills{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
  .pill{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;
    background:var(--glass);border:1px solid var(--bdr);backdrop-filter:blur(8px)}
  .pill em{color:var(--t2);font-style:normal;margin-right:4px}
  .pill.warn strong{color:var(--amb)}
  .pill.good strong{color:var(--grn)}
  .pill.bad  strong{color:var(--red)}
  .pill.info strong{color:var(--cyn)}
  .pill.pur  strong{color:var(--acc2)}

  /* chart grid */
  .row{display:grid;gap:16px;margin-bottom:16px}
  .r3{grid-template-columns:repeat(3,1fr)}
  .r2{grid-template-columns:repeat(2,1fr)}
  .r1{grid-template-columns:1fr}
  .r21{grid-template-columns:2fr 1fr}
  .cbox{border-radius:16px;padding:18px 18px 14px;background:var(--glass);border:1px solid var(--bdr);backdrop-filter:blur(12px)}
  .ctitle{font-size:13px;font-weight:600;color:var(--t1);margin-bottom:2px}
  .csub{font-size:11px;color:var(--t2);margin-bottom:14px}
  .cwrap canvas{max-height:230px}
  .cwrap.tall canvas{max-height:280px}

  /* insights */
  .ig{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
  .ic{border-radius:14px;padding:16px;background:var(--glass);border:1px solid var(--bdr);backdrop-filter:blur(10px)}
  .ic-ico{font-size:22px;margin-bottom:8px}
  .ic-lbl{font-size:11px;color:var(--t2);font-weight:500;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
  .ic-val{font-size:16px;font-weight:700}
  .ic-val.good{color:var(--grn)} .ic-val.bad{color:var(--red)} .ic-val.warn{color:var(--amb)}
  .ic-val.info{color:var(--cyn)} .ic-val.pur{color:var(--acc2)}
  .ic-desc{font-size:11px;color:var(--t2);margin-top:4px;line-height:1.5}

  /* error */
  .err{text-align:center;padding:48px;color:var(--red)}
  .err-ico{font-size:40px;margin-bottom:12px}

  /* ── Detail button inside KPI ── */
  .kpi-detail-btn{
    display:inline-flex;align-items:center;gap:5px;margin-top:10px;
    padding:5px 12px;border-radius:20px;border:none;cursor:pointer;
    background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3);
    color:var(--acc);font-size:11px;font-weight:600;font-family:inherit;
    transition:background .15s;
  }
  .kpi-detail-btn:hover{background:rgba(99,102,241,.28);}

  /* ── Expense Detail Popup ── */
  #expDetailOverlay{
    display:none;position:fixed;inset:0;z-index:9999;
    background:rgba(0,0,0,.72);backdrop-filter:blur(12px);
    align-items:center;justify-content:center;
    padding:16px;
  }
  #expDetailOverlay.open{display:flex;}
  #expDetailModal{
    background:#0d1220;border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    width:100%;max-width:640px;
    height:min(82vh, 700px);
    display:flex;flex-direction:column;
    box-shadow:0 24px 80px rgba(0,0,0,.7);
    animation:edmIn .25s ease;
  }
  @keyframes edmIn{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .edm-hdr{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px 14px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;
  }
  .edm-title{font-size:.95em;font-weight:700;color:#fff;}
  .edm-sub{font-size:.72em;color:var(--t2);margin-top:2px;}
  .edm-close{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    color:rgba(255,255,255,.5);border-radius:50%;width:30px;height:30px;
    cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
  .edm-close:hover{color:#fff;background:rgba(255,255,255,.12);}
  .edm-body{overflow-y:auto;flex:1;padding:14px 20px 24px;}
  .edm-loading{display:flex;align-items:center;justify-content:center;gap:12px;
    padding:48px;color:var(--t2);font-size:13px;}
  .edm-spinner{width:28px;height:28px;border:2px solid rgba(99,102,241,.2);
    border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
  /* list table */
  .edm-table{width:100%;border-collapse:collapse;}
  .edm-table th{font-size:.65em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--t3);padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;}
  .edm-table th:last-child{text-align:right;}
  .edm-table td{padding:8px 10px;font-size:.82em;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle;}
  .edm-table td:last-child{text-align:right;font-weight:700;color:var(--acc2);}
  .edm-table tr:hover td{background:rgba(255,255,255,.025);}
  .edm-day{font-size:.68em;color:var(--t3);font-weight:500;}
  .edm-cat{font-weight:700;color:var(--t1);font-size:.84em;}
  .edm-ref{color:var(--t2);font-size:.78em;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* category group header row */
  .edm-cat-row td{
    padding:10px 10px 6px;
    background:rgba(255,255,255,.03);
    border-top:1px solid rgba(255,255,255,.07);
    border-bottom:none;
  }
  .edm-cat-row:first-child td{border-top:none;}
  .edm-cat-sum{text-align:right!important;font-weight:700;color:var(--acc2);font-size:.82em;}
  .edm-total{display:flex;justify-content:space-between;align-items:center;
    padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.07);margin-top:4px;
    font-size:.82em;font-weight:700;color:var(--t2);}
  .edm-total-val{font-size:1.1em;color:var(--acc);}
  .edm-empty{text-align:center;padding:40px;color:var(--t3);}
  .edm-err{text-align:center;padding:32px;color:var(--red);font-size:.85em;}
  /* budget insights */
  .edm-insights{display:flex;gap:5px;flex-wrap:wrap;padding:0 0 12px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:8px;}
  .edm-ins-chip{flex:1;min-width:70px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:9px;padding:7px 9px;display:flex;flex-direction:column;gap:2px;}
  .edm-ins-lbl{font-size:.52em;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.28);}
  .edm-ins-val{font-size:.82em;font-weight:800;color:#fff;}
  .edm-ins-val.ok{color:var(--green);}
  .edm-ins-val.warn{color:var(--red);}
  .edm-ins-val.amber{color:#fb923c;}
  .edm-cat-row.edm-over td{background:rgba(255,77,109,.05)!important;border-left:2px solid rgba(255,77,109,.35);}
  .edm-cat-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;}
  .edm-cat-budget{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;}
  .edm-cat-budget-nums{font-size:.65em;color:rgba(255,255,255,.38);white-space:nowrap;}
  .edm-cat-budget-nums b{color:rgba(255,255,255,.7);}
  .edm-status-ok{display:inline-block;font-size:.58em;padding:2px 6px;border-radius:6px;background:rgba(0,230,118,.12);color:var(--green);border:1px solid rgba(0,230,118,.2);font-weight:700;white-space:nowrap;}
  .edm-status-warn{display:inline-block;font-size:.58em;padding:2px 6px;border-radius:6px;background:rgba(255,77,109,.12);color:var(--red);border:1px solid rgba(255,77,109,.2);font-weight:700;white-space:nowrap;}
  .edm-bar-wrap{height:3px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin-top:5px;}
  .edm-bar-fill{height:100%;border-radius:3px;}
  /* Budget editor collapsible */
  .edm-budget-editor{background:rgba(168,85,247,.06);border:1px solid rgba(168,85,247,.18);border-radius:12px;margin-bottom:12px;overflow:hidden;}
  .edm-be-hdr{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;cursor:pointer;user-select:none;}
  .edm-be-title{font-size:.72em;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#c084fc;}
  .edm-be-arrow{font-size:.82em;color:#c084fc;transition:transform .22s;}
  .edm-be-arrow.open{transform:rotate(180deg);}
  .edm-be-body{display:none;padding:10px 13px 13px;}
  .edm-be-body.open{display:block;}
  .edm-be-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;margin-bottom:11px;}
  .edm-be-row{display:flex;flex-direction:column;gap:3px;}
  .edm-be-lbl{font-size:.58em;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.35);}
  .edm-be-input{background:rgba(255,255,255,.06);border:1px solid rgba(168,85,247,.22);border-radius:7px;padding:5px 8px;font-size:.78em;font-weight:700;color:#fff;font-family:inherit;width:100%;box-sizing:border-box;outline:none;}
  .edm-be-input:focus{border-color:rgba(168,85,247,.55);background:rgba(168,85,247,.1);}
  .edm-be-save{width:100%;background:rgba(168,85,247,.22);border:1px solid rgba(168,85,247,.45);border-radius:9px;color:#c084fc;font-size:.78em;font-weight:800;font-family:inherit;padding:7px 0;cursor:pointer;transition:background .18s;}
  .edm-be-save:hover{background:rgba(168,85,247,.36);}
  .edm-be-save:disabled{opacity:.5;cursor:not-allowed;}
  .edm-be-msg{font-size:.65em;text-align:center;margin-top:6px;min-height:14px;}

  /* category colour dots */
  .edm-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;flex-shrink:0;vertical-align:middle;}
</style>
</head>
<body>
<div class="orb orb1"></div><div class="orb orb2"></div><div class="orb orb3"></div>
<div class="page">
  <div class="hdr">
    <div>
      <h1>📊 Monthly Expense Dashboard</h1>
      <p id="sub">Loading…</p>
    </div>
    <div class="badge" id="badge">–</div>
  </div>
  <div id="root">
    <div class="loader"><div class="spinner"></div><p style="color:var(--t2);font-size:13px">Fetching data…</p></div>
  </div>
</div>

<!-- ── Expense Detail Popup ── -->
<div id="expDetailOverlay" onclick="if(event.target===this)closeExpDetail()">
  <div id="expDetailModal">
    <div class="edm-hdr">
      <div>
        <div class="edm-title">📋 Current Month Expenses</div>
        <div class="edm-sub" id="edmSub">Loading…</div>
      </div>
      <button class="edm-close" onclick="closeExpDetail()">✕</button>
    </div>
    <div class="edm-body" id="edmBody">
      <div class="edm-loading"><div class="edm-spinner"></div>Fetching entries…</div>
    </div>
  </div>
</div>

<script>
// ── Category colours ──────────────────────────────────────────────
const CAT_COLORS = {
  'Food':'#f59e0b','Super market':'#10b981','Uber':'#6366f1',
  'Uber Work':'#8b5cf6','Movies & outing':'#ec4899','Other Expences':'#f97316',
  'Bus Fair':'#06b6d4','Party':'#ef4444','Dress and Appearance':'#84cc16','Rent':'#64748b'
};
const FALLBACK=['#6366f1','#8b5cf6','#06b6d4','#f59e0b','#10b981','#ec4899','#f97316','#ef4444','#84cc16','#64748b'];
const YR_COLORS=['#6366f1','#06b6d4','#10b981','#f59e0b','#ec4899','#f97316'];
const cc=(name,i)=>CAT_COLORS[name]||FALLBACK[i%FALLBACK.length];

// ── Formatters ────────────────────────────────────────────────────
const sl=s=>{
  const p=s.trim().split(/\s+/);
  if(p.length<2) return s.substring(0,6);
  let m=p[0].substring(0,3);
  if(m.toUpperCase()==='OTC') m='Oct';
  return m+" '"+p[p.length-1].substring(2);
};
const f =n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString('en-IN');
const fr=n=>'₨ '+Math.round(n).toLocaleString('en-IN');

// ── Chart defaults ────────────────────────────────────────────────
Chart.defaults.color='#94a3b8';
Chart.defaults.font.family="'Inter',sans-serif";
Chart.defaults.font.size=11;
const GC='rgba(255,255,255,0.05)',TC='#475569';
const sc=(stacked)=>({
  x:{grid:{color:GC},ticks:{color:TC,maxRotation:35},stacked:!!stacked},
  y:{grid:{color:GC},ticks:{color:TC,callback:v=>'₨'+f(v)},stacked:!!stacked}
});
const LEG={labels:{color:'#94a3b8',boxWidth:10,padding:14,font:{size:11}}};

// ── Build ─────────────────────────────────────────────────────────
function build(D) {
  const months    = D.months;
  const totals    = D.monthlyTotals;
  const cats      = D.categories;
  const yg        = D.yearGroups;   // { '2025': {months,indices,totals,catTotals}, ... }
  const latest    = D.latestMonth;
  const labels    = months.map(sl);
  const n         = months.length;
  const li        = n-1;

  // ── Sorted year list ──────────────────────────────────────────
  const years = Object.keys(yg).sort();

  // ── Overall derived ───────────────────────────────────────────
  const cur    = totals[li]||0;
  const prev   = totals[li-1]||0;
  const mom    = prev>0?(cur-prev)/prev*100:0;
  const avg    = totals.reduce((a,b)=>a+b,0)/(n||1);
  const bestI  = totals.indexOf(Math.min(...totals));
  const worstI = totals.indexOf(Math.max(...totals));

  const catCur  = cats.map((c,i)=>({name:c.name,val:c.values[li]||0,i})).sort((a,b)=>b.val-a.val);
  const topCat  = catCur[0]||{name:'–',val:0};
  const rentObj = cats.find(c=>c.name.toLowerCase()==='rent');
  const rentVal = rentObj?rentObj.values[li]||0:0;
  const varSpd  = cur-rentVal;
  const rentPct = cur>0?rentVal/cur*100:0;
  const foodObj = cats.find(c=>c.name.toLowerCase()==='food');
  const foodVal = foodObj?foodObj.values[li]||0:0;
  const foodPct = cur>0?foodVal/cur*100:0;
  const discNames=['movies & outing','party','dress and appearance'];
  const discVal = cats.filter(c=>discNames.includes(c.name.toLowerCase())).reduce((s,c)=>s+(c.values[li]||0),0);
  const discPct = cur>0?discVal/cur*100:0;
  const momArr  = totals.map((v,i)=>i===0?0:v-totals[i-1]);
  const catAll  = cats.map((c,i)=>({name:c.name,tot:c.values.reduce((s,v)=>s+v,0),i})).sort((a,b)=>b.tot-a.tot);
  const transVal= ['uber','uber work','bus fair'].reduce((s,nm)=>{
    const c=cats.find(x=>x.name.toLowerCase()===nm); return s+(c?c.values[li]||0:0);},0);

  // ── Year KPI cards HTML ───────────────────────────────────────
  const yrCards = years.map((yr,yi)=>{
    const g = yg[yr];
    const yrTotal   = g.totals.reduce((a,b)=>a+b,0);
    const yrAvg     = yrTotal/(g.months.length||1);
    const yrBestI   = g.totals.indexOf(Math.min(...g.totals));
    const yrWorstI  = g.totals.indexOf(Math.max(...g.totals));
    // YoY vs previous year
    let yoyHtml='';
    if(yi>0){
      const prevYr = years[yi-1];
      const prevTotal = yg[prevYr].totals.reduce((a,b)=>a+b,0);
      if(prevTotal>0){
        const yoyPct=(yrTotal-prevTotal)/prevTotal*100;
        yoyHtml=`<div class="yr-yoy ${yoyPct>0?'up':'dn'}">${yoyPct>0?'▲':'▼'} ${Math.abs(yoyPct).toFixed(1)}% vs ${prevYr}</div>`;
      }
    }
    return `<div class="yr-card">
      <div class="yr-card-yr">${yr}</div>
      <div class="yr-card-total">${fr(yrTotal)} total · ${g.months.length} months</div>
      <div class="yr-card-meta">

      ${yoyHtml}

  }).join('');

  // ── Render skeleton ───────────────────────────────────────────
  document.getElementById('sub').textContent=`${n} months tracked · Latest: ${latest}`;

  document.getElementById('root').innerHTML=`

    <div class="kpi c1">

  <!-- ── INSIGHT PILLS ── -->
  <div class="pills">

    <div class="pill ${foodPct>30?'warn':''}"><em>🍜 Food</em><strong>${foodPct.toFixed(1)}%</strong></div>
    <div class="pill ${discPct>15?'warn':''}"><em>🎉 Discretionary</em><strong>${discPct.toFixed(1)}%</strong></div>
    <div class="pill info"><em>🚗 Transport</em><strong>${fr(transVal)}</strong></div>
    <div class="pill ${cur<avg?'good':'bad'}"><em>vs Avg</em><strong>${cur<avg?'Below avg ✓':'Above avg'}</strong></div>
    <div class="pill pur"><em>📉 Worst month</em><strong>${sl(months[worstI]||'–')}</strong></div>
    <div class="pill"><em>📈 All-time total</em><strong>${fr(totals.reduce((a,b)=>a+b,0))}</strong></div>

  <!-- ── YEAR COMPARISON ── -->
  <div class="sec-lbl" style="margin-top:8px">Year Comparison</div>

    labels:dCats.map(c=>c.name),

    plugins:{legend:{...LEG,position:'bottom'},

  // Stacked bar
  new Chart(document.getElementById('cStack'),{type:'bar',data:{labels,

  },options:{responsive:true,maintainAspectRatio:true,
    plugins:{legend:LEG,tooltip:{mode:'index',intersect:false,callbacks:{label:c=>' '+c.dataset.label+': ₨'+f(c.raw)}}},
    scales:sc(true)}});

  // Top 4 trends
  const top4=[...cats].sort((a,b)=>b.values.reduce((s,v)=>s+v,0)-a.values.reduce((s,v)=>s+v,0)).slice(0,4);
  new Chart(document.getElementById('cCatTrend'),{type:'line',data:{labels,
    datasets:top4.map(c=>({label:c.name,data:c.values,
      borderColor:cc(c.name,cats.indexOf(c)),backgroundColor:'transparent',
      tension:.4,pointRadius:3,pointHoverRadius:6,borderWidth:2}))
  },options:{responsive:true,maintainAspectRatio:true,
    plugins:{legend:LEG,tooltip:{callbacks:{label:c=>' ₨'+f(c.raw)}}},scales:sc()}});

  // MoM delta
  const momColors=momArr.map(v=>v>0?'rgba(239,68,68,.8)':v<0?'rgba(16,185,129,.8)':'rgba(148,163,184,.4)');
  new Chart(document.getElementById('cMom'),{type:'bar',data:{labels:labels.slice(1),
    datasets:[{label:'MoM Δ',data:momArr.slice(1),backgroundColor:momColors.slice(1),borderWidth:0,borderRadius:3}]
  },options:{responsive:true,maintainAspectRatio:true,
    plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' ₨'+f(Math.abs(c.raw))+(c.raw>=0?' ▲':' ▼')}}},
    scales:sc()}});

  // Category ranking
  new Chart(document.getElementById('cRank'),{type:'bar',data:{
    labels:catAll.map(c=>c.name),
    datasets:[{label:'All-time Total',data:catAll.map(c=>c.tot),
      backgroundColor:catAll.map((c,i)=>cc(c.name,c.i)+'cc'),borderWidth:0,borderRadius:4}]
  },options:{indexAxis:'y',responsive:true,maintainAspectRatio:true,
    plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' ₨'+f(c.raw)}}},
    scales:{x:{grid:{color:GC},ticks:{color:TC,callback:v=>'₨'+f(v)}},y:{grid:{color:'transparent'},ticks:{color:TC}}}}});

  // ════════════════════════════════════════════════════════════
  // INSIGHTS
  // ════════════════════════════════════════════════════════════
  const biggestMomIdx=momArr.slice(1).reduce((mx,v,i,a)=>Math.abs(v)>Math.abs(a[mx])?i:mx,0);
  const biggestMomVal=momArr[biggestMomIdx+1]||0;
  const biggestMomLbl=labels[biggestMomIdx+1]||'–';
  const topAllCat=catAll[0]||{name:'–',tot:0};
  const topAllPct=totals.reduce((a,b)=>a+b,0)>0?topAllCat.tot/totals.reduce((a,b)=>a+b,0)*100:0;
  const foodTrend=foodObj?foodObj.values.slice(-3):[];
  const foodDir=foodTrend.length>=2?(foodTrend[foodTrend.length-1]>foodTrend[0]?'↑ Rising':'↓ Falling'):'–';
  const rentVals=rentObj?rentObj.values.filter(v=>v>0):[];

  const abvAvg=totals.filter(v=>v>avg).length;
  const lowestCatCur=[...catCur].reverse()[0]||{name:'–',val:0};

  // Year-specific insight: best year
  const yrTotals=years.map(yr=>({yr,tot:yg[yr].totals.reduce((a,b)=>a+b,0)}));
  const bestYr=yrTotals.reduce((b,y)=>y.tot<b.tot?y:b,yrTotals[0]||{yr:'–',tot:0});
  const worstYr=yrTotals.reduce((b,y)=>y.tot>b.tot?y:b,yrTotals[0]||{yr:'–',tot:0});

  // YoY growth (last two years)
  let yoyInsight='–'; let yoyCls='nt';
  if(years.length>=2){
    const ya=years[years.length-2], yb=years[years.length-1];
    const ta=yg[ya].totals.reduce((a,b)=>a+b,0);
    const tb=yg[yb].totals.reduce((a,b)=>a+b,0);
    const pct=(tb-ta)/ta*100;
    yoyInsight=(pct>0?'▲ +':'▼ ')+Math.abs(pct).toFixed(1)+'% vs '+ya;
    yoyCls=pct>0?'bad':'good';
  }

  const ins=[
    {ico:'📊',lbl:'Above-Average Months',val:`${abvAvg} / ${n}`,cls:abvAvg>n/2?'bad':'good',
     desc:`${abvAvg} months exceeded avg of ₨${f(avg)}`},
    {ico:'📅',lbl:'Year-over-Year Spend',val:yoyInsight,cls:yoyCls,

    {ico:'🏆',lbl:'Best Year',val:bestYr.yr,cls:'good',
     desc:`₨${f(bestYr.tot)} total across ${(yg[bestYr.yr]||{months:[]}).months.length} months`},

// ── Category colour map (matching expenseDashboard) ──────────────
const EDM_COLORS = {
  'Food':'#f59e0b','Supermarket':'#10b981','Uber':'#6366f1',
  'Uber Work':'#8b5cf6','Movies & Outing':'#ec4899','Other':'#f97316',
  'Bus Fair':'#06b6d4','Party':'#ef4444','Dress & Appearance':'#84cc16','Rent':'#64748b'
};
const edmColor = n => EDM_COLORS[n] || '#94a3b8';

var _edmLoaded = false;

function openExpDetail() {
  document.getElementById('expDetailOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  if (_edmLoaded) return; // already fetched
  document.getElementById('edmBody').innerHTML =
    '<div class="edm-loading"><div class="edm-spinner"></div>Fetching entries…</div>';
  document.getElementById('edmSub').textContent = 'Loading…';
  google.script.run
    .withSuccessHandler(renderExpDetail)
    .withFailureHandler(function(e){
      document.getElementById('edmBody').innerHTML =
        '<div class="edm-err">⚠ ' + (e.message||String(e)) + '</div>';
    })
    .getCurrentMonthExpensesList();
}

function closeExpDetail() {
  document.getElementById('expDetailOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function renderExpDetail(data) {
  _edmLoaded = true;
  var body = document.getElementById('edmBody');
  var sub  = document.getElementById('edmSub');

  if (!data || !data.success) {
    body.innerHTML = '<div class="edm-err">⚠ ' + (data && data.error ? data.error : 'Failed to load') + '</div>';
    return;
  }

  var entries = data.entries || [];
  var cp      = data.controlPlan || {};
  var months  = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var mName   = months[data.month] || ('Month ' + data.month);
  sub.textContent = mName + ' · ' + entries.length + ' entries';

  if (entries.length === 0) {
    body.innerHTML = '<div class="edm-empty">No expense entries found for ' + mName + '.</div>';
    return;
  }

  var CAT_ORDER = ['Food','Supermarket','Uber','Uber Work','Movies & Outing','Other',
                   'Bus Fair','Dress & Appearance','Party','Rent'];
  entries.sort(function(a, b) {
    var ai = CAT_ORDER.indexOf(a.category), bi = CAT_ORDER.indexOf(b.category);
    if (ai < 0) ai = 99; if (bi < 0) bi = 99;
    return ai !== bi ? ai - bi : a.day - b.day;
  });

  // Per-category spent
  var catSpent = {};
  entries.forEach(function(e) { catSpent[e.category] = (catSpent[e.category] || 0) + e.amount; });

  // Insight aggregates
  var totalSpent = entries.reduce(function(s, e) { return s + e.amount; }, 0);
  var totalBudget = 0, exceededCount = 0, savedAmt = 0;
  // Total budget = ALL control plan categories, not just ones with spending this month
  Object.keys(cp).forEach(function(cat) { if (cp[cat] > 0) totalBudget += cp[cat]; });
  Object.keys(catSpent).forEach(function(cat) {
    var budget = cp[cat] || 0;
    if (budget > 0) {
      if (catSpent[cat] > budget) exceededCount++;
      else savedAmt += budget - catSpent[cat];
    }
  });
  var budgetUsedPct = totalBudget > 0 ? Math.min(totalSpent / totalBudget * 100, 999) : 0;

  function fmtI(n){ return '₨ ' + Math.round(n).toLocaleString('en-IN'); }

  // ── Budget editor collapsible ──
  window._edmCp = cp;
  var beHtml = '<div class="edm-budget-editor" id="edm-be-wrap">'
    + '<div class="edm-be-hdr" onclick="edmBeToggle()">'
    +   '<span class="edm-be-title">✏️ Adjust Budgets</span>'
    +   '<span class="edm-be-arrow" id="edm-be-arrow">▼</span>'
    + '</div>'
    + '<div class="edm-be-body" id="edm-be-body">'
    +   '<div class="edm-be-grid">';
  CAT_ORDER.forEach(function(cat) {
    var val = cp[cat] || 0;
    beHtml += '<div class="edm-be-row">'
      + '<label class="edm-be-lbl">' + cat + '</label>'
      + '<input class="edm-be-input" type="number" id="edm-be-' + cat.replace(/[^a-z0-9]/gi,'_') + '" value="' + val + '" min="0" step="100">'
      + '</div>';
  });
  beHtml += '</div>'
    + '<button class="edm-be-save" id="edm-be-save" onclick="expSaveBudgets()">💾 Save Budgets</button>'
    + '<div class="edm-be-msg" id="edm-be-msg"></div>'
    + '</div></div>';

  // Insights strip
  var insHtml = '<div class="edm-insights">';
  if (totalBudget > 0) {
    var usedCls = budgetUsedPct >= 100 ? 'warn' : budgetUsedPct >= 80 ? 'amber' : 'ok';
    insHtml += '<div class="edm-ins-chip"><div class="edm-ins-lbl">Total Budget</div><div class="edm-ins-val">' + fmtI(totalBudget) + '</div></div>';
    insHtml += '<div class="edm-ins-chip"><div class="edm-ins-lbl">Total Spent</div><div class="edm-ins-val ' + usedCls + '">' + fmtI(totalSpent) + '</div></div>';
    insHtml += '<div class="edm-ins-chip"><div class="edm-ins-lbl">Budget Used</div><div class="edm-ins-val ' + usedCls + '">' + budgetUsedPct.toFixed(0) + '%</div></div>';
    insHtml += exceededCount > 0
      ? '<div class="edm-ins-chip"><div class="edm-ins-lbl">Over Budget</div><div class="edm-ins-val warn">⚠ ' + exceededCount + ' cat' + (exceededCount > 1 ? 's' : '') + '</div></div>'
      : '<div class="edm-ins-chip"><div class="edm-ins-lbl">Saved</div><div class="edm-ins-val ok">' + fmtI(savedAmt) + '</div></div>';
  }
  insHtml += '</div>';

  // Table
  var html = beHtml + insHtml + '<table class="edm-table"><thead><tr><th>Day</th><th>Reference</th><th>Amount</th></tr></thead><tbody>';
  var lastCat = null;
  entries.forEach(function(e) {
    if (e.category !== lastCat) {
      lastCat = e.category;
      var spent  = catSpent[e.category] || 0;
      var budget = cp[e.category] || 0;
      var col    = edmColor(e.category);
      var isOver = budget > 0 && spent > budget;
      var rowCls = 'edm-cat-row' + (isOver ? ' edm-over' : '');

      if (budget > 0) {
        var pct      = Math.min(spent / budget * 100, 100);
        var barColor = isOver ? 'var(--red)' : pct >= 80 ? '#fb923c' : 'var(--green)';
        var diff     = Math.abs(spent - budget);
        var badge    = isOver
          ? '<span class="edm-status-warn">⚠ Over ₨' + Math.round(diff).toLocaleString('en-IN') + '</span>'
          : '<span class="edm-status-ok">✅ ₨' + Math.round(diff).toLocaleString('en-IN') + ' left</span>';
        html += '<tr class="' + rowCls + '"><td colspan="3">'
              + '<div class="edm-cat-hdr">'
              + '<div><span class="edm-dot" style="background:' + col + '"></span><span class="edm-cat">' + e.category + '</span></div>'
              + '<div class="edm-cat-budget"><div class="edm-cat-budget-nums"><b>₨' + Math.round(spent).toLocaleString('en-IN') + '</b> / ₨' + Math.round(budget).toLocaleString('en-IN') + '</div>' + badge + '</div>'
              + '</div>'
              + '<div class="edm-bar-wrap"><div class="edm-bar-fill" style="width:' + pct.toFixed(1) + '%;background:' + barColor + '"></div></div>'
              + '</td></tr>';
      } else {
        html += '<tr class="' + rowCls + '">'
              + '<td colspan="2"><span class="edm-cat"><span class="edm-dot" style="background:' + col + '"></span>' + e.category + '</span></td>'
              + '<td class="edm-cat-sum">₨ ' + Math.round(spent).toLocaleString('en-IN') + '</td></tr>';
      }
    }
    var ref = e.reference
      ? '<span class="edm-ref" title="' + e.reference + '">' + e.reference + '</span>'
      : '<span class="edm-ref" style="color:rgba(255,255,255,.18)">—</span>';
    html += '<tr><td><span class="edm-day">' + e.day + '</span></td><td>' + ref + '</td>'
          + '<td>₨ ' + Math.round(e.amount).toLocaleString('en-IN') + '</td></tr>';
  });
  html += '</tbody></table>';
  body.innerHTML = html
    + '<div class="edm-total"><span>Month Total · ' + entries.length + ' entries</span>'
    + '<span class="edm-total-val">₨ ' + Math.round(totalSpent).toLocaleString('en-IN') + '</span></div>';
}

function edmBeToggle() {
  var body  = document.getElementById('edm-be-body');
  var arrow = document.getElementById('edm-be-arrow');
  if (!body) return;
  var open = body.classList.toggle('open');
  if (arrow) arrow.classList.toggle('open', open);
}

function expSaveBudgets() {
  var CAT_ORDER = ['Food','Supermarket','Uber','Uber Work','Movies & Outing','Other',
                   'Bus Fair','Dress & Appearance','Party','Rent'];
  var btn = document.getElementById('edm-be-save');
  var msg = document.getElementById('edm-be-msg');
  if (!btn || !msg) return;
  var updates = {};
  CAT_ORDER.forEach(function(cat) {
    var inp = document.getElementById('edm-be-' + cat.replace(/[^a-z0-9]/gi,'_'));
    if (inp) updates[cat] = parseFloat(inp.value) || 0;
  });
  btn.disabled = true;
  btn.textContent = '⏳ Saving…';
  msg.textContent = '';
  msg.style.color = '';
  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false;
      btn.textContent = '💾 Save Budgets';
      if (res && res.success) {
        msg.textContent = '✅ Saved! Reload to see updated budgets.';
        msg.style.color = '#00e676';
        _edmLoaded = false; // force refresh next open
      } else {
        msg.textContent = '⚠ ' + ((res && res.error) || 'Save failed');
        msg.style.color = '#ff4d6d';
      }
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.textContent = '💾 Save Budgets';
      msg.textContent = '⚠ ' + (err.message || 'Error saving');
      msg.style.color = '#ff4d6d';
    })
    .saveControlPlan(updates);
}

// ── Fetch ─────────────────────────────────────────────────────────
google.script.run
  .withSuccessHandler(d=>{try{build(d);}catch(e){showErr('Render error: '+e.message);}})
  .withFailureHandler(e=>showErr(e.message||e.toString()))
  .getExpenseData();

function showErr(m){
  document.getElementById('root').innerHTML=`<div class="err"><div class="err-ico">⚠️</div><p>${m}</p></div>`;
}
</script>
</body>
</html>

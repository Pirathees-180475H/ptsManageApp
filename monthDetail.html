<!-- ═══════════════════════════════════════════════════════════════
     MONTH DETAIL  —  one month's entries, budgets and pace
     ───────────────────────────────────────────────────────────
     Lifted out of render.html (the old #exp-detail-overlay and its
     ~740 lines of expDetail*/edm* code) and rebuilt:

       · two columns — left answers "am I on track and where is it
         going", right is the ledger itself
       · the three donuts are gone; the category bars carried the
         same numbers and can be read to the rupee
       · colours and glass surfaces match the expense page (#page-exp in
         render-style.html): indigo → violet accent, expense category
         colours, good/warn/bad status steps each paired with a label
       · the day calendar is round dots in the four GitHub contribution
         greens against the daily budget (under half · under budget · up to
         1.5× · beyond), with each week's total and budget bar at the end of
         its row; hovering a day or a week shows its total and entries
       · the ledger's category view is a grid of cards; a card swaps the
         grid for that category's entries, and Back brings the grid back
       · filters (over budget / to claim / claimed / junk) + search
       · budget editing moved into a side drawer
       · overspend redistribution is a visible switch, not a silent
         rewrite of the numbers you are reading

     Backend, all already in Code.gs — nothing new was added:
       getCurrentMonthExpensesList(month, year)   read
       saveControlPlan(updates)                   budgets
       updateClaimStatus(m, y, day, cat, ref)     claim toggle
       updateFoodJunkStatus(m, y, day, ref)       junk toggle

     Talks to render.html through three hooks only:
       out — mdOpen()     opened by the expense FAB wheel
             mdReset()    called from reloadPage('exp')
             mdPrefetch() called on boot — warms the current month
       in  — haptic() when present

     Included from render.html via:  <?!= include('monthDetail'); ?>
═══════════════════════════════════════════════════════════════ -->
<style>
/* Every rule is scoped to #md-overlay so nothing here can reach the
   rest of the app — and nothing in render-style.html reaches in. */
#md-overlay{
  position:fixed;inset:0;z-index:9400;display:none;
  background:rgba(6,11,24,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  align-items:center;justify-content:center;padding:18px;
}
#md-overlay.open{display:flex;}
#md-overlay *{box-sizing:border-box;}

#md-panel{
  /* surfaces — the expense page's glass: white at 4% over the navy */
  --md-bg:rgba(6,11,24,.42); --md-pane:rgba(255,255,255,.02);
  --md-card:rgba(255,255,255,.04); --md-field:rgba(255,255,255,.03);
  --md-line:rgba(255,255,255,.08); --md-line2:rgba(255,255,255,.13);
  --md-ink:#fff; --md-ink2:rgba(255,255,255,.7); --md-ink3:rgba(255,255,255,.42);
  /* accent — the expense page's indigo → violet */
  --md-acc:#6366f1; --md-acc2:#8b5cf6;
  --md-mag:#6366f1; --md-mag-hi:#a5b4fc;
  /* status — same steps as #page-exp; always shipped with a label */
  --md-good:#10b981; --md-warn:#f59e0b; --md-crit:#ef4444;
  --md-tag:#06b6d4;
  /* day heat — no spend (GitHub's empty cell); the greens are in MD_GREENS */
  --md-h0:#161b22;
  --md-num:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;

  position:relative;               /* the budget drawer anchors to this */
  width:min(1320px,100%);height:min(900px,94vh);
  display:flex;flex-direction:column;min-height:0;
  background:
    radial-gradient(520px 380px at 0% 0%,rgba(0,212,255,.10),transparent 70%),
    radial-gradient(480px 360px at 100% 100%,rgba(168,85,247,.10),transparent 70%),
    radial-gradient(360px 260px at 62% 48%,rgba(255,215,0,.05),transparent 70%),
    radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/28px 28px,
    var(--md-bg);
  color:var(--md-ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:14px;border-radius:18px;overflow:hidden;
  border:1px solid var(--md-line);box-shadow:0 30px 80px rgba(0,0,0,.5);
}
#md-panel .n{font-family:var(--md-num);font-variant-numeric:tabular-nums;}
#md-panel button,#md-panel input{font-family:inherit;}
#md-panel :focus-visible{outline:2px solid var(--md-acc);outline-offset:2px;border-radius:6px;}
/* several things in here are toggled with the hidden attribute and also carry
   a display: rule of their own — which would win. This settles it. */
#md-panel [hidden]{display:none !important;}

/* ── command bar ── */
#md-panel .md-cmd{
  flex-shrink:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:12px 18px;background:rgba(6,11,24,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--md-line);
}
#md-panel .md-cmd h2{font-size:15px;font-weight:800;letter-spacing:-.2px;margin:0;}
#md-panel .md-sq{
  width:34px;height:34px;border-radius:10px;border:1px solid var(--md-line2);
  background:var(--md-card);color:var(--md-ink2);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
#md-panel .md-sq:hover:not(:disabled){border-color:var(--md-acc);color:var(--md-ink);}
#md-panel .md-sq:disabled{opacity:.3;cursor:not-allowed;}
#md-panel .md-month{display:flex;align-items:center;gap:8px;}
#md-panel .md-month b{font-size:14px;font-weight:700;min-width:118px;text-align:center;}
#md-panel .md-spacer{flex:1;}
#md-panel .md-hero{display:flex;align-items:baseline;gap:9px;}
#md-panel .md-hero .v{font-family:var(--md-num);font-size:21px;font-weight:700;
  letter-spacing:-.7px;font-variant-numeric:tabular-nums;}
#md-panel .md-hero .of{font-size:12px;color:var(--md-ink2);}
#md-panel .md-btn{
  height:34px;padding:0 13px;border-radius:10px;border:1px solid var(--md-line2);
  background:var(--md-card);color:var(--md-ink2);font-size:12.5px;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;
}
#md-panel .md-btn:hover{color:var(--md-ink);border-color:rgba(255,255,255,.24);}
#md-panel .md-btn.on{background:rgba(99,102,241,.16);border-color:var(--md-acc);color:var(--md-ink);}

/* ── scope switch — Year · Month · Major ──
   The one control that used to be three separate screens. */
#md-panel .md-scope{display:flex;gap:2px;padding:3px;border-radius:12px;
  background:var(--md-field);border:1px solid var(--md-line);}
#md-panel .md-scope .md-sbtn{height:28px;padding:0 15px;border-radius:9px;border:0;
  background:transparent;color:var(--md-ink2);font-size:12.5px;font-weight:700;cursor:pointer;}
#md-panel .md-scope .md-sbtn:hover{color:var(--md-ink);}
#md-panel .md-scope .md-sbtn.on{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
  box-shadow:0 0 14px rgba(99,102,241,.45);}

/* ── scope bodies — exactly one is on at a time ── */
#md-panel .md-scopebody{flex:1;min-height:0;display:none;flex-direction:column;}
#md-panel .md-scopebody.on{display:flex;}
#md-panel #md-scope-year .yrs-wrap{height:auto;flex:1;min-height:0;background:transparent;}
#md-panel #md-scope-major{overflow-y:auto;}
#md-panel #md-scope-major::-webkit-scrollbar{width:6px;}
#md-panel #md-scope-major::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;}

/* ── day calendar — spreadsheet-style colour scale against the daily
   budget. Cells carry only the day; the hover card has the detail. ── */
#md-panel .md-ribbon{display:flex;flex-direction:column;gap:10px;}
#md-panel .md-rgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 62px;gap:5px 4px;
  width:88%;margin:0 auto;align-items:center;}
#md-panel .md-rdowlbl{font-size:10px;font-weight:600;text-align:center;color:var(--md-ink3);line-height:1;}
#md-panel .md-rcell{aspect-ratio:1;min-width:0;border-radius:50%;border:0;padding:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--md-h0);color:var(--md-ink3);font:inherit;font-size:11px;font-weight:700;
  font-variant-numeric:tabular-nums;transition:transform .12s,box-shadow .12s;}
#md-panel .md-rcell.g1{background:#0e4429;color:#fff;}
#md-panel .md-rcell.g2{background:#006d32;color:#fff;}
#md-panel .md-rcell.g3{background:#26a641;color:#04210f;}
#md-panel .md-rcell.g4{background:#39d353;color:#04210f;}
#md-panel .md-rcell.pad{visibility:hidden;}
#md-panel .md-rcell.fut{background:transparent;border:1px dashed var(--md-line);opacity:.55;}
#md-panel button.md-rcell{cursor:pointer;}
#md-panel button.md-rcell:hover{transform:scale(1.08);box-shadow:0 6px 18px rgba(0,0,0,.35);}
#md-panel .md-rcell.today{box-shadow:0 0 0 2px #060b18,0 0 0 3.5px #fff;}
#md-panel .md-rcell.sel{box-shadow:0 0 0 2px #060b18,0 0 0 3.5px var(--md-acc2),0 0 16px rgba(99,102,241,.6);}
/* week column — the week's total and a bar against its budget */
#md-panel .md-rwk{display:flex;flex-direction:column;justify-content:center;gap:4px;padding-left:6px;
  font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--md-ink2);cursor:default;
  border-left:1px solid var(--md-line);min-height:100%;}
#md-panel .md-rwk.over{color:#fca5a5;}
#md-panel .md-rwk .trk{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;}
#md-panel .md-rwk .trk i{display:block;height:100%;border-radius:2px;background:#26a641;}
#md-panel .md-rwk.over .trk i{background:#ef4444;}
#md-panel .md-rwk.none{color:var(--md-ink3);}
#md-panel .md-rwkh{font-size:10px;font-weight:600;color:var(--md-ink3);padding-left:6px;}
#md-panel .md-hkey{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--md-ink3);}
#md-panel .md-hkey .st{display:flex;gap:3px;}
#md-panel .md-hkey .st i{width:12px;height:12px;border-radius:3px;}

/* ── day hover card — on <body>, so no glass ancestor can clip it ── */
.md-htip{position:fixed;z-index:9700;pointer-events:none;width:270px;max-width:calc(100vw - 16px);
  padding:12px 14px;border-radius:14px;background:rgba(10,15,30,.95);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 36px rgba(0,0,0,.6);
  font-family:'Inter',system-ui,sans-serif;color:#fff;opacity:0;transition:opacity .12s;}
.md-htip.on{opacity:1;}
.md-htip .d{font-size:10.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:#a5b4fc;}
.md-htip .t{font-size:26px;font-weight:800;letter-spacing:-.8px;margin:3px 0 4px;font-variant-numeric:tabular-nums;}
.md-htip .b{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px;margin-bottom:8px;}
.md-htip .b.up{background:rgba(239,68,68,.16);color:#fca5a5;}
.md-htip .b.dn{background:rgba(16,185,129,.16);color:#6ee7b7;}
.md-htip .b.nt{background:rgba(148,163,184,.12);color:rgba(255,255,255,.6);}
.md-htip .it{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid rgba(255,255,255,.07);font-size:12px;}
.md-htip .it i{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.md-htip .it .x{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.md-htip .it .x small{color:rgba(255,255,255,.45);margin-left:5px;font-size:10.5px;}
.md-htip .it b{font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0;}
.md-htip .more{font-size:11px;color:rgba(255,255,255,.45);padding-top:5px;}
#md-panel .md-dayfilter{display:flex;align-items:center;gap:9px;margin-bottom:10px;
  padding:8px 12px;border-radius:10px;font-size:12.5px;
  background:rgba(99,102,241,.10);border:1px solid rgba(99,102,241,.38);}
#md-panel .md-dayfilter b{font-family:var(--md-num);}
#md-panel .md-dayfilter .x{margin-left:auto;height:26px;padding:0 10px;border-radius:8px;
  border:1px solid var(--md-line2);background:transparent;color:var(--md-ink2);
  font-size:11px;font-weight:700;cursor:pointer;}
#md-panel .md-dayfilter .x:hover{color:var(--md-ink);border-color:rgba(255,255,255,.24);}

/* ── columns ── */
#md-panel .md-body{flex:1;display:grid;grid-template-columns:440px minmax(0,1fr);min-height:0;}
#md-panel .md-col{overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0;}
#md-panel .md-col-l{background:var(--md-pane);border-right:1px solid var(--md-line);}
#md-panel .md-col::-webkit-scrollbar{width:6px;}
#md-panel .md-col::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;}

#md-panel .md-card{border-radius:16px;background:var(--md-card);border:1px solid var(--md-line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:relative;overflow:hidden;
  padding:16px;display:flex;flex-direction:column;gap:12px;flex-shrink:0;}

#md-panel .md-card::before,#md-panel .md-kp::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
#md-panel .c0::before{background:linear-gradient(90deg,#6366f1,#8b5cf6);}

#md-panel .c3::before{background:linear-gradient(90deg,#10b981,#34d399);}
#md-panel .c4::before{background:linear-gradient(90deg,#f97316,#f59e0b);}
#md-panel .c5::before{background:linear-gradient(90deg,#ec4899,#f43f5e);}
#md-panel .md-eye{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;
  letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.45);
  padding-left:8px;border-left:3px solid #6366f1;line-height:1.2;}
#md-panel .md-eye .n{letter-spacing:0;text-transform:none;color:var(--md-ink2);}

/* ── KPI strip — the expense page's .kpi-strip ── */
#md-panel .md-kstrip{flex-shrink:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
  gap:11px;padding:14px 18px 2px;}
#md-panel .md-kp{border-radius:14px;padding:13px 15px;background:var(--md-card);
  border:1px solid var(--md-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);

#md-panel .md-delta{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;
  margin-top:5px;display:inline-block;}
#md-panel .md-delta.up{background:rgba(239,68,68,.15);color:#ef4444;}
#md-panel .md-delta.dn{background:rgba(16,185,129,.15);color:#10b981;}
#md-panel .md-delta.nt{background:rgba(148,163,184,.1);color:var(--md-ink3);}
#md-panel .md-rule{flex:1;height:1px;background:var(--md-line);}

/* ── month meter ── */

/* ── chart ── */
#md-panel .md-chart-wrap{position:relative;}

#md-panel .md-camt{font-family:var(--md-num);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;}

#md-panel .md-tagbtn{height:23px;padding:0 9px;border-radius:999px;border:1px solid var(--md-line2);

#md-panel .md-tagbtn:disabled{opacity:.5;cursor:wait;}
#md-panel .md-tagbtn.claim{border-color:rgba(6,182,212,.45);color:#22d3ee;}
#md-panel .md-tagbtn.claimed{background:rgba(6,182,212,.15);border-color:rgba(6,182,212,.5);color:#a5f3fc;}
#md-panel .md-tagbtn.junk{border-color:rgba(245,158,11,.45);color:var(--md-warn);}

/* ── loading ── */
#md-panel .md-load{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;color:var(--md-ink3);font-size:13px;}
#md-panel .md-spin{width:38px;height:38px;border-radius:50%;
  border:3px solid rgba(255,255,255,.1);border-top-color:var(--md-mag);
  animation:mdSpin .8s linear infinite;}
@keyframes mdSpin{to{transform:rotate(360deg);}}

/* ── budget drawer ── */
#md-panel .md-drawer-bg{position:absolute;inset:0;background:rgba(6,11,24,.3);display:none;z-index:30;}
#md-panel .md-drawer-bg.open{display:block;}

  background:linear-gradient(90deg,#6366f1,#8b5cf6);}
#md-panel .md-drawer h3{font-size:15px;font-weight:800;margin:0;flex:1;}
#md-panel .md-brow{display:grid;grid-template-columns:minmax(0,1fr) 116px;gap:10px;align-items:center;}
#md-panel .md-brow label{font-size:13px;color:rgba(255,255,255,.85);font-weight:600;}
#md-panel .md-binp{height:38px;border-radius:10px;border:1px solid var(--md-line2);
  background:rgba(255,255,255,.05);color:var(--md-ink);padding:0 11px;font-family:var(--md-num);

#md-panel .md-binp:focus{border-color:var(--md-acc);outline:none;}
#md-panel .md-save{height:42px;border-radius:12px;border:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);
  box-shadow:0 0 14px rgba(99,102,241,.4);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;}
#md-panel .md-save:hover{filter:brightness(1.1);}
#md-panel .md-save:disabled{opacity:.45;cursor:not-allowed;}
#md-panel .md-msg{font-size:12.5px;min-height:18px;}

#md-panel .md-seg{display:none;gap:8px;}
@media(max-width:1100px){
  #md-panel .md-kstrip{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media(max-width:900px){
  #md-overlay{padding:0;}
  /* one swipeable row, so the ledger keeps the screen */

    overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none;}

  #md-panel{width:100%;height:100%;border-radius:0;border:none;}

  #md-panel .md-col-l{border-right:none;border-bottom:1px solid var(--md-line);}
  #md-panel .md-seg{display:flex;}
  #md-panel .md-col[hidden]{display:none;}
  #md-panel .md-hero{order:5;width:100%;}
}
@media(max-width:560px){
  #md-panel .md-col{padding:14px 16px;}
  #md-panel .md-cgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  #md-panel .md-ccard{padding:12px;}
  #md-panel .md-cdet-hd{flex-wrap:wrap;}
  #md-panel .md-ent{grid-template-columns:54px minmax(0,1fr);row-gap:4px;}
  #md-panel .md-ent.by-day{grid-template-columns:96px minmax(0,1fr);}
  #md-panel .md-amt{grid-column:2;text-align:left;color:var(--md-mag-hi);}
}
@media(prefers-reduced-motion:reduce){
  #md-panel *{transition:none!important;animation:none!important;}
}

/* ═══ helpers ═══ */
function mdFmt(n){ return Math.round(n).toLocaleString('en-IN'); }
function mdMoney(n){ return '₨ '+mdFmt(n); }
function mdEsc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function mdIsClaimed(r){ return /\bclaimed\b/i.test(r||''); }
function mdIsClaim(r){ return !mdIsClaimed(r) && /\bclaim\b|pick\s*me/i.test(r||''); }
function mdIsJunk(r){ return /\bjunk\b/i.test(r||''); }
function mdDow(y,m,d){ return MD_DOW[new Date(y, m-1, d).getDay()]; }
function mdIcon(kind){
  if(kind==='cat') return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>';
  if(kind==='cal') return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M3 10h18"/></svg>';
  if(kind==='alert') return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 8v5"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>';
  return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>';
}

function mdEntries(){ return (_mdData && _mdData.entries) || []; }
function mdSpentBy(){
  var m={};
  MD_CATS.forEach(function(c){ m[c]=0; });
  mdEntries().forEach(function(e){ m[e.category]=(m[e.category]||0)+e.amount; });
  return m;
}
function mdTotals(){
  var spent=mdEntries().reduce(function(s,e){ return s+e.amount; },0);
  var plan=MD_CATS.reduce(function(s,c){ return s+(_mdBudget[c]||0); },0);
  return {spent:spent, plan:plan};
}
function mdIsThisMonth(){
  var n=new Date();
  return _mdMonth===(n.getMonth()+1) && _mdYear===n.getFullYear();
}
function mdDaysInMonth(){ return new Date(_mdYear, _mdMonth, 0).getDate(); }
function mdElapsed(){
  var dim=mdDaysInMonth();
  return mdIsThisMonth() ? Math.max(1, Math.min(new Date().getDate(), dim)) : dim;
}

function mdOpen(scope){
  document.getElementById('md-overlay').classList.add('open');
  mdAdopt();
  if(!_mdMonth){
    var n=new Date();
    _mdMonth=n.getMonth()+1; _mdYear=n.getFullYear();
  }
  /* xfabRun() calls this with no argument — keep the scope we were last in */
  mdSwitchScope(typeof scope==='string' ? scope : _mdScope);
}
function mdClose(){
  document.getElementById('md-overlay').classList.remove('open');
  _mdSheetCat=''; mdTipHide();
  document.getElementById('md-drawerBg').classList.remove('open');
}
/* render.html calls this from reloadPage('exp') */
function mdReset(){
  _mdGen++; _mdCache={}; _mdInflight={}; _mdData=null;
  _mdMonth=0; _mdYear=0; _mdDay=0; _mdMajorShown=false;
}

/* ═══════════════════════════════════════════════
   SCOPES — Year (heatmap) · Month (ledger) · Major (things owned)

   expenseHeatmap and majorExpAnalyzer are still included by render.html,
   because include() there is createHtmlOutputFromFile and will not expand
   a nested scriptlet. They land in two hidden hosts; the first time the
   workspace opens we move their nodes into the scope bodies, so from then
   on there is one panel, one command bar and one budget drawer.
═══════════════════════════════════════════════ */
function mdAdopt(){
  if(_mdAdopted) return;
  _mdAdopted=true;
  ['year','major'].forEach(function(s){
    var src=document.getElementById('md-src-'+s);
    var dst=document.getElementById('md-scope-'+s);
    if(!src || !dst) return;
    while(src.firstChild) dst.appendChild(src.firstChild);
    if(src.parentNode) src.parentNode.removeChild(src);
  });
}

function mdSwitchScope(s){
  if(s!=='year' && s!=='month' && s!=='major') s='month';
  mdAdopt();
  _mdScope=s;

  var bodies={ year:'md-scope-year', month:'md-content', major:'md-scope-major' };
  Object.keys(bodies).forEach(function(k){
    var el=document.getElementById(bodies[k]);
    if(el) el.classList.toggle('on', k===s);
  });
  document.querySelectorAll('#md-panel .md-scope .md-sbtn').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-scope')===s);
  });

  var seg=document.getElementById('md-paneSeg');
  if(seg) seg.hidden = (s!=='month');

  mdSyncBar();

  if(s==='month')      mdLoad();
  else if(s==='year')  mdYearShow();
  else                 mdMajorShow();
}

/* the stepper reads as a year in Year scope, a month in Month scope,
   and has nothing to step through in Major */
function mdSyncBar(){
  var stepper=document.getElementById('md-stepper');
  var lbl=document.getElementById('md-label');
  var next=document.getElementById('md-next');
  if(!stepper || !lbl) return;

  if(_mdScope==='major'){ stepper.hidden=true; return; }
  stepper.hidden=false;

  if(_mdScope==='year'){
    lbl.textContent=_mdYear;
    if(next) next.disabled = _mdYear >= new Date().getFullYear();
  } else {
    lbl.textContent=MD_MONTHS[_mdMonth]+' '+_mdYear;
  }
}

function mdYearShow(){
  if(typeof hmLoad!=='function') return;
  /* the preload in render.html may already have this year in hand */
  if(typeof _hmData!=='undefined' && _hmData && _hmYear===_mdYear && typeof hmRender==='function'){
    hmRender(_hmData);
  } else {
    _hmYear=_mdYear;
    hmLoad();
  }
}

function mdMajorShow(){
  if(_mdMajorShown) return;
  _mdMajorShown=true;
  var pre=(typeof _analyzePreloadData!=='undefined') && _analyzePreloadData.majorexp;
  if(pre && typeof mxaDisplayData==='function') mxaDisplayData(pre);
  else if(typeof mxaLoad==='function') mxaLoad();
}

/* ── the two ways the heatmap drills down; both land in Month scope ── */
function mdOpenMonth(y, m){
  _mdYear=y; _mdMonth=m; _mdDay=0;
  _mdBuzz('tick');
  mdSwitchScope('month');
}
function mdOpenDay(y, m, d){
  _mdYear=y; _mdMonth=m; _mdDay=d;
  _mdBuzz('tick');
  mdSwitchScope('month');
}
/* a year bar in the heatmap */
function mdGoYear(y){
  _mdYear=y;
  if(typeof hmLoad==='function'){ _hmYear=y; hmLoad(); }
  mdSyncBar();
}

function mdStep(dir){
  if(_mdScope==='major') return;

  if(_mdScope==='year'){
    if(dir>0 && _mdYear>=new Date().getFullYear()) return;
    _mdYear+=dir;
    _mdBuzz('step');
    mdSyncBar();
    if(typeof hmLoad==='function'){ _hmYear=_mdYear; hmLoad(); }
    return;
  }

  _mdMonth+=dir;
  if(_mdMonth>12){ _mdMonth=1;  _mdYear++; }
  if(_mdMonth<1) { _mdMonth=12; _mdYear--; }
  _mdDay=0;
  _mdBuzz('step');
  mdLoad();
}

function mdErr(msg){
  document.getElementById('md-content').innerHTML=
    '<div style="padding:20px"><div class="md-err">\u26a0 '+mdEsc(msg)+'</div></div>';
}

/* One request per month, shared by mdLoad() and mdPrefetch(): whoever asks
   second rides the first one's answer instead of firing a second read. */
function mdFetch(m, y){
  var key=y+'-'+m;
  if(_mdCache[key] || _mdInflight[key]) return;
  _mdInflight[key]=true;
  var gen=_mdGen;

  /* paint only if this month is still the one on screen, and the overlay
     is actually open — a boot-time prefetch lands with it closed */
  function showing(){
    return gen===_mdGen && m===_mdMonth && y===_mdYear &&
           document.getElementById('md-overlay').classList.contains('open');
  }

  google.script.run
    .withSuccessHandler(function(res){
      if(gen!==_mdGen) return;               /* a reload has since wiped the cache */
      delete _mdInflight[key];
      if(res && res.success) _mdCache[key]=res;
      if(!showing()) return;
      if(!res || !res.success){ mdErr((res&&res.error)||'Could not read the month'); return; }
      mdApply(res);
    })
    .withFailureHandler(function(err){
      if(gen!==_mdGen) return;
      delete _mdInflight[key];
      if(showing()) mdErr(err&&err.message||err);
    })
    .getCurrentMonthExpensesList(m, y);
}

/* Warmed on boot from render.html — nothing waits on it. By the time the
   FAB is tapped the current month is usually already in _mdCache, and if
   it is still in flight mdLoad() just waits on that same request. */
function mdPrefetch(){
  var n=new Date();
  mdFetch(n.getMonth()+1, n.getFullYear());
}

function mdLoad(){
  var key=_mdYear+'-'+_mdMonth;
  document.getElementById('md-label').textContent=MD_MONTHS[_mdMonth]+' '+_mdYear;

  var n=new Date();
  document.getElementById('md-next').disabled =
    (_mdYear>n.getFullYear()) || (_mdYear===n.getFullYear() && _mdMonth>=n.getMonth()+1);

  if(_mdCache[key]){ mdApply(_mdCache[key]); return; }

  document.getElementById('md-content').innerHTML=
    '<div class="md-load"><div class="md-spin"></div>Reading '+MD_MONTHS[_mdMonth]+'\u2026</div>';
  document.getElementById('md-heroSpent').textContent='\u2014';

  mdFetch(_mdMonth, _mdYear);
}

function mdApply(res){
  _mdData=res;
  _mdBudget={};
  MD_CATS.forEach(function(c){ _mdBudget[c]=(res.controlPlan&&res.controlPlan[c])||0; });
  _mdFilter='all'; _mdQuery=''; _mdClosedDay={}; _mdSheetCat='';
  mdShell();
  mdRenderAll();
}

/* last month's per-category totals, for the ▲/▼ badge */
function mdLastMonth(cat){
  var lmt=(_mdData && _mdData.lastMonthTotals) || {};
  if(lmt[cat]!==undefined) return lmt[cat];
  var low=cat.toLowerCase();
  var hit=0;
  Object.keys(lmt).forEach(function(k){ if(k.toLowerCase()===low) hit=lmt[k]; });
  return hit;
}

/* ═══════════════════════════════════════════════
   DAY CALENDAR — each day measured against the daily budget:
   the plan less rent, spread over the month. Rent is paid once, so
   leaving it in would make every ordinary day read as light.
   With no plan set, days fall back to this month's own peak day.
═══════════════════════════════════════════════ */
/* The four GitHub contribution greens: t up to .25 → 1 … above .75 → 4.
   Against the daily budget that is under half · under budget · up to
   1.5× · beyond. */
var MD_GREENS = ['#161b22','#0e4429','#006d32','#26a641','#39d353'];
function mdGreenStep(t){ return t<=0 ? 0 : Math.min(4, Math.ceil(t*4)); }
function mdAllowance(){
  var plan=mdTotals().plan - (_mdBudget['Rent']||0);
  return plan>0 ? plan/mdDaysInMonth() : 0;
}
/* where a day falls on the scale: against the daily budget (on budget is
   yellow, twice it is red), or — with no plan — ranked among the month's
   spend days */
function mdHeatT(v, sorted){
  var allow=mdAllowance();
  if(allow>0) return Math.min(1, v/allow/2);
  var n=sorted.length;
  if(n<2) return .5;
  var i=0; while(i<n && sorted[i]<v) i++;
  return i/(n-1);
}
function mdShort(n){
  return n>=1e5 ? Math.round(n/1e3)+'K' : n>=1e3 ? (n/1e3).toFixed(n>=1e4?0:1)+'K' : String(Math.round(n));
}

function mdDayTotals(){
  var per={};
  mdEntries().forEach(function(e){ per[e.day]=(per[e.day]||0)+e.amount; });
  return per;
}

function mdRenderRibbon(){
  var host=document.getElementById('md-rib');
  if(!host) return;

  document.getElementById('md-ribDow').innerHTML=
    MD_DOW.map(function(d){ return '<span class="md-rdowlbl">'+d.slice(0,2)+'</span>'; }).join('')+
    '<span class="md-rwkh">Week</span>';

  var per=mdDayTotals(), peak=0, peakDay=0;
  Object.keys(per).forEach(function(k){ if(per[k]>peak){ peak=per[k]; peakDay=+k; } });
  var sorted=Object.keys(per).map(function(k){ return per[k]; })
    .filter(function(v){ return v>0; }).sort(function(a,b){ return a-b; });

  var dim=mdDaysInMonth();
  var lead=new Date(_mdYear, _mdMonth-1, 1).getDay();
  var today=mdIsThisMonth() ? new Date().getDate() : 0;

  var allow=mdAllowance();
  var h='', col=lead, wkFrom=1;
  /* closes a row: the week's total against its share of the budget */
  function weekCell(from, to){
    var tot=0; for(var x=from; x<=to; x++) tot+=per[x]||0;
    var bud=allow*(to-from+1), over=bud>0 && tot>bud, pct=bud>0 ? Math.min(tot/bud,1)*100 : 0;
    return '<span class="md-rwk'+(over?' over':'')+(tot?'':' none')+'" data-rwk="'+from+'-'+to+'"'+
      ' aria-label="'+from+' to '+to+' '+MD_MONTHS[_mdMonth]+', '+mdMoney(tot)+'">'+
      (tot?mdShort(tot):'—')+(bud>0?'<span class="trk"><i style="width:'+pct.toFixed(0)+'%"></i></span>':'')+'</span>';
  }
  for(var p=0; p<lead; p++) h+='<span class="md-rcell pad" aria-hidden="true"></span>';
  for(var d=1; d<=dim; d++){
    if(col===7){ h+=weekCell(wkFrom, d-1); col=0; wkFrom=d; }
    col++;
    if(today && d>today){ h+='<span class="md-rcell fut">'+d+'</span>'; continue; }
    var v=per[d]||0;
    var cls='md-rcell'+(v>0?' g'+mdGreenStep(mdHeatT(v, sorted)):'')+(d===today?' today':'')+(d===_mdDay?' sel':'');
    if(v>0){
      h+='<button type="button" class="'+cls+'" data-rday="'+d+'"'+
         ' aria-label="'+d+' '+MD_MONTHS[_mdMonth]+', '+mdMoney(v)+'"'+
         ' aria-pressed="'+(d===_mdDay?'true':'false')+'">'+d+'</button>';
    } else {
      h+='<span class="'+cls+'" data-rday0="'+d+'">'+d+'</span>';
    }
  }
  for(; col<7; col++) h+='<span class="md-rcell pad" aria-hidden="true"></span>';
  h+=weekCell(wkFrom, dim);
  host.innerHTML=h;
  host._mdSorted=sorted;
  mdWireDayTip(host);

  var peakLbl=document.getElementById('md-ribPeak');
  if(peakLbl) peakLbl.textContent = peak>0 ? 'peak '+mdShort(peak)+' on the '+peakDay : '';

  var key=document.getElementById('md-hkey');
  var tips = allow>0 ? ['Under half the daily budget','Under the daily budget','Up to 1.5× the daily budget','Over 1.5× the daily budget']
                     : ['Lightest quarter','Second quarter','Third quarter','Heaviest quarter'];
  key.className='md-hkey';
  key.innerHTML='<span>Less</span><span class="st">'+
    MD_GREENS.slice(1).map(function(c,i){ return '<i style="background:'+c+'" title="'+tips[i]+'"></i>'; }).join('')+
    '</span><span>More</span>';

  mdRenderDayBar(per);
}

/* ── day hover card ── */
function mdTipEl(){
  var el=document.getElementById('md-htip');
  if(!el){
    el=document.createElement('div');
    el.id='md-htip'; el.className='md-htip'; el.setAttribute('role','tooltip');
    document.body.appendChild(el);
  }
  return el;
}
function mdTipHide(){ var el=document.getElementById('md-htip'); if(el) el.classList.remove('on'); }
function mdDayTipHtml(d, sorted){
  var rows=mdEntries().filter(function(e){ return e.day===d; })
    .sort(function(a,b){ return b.amount-a.amount; });
  var v=rows.reduce(function(s,e){ return s+e.amount; },0);
  var head=mdDow(_mdYear,_mdMonth,d)+' '+d+' '+MD_MONTHS[_mdMonth].slice(0,3);
  if(!v) return '<div class="d">'+head+'</div><div style="font-size:12px;color:rgba(255,255,255,.55);margin-top:5px">Nothing recorded</div>';
  var allow=mdAllowance(), badge;
  if(allow>0){
    var pc=Math.round(v/allow*100);
    badge = v>allow
      ? '<span class="b up">'+pc+'% of daily budget · over by '+mdFmt(v-allow)+'</span>'
      : '<span class="b dn">'+pc+'% of daily budget · '+mdFmt(allow-v)+' to spare</span>';
  } else {
    var t=mdHeatT(v, sorted);
    badge='<span class="b nt">'+(t<.34?'A light day':t<.67?'An average day':'A heavy day')+' this month</span>';
  }
  var shown=rows.slice(0,8);
  return '<div class="d">'+head+'</div><div class="t">'+mdMoney(v)+'</div>'+badge+
    shown.map(function(e){
      return '<div class="it"><i style="background:'+mdCatColor(e.category)+'"></i>'+
        '<span class="x">'+mdEsc(e.reference||e.category)+(e.reference?'<small>'+mdEsc(e.category)+'</small>':'')+'</span>'+
        '<b>'+mdFmt(e.amount)+'</b></div>';
    }).join('')+
    (rows.length>shown.length?'<div class="more">+ '+(rows.length-shown.length)+' more</div>':'');
}
function mdWeekTipHtml(from, to){
  var rows=mdEntries().filter(function(e){ return e.day>=from && e.day<=to; });
  var tot=mdSum(rows), bud=mdAllowance()*(to-from+1);
  var byCat={}; rows.forEach(function(e){ byCat[e.category]=(byCat[e.category]||0)+e.amount; });
  var cats=Object.keys(byCat).sort(function(a,b){ return byCat[b]-byCat[a]; });
  var badge = bud>0
    ? (tot>bud ? '<span class="b up">over the week\'s budget by '+mdFmt(tot-bud)+'</span>'
               : '<span class="b dn">'+mdFmt(bud-tot)+' left of '+mdFmt(bud)+' for the week</span>')
    : '';
  return '<div class="d">Week · '+from+'–'+to+' '+MD_MONTHS[_mdMonth].slice(0,3)+'</div>'+
    '<div class="t">'+mdMoney(tot)+'</div>'+badge+
    (cats.length ? cats.slice(0,6).map(function(c){
      return '<div class="it"><i style="background:'+mdCatColor(c)+'"></i><span class="x">'+mdEsc(c)+'</span><b>'+mdFmt(byCat[c])+'</b></div>';
    }).join('') : '<div style="font-size:12px;color:rgba(255,255,255,.55)">Nothing recorded</div>');
}
function mdWireDayTip(host){
  if(host._mdTip) return;
  host._mdTip=true;
  var tip=mdTipEl();
  host.addEventListener('mouseover',function(ev){
    var w=ev.target.closest && ev.target.closest('[data-rwk]');
    if(w){
      var rg=w.getAttribute('data-rwk').split('-');
      tip.innerHTML=mdWeekTipHtml(+rg[0], +rg[1]);
      tip.classList.add('on'); return;
    }
    var c=ev.target.closest && ev.target.closest('[data-rday],[data-rday0]');
    if(!c){ tip.classList.remove('on'); return; }
    var d=+(c.getAttribute('data-rday')||c.getAttribute('data-rday0'));
    tip.innerHTML=mdDayTipHtml(d, host._mdSorted||[]);
    tip.classList.add('on');
  });
  host.addEventListener('mousemove',function(ev){
    if(!tip.classList.contains('on')) return;
    var w=tip.offsetWidth, h=tip.offsetHeight, x=ev.clientX+16, y=ev.clientY+16;
    if(x+w>window.innerWidth-8)  x=ev.clientX-w-16;
    if(y+h>window.innerHeight-8) y=ev.clientY-h-16;
    tip.style.left=Math.max(8,x)+'px'; tip.style.top=Math.max(8,y)+'px';
  });
  host.addEventListener('mouseleave',function(){ tip.classList.remove('on'); });
}

function mdRenderDayBar(per){
  var bar=document.getElementById('md-dayBar');
  if(!bar) return;
  if(!_mdDay){ bar.hidden=true; bar.innerHTML=''; return; }
  var n=mdEntries().filter(function(e){ return e.day===_mdDay; }).length;
  bar.hidden=false;
  bar.innerHTML=
    mdIcon('cal')+
    '<span>'+mdDow(_mdYear,_mdMonth,_mdDay)+' <b>'+_mdDay+' '+MD_MONTHS[_mdMonth]+'</b></span>'+
    '<span style="color:var(--md-ink2)">'+n+(n===1?' entry':' entries')+
      ' · <b>'+mdMoney((per||mdDayTotals())[_mdDay]||0)+'</b></span>'+
    '<button type="button" class="x" id="md-dayClear">Clear day</button>';
}

function mdRenderMeter(){
  var t=mdTotals(), spent=t.spent, plan=t.plan;
  var dim=mdDaysInMonth(), elapsed=mdElapsed(), left=Math.max(0,dim-elapsed);
  var perDay=spent/elapsed, projected=perDay*dim;
  var pct=plan>0?spent/plan*100:0;

  document.getElementById('md-heroSpent').textContent=mdMoney(spent);
  document.getElementById('md-heroPlan').textContent=mdFmt(plan);
  document.getElementById('md-spent').textContent=mdMoney(spent);
  document.getElementById('md-pct').textContent=plan>0?pct.toFixed(0)+'% of plan':'no plan set';
  document.getElementById('md-dayCount').textContent='day '+elapsed+' of '+dim;
  document.getElementById('md-fSpent').textContent=mdFmt(spent);
  document.getElementById('md-fProj').textContent=mdFmt(projected);
  document.getElementById('md-fPlan').textContent=mdFmt(plan);

  var fillPct=plan>0?Math.min(pct,100):0;
  var projPct=plan>0?Math.min(projected/plan*100,100):0;
  var f=document.getElementById('md-fill');
  f.style.width=fillPct.toFixed(1)+'%';
  f.style.background = pct>=100 ? 'linear-gradient(90deg,#ef4444,#f43f5e)'
                     : pct>=80  ? 'linear-gradient(90deg,#f59e0b,#fb923c)'
                     :            'linear-gradient(90deg,#10b981,#34d399)';
  f.style.boxShadow = '0 0 12px '+(pct>=100 ? 'rgba(239,68,68,.5)' : pct>=80 ? 'rgba(245,158,11,.45)' : 'rgba(16,185,129,.45)');
  mdRenderKpis(spent, plan, projected, elapsed, dim);
  var pr=document.getElementById('md-proj');
  pr.style.left=fillPct.toFixed(1)+'%';
  pr.style.width=Math.max(0,projPct-fillPct).toFixed(1)+'%';

  var dm=document.getElementById('md-daymark');
  dm.style.left=(elapsed/dim*100).toFixed(1)+'%';
  dm.style.display=mdIsThisMonth()?'block':'none';

  var p=document.getElementById('md-pace');
  if(plan<=0){
    p.className='md-pace ok';
    p.innerHTML=mdIcon('check')+'<span>No budget set for this month — set one from Budgets to track pace.</span>';
    return;
  }
  var over=projected-plan;
  if(over>0){
    p.className='md-pace bad';
    p.innerHTML=mdIcon('alert')+'<span>'+(mdIsThisMonth()
      ? 'At this pace you finish <b>'+mdFmt(over)+'</b> over plan. Holding the rest of the month to <b>'+
        mdFmt(Math.max(0,(plan-spent)/Math.max(left,1)))+'/day</b> lands on budget.'
      : 'Finished <b>'+mdFmt(spent-plan)+'</b> over plan.')+'</span>';
  } else {
    p.className='md-pace ok';
    p.innerHTML=mdIcon('check')+'<span>'+(mdIsThisMonth()
      ? 'On track — projected to finish <b>'+mdFmt(-over)+'</b> under plan with '+left+' days left.'
      : 'Finished <b>'+mdFmt(plan-spent)+'</b> under plan.')+'</span>';
  }
}

/* ── KPI strip — same shape as the expense page's ── */
function mdRenderKpis(spent, plan, projected, elapsed, dim){
  var host=document.getElementById('md-kstrip');
  if(!host) return;
  var all=mdEntries();
  var sum=function(a){ return a.reduce(function(s,e){ return s+e.amount; },0); };
  var claim=all.filter(function(e){ return mdIsClaim(e.reference); });
  var claimed=all.filter(function(e){ return mdIsClaimed(e.reference); });
  var junk=all.filter(function(e){ return mdIsJunk(e.reference); });

  /* last month, scaled to the same point in the month */
  var lmt=(_mdData && _mdData.lastMonthTotals) || {}, last=0;
  Object.keys(lmt).forEach(function(k){ last+=(+lmt[k]||0); });
  var lastSoFar=last*elapsed/dim;
  var vsLast = lastSoFar>0 ? (spent-lastSoFar)/lastSoFar*100 : null;
  function delta(pc, lbl){
    if(pc===null) return '';
    if(Math.abs(pc)<3) return '<span class="md-delta nt">\u2248 '+lbl+'</span>';
    return '<span class="md-delta '+(pc>0?'up':'dn')+'">'+(pc>0?'\u25b2 ':'\u25bc ')+Math.abs(pc).toFixed(0)+'% '+lbl+'</span>';
  }
  var live=mdIsThisMonth(), over=projected-plan, allow=mdAllowance();
  var K=[
    ['c0','Spent', mdMoney(spent), 'day '+elapsed+' of '+dim, delta(vsLast, 'vs last month')],
    ['c1','Plan', plan>0?mdMoney(plan):'\u2014', plan>0?Math.round(spent/plan*100)+'% used':'no plan set', ''],
    ['c5', live?'Projected':'Month total', mdMoney(live?projected:spent), '',
      plan>0 ? '<span class="md-delta '+(over>0?'up':'dn')+'">'+(over>0?'\u25b2 '+mdShort(over)+' over plan':'\u25bc '+mdShort(-over)+' under plan')+'</span>' : ''],
    ['c3','Daily average', mdMoney(spent/Math.max(elapsed,1)), allow>0?'budget '+mdMoney(allow)+'/day':'', ''],
    ['c4','To claim', mdMoney(sum(claim)), claim.length+' open \u00b7 '+claimed.length+' claimed', ''],
    ['c2','Junk food', mdMoney(sum(junk)), junk.length+(junk.length===1?' entry':' entries'), '']
  ];
  host.innerHTML=K.map(function(k){
    return '<div class="md-kp '+k[0]+'"><div class="l">'+k[1]+'</div><div class="v">'+k[2]+'</div>'+
      (k[3]?'<div class="s">'+k[3]+'</div>':'')+k[4]+'</div>';
  }).join('');
}

/* daily spend — one series, one axis */
function mdRenderChart(){
  var daily={}, byCat={};
  mdEntries().forEach(function(e){
    daily[e.day]=(daily[e.day]||0)+e.amount;
    if(!byCat[e.day]) byCat[e.day]={};
    byCat[e.day][e.category]=(byCat[e.day][e.category]||0)+e.amount;
  });

  var last=mdElapsed();
  var W=360,H=210,padL=36,padR=6,padT=18,padB=22;
  var pw=W-padL-padR, ph=H-padT-padB;
  var max=0; for(var d=1; d<=last; d++) max=Math.max(max, daily[d]||0);
  if(max<=0) max=1;
  var nice=Math.ceil(max/5000)*5000 || 5000;
  var total=mdEntries().reduce(function(s,e){ return s+e.amount; },0);
  var avg=total/last;

  var step=pw/last, bw=Math.max(3, Math.min(step-2, 16));   /* 2px surface gap */
  function X(d){ return padL+(d-1)*step+(step-bw)/2; }
  function Y(v){ return padT+ph-(v/nice)*ph; }

  var s='<defs><linearGradient id="md-barG" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6366f1" stop-opacity=".75"/>'+
        '</linearGradient></defs>';
  [0,0.25,0.5,0.75,1].forEach(function(fr){
    var y=padT+ph-fr*ph;
    s+='<line class="md-grid" x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'"/>';
    s+='<text class="md-ax" x="'+(padL-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+
       (fr===0?'0':Math.round(nice*fr/1000)+'k')+'</text>';
  });

  var today=mdIsThisMonth()?new Date().getDate():-1;
  for(var dd=1; dd<=last; dd++){
    var v=daily[dd]||0;
    if(v<=0) continue;
    var h=Math.max(2, ph-(Y(v)-padT));
    s+='<rect class="md-bar'+(dd===today?' today':'')+'" id="md-bar'+dd+'" x="'+X(dd).toFixed(1)+
       '" y="'+Y(v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3.5"/>';
  }

  var ay=Y(avg);
  s+='<line class="md-avg" x1="'+padL+'" y1="'+ay.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+ay.toFixed(1)+'"/>';
  s+='<text class="md-avg-lbl" x="'+(W-padR)+'" y="'+(ay-6).toFixed(1)+'" text-anchor="end">avg '+mdFmt(avg)+'</text>';

  [1,8,15,22,29].filter(function(d){ return d<=last; }).forEach(function(d){
    s+='<text class="md-ax" x="'+(X(d)+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+d+'</text>';
  });

  for(var hd=1; hd<=last; hd++){
    s+='<rect class="md-hit" data-day="'+hd+'" x="'+(padL+(hd-1)*step).toFixed(1)+'" y="'+padT+
       '" width="'+step.toFixed(1)+'" height="'+ph+'"/>';
  }

  var svg=document.getElementById('md-chart');
  svg.innerHTML=s;
  document.getElementById('md-avgLbl').textContent='avg '+mdFmt(avg)+'/day';

  var tip=document.getElementById('md-tip');
  svg.querySelectorAll('.md-hit').forEach(function(r){
    var d=+r.getAttribute('data-day');
    r.addEventListener('mouseenter',function(){
      svg.querySelectorAll('.md-bar').forEach(function(b){ b.classList.remove('hot'); });
      var bar=document.getElementById('md-bar'+d);
      if(bar) bar.classList.add('hot');
      var cats=byCat[d]||{};
      var rows=Object.keys(cats).sort(function(a,b){ return cats[b]-cats[a]; })
        .map(function(c){ return '<div class="r"><span>'+c+'</span><b>'+mdFmt(cats[c])+'</b></div>'; }).join('');
      tip.innerHTML='<div class="d">'+mdDow(_mdYear,_mdMonth,d).toUpperCase()+' '+d+' '+
        MD_MONTHS[_mdMonth].slice(0,3).toUpperCase()+'</div>'+
        '<div class="t">'+(daily[d]?mdMoney(daily[d]):'Nothing logged')+'</div>'+rows;
      tip.classList.add('on');
      var wrap=svg.parentElement.getBoundingClientRect();
      var x=(padL+(d-1)*step+step/2)/W*wrap.width;
      tip.style.left=Math.max(0, Math.min(x-tip.offsetWidth/2, wrap.width-tip.offsetWidth))+'px';
      tip.style.top='0px';
    });
  });
  svg.addEventListener('mouseleave',function(){
    tip.classList.remove('on');
    svg.querySelectorAll('.md-bar').forEach(function(b){ b.classList.remove('hot'); });
  });
}

function mdRenderCats(){
  var spent=mdSpentBy();
  var total=MD_CATS.reduce(function(t,c){ return t+(spent[c]||0); },0);
  var peak=MD_CATS.reduce(function(m,c){ return Math.max(m, spent[c]||0); },0) || 1;

  var list=MD_CATS.filter(function(c){ return (spent[c]||0)>0; })
                  .sort(function(a,b){ return (spent[b]||0)-(spent[a]||0); });

  document.getElementById('md-catCount').textContent=
    list.length+(list.length===1?' category':' categories');

  if(!list.length){
    document.getElementById('md-cats').innerHTML=
      '<div style="font-size:12.5px;color:var(--md-ink3)">Nothing recorded this month.</div>';
    return;
  }

  /* Where the money went — share of the month, read to the rupee.
     Budget lives in the meter above and the drawer; it is not scored here. */
  document.getElementById('md-cats').innerHTML=list.map(function(c){
    /* tapping a row opens that category's sheet */
    var sp=spent[c]||0;
    var share=total>0 ? sp/total*100 : 0;

    var prev=mdLastMonth(c), mom;
    if(prev<=0)      mom={t:'new', k:'flat'};
    else {
      var pc=Math.round((sp-prev)/prev*100);
      mom = Math.abs(pc)<3 ? {t:'\u2248 same', k:'flat'}
          : {t:(pc>0?'\u2191':'\u2193')+Math.abs(pc)+'%', k:pc>0?'up':'dn'};
    }

    return '<button class="md-cat" data-cat="'+mdEsc(c)+'">'+
      '<span class="md-cat-top">'+
        mdCatIcon(c)+
        '<span class="md-cname">'+c+'</span>'+
        '<span class="md-camt">'+mdFmt(sp)+'</span>'+
        '<span class="md-cshare">'+share.toFixed(0)+'%</span></span>'+
      '<span class="md-cbar"><i style="width:'+(sp/peak*100).toFixed(1)+'%;background:'+mdCatColor(c)+'cc"></i></span>'+
      '<span class="md-cmeta">'+
        '<span>'+(prev>0?'was '+mdFmt(prev)+' last month':'not spent last month')+'</span>'+
        '<span class="md-mom '+mom.k+'">'+mom.t+'</span>'+
      '</span></button>';
  }).join('');
}

/* ═══════════════════════════════════════════════
   RIGHT — the ledger
═══════════════════════════════════════════════ */
function mdMatches(e, spent){
  if(_mdDay && e.day!==_mdDay) return false;
  if(_mdQuery && ((e.reference||'')+' '+e.category).toLowerCase().indexOf(_mdQuery)<0) return false;
  if(_mdFilter==='claim')   return mdIsClaim(e.reference);
  if(_mdFilter==='claimed') return mdIsClaimed(e.reference);
  if(_mdFilter==='junk')    return mdIsJunk(e.reference);
  if(_mdFilter==='over')    return (_mdBudget[e.category]||0)>0 && (spent[e.category]||0)>_mdBudget[e.category];
  return true;
}

function mdRenderLedger(){
  var spent=mdSpentBy(), all=mdEntries();

  document.getElementById('md-cAll').textContent=all.length;
  document.getElementById('md-cOver').textContent=
    all.filter(function(e){ return (_mdBudget[e.category]||0)>0 && (spent[e.category]||0)>_mdBudget[e.category]; }).length;
  document.getElementById('md-cClaim').textContent=all.filter(function(e){ return mdIsClaim(e.reference); }).length;
  document.getElementById('md-cClaimed').textContent=all.filter(function(e){ return mdIsClaimed(e.reference); }).length;
  document.getElementById('md-cJunk').textContent=all.filter(function(e){ return mdIsJunk(e.reference); }).length;

  var shown=all.filter(function(e){ return mdMatches(e, spent); });
  var host=document.getElementById('md-ledger');
  if(_mdSheetCat && _mdGroupBy==='cat'){ host.innerHTML=mdCatDetailHtml(spent); return; }
  if(!shown.length){
    host.innerHTML='<div class="md-empty">'+
      (all.length?'Nothing matches that filter.':'No entries recorded for this month.')+'</div>';
    return;
  }

  if(_mdGroupBy==='day'){ mdLedgerByDay(shown, all, host); return; }

  var grouped={};
  shown.forEach(function(e){ (grouped[e.category]=grouped[e.category]||[]).push(e); });

  /* one square card per category; the card opens its sheet */
  host.innerHTML='<div class="md-cgrid">'+MD_CATS.filter(function(c){ return grouped[c]; })
    .sort(function(a,b){ return mdSum(grouped[b])-mdSum(grouped[a]); })
    .map(function(c){
      var rows=grouped[c], sum=mdSum(rows), b=mdBudgetState(c, spent), col=mdCatColor(c);
      return '<button type="button" class="md-ccard" data-ccat="'+mdEsc(c)+'" style="--cc:'+col+'"'+
          ' aria-label="'+mdEsc(c)+', '+mdMoney(sum)+', open its entries">'+
        mdCatIcon(c)+
        '<span class="nm">'+c+'</span>'+
        '<span class="v" style="'+(b.kind==='crit'?'color:var(--md-crit)':'')+'">'+mdFmt(sum)+'</span>'+
        '<span class="m">'+rows.length+' entr'+(rows.length===1?'y':'ies')+'</span>'+
        (b.plan>0
          ? '<span class="md-gbar"><i style="width:'+b.pct.toFixed(1)+'%;background:'+b.fill+'"></i></span>'+
            '<span class="st '+b.kind+'">'+b.label+'</span>'
          : '<span class="m">no budget set</span>')+
      '</button>';
    }).join('')+'</div>';
}

function mdSum(rows){ return rows.reduce(function(s,e){ return s+e.amount; },0); }
/* a category's budget standing — shared by the cards and the sheet */
function mdBudgetState(c, spent){
  var plan=_mdBudget[c]||0, sp=(spent||mdSpentBy())[c]||0;
  var over=plan>0 && sp>plan, pct=plan>0 ? Math.min(sp/plan*100,100) : 0;
  var kind=over?'crit':pct>=80?'warn':'good';
  return {
    plan:plan, spent:sp, pct:pct, kind:kind,
    fill: over?'#ef4444':pct>=80?'linear-gradient(90deg,#f59e0b,#fb923c)':'linear-gradient(90deg,#10b981,#34d399)',
    label: plan<=0 ? '' : over ? '⚠ over by '+mdFmt(sp-plan) : '✓ '+mdFmt(plan-sp)+' left'
  };
}

/* ═══ category detail — shown in the ledger in place of the card grid ═══ */
function mdOpenSheet(c){
  _mdSheetCat=c;
  if(_mdGroupBy!=='cat'){
    _mdGroupBy='cat';
    document.querySelectorAll('#md-panel .md-gtg').forEach(function(b){
      var on=b.getAttribute('data-grpby')==='cat';
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on?'true':'false');
    });
  }
  mdRenderLedger();
  if(window.matchMedia('(max-width:900px)').matches) mdShowPane('r');
  var pane=document.getElementById('md-paneR'); if(pane) pane.scrollTop=0;
  _mdBuzz('tick');
}
function mdCloseSheet(){ _mdSheetCat=''; mdRenderLedger(); }
function mdCatDetailHtml(spent){
  var c=_mdSheetCat, all=mdEntries();
  /* the detail follows the ledger's day, filter and search */
  var rows=all.filter(function(e){ return e.category===c && mdMatches(e, spent); })
    .sort(function(a,b){ return a.day-b.day; });
  var catAll=all.filter(function(e){ return e.category===c; });
  var b=mdBudgetState(c, spent), narrowed=rows.length!==catAll.length;
  return '<section class="md-cdet" style="--cc:'+mdCatColor(c)+'" aria-label="'+mdEsc(c)+' entries">'+
    '<div class="md-cdet-hd">'+
      '<button type="button" class="md-back" id="md-catBack" aria-label="Back to all categories">&#8249; Back</button>'+
      mdCatIcon(c)+
      '<div><h3>'+c+'</h3>'+
        '<div class="sub">'+rows.length+(narrowed?' of '+catAll.length:'')+' entr'+(rows.length===1?'y':'ies')+
          ' · '+MD_MONTHS[_mdMonth]+' '+_mdYear+(narrowed?' · filtered':'')+'</div></div>'+
      '<span class="tot">'+mdMoney(mdSum(rows))+'</span>'+
    '</div>'+
    (b.plan>0
      ? '<div class="md-grp-bud"><div class="md-gbar"><i style="width:'+b.pct.toFixed(1)+'%;background:'+b.fill+'"></i></div>'+
        '<div class="md-gmeta '+b.kind+'"><span><b>'+b.label+'</b></span>'+
        '<span class="plan">'+mdFmt(b.spent)+' / '+mdFmt(b.plan)+' · '+Math.round(b.spent/b.plan*100)+'%</span></div></div>'
      : '')+
    '<div class="md-cdet-bd">'+(rows.length
      ? rows.map(function(e){ return mdEntRow(e, all, false); }).join('')
      : '<div class="md-empty">Nothing in '+c+' matches the current filter.</div>')+'</div>'+
  '</section>';
}

/* One entry line. In category groups the lead column carries the date;
   in date groups it carries the category, since the date is the header. */
function mdEntRow(e, all, byDay){
  var i=all.indexOf(e);
  var claimed=mdIsClaimed(e.reference), claim=mdIsClaim(e.reference), junk=mdIsJunk(e.reference);
  var tags='';
  if(claimed||claim)
    tags+='<button class="md-tagbtn '+(claimed?'claimed':'claim')+'" data-claim="'+i+'">'+
          (claimed?'✓ Claimed':'→ Claim')+'</button>';
  if(e.category==='Food')
    tags+='<button class="md-tagbtn'+(junk?' junk':'')+'" data-junk="'+i+'">'+
          (junk?'● Junk':'Mark junk')+'</button>';

  var lead = byDay
    ? '<span class="md-clbl" title="'+mdEsc(e.category)+'">'+mdEsc(e.category)+'</span>'
    : '<span class="md-day"><b>'+e.day+'</b><span>'+mdDow(_mdYear,_mdMonth,e.day)+'</span></span>';

  return '<div class="md-ent'+(byDay?' by-day':'')+'">'+lead+
    '<span class="md-ref">'+(e.reference
      ? '<span class="txt" title="'+mdEsc(e.reference)+'">'+mdEsc(e.reference)+'</span>'
      : '<span class="txt" style="color:rgba(255,255,255,.35)">no reference</span>')+tags+'</span>'+
    '<span class="md-amt">'+mdFmt(e.amount)+'</span>'+
  '</div>';
}

/* Date view — the same entries, clustered by the day they were spent,
   newest first, so the ledger reads the way the month was lived. */
function mdLedgerByDay(shown, all, host){
  var byDay={};
  shown.forEach(function(e){ (byDay[e.day]=byDay[e.day]||[]).push(e); });

  var days=Object.keys(byDay).map(Number).sort(function(a,b){ return b-a; });
  var today=mdIsThisMonth()?new Date().getDate():-1;
  var peak=days.reduce(function(m,d){
    return Math.max(m, byDay[d].reduce(function(s,e){ return s+e.amount; },0));
  },0) || 1;

  host.innerHTML=days.map(function(d){
    var rows=byDay[d].slice().sort(function(a,b){ return b.amount-a.amount; });
    var sum=rows.reduce(function(s,e){ return s+e.amount; },0);
    var cats={};
    rows.forEach(function(e){ cats[e.category]=(cats[e.category]||0)+e.amount; });
    var nCats=Object.keys(cats).length;

    return '<div class="md-grp'+(_mdClosedDay[d]?' closed':'')+(d===today?' today':'')+
             '" data-grpday="'+d+'">'+
      '<button class="md-grp-hd" data-toggleday="'+d+'">'+
        '<span class="md-chev">▾</span>'+
        '<span class="dnum n">'+d+'</span>'+
        '<span class="ddow">'+mdDow(_mdYear,_mdMonth,d)+'</span>'+
        (d===today?'<span class="tdy">TODAY</span>':'')+
        '<span class="nm"></span>'+
        '<span class="cn">'+rows.length+' entr'+(rows.length===1?'y':'ies')+
          ' · '+nCats+' categor'+(nCats===1?'y':'ies')+'</span>'+
        '<span class="n" style="font-size:13px;font-weight:600">'+mdFmt(sum)+'</span>'+
      '</button>'+
      '<div class="md-grp-bud">'+
        '<div class="md-gbar"><i style="width:'+(sum/peak*100).toFixed(1)+
          '%;background:linear-gradient(90deg,#6366f1,#8b5cf6)"></i></div>'+
      '</div>'+
      '<div class="md-grp-bd">'+rows.map(function(e){ return mdEntRow(e, all, true); }).join('')+
      '</div></div>';
  }).join('');
}

/* ═══════════════════════════════════════════════
   WRITES — claim, junk, budgets
═══════════════════════════════════════════════ */
function mdToggleClaim(idx, btn){
  if(_mdBusy) return;
  var e=mdEntries()[idx];
  if(!e) return;
  _mdBusy=true; btn.disabled=true; btn.textContent='…';

  google.script.run
    .withSuccessHandler(function(res){
      _mdBusy=false;
      if(res && res.success){
        e.reference=res.newRef;
        _mdBuzz('tick');
        mdRenderLedger();
        mdRenderMeter();
      } else {
        btn.disabled=false;
        btn.textContent='⚠ Failed';
      }
    })
    .withFailureHandler(function(){ _mdBusy=false; btn.disabled=false; btn.textContent='⚠ Error'; })
    .updateClaimStatus(_mdMonth, _mdYear, e.day, e.category, e.reference);
}

function mdToggleJunk(idx, btn){
  if(_mdBusy) return;
  var e=mdEntries()[idx];
  if(!e) return;
  _mdBusy=true; btn.disabled=true; btn.textContent='…';

  google.script.run
    .withSuccessHandler(function(res){
      _mdBusy=false;
      if(res && res.success){
        e.reference=res.newRef;
        _mdBuzz('tick');
        mdRenderLedger();
        mdRenderMeter();
      } else {
        btn.disabled=false;
        btn.textContent='⚠ Failed';
      }
    })
    .withFailureHandler(function(){ _mdBusy=false; btn.disabled=false; btn.textContent='⚠ Error'; })
    .updateFoodJunkStatus(_mdMonth, _mdYear, e.day, e.reference);
}

function mdSaveBudgets(){
  var btn=document.getElementById('md-saveBudgets');
  var msg=document.getElementById('md-budgetMsg');
  var updates={};
  MD_CATS.forEach(function(c){ updates[c]=_mdBudget[c]||0; });

  btn.disabled=true; btn.textContent='Saving…';
  msg.textContent=''; msg.style.color='';

  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled=false; btn.textContent='Save budgets';
      if(res && res.success){
        msg.style.color='#10b981'; msg.textContent='✓ Saved to the Control Plan column';
        _mdBuzz('success');
        /* the cached month still holds the old plan — keep them in step */
        var k=_mdYear+'-'+_mdMonth;
        if(_mdCache[k]) _mdCache[k].controlPlan=JSON.parse(JSON.stringify(updates));
        setTimeout(function(){ msg.textContent=''; },2600);
      } else {
        msg.style.color='#fca5a5';
        msg.textContent='⚠ '+((res&&res.error)||'Save failed');
      }
    })
    .withFailureHandler(function(err){
      btn.disabled=false; btn.textContent='Save budgets';
      msg.style.color='#fca5a5';
      msg.textContent='⚠ '+(err&&err.message||err);
    })
    .saveControlPlan(updates);
}

/* ═══════════════════════════════════════════════
   WIRING — one delegated listener for the whole overlay
═══════════════════════════════════════════════ */
document.getElementById('md-overlay').addEventListener('click',function(ev){
  var t=ev.target;
  mdTipHide();

  if(t===this){ mdClose(); return; }
  if(t.closest('#md-close')){ mdClose(); return; }
  if(t.closest('#md-prev')){ mdStep(-1); return; }
  if(t.closest('#md-next')){ if(!document.getElementById('md-next').disabled) mdStep(1); return; }
  if(t.closest('#md-openDrawer')){ document.getElementById('md-drawerBg').classList.add('open'); return; }
  if(t.closest('#md-closeDrawer') || t.id==='md-drawerBg'){
    document.getElementById('md-drawerBg').classList.remove('open'); return;
  }
  if(t.closest('#md-saveBudgets')){ mdSaveBudgets(); return; }
  if(t.closest('#md-catBack')){ mdCloseSheet(); return; }

  var cc=t.closest('.md-ccard[data-ccat]');
  if(cc){ mdOpenSheet(cc.getAttribute('data-ccat')); return; }

  var sb=t.closest('.md-scope .md-sbtn');
  if(sb){
    var want=sb.getAttribute('data-scope');
    if(want!==_mdScope){ _mdBuzz('tick'); mdSwitchScope(want); }
    return;
  }

  var rc=t.closest('[data-rday]');
  if(rc){
    var rd=+rc.getAttribute('data-rday');
    _mdDay = (_mdDay===rd) ? 0 : rd;
    _mdBuzz('tick');
    mdRenderRibbon(); mdRenderLedger();
    if(window.matchMedia('(max-width:900px)').matches) mdShowPane('r');
    return;
  }

  if(t.closest('#md-dayClear')){
    _mdDay=0;
    mdRenderRibbon(); mdRenderLedger();
    return;
  }

  var chip=t.closest('.md-chip[data-f]');
  if(chip){
    _mdFilter=chip.getAttribute('data-f');
    document.querySelectorAll('#md-panel .md-chip[data-f]').forEach(function(c){
      c.classList.toggle('on', c===chip);
    });
    mdRenderLedger(); return;
  }

  var gb=t.closest('[data-grpby]');
  if(gb){
    var mode=gb.getAttribute('data-grpby');
    if(mode!==_mdGroupBy){
      _mdGroupBy=mode;
      _mdSheetCat='';
      document.querySelectorAll('#md-panel .md-gtg').forEach(function(b){
        var on=b.getAttribute('data-grpby')===mode;
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on?'true':'false');
      });
      _mdBuzz('tick');
      mdRenderLedger();
    }
    return;
  }

  var tday=t.closest('[data-toggleday]');
  if(tday){
    var d=tday.getAttribute('data-toggleday');
    _mdClosedDay[d]=!_mdClosedDay[d];
    mdRenderLedger(); return;
  }

  var cl=t.closest('[data-claim]');
  if(cl){ mdToggleClaim(+cl.getAttribute('data-claim'), cl); return; }

  var jk=t.closest('[data-junk]');
  if(jk){ mdToggleJunk(+jk.getAttribute('data-junk'), jk); return; }

  var cat=t.closest('.md-cat[data-cat]');
  if(cat){ mdOpenSheet(cat.getAttribute('data-cat')); return; }

  var seg=t.closest('.md-seg .md-btn');
  if(seg){ mdShowPane(seg.getAttribute('data-pane')); return; }
});

/* budget inputs — live recalculation, saved on the button */
document.getElementById('md-brows').addEventListener('input',function(ev){
  var el=ev.target;
  var cat=el.getAttribute('data-bcat');
  if(!cat) return;
  _mdBudget[cat]=parseFloat(el.value)||0;
  mdRenderRibbon(); mdRenderMeter(); mdRenderCats(); mdRenderLedger();
});

function mdShowPane(which){
  var l=document.getElementById('md-paneL'), r=document.getElementById('md-paneR');
  if(!l||!r) return;
  l.hidden = which!=='l';
  r.hidden = which!=='r';
  document.querySelectorAll('#md-panel .md-seg .md-btn').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-pane')===which);
  });
}

document.addEventListener('keydown',function(e){
  var ov=document.getElementById('md-overlay');
  if(!ov || !ov.classList.contains('open')) return;
  if(e.key==='Escape'){
    if(_mdSheetCat){ mdCloseSheet(); return; }
    var dr=document.getElementById('md-drawerBg');
    if(dr.classList.contains('open')){ dr.classList.remove('open'); return; }
    mdClose();
  }
  if(e.key==='ArrowLeft'  && !e.metaKey && !e.ctrlKey) mdStep(-1);
  if(e.key==='ArrowRight' && !e.metaKey && !e.ctrlKey){
    if(!document.getElementById('md-next').disabled) mdStep(1);
  }
});

window.addEventListener('resize',function(){
  if(!window.matchMedia('(max-width:900px)').matches){
    var l=document.getElementById('md-paneL'), r=document.getElementById('md-paneR');
    if(l) l.hidden=false;
    if(r) r.hidden=false;
  }
});
</script>

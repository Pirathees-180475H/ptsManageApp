<!-- ═══════════════════════════════════════════════════════════
     FINANCIAL HEALTH SCORE
     Beautiful animated gauge with 5 category meters
═══════════════════════════════════════════════════════════════ -->
<style>
/* ── Design tokens ── */
:root {
  --fh-bg:     rgba(30,41,59,.35);
  --fh-bdr:    rgba(255,255,255,.08);
  --fh-cream:  #f1f5f9;
  --fh-dim:    #94a3b8;
  --fh-blue:   #00d4ff;
  --fh-purple: #a855f7;
  --fh-green:  #00e676;
  --fh-red:    #ff4d6d;
  --fh-gold:   #ffd700;
  --fh-cyan:   #22d3ee;
}
.fh-wrap{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--fh-cream);
  width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;}

/* ── Header ── */
.fh-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;background:rgba(15,23,42,.5);backdrop-filter:blur(8px);}
.fh-hdr-l{display:flex;align-items:center;gap:10px;min-width:0;}
.fh-hdr-icon{font-size:1.3em;flex-shrink:0;}
.fh-hdr-title{font-size:.7em;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  background:linear-gradient(135deg,var(--fh-blue),var(--fh-purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  white-space:nowrap;}
.fh-hdr-sub{font-size:.52em;color:var(--fh-dim);font-weight:600;white-space:nowrap;}
.fh-hdr-updated{font-size:.48em;color:var(--fh-dim);font-weight:500;white-space:nowrap;}

/* ── Scroll area ── */
.fh-scroll{flex:1;overflow-y:auto;padding:18px 18px 10px;
  scrollbar-width:none;-ms-overflow-style:none;}
.fh-scroll::-webkit-scrollbar{display:none;}

/* ── Glass card ── */
.fh-glass{background:var(--fh-bg);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border:1px solid var(--fh-bdr);
  border-radius:18px;margin-bottom:14px;padding:18px;
  box-shadow:0 8px 32px rgba(0,0,0,.2);position:relative;overflow:hidden;}
.fh-glass::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
  pointer-events:none;}
.fh-glass.no-pad{padding:0;}

/* ── Section header ── */
.fh-sec-hdr{font-size:.55em;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:rgba(255,255,255,.25);margin:6px 0 12px;display:flex;align-items:center;gap:10px;}
.fh-sec-hdr::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05);}

/* ═══════════════════════════════════════════
   SCORE GAUGE (SVG circular)
═══════════════════════════════════════════ */
.fh-gauge-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 4px;}
.fh-gauge-container{position:relative;width:200px;height:200px;}
.fh-gauge-svg{transform:rotate(-90deg);width:100%;height:100%;}
.fh-gauge-bg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:8;}
.fh-gauge-fg{fill:none;stroke:url(#fhGrad);stroke-width:8;stroke-linecap:round;
  stroke-dasharray:565.48;stroke-dashoffset:565.48;transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);}
.fh-gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;}
.fh-gauge-score{font-size:3.2em;font-weight:900;letter-spacing:-2px;line-height:1;
  background:linear-gradient(135deg,#fff,var(--fh-blue));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.fh-gauge-label{font-size:.55em;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.3);margin-top:4px;}

/* ── Change badge ── */
.fh-change-wrap{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;}
.fh-change{font-size:.7em;font-weight:700;padding:3px 10px;border-radius:20px;
  display:inline-flex;align-items:center;gap:4px;}
.fh-change.up{background:rgba(0,230,118,.12);color:var(--fh-green);border:1px solid rgba(0,230,118,.2);}
.fh-change.dn{background:rgba(255,77,109,.12);color:var(--fh-red);border:1px solid rgba(255,77,109,.2);}
.fh-change.flat{background:rgba(148,163,184,.1);color:var(--fh-dim);border:1px solid rgba(148,163,184,.15);}
.fh-grade-tag{font-size:.75em;padding:4px 12px;border-radius:20px;font-weight:700;
  display:inline-flex;align-items:center;gap:5px;}
.fh-grade-tag.excellent{background:linear-gradient(135deg,rgba(255,215,0,.15),rgba(255,215,0,.05));border:1px solid rgba(255,215,0,.25);color:var(--fh-gold);}
.fh-grade-tag.good{background:linear-gradient(135deg,rgba(0,230,118,.12),rgba(0,230,118,.05));border:1px solid rgba(0,230,118,.2);color:var(--fh-green);}
.fh-grade-tag.fair{background:linear-gradient(135deg,rgba(0,212,255,.12),rgba(0,212,255,.05));border:1px solid rgba(0,212,255,.2);color:var(--fh-blue);}
.fh-grade-tag.poor{background:linear-gradient(135deg,rgba(255,107,53,.12),rgba(255,107,53,.05));border:1px solid rgba(255,107,53,.2);color:var(--fh-amber);}
.fh-grade-tag.critical{background:linear-gradient(135deg,rgba(255,77,109,.12),rgba(255,77,109,.05));border:1px solid rgba(255,77,109,.2);color:var(--fh-red);}

/* ═══════════════════════════════════════════
   GRADE & TIP
═══════════════════════════════════════════ */
.fh-grade-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
.fh-tip-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
  border-radius:12px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px;}
.fh-tip-icon{font-size:1.1em;flex-shrink:0;margin-top:1px;}
.fh-tip-text{font-size:.72em;font-weight:500;color:rgba(255,255,255,.65);line-height:1.55;}

/* ═══════════════════════════════════════════
   CATEGORY METERS
═══════════════════════════════════════════ */
.fh-meter{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);
  border-radius:13px;padding:14px;margin-bottom:10px;
  transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;}
.fh-meter:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.2);}
.fh-meter:last-child{margin-bottom:0;}

/* Colored accent line on top */
.fh-meter::before{content:'';position:absolute;top:0;left:12px;right:12px;height:2.5px;
  border-radius:0 0 4px 4px;pointer-events:none;}

.fh-meter-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.fh-meter-l{display:flex;align-items:center;gap:8px;}
.fh-meter-icon{font-size:1em;flex-shrink:0;}
.fh-meter-name{font-size:.72em;font-weight:700;color:rgba(255,255,255,.8);}
.fh-meter-score{font-size:.78em;font-weight:800;letter-spacing:-.3px;}
.fh-meter-max{font-size:.55em;font-weight:600;color:rgba(255,255,255,.25);margin-left:2px;}

/* Progress bar */
.fh-bar-track{height:6px;background:rgba(255,255,255,.06);border-radius:4px;
  overflow:hidden;position:relative;}
.fh-bar-fill{height:100%;border-radius:4px;width:0%;
  transition:width 1s cubic-bezier(.4,0,.2,1);position:relative;}
.fh-bar-fill::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15));
  border-radius:inherit;}

.fh-meter-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.fh-meter-val{font-size:.6em;font-weight:600;color:rgba(255,255,255,.35);}
.fh-meter-grade{font-size:.5em;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  padding:2px 8px;border-radius:10px;}
.fh-meter-grade.excellent{background:rgba(255,215,0,.12);color:var(--fh-gold);}
.fh-meter-grade.good{background:rgba(0,230,118,.1);color:var(--fh-green);}
.fh-meter-grade.fair{background:rgba(0,212,255,.1);color:var(--fh-blue);}
.fh-meter-grade.poor{background:rgba(255,77,109,.1);color:var(--fh-red);}

/* ── Tip under each meter ── */
.fh-meter-tip{font-size:.6em;font-weight:500;color:rgba(255,255,255,.4);margin-top:7px;
  padding-top:7px;border-top:1px solid rgba(255,255,255,.04);line-height:1.5;}

/* ── Detail expandable panels ── */
.fh-detail{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.4,0,.2,1),opacity .3s ease;
  opacity:0;pointer-events:none;}
.fh-detail.open{max-height:500px;opacity:1;pointer-events:auto;}
.fh-detail-inner{padding:10px 0 2px;border-top:1px solid rgba(255,255,255,.05);margin-top:9px;}
.fh-detail-row{display:flex;align-items:center;justify-content:space-between;padding:4.5px 0;font-size:.65em;}
.fh-detail-label{color:rgba(255,255,255,.4);font-weight:500;}
.fh-detail-value{color:rgba(255,255,255,.75);font-weight:700;text-align:right;max-width:65%;word-break:break-word;}
.fh-detail-row+.fh-detail-row{border-top:1px solid rgba(255,255,255,.03);}
.fh-meter{cursor:pointer;user-select:none;}
.fh-toggle-icon{font-size:.55em;color:rgba(255,255,255,.25);transition:transform .35s ease;flex-shrink:0;
  display:inline-flex;align-items:center;margin-left:6px;}
.fh-toggle-icon.open{transform:rotate(180deg);}

/* ═══════════════════════════════════════════
   LOADING / ERROR
═══════════════════════════════════════════ */
.fh-loading{text-align:center;padding:50px 16px;color:var(--fh-dim);font-size:.72em;}
.fh-error{text-align:center;padding:50px 16px;color:var(--fh-red);font-size:.72em;}

/* ── Skeleton shimmer ── */
.fh-skel{position:relative;overflow:hidden;}
.fh-skel::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);
  background-size:200% 100%;animation:fh-shimmer 1.4s linear infinite;pointer-events:none;}
@keyframes fh-shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.fh-skel-gauge{width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.04);
  margin:10px auto;}
.fh-skel-line{height:10px;border-radius:6px;background:rgba(255,255,255,.04);margin-bottom:10px;}
.fh-skel-line:nth-child(2){width:80%;}
.fh-skel-line:nth-child(3){width:60%;}

/* ═══════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════════ */
@media(max-width:820px){
  .fh-scroll{padding:14px 12px 8px;}
  .fh-glass{padding:14px;border-radius:16px;}
  .fh-gauge-container{width:170px;height:170px;}
  .fh-gauge-score{font-size:2.8em;}
  .fh-hdr{padding:12px 14px;}
}
@media(max-width:640px){
  .fh-scroll{padding:12px 10px 6px;}
  .fh-glass{padding:12px;border-radius:14px;margin-bottom:10px;}
  .fh-gauge-container{width:150px;height:150px;}
  .fh-gauge-score{font-size:2.4em;}
  .fh-gauge-label{font-size:.5em;}
  .fh-meter{padding:12px;}
  .fh-meter-name{font-size:.68em;}
  .fh-hdr-title{font-size:.6em;}
  .fh-hdr-updated{display:none;}
}
@media(max-width:500px){
  .fh-glass{padding:10px;border-radius:12px;margin-bottom:8px;}
  .fh-gauge-container{width:140px;height:140px;}
  .fh-gauge-score{font-size:2.2em;}
  .fh-meter{padding:10px;border-radius:11px;}
  .fh-meter-name{font-size:.65em;}
  .fh-meter-icon{font-size:.85em;}
  .fh-tip-text{font-size:.68em;}
  .fh-grade-tag{font-size:.68em;}
}
@media(max-width:380px){
  .fh-gauge-container{width:120px;height:120px;}
  .fh-gauge-score{font-size:1.8em;}
}
</style>

<!-- ── SVG gradient definition ── -->
<svg width="0" height="0" style="position:absolute;">
  <defs>
    <linearGradient id="fhGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="33%" stop-color="#fb923c"/>
      <stop offset="66%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
  </defs>
</svg>

<div class="fh-wrap">
  <div class="fh-hdr">
    <div class="fh-hdr-l">
      <span class="fh-hdr-icon">💎</span>
      <span class="fh-hdr-title">Financial Health</span>
      <span class="fh-hdr-sub">· Score</span>
    </div>
    <span class="fh-hdr-updated" id="fhUpdated"></span>
  </div>
  <div class="fh-scroll" id="fhScroll">
    <div class="fh-loading">
      <div style="font-size:2.5em;margin-bottom:10px;animation:blink 1.2s infinite;">⏳</div>
      Calculating your financial health…
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   FINANCIAL HEALTH — Frontend Controller
═══════════════════════════════════════════ */
var _fhData = null;
var _monthNames = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ── Load data ── */
function fhLoad(){
  document.getElementById('fhScroll').innerHTML =
    '<div class="fh-loading"><div style="font-size:2.5em;margin-bottom:10px;animation:blink 1.2s infinite;">⏳</div>Calculating your financial health…</div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.success){
        _fhData = res;
        fhRender(res);
      } else {
        document.getElementById('fhScroll').innerHTML =
          '<div class="fh-error">⚠ '+(res?res.error:'Failed to load data')+'</div>';
      }
    })
    .withFailureHandler(function(){
      document.getElementById('fhScroll').innerHTML =
        '<div class="fh-error">⚠ Error loading financial health data</div>';
    })
    .getFinancialHealthData();
}

/* ── Render ── */
function fhRender(d){
  var score = d.overallScore;
  var maxScore = d.maxScore || 100;
  var grade = d.grade || 'fair';
  var emoji = d.emoji || '👍';
  var change = d.change || 0;
  var tip = d.tip || '';
  var cats = d.categories || [];

  // Update updated time
  var updatedEl = document.getElementById('fhUpdated');
  if(updatedEl && d.updatedAt){
    try{
      var dt = new Date(d.updatedAt);
      updatedEl.textContent = 'Updated ' + dt.getDate() + ' ' + _monthNames[dt.getMonth()+1];
    }catch(e){ updatedEl.textContent = ''; }
  }

  var html = '';

  // ── Gauge Card ──
  var circumference = 2 * Math.PI * 90; // r=90
  var offset = circumference - (score / 100) * circumference;

  var changeClass = change > 0 ? 'up' : (change < 0 ? 'dn' : 'flat');
  var changeArrow = change > 0 ? '▲' : (change < 0 ? '▼' : '—');
  var changeVal = change > 0 ? '+' + change : (change < 0 ? change : '0');

  html += '<div class="fh-glass">';
  html += '<div class="fh-gauge-wrap">';
  html += '<div class="fh-gauge-container">';
  html += '<svg class="fh-gauge-svg" viewBox="0 0 200 200">';
  html += '<circle class="fh-gauge-bg" cx="100" cy="100" r="90"/>';
  html += '<circle class="fh-gauge-fg" id="fhGaugeArc" cx="100" cy="100" r="90" style="stroke-dashoffset:' + circumference + ';"/>';
  html += '</svg>';
  html += '<div class="fh-gauge-center">';
  html += '<div class="fh-gauge-score" id="fhScoreNum">0</div>';
  html += '<div class="fh-gauge-label">of ' + maxScore + '</div>';
  html += '</div></div>'; // end gauge-container

  // Grade + change
  html += '<div class="fh-grade-row">';
  html += '<span class="fh-grade-tag ' + grade + '">' + emoji + ' ' + grade.charAt(0).toUpperCase() + grade.slice(1) + '</span>';
  html += '<span class="fh-change ' + changeClass + '">' + changeArrow + ' ' + changeVal + ' vs last month</span>';
  html += '</div>';

  // Tip
  if(tip){
    html += '<div class="fh-tip-card" style="margin-top:8px;">';
    html += '<span class="fh-tip-icon">💡</span>';
    html += '<span class="fh-tip-text">' + tip + '</span>';
    html += '</div>';
  }

  html += '</div></div>'; // end gauge-wrap, end glass

  // ── Category Meters ──
  if(cats.length){
    html += '<div class="fh-glass"><div class="fh-sec-hdr"><span>📊</span>Score Breakdown</div>';

    cats.forEach(function(cat, i){
      var pct = cat.max > 0 ? Math.round((cat.score / cat.max) * 100) : 0;
      var gradeLabel = cat.grade || 'fair';
      var gradeColor = cat.grade === 'excellent' ? '#ffd700' :
                        cat.grade === 'good' ? '#00e676' :
                        cat.grade === 'fair' ? '#00d4ff' : '#ff4d6d';

      html += '<div class="fh-meter" id="fhMeter' + i + '" onclick="fhToggleDetail(' + i + ')" style="opacity:0;transform:translateY(10px);">';
      html += '<div class="fh-meter-hdr">';
      html += '<div class="fh-meter-l"><span class="fh-meter-icon">' + cat.icon + '</span><span class="fh-meter-name">' + cat.name + '</span></div>';
      html += '<div style="display:flex;align-items:center;">';
      html += '<span class="fh-meter-score" style="color:' + cat.color + ';">' + cat.score + '</span><span class="fh-meter-max">/ ' + cat.max + '</span>';
      html += '<span class="fh-toggle-icon" id="fhToggle' + i + '">▼</span>';
      html += '</div></div>';

      html += '<div class="fh-bar-track"><div class="fh-bar-fill" id="fhBar' + i + '" style="background:' + cat.color + ';width:0%;"></div></div>';

      html += '<div class="fh-meter-footer">';
      html += '<span class="fh-meter-val">' + cat.value + ' ' + (cat.unit||'') + '</span>';
      html += '<span class="fh-meter-grade ' + gradeLabel + '">' + gradeLabel.charAt(0).toUpperCase() + gradeLabel.slice(1) + '</span>';
      html += '</div>';

      if(cat.tip){
        html += '<div class="fh-meter-tip">💡 ' + cat.tip + '</div>';
      }

      // Detail expandable panel
      html += '<div class="fh-detail" id="fhDetail' + i + '">';
      html += '<div class="fh-detail-inner">';
      if(cat.details && cat.details.length){
        cat.details.forEach(function(d){
          html += '<div class="fh-detail-row">';
          html += '<span class="fh-detail-label">' + d.label + '</span>';
          html += '<span class="fh-detail-value">' + d.value + '</span>';
          html += '</div>';
        });
      } else {
        html += '<div class="fh-detail-row"><span class="fh-detail-label" style="color:rgba(255,255,255,.3);">No breakdown data available</span></div>';
      }
      html += '</div></div>';

      html += '</div>';
    });

    html += '</div>'; // end glass
  }

  document.getElementById('fhScroll').innerHTML = html;

  // ── Animate gauge and bars ──
  requestAnimationFrame(function(){
    // Gauge arc
    var arc = document.getElementById('fhGaugeArc');
    if(arc) arc.style.strokeDashoffset = offset;

    // Score number count-up
    var scoreEl = document.getElementById('fhScoreNum');
    if(scoreEl){
      var start = 0;
      var end = score;
      var duration = 1200;
      var startTime = performance.now();
      function countUp(now){
        var elapsed = now - startTime;
        var progress = Math.min(elapsed / duration, 1);
        // ease-out cubic
        var eased = 1 - Math.pow(1 - progress, 3);
        scoreEl.textContent = Math.round(start + (end - start) * eased);
        if(progress < 1) requestAnimationFrame(countUp);
      }
      requestAnimationFrame(countUp);
    }

    // Animate category bars & fade-in with stagger
    cats.forEach(function(cat, i){
      setTimeout(function(){
        var bar = document.getElementById('fhBar' + i);
        if(bar){
          var pct = cat.max > 0 ? Math.round((cat.score / cat.max) * 100) : 0;
          bar.style.width = pct + '%';
        }
        var meter = document.getElementById('fhMeter' + i);
        if(meter){
          meter.style.transition = 'opacity .4s ease,transform .4s ease';
          meter.style.opacity = '1';
          meter.style.transform = 'translateY(0)';
        }
      }, i * 100 + 200);
    });
  });
}

/* ── Toggle detail panel ── */
function fhToggleDetail(i){
  var detail = document.getElementById('fhDetail' + i);
  var toggle = document.getElementById('fhToggle' + i);
  if(!detail) return;
  var isOpen = detail.classList.contains('open');
  if(isOpen){
    detail.classList.remove('open');
    if(toggle) toggle.classList.remove('open');
  } else {
    detail.classList.add('open');
    if(toggle) toggle.classList.add('open');
  }
}

/* ── Auto-load on include ── */
(function(){ fhLoad(); })();
</script>

<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: #e5e7eb;
      padding: 20px;
      min-height: 100vh;
    }

    h1 { 
      text-align: center; 
      margin: 0 0 20px 0; 
      font-size: 24px;
      font-weight: 600;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
      max-width: 1400px;
      margin-left: auto;
      margin-right: auto;
    }

    .card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 12px rgba(0, 0, 0, 0.4);
    }

    .card label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .value { 
      font-size: 18px; 
      font-weight: 700;
      color: #f1f5f9;
    }

    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .chart-container {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    canvas {
      width: 100% !important;
      height: 250px !important;
    }

    .footer {
      text-align: center;
      opacity: 0.5;
      font-size: 11px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(51, 65, 85, 0.3);
    }

    @media (max-width: 768px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .charts {
        grid-template-columns: 1fr;
      }
      
      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <h1>📈 Investment Dashboard</h1>

  <div class="stats">
    <div class="card">
      <label>UT Earnings</label>
      <div id="utEarn" class="value">-</div>
    </div>
    <div class="card">
      <label>Stock Earnings</label>
      <div id="stockEarn" class="value">-</div>
    </div>
    <div class="card">
      <label>Gold Earnings</label>
      <div id="goldEarn" class="value">-</div>
    </div>
    <div class="card">
      <label>UT Investment</label>
      <div id="utInv" class="value">-</div>
    </div>
    <div class="card">
      <label>Stock Investment</label>
      <div id="stockInv" class="value">-</div>
    </div>
    <div class="card">
      <label>Gold Investment</label>
      <div id="goldInv" class="value">-</div>
    </div>
  </div>

  <div class="charts">
    <div class="chart-container">
      <canvas id="earningsChart"></canvas>
    </div>
    <div class="chart-container">
      <canvas id="investmentChart"></canvas>
    </div>
    <div class="chart-container">
      <canvas id="roiChart"></canvas>
    </div>
    <div class="chart-container">
      <canvas id="allocationChart"></canvas>
    </div>
  </div>

  <div class="footer">UT_CRYPTO (A46:G)</div>

<script>
google.script.run
  .withFailureHandler(console.error)
  .withSuccessHandler(renderDashboard)
  .getInvestmentData();

function renderDashboard(rows) {
  if (!rows || rows.length === 0) return;

  const latest = rows[rows.length - 1];

  const months = rows.map(r => r[0]);
  const utEarn = rows.map(r => r[1]);
  const stockEarn = rows.map(r => r[2]);
  const goldEarn = rows.map(r => r[3]);
  const utInv = rows.map(r => r[4]);
  const stockInv = rows.map(r => r[5]);
  const goldInv = rows.map(r => r[6]);

  document.getElementById('utEarn').innerText = format(latest[1]);
  document.getElementById('stockEarn').innerText = format(latest[2]);
  document.getElementById('goldEarn').innerText = format(latest[3]);
  document.getElementById('utInv').innerText = format(latest[4]);
  document.getElementById('stockInv').innerText = format(latest[5]);
  document.getElementById('goldInv').innerText = format(latest[6]);

  renderCharts(months, utEarn, stockEarn, goldEarn, utInv, stockInv, goldInv, latest);
}

function renderCharts(months, utEarn, stockEarn, goldEarn, utInv, stockInv, goldInv, latest) {
  const chartColors = {
    ut: '#3b82f6',
    stock: '#10b981',
    gold: '#f59e0b'
  };

  new Chart(document.getElementById('earningsChart'), {
    type: "line",
    data: {
      labels: months,
      datasets: [
        { 
          label: "UT", 
          data: utEarn, 
          borderColor: chartColors.ut,
          backgroundColor: chartColors.ut + '20',
          tension: 0.4,
          fill: true
        },
        { 
          label: "Stock", 
          data: stockEarn, 
          borderColor: chartColors.stock,
          backgroundColor: chartColors.stock + '20',
          tension: 0.4,
          fill: true
        },
        { 
          label: "Gold", 
          data: goldEarn, 
          borderColor: chartColors.gold,
          backgroundColor: chartColors.gold + '20',
          tension: 0.4,
          fill: true
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { 
        title: { display: true, text: "Earnings Over Time", color: '#e5e7eb', font: { size: 14 } }, 
        legend: { position: "bottom", labels: { color: '#e5e7eb' } }
      },
      scales: {
        x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
        y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }
      }
    }
  });

  new Chart(document.getElementById('investmentChart'), {
    type: "bar",
    data: {
      labels: months,
      datasets: [
        { label: "UT", data: utInv, backgroundColor: chartColors.ut },
        { label: "Stock", data: stockInv, backgroundColor: chartColors.stock },
        { label: "Gold", data: goldInv, backgroundColor: chartColors.gold }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { 
        title: { display: true, text: "Investment Amounts", color: '#e5e7eb', font: { size: 14 } }, 
        legend: { position: "bottom", labels: { color: '#e5e7eb' } }
      },
      scales: {
        x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
        y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }
      }
    }
  });

  const roiUT = utEarn.map((v,i) => utInv[i] > 0 ? ((v / utInv[i]) * 100).toFixed(1) : 0);
  const roiStock = stockEarn.map((v,i) => stockInv[i] > 0 ? ((v / stockInv[i]) * 100).toFixed(1) : 0);
  const roiGold = goldEarn.map((v,i) => goldInv[i] > 0 ? ((v / goldInv[i]) * 100).toFixed(1) : 0);

  new Chart(document.getElementById('roiChart'), {
    type: "line",
    data: {
      labels: months,
      datasets: [
        { 
          label: "UT ROI %", 
          data: roiUT, 
          borderColor: chartColors.ut,
          backgroundColor: chartColors.ut + '20',
          tension: 0.4
        },
        { 
          label: "Stock ROI %", 
          data: roiStock, 
          borderColor: chartColors.stock,
          backgroundColor: chartColors.stock + '20',
          tension: 0.4
        },
        { 
          label: "Gold ROI %", 
          data: roiGold, 
          borderColor: chartColors.gold,
          backgroundColor: chartColors.gold + '20',
          tension: 0.4
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { 
        title: { display: true, text: "Return on Investment (%)", color: '#e5e7eb', font: { size: 14 } }, 
        legend: { position: "bottom", labels: { color: '#e5e7eb' } }
      },
      scales: {
        x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
        y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }
      }
    }
  });

  new Chart(document.getElementById('allocationChart'), {
    type: "doughnut",
    data: {
      labels: ["UT", "Stocks", "Gold"],
      datasets: [{
        data: [latest[4], latest[5], latest[6]],
        backgroundColor: [chartColors.ut, chartColors.stock, chartColors.gold]
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        title: { display: true, text: "Current Allocation", color: '#e5e7eb', font: { size: 14 } },
        legend: { position: "bottom", labels: { color: '#e5e7eb' } }
      }
    }
  });
}

function format(n) {
  return new Intl.NumberFormat("en-LK", {
    style: "currency",
    currency: "LKR",
    maximumFractionDigits: 0
  }).format(n);
}
</script>
</body>
</html>

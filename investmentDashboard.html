<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #05080f;
      --card:   rgba(255,255,255,0.035);
      --border: rgba(255,255,255,0.07);
      --ut:     #3b82f6;
      --stock:  #00e676;
      --gold:   #ffd700;
      --total:  #a855f7;
      --roi:    #ff6b35;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:#fff;
      min-height:100vh;
      overflow-x:hidden;
    }

    /* bg */
    .bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
    .orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:0.1;animation:drift 14s ease-in-out infinite;}
    .o1{width:450px;height:450px;background:#3b82f6;top:-120px;left:-120px;animation-delay:0s;}
    .o2{width:380px;height:380px;background:#a855f7;bottom:-80px;right:-80px;animation-delay:-5s;}
    .o3{width:280px;height:280px;background:#ffd700;top:50%;left:55%;animation-delay:-9s;}
    .o4{width:220px;height:220px;background:#00e676;bottom:25%;left:8%;animation-delay:-3s;}
    @keyframes drift{0%,100%{transform:translate(0,0);}33%{transform:translate(28px,-28px);}66%{transform:translate(-18px,18px);}}
    body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(rgba(255,255,255,0.025) 1px,transparent 1px);background-size:28px 28px;pointer-events:none;z-index:0;}

    .page{position:relative;z-index:1;padding:18px;max-width:1560px;margin:0 auto;}

    /* header */
    .header{text-align:center;padding:16px 0 22px;}
    .header-chip{display:inline-block;padding:5px 16px;border-radius:20px;background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.3);color:var(--ut);font-size:.68em;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
    .header h1{font-size:1.9em;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#fff 0%,var(--ut) 40%,var(--total) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .header-sub{color:rgba(255,255,255,0.35);font-size:.78em;margin-top:5px;}

    /* loading */
    .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:65vh;gap:14px;}
    .spinner{width:44px;height:44px;border:3px solid rgba(59,130,246,0.15);border-top-color:var(--ut);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .loading-text{color:rgba(255,255,255,0.3);font-size:.82em;letter-spacing:2px;text-transform:uppercase;}

    /* glass */
    .glass{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;backdrop-filter:blur(20px);box-shadow:0 4px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.04);position:relative;overflow:hidden;}
    .glass::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);}
    .card-hdr{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.05);}
    .card-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .card-title{font-size:.72em;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);}
    .card-sub{font-size:.62em;color:rgba(255,255,255,.22);margin-left:auto;}

    /* KPI */
    .kpi-row{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:14px;animation:fadeUp .5s ease both;}
    .kpi{border-radius:14px;padding:14px 16px;border:1px solid;backdrop-filter:blur(20px);position:relative;overflow:hidden;transition:transform .2s ease;}
    .kpi:hover{transform:translateY(-3px);}
    .kpi-glow{position:absolute;right:-18px;bottom:-18px;width:90px;height:90px;border-radius:50%;filter:blur(36px);opacity:.2;}
    .kpi-icon{font-size:1.4em;margin-bottom:6px;display:block;}
    .kpi-label{font-size:.58em;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.33);margin-bottom:3px;}
    .kpi-value{font-size:1.15em;font-weight:800;letter-spacing:-.5px;line-height:1;}
    .kpi-sub{font-size:.6em;color:rgba(255,255,255,.22);margin-top:4px;}
    .kpi-delta{font-size:.62em;font-weight:700;padding:1px 6px;border-radius:5px;display:inline-block;margin-top:3px;}
    .delta-up{background:rgba(0,230,118,.15);color:#00e676;}
    .delta-down{background:rgba(255,77,141,.15);color:#ff4d8d;}
    .delta-flat{background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);}

    .kpi.blue   {background:linear-gradient(135deg,rgba(59,130,246,.09),rgba(59,130,246,.04));border-color:rgba(59,130,246,.22);}
    .kpi.blue   .kpi-value{color:var(--ut);text-shadow:0 0 20px rgba(59,130,246,.4);}
    .kpi.blue   .kpi-glow{background:var(--ut);}
    .kpi.green  {background:linear-gradient(135deg,rgba(0,230,118,.09),rgba(0,230,118,.04));border-color:rgba(0,230,118,.22);}
    .kpi.green  .kpi-value{color:var(--stock);text-shadow:0 0 20px rgba(0,230,118,.4);}
    .kpi.green  .kpi-glow{background:var(--stock);}
    .kpi.gold   {background:linear-gradient(135deg,rgba(255,215,0,.09),rgba(255,215,0,.04));border-color:rgba(255,215,0,.22);}
    .kpi.gold   .kpi-value{color:var(--gold);text-shadow:0 0 20px rgba(255,215,0,.4);}
    .kpi.gold   .kpi-glow{background:var(--gold);}
    .kpi.purple {background:linear-gradient(135deg,rgba(168,85,247,.09),rgba(168,85,247,.04));border-color:rgba(168,85,247,.22);}
    .kpi.purple .kpi-value{color:var(--total);text-shadow:0 0 20px rgba(168,85,247,.4);}
    .kpi.purple .kpi-glow{background:var(--total);}
    .kpi.orange {background:linear-gradient(135deg,rgba(255,107,53,.09),rgba(255,107,53,.04));border-color:rgba(255,107,53,.22);}
    .kpi.orange .kpi-value{color:var(--roi);text-shadow:0 0 20px rgba(255,107,53,.4);}
    .kpi.orange .kpi-glow{background:var(--roi);}

    /* grids */
    .row-2  {display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;animation:fadeUp .5s ease .1s both;}
    .row-3  {display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px;animation:fadeUp .5s ease .15s both;}
    .row-3b {display:grid;grid-template-columns:1fr 2fr;gap:14px;margin-bottom:14px;animation:fadeUp .5s ease .18s both;}
    .row-full{margin-bottom:14px;animation:fadeUp .5s ease .2s both;}
    .row-4  {display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px;animation:fadeUp .5s ease .22s both;}

    .chart-wrap        {position:relative;height:240px;}
    .chart-wrap.tall   {height:280px;}
    .chart-wrap.short  {height:180px;}
    .chart-wrap.xshort {height:140px;}

    /* insight cards */
    .insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .insight-item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px 14px;display:flex;align-items:flex-start;gap:10px;}
    .insight-emoji{font-size:1.5em;flex-shrink:0;margin-top:1px;}
    .insight-label{font-size:.6em;color:rgba(255,255,255,.3);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px;}
    .insight-value{font-size:.9em;font-weight:700;color:#fff;}
    .insight-sub{font-size:.62em;color:rgba(255,255,255,.3);margin-top:2px;}

    /* performance bars */
    .perf-row{display:flex;flex-direction:column;gap:10px;}
    .perf-item{display:flex;flex-direction:column;gap:4px;}
    .perf-top{display:flex;justify-content:space-between;align-items:center;}
    .perf-name{font-size:.72em;color:rgba(255,255,255,.55);font-weight:500;}
    .perf-val{font-size:.72em;font-weight:700;}
    .perf-bar-bg{height:6px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden;}
    .perf-bar{height:100%;border-radius:4px;width:0;transition:width 1.3s cubic-bezier(.4,0,.2,1);}

    /* ROI gauge badges */
    .roi-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;font-size:.68em;font-weight:700;}

    @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px;}

    @media(max-width:1100px){.kpi-row{grid-template-columns:repeat(4,1fr);}}
    @media(max-width:760px){
      .kpi-row{grid-template-columns:repeat(2,1fr);}
      .row-2,.row-3,.row-3b,.row-4{grid-template-columns:1fr;}
      .insight-grid{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb o1"></div><div class="orb o2"></div>
    <div class="orb o3"></div><div class="orb o4"></div>
  </div>

  <div class="page" id="root">
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">Loading Investment Data…</div>
    </div>
  </div>

<script>
/* ── helpers ── */
const fmtLKR = n => '₨' + Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:0});
const K = n => n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':n.toFixed(0);
const pct = (earn,inv) => inv>0?((earn/inv)*100).toFixed(1):0;

function animCounter(el, target, isCurrency=true, dur=1300) {
  const s = performance.now();
  const tick = now => {
    const p = Math.min((now-s)/dur,1), e=1-Math.pow(1-p,4);
    el.textContent = isCurrency ? '₨'+Math.round(target*e).toLocaleString('en-IN') : (target*e).toFixed(1)+'%';
    if(p<1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

const TIP = {
  backgroundColor:'rgba(5,8,15,0.95)',borderColor:'rgba(255,255,255,0.1)',
  borderWidth:1,titleColor:'#fff',bodyColor:'rgba(255,255,255,0.65)',
  padding:12,titleFont:{size:11,weight:'700'},bodyFont:{size:10}
};
Chart.defaults.color='rgba(255,255,255,0.4)';
Chart.defaults.font.family='Inter';

/* ── MAIN RENDER ── */
function renderDashboard(rows) {
  if (!rows || !rows.length) {
    document.getElementById('root').innerHTML =
      '<div style="text-align:center;padding:80px;color:rgba(255,255,255,.3)">No data found in UT_CRYPTO sheet.</div>';
    return;
  }

  const months    = rows.map(r=>r[0]);
  const utEarn    = rows.map(r=>+r[1]);
  const stkEarn   = rows.map(r=>+r[2]);
  const gldEarn   = rows.map(r=>+r[3]);
  const utInv     = rows.map(r=>+r[4]);
  const stkInv    = rows.map(r=>+r[5]);
  const gldInv    = rows.map(r=>+r[6]);

  const latest = rows[rows.length-1];
  const prev   = rows.length>1 ? rows[rows.length-2] : latest;

  // totals per month
  const totEarn   = rows.map((_,i)=>utEarn[i]+stkEarn[i]+gldEarn[i]);
  const totInv    = rows.map((_,i)=>utInv[i]+stkInv[i]+gldInv[i]);

  // cumulative
  let cumEarnUT=0,cumEarnStk=0,cumEarnGld=0;
  const cumUT=[],cumStk=[],cumGld=[],cumTot=[];
  rows.forEach((_,i)=>{
    cumEarnUT+=utEarn[i]; cumEarnStk+=stkEarn[i]; cumEarnGld+=gldEarn[i];
    cumUT.push(cumEarnUT); cumStk.push(cumEarnStk); cumGld.push(cumEarnGld);
    cumTot.push(cumEarnUT+cumEarnStk+cumEarnGld);
  });

  // ROI per month
  const roiUT  = rows.map((_,i)=>pct(utEarn[i],utInv[i]));
  const roiStk = rows.map((_,i)=>pct(stkEarn[i],stkInv[i]));
  const roiGld = rows.map((_,i)=>pct(gldEarn[i],gldInv[i]));

  // month-over-month delta
  const deltaEarn = rows.map((_,i)=> i===0?0:totEarn[i]-totEarn[i-1]);

  // all-time aggregates
  const allUtEarn=cumEarnUT, allStkEarn=cumEarnStk, allGldEarn=cumEarnGld;
  const allUtInv =utInv.reduce((s,v)=>s+v,0);
  const allStkInv=stkInv.reduce((s,v)=>s+v,0);
  const allGldInv=gldInv.reduce((s,v)=>s+v,0);
  const allTotEarn=allUtEarn+allStkEarn+allGldEarn;
  const allTotInv =allUtInv+allStkInv+allGldInv;
  const overallROI= pct(allTotEarn,allTotInv);

  // best months
  const bestEarnIdx = totEarn.indexOf(Math.max(...totEarn));
  const bestROI_UT  = roiUT.indexOf(Math.max(...roiUT.map(Number)));
  const bestROI_Stk = roiStk.indexOf(Math.max(...roiStk.map(Number)));
  const bestROI_Gld = roiGld.indexOf(Math.max(...roiGld.map(Number)));

  // deltas vs prev month
  const dUT  = latest[1]-prev[1], dStk=latest[2]-prev[2], dGld=latest[3]-prev[3];
  const dTot = dUT+dStk+dGld;
  const deltaClass = v=>v>0?'delta-up':v<0?'delta-down':'delta-flat';
  const deltaStr  = v=>v>0?'▲ '+fmtLKR(v):v<0?'▼ '+fmtLKR(Math.abs(v)):'— no change';

  /* ── render HTML ── */
  document.getElementById('root').innerHTML = `
    <div class="header">
      <div class="header-chip">📊 Live · UT_CRYPTO</div>
      <h1>Investment Performance Dashboard</h1>
      <div class="header-sub">Unit Trusts · Stocks · Gold — complete earnings & ROI overview</div>
    </div>

    <!-- KPI row: 8 cards -->
    <div class="kpi-row">
      <div class="kpi blue">
        <div class="kpi-glow"></div>
        <span class="kpi-icon">🔵</span>
        <div class="kpi-label">UT Earnings</div>
        <div class="kpi-value" id="kpi-ut">₨0</div>
        <span class="kpi-delta ${deltaClass(dUT)}">${deltaStr(dUT)}</span>
      </div>
      <div class="kpi green">
        <div class="kpi-glow"></div>
        <span class="kpi-icon">📈</span>
        <div class="kpi-label">Stock Earnings</div>
        <div class="kpi-value" id="kpi-stk">₨0</div>
        <span class="kpi-delta ${deltaClass(dStk)}">${deltaStr(dStk)}</span>
      </div>
      <div class="kpi gold">
        <div class="kpi-glow"></div>
        <span class="kpi-icon">🥇</span>
        <div class="kpi-label">Gold Earnings</div>
        <div class="kpi-value" id="kpi-gld">₨0</div>
        <span class="kpi-delta ${deltaClass(dGld)}">${deltaStr(dGld)}</span>
      </div>
      <div class="kpi purple">
        <div class="kpi-glow"></div>
        <span class="kpi-icon">💰</span>
        <div class="kpi-label">Total Earnings</div>
        <div class="kpi-value" id="kpi-tot">₨0</div>
        <span class="kpi-delta ${deltaClass(dTot)}">${deltaStr(dTot)}</span>
      </div>
      <div class="kpi blue">
        <div class="kpi-glow"></div>
        <span class="kpi-icon">🏦</span>
        <div class="kpi-label">UT Invested</div>
        <div class="kpi-value">${fmtLKR(latest[4])}</div>
        <div class="kpi-sub">current month</div>
      </div>
      <div class="kpi green">
        <div class="kpi-glow"></div>
        <span class="kpi-icon">📉</span>
        <div class="kpi-label">Stock Invested</div>
        <div class="kpi-value">${fmtLKR(latest[5])}</div>
        <div class="kpi-sub">current month</div>
      </div>
      <div class="kpi gold">
        <div class="kpi-glow"></div>
        <span class="kpi-icon">🪙</span>
        <div class="kpi-label">Gold Invested</div>
        <div class="kpi-value">${fmtLKR(latest[6])}</div>
        <div class="kpi-sub">current month</div>
      </div>
      <div class="kpi orange">
        <div class="kpi-glow"></div>
        <span class="kpi-icon">🎯</span>
        <div class="kpi-label">Overall ROI</div>
        <div class="kpi-value" id="kpi-roi">0%</div>
        <div class="kpi-sub">all-time</div>
      </div>
    </div>

    <!-- Row 1: Earnings trend + Cumulative -->
    <div class="row-2">
      <div class="glass">
        <div class="card-hdr">
          <div class="card-dot" style="background:#3b82f6;box-shadow:0 0 6px #3b82f6"></div>
          <div class="card-title">Monthly Earnings Trend</div>
          <div class="card-sub">UT · Stock · Gold</div>
        </div>
        <div class="chart-wrap tall"><canvas id="earnLine"></canvas></div>
      </div>
      <div class="glass">
        <div class="card-hdr">
          <div class="card-dot" style="background:#a855f7;box-shadow:0 0 6px #a855f7"></div>
          <div class="card-title">Cumulative Earnings</div>
          <div class="card-sub">all-time growth</div>
        </div>
        <div class="chart-wrap tall"><canvas id="cumLine"></canvas></div>
      </div>
    </div>

    <!-- Row 2: Investment stacked bar (full) -->
    <div class="row-full glass">
      <div class="card-hdr">
        <div class="card-dot" style="background:#ffd700;box-shadow:0 0 6px #ffd700"></div>
        <div class="card-title">Monthly Investment Amounts</div>
        <div class="card-sub">stacked by asset</div>
      </div>
      <div class="chart-wrap tall"><canvas id="invStacked"></canvas></div>
    </div>

    <!-- Row 3: ROI % trend + Allocation donut -->
    <div class="row-3">
      <div class="glass">
        <div class="card-hdr">
          <div class="card-dot" style="background:#ff6b35;box-shadow:0 0 6px #ff6b35"></div>
          <div class="card-title">ROI % Over Time</div>
          <div class="card-sub">return on investment per asset</div>
        </div>
        <div class="chart-wrap tall"><canvas id="roiLine"></canvas></div>
      </div>
      <div class="glass">
        <div class="card-hdr">
          <div class="card-dot" style="background:#00e676;box-shadow:0 0 6px #00e676"></div>
          <div class="card-title">Current Allocation</div>
          <div class="card-sub">latest month</div>
        </div>
        <div class="chart-wrap tall"><canvas id="allocDonut"></canvas></div>
      </div>
    </div>

    <!-- Row 4: Earnings vs Invested grouped + MoM delta bars -->
    <div class="row-2">
      <div class="glass">
        <div class="card-hdr">
          <div class="card-dot" style="background:#38bdf8;box-shadow:0 0 6px #38bdf8"></div>
          <div class="card-title">Earnings vs Invested</div>
          <div class="card-sub">total per month</div>
        </div>
        <div class="chart-wrap"><canvas id="earnVsInv"></canvas></div>
      </div>
      <div class="glass">
        <div class="card-hdr">
          <div class="card-dot" style="background:#f472b6;box-shadow:0 0 6px #f472b6"></div>
          <div class="card-title">Month-over-Month Earnings Δ</div>
          <div class="card-sub">positive = improvement</div>
        </div>
        <div class="chart-wrap"><canvas id="deltaBar"></canvas></div>
      </div>
    </div>

    <!-- Row 5: All-time breakdown polar + insights -->
    <div class="row-3b">
      <div class="glass">
        <div class="card-hdr">
          <div class="card-dot" style="background:#c084fc;box-shadow:0 0 6px #c084fc"></div>
          <div class="card-title">Insights</div>
        </div>
        <div class="insight-grid" id="insights"></div>
      </div>
      <div class="glass">
        <div class="card-hdr">
          <div class="card-dot" style="background:#fb923c;box-shadow:0 0 6px #fb923c"></div>
          <div class="card-title">All-Time Performance</div>
          <div class="card-sub">total earned per asset</div>
        </div>
        <div class="chart-wrap"><canvas id="allTimePolar"></canvas></div>
      </div>
    </div>

    <!-- Row 6: Performance progress bars -->
    <div class="glass row-full">
      <div class="card-hdr">
        <div class="card-dot" style="background:#34d399;box-shadow:0 0 6px #34d399"></div>
        <div class="card-title">Earnings by Month — Performance Bars</div>
      </div>
      <div class="perf-row" id="perfBars"></div>
    </div>
  `;

  /* ── animated counters ── */
  setTimeout(()=>{
    animCounter(document.getElementById('kpi-ut'),  +latest[1]);
    animCounter(document.getElementById('kpi-stk'), +latest[2]);
    animCounter(document.getElementById('kpi-gld'), +latest[3]);
    animCounter(document.getElementById('kpi-tot'), +latest[1]+ +latest[2]+ +latest[3]);
    animCounter(document.getElementById('kpi-roi'), parseFloat(overallROI), false);
  }, 150);

  /* ── CHART 1: Earnings line ── */
  new Chart(document.getElementById('earnLine'),{
    type:'line',
    data:{labels:months,datasets:[
      {label:'UT',data:utEarn,borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,0.12)',tension:.4,fill:true,borderWidth:2.5,pointBackgroundColor:'#3b82f6',pointRadius:4,pointHoverRadius:7},
      {label:'Stock',data:stkEarn,borderColor:'#00e676',backgroundColor:'rgba(0,230,118,0.1)',tension:.4,fill:true,borderWidth:2.5,pointBackgroundColor:'#00e676',pointRadius:4,pointHoverRadius:7},
      {label:'Gold',data:gldEarn,borderColor:'#ffd700',backgroundColor:'rgba(255,215,0,0.1)',tension:.4,fill:true,borderWidth:2.5,pointBackgroundColor:'#ffd700',pointRadius:4,pointHoverRadius:7},
      {label:'Total',data:totEarn,borderColor:'#a855f7',backgroundColor:'rgba(168,85,247,0.06)',tension:.4,fill:false,borderWidth:2,borderDash:[],pointBackgroundColor:'#a855f7',pointRadius:3,pointHoverRadius:6}
    ]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:1200},
      plugins:{legend:{labels:{color:'rgba(255,255,255,.5)',font:{size:10},usePointStyle:true}},tooltip:{...TIP,callbacks:{label:ctx=>' '+ctx.dataset.label+': '+fmtLKR(ctx.parsed.y)}}},
      scales:{x:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9}},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9},callback:v=>'₨'+K(v)},grid:{color:'rgba(255,255,255,.04)'}}}}
  });

  /* ── CHART 2: Cumulative earnings ── */
  new Chart(document.getElementById('cumLine'),{
    type:'line',
    data:{labels:months,datasets:[
      {label:'Total Cumulative',data:cumTot,borderColor:'#a855f7',backgroundColor:(ctx)=>{const g=ctx.chart.ctx.createLinearGradient(0,0,0,280);g.addColorStop(0,'rgba(168,85,247,0.3)');g.addColorStop(1,'rgba(168,85,247,0)');return g;},tension:.4,fill:true,borderWidth:2.5,pointRadius:4,pointHoverRadius:7,pointBackgroundColor:'#a855f7'},
      {label:'UT',data:cumUT,borderColor:'#3b82f6',backgroundColor:'transparent',tension:.4,borderWidth:1.5,pointRadius:3,borderDash:[4,3]},
      {label:'Stock',data:cumStk,borderColor:'#00e676',backgroundColor:'transparent',tension:.4,borderWidth:1.5,pointRadius:3,borderDash:[4,3]},
      {label:'Gold',data:cumGld,borderColor:'#ffd700',backgroundColor:'transparent',tension:.4,borderWidth:1.5,pointRadius:3,borderDash:[4,3]}
    ]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:1300},
      plugins:{legend:{labels:{color:'rgba(255,255,255,.5)',font:{size:10},usePointStyle:true}},tooltip:{...TIP,callbacks:{label:ctx=>' '+ctx.dataset.label+': '+fmtLKR(ctx.parsed.y)}}},
      scales:{x:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9}},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9},callback:v=>'₨'+K(v)},grid:{color:'rgba(255,255,255,.04)'}}}}
  });

  /* ── CHART 3: Investment stacked bar ── */
  new Chart(document.getElementById('invStacked'),{
    type:'bar',
    data:{labels:months,datasets:[
      {label:'UT',data:utInv,backgroundColor:'rgba(59,130,246,.35)',borderColor:'#3b82f6',borderWidth:1,borderRadius:0,borderSkipped:false},
      {label:'Stock',data:stkInv,backgroundColor:'rgba(0,230,118,.3)',borderColor:'#00e676',borderWidth:1,borderSkipped:false},
      {label:'Gold',data:gldInv,backgroundColor:'rgba(255,215,0,.3)',borderColor:'#ffd700',borderWidth:1,borderRadius:8,borderSkipped:false}
    ]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:1100},
      plugins:{legend:{labels:{color:'rgba(255,255,255,.5)',font:{size:10},usePointStyle:true}},tooltip:{...TIP,mode:'index',intersect:false,callbacks:{label:ctx=>ctx.parsed.y>0?' '+ctx.dataset.label+': '+fmtLKR(ctx.parsed.y):null,footer:items=>' Total: '+fmtLKR(items.reduce((s,i)=>s+i.parsed.y,0))}}},
      scales:{x:{stacked:true,ticks:{color:'rgba(255,255,255,.4)',font:{size:9}},grid:{color:'rgba(255,255,255,.03)'}},y:{stacked:true,ticks:{color:'rgba(255,255,255,.4)',font:{size:9},callback:v=>'₨'+K(v)},grid:{color:'rgba(255,255,255,.04)'}}}}
  });

  /* ── CHART 4: ROI line ── */
  new Chart(document.getElementById('roiLine'),{
    type:'line',
    data:{labels:months,datasets:[
      {label:'UT ROI %',data:roiUT,borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,.1)',tension:.4,fill:true,borderWidth:2,pointRadius:4,pointHoverRadius:7,pointBackgroundColor:'#3b82f6'},
      {label:'Stock ROI %',data:roiStk,borderColor:'#00e676',backgroundColor:'rgba(0,230,118,.08)',tension:.4,fill:true,borderWidth:2,pointRadius:4,pointHoverRadius:7,pointBackgroundColor:'#00e676'},
      {label:'Gold ROI %',data:roiGld,borderColor:'#ffd700',backgroundColor:'rgba(255,215,0,.08)',tension:.4,fill:true,borderWidth:2,pointRadius:4,pointHoverRadius:7,pointBackgroundColor:'#ffd700'}
    ]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:1200},
      plugins:{legend:{labels:{color:'rgba(255,255,255,.5)',font:{size:10},usePointStyle:true}},tooltip:{...TIP,callbacks:{label:ctx=>' '+ctx.dataset.label+': '+ctx.parsed.y+'%'}}},
      scales:{x:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9}},grid:{color:'rgba(255,255,255,.04)'}},y:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9},callback:v=>v+'%'},grid:{color:'rgba(255,255,255,.04)'}}}}
  });

  /* ── CHART 5: Allocation donut (latest month) ── */
  new Chart(document.getElementById('allocDonut'),{
    type:'doughnut',
    data:{labels:['UT','Stock','Gold'],datasets:[{
      data:[latest[4],latest[5],latest[6]],
      backgroundColor:['rgba(59,130,246,.3)','rgba(0,230,118,.28)','rgba(255,215,0,.28)'],
      borderColor:['#3b82f6','#00e676','#ffd700'],borderWidth:2,hoverOffset:10
    }]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'65%',animation:{animateRotate:true,duration:1300},
      plugins:{legend:{position:'bottom',labels:{color:'rgba(255,255,255,.5)',font:{size:10},padding:12,usePointStyle:true,pointStyleWidth:7}},
        tooltip:{...TIP,callbacks:{label:ctx=>' '+ctx.label+': '+fmtLKR(ctx.parsed)+' ('+((ctx.parsed/(+latest[4]+ +latest[5]+ +latest[6]))*100).toFixed(1)+'%)'}}}
    }
  });

  /* ── CHART 6: Earnings vs Invested grouped ── */
  new Chart(document.getElementById('earnVsInv'),{
    type:'bar',
    data:{labels:months,datasets:[
      {label:'Total Invested',data:totInv,backgroundColor:'rgba(56,189,248,.2)',borderColor:'#38bdf8',borderWidth:2,borderRadius:6,borderSkipped:false},
      {label:'Total Earned',data:totEarn,backgroundColor:'rgba(168,85,247,.2)',borderColor:'#a855f7',borderWidth:2,borderRadius:6,borderSkipped:false}
    ]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:1100},
      plugins:{legend:{labels:{color:'rgba(255,255,255,.5)',font:{size:10},usePointStyle:true}},tooltip:{...TIP,callbacks:{label:ctx=>' '+ctx.dataset.label+': '+fmtLKR(ctx.parsed.y)}}},
      scales:{x:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9}},grid:{color:'rgba(255,255,255,.03)'}},y:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9},callback:v=>'₨'+K(v)},grid:{color:'rgba(255,255,255,.04)'}}}}
  });

  /* ── CHART 7: MoM delta bar ── */
  const deltaColors = deltaEarn.map(v=>v>0?'rgba(0,230,118,.35)':'rgba(255,77,141,.3)');
  const deltaBorders= deltaEarn.map(v=>v>0?'#00e676':'#ff4d8d');
  new Chart(document.getElementById('deltaBar'),{
    type:'bar',
    data:{labels:months,datasets:[{
      label:'Earnings Change',data:deltaEarn,
      backgroundColor:deltaColors,borderColor:deltaBorders,borderWidth:2,borderRadius:7,borderSkipped:false
    }]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:1100},
      plugins:{legend:{display:false},tooltip:{...TIP,callbacks:{label:ctx=>' '+(ctx.parsed.y>=0?'▲ +':'▼ ')+fmtLKR(ctx.parsed.y)}}},
      scales:{x:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9}},grid:{color:'rgba(255,255,255,.03)'}},y:{ticks:{color:'rgba(255,255,255,.4)',font:{size:9},callback:v=>(v>=0?'+':'')+K(v)},grid:{color:'rgba(255,255,255,.04)'}}}}
  });

  /* ── CHART 8: All-time polar ── */
  new Chart(document.getElementById('allTimePolar'),{
    type:'polarArea',
    data:{labels:['UT Earned','Stock Earned','Gold Earned'],datasets:[{
      data:[allUtEarn,allStkEarn,allGldEarn],
      backgroundColor:['rgba(59,130,246,.3)','rgba(0,230,118,.28)','rgba(255,215,0,.28)'],
      borderColor:['#3b82f6','#00e676','#ffd700'],borderWidth:2
    }]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:1400},
      scales:{r:{ticks:{display:false},grid:{color:'rgba(255,255,255,.06)'}}},
      plugins:{legend:{position:'bottom',labels:{color:'rgba(255,255,255,.5)',font:{size:10},padding:10,usePointStyle:true,pointStyleWidth:7}},
        tooltip:{...TIP,callbacks:{label:ctx=>' '+ctx.label+': '+fmtLKR(ctx.parsed.r)}}}
    }
  });

  /* ── Insights ── */
  const bestUtROI  = Math.max(...roiUT.map(Number));
  const bestStkROI = Math.max(...roiStk.map(Number));
  const bestGldROI = Math.max(...roiGld.map(Number));
  const insightsData = [
    {icon:'🏆',label:'Best Earning Month',value:months[bestEarnIdx],sub:'Total: '+fmtLKR(totEarn[bestEarnIdx])},
    {icon:'🔵',label:'Best UT ROI',value:bestUtROI+'%',sub:'Month: '+months[bestROI_UT]},
    {icon:'📈',label:'Best Stock ROI',value:bestStkROI+'%',sub:'Month: '+months[bestROI_Stk]},
    {icon:'🥇',label:'Best Gold ROI',value:bestGldROI+'%',sub:'Month: '+months[bestROI_Gld]},
    {icon:'💼',label:'All-Time UT Invested',value:fmtLKR(allUtInv),sub:'Earned: '+fmtLKR(allUtEarn)},
    {icon:'📊',label:'All-Time Stock Invested',value:fmtLKR(allStkInv),sub:'Earned: '+fmtLKR(allStkEarn)},
    {icon:'🪙',label:'All-Time Gold Invested',value:fmtLKR(allGldInv),sub:'Earned: '+fmtLKR(allGldEarn)},
    {icon:'🎯',label:'Overall ROI',value:overallROI+'%',sub:'Total invested: '+fmtLKR(allTotInv)},
  ];
  document.getElementById('insights').innerHTML = insightsData.map(i=>`
    <div class="insight-item">
      <div class="insight-emoji">${i.icon}</div>
      <div>
        <div class="insight-label">${i.label}</div>
        <div class="insight-value">${i.value}</div>
        <div class="insight-sub">${i.sub}</div>
      </div>
    </div>`).join('');

  /* ── Performance bars ── */
  const maxEarn = Math.max(...totEarn,1);
  document.getElementById('perfBars').innerHTML = rows.map((_,i)=>{
    const te=totEarn[i], pctW=(te/maxEarn*100).toFixed(1);
    const col = te===Math.max(...totEarn)?'#ffd700':te>=0?'#00e676':'#ff4d8d';
    return `<div class="perf-item">
      <div class="perf-top">
        <span class="perf-name">${months[i]}</span>
        <span class="perf-val" style="color:${col}">${fmtLKR(te)}</span>
      </div>
      <div class="perf-bar-bg">
        <div class="perf-bar" data-w="${pctW}" style="background:${col}"></div>
      </div>
    </div>`;
  }).join('');

  /* ── animate perf bars ── */
  setTimeout(()=>{
    document.querySelectorAll('.perf-bar').forEach(b=>{b.style.width=b.dataset.w+'%';});
  }, 400);
}

/* ── fetch ── */
window.onload = function() {
  google.script.run
    .withSuccessHandler(renderDashboard)
    .withFailureHandler(err=>{
      document.getElementById('root').innerHTML=
        `<div style="text-align:center;padding:80px;color:#ff4d8d;font-size:.9em">⚠️ ${err.message||err}</div>`;
    })
    .getInvestmentData();
};
</script>
</body>
</html>

/* ═══════════════════════════════════════════════════════════════

/* asset colours — same palette the Summary page draws from */
var INV_COL = { stk:'#00d4ff', gld:'#ffd700', fd:'#a855f7', ut:'#2dd4bf',

];

/* ═══════════════════════════════════════════
   FORMATTING
═══════════════════════════════════════════ */
function invFmt(n, d){
  d = d || 0;
  return '₨ ' + Math.abs(Number(n) || 0).toLocaleString('en-IN', { minimumFractionDigits:d, maximumFractionDigits:d });
}
function invSigned(n, d){ var v = Number(n) || 0; return (v < 0 ? '−' : '+') + invFmt(v, d); }
function invShort(n){
  var v = Number(n) || 0, a = Math.abs(v), s = v < 0 ? '−' : '';
  if(a >= 1e6) return s + '₨' + (a/1e6).toFixed(2) + 'M';
  if(a >= 1e3) return s + '₨' + (a/1e3).toFixed(1) + 'K';
  return s + '₨' + a.toFixed(0);
}
function invK(v){ var a = Math.abs(v); return a >= 1e6 ? (v/1e6).toFixed(1)+'M' : a >= 1e3 ? (v/1e3).toFixed(0)+'K' : v; }
function invPct(n, d){ var v = Number(n) || 0; return (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d === undefined ? 2 : d) + '%'; }
function invCls(n){ return n > 0 ? 'up' : n < 0 ? 'dn' : 'fl'; }
function invNum(n, d){ return Number(n || 0).toLocaleString('en-IN', { minimumFractionDigits:d||0, maximumFractionDigits:d||0 }); }
function invEsc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function invQ(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function invReduced(){ try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; } }
function invDays(dt){
  if(!dt) return null;
  var d = (dt instanceof Date) ? new Date(dt.getTime()) : new Date(dt);
  if(isNaN(d)) return null;
  d.setHours(0,0,0,0);
  var now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}
function invKpi(lbl, val, sub, cls, glow){
  return '<div class="inv-kpi">' + (glow ? '<div class="inv-kpi-glow" style="background:' + glow + '"></div>' : '') +
    '<div class="inv-kpi-lbl">' + lbl + '</div>' +
    '<div class="inv-kpi-val ' + (cls || '') + '">' + val + '</div>' +
    (sub ? '<div class="inv-kpi-sub">' + sub + '</div>' : '') + '</div>';
}
function invCardHead(title, dot, sub, right){
  return '<div class="inv-ch"><span class="inv-dot" style="background:' + dot + ';box-shadow:0 0 6px ' + dot + '"></span>' +
    '<span class="inv-title">' + title + '</span>' + (sub ? '<span class="inv-sub">' + sub + '</span>' : '') +
    (right ? '<div class="inv-sp">' + right + '</div>' : '') + '</div>';
}
function invLoader(txt, progId){
  return '<div class="inv-card"><div class="inv-load"><div class="inv-spin"></div><div id="' + (progId||'') + 'Lbl">' + txt + '</div>' +
    (progId ? '<div class="inv-prog"><i id="' + progId + '"></i></div>' : '') + '</div></div>';
}
function invErr(msg){ return '<div class="inv-err">⚠ ' + invEsc(msg) + '</div>'; }
function invToast(msg, type){
  var t = document.getElementById('invToast'); if(!t) return;
  t.textContent = msg; t.className = 'inv-toast ' + (type || '');
  void t.offsetWidth; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 3200);
}
function invHaptic(k){ if(typeof haptic === 'function') haptic(k); }

/* one Chart per key — destroys the previous instance first */
function invChart(key, canvasId, cfg){
  if(_invCharts[key]){ try { _invCharts[key].destroy(); } catch(e){} delete _invCharts[key]; }
  var el = document.getElementById(canvasId);
  if(!el || typeof Chart === 'undefined') return null;
  cfg.options = cfg.options || {};
  cfg.options.responsive = true;
  cfg.options.maintainAspectRatio = false;
  if(invReduced()) cfg.options.animation = false;
  _invCharts[key] = new Chart(el, cfg);
  return _invCharts[key];
}
function invTip(cbs){ var t = {}; for(var k in INV_TIP) t[k] = INV_TIP[k]; t.callbacks = cbs || {}; return t; }
function invLegend(){ return { labels:{ color:'rgba(255,255,255,.5)', font:{ size:10 }, usePointStyle:true, pointStyleWidth:7, boxHeight:7 } }; }
function invAxes(yFmt, stacked){
  return {
    x:{ stacked:!!stacked, ticks:{ color:INV_TICK, font:{ size:9 } }, grid:{ color:INV_GRID } },
    y:{ stacked:!!stacked, ticks:{ color:INV_TICK, font:{ size:9 }, callback:yFmt || function(v){ return '₨' + invK(v); } }, grid:{ color:INV_GRID } }
  };
}

/* ═══════════════════════════════════════════
   TABS
═══════════════════════════════════════════ */
function invBuildTabs(){
  var nav = document.getElementById('invTabs'); if(!nav) return;
  nav.innerHTML = INV_TABS.map(function(t){
    return '<button class="inv-tab' + (t.k === _invTab ? ' active' : '') + '" type="button" role="tab" data-tab="' + t.k + '"' +
      ' aria-selected="' + (t.k === _invTab) + '" onclick="invTab(\'' + t.k + '\')"><i style="background:' + t.col + '"></i>' + t.lbl + '</button>';
  }).join('');
}

function invTab(k){
  if(!document.getElementById('invP-' + k)) return;
  if(k !== _invTab) invHaptic('step');
  _invTab = k;
  document.querySelectorAll('#invTabs .inv-tab').forEach(function(b){
    var on = b.getAttribute('data-tab') === k;
    b.classList.toggle('active', on); b.setAttribute('aria-selected', on);
  });
  INV_TABS.forEach(function(t){ document.getElementById('invP-' + t.k).hidden = t.k !== k; });
  document.querySelectorAll('#invHero .inv-asset').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-go') === k); });

  if(k === 'div'  && _divState  === 'idle') invLoadDiv();
  if(k === 'perf' && _perfState === 'idle') invLoadPerf();
  if(k === 'gld'  && _goldState === 'idle') invLoadGold();
  if(k === 'fd'   && _fdState   === 'idle') invLoadFD();
  if(k === 'ut'   && _utState   === 'idle') invLoadUT();
  if(_invDirty[k]) invRenderTab(k);
  invSyncFabs();
}

/* re-render a tab now if it is showing, otherwise when it is next opened */
function invRefresh(k){
  if(k === _invTab) invRenderTab(k);
  else _invDirty[k] = true;
}
function invRenderTab(k){
  _invDirty[k] = false;
  if(k === 'stk')  invRenderStocks();
  if(k === 'gld')  invRenderGold();
  if(k === 'fd')   invRenderFD();
  if(k === 'ut')   invRenderUT();
  if(k === 'div')  invRenderDiv();
  if(k === 'perf') invRenderPerf();
}

/* FABs: stock edit on Stocks, add FD on Fixed Deposits — only while this page is showing */
function invSyncFabs(){
  var onPage = (typeof _activePage === 'undefined') || _activePage === 'cse';
  var sf = document.getElementById('invStockFab'), ff = document.getElementById('invFdFab');
  if(sf) sf.style.display = (onPage && _invTab === 'stk' && _stocks.length) ? 'flex' : 'none';
  if(ff) ff.style.display = (onPage && _invTab === 'fd') ? 'flex' : 'none';
}

/* ═══════════════════════════════════════════
   LOAD — called by render.html on first visit and on Reload
═══════════════════════════════════════════ */
function cseStartLoad(){
  _invGen++;
  _stocks = []; _live = {}; _liveQ = []; _liveTotal = 0; _liveDone = 0;
  _stkState = 'loading'; _goldState = 'idle'; _fdState = 'idle'; _utState = 'idle';
  _divState = 'idle'; _perfState = 'idle';
  _gold = null; _fdData = []; _utFunds = []; _divData = []; _perfRows = null;
  _invDirty = {};
  invBuildTabs();
  invMktStatus();
  invSetUpd('Reading…');
  var btn = document.getElementById('invReloadBtn'); if(btn) btn.disabled = true;

  INV_TABS.forEach(function(t){ document.getElementById('invP-' + t.k).innerHTML = ''; });
  document.getElementById('invP-stk').innerHTML = invLoader('Reading your stocks…', 'invStkProg');
  invRenderHero();
  invTab(_invTab);

  var gen = _invGen;
  google.script.run
    .withSuccessHandler(function(res){ if(gen === _invGen) invOnSheet(res); })
    .withFailureHandler(function(e){
      if(gen !== _invGen) return;
      _stkState = 'err';
      document.getElementById('invP-stk').innerHTML = invErr(e.message || e);
      if(btn) btn.disabled = false;
      invSetUpd('Failed');
    })
    .getCSESheetData();

  /* the summary band needs every asset, so warm them all up now */
  invLoadGold(); invLoadFD(); invLoadUT();
}

function invSetUpd(t){ var el = document.getElementById('invUpd'); if(el) el.textContent = t; }
function invSetProg(pct, lbl){
  var f = document.getElementById('invStkProg'); if(f) f.style.width = pct + '%';
  var l = document.getElementById('invStkProgLbl'); if(l && lbl) l.textContent = lbl;
}

function invMktStatus(){
  var n = new Date(), h = n.getHours(), m = n.getMinutes(), d = n.getDay();
  var open = d >= 1 && d <= 5 && (h > 9 || (h === 9 && m >= 30)) && (h < 14 || (h === 14 && m <= 30));
  var el = document.getElementById('invMkt'), tx = document.getElementById('invMktTxt');
  if(el) el.className = 'inv-mkt' + (open ? ' open' : '');
  if(tx) tx.textContent = open ? 'CSE open' : 'CSE closed';
}

/* ── stocks: sheet → LOLC batch (fallback: cse.lk per symbol) ── */
function invOnSheet(res){
  _stocks = (res && res.stocks) || [];
  _stkState = 'sheet';
  invRefresh('stk'); invRenderHero(); invSyncFabs();
  if(!_stocks.length){ invAllLive(); return; }
  _liveTotal = _stocks.length; _liveDone = 0;
  invSetUpd('Fetching prices…');
  invFetchPrices();
}

function invFetchPrices(){
  var gen = _invGen;
  google.script.run
    .withSuccessHandler(function(rows){ if(gen === _invGen) invOnScreener(rows); })
    .withFailureHandler(function(){
      if(gen !== _invGen) return;
      invSetUpd('LOLC unavailable, trying CSE…');
      _live = {}; _liveDone = 0;
      _liveQ = _stocks.map(function(s){ return s.symbol; });
      invFetchNext(gen);
    })
    .getLOLCScreenerAll();
}

function invOnScreener(rows){
  _screenerAll = rows || [];
  var map = {};
  _screenerAll.forEach(function(r){ if(r.symbol) map[r.symbol.toUpperCase()] = r; });
  _live = {};
  _stocks.forEach(function(s){
    var r = map[s.symbol.toUpperCase()] || { success:false };
    r.symbol = s.symbol;
    _live[s.symbol] = r;
  });
  _liveDone = _stocks.length;
  invAllLive();
}

function invFetchNext(gen){
  if(gen !== _invGen) return;
  if(!_liveQ.length){ invAllLive(); return; }
  var sym = _liveQ.shift();
  google.script.run
    .withSuccessHandler(function(r){ if(gen !== _invGen) return; _live[r.symbol || sym] = r; _liveDone++; invOnLive(); invFetchNext(gen); })
    .withFailureHandler(function(){ if(gen !== _invGen) return; _live[sym] = { success:false, symbol:sym }; _liveDone++; invOnLive(); invFetchNext(gen); })
    .getCSELivePrice(sym);
}

function invOnLive(){
  var pct = Math.round(_liveDone / Math.max(1, _liveTotal) * 100);
  invSetUpd('Live: ' + _liveDone + '/' + _liveTotal);
  invSetProg(pct, 'Live: ' + _liveDone + ' / ' + _liveTotal);
  invRefresh('stk'); invRenderHero();
}

function invAllLive(){
  _stkState = 'done';
  invRefresh('stk'); invRenderHero(); invBuildTicker(); invSyncFabs();
  var btn = document.getElementById('invReloadBtn'); if(btn) btn.disabled = false;
  invSetUpd('Updated ' + new Date().toLocaleTimeString());
  if(_divState === 'done') invRefresh('div');
}

function invBuildTicker(){
  if(typeof _buildTick !== 'function' || !_stocks.length) return;
  var items = _stocks.map(function(s){
    var r = _live[s.symbol], ok = r && r.success;
    var p = (ok && r.currentPrice) ? r.currentPrice : s.sheetPrice;
    var chg = (ok && r.changePct) ? '<span class="tick-chg ' + invCls(r.changePct) + '">' + invPct(r.changePct) + '</span>' : '';
    return '<span class="tick-item"><span class="tick-sym">' + invEsc(s.symbol) + '</span><span style="color:rgba(255,255,255,.7)">₨ ' + (p ? p.toFixed(2) : '—') + '</span>' + chg + '</span>';
  });
  _buildTick('cseTickerWrap', 'cseTickerTrack', items, 45);
}

/* ═══════════════════════════════════════════
   DERIVED NUMBERS
═══════════════════════════════════════════ */
function invStockRows(){
  return _stocks.map(function(s, idx){
    var r = _live[s.symbol], ok = !!(r && r.success);
    var price = (ok && r.currentPrice) ? r.currentPrice : s.sheetPrice;
    var hasPnl = s.boughtPrice > 0 && s.qty > 0 && price > 0;
    var cost = hasPnl ? s.boughtPrice * s.qty : 0;
    var val = (s.qty > 0 && price > 0) ? price * s.qty : 0;
    var chgPct = (ok && r.changePct) ? Number(r.changePct) : null;
    var dayAmt = (ok && r.change && s.qty) ? Number(r.change) * s.qty : 0;
    return { s:s, idx:idx, r:r || null, ok:ok, pending:!r && _stkState !== 'done', price:price, hasPnl:hasPnl,
             cost:cost, val:val, pnl:hasPnl ? val - cost : 0, pp:hasPnl ? (val - cost) / cost * 100 : 0,
             chgPct:chgPct, dayAmt:dayAmt };
  });
}
function invStockTotals(){
  var t = { inv:0, val:0, day:0, hasDay:false };
  invStockRows().forEach(function(x){
    if(x.hasPnl){ t.inv += x.cost; t.val += x.val; }
    if(x.dayAmt){ t.day += x.dayAmt; t.hasDay = true; }
  });
  return t;
}
function invGoldTotals(){
  if(!_gold) return null;
  var hist = _gold.history || [], last = hist.length ? hist[hist.length - 1] : {};
  var inv = last.goldInvested || _gold.currentInvested || 0, earn = last.goldEarnings || 0;
  return { inv:inv, earn:earn, val:inv + earn };
}
function invFdActive(){ return _fdData.filter(function(f){ return f.status === 'In Progress'; }); }
function invFdIsMonthly(f){ return String(f.type || '').toLowerCase().indexOf('monthly') > -1; }
function invUtTotals(){
  var t = { inv:0, val:0, earn:0 };
  _utFunds.forEach(function(f){ t.inv += f.invested; t.val += f.units * f.unitPrice; t.earn += f.earnings; });
  return t;
}

/* ═══════════════════════════════════════════
   ③ SUMMARY BAND
═══════════════════════════════════════════ */
function invRenderHero(){
  var el = document.getElementById('invHero'); if(!el) return;
  var st = invStockTotals(), gt = invGoldTotals(), ut = invUtTotals();
  var fdAct = invFdActive(), fdPrin = fdAct.reduce(function(s, f){ return s + f.amount; }, 0);
  var stkReady = _stkState === 'done' || _stkState === 'sheet';

  var assets = [
    { k:'stk', n:'Stocks',         col:INV_COL.stk, ready:stkReady,              val:st.val, inv:st.inv },
    { k:'gld', n:'Gold',           col:INV_COL.gld, ready:!!gt,                  val:gt ? gt.val : 0, inv:gt ? gt.inv : 0 },
    { k:'fd',  n:'Fixed Deposits', col:INV_COL.fd,  ready:_fdState === 'done',   val:fdPrin, inv:fdPrin, fd:true },
    { k:'ut',  n:'Unit Trust',     col:INV_COL.ut,  ready:_utState === 'done',   val:ut.val, inv:ut.inv }
  ];
  var total = 0, gainInv = 0, gain = 0, pending = [];
  assets.forEach(function(a){
    if(!a.ready){ pending.push(a.n); return; }
    total += a.val;
    if(!a.fd){ gain += a.val - a.inv; gainInv += a.inv; }
  });
  var roi = gainInv > 0 ? gain / gainInv * 100 : 0;

  var deltas = '<span class="inv-delta ' + invCls(gain) + '">' + invSigned(gain) + ' gain</span>' +
    '<span class="inv-delta ' + invCls(roi) + '">' + invPct(roi) + ' ROI</span>';
  if(st.hasDay) deltas += '<span class="inv-delta ' + invCls(st.day) + '">' + invSigned(st.day) + ' today</span>';

  var ribbon = assets.filter(function(a){ return a.ready && a.val > 0; }).map(function(a){
    return '<span title="' + a.n + ' · ' + (total ? (a.val / total * 100).toFixed(1) : 0) + '%" style="flex:' + a.val + ';background:' + a.col + '"></span>';
  }).join('');

  var tiles = assets.map(function(a){
    var sub;
    if(!a.ready) sub = '<span class="inv-asset-r">loading…</span>';
    else if(a.fd) sub = '<span class="inv-asset-r">' + fdAct.length + ' active · ' + (total ? Math.round(a.val / total * 100) : 0) + '%</span>';
    else {
      var p = a.inv > 0 ? (a.val - a.inv) / a.inv * 100 : 0;
      sub = '<span class="inv-asset-r"><span class="' + invCls(p) + '">' + invPct(p) + '</span> · ' + (total ? Math.round(a.val / total * 100) : 0) + '%</span>';
    }
    return '<button class="inv-asset' + (a.k === _invTab ? ' active' : '') + '" type="button" data-go="' + a.k + '" onclick="invTab(\'' + a.k + '\')">' +
      '<span class="inv-asset-t"><i style="background:' + a.col + '"></i>' + a.n + '</span>' +
      '<span class="inv-asset-v">' + (a.ready ? invShort(a.val) : '—') + '</span>' + sub + '</button>';
  }).join('');

  el.innerHTML =
    '<div>' +
      '<div class="inv-hero-lbl">Total invested value</div>' +
      '<div class="inv-hero-amt">' + invFmt(total) + '</div>' +
      '<div class="inv-deltas">' + deltas + '</div>' +
      '<div class="inv-hero-note">' + (pending.length ? 'Still loading: ' + pending.join(', ') : 'Gain and ROI cover stocks, gold and unit trusts') + '</div>' +
    '</div>' +
    '<div>' +
      '<div class="inv-hero-lbl">Allocation</div>' +
      '<div class="inv-ribbon">' + (ribbon || '<span style="flex:1;background:rgba(255,255,255,.07)"></span>') + '</div>' +
      '<div class="inv-assets">' + tiles + '</div>' +
    '</div>';
}

/* ═══════════════════════════════════════════
   STOCKS
═══════════════════════════════════════════ */
function invRenderStocks(){
  var host = document.getElementById('invP-stk'); if(!host) return;
  if(_stkState === 'loading' || _stkState === 'idle'){ host.innerHTML = invLoader('Reading your stocks…', 'invStkProg'); return; }
  if(_stkState === 'err') return;
  if(!_stocks.length){
    host.innerHTML = '<div class="inv-card"><div class="inv-empty">📭 No stocks found in UT_CRYPTO A20:A29.</div></div>';
    return;
  }
  var t = invStockTotals(), pnl = t.val - t.inv, pp = t.inv > 0 ? pnl / t.inv * 100 : 0;
  var h = '<div class="inv-kpis">' +
    invKpi('Invested', invFmt(t.inv), 'Cost basis', '', INV_COL.stk) +
    invKpi('Current value', invFmt(t.val), _stkState === 'done' ? 'Live prices' : 'Fetching prices…', '', INV_COL.stk) +
    invKpi('Total P&amp;L', invSigned(pnl), invPct(pp) + ' overall', invCls(pnl), pnl >= 0 ? INV_COL.up : INV_COL.dn) +
    invKpi("Today's move", t.hasDay ? invSigned(t.day) : '—', t.hasDay ? 'All holdings' : 'No intraday change from screener', t.hasDay ? invCls(t.day) : '', INV_COL.gld) +
    '</div>';

  var sortChip = function(k, l){ return '<button class="inv-chip' + (_stkSort === k ? ' active' : '') + '" type="button" onclick="invStkSort(\'' + k + '\')">' + l + '</button>'; };
  h += '<div class="inv-card inv-mb">' +
    invCardHead('Holdings', INV_COL.stk, _stocks.length + ' stocks',
      '<div class="inv-chips">' + sortChip('val','Value') + sortChip('pnl','P&amp;L %') + sortChip('day','Today') + sortChip('sym','A–Z') +
      '<button class="inv-btn ghost" type="button" onclick="invStockEditOpen()">✏️ Edit</button></div>') +
    '<div class="inv-tbl-x"><table class="inv-tbl"><thead><tr>' +
      '<th>Stock</th><th class="inv-hide-sm">Qty @ cost</th><th>LTP</th><th>Today</th><th>Value</th><th>P&amp;L</th>' +
      '<th class="inv-hide-sm" style="width:110px"></th><th style="width:34px"></th>' +
    '</tr></thead><tbody>' + invStockBody() + '</tbody></table></div></div>';

  h += '<div class="inv-card">' + invCardHead('Look up a CSE stock', INV_COL.tot, _screenerAll.length ? _screenerAll.length + ' listed companies' : 'available once LOLC prices load') +
    '<input class="inv-input" id="invAzSearch" type="text" style="width:100%" placeholder="Symbol or company, e.g. COMB, HNB, LOLC" oninput="invAzFilter()" autocomplete="off">' +
    '<div class="inv-chips" id="invAzChips" style="margin-top:10px"></div>' +
    '<div id="invAzCard" style="margin-top:12px"></div></div>';

  var prevQ = (document.getElementById('invAzSearch') || {}).value || '';
  var prevCard = document.getElementById('invAzCard');
  var prevCardHtml = prevCard ? prevCard.innerHTML : '';
  host.innerHTML = h;
  document.getElementById('invAzSearch').value = prevQ;
  invAzFilter(true);
  if(prevCardHtml) document.getElementById('invAzCard').innerHTML = prevCardHtml;
}

function invStkSort(k){ _stkSort = k; invRenderStocks(); }

function invStockBody(){
  var rows = invStockRows();
  rows.sort(function(a, b){
    if(_stkSort === 'pnl') return b.pp - a.pp;
    if(_stkSort === 'day') return (b.chgPct || 0) - (a.chgPct || 0);
    if(_stkSort === 'sym') return a.s.symbol.localeCompare(b.s.symbol);
    return b.val - a.val;
  });
  var maxP = Math.max.apply(null, rows.map(function(x){ return Math.abs(x.pp); }).concat([1]));
  return rows.map(function(x){
    var s = x.s, sym = invEsc(s.symbol), open = !!_stkOpen[s.symbol];
    var tag = x.pending ? '<span class="inv-tag">sheet</span>' : x.ok ? '<span class="inv-tag live">live</span>' : '<span class="inv-tag off">offline</span>';
    var name = (x.r && x.r.companyName) || s.name || '';
    var qty = (s.qty > 0 && s.boughtPrice > 0) ? invNum(s.qty) + ' @ ' + s.boughtPrice.toFixed(2)
            : '<button class="inv-link" type="button" onclick="invStockEditOpen()">Add cost &amp; qty</button>';
    var bar = '';
    if(x.hasPnl){
      var w = Math.abs(x.pp) / maxP * 50;
      bar = '<div class="inv-bar"><span style="left:50%;width:1px;background:rgba(255,255,255,.18)"></span>' +
        '<span style="' + (x.pp >= 0 ? 'left:50%' : 'right:50%') + ';width:' + w + '%;background:' + (x.pp >= 0 ? INV_COL.up : INV_COL.dn) + '"></span></div>';
    }
    var h = '<tr>' +
      '<td><span class="inv-sym">' + sym + '</span>' + tag + '<span class="inv-nm">' + invEsc(name || '—') + '</span></td>' +
      '<td class="inv-hide-sm fl">' + qty + '</td>' +
      '<td class="strong">' + (x.price ? x.price.toFixed(2) : '—') + '</td>' +
      '<td class="' + (x.chgPct === null ? 'fl' : invCls(x.chgPct)) + '">' + (x.chgPct === null ? '—' : invPct(x.chgPct)) + '</td>' +
      '<td>' + (x.val ? invFmt(x.val) : '—') + '</td>' +
      '<td class="' + invCls(x.pnl) + '">' + (x.hasPnl ? invSigned(x.pnl) + '<span class="inv-nm" style="color:inherit;opacity:.8">' + invPct(x.pp) + '</span>' : '<span class="fl">—</span>') + '</td>' +
      '<td class="inv-hide-sm">' + bar + '</td>' +
      '<td><button class="inv-icon-btn" type="button" aria-expanded="' + open + '" aria-label="Details for ' + sym + '" onclick="invStkToggle(\'' + invQ(s.symbol) + '\')">' + (open ? '▾' : '▸') + '</button></td>' +
      '</tr>';
    if(open) h += '<tr class="inv-x"><td colspan="8">' + invStockDetail(x) + '</td></tr>';
    return h;
  }).join('');
}

function invMetrics(r){
  var m = [];
  if(!r) return m;
  if(r.pe > 0)  m.push('P/E<b>' + r.pe.toFixed(1) + '</b>' + (r.sectorPe > 0 ? '<small>sector ' + r.sectorPe.toFixed(1) + '</small>' : ''));
  if(r.pbv > 0) m.push('PBV<b>' + r.pbv.toFixed(2) + '</b>' + (r.sectorPbv > 0 ? '<small>sector ' + r.sectorPbv.toFixed(2) + '</small>' : ''));
  if(r.eps > 0) m.push('EPS<b>₨ ' + r.eps.toFixed(2) + '</b>');
  if(r.nav > 0) m.push('NAV<b>₨ ' + r.nav.toFixed(2) + '</b>');
  if(r.roe > 0) m.push('ROE<b>' + r.roe.toFixed(1) + '%</b>');
  if(r.dps > 0) m.push('DPS<b>₨ ' + r.dps.toFixed(2) + '</b>');

function invFdTimeline(tl){
  var today = new Date(); today.setHours(0,0,0,0);
  var t0 = Math.min(today.getTime(), new Date(tl[0].end).setHours(0,0,0,0));
  var t1 = new Date(tl[tl.length - 1].end).setHours(0,0,0,0);
  var span = (t1 - t0) || 86400000, W = 600, H = 84, pl = 16, pr = 16, y = 40;
  var X = function(ms){ return Math.round(pl + (ms - t0) / span * (W - pl - pr)); };
  var mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var days = Math.round(span / 86400000), step = days <= 90 ? 1 : days <= 270 ? 2 : 3;
  var d = new Date(t0); d.setDate(1); d.setMonth(d.getMonth() + 1);
  var ticks = [];
  for(var i = 0; i < 36 && d.getTime() <= t1; i++){ ticks.push({ ms:d.getTime(), l:mo[d.getMonth()] + "'" + String(d.getFullYear()).slice(2) }); d.setMonth(d.getMonth() + step); }
  while(ticks.length > 6) ticks = ticks.filter(function(_, i){ return i % 2 === 0; });
  var s = '<svg class="inv-tl" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  s += '<line x1="' + pl + '" y1="' + y + '" x2="' + (W - pr) + '" y2="' + y + '" stroke="rgba(255,255,255,.16)" stroke-width="1.5" stroke-linecap="round"/>';
  ticks.forEach(function(t){
    var x = X(t.ms);
    s += '<line x1="' + x + '" y1="' + (y + 4) + '" x2="' + x + '" y2="' + (y + 10) + '" stroke="rgba(255,255,255,.15)"/>' +
         '<text x="' + x + '" y="' + (y + 24) + '" font-size="10" fill="rgba(255,255,255,.35)" text-anchor="middle" font-family="Inter,sans-serif">' + t.l + '</text>';
  });
  var nx = X(today.getTime());
  s += '<line x1="' + nx + '" y1="' + (y - 20) + '" x2="' + nx + '" y2="' + (y + 10) + '" stroke="rgba(0,212,255,.6)" stroke-width="1.2" stroke-dasharray="3,2"/>' +

function invLoadDiv(){
  if(_divState === 'loading') return;
  _divState = 'loading';
  var gen = _invGen;
  invRefresh('div');
  google.script.run
    .withSuccessHandler(function(csv){ if(gen !== _invGen) return; _divData = invParseDivCSV(csv || ''); _divState = 'done'; _dvPage = 1; invRefresh('div'); })
    .withFailureHandler(function(e){ if(gen !== _invGen) return; _divState = 'err'; _divData = []; _divData._err = e.message || String(e); invRefresh('div'); })
    .getDividendCalendarCSV();
}

function invParseDivCSV(csv){
  var lines = csv.split('\n'), rows = [];
  for(var i = 1; i < lines.length; i++){
    var ln = lines[i].trim(); if(!ln) continue;
    var c = invCsvLine(ln); if(c.length < 5) continue;
    rows.push({ code:c[3].trim(), dps:parseFloat(c[4]) || 0, type:c[5] ? c[5].trim() : '', fy:c[6] ? c[6].trim() : '',
      payDate:invParseDMY(c[2].trim()), annDate:invParseDMY(c[0].trim()), xdDate:invParseDMY(c[1].trim()) });
  }
  return rows;
}
function invCsvLine(ln){
  var r = [], cur = '', q = false;
  for(var i = 0; i < ln.length; i++){
    var ch = ln[i];
    if(ch === '"'){ q = !q; continue; }
    if(ch === ',' && !q){ r.push(cur); cur = ''; continue; }
    cur += ch;
  }
  r.push(cur); return r;
}
/* ISO yyyy-MM-dd or legacy dd/MM/yyyy */
function invParseDMY(s){
  if(!s) return null;
  var p, y, m, d;
  if(s.indexOf('-') > -1){ p = s.split('-'); if(p.length !== 3) return null; y = +p[0]; m = +p[1] - 1; d = +p[2]; }
  else { p = s.split('/'); if(p.length !== 3) return null; d = +p[0]; m = +p[1] - 1; y = +p[2]; }
  return (isNaN(d) || isNaN(m) || isNaN(y)) ? null : new Date(y, m, d);
}
function invFmtD(dt){ return dt ? dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) : '—'; }
function invHeldMap(){ var m = {}; _stocks.forEach(function(s){ if(s.qty > 0) m[s.symbol.toUpperCase()] = s.qty; }); return m; }
function invDivKind(t){
  var tl = (t || '').toLowerCase();
  if(tl.indexOf('final') > -1 || tl.indexOf('other') > -1) return 'final';
  if(['first','second','third','fourth','interim'].some(function(w){ return tl.indexOf(w) > -1; })) return 'interim';
  return 'other';
}

function invDvFiltered(){
  var now = new Date(); now.setHours(0,0,0,0);
  var held = invHeldMap(), q = _dvQuery.trim().toUpperCase();
  return _divData.filter(function(r){
    if(_dvMine && !held[r.code.toUpperCase()]) return false;
    if(q && r.code.toUpperCase().indexOf(q) < 0) return false;
    if(_dvYear){
      if(!r.payDate || r.payDate.getFullYear() !== +_dvYear) return false;
    } else {
      var d = invDays(r.payDate), pd = r.payDate;
      if(_dvRange === 'upcoming' && (d === null || d < 0)) return false;
      if(_dvRange === 'month' && (!pd || pd.getMonth() !== now.getMonth() || pd.getFullYear() !== now.getFullYear())) return false;
      if(_dvRange === '3m' && (d === null || Math.abs(d) > 90)) return false;
      if(_dvRange === '6m' && (d === null || Math.abs(d) > 180)) return false;
      if(_dvRange === 'year' && (!pd || pd.getFullYear() !== now.getFullYear())) return false;
    }
    if(_dvType === 'final' && invDivKind(r.type) !== 'final') return false;
    if(_dvType === 'interim' && invDivKind(r.type) !== 'interim') return false;
    if(_dvType !== 'all' && _dvType !== 'final' && _dvType !== 'interim' && r.type !== _dvType) return false;
    return true;
  }).sort(function(a, b){
    var at = a.payDate ? a.payDate.getTime() : 0, bt = b.payDate ? b.payDate.getTime() : 0;
    if(_dvSort === 'pay_asc')  return at - bt;
    if(_dvSort === 'pay_desc') return bt - at;
    if(_dvSort === 'dps_desc') return b.dps - a.dps;
    if(_dvSort === 'dps_asc')  return a.dps - b.dps;
    if(_dvSort === 'code_asc') return a.code.localeCompare(b.code);
    if(_dvSort === 'code_desc') return b.code.localeCompare(a.code);
    return 0;
  });
}

function invRenderDiv(){
  var host = document.getElementById('invP-div'); if(!host) return;
  if(_divState === 'err'){ host.innerHTML = invErr('Dividend error: ' + _divData._err); return; }
  if(_divState !== 'done'){ host.innerHTML = invLoader('Loading LOLC dividend calendar…'); return; }

  /* upcoming payouts for what you hold */
  var held = invHeldMap();
  var mine = _divData.filter(function(r){ var d = invDays(r.payDate); return held[r.code.toUpperCase()] && d !== null && d >= 0 && d <= 60; })
    .sort(function(a, b){ return a.payDate - b.payDate; });
  var mineTot = mine.reduce(function(s, r){ return s + r.dps * held[r.code.toUpperCase()]; }, 0);
  var h = '<div class="inv-card inv-mb">' + invCardHead('Upcoming for your holdings', INV_COL.up, 'next 60 days',
      mine.length ? '<span class="num" style="font-size:13px;font-weight:800;color:#00ff88">' + invFmt(mineTot, 2) + ' incoming</span>' : '');
  h += mine.length ? '<div class="inv-up-list">' + mine.map(function(r){
      var q = held[r.code.toUpperCase()], d = invDays(r.payDate);
      return '<button class="inv-up" type="button" title="Open chart" onclick="invOpenChart(\'' + invQ(r.code) + '\')">' +
        '<span class="inv-up-top"><span class="inv-sym">' + invEsc(r.code) + '</span><span class="inv-tag soon">' + (d === 0 ? 'today' : d === 1 ? 'tomorrow' : 'in ' + d + 'd') + '</span></span>' +
        '<span class="inv-up-amt">' + invFmt(q * r.dps, 2) + '</span>' +
        '<span class="inv-up-meta">' + invNum(q) + ' shares × ₨ ' + r.dps.toFixed(2) + ' · pays ' + invFmtD(r.payDate) + '</span></button>';
    }).join('') + '</div>'
    : '<div class="inv-empty">' + (_stocks.length ? 'None of your holdings pay a dividend in the next 60 days.' : 'Waiting for your holdings to load…') + '</div>';

function invDvSet(k, v){
  if(k === 'range'){ _dvRange = v; _dvYear = ''; }
  if(k === 'year'){ _dvYear = v; if(!v && !_dvRange) _dvRange = 'all'; }
  if(k === 'type') _dvType = v;
  if(k === 'sort') _dvSort = v;
  if(k === 'mine') _dvMine = !_dvMine;
  _dvPage = 1;
  if(k === 'sort'){ invDvTable(); return; }
  invRenderDiv();
}
function invDvSearch(v){ _dvQuery = v; _dvPage = 1; invDvTable(); }
function invDvColSort(col){
  var cur = _dvSort;
  if(cur.indexOf(col) === 0) _dvSort = cur.slice(-4) === 'desc' ? col + '_asc' : col + '_desc';
  else _dvSort = col === 'code' ? 'code_asc' : col + '_desc';
  _dvPage = 1;

  invDvTable();
}
function invDvGo(p){ _dvPage = p; invDvTable(); }

function invDvTable(){

  var h = '<div class="inv-tbl-x"><table class="inv-tbl"><thead><tr>' + th('pay','Pay date') + th('code','Code') + th('dps','DPS') +

    if(e < pages) h += (e < pages - 1 ? '<span class="inv-pg-info">…</span>' : '') + '<button class="inv-pg" type="button" onclick="invDvGo(' + pages + ')">' + pages + '</button>';
    h += '<button class="inv-pg" type="button" onclick="invDvGo(' + (_dvPage + 1) + ')"' + (_dvPage === pages ? ' disabled' : '') + '>Next ›</button>' +
      '<span class="inv-pg-info">Page ' + _dvPage + ' / ' + pages + '</span></div>';

function invLoadPerf(){

  google.script.run
    .withSuccessHandler(function(rows){ if(gen !== _invGen) return; _perfRows = rows || []; _perfState = 'done'; invRefresh('perf'); })
    .withFailureHandler(function(e){ if(gen !== _invGen) return; _perfState = 'err'; _perfRows = { _err:e.message || String(e) }; invRefresh('perf'); })

function invPerfLog(){
  var btn = document.getElementById('invPerfLogBtn');
  if(!btn || btn.disabled) return;
  btn.disabled = true; btn.classList.add('busy');
  google.script.run
    .withSuccessHandler(function(result){
      if(result && !result.logged){
        btn.disabled = false; btn.classList.remove('busy');
        invToast('⏭️ ' + (result.message || 'Already logged'), 'err'); return;
      }
      invToast('✅ Logged — refreshing…', 'ok'); invHaptic('success');
      google.script.run
        .withSuccessHandler(function(rows){ _perfRows = rows || []; _perfState = 'done'; invRenderPerf(); invToast('✅ Performance updated', 'ok'); })
        .withFailureHandler(function(err){ btn.disabled = false; btn.classList.remove('busy'); invToast('⚠️ Logged, but refresh failed: ' + (err.message || err), 'err'); })
        .getInvestmentData();
    })
    .withFailureHandler(function(err){ btn.disabled = false; btn.classList.remove('busy'); invToast('⚠️ ' + (err.message || err), 'err'); invHaptic('error'); })
    .logMonthlyEarnings();
}

function invCounter(el, target, isPct){
  if(!el) return;
  var fmt = function(v){ return isPct ? v.toFixed(1) + '%' : '₨' + Math.round(v).toLocaleString('en-IN'); };
  if(invReduced()){ el.textContent = fmt(target); return; }
  var t0 = performance.now(), dur = 1200;
  (function tick(now){
    var p = Math.min((now - t0) / dur, 1), e = 1 - Math.pow(1 - p, 4);
    el.textContent = fmt(target * e);
    if(p < 1) requestAnimationFrame(tick);
  })(t0);
}

function invRenderPerf(){
  var host = document.getElementById('invP-perf'); if(!host) return;

  var fmtTip = function(c){ return ' ' + c.dataset.label + ': ' + invFmt(c.parsed.y); };

  if(key === 'earn'){
    cfg = { type:'line', data:{ labels:S.months, datasets:[
      line('Unit Trust', S.utE, INV_COL.ut, true), line('Stocks', S.stE, INV_COL.stk, true), line('Gold', S.gdE, INV_COL.gld, true),
      line('Bank int.', S.bank, INV_COL.bank), line('Stock div.', S.divE, INV_COL.div), line('Total', S.totE, INV_COL.tot) ] },
      options:{ interaction:{ mode:'index', intersect:false }, plugins:{ legend:invLegend(), tooltip:invTip({ label:fmtTip }) }, scales:invAxes() } };
  } else if(key === 'inv'){
    cfg = { type:'bar', data:{ labels:S.months, datasets:[ bar('Unit Trust', S.utI, INV_COL.ut), bar('Stocks', S.stI, INV_COL.stk), bar('Gold', S.gdI, INV_COL.gld) ] },
      options:{ interaction:{ mode:'index', intersect:false }, plugins:{ legend:invLegend(), tooltip:invTip({
        label:function(c){
          if(!c.parsed.y) return null;
          var t = c.chart.data.datasets.reduce(function(s, d){ return s + (d.data[c.dataIndex] || 0); }, 0);
          return ' ' + c.dataset.label + ': ' + invFmt(c.parsed.y) + ' (' + (t > 0 ? (c.parsed.y / t * 100).toFixed(1) : 0) + '%)';
        },
        footer:function(items){ return ' Total: ' + invFmt(items.reduce(function(s, x){ return s + x.parsed.y; }, 0)); } }) },
        scales:invAxes(null, true) } };
  } else if(key === 'roi'){
    var r = function(e, v){ return S.months.map(function(_, k){ return S.pct(e[k], v[k]); }); };
    cfg = { type:'line', data:{ labels:S.months, datasets:[
      line('Unit Trust ROI %', r(S.utE, S.utI), INV_COL.ut, true), line('Stock ROI %', r(S.stE, S.stI), INV_COL.stk, true), line('Gold ROI %', r(S.gdE, S.gdI), INV_COL.gld, true) ] },
      options:{ interaction:{ mode:'index', intersect:false }, plugins:{ legend:invLegend(), tooltip:invTip({ label:function(c){ return ' ' + c.dataset.label + ': ' + c.parsed.y + '%'; } }) },
        scales:invAxes(function(v){ return v + '%'; }) } };
  } else if(key === 'evi'){
    cfg = { type:'bar', data:{ labels:S.months, datasets:[ bar('Total invested', S.totI, '#38bdf8'), bar('Total earned', S.totE, INV_COL.tot) ] },
      options:{ plugins:{ legend:invLegend(), tooltip:invTip({ label:fmtTip }) }, scales:invAxes() } };
  } else {
    var d = S.totE.map(function(v, k){ return k === 0 ? 0 : v - S.totE[k - 1]; });
    cfg = { type:'bar', data:{ labels:S.months, datasets:[{ label:'Earnings change', data:d,
      backgroundColor:d.map(function(v){ return v >= 0 ? 'rgba(0,255,136,.35)' : 'rgba(255,77,141,.3)'; }),
      borderColor:d.map(function(v){ return v >= 0 ? INV_COL.up : INV_COL.dn; }), borderWidth:1.5, borderRadius:6 }] },
      options:{ plugins:{ legend:{ display:false }, tooltip:invTip({ label:function(c){ return ' ' + (c.parsed.y >= 0 ? '▲ +' : '▼ −') + invFmt(c.parsed.y); } }) },
        scales:invAxes(function(v){ return (v >= 0 ? '+' : '') + invK(v); }) } };
  }
  invChart('perf', 'invPerfCanvas', cfg);
}

invBuildTabs();
</script>

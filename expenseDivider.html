<!-- ═══════════════════════════════════════════════════════════
     EXPENSE DIVIDER — textarea input + copyable table output
═══════════════════════════════════════════════════════════════ -->
<style>
/* ═══════════════════════════════════════════
   EXPENSE DIVIDER — Bank Balances Design
═══════════════════════════════════════════ */
.ed-page{padding:14px;max-width:800px;margin:0 auto;width:100%;font-family:'Inter',system-ui,sans-serif;}
.ed-page .pg-corner-title{margin-bottom:10px;}

/* ── Inputs ── */
.ed-field{margin-bottom:12px;display:flex;flex-direction:column;gap:4px;}
.ed-label{font-size:.52em;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;color:rgba(255,255,255,.35);}
.ed-input-wrap{display:flex;align-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:9px;padding:0 10px;gap:5px;transition:border-color .2s,box-shadow .2s;height:34px;}
.ed-input-wrap:focus-within{border-color:rgba(99,102,241,.5);box-shadow:0 0 0 2px rgba(99,102,241,.1);}
.ed-input{background:transparent;border:none;color:#fff;font-family:'Inter',sans-serif;font-size:.78em;font-weight:600;outline:none;width:100%;padding:0;letter-spacing:.2px;}
.ed-input::placeholder{color:rgba(255,255,255,.15);}

.ed-textarea-wrap{display:flex;align-items:flex-start;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:9px;padding:6px 10px;transition:border-color .2s,box-shadow .2s;}
.ed-textarea-wrap:focus-within{border-color:rgba(99,102,241,.5);box-shadow:0 0 0 2px rgba(99,102,241,.1);}
.ed-textarea{background:transparent;border:none;color:#fff;font-family:'Consolas','Courier New',monospace;font-size:.72em;outline:none;width:100%;resize:vertical;min-height:90px;line-height:1.6;padding:0;}
.ed-textarea::placeholder{color:rgba(255,255,255,.15);}

/* ── Percentage row ── */
.ed-pct-row{display:flex;gap:12px;margin-bottom:16px;}
.ed-pct-row .ed-field{flex:1;}

/* ── Section titles ── */
.ed-section-title{font-size:.52em;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.3);margin:18px 0 10px;display:flex;align-items:center;gap:6px;}

/* ── Calc button ── */
.ed-calc-btn{width:100%;padding:11px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.85);font-size:.78em;font-weight:700;font-family:inherit;cursor:pointer;transition:all .25s ease;box-shadow:0 4px 15px rgba(0,0,0,.2);margin-bottom:16px;text-transform:uppercase;letter-spacing:.5px;}
.ed-calc-btn:hover{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.35);}

/* ── Payer rows ── */
.ed-payer-item{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
.ed-payer-item .ed-input-wrap{flex:1;}
.ed-payer-item .ed-input-wrap.ed-pay-amt-wrap{max-width:110px;}
.ed-rm-btn{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.25);color:#fca5a5;width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:.7em;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.ed-rm-btn:hover{background:rgba(239,68,68,.3);}
.ed-add-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:9px;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.12);color:rgba(255,255,255,.45);font-size:.7em;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;margin-top:4px;}
.ed-add-btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.2);}

/* ── Sponsor grid ── */
.ed-sponsor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
@media(max-width:480px){.ed-sponsor-grid{grid-template-columns:1fr;}}

/* ── Result card ── */
.ed-result{background:rgba(255,255,255,.032);border:1px solid rgba(255,255,255,.06);border-radius:16px;overflow:hidden;animation:fadeUp .3s ease both;position:relative;}
.ed-result::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#6366f1;box-shadow:2px 0 10px #6366f1;opacity:.7;}
.ed-result-title{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06);font-size:.65em;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.35);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,rgba(99,102,241,.07) 0%,transparent 100%);}
.ed-copy-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.5);border-radius:7px;padding:4px 10px;font-size:.85em;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:4px;}
.ed-copy-btn:hover{color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);}
.ed-copy-btn.copied{background:rgba(16,185,129,.2);border-color:rgba(16,185,129,.4);color:#34d399;}
.ed-copy-row{display:flex;gap:6px;}

/* ── Result table ── */
.ed-tbl{width:100%;border-collapse:collapse;font-size:.72em;font-family:'Inter',sans-serif;}
.ed-tbl th{padding:10px 12px;text-align:left;font-weight:700;color:rgba(255,255,255,.3);font-size:9px;text-transform:uppercase;letter-spacing:1px;background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;}
.ed-tbl td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top;line-height:1.5;}
.ed-tbl tr:last-child td{border-bottom:none;}
.ed-tbl tr:hover{background:rgba(255,255,255,.02);}
.ed-tbl td:first-child{font-weight:700;color:#fff;white-space:nowrap;}
.ed-tbl td:nth-child(2){color:rgba(255,255,255,.7);}
.ed-tbl td:nth-child(3){color:rgba(255,255,255,.5);font-size:.9em;text-align:center;}
.ed-tbl td:nth-child(4),
.ed-tbl td:nth-child(5),
.ed-tbl td:nth-child(6),
.ed-tbl td:nth-child(7){font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;}
.ed-tbl td:nth-child(4){color:rgba(255,255,255,.65);}
.ed-tbl td:nth-child(5){color:var(--amber);}
.ed-tbl td:nth-child(6){color:var(--green);}
.ed-tbl td:nth-child(7){font-weight:700;}
.ed-tbl td.net-pos{color:var(--green)!important;}
.ed-tbl td.net-neg{color:#f87171!important;}

/* ── Summary chips ── */
.ed-summary{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05);}
.ed-sum-chip{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:5px 14px;font-size:.68em;display:flex;gap:6px;align-items:center;}
.ed-sum-chip .sc-lbl{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.3);font-weight:700;}
.ed-sum-chip .sc-val{font-weight:700;color:#fff;font-size:13px;}

/* ── Image container ── */
#ed-image-container img{max-width:100%;height:auto;display:block;border-radius:8px;box-shadow:0 2px 16px rgba(0,0,0,.25);}
#ed-image-container{border-radius:16px;border:1px solid rgba(255,255,255,.06);overflow:hidden;background:rgba(255,255,255,.032);padding:8px;margin-top:12px;transition:all .3s ease;}

/* ── Payer Detail footer ── */
.ed-payer-detail{background:rgba(255,255,255,.02);border-top:1px solid rgba(255,255,255,.04);padding:10px 16px;font-size:.65em;color:rgba(255,255,255,.35);display:flex;gap:14px;flex-wrap:wrap;}
.ed-payer-detail span{display:flex;align-items:center;gap:4px;}
.ed-payer-detail strong{color:rgba(255,255,255,.6);}
</style>

<div class="ed-page" id="ed-body">
  <div class="pg-corner-title" style="margin-bottom:4px;">
    <span class="pg-ct-icon">💰</span>
    <span class="pg-ct-text">Expense Divider</span>
  </div>

  <!-- Title -->
  <div class="ed-field">
    <label class="ed-label">Expense Title</label>
    <div class="ed-input-wrap">
      <input class="ed-input" id="ed-title" placeholder="e.g. Dinner at Cool Planet">
    </div>
  </div>

  <!-- Items textarea -->
  <div class="ed-field">
    <label class="ed-label">Items — one per line <span id="ed-mode-badge" onclick="edToggleInputMode()" style="cursor:pointer;background:rgba(99,102,241,.2);border:1px solid rgba(99,102,241,.3);border-radius:6px;padding:1px 8px;font-size:.85em;font-weight:600;color:#a5b4fc;text-transform:none;letter-spacing:0;">Item→Person</span></label>
    <div class="ed-textarea-wrap">
      <textarea class="ed-textarea" id="ed-items-input" oninput="edUpdateWhoPaidHint()" placeholder="Faluda(690)- Lithusan&#10;Rice(1590)- Pirathees,Sajee,Vasanth&#10;Kothu(1800)- Pirathees,Sajee,Vasanth&#10;Movie-NT(4250)- Pirathees,Sarma,Sajee,Vasant,Narthanan&#10;Melon-NT(330+330)- Sarma"></textarea>
    </div>
  </div>

  <!-- Tax & Discount -->
  <div class="ed-section-title">📊 Overall Adjustments</div>
  <div class="ed-pct-row">
    <div class="ed-field">
      <label class="ed-label">Tax (%)</label>
      <div class="ed-input-wrap">
        <input class="ed-input" id="ed-tax" type="number" step="0.01" min="0" placeholder="0" oninput="edUpdateWhoPaidHint()">
      </div>
    </div>
    <div class="ed-field">
      <label class="ed-label">Discount (%)</label>
      <div class="ed-input-wrap">
        <input class="ed-input" id="ed-disc" type="number" step="0.01" min="0" placeholder="0" oninput="edUpdateWhoPaidHint()">
      </div>
    </div>
  </div>

  <!-- Sponsor -->
  <div class="ed-section-title">💵 Sponsor</div>
  <div class="ed-sponsor-grid">
    <div class="ed-field" style="margin:0;">
      <label class="ed-label">Sponsor Names <span style="font-weight:400;text-transform:none;color:rgba(255,255,255,.2);">— name or name + reference</span></label>
      <div class="ed-input-wrap">
        <input class="ed-input" id="ed-sponsor-names" placeholder="e.g. John, Dany Birthday" oninput="edUpdateWhoPaidHint()">
      </div>
    </div>
    <div class="ed-field" style="margin:0;">
      <label class="ed-label">Sponsor Amounts <span style="font-weight:400;text-transform:none;color:rgba(255,255,255,.2);">— 100+200, math supported</span></label>
      <div class="ed-input-wrap">
        <input class="ed-input" id="ed-sponsor-amounts" type="text" inputmode="decimal" placeholder="e.g. 100+200" oninput="edShowEval(this);edUpdateWhoPaidHint()">
      </div>
    </div>
  </div>

  <!-- Who Paid — remaining after sponsor -->
  <div class="ed-section-title">💵 Who Paid <span style="font-weight:400;text-transform:none;color:rgba(255,255,255,.2);font-size:1em;">— <span id="ed-who-paid-hint">Gross − Sponsor</span></span></div>
  <div id="ed-payers-container"></div>
  <button class="ed-add-btn" onclick="edAddPayer()">+ Add Person Who Paid</button>

  <!-- Calculate -->
  <button class="ed-calc-btn" onclick="edCalculate()">🧮 Calculate Split</button>

  <!-- Result -->
  <div id="ed-result-area"></div>

  <!-- Rendered image appears here for right-click copy -->
  <div id="ed-image-container" style="display:none;">
    <div style="padding:8px 12px 6px;font-size:.6em;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:space-between;">
      <span>📸 Table Image — Right-click → Copy Image</span>
      <button class="ed-copy-btn" onclick="document.getElementById('ed-image-container').style.display='none';" style="font-size:.9em;">✕ Close</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   EXPENSE DIVIDER JS
═══════════════════════════════════════════ */
var _edPayerIdx = 0;
var _edInputMode = 'itemFirst';

function edToggleInputMode() {
  _edInputMode = (_edInputMode === 'itemFirst') ? 'personFirst' : 'itemFirst';
  var badge = document.getElementById('ed-mode-badge');
  if (badge) badge.textContent = (_edInputMode === 'itemFirst') ? 'Item→Person' : 'Person→Item';
  var ta = document.getElementById('ed-items-input');
  if (ta) {
    ta.placeholder = (_edInputMode === 'itemFirst')
      ? 'Faluda(690)- Lithusan\nRice(1590)- Pirathees,Sajee,Vasanth\nMovie-NT(4250)- Pirathees,Sarma'
      : 'Pirathees-Faluda(690),Movie-NT(4250)\nSajee-Rice(1590),Kothu(1800)';
  }
  edUpdateWhoPaidHint();
}

function edInit() {
  _edPayerIdx = 0;
  document.getElementById('ed-payers-container').innerHTML = '';
  document.getElementById('ed-sponsor-names').value = '';
  document.getElementById('ed-sponsor-amounts').value = '';
  document.getElementById('ed-result-area').innerHTML = '';
  document.getElementById('ed-title').value = '';
  document.getElementById('ed-items-input').value = '';
  document.getElementById('ed-tax').value = '';
  document.getElementById('ed-disc').value = '';
  edAddPayer();
}

function edAddPayer() {
  var idx = _edPayerIdx++;
  var div = document.createElement('div');
  div.className = 'ed-payer-item';
  div.id = 'ed-payer-' + idx;
  div.innerHTML =
    '<div class="ed-input-wrap"><input class="ed-input" id="ed-payer-name-' + idx + '" placeholder="Person name" oninput="edUpdateWhoPaidHint()"></div>' +
    '<div class="ed-input-wrap ed-pay-amt-wrap"><input class="ed-input" id="ed-payer-amt-' + idx + '" type="text" inputmode="decimal" placeholder="Amount" oninput="edShowEval(this);edUpdateWhoPaidHint()" onpaste="setTimeout(function(){edShowEval(document.getElementById(\'ed-payer-amt-' + idx + '\'));edUpdateWhoPaidHint();},10)"></div>' +
    '<button class="ed-rm-btn" onclick="edRemovePayer(' + idx + ')" title="Remove">✕</button>';
  document.getElementById('ed-payers-container').appendChild(div);
}

function edRemovePayer(idx) {
  var el = document.getElementById('ed-payer-' + idx);
  if (el) { el.remove(); edUpdateWhoPaidHint(); }
}

function edGetPayers() {
  var payers = [];
  var container = document.getElementById('ed-payers-container');
  var rows = container.querySelectorAll('.ed-payer-item');
  rows.forEach(function(row) {
    var nameInput = row.querySelector('.ed-input-wrap:first-child .ed-input');
    var amtInput = row.querySelector('.ed-pay-amt-wrap .ed-input');
    var name = (nameInput ? nameInput.value : '').trim();
    var amt = edEvalPrice(amtInput ? amtInput.value : '0');
    if (name || amt > 0) {
      payers.push({ name: name || 'Person', amount: amt });
    }
  });
  return payers;
}

function edGetSponsors() {
  var namesStr = document.getElementById('ed-sponsor-names').value.trim();
  var amtStr = document.getElementById('ed-sponsor-amounts').value.trim();
  var total = edEvalPrice(amtStr);
  var names = namesStr ? namesStr.split(',').map(function(s) {
    return s.trim();
  }).filter(function(s) {
    return s;
  }) : [];
  if (names.length === 0 && total > 0) names = ['Sponsor'];
  return { names: names, total: total };
}

function edUpdateWhoPaidHint() {
  var raw = document.getElementById('ed-items-input').value.trim();
  var items = edParseItems(raw);
  var taxPct = parseFloat(document.getElementById('ed-tax').value) || 0;
  var discPct = parseFloat(document.getElementById('ed-disc').value) || 0;
  var subtotal = 0, taxableSubtotal = 0;
  items.forEach(function(i) { subtotal += i.price; if (i.taxable && taxPct > 0) taxableSubtotal += i.price; });
  var total = Math.round(subtotal + taxableSubtotal * (taxPct / 100) - subtotal * (discPct / 100));
  var sponsorAmt = edEvalPrice(document.getElementById('ed-sponsor-amounts').value);
  var remaining = Math.max(0, total - sponsorAmt);
  var payers = edGetPayers();
  var totalPaid = 0;
  payers.forEach(function(p) { totalPaid += p.amount; });
  var hint = document.getElementById('ed-who-paid-hint');
  var hasSponsors = sponsorAmt > 0;
  var hasPayers = payers.length > 0;
  if (total > 0) {
    if (!hasSponsors && !hasPayers) {
      hint.innerHTML = '<span style="color:#f87171;font-size:1.15em;font-weight:700;">⚠️ Add Sponsor or Who Paid</span>';
    } else {
      var combined = sponsorAmt + totalPaid;
      if (Math.abs(combined - total) > 0.01) {
        hint.innerHTML = '<span style="color:#f87171;font-size:1.15em;font-weight:700;">⚠️ Sponsor+Paid ' + edFmt(combined) + ' ≠ Gross ' + edFmt(total) + '</span>';
      } else if (hasSponsors) {
        hint.innerHTML = '<span style="font-size:1.15em;font-weight:700;color:var(--green)">Remaining: ' + edFmt(remaining) + '</span> <span style="opacity:.5;font-size:.85em;">(Gross: ' + edFmt(total) + ' − Sponsor: ' + edFmt(sponsorAmt) + ')</span>';
      } else {
        hint.innerHTML = '<span style="font-size:1.15em;font-weight:700;">' + edFmt(total) + ' to split</span>';
      }
    }
  } else {
    hint.textContent = 'Gross − Sponsor';
  }
}

function edEvalPrice(str) {
  if (!str) return 0;
  str = str.replace(/^=\s*/, '');
  var parts = str.split('+');
  var total = 0;
  parts.forEach(function(p) { total += parseFloat(p.trim()) || 0; });
  return Math.round(total);
}

function edShowEval(input) {
  var val = input.value.trim();
  var wrap = input.closest('.ed-input-wrap');
  if (val.indexOf('+') !== -1) {
    var result = edEvalPrice(val);
    if (wrap) wrap.style.borderColor = 'rgba(16,185,129,.5)';
    input.title = '= ' + result;
  } else {
    if (wrap) wrap.style.borderColor = '';
    input.title = '';
  }
}

function edParseItems(text) {
  if (_edInputMode === 'personFirst') return edParsePersonFirst(text);
  return edParseItemFirst(text);
}

function edParseItemFirst(text) {
  var items = [];
  var lines = text.split('\n');
  lines.forEach(function(line) {
    line = line.trim();
    if (!line) return;
    // Format: ItemName(price)- person1,person2  OR  ItemName-NT(price)- person1,person2
    // Also supports math in price: ItemName(690+300)- person1,person2
    var match = line.match(/^(.+?)(-nt)?\s*\(([\d.+\s]+)\)\s*[-–—]\s*(.+)$/i);
    if (!match) match = line.match(/^(.+?)(-nt)?\s+([\d.+\s]+)\s*[-–—]\s*(.+)$/i);
    if (!match) return;
    var name = match[1].trim();
    var isNT = !!match[2];
    var price = edEvalPrice(match[3]);
    var personsStr = match[4].trim();
    var persons = personsStr ? personsStr.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; }) : [];
    if (name && price > 0 && persons.length > 0) {
      items.push({ name: name, price: price, persons: persons, taxable: !isNT });
    }
  });
  return items;
}

function edParsePersonFirst(text) {
  var items = [];
  var lines = text.split('\n');
  lines.forEach(function(line) {
    line = line.trim();
    if (!line) return;
    // Format: PersonName-Item1(price),Item2-NT(price)
    var match = line.match(/^(.+?)\s*[-–—]\s*(.+)$/);
    if (!match) return;
    var personName = match[1].trim();
    if (!personName) return;
    var itemsStr = match[2].trim();
    var parts = itemsStr.split(',');
    parts.forEach(function(part) {
      part = part.trim();
      if (!part) return;
      var m = part.match(/^(.+?)(-nt)?\s*\(([\d.+\s]+)\)\s*$/i);
      if (!m) return;
      var itemName = m[1].trim();
      var isNT = !!m[2];
      var price = edEvalPrice(m[3]);
      if (itemName && price > 0) {
        items.push({ name: itemName, price: price, persons: [personName], taxable: !isNT });
      }
    });
  });
  return items;
}

function edCalculate() {
  var title = document.getElementById('ed-title').value.trim() || 'Untitled';
  var taxPct = parseFloat(document.getElementById('ed-tax').value) || 0;
  var discPct = parseFloat(document.getElementById('ed-disc').value) || 0;
  var raw = document.getElementById('ed-items-input').value.trim();
  var items = edParseItems(raw);
  var sponsors = edGetSponsors();
  var payers = edGetPayers();

  if (items.length === 0) {
    document.getElementById('ed-result-area').innerHTML = '<div class="ed-result"><div style="padding:24px;text-align:center;line-height:1.8;color:rgba(255,255,255,.7);font-size:.82em;">⚠️ Add at least one valid item line.<br><span style="font-size:.85em;opacity:.6">Format: ItemName(price)- Person1, Person2  |  Add -NT for no tax  |  Supports 690+300 in price</span></div>';
    return;
  }

  // Calculate subtotals
  var subtotal = 0;
  var taxableSubtotal = 0;
  items.forEach(function(item) {
    subtotal += item.price;
    if (item.taxable) taxableSubtotal += item.price;
  });
  var nonTaxableSubtotal = subtotal - taxableSubtotal;

  // Apply tax (only on taxable items) and discount (on everything)
  var taxAmt = taxableSubtotal * (taxPct / 100);
  var discAmt = subtotal * (discPct / 100);
  var totalAfterAdjustments = Math.round(subtotal + taxAmt - discAmt);

  // Calculate each person's share per item (before adjustments)
  var personShares = {};
  var personTaxableShares = {};
  var personItems = {};
  var nameDisplay = {}; // lowercase key → display name (first occurrence wins)
  items.forEach(function(item) {
    if (item.persons.length === 0) return;
    var sharePerPerson = item.price / item.persons.length;
    item.persons.forEach(function(p) {
      var key = p.toLowerCase();
      if (!nameDisplay[key]) nameDisplay[key] = p;
      if (!personShares[key]) { personShares[key] = 0; personTaxableShares[key] = 0; personItems[key] = []; }
      personShares[key] += sharePerPerson;
      if (item.taxable) personTaxableShares[key] += sharePerPerson;
      personItems[key].push({ name: item.name, share: sharePerPerson, taxable: item.taxable });
    });
  });

  // Final owed after tax (on taxable items) and discount (on everything)
  var finalOwed = {};
  var allKeys = Object.keys(personShares);
  allKeys.forEach(function(k) {
    var taxableShare = personTaxableShares[k] || 0;
    var nonTaxableShare = personShares[k] - taxableShare;
    var shareAfterTax = Math.round(taxableShare * (1 + taxPct / 100) + nonTaxableShare);
    var shareAfterDisc = Math.round(shareAfterTax - personShares[k] * (discPct / 100));
    finalOwed[k] = shareAfterDisc;
  });

  // Sum Who Paid amounts
  var totalPaid = 0;
  payers.forEach(function(p) { totalPaid += Math.round(p.amount); });

  // Sponsor total
  var sponsorTotal = sponsors.total;
  var hasSponsors = sponsorTotal > 0;

  // Remaining to split = Gross - Sponsor
  var remainingAfterSponsor = Math.max(0, totalAfterAdjustments - sponsorTotal);

  // Validation: Sponsor + Who Paid = Gross
  var hasPayers = payers.length > 0;
  if (!hasSponsors && !hasPayers) {
    document.getElementById('ed-result-area').innerHTML = '<div class="ed-result"><div style="padding:24px;text-align:center;line-height:1.8;color:rgba(255,255,255,.7);font-size:.82em;">⚠️ <strong>Add Sponsor or Who Paid amounts</strong><br><span style="font-size:.85em;opacity:.6">Sponsor + Who Paid must equal Grand Total (' + edFmt(totalAfterAdjustments) + ')</span></div></div>';
    document.getElementById('ed-result-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return;
  }
  if (hasSponsors && hasPayers) {
    var combined = sponsorTotal + totalPaid;
    if (Math.abs(combined - totalAfterAdjustments) > 0.01) {
      var diff = combined - totalAfterAdjustments;
      var msg = '⚠️ <strong>Amount Mismatch!</strong><br><br>' +
        'Grand Total: <strong>' + edFmt(totalAfterAdjustments) + '</strong><br>' +
        'Sponsor: <strong>' + edFmt(sponsorTotal) + '</strong><br>' +
        'Who Paid: <strong>' + edFmt(totalPaid) + '</strong><br>' +
        'Sponsor + Who Paid: <strong>' + edFmt(combined) + '</strong><br>' +
        'Difference: <strong style="color:' + (diff > 0 ? 'var(--amber)' : 'var(--red)') + '">' + edFmt(Math.abs(diff)) + '</strong><br><br>' +
        (diff > 0
          ? 'Sponsor + Who Paid (<strong>' + edFmt(combined) + '</strong>) is <strong>more</strong> than Grand Total (<strong>' + edFmt(totalAfterAdjustments) + '</strong>) by <strong>' + edFmt(Math.abs(diff)) + '</strong>. Reduce something.'
          : 'Sponsor + Who Paid (<strong>' + edFmt(combined) + '</strong>) is <strong>less</strong> than Grand Total (<strong>' + edFmt(totalAfterAdjustments) + '</strong>) by <strong>' + edFmt(Math.abs(diff)) + '</strong>. Add more to Sponsor or Who Paid.');
      document.getElementById('ed-result-area').innerHTML = '<div class="ed-result"><div style="padding:24px;text-align:center;line-height:1.8;color:rgba(255,255,255,.7);font-size:.82em;">' + msg + '</div></div>';
      document.getElementById('ed-result-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return;
    }
  } else if (hasSponsors && !hasPayers) {
    // Only sponsor — sponsor must cover the whole gross
    if (Math.abs(sponsorTotal - totalAfterAdjustments) > 0.01) {
      var diff = sponsorTotal - totalAfterAdjustments;
      var msg = '⚠️ <strong>Amount Mismatch!</strong><br><br>' +
        'Grand Total: <strong>' + edFmt(totalAfterAdjustments) + '</strong><br>' +
        'Sponsor: <strong>' + edFmt(sponsorTotal) + '</strong><br>' +
        'Difference: <strong style="color:' + (diff > 0 ? 'var(--amber)' : 'var(--red)') + '">' + edFmt(Math.abs(diff)) + '</strong><br><br>' +
        (diff > 0
          ? 'Sponsor amount (<strong>' + edFmt(sponsorTotal) + '</strong>) exceeds Grand Total (<strong>' + edFmt(totalAfterAdjustments) + '</strong>). Reduce sponsor amount.'
          : 'Sponsor amount (<strong>' + edFmt(sponsorTotal) + '</strong>) is less than Grand Total (<strong>' + edFmt(totalAfterAdjustments) + '</strong>). Add Who Paid entries for the remaining ' + edFmt(Math.abs(diff)) + '.');
      document.getElementById('ed-result-area').innerHTML = '<div class="ed-result"><div style="padding:24px;text-align:center;line-height:1.8;color:rgba(255,255,255,.7);font-size:.82em;">' + msg + '</div></div>';
      document.getElementById('ed-result-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return;
    }
  } else if (!hasSponsors && hasPayers) {
    // Only Who Paid — must equal gross
    if (Math.abs(totalPaid - totalAfterAdjustments) > 0.01) {
      var diff = totalPaid - totalAfterAdjustments;
      var msg = '⚠️ <strong>Amount Mismatch!</strong><br><br>' +
        'Grand Total: <strong>' + edFmt(totalAfterAdjustments) + '</strong><br>' +
        'Who Paid Total: <strong>' + edFmt(totalPaid) + '</strong><br>' +
        'Difference: <strong style="color:' + (diff > 0 ? 'var(--amber)' : 'var(--red)') + '">' + edFmt(Math.abs(diff)) + '</strong><br><br>' +
        (diff > 0
          ? 'Who Paid total (<strong>' + edFmt(totalPaid) + '</strong>) exceeds Grand Total (<strong>' + edFmt(totalAfterAdjustments) + '</strong>). Reduce.'
          : 'Who Paid total (<strong>' + edFmt(totalPaid) + '</strong>) is less than Grand Total (<strong>' + edFmt(totalAfterAdjustments) + '</strong>). Add ' + edFmt(Math.abs(diff)) + ' more.');
      document.getElementById('ed-result-area').innerHTML = '<div class="ed-result"><div style="padding:24px;text-align:center;line-height:1.8;color:rgba(255,255,255,.7);font-size:.82em;">' + msg + '</div></div>';
      document.getElementById('ed-result-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      return;
    }
  }

  // Build result HTML
  var html = '<div class="ed-result">';
  html += '<div class="ed-result-title"><span>🧾 ' + title + ' — Summary</span><div class="ed-copy-row"><button class="ed-copy-btn" id="ed-copy-btn" onclick="edCopyTable(\'text\')">📋 Excel Table</button><button class="ed-copy-btn" id="ed-copy-img-btn" onclick="edCopyTable(\'image\')">📸 Screenshot</button></div></div>';

  // Summary chips
  html += '<div class="ed-summary">';
  html += '<div class="ed-sum-chip"><span class="sc-lbl">Subtotal</span><span class="sc-val">' + edFmt(subtotal) + '</span></div>';
  if (taxPct > 0) {
    if (nonTaxableSubtotal > 0) html += '<div class="ed-sum-chip"><span class="sc-lbl">Non-Taxable</span><span class="sc-val" style="color:var(--amber)">' + edFmt(nonTaxableSubtotal) + '</span></div>';
    if (taxableSubtotal > 0) html += '<div class="ed-sum-chip"><span class="sc-lbl">Taxable</span><span class="sc-val" style="color:var(--blue)">' + edFmt(taxableSubtotal) + '</span></div>';
  }
  if (taxPct > 0) html += '<div class="ed-sum-chip"><span class="sc-lbl">Tax</span><span class="sc-val" style="color:var(--amber)">+' + taxPct + '% (' + edFmt(taxAmt) + ')</span></div>';
  if (discPct > 0) html += '<div class="ed-sum-chip"><span class="sc-lbl">Discount</span><span class="sc-val" style="color:var(--green)">−' + discPct + '% (' + edFmt(discAmt) + ')</span></div>';
  html += '<div class="ed-sum-chip"><span class="sc-lbl">Total</span><span class="sc-val">' + edFmt(totalAfterAdjustments) + '</span></div>';
  if (hasSponsors) {
    html += '<div class="ed-sum-chip"><span class="sc-lbl">Sponsor</span><span class="sc-val" style="color:var(--blue)">' + edFmt(sponsorTotal) + '</span></div>';
    html += '<div class="ed-sum-chip"><span class="sc-lbl">To Split</span><span class="sc-val" style="color:var(--green)">' + edFmt(remainingAfterSponsor) + '</span></div>';
  }
  if (payers.length > 0) {
    html += '<div class="ed-sum-chip"><span class="sc-lbl">Who Paid</span><span class="sc-val" style="color:var(--amber)">' + edFmt(totalPaid) + '</span></div>';
  }
  html += '</div>';

  // Table
  if (allKeys.length === 0) {
    html += '<div style="padding:20px;text-align:center;color:rgba(255,255,255,.3);font-size:.78em;">No persons assigned to items</div>';
  } else {
    html += '<div style="overflow-x:auto;"><table class="ed-tbl" id="ed-results-table">';
    html += '<thead><tr>' +
      '<th>Name</th>' +
      '<th>Items Taken</th>' +
      '<th>Taxable</th>' +
      '<th>Price</th>' +
      '<th>After Tax</th>' +
      '<th>After Disc.</th>' +
      '<th>Final Owe/Own</th>' +
    '</tr></thead><tbody>';

    allKeys.sort(function(a, b) { return finalOwed[b] - finalOwed[a]; });
    allKeys.forEach(function(k) {
      var displayName = nameDisplay[k] || k;
      var shareBeforeTax = personShares[k];
      var taxableShare = personTaxableShares[k] || 0;
      var nonTaxableShare = shareBeforeTax - taxableShare;
      var shareAfterTax = Math.round(taxableShare * (1 + taxPct / 100) + nonTaxableShare);
      var shareAfterAll = Math.round(shareAfterTax - shareBeforeTax * (discPct / 100));

      // Their share of the remaining amount (Gross − Sponsor)
      var shareOfRemaining = remainingAfterSponsor > 0
        ? Math.round(finalOwed[k] / totalAfterAdjustments * remainingAfterSponsor)
        : 0;

      // How much this person paid in Who Paid section
      var paidByThis = 0;
      payers.forEach(function(payer) {
        if (payer.name.toLowerCase() === k) paidByThis += payer.amount;
      });

      // Net = what they paid − what they owe (their share of remaining)
      var net = paidByThis - shareOfRemaining;

      var itemStrs = personItems[k].map(function(i) {
        var tag = i.taxable ? '' : ' (NT)';
        return i.name + tag + ' (' + edFmt(i.share) + ')';
      });
      var itemsList = itemStrs.join(', ');

      var applyTax = taxPct > 0;
      var hasTaxable = applyTax && personItems[k].some(function(i) { return i.taxable; });
      var hasNonTaxable = !applyTax || personItems[k].some(function(i) { return !i.taxable; });
      var taxableLabel = applyTax ? (hasTaxable && hasNonTaxable ? '🔄 Mixed' : (hasTaxable ? '✅ Yes' : '❌ No')) : '❌ No';

      var netClass = net >= 0 ? 'net-pos' : 'net-neg';
      var netLabel = (net >= 0 ? 'Gets back ' : 'Owes ') + edFmt(Math.abs(net));

      html += '<tr>' +
        '<td>' + displayName + '</td>' +
        '<td>' + itemsList + '</td>' +
        '<td>' + taxableLabel + '</td>' +
        '<td>' + edFmt(shareBeforeTax) + '</td>' +
        '<td>' + edFmt(shareAfterTax) + '</td>' +
        '<td>' + edFmt(shareAfterAll) + '</td>' +
        '<td class="' + netClass + '">' + netLabel + '</td>' +
      '</tr>';
    });

    html += '</tbody></table></div>';
  }

  // Bottom detail — Sponsor + Who Paid
  var hasPayers = payers.length > 0;
  if (hasSponsors || hasPayers) {
    html += '<div class="ed-payer-detail">';
    if (hasSponsors) {
      sponsors.names.forEach(function(name) {
        html += '<span>🏅 <strong>' + name + '</strong> sponsored ' + edFmt(Math.round(sponsorTotal / sponsors.names.length)) + '</span>';
      });
    }
    if (hasPayers) {
      payers.forEach(function(payer) {
        html += '<span>💵 <strong>' + payer.name + '</strong> paid ' + edFmt(payer.amount) + '</span>';
      });
    }
    if (hasSponsors) {
      html += '<span style="margin-left:auto;color:var(--blue);font-weight:700;">Gross: ' + edFmt(totalAfterAdjustments) + ' − Sponsor: ' + edFmt(sponsorTotal) + ' = Split: ' + edFmt(remainingAfterSponsor) + '</span>';
    } else {
      html += '<span style="margin-left:auto;color:var(--green);font-weight:700;">Total: ' + edFmt(totalAfterAdjustments) + ' = Split: ' + edFmt(totalAfterAdjustments) + '</span>';
    }
    html += '</div>';
  }

  html += '</div>';
  document.getElementById('ed-result-area').innerHTML = html;
  document.getElementById('ed-result-area').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function edCopyTable(mode) {
  if (mode === 'image') {
    edCopyAsImage();
    return;
  }
  // Excel/TSV mode — put both HTML (for Excel) and plain text on clipboard
  var table = document.getElementById('ed-results-table');
  if (!table) return;

  // Build TSV
  var rows = table.querySelectorAll('tr');
  var tsv = '';
  var htmlRows = [];
  rows.forEach(function(row) {
    var cells = row.querySelectorAll('th, td');
    var vals = [];
    var htmlCells = [];
    cells.forEach(function(cell) {
      var txt = cell.textContent.replace(/[🟢🔴]/g,'').trim();
      vals.push(txt);
      var tag = cell.tagName === 'TH' ? 'th' : 'td';
      var bold = cell.tagName === 'TH' ? 'font-weight:bold;background:#f0f0f0;' : '';
      htmlCells.push('<' + tag + ' style="padding:4px 8px;border:1px solid #ccc;font-family:Calibri,sans-serif;font-size:11px;' + bold + '">' + txt + '</' + tag + '>');
    });
    tsv += vals.join('\t') + '\n';
    htmlRows.push('<tr>' + htmlCells.join('') + '</tr>');
  });

  var htmlStr = '<table style="border-collapse:collapse;">' + htmlRows.join('') + '</table>';

  // Put both formats on clipboard — Excel will pick up the HTML version
  try {
    var htmlBlob = new Blob([htmlStr], { type: 'text/html' });
    var textBlob = new Blob([tsv], { type: 'text/plain' });
    var clipboardItem = new ClipboardItem({
      'text/html': htmlBlob,
      'text/plain': textBlob
    });
    navigator.clipboard.write([clipboardItem]).then(function() {
      edShowCopied('ed-copy-btn', '📋 Copy Text');
    }).catch(function() {
      // Fallback to TSV only
      edCopyToClipboard(tsv);
    });
  } catch(e) {
    edCopyToClipboard(tsv);
  }
}

    { label: 'Taxable', val: chipData['Taxable'] || null, color: '#60a5fa' },
    { label: 'Tax', val: chipData['Tax'] || null, color: '#fbbf24' },
    { label: 'Discount', val: chipData['Discount'] || null, color: '#34d399' },
    { label: 'Total', val: chipData['Total'] || '—', color: '#e2e8f0', bold: true },

    { label: 'To Split', val: chipData['To Split'] || null, color: '#34d399', bold: true },
    { label: 'Who Paid', val: chipData['Who Paid'] || null, color: '#fbbf24', bold: true }
  ];
  summaryItems.forEach(function(item) {
    if (item.val === null) return;
    var chip = document.createElement('div');
    chip.style.cssText = 'background:rgba(255,255,255,.04);border-radius:10px;padding:6px 16px;border:1px solid rgba(255,255,255,.08);text-align:center;';

  inner.appendChild(sumBar);

  // ── SPONSOR / WHO PAID BAR ──
  if (payerStrs.length > 0) {
    var paidBar = document.createElement('div');
    paidBar.style.cssText = 'padding:8px 24px;background:rgba(99,102,241,.06);border-bottom:1px solid rgba(255,255,255,.06);font-size:12px;color:rgba(255,255,255,.6);display:flex;gap:18px;flex-wrap:wrap;';
    // Separate sponsor (🏅) from payer (💵) entries
    var sponsorItems = [], payerItems = [];
    payerStrs.forEach(function(s) {
      if (s.indexOf('🏅') !== -1) sponsorItems.push(s);
      else payerItems.push(s);
    });
    if (sponsorItems.length > 0) {
      paidBar.innerHTML += '<span style="font-weight:700;color:rgba(255,255,255,.4);margin-right:4px;">🏅 Sponsor:</span> ';
      sponsorItems.forEach(function(s, i) {
        var sp = document.createElement('span');
        sp.style.cssText = 'font-weight:600;color:#a5b4fc;';
        sp.textContent = s.replace('🏅','').trim();
        if (i < sponsorItems.length - 1) paidBar.innerHTML += sp.outerHTML + '<span style="color:rgba(255,255,255,.15);"> | </span>';
        else paidBar.innerHTML += sp.outerHTML;
      });

      if (sponsorItems.length > 0) paidBar.innerHTML += '<span style="color:rgba(255,255,255,.15);margin:0 4px;">•</span>';
      paidBar.innerHTML += '<span style="font-weight:700;color:rgba(255,255,255,.4);margin-right:4px;">💵 Paid By:</span> ';
      payerItems.forEach(function(s, i) {

        sp.style.cssText = 'font-weight:600;color:#fbbf24;';
        sp.textContent = s.replace('💵','').trim();
        if (i < payerItems.length - 1) paidBar.innerHTML += sp.outerHTML + '<span style="color:rgba(255,255,255,.15);"> | </span>';

    var cells = tr.querySelectorAll('td');
    cells.forEach(function(td, i) {
      var dc = document.createElement('td');
      var txt = td.textContent.replace(/[🟢🔴✅❌🔄]/g,'').trim();
      // Clean up Mixed/Yes/No labels for image

      if (i === 2) {
        if (rawTxt.indexOf('Mixed') !== -1) txt = 'Mixed';
        else if (rawTxt.indexOf('Yes') !== -1) txt = 'Yes';
        else txt = 'No';
      }
      dc.textContent = txt;
      var extra = '';
      if (i === 2) extra += 'text-align:center;font-size:11px;';
      else if (i >= 3) extra += 'text-align:right;font-weight:600;';
      if (i === 6) {
        if (txt.indexOf('Gets') !== -1) { extra += 'color:#34d399;'; dc.style.fontWeight = '700'; }
        else if (txt.indexOf('Owes') !== -1) { extra += 'color:#f87171;'; dc.style.fontWeight = '700'; }
        else extra += 'color:rgba(255,255,255,.7);';
      }
      dc.style.cssText = 'padding:7px 12px;border:1px solid rgba(255,255,255,.06);color:rgba(255,255,255,.7);font-size:12px;' + extra + ';vertical-align:middle;';
      if (i === 0) dc.style.fontWeight = '700';
      if (i === 0) dc.style.color = '#e2e8f0';
      if (i === 1) dc.style.color = 'rgba(255,255,255,.55)';
      r.appendChild(dc);
    });
    tbody.appendChild(r);
  });
  tbl.appendChild(tbody);

  var totalVal = chipData['Total'] || '—';
  var tFoot = document.createElement('div');

  tFoot.innerHTML = 'Grand Total: ' + totalVal;

  inner.appendChild(tblContainer);

  // ── FOOTER ──
  var footer = document.createElement('div');
  footer.style.cssText = 'background:rgba(0,0,0,.2);padding:10px 24px;font-size:10px;color:rgba(255,255,255,.25);text-align:center;border-top:1px solid rgba(255,255,255,.05);';
  footer.textContent = 'Generated by ptsManage Expense Divider';
  inner.appendChild(footer);

  wrapper.appendChild(inner);
  document.body.appendChild(wrapper);

  // ── Loading indicator ──
  var imgContainer = document.getElementById('ed-image-container');
  if (imgContainer) {
    imgContainer.innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,.3);font-size:.78em;">⏳ Rendering image…</div>';
    imgContainer.style.display = 'block';
  }

  // ── Load html2canvas & capture ──
  if (typeof html2canvas === 'undefined') {
    var script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    script.onload = function() { setTimeout(function() { edCaptureTable(wrapper); }, 150); };
    document.head.appendChild(script);
  } else {
    setTimeout(function() { edCaptureTable(wrapper); }, 150);
  }
}

function edCaptureTable(wrapper) {
  html2canvas(wrapper, {
    scale: 2,
    backgroundColor: '#0d1220',
    useCORS: true,
    logging: false,
    width: wrapper.scrollWidth,
    height: wrapper.scrollHeight
  }).then(function(canvas) {
    document.body.removeChild(wrapper);
    var imgContainer = document.getElementById('ed-image-container');
    if (imgContainer) {
      var img = document.createElement('img');
      img.src = canvas.toDataURL('image/png');
      img.alt = 'Expense Split Table';
      img.style.cssText = 'max-width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.15);';
      imgContainer.innerHTML = '';
      imgContainer.appendChild(img);
      imgContainer.style.display = 'block';
    }
    edShowCopied('ed-copy-img-btn', '📸 Screenshot');
  }).catch(function() {
    document.body.removeChild(wrapper);
    var imgContainer = document.getElementById('ed-image-container');
    if (imgContainer) {
      imgContainer.innerHTML = '<div style="padding:20px;text-align:center;color:rgba(255,255,255,.3);font-size:.78em;">⚠️ Failed to render image</div>';
    }
  });
}

function edCopyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() {
      edShowCopied('ed-copy-btn', '📋 Copy Text');
    }).catch(function() {
      edFallbackCopy(text);
    });
  } else {
    edFallbackCopy(text);
  }
}

function edShowCopied(btnId, origLabel) {
  var btn = document.getElementById(btnId);
  if (!btn) return;
  btn.textContent = '✅ Copied!';
  btn.classList.add('copied');
  setTimeout(function() {
    var label = btnId === 'ed-copy-img-btn' ? '📸 Screenshot' : '📋 Excel Table';
    btn.innerHTML = label;
    btn.classList.remove('copied');
  }, 2000);
}

function edFallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    // Show copied on all copy buttons
    var btns = document.querySelectorAll('.ed-copy-btn');
    btns.forEach(function(btn) {
      btn.textContent = '✅ Copied!';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.innerHTML = btn.id === 'ed-copy-img-btn' ? '📸 Screenshot' : '📋 Excel Table';
        btn.classList.remove('copied');
      }, 2000);
    });
  } catch(e) {}
  document.body.removeChild(ta);
}

function edFmt(v) {
  if (v === undefined || v === null || isNaN(v)) return '—';
  return '₨ ' + v.toLocaleString('en-IN', {minimumFractionDigits: 0, maximumFractionDigits: 0});
}
</script>

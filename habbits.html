<!-- ═══════════════════════════════════
     HABBITS TRACKER
     Junk Food & Drink monthly heatmap
═══════════════════════════════════════ -->
<style>
:root {
  --hb-card:  rgba(30, 41, 59, 0.4);
  --hb-bdr:   rgba(255, 255, 255, 0.08);
  --hb-amber: #f59e0b;
  --hb-red:   #ff4d6d;
  --hb-blue:  #38bdf8;
  --hb-purple:#c084fc;
  --hb-mint:  #4ade80;
  --hb-cream: #f1f5f9;
  --hb-dim:   #94a3b8;
  --hb-amber-glow:  rgba(245,158,11,.35);
  --hb-blue-glow:   rgba(56,189,248,.35);
  --hb-purple-glow: rgba(192,132,252,.3);
}
.hb-wrap{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--hb-cream);
  width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;}

/* ── Header ── */
.hb-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;background:rgba(15,23,42,.5);backdrop-filter:blur(8px);}
.hb-hdr-l{display:flex;align-items:center;gap:10px;min-width:0;}
.hb-hdr-icon{font-size:1.3em;flex-shrink:0;}
.hb-hdr-title{font-size:.7em;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  background:linear-gradient(135deg,#f59e0b,#ff4d6d);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  white-space:nowrap;}
.hb-hdr-sub{font-size:.52em;color:var(--hb-dim);font-weight:600;white-space:nowrap;}
.hb-nav{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.hb-nav-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:8px;color:var(--hb-dim);width:30px;height:30px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:.72em;}
.hb-nav-btn:hover{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.18);}
.hb-nav-lbl{font-size:.65em;font-weight:700;color:rgba(255,255,255,.6);
  min-width:85px;text-align:center;letter-spacing:.3px;}

/* ── Scroll area ── */
.hb-scroll{flex:1;overflow-y:auto;padding:18px 18px 10px;
  scrollbar-width:none;-ms-overflow-style:none;}
.hb-scroll::-webkit-scrollbar{display:none;}

/* ── Glass card (matches smoking tracker) ── */
.hb-glass{background:var(--hb-card);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border:1px solid var(--hb-bdr);
  border-radius:18px;margin-bottom:14px;padding:18px;
  box-shadow:0 8px 32px rgba(0,0,0,.2);position:relative;overflow:hidden;}
.hb-glass::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
  pointer-events:none;}

/* ── Stats grid ── */
.hb-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:0;}
.hb-stat{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);
  border-radius:13px;padding:14px 12px;display:flex;flex-direction:column;gap:3px;
  position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .2s,box-shadow .2s;}
.hb-stat:hover{transform:translateY(-3px);box-shadow:0 6px 24px rgba(0,0,0,.3),
  inset 0 1px 0 rgba(255,255,255,.06);}
.hb-stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  pointer-events:none;}
.hb-stat.junk::before{background:linear-gradient(135deg,#f59e0b,#fbbf24);}
.hb-stat.drink::before{background:linear-gradient(135deg,#ff4d6d,#ff6b8a);}
.hb-stat.days::before{background:linear-gradient(135deg,#4ade80,#2dd4bf);}
.hb-stat.clean::before{background:linear-gradient(135deg,#38bdf8,#818cf8);}
.hb-stat-val{font-size:1.25em;font-weight:900;letter-spacing:-.5px;line-height:1.2;}
.hb-stat-lbl{font-size:.48em;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:rgba(255,255,255,.35);}
.hb-stat-emoji{position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-size:1.8em;opacity:.12;pointer-events:none;}

/* ── Section header ── */
.hb-sec-hdr{font-size:.55em;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:rgba(255,255,255,.25);margin:6px 0 12px;display:flex;align-items:center;gap:10px;}
.hb-sec-hdr::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05);}

/* ── HEATMAP ── */
.hb-heatmap{padding:0;}
.hm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.hm-day-label{font-size:.45em;font-weight:700;text-transform:uppercase;
  color:rgba(255,255,255,.15);text-align:center;padding:3px 0;letter-spacing:.5px;}

/* Cell wrapper: padding-bottom ensures PERFECT square cells, same size always */
.hm-cell-wrap{position:relative;width:100%;padding-bottom:100%;}
.hm-cell{position:absolute;inset:0;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:.7em;font-weight:800;
  transition:all .2s;border:1px solid transparent;cursor:default;line-height:1;
  background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.06);
  color:rgba(255,255,255,.2);}
.hm-cell.empty{background:transparent;border-color:transparent;color:transparent;}
.hm-cell.hm-junk{background:rgba(245,158,11,.18);border-color:rgba(245,158,11,.3);
  color:#fbbf24;box-shadow:0 0 10px rgba(245,158,11,.12);}
.hm-cell.hm-drink{background:rgba(255,77,109,.15);border-color:rgba(255,77,109,.3);
  color:#ff6b8a;box-shadow:0 0 10px rgba(255,77,109,.1);}
.hm-cell.hm-both{
  background:linear-gradient(135deg,rgba(245,158,11,.22),rgba(255,77,109,.22));
  border-color:rgba(255,77,109,.35);color:#ffb3c1;
  box-shadow:0 0 14px rgba(255,77,109,.12);}
.hm-cell.today{
  box-shadow:0 0 0 2px rgba(255,77,109,.5),0 0 16px rgba(255,77,109,.2) !important;
  z-index:1;}
.hm-cell:hover{transform:scale(1.08);z-index:2;}
.hm-cell .hm-num{pointer-events:none;line-height:1;}

/* ── Legend ── */
.hb-legend{display:flex;gap:16px;flex-wrap:wrap;padding:6px 0 2px;justify-content:center;}
.hb-leg-item{display:flex;align-items:center;gap:6px;font-size:.5em;font-weight:600;
  color:var(--hb-dim);}
.hb-leg-dot{width:9px;height:9px;border-radius:3px;display:inline-block;}

/* ── Daily list ── */
.hb-list{padding:0;}
.hb-list-title{font-size:.52em;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,255,255,.3);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.hb-list-title::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05);}
.hb-list-empty{text-align:center;padding:18px;color:var(--hb-dim);font-size:.7em;}
.hb-list-item{display:flex;align-items:center;gap:12px;padding:8px 10px;
  border-radius:10px;transition:background .15s;
  border-bottom:1px solid rgba(255,255,255,.03);}
.hb-list-item:last-child{border-bottom:none;}
.hb-list-item:hover{background:rgba(255,255,255,.035);}
.hb-li-day{font-size:.68em;font-weight:700;color:rgba(255,255,255,.4);min-width:26px;
  text-align:center;}
.hb-li-ico{font-size:.95em;flex-shrink:0;}
.hb-li-label{font-size:.64em;font-weight:600;color:rgba(255,255,255,.65);flex:1;min-width:0;}
.hb-li-amt{font-size:.6em;font-weight:700;color:var(--hb-dim);white-space:nowrap;}

/* ── Loading / Error ── */
.hb-loading{text-align:center;padding:40px 16px;color:var(--hb-dim);font-size:.72em;}
.hb-error{text-align:center;padding:40px 16px;color:var(--hb-red);font-size:.72em;}

/* ═══════════════════════════════════
   RESPONSIVE - screen-size dynamic
═══════════════════════════════════════ */

/* Small laptop / wide tablet */
@media(max-width:820px){
  .hb-scroll{padding:14px 12px 8px;}
  .hb-glass{padding:14px;border-radius:16px;}
  .hb-stat{padding:12px 10px;}
  .hb-stat-val{font-size:1.1em;}
  .hm-cell{border-radius:6px;font-size:.62em;}
  .hb-hdr{padding:12px 14px;}
  .hb-hdr-title{font-size:.65em;}
  .hb-nav-lbl{min-width:75px;font-size:.6em;}
}

/* Tablet */
@media(max-width:640px){
  .hb-stats{grid-template-columns:repeat(2,1fr);gap:8px;}
  .hb-scroll{padding:12px 10px 6px;}
  .hb-glass{padding:12px;border-radius:14px;margin-bottom:10px;}
  .hm-cell{border-radius:5px;font-size:.55em;}
  .hm-grid{gap:3px;}
  .hb-hdr{padding:10px 12px;}
  .hb-hdr-title{font-size:.6em;}
  .hb-hdr-sub{display:none;}
  .hb-nav-lbl{min-width:70px;font-size:.55em;}
  .hb-nav-btn{width:26px;height:26px;font-size:.65em;}
}

/* iPhone 15 Pro Max / large phones (430px) */
@media(max-width:500px){
  .hb-glass{padding:10px;border-radius:12px;margin-bottom:8px;}
  .hb-stat{padding:10px 8px;border-radius:11px;}
  .hb-stat-val{font-size:.95em;}
  .hb-stat-lbl{font-size:.42em;letter-spacing:.8px;}
  .hb-stat-emoji{font-size:1.4em;}
  .hm-cell{border-radius:4px;font-size:.48em;}
  .hm-grid{gap:2px;}
  .hm-day-label{font-size:.34em;letter-spacing:.2px;}
  .hb-list-item{padding:6px 8px;gap:8px;}
  .hb-li-day{font-size:.6em;min-width:22px;}
  .hb-li-label{font-size:.58em;}
  .hb-li-amt{font-size:.55em;}
  .hb-nav-btn{width:24px;height:24px;font-size:.6em;}
  .hb-nav-lbl{min-width:60px;font-size:.5em;}
  .hb-legend{gap:6px;flex-wrap:wrap;}
  .hb-leg-item{font-size:.4em;gap:4px;}
  .hb-leg-dot{width:6px;height:6px;}
}

/* Small phone */
@media(max-width:380px){
  .hb-stat{padding:8px 6px;}
  .hb-stat-val{font-size:.85em;}
  .hb-stat-lbl{font-size:.38em;}
  .hm-cell{border-radius:3px;font-size:.42em;}
  .hb-nav-btn{width:22px;height:22px;}
}
</style>

<div class="hb-wrap">
  <div class="hb-hdr">
    <div class="hb-hdr-l">
      <span class="hb-hdr-icon">🎯</span>
      <span class="hb-hdr-title">Habit Tracker</span>
      <span class="hb-hdr-sub">Junk Food · Drinks</span>
    </div>
    <div class="hb-nav">
      <button class="hb-nav-btn" onclick="hbNav(-1)">◀</button>
      <span class="hb-nav-lbl" id="hbMonthLbl">—</span>
      <button class="hb-nav-btn" onclick="hbNav(1)">▶</button>
    </div>
  </div>
  <div class="hb-scroll" id="hbScroll">
    <div class="hb-loading">
      <div style="font-size:2em;margin-bottom:8px;">⏳</div>
      Loading habits…
    </div>
  </div>
</div>

<script>
/* ── State ── */
var _hbMonth = new Date().getMonth() + 1;
var _hbYear  = new Date().getFullYear();
var _hbData  = null;
var _dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var _monthNames = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ── Navigation ── */
function hbNav(dir){
  _hbMonth += dir;
  if(_hbMonth < 1){_hbMonth = 12; _hbYear--;}
  if(_hbMonth > 12){_hbMonth = 1; _hbYear++;}
  hbLoad();
}

/* ── Load data ── */
function hbLoad(){
  document.getElementById('hbMonthLbl').textContent = _monthNames[_hbMonth] + ' ' + _hbYear;
  document.getElementById('hbScroll').innerHTML =
    '<div class="hb-loading"><div style="font-size:2em;margin-bottom:8px;">⏳</div>Loading habits…</div>';
  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.success){
        _hbData = res;
        hbRender(res);
      } else {
        document.getElementById('hbScroll').innerHTML =
          '<div class="hb-error">⚠ '+(res?res.error:'Failed')+'</div>';
      }
    })
    .withFailureHandler(function(){
      document.getElementById('hbScroll').innerHTML =
        '<div class="hb-error">⚠ Error loading data</div>';
    })
    .getHabbitsData(_hbMonth, _hbYear);
}

/* ── Render ── */
function hbRender(d){
  var month = d.month, year = d.year;
  var junkDays = d.junkDays || [];
  var drinkDays = d.drinkDays || [];

  // Build lookup maps
  var junkMap = {}, drinkMap = {};
  junkDays.forEach(function(e){ junkMap[e.day] = (junkMap[e.day]||0) + e.amount; });
  drinkDays.forEach(function(e){ drinkMap[e.day] = (drinkMap[e.day]||0) + e.amount; });

  var daysInMonth = new Date(year, month, 0).getDate();
  var firstDow = new Date(year, month - 1, 1).getDay(); // 0=Sun
  var today = new Date();
  var todayD = (today.getMonth()+1 === month && today.getFullYear() === year) ? today.getDate() : 0;

  // Stats
  var junkCount = junkDays.length;
  var drinkCount = drinkDays.length;
  var junkDaysSet = {};
  junkDays.forEach(function(e){ junkDaysSet[e.day]=true; });
  var bothCount = 0;
  Object.keys(junkDaysSet).forEach(function(dd){
    if(drinkMap[parseInt(dd)]) bothCount++;
  });
  // Clean days = days in month minus any day that has junk OR drink
  var allHabitSet = {};
  junkDays.forEach(function(e){ allHabitSet[e.day]=true; });
  drinkDays.forEach(function(e){ allHabitSet[e.day]=true; });
  var cleanCount = daysInMonth - Object.keys(allHabitSet).length;

  var html = '';

  // ── Stats ──
  html += '<div class="hb-glass" style="padding:16px;"><div class="hb-stats">'+
    '<div class="hb-stat junk"><div class="hb-stat-val" style="color:#f59e0b;">'+junkCount+'</div><div class="hb-stat-lbl">🍔 Junk Days</div><span class="hb-stat-emoji">🍔</span></div>'+
    '<div class="hb-stat drink"><div class="hb-stat-val" style="color:#ff4d6d;">'+drinkCount+'</div><div class="hb-stat-lbl">🍺 Drink Days</div><span class="hb-stat-emoji">🍺</span></div>'+
    '<div class="hb-stat days"><div class="hb-stat-val" style="color:#4ade80;">'+daysInMonth+'</div><div class="hb-stat-lbl">📅 Month Days</div><span class="hb-stat-emoji">📅</span></div>'+
    '<div class="hb-stat clean"><div class="hb-stat-val" style="color:#38bdf8;">'+cleanCount+'</div><div class="hb-stat-lbl">✨ Clean Days</div><span class="hb-stat-emoji">✨</span></div>'+
    '</div></div>';

  // ── Heatmap ──
  html += '<div class="hb-glass"><div class="hb-heatmap"><div class="hb-sec-hdr"><span>📊</span>Monthly Habit Calendar</div><div class="hm-grid">';

  // Day labels
  for(var w=0;w<7;w++) html += '<div class="hm-day-label">'+_dayNames[w].substring(0,2)+'</div>';

  // Empty cells before first day
  for(var e=0;e<firstDow;e++) html += '<div class="hm-cell-wrap"><div class="hm-cell empty"></div></div>';

  // Day cells
  for(var d=1;d<=daysInMonth;d++){
    var isJunk = !!junkMap[d];
    var isDrink = !!drinkMap[d];
    var isToday = (d === todayD);
    var cls = 'hm-cell';
    if(!isJunk && !isDrink){ cls += ' day'; }
    else if(isJunk && isDrink){ cls += ' hm-both'; }
    else if(isJunk){ cls += ' hm-junk'; }
    else if(isDrink){ cls += ' hm-drink'; }
    if(isToday) cls += ' today';
    html += '<div class="hm-cell-wrap"><div class="'+cls+'"><span class="hm-num">'+d+'</span></div></div>';
  }

  html += '</div>';

  // ── Legend ──
  html += '<div class="hb-legend">'+
    '<div class="hb-leg-item"><span class="hb-leg-dot" style="background:rgba(245,158,11,.3);border:1px solid rgba(245,158,11,.4)"></span>Junk Food</div>'+
    '<div class="hb-leg-item"><span class="hb-leg-dot" style="background:rgba(255,77,109,.3);border:1px solid rgba(255,77,109,.4)"></span>Drink</div>'+
    '<div class="hb-leg-item"><span class="hb-leg-dot" style="background:linear-gradient(135deg,rgba(245,158,11,.3),rgba(255,77,109,.3));border:1px solid rgba(255,77,109,.4)"></span>Both</div>'+
    '</div>';

  html += '</div></div>'; // end heatmap glass

  // ── Daily list (Junk) ──
  if(junkDays.length){
    var jSorted = junkDays.slice().sort(function(a,b){return a.day-b.day;});
    html += '<div class="hb-glass"><div class="hb-list"><div class="hb-list-title"><span>🍔</span>Junk Food Days</div>';
    jSorted.forEach(function(e){
      html += '<div class="hb-list-item">'+
        '<span class="hb-li-day">'+e.day+'</span>'+
        '<span class="hb-li-ico">🍔</span>'+
        '<span class="hb-li-label">'+(e.ref||'Junk Food')+'</span>'+
        '<span class="hb-li-amt">₨ '+Math.round(e.amount).toLocaleString()+'</span>'+
        '</div>';
    });
    html += '</div>';
  }

  // ── Daily list (Drink) ──
  if(drinkDays.length){
    var dSorted = drinkDays.slice().sort(function(a,b){return a.day-b.day;});
    html += '<div class="hb-glass"><div class="hb-list"><div class="hb-list-title"><span>🍺</span>Drink Days</div>';
    dSorted.forEach(function(e){
      html += '<div class="hb-list-item">'+
        '<span class="hb-li-day">'+e.day+'</span>'+
        '<span class="hb-li-ico">🍺</span>'+
        '<span class="hb-li-label">'+(e.ref||'Drink')+'</span>'+
        '<span class="hb-li-amt">₨ '+Math.round(e.amount).toLocaleString()+'</span>'+
        '</div>';
    });
    html += '</div>';
  }

  document.getElementById('hbScroll').innerHTML = html;
}

/* ── Auto-load on include ── */
(function(){ hbLoad(); })();
</script>

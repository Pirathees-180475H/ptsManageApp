<!-- ═══════════════════════════════════════════════════════════════
     TOOL WHEEL  —  GTA / RDR2 style radial selector
     ───────────────────────────────────────────────────────────
     Desktop : hover a trigger → wheel blooms open centred on it,
               point in a direction to highlight, click to fire.
     Mobile  : tap a trigger → wheel springs open, tap a wedge
               (or drag out from the trigger and release on one).

     Any number of wheels can share the engine. Register a provider:

       toolWheelRegister('cards', function(){
         return { title:'CARDS', rich:true, items:[
           { ico:'💳', name:'AMEX', sub:'₨ 84,200', sub2:'due in 6d',
             color:'#006fcf', live:true, run:function(){ … } }
         ]};
       });

     …then point a trigger at it:  <button class="tw-trigger"
                                       data-tw-wheel="cards">

     Item fields: ico, name, sub, sub2, color, desc,
                  run (fn) | fn (global name), live (bool|fn|{sel,cls}),
                  disabled.

     Included from render.html via:  <?!= include('toolWheel'); ?>
     Hides the old .pg-hdr-* emoji buttons (they stay in the DOM so
     every existing *-active class hook keeps working untouched).
═══════════════════════════════════════════════════════════════ -->
<style>
/* ── Hide the legacy header emoji strip (DOM kept for active-state hooks) ── */
.pg-hdr-actions .pg-money-btn,
.pg-hdr-actions .pg-tracker-btn,
.pg-hdr-actions .pg-docs-btn,
.pg-hdr-actions .pg-cal-btn,
.pg-hdr-actions .pg-calc-btn,
.pg-hdr-actions .pg-divider-btn{ display:none !important; }

/* ── Trigger button ── */
.tw-trigger{
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.14);
  color:rgba(255,255,255,.72);
  border-radius:10px;
  width:38px;height:30px;
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;position:relative;
  transition:background .18s,border-color .18s,color .18s,transform .12s;
  -webkit-tap-highlight-color:transparent;
}
.tw-trigger svg{width:19px;height:19px;transition:transform .45s cubic-bezier(.34,1.4,.64,1);}
.tw-trigger:hover{background:rgba(168,85,247,.16);border-color:rgba(168,85,247,.45);color:#c084fc;}
.tw-trigger:hover svg{transform:rotate(60deg);}
.tw-trigger:active{transform:scale(.9);}
.tw-trigger.tw-open{background:rgba(168,85,247,.3);border-color:rgba(168,85,247,.7);color:#d8b4fe;}
.tw-trigger.tw-open svg{transform:rotate(180deg);}

/* card-flavoured trigger */
.tw-trigger.tw-cards:hover{background:rgba(0,212,255,.16);border-color:rgba(0,212,255,.45);color:#67e8f9;}
.tw-trigger.tw-cards:hover svg{transform:rotate(0deg) scale(1.12);}
.tw-trigger.tw-cards.tw-open{background:rgba(0,212,255,.3);border-color:rgba(0,212,255,.7);color:#a5f3fc;}
.tw-trigger.tw-cards.tw-open svg{transform:rotate(0deg) scale(1.12);}

/* pulsing dot when something behind this wheel is live */
.tw-trigger.tw-live::after{
  content:'';position:absolute;top:-3px;right:-3px;
  width:6px;height:6px;border-radius:50%;background:#00e676;
  box-shadow:0 0 7px rgba(0,230,118,.9);
  animation:twLive 1.6s ease-in-out infinite;
}
@keyframes twLive{0%,100%{opacity:1}50%{opacity:.25}}

/* ── Backdrop ── */
#tw-bg{
  position:fixed;inset:0;z-index:10050;
  display:none;
  background:radial-gradient(ellipse at var(--tw-cx,50%) var(--tw-cy,50%),
             rgba(8,12,24,.55) 0%, rgba(3,5,12,.88) 60%);
  opacity:0;
  transition:opacity .22s ease;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}
#tw-bg.tw-on{display:block;opacity:1;}
/* the RDR "dead-eye" desaturation of everything behind the wheel */
#tw-bg.tw-on{ backdrop-filter:blur(7px) saturate(.35) brightness(.7);
              -webkit-backdrop-filter:blur(7px) saturate(.35) brightness(.7); }

/* ── Wheel ── */
#tw-wheel{
  position:fixed;
  width:var(--tw-size,420px);height:var(--tw-size,420px);
  transform:translate(-50%,-50%) scale(.55);
  opacity:0;
  transition:transform .26s cubic-bezier(.34,1.56,.64,1), opacity .18s ease;
  will-change:transform,opacity;
}
#tw-bg.tw-on #tw-wheel{ transform:translate(-50%,-50%) scale(1); opacity:1; }
#tw-wheel svg{width:100%;height:100%;overflow:visible;display:block;}

.tw-seg{ cursor:pointer; transition:transform .17s cubic-bezier(.34,1.56,.64,1); }
.tw-seg.tw-disabled{ cursor:default; opacity:.35; }
.tw-seg-shape{
  transition:fill .15s ease, stroke .15s ease, filter .15s ease;
  stroke-width:1.5;
}
.tw-seg-ico{
  font-size:36px;text-anchor:middle;dominant-baseline:central;
  pointer-events:none;user-select:none;
  transition:font-size .17s cubic-bezier(.34,1.56,.64,1);
}
.tw-seg-lbl{
  font-size:11.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
  text-anchor:middle;dominant-baseline:central;
  pointer-events:none;user-select:none;
  fill:rgba(255,255,255,.42);
  transition:fill .15s ease;
}
.tw-seg-sub{
  font-size:13.5px;font-weight:800;letter-spacing:-.2px;
  text-anchor:middle;dominant-baseline:central;
  pointer-events:none;user-select:none;
  transition:fill .15s ease, opacity .15s ease;
  opacity:.82;
}
.tw-seg-sub2{
  font-size:9.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  text-anchor:middle;dominant-baseline:central;
  pointer-events:none;user-select:none;
  fill:rgba(255,255,255,.34);
  transition:fill .15s ease;
}
.tw-seg.tw-hot .tw-seg-ico{ font-size:44px; }
.tw-seg.tw-hot .tw-seg-lbl{ fill:#fff; }
.tw-seg.tw-hot .tw-seg-sub{ opacity:1; }
.tw-seg.tw-hot .tw-seg-sub2{ fill:rgba(255,255,255,.6); }
.tw-rich .tw-seg-ico{ font-size:27px; }
.tw-rich .tw-seg.tw-hot .tw-seg-ico{ font-size:33px; }
.tw-seg-key{
  font-size:9.5px;font-weight:800;text-anchor:middle;dominant-baseline:central;
  fill:rgba(255,255,255,.22);pointer-events:none;user-select:none;
}
.tw-seg.tw-hot .tw-seg-key{ fill:rgba(255,255,255,.5); }
/* live pip = that wedge's thing is currently open / settled */
.tw-seg-live{ opacity:0; transition:opacity .2s; }
.tw-seg.tw-active .tw-seg-live{ opacity:1; }

/* ── Centre hub ── */
#tw-hub{
  position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:38%;text-align:center;pointer-events:none;user-select:none;
}
#tw-hub-name{
  font-size:14px;font-weight:900;letter-spacing:1.6px;text-transform:uppercase;
  color:#fff;line-height:1.15;
  text-shadow:0 2px 14px rgba(0,0,0,.9);
  transition:color .15s ease;
}
#tw-hub-desc{
  margin-top:6px;
  font-size:10.5px;font-weight:600;letter-spacing:.3px;
  color:rgba(255,255,255,.42);line-height:1.3;
}
#tw-hub.tw-idle #tw-hub-name{ color:rgba(255,255,255,.3); font-size:12px; letter-spacing:2.4px; }

/* ── Hint strip ── */
#tw-hint{
  position:fixed;left:50%;bottom:calc(var(--nav-h,58px) + 14px);
  transform:translateX(-50%) translateY(8px);
  display:flex;align-items:center;gap:14px;
  padding:7px 15px;border-radius:999px;
  background:rgba(10,15,28,.75);border:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
  color:rgba(255,255,255,.35);white-space:nowrap;
  opacity:0;transition:opacity .3s ease .12s, transform .3s ease .12s;
  pointer-events:none;
}
#tw-bg.tw-on #tw-hint{ opacity:1; transform:translateX(-50%) translateY(0); }
#tw-hint kbd{
  display:inline-block;padding:2px 6px;margin-right:5px;
  border-radius:5px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.6);font-family:inherit;font-size:9px;
}

@media(max-width:768px){
  #tw-wheel{ --tw-size:min(88vw,370px); }
  .tw-seg-ico{ font-size:31px; }
  .tw-seg.tw-hot .tw-seg-ico{ font-size:38px; }
  .tw-seg-lbl{ font-size:10.5px;letter-spacing:.9px; }
  .tw-seg-sub{ font-size:12.5px; }
  .tw-seg-key{ display:none; }
  #tw-hub-name{ font-size:12.5px; }
  #tw-hub-desc{ font-size:9.5px; }
  #tw-hint{ font-size:9px;gap:10px;padding:6px 12px; }
  .tw-trigger{ width:40px;height:32px; }
}
@media(prefers-reduced-motion:reduce){
  #tw-wheel,.tw-seg,.tw-seg-ico,#tw-bg{ transition-duration:.01ms !important; }
  .tw-trigger svg{ transition:none; }
  .tw-trigger.tw-live::after{ animation:none; }
}
</style>

<!-- ── Wheel overlay ── -->
<div id="tw-bg">
  <div id="tw-wheel">
    <svg id="tw-svg" viewBox="0 0 400 400" aria-hidden="true"></svg>
    <div id="tw-hub" class="tw-idle">
      <div id="tw-hub-name">Tools</div>
      <div id="tw-hub-desc"></div>
    </div>
  </div>
  <div id="tw-hint">
    <span><kbd>1-6</kbd>select</span>
    <span><kbd>esc</kbd>close</span>
  </div>
</div>

<script>
(function(){
  'use strict';

  var buzz = function(k){ if(typeof window.haptic === 'function') window.haptic(k); };

  /* ═══ Wheel registry ═══════════════════════════════════════
     A provider returns { title, rich, items } (or just an items
     array) and is re-run on every open, so wedges always show
     current numbers.                                          */
  var WHEELS = {};
  function register(key, provider){ WHEELS[key] = provider; }

  /* ── The default tools wheel. Order runs clockwise from 12 o'clock. ──
     `live` marks the wedge with a green pip when that tool is open.   */
  var TOOLS = [
    { ico:'📋', name:'Tracker',    desc:'Subs · budget · notes', fn:'trackerToggle', color:'#3b82f6',
      live:{ sel:'.pg-tracker-btn', cls:'tracker-active' } },
    { ico:'📂', name:'Docs',       desc:'Document vault',        fn:'docsToggle',    color:'#cbd5e1',
      live:{ sel:'.pg-docs-btn',    cls:'docs-active' } },
    { ico:'📅', name:'Calendar',   desc:'Dates & heatmap',       fn:'calToggle',     color:'#00d4ff',
      live:{ sel:'.pg-cal-btn',     cls:'cal-active' } },
    { ico:'🧮', name:'Calculator', desc:'Quick maths',           fn:'calcToggle',    color:'#a855f7',
      live:{ sel:'.pg-calc-btn',    cls:'calc-active' } },
    { ico:'⚖️', name:'Divider',    desc:'Split an expense',      fn:'edToggle',      color:'#fbbf24',
      live:{ sel:'#ed-overlay',     cls:'open' } },
    { ico:'🤝', name:'Splitwise',   desc:'Net position & month',  fn:'swToggle',      color:'#00d4ff',
      live:{ sel:'#sw-modal',       cls:'open' } }
  ];
  register('tools', function(){
    return { title:'Tools', rich:false, items:TOOLS };
  });

  /* ═══ Geometry ═════════════════════════════════════════════
     Two bands: the plain one (icon + one label) and the "rich"
     one, which pulls the icon inward to make room for a value
     and a sub-line stacked beneath the name.                  */
  var GEO_PLAIN = { R_IN:78, R_OUT:183, R_ICO:126, R_TXT:158, R_KEY:96,  LINE:0  };
  /* Rich wedges usually carry no icon (the card wheel only shows one to flag
     an urgent card), so the text block sits centred in the band rather than
     pushed outward to clear a glyph that is not there. */
  var GEO_RICH  = { R_IN:72, R_OUT:190, R_ICO:92,  R_TXT:126, R_KEY:88,  LINE:15 };

  var CX = 200, CY = 200;
  var GAP = 1.7;              // degrees trimmed off each side of a wedge

  var bg, wheel, svg, hub, hubName, hubDesc, hint;
  var items   = [];           // the wedge set currently rendered
  var segEls  = [];
  var geo     = GEO_PLAIN;
  var N       = 0;
  var SPAN    = 60;
  var sig     = '';           // signature of the rendered wedge set
  var title   = 'Tools';
  var needFit = false;        // labels want measuring (only possible once visible)

  var open    = false;
  var hot     = -1;           // highlighted index
  var armed   = false;        // pointer has entered the wheel at least once
  var openedAt= 0;
  var pointer = 'mouse';
  var anchor  = null;
  var hoverTimer = null;
  var cx = 0, cy = 0;         // wheel centre in viewport px

  /* ── Geometry helpers ─────────────────────────────────── */
  function pt(r, deg){
    var a = deg * Math.PI / 180;
    return [ CX + r * Math.cos(a), CY + r * Math.sin(a) ];
  }
  // wedge i is centred on -90 + i*SPAN → index 0 always points straight up
  function midAngle(i){ return -90 + i * SPAN; }

  function wedgePath(i){
    var a0 = midAngle(i) - SPAN/2 + GAP;
    var a1 = midAngle(i) + SPAN/2 - GAP;
    var big = (a1 - a0) > 180 ? 1 : 0;
    var o0 = pt(geo.R_OUT, a0), o1 = pt(geo.R_OUT, a1);
    var i1 = pt(geo.R_IN,  a1), i0 = pt(geo.R_IN,  a0);
    return 'M' + o0[0].toFixed(2) + ',' + o0[1].toFixed(2) +
           'A' + geo.R_OUT + ',' + geo.R_OUT + ' 0 ' + big + ' 1 ' + o1[0].toFixed(2) + ',' + o1[1].toFixed(2) +
           'L' + i1[0].toFixed(2) + ',' + i1[1].toFixed(2) +
           'A' + geo.R_IN  + ',' + geo.R_IN  + ' 0 ' + big + ' 0 ' + i0[0].toFixed(2) + ',' + i0[1].toFixed(2) +
           'Z';
  }

  var NS = 'http://www.w3.org/2000/svg';
  function mk(tag, attrs){
    var el = document.createElementNS(NS, tag);
    for(var k in attrs) if(attrs.hasOwnProperty(k)) el.setAttribute(k, attrs[k]);
    return el;
  }

  /* ── (Re)build the wedges for the current item set ────── */
  function build(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    segEls = [];

    N    = items.length;
    SPAN = 360 / N;

    wheel.classList.toggle('tw-rich', geo === GEO_RICH);

    // faint outer hoop so the wheel reads as a single object
    svg.appendChild(mk('circle', { cx:CX, cy:CY, r:geo.R_OUT + 7, fill:'none',
                                   stroke:'rgba(255,255,255,.055)', 'stroke-width':1 }));
    // hub disc
    svg.appendChild(mk('circle', { cx:CX, cy:CY, r:geo.R_IN - 9, fill:'rgba(6,11,24,.82)',
                                   stroke:'rgba(255,255,255,.09)', 'stroke-width':1 }));

    items.forEach(function(t, i){
      var g = mk('g', { 'class':'tw-seg' + (t.disabled ? ' tw-disabled' : '') });

      var shape = mk('path', { 'class':'tw-seg-shape', d:wedgePath(i) });
      g.appendChild(shape);

      var ip = pt(geo.R_ICO, midAngle(i));
      var ico = mk('text', { 'class':'tw-seg-ico', x:ip[0].toFixed(2), y:ip[1].toFixed(2) });
      ico.textContent = t.ico || '';
      g.appendChild(ico);

      // text block: lines stack downward in SCREEN space from the anchor,
      // which stays legible in every direction (unlike stacking radially)
      var tp   = pt(geo.R_TXT, midAngle(i));
      var line = geo.LINE;
      var y    = tp[1];
      var hasSub = (t.sub !== undefined && t.sub !== null && t.sub !== '');
      if(hasSub) y -= line * 0.55;   // recentre the block on the anchor

      var lbl = mk('text', { 'class':'tw-seg-lbl', x:tp[0].toFixed(2), y:y.toFixed(2) });
      lbl.textContent = t.name || '';
      g.appendChild(lbl);

      if(hasSub){
        var sub = mk('text', { 'class':'tw-seg-sub', x:tp[0].toFixed(2), y:(y + line).toFixed(2),
                               fill:t.color || '#fff' });
        sub.textContent = t.sub;
        g.appendChild(sub);
        if(t.sub2){
          var sub2 = mk('text', { 'class':'tw-seg-sub2', x:tp[0].toFixed(2),
                                  y:(y + line * 2 - 2).toFixed(2) });
          sub2.textContent = t.sub2;
          g.appendChild(sub2);
        }
      }

      var kp = mk('text', { 'class':'tw-seg-key', x:pt(geo.R_KEY, midAngle(i))[0].toFixed(2),
                                                 y:pt(geo.R_KEY, midAngle(i))[1].toFixed(2) });
      kp.textContent = (i + 1);
      g.appendChild(kp);

      var dp = pt(geo.R_OUT - 14, midAngle(i));
      g.appendChild(mk('circle', { 'class':'tw-seg-live', cx:dp[0].toFixed(2), cy:dp[1].toFixed(2),
                                   r:3.2, fill:'#00e676' }));

      g.addEventListener('click', function(e){ e.stopPropagation(); fire(i); });
      g.addEventListener('mouseenter', function(){ if(pointer === 'mouse') setHot(i); });

      svg.appendChild(g);
      segEls.push({ g:g, shape:shape });
    });

    // keyboard hint reflects the actual wedge count
    var kb = hint && hint.querySelector('kbd');
    if(kb) kb.textContent = N > 1 ? ('1-' + N) : '1';

    needFit = true;
    paint();
  }

  /* ── Keep every label inside its wedge ─────────────────
     A horizontal label on a diagonal wedge runs almost radially,
     so a long one ("Calculator") can overshoot the outer arc.
     Measure once the wheel is visible and squeeze anything that
     would spill. Needs a rendered element, hence not in build(). */
  function fitText(){
    if(!needFit) return;
    needFit = false;
    var lim = geo.R_OUT - 9;
    for(var i = 0; i < segEls.length; i++){
      var a  = pt(geo.R_TXT, midAngle(i));
      var ax = a[0] - CX, ay = a[1] - CY;
      // widest |dx| from the anchor that still sits inside the outer arc
      var span = Math.sqrt(Math.max(0, lim*lim - ay*ay)) - Math.abs(ax);
      var allow = Math.max(24, span * 2);
      var texts = segEls[i].g.querySelectorAll('.tw-seg-lbl,.tw-seg-sub,.tw-seg-sub2');
      for(var t = 0; t < texts.length; t++){
        var el = texts[t];
        el.removeAttribute('textLength');
        var w = 0;
        try { w = el.getComputedTextLength(); } catch(e){ w = 0; }
        if(w > allow && allow > 0){
          el.setAttribute('textLength', allow.toFixed(1));
          el.setAttribute('lengthAdjust', 'spacingAndGlyphs');
        }
      }
    }
  }

  /* ── Paint wedge colours for the current `hot` ────────── */
  function paint(){
    items.forEach(function(t, i){
      var s = segEls[i]; if(!s) return;
      var on = (i === hot);
      var c  = t.color || '#a855f7';
      s.shape.setAttribute('fill',   on ? hexA(c, .26) : 'rgba(255,255,255,.035)');
      s.shape.setAttribute('stroke', on ? hexA(c, .85) : 'rgba(255,255,255,.07)');
      s.shape.style.filter = on ? 'drop-shadow(0 0 14px ' + hexA(c, .45) + ')' : 'none';
      s.g.classList.toggle('tw-hot', on);
      if(on){
        var p = pt(9, midAngle(i));              // nudge the hot wedge outward
        s.g.setAttribute('transform', 'translate(' + (p[0]-CX).toFixed(2) + ',' + (p[1]-CY).toFixed(2) + ')');
      } else {
        s.g.removeAttribute('transform');
      }
    });

    if(hot < 0){
      hub.classList.add('tw-idle');
      hubName.textContent = title;
      hubName.style.color = '';
      hubDesc.textContent = pointer === 'touch' ? 'Tap a wedge' : 'Point to choose';
    } else {
      hub.classList.remove('tw-idle');
      hubName.textContent = items[hot].name || '';
      hubName.style.color = items[hot].color || '';
      hubDesc.textContent = items[hot].desc || items[hot].sub2 || '';
    }
  }

  function hexA(hex, a){
    var h = String(hex).replace('#','');
    if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return 'rgba(' + parseInt(h.slice(0,2),16) + ',' +
                     parseInt(h.slice(2,4),16) + ',' +
                     parseInt(h.slice(4,6),16) + ',' + a + ')';
  }

  function setHot(i){
    if(i === hot) return;
    hot = i;
    if(i >= 0) buzz('tick');        // the detent — one tick per crossing
    paint();
  }

  /* ── Live pips ────────────────────────────────────────── */
  function isLive(t){
    if(!t || t.live === undefined || t.live === null) return false;
    if(typeof t.live === 'boolean')  return t.live;
    if(typeof t.live === 'function'){ try { return !!t.live(); } catch(e){ return false; } }
    var el = document.querySelector(t.live.sel);
    return !!(el && el.classList.contains(t.live.cls));
  }
  function refreshLive(){
    items.forEach(function(t, i){
      if(segEls[i]) segEls[i].g.classList.toggle('tw-active', isLive(t));
    });
  }
  function refreshTriggers(){
    document.querySelectorAll('.tw-trigger').forEach(function(b){
      var key  = b.getAttribute('data-tw-wheel') || 'tools';
      var spec = resolve(key);
      var any  = false;
      if(spec){
        // a wheel may define its own trigger-pip meaning; otherwise the pip
        // lights when any single wedge is live
        if(typeof spec.live === 'function'){ try { any = !!spec.live(); } catch(e){ any = false; } }
        else any = spec.items.some(isLive);
      }
      b.classList.toggle('tw-live', !!any);
    });
  }

  /* ── Pointer → wedge index ────────────────────────────── */
  function indexAt(x, y){
    var dx = x - cx, dy = y - cy;
    var dist  = Math.sqrt(dx*dx + dy*dy);
    var scale = (wheel.offsetWidth || 400) / 400;   // offsetWidth ignores the scale() transform
    if(dist < geo.R_IN * scale * 0.92)   return -1; // dead zone
    if(dist > (geo.R_OUT + 55) * scale)  return -2; // outside → close signal
    var deg = Math.atan2(dy, dx) * 180 / Math.PI;   // 0° = east
    var t = (deg + 90 + SPAN/2 + 720) % 360;        // rotate so wedge 0 starts at 0
    return Math.floor(t / SPAN) % N;
  }

  /* ── Resolve a registered wheel ───────────────────────── */
  function resolve(key){
    var provider = WHEELS[key];
    if(!provider) return null;
    var spec;
    try { spec = provider(); } catch(e){ console.error('[toolWheel] provider "' + key + '"', e); return null; }
    if(!spec) return null;
    if(Object.prototype.toString.call(spec) === '[object Array]') spec = { items:spec };
    if(!spec.items || !spec.items.length) return null;
    spec.title = spec.title || 'Tools';
    spec.rich  = !!spec.rich || spec.items.some(function(t){ return t.sub; });
    return spec;
  }

  /* ── Open / close / fire ──────────────────────────────── */
  function place(el){
    var size = wheel.offsetWidth || 420;
    var pad  = size / 2 + 10;
    if(el){
      var r = el.getBoundingClientRect();
      cx = r.left + r.width / 2;
      cy = r.top  + r.height / 2;
    } else {
      cx = innerWidth / 2;
      cy = innerHeight / 2;
    }
    cx = Math.max(pad, Math.min(innerWidth  - pad, cx));   // keep it all on screen
    cy = Math.max(pad, Math.min(innerHeight - pad, cy));
    wheel.style.left = cx + 'px';
    wheel.style.top  = cy + 'px';
    bg.style.setProperty('--tw-cx', cx + 'px');
    bg.style.setProperty('--tw-cy', cy + 'px');
  }

  function openWheel(el, via, key){
    if(open) return;
    var spec = resolve(key || 'tools');
    if(!spec){
      // nothing to show — shake the trigger rather than opening an empty wheel
      if(el){ el.style.transition='transform .07s'; var n=0;
              var iv=setInterval(function(){ el.style.transform='translateX('+(n%2?-3:3)+'px)';
                if(++n>5){ clearInterval(iv); el.style.transform=''; el.style.transition=''; } }, 55); }
      buzz('warn');
      return;
    }

    items = spec.items;
    title = spec.title;
    geo   = spec.rich ? GEO_RICH : GEO_PLAIN;

    open     = true;
    pointer  = via || 'mouse';
    anchor   = el || null;
    armed    = false;
    hot      = -1;
    openedAt = Date.now();

    // visible first — getComputedTextLength() reads 0 on a display:none tree
    bg.style.display = 'block';

    var newSig = spec.rich + '|' + items.map(function(t){
      return [t.name, t.sub, t.sub2, t.color].join('');
    }).join('');
    if(newSig !== sig){ sig = newSig; build(); }

    place(el);
    refreshLive();
    paint();
    fitText();
    void bg.offsetWidth;            // force reflow so the scale-in actually runs
    bg.classList.add('tw-on');
    if(el) el.classList.add('tw-open');
    buzz('open');
  }

  function closeWheel(){
    if(!open) return;
    open = false;
    bg.classList.remove('tw-on');
    document.querySelectorAll('.tw-trigger').forEach(function(b){ b.classList.remove('tw-open'); });
    hot = -1;
    setTimeout(function(){ if(!open) bg.style.display = 'none'; }, 240);
  }

  function fire(i){
    if(i < 0 || i >= items.length) return;
    var t = items[i];
    if(t.disabled){ buzz('warn'); return; }
    setHot(i);
    buzz('select');
    closeWheel();
    setTimeout(function(){
      try {
        if(typeof t.run === 'function')      t.run();
        else if(typeof window[t.fn] === 'function') window[t.fn]();
        else console.warn('[toolWheel] ' + t.fn + '() not available on this page');
      } catch(err){ console.error('[toolWheel] firing "' + t.name + '"', err); }
      setTimeout(function(){ refreshLive(); refreshTriggers(); }, 350);
    }, 120);
  }

  /* ── Global pointer handling ──────────────────────────── */
  function onMove(x, y){
    if(!open) return;
    var i = indexAt(x, y);
    if(i === -2){
      // pointer left the wheel entirely — only auto-close on mouse, and only
      // once it has actually been inside (so a hover-open never snaps shut)
      if(pointer === 'mouse' && armed && Date.now() - openedAt > 260) closeWheel();
      return;
    }
    armed = true;
    setHot(i);
  }

  function triggerOf(e){
    var t = e.target;
    return (t && t.closest) ? t.closest('.tw-trigger') : null;
  }
  function keyOf(el){ return el.getAttribute('data-tw-wheel') || 'tools'; }

  function init(){
    bg      = document.getElementById('tw-bg');
    wheel   = document.getElementById('tw-wheel');
    svg     = document.getElementById('tw-svg');
    hub     = document.getElementById('tw-hub');
    hubName = document.getElementById('tw-hub-name');
    hubDesc = document.getElementById('tw-hub-desc');
    hint    = document.getElementById('tw-hint');
    if(!bg || !svg) return;

    /* Triggers — delegated, so headers rendered later still work */
    document.addEventListener('mouseover', function(e){
      var t = triggerOf(e);
      if(!t || open) return;
      clearTimeout(hoverTimer);
      hoverTimer = setTimeout(function(){ openWheel(t, 'mouse', keyOf(t)); }, 140);
    });
    document.addEventListener('mouseout', function(e){
      if(triggerOf(e)) clearTimeout(hoverTimer);
    });
    document.addEventListener('click', function(e){
      var t = triggerOf(e);
      if(!t) return;
      e.preventDefault();
      clearTimeout(hoverTimer);
      if(open) closeWheel(); else openWheel(t, 'mouse', keyOf(t));
    });
    // touch: open on finger-down, and support drag-to-select
    document.addEventListener('touchstart', function(e){
      var t = triggerOf(e);
      if(!t) return;
      e.preventDefault();          // also suppresses the synthetic click
      clearTimeout(hoverTimer);
      if(open) closeWheel(); else openWheel(t, 'touch', keyOf(t));
    }, { passive:false });

    document.addEventListener('mousemove', function(e){
      if(open && pointer === 'mouse') onMove(e.clientX, e.clientY);
    });
    document.addEventListener('touchmove', function(e){
      if(!open) return;
      var tt = e.touches[0];
      if(tt) onMove(tt.clientX, tt.clientY);
    }, { passive:true });
    document.addEventListener('touchend', function(e){
      if(!open || pointer !== 'touch') return;
      // a drag that ended on a wedge fires it; a plain tap falls through to click
      if(armed && hot >= 0){ e.preventDefault(); fire(hot); }
    }, { passive:false });

    bg.addEventListener('click', function(e){ if(e.target === bg) closeWheel(); });

    document.addEventListener('keydown', function(e){
      if(!open) return;
      if(e.key === 'Escape'){ e.preventDefault(); closeWheel(); return; }
      if(e.key >= '1' && e.key <= '9' && (+e.key) <= N){ e.preventDefault(); fire(+e.key - 1); return; }
      if(e.key === 'Enter' && hot >= 0){ e.preventDefault(); fire(hot); return; }
      if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); setHot(((hot < 0 ? -1 : hot) + 1) % N); }
      if(e.key === 'ArrowLeft'  || e.key === 'ArrowUp')  { e.preventDefault(); setHot(((hot < 0 ?  1 : hot) - 1 + N) % N); }
    });

    window.addEventListener('resize', function(){ if(open) place(anchor); });
    window.addEventListener('scroll', function(){ if(open) closeWheel(); }, true);

    // keep trigger pips honest even when tools are opened from elsewhere
    setInterval(function(){ refreshTriggers(); if(open) refreshLive(); }, 1200);
  }

  /* ── Public API ───────────────────────────────────────── */
  window.toolWheelRegister = register;
  window.toolWheelOpen     = function(el, key){ openWheel(el || null, 'mouse', key || 'tools'); };
  window.toolWheelClose    = closeWheel;
  window.toolWheelRefresh  = refreshTriggers;

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

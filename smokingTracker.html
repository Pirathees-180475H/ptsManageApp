<style>
  :root {
    --bg-dark: rgba(15, 23, 42, 0.4);
    --card-bg: rgba(30, 41, 59, 0.4);
    --glass-border: rgba(255, 255, 255, 0.08);
    --mint: #4ade80;
    --mint-glow: rgba(74, 222, 128, 0.4);
    --blue: #38bdf8;
    --blue-glow: rgba(56, 189, 248, 0.4);
    --purple: #c084fc;
    --purple-glow: rgba(192, 132, 252, 0.4);
    --cream: #f1f5f9;
    --dim: #94a3b8;
    --grad-mint: linear-gradient(135deg, #4ade80 0%, #2dd4bf 100%);
    --grad-purple: linear-gradient(135deg, #c084fc 0%, #a855f7 100%);
  }

  .smoke-container {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--cream);
    width: 100%;
    margin: 0 auto;
    padding: 20px 16px;
    background: transparent;
    min-height: 100%;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--purple-glow) transparent;
  }

  .smoke-container::-webkit-scrollbar {
    width: 6px;
  }
  .smoke-container::-webkit-scrollbar-track {
    background: transparent;
  }
  .smoke-container::-webkit-scrollbar-thumb {
    background-color: var(--glass-border);
    border-radius: 20px;
  }

  @media (min-width: 768px) {
    .smoke-container {
      max-width: 800px;
      padding: 40px 24px;
    }
    .smoke-stats-grid {
      gap: 20px;
    }
    .breath-ring-wrap {
      width: 280px;
      height: 280px;
    }
    .breath-days {
      font-size: 5rem;
    }
  }

  @media (max-width: 480px) {
    .smoke-container {
      padding: 12px 12px;
    }
    .smoke-stats-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .glass-card {
      padding: 16px;
      margin-bottom: 12px;
      border-radius: 20px;
    }
    .breath-hero {
      padding: 10px 0;
    }
    .smoke-eyebrow {
      margin-bottom: 12px;
      font-size: 0.7rem;
    }
    .breath-ring-wrap {
      width: 180px;
      height: 180px;
    }
    .breath-days {
      font-size: 3rem;
    }
    .breath-label {
      font-size: 0.7rem;
    }
    .breath-sub {
      font-size: 0.8rem;
      margin-top: 8px;
    }
    .smoke-savings-val {
      font-size: 1.6rem;
    }
    .smoke-stat-val {
      font-size: 1.4rem;
    }
    .smoke-stat-lbl {
      font-size: 0.6rem;
    }
    .donut-section {
      gap: 12px;
    }
    .donut-wrap {
      width: 70px;
      height: 70px;
    }
    .donut-text-title {
      font-size: 0.95rem;
    }
    .donut-text-sub {
      font-size: 0.75rem;
    }
    .life-card {
      padding: 12px;
      gap: 12px;
    }
    .life-icon {
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
    }
    .life-txt {
      font-size: 0.85rem;
    }
  }

  .smoke-container * { box-sizing: border-box; }

  /* Animations */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-in { animation: fadeInUp 0.6s ease-out forwards; }

  /* Glassmorphism Card Base */
  .glass-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    margin-bottom: 20px;
    padding: 24px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
  }

  /* Hero Section */
  .breath-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
  }
  .smoke-eyebrow {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--purple);
    margin-bottom: 24px;
    background: rgba(192, 132, 252, 0.1);
    padding: 6px 16px;
    border-radius: 100px;
  }
  .breath-ring-wrap {
    position: relative;
    width: 240px;
    height: 240px;
  }
  .breath-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 12; }
  .breath-fg {
    fill: none; stroke: url(#grad-mint); stroke-width: 12; stroke-linecap: round;
    transform: rotate(-90deg); transform-origin: 50% 50%;
    filter: drop-shadow(0 0 8px var(--mint-glow));
    transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .breath-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .breath-days {
    font-size: 4rem; font-weight: 800; line-height: 1; 
    background: var(--grad-mint); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .breath-label {
    font-size: 0.8rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--dim); margin-top: 4px;
  }
  .breath-sub {
    font-size: 0.85rem; color: var(--mint); margin-top: 12px; font-weight: 500;
  }

  /* Savings Box */
  .smoke-savings-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(135deg, rgba(74, 222, 128, 0.05) 0%, rgba(56, 189, 248, 0.05) 100%);
  }
  .smoke-savings-box .lbl { font-size: 0.75rem; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .smoke-savings-val { font-size: 2.2rem; font-weight: 800; color: var(--cream); margin: 4px 0; }
  .smoke-savings-sub { font-size: 0.85rem; color: var(--dim); }
  .savings-icon {
    width: 56px; height: 56px; border-radius: 18px;
    background: var(--grad-mint); color: #064e3b;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; font-weight: 700;
    box-shadow: 0 4px 15px var(--mint-glow);
  }

  /* Stats Grid */
  .smoke-stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .smoke-stat-card {
    background: rgba(30, 41, 59, 0.3);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 16px 8px;
    text-align: center;
    transition: all 0.2s;
  }
  .smoke-stat-card:hover { transform: translateY(-4px); }
  .smoke-stat-val { display: block; font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; }
  .smoke-stat-lbl { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: var(--dim); letter-spacing: 0.05em; }
  .val-mint { color: var(--mint); }
  .val-blue { color: var(--blue); }
  .val-purple { color: var(--purple); }

  /* Donut Section */
  .donut-section {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .donut-wrap { position: relative; width: 90px; height: 90px; flex-shrink: 0; }
  .donut-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut-center {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: 800; color: var(--purple);
  }
  .donut-text-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; color: var(--cream); }
  .donut-text-sub { font-size: 0.85rem; color: var(--dim); line-height: 1.5; }

  /* Health Section */
  .health-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--dim);
  }
  .health-header::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }
  
  .health-item { margin-bottom: 20px; }
  .health-info { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; }
  .h-label { font-size: 0.95rem; font-weight: 600; color: var(--cream); }
  .h-desc { font-size: 0.8rem; color: var(--dim); display: block; }
  .h-pct { font-size: 0.85rem; font-weight: 700; color: var(--mint); }
  
  .health-progress-bg { height: 8px; background: rgba(255,255,255,0.05); border-radius: 100px; overflow: hidden; }
  .health-progress-fill {
    height: 100%; border-radius: 100px; width: 0;
    background: var(--grad-mint);
    transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 10px var(--mint-glow);
  }
  .health-progress-fill.pending { background: #334155; box-shadow: none; }

  /* Life Regained */
  .life-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, rgba(192, 132, 252, 0.05) 0%, rgba(168, 85, 247, 0.05) 100%);
  }
  .life-icon {
    width: 48px; height: 48px; border-radius: 14px;
    background: var(--grad-purple); color: #2e1065;
    display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0;
  }
  .life-txt { font-size: 0.95rem; line-height: 1.5; color: var(--dim); }
  .life-txt b { color: var(--purple); font-weight: 700; }
</style>

<div class="smoke-container">
  <div id="smoke-content"></div>
</div>

<script>
  function renderSmokingTracker(data) {
    const root = document.getElementById('smoke-content');

    if (!data || !data.success) {
      root.innerHTML = '<div style="text-align:center;padding:40px 16px;color:var(--dim);">Could not load your data. ' + (data ? data.error : 'Failed to load data') + '</div>';
      return;
    }

    const lastSmoke = new Date(data.lastSmokeDate);
    if (isNaN(lastSmoke.getTime())) {
      root.innerHTML = '<div style="text-align:center;padding:40px 16px;color:var(--dim);">Add a valid "Last smoke date" to start tracking.</div>';
      return;
    }

    const now = new Date();
    const diffMs = now - lastSmoke;
    if (diffMs < 0) {
      root.innerHTML = '<div style="text-align:center;padding:40px 16px;color:var(--dim);">Your last smoke date is in the future.</div>';
      return;
    }

    const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    const diffHours = Math.floor((diffMs / (1000 * 60 * 60)) % 24);
    const diffMins = Math.floor((diffMs / (1000 * 60)) % 60);

    let y = now.getFullYear() - lastSmoke.getFullYear();
    let mo = now.getMonth() - lastSmoke.getMonth();
    let d = now.getDate() - lastSmoke.getDate();
    if (d < 0) { mo -= 1; const pm = new Date(now.getFullYear(), now.getMonth(), 0); d += pm.getDate(); }
    if (mo < 0) { y -= 1; mo += 12; }

    const totalCigsNotSmoked = diffDays * data.dailyCount;
    const moneySaved = totalCigsNotSmoked * data.piecePrice;
    const packReference = Math.max(data.dailyCount * 30, 30);
    const donutPct = Math.min(100, (totalCigsNotSmoked / packReference) * 100);

    const healthMilestones = [
      { label: 'Blood pressure', time: 20 / (24 * 60), desc: 'returns to normal' },
      { label: 'Oxygen level', time: 8 / 24, desc: 'returns to normal' },
      { label: 'Carbon monoxide', time: 1, desc: 'levels in blood drop' },
      { label: 'Heart attack risk', time: 2, desc: 'starts to decrease' },
      { label: 'Nerve endings', time: 3, desc: 'starting to re-grow' },
      { label: 'Circulation', time: 14, desc: 'improves significantly' },
      { label: 'Lung function', time: 60, desc: 'increases up to 30%' },
      { label: 'Coughing', time: 270, desc: 'noticeably decreases' }
    ];

    const R = 90, C = 2 * Math.PI * R;
    const ringPct = Math.min(100, (diffDays / 365) * 100); // 1 year goal for the big ring
    const ringOffset = C - (ringPct / 100) * C;
    const donutR = 36, donutC = 2 * Math.PI * donutR;
    const donutOffset = donutC - (donutPct / 100) * donutC;

    let html = `
      <svg style="width:0;height:0;position:absolute;">
        <defs>
          <linearGradient id="grad-mint" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4ade80" />
            <stop offset="100%" stop-color="#2dd4bf" />
          </linearGradient>
          <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c084fc" />
            <stop offset="100%" stop-color="#a855f7" />
          </linearGradient>
        </defs>
      </svg>

      <div class="breath-hero animate-in">
        <div class="smoke-eyebrow">Smoke-free since ${lastSmoke.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' })}</div>
        <div class="breath-ring-wrap">
          <svg viewBox="0 0 200 200">
            <circle class="breath-bg" cx="100" cy="100" r="${R}"></circle>
            <circle class="breath-fg" cx="100" cy="100" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${ringOffset}"></circle>
          </svg>
          <div class="breath-center">
            <div class="breath-days">${diffDays}</div>
            <div class="breath-label">${diffDays === 1 ? 'day' : 'days'} clean</div>
            <div class="breath-sub">${diffHours}h ${diffMins}m</div>
          </div>
        </div>
      </div>

      <div class="glass-card smoke-savings-box animate-in" style="animation-delay: 0.1s">
        <div>
          <div class="lbl">Money Saved</div>
          <div class="smoke-savings-val">\u20A8 ${Math.round(moneySaved).toLocaleString()}</div>
          <div class="smoke-savings-sub">${totalCigsNotSmoked.toLocaleString()} cigarettes skipped</div>
        </div>
        <div class="savings-icon">\u20A8</div>
      </div>

      <div class="smoke-stats-grid animate-in" style="animation-delay: 0.2s">
        <div class="smoke-stat-card"><span class="smoke-stat-val val-mint">${y}</span><span class="smoke-stat-lbl">${y === 1 ? 'Year' : 'Years'}</span></div>
        <div class="smoke-stat-card"><span class="smoke-stat-val val-blue">${mo}</span><span class="smoke-stat-lbl">${mo === 1 ? 'Month' : 'Months'}</span></div>
        <div class="smoke-stat-card"><span class="smoke-stat-val val-purple">${d}</span><span class="smoke-stat-lbl">${d === 1 ? 'Day' : 'Days'}</span></div>
      </div>

      <div class="glass-card donut-section animate-in" style="animation-delay: 0.3s">
        <div class="donut-wrap">
          <svg viewBox="0 0 90 90">
            <circle class="breath-bg" cx="45" cy="45" r="${donutR}" style="stroke-width:8"></circle>
            <circle cx="45" cy="45" r="${donutR}" fill="none" stroke="url(#grad-purple)" stroke-width="8" stroke-linecap="round" 
                    stroke-dasharray="${donutC}" stroke-dashoffset="${donutOffset}" style="transition: stroke-dashoffset 1.2s ease-out; transform: rotate(-90deg); transform-origin: 50% 50%;"></circle>
          </svg>
          <div class="donut-center">${Math.round(donutPct)}%</div>
        </div>
        <div class="donut-text">
          <div class="donut-text-title">Pack Progress</div>
          <div class="donut-text-sub">You've avoided ${Math.round(totalCigsNotSmoked / 20)} full packs. Keep it up!</div>
        </div>
      </div>

      <div class="glass-card life-card animate-in" style="animation-delay: 0.4s">
        <div class="life-icon">⌛</div>
        <div class="life-txt"><b>${(totalCigsNotSmoked * 11 / 1440).toFixed(1)} days</b> of life regained by staying clean.</div>
      </div>
    `;

    root.innerHTML = html;
  }
</script>

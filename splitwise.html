<!-- ═══════════════════════════════════════════════════════════════
     SPLITWISE MODAL  —  small, tool-wheel opened

     Two things only: the net position amount, and the month detail.
     No page, no charts, no ledger table.

       ① header   🤝 title · ↻ refresh · ✕ close   (drag handle)
       ② net      the one number, straight from Portfolio!B14
       ③ month    ◀ Sep 2026 ▶ · I covered / They covered / Net
                  · day cards, newest day first (month end → start)

     Data is prefetched at app start by swPrefetch(), fired from
     render.html's window.onload — nothing blocks on it, and by the
     time the wheel is used the modal opens straight from cache.

     Card vocabulary follows the subscription tracker: .sub-sum-card
     summary tiles and .sub-platform-card rows, same radii, same
     2px top gradient bar, same muted uppercase micro-labels.

     Backend (unchanged):
       getSplitwiseSheetBalance · getSplitwiseMonthEntries

     Included from render.html via:  <?!= include('splitwise'); ?>
     Opened from the tool wheel:     swToggle()
═══════════════════════════════════════════════════════════════ -->
<style>
/* ── ① shell ── */
#sw-modal{
  position:fixed;top:12vh;left:50%;transform:translateX(-50%);
  width:calc(100% - 24px);max-width:430px;max-height:76vh;z-index:8000;
  background:#0a0e1c;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border:1px solid rgba(255,255,255,.1);border-radius:20px;
  box-shadow:0 28px 80px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.07);
  display:none;flex-direction:column;overflow:hidden;
}
#sw-modal.open{display:flex;animation:swModalIn .28s ease;}
@keyframes swModalIn{from{opacity:0;transform:translateX(-50%) scale(.95);}to{opacity:1;transform:translateX(-50%) scale(1);}}
#sw-modal::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;z-index:2;pointer-events:none;
  background:linear-gradient(90deg,transparent 5%,rgba(0,212,255,.7) 35%,rgba(168,85,247,.6) 65%,transparent 95%);
}
.swm-hdr{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px 10px;border-bottom:1px solid rgba(255,255,255,.07);
  flex-shrink:0;cursor:grab;user-select:none;
  background:linear-gradient(180deg,rgba(0,212,255,.06) 0%,transparent 100%);
}
.swm-hdr:active{cursor:grabbing;}
.swm-title{
  font-size:.63em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,#fff 0%,#7dd3fc 55%,#c084fc 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.swm-hdr-btns{display:flex;align-items:center;gap:7px;}
.swm-btn{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  color:rgba(255,255,255,.4);font-size:.72em;cursor:pointer;
  padding:4px 9px;line-height:1;font-family:inherit;border-radius:8px;transition:all .15s;
}
.swm-btn:hover{color:#fff;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);}
.swm-btn.spin{color:var(--blue);pointer-events:none;}
.swm-btn.spin span{display:inline-block;animation:spin .7s linear infinite;}
.swm-body{flex:1;overflow-y:auto;padding:14px;min-height:0;display:flex;flex-direction:column;gap:13px;}
.swm-body::-webkit-scrollbar{width:5px;}
.swm-body::-webkit-scrollbar-track{background:transparent;}
.swm-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px;}

/* ── ② net position ── */
.swm-net{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  border-radius:14px;padding:16px 16px 15px;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.swm-net::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,rgba(0,212,255,.55),rgba(168,85,247,.35));
}
.swm-net::after{
  content:'';position:absolute;right:-16px;bottom:-16px;width:60px;height:60px;border-radius:50%;
  background:#00d4ff;filter:blur(24px);opacity:.12;pointer-events:none;
}
.swm-net-lbl{font-size:.52em;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:rgba(255,255,255,.35);margin-bottom:5px;}
.swm-net-val{font-size:1.9em;font-weight:800;letter-spacing:-1px;line-height:1;
  font-variant-numeric:tabular-nums;color:#fff;}
.swm-net-sub{font-size:.62em;color:rgba(255,255,255,.35);margin-top:6px;}
.swm-net.loading .swm-net-val{color:rgba(255,255,255,.2);}

/* ── ③ month detail ── */
.swm-month-bar{display:flex;align-items:center;gap:8px;}
.swm-month-lbl{font-size:.62em;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
  color:rgba(255,255,255,.45);flex:1;text-align:center;}
.swm-nav{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);
  color:rgba(255,255,255,.5);border-radius:8px;width:26px;height:26px;flex-shrink:0;
  cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;transition:all .13s;
}
.swm-nav:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.11);}
.swm-nav:disabled{opacity:.25;cursor:not-allowed;pointer-events:none;}

.swm-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.swm-sum-card{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  border-radius:13px;padding:10px 11px;position:relative;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.swm-sum-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,rgba(99,102,241,.4),rgba(168,85,247,.3));
}
.swm-sum-card.green::before{background:linear-gradient(90deg,rgba(0,230,118,.5),rgba(0,230,118,.2));}
.swm-sum-card.red::before  {background:linear-gradient(90deg,rgba(255,77,109,.5),rgba(255,77,109,.2));}
.swm-sum-lbl{font-size:.5em;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;
  color:rgba(255,255,255,.35);margin-bottom:3px;}
.swm-sum-val{font-size:.85em;font-weight:800;color:#fff;letter-spacing:-.3px;font-variant-numeric:tabular-nums;}
.swm-sum-val.green{color:var(--green);}
.swm-sum-val.red{color:var(--red);}

.swm-days{display:flex;flex-direction:column;gap:8px;}
.swm-day-card{
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:11px;
  position:relative;overflow:hidden;transition:border-color .15s,background .15s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}
.swm-day-card:hover{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.13);}
.swm-day-card::after{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent,var(--blue));}
.swm-day-tag{
  display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;
  min-width:34px;padding:4px 0;border-radius:9px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);
}
.swm-day-num{font-size:.85em;font-weight:800;color:rgba(255,255,255,.85);line-height:1;}
.swm-day-dow{font-size:.5em;font-weight:600;letter-spacing:.6px;text-transform:uppercase;
  color:rgba(255,255,255,.3);margin-top:2px;}
.swm-day-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.swm-day-ref{font-size:.68em;color:rgba(255,255,255,.62);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.swm-day-ref.none{color:rgba(255,255,255,.22);font-style:italic;}
.swm-day-legs{display:flex;gap:8px;flex-wrap:wrap;}
.swm-leg{font-size:.55em;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap;
  font-variant-numeric:tabular-nums;}
.swm-leg.i{background:rgba(0,230,118,.12);color:var(--green);}
.swm-leg.o{background:rgba(255,77,109,.12);color:var(--red);}
.swm-day-net{font-size:.82em;font-weight:800;letter-spacing:-.3px;flex-shrink:0;
  font-variant-numeric:tabular-nums;}

.swm-empty{text-align:center;padding:26px 10px;color:rgba(255,255,255,.25);font-size:.72em;}
.swm-err{text-align:center;padding:22px 10px;color:var(--red);font-size:.72em;}
.swm-skel{height:52px;border-radius:12px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.05);position:relative;overflow:hidden;}
.swm-skel::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
  transform:translateX(-100%);animation:swmSweep 1.4s ease-in-out infinite;}
@keyframes swmSweep{100%{transform:translateX(100%)}}

@media(max-width:600px){
  #sw-modal{top:8vh;max-height:84vh;}
}
@media(prefers-reduced-motion:reduce){
  #sw-modal,.swm-skel::after,.swm-btn.spin span{animation:none!important;}
}
</style>

<div id="sw-modal" role="dialog" aria-modal="true" aria-label="Splitwise">
  <div class="swm-hdr" id="swm-hdr">
    <span class="swm-title">🤝 Splitwise</span>
    <div class="swm-hdr-btns">
      <button class="swm-btn" id="swm-refresh" onclick="swRefresh()" title="Refresh net position"><span>↻</span></button>
      <button class="swm-btn" onclick="swClose()" title="Close">✕</button>
    </div>
  </div>
  <div class="swm-body">

    <div class="swm-net loading" id="swm-net">
      <div class="swm-net-lbl">Net Position</div>
      <div class="swm-net-val" id="swm-net-val">—</div>
      <div class="swm-net-sub" id="swm-net-sub">loading…</div>
    </div>

    <div class="swm-month-bar">
      <button class="swm-nav" id="swm-prev" onclick="swMonthNav(-1)" title="Previous month">◀</button>
      <span class="swm-month-lbl" id="swm-month-lbl">—</span>
      <button class="swm-nav" id="swm-next" onclick="swMonthNav(1)" title="Next month">▶</button>
    </div>

    <div id="swm-month"><div class="swm-skel"></div></div>

  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   SPLITWISE MODAL
   Prefetched at app start by swPrefetch() — see render.html onload.
═══════════════════════════════════════════ */
var SW_MON = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var SW_DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

var _swBal      = null;   /* {success, sheetBalance} — null until it lands */
var _swBalBusy  = false;
var _swMonthCache = {};   /* 'YYYY-M' -> payload from getSplitwiseMonthEntries */
var _swM = 0, _swY = 0;   /* month currently shown */

function swFmt(n){ return '₨ ' + Math.abs(Math.round(n||0)).toLocaleString('en-IN'); }
function swSigned(n){ n = n||0; return (n<0?'− ':n>0?'+ ':'') + swFmt(n); }
function swEsc(s){ return (s==null?'':s).toString()
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function swKey(m,y){ return y + '-' + m; }

/* ═══════════════════════════════════════════
   PREFETCH — fired from window.onload, never awaited
═══════════════════════════════════════════ */
function swPrefetch(){
  var now = new Date();
  if(!_swM){ _swM = now.getMonth() + 1; _swY = now.getFullYear(); }
  swFetchBalance();
  swFetchMonth(_swM, _swY);
}

function swFetchBalance(cb){
  if(_swBalBusy){ if(cb) cb(); return; }
  _swBalBusy = true;
  google.script.run
    .withSuccessHandler(function(d){ _swBal = d; _swBalBusy = false; swPaintNet(); if(cb) cb(); })
    .withFailureHandler(function(e){ _swBal = { success:false, error:(e && e.message) || e };
                                     _swBalBusy = false; swPaintNet(); if(cb) cb(); })
    .getSplitwiseSheetBalance();
}

/* one flight per month — a second ask while it is in the air just waits */
function swFetchMonth(m, y, force){
  var k = swKey(m, y);
  var hit = _swMonthCache[k];
  if(hit && !force){
    if(hit.pending) return;          /* already on the wire */
    swPaintMonth(m, y);
    return;
  }
  _swMonthCache[k] = { pending:true };
  google.script.run
    .withSuccessHandler(function(d){
      _swMonthCache[k] = d || { success:false, error:'Empty response' };
      if(_swM === m && _swY === y) swPaintMonth(m, y);
    })
    .withFailureHandler(function(e){
      _swMonthCache[k] = { success:false, error:(e && e.message) || e };
      if(_swM === m && _swY === y) swPaintMonth(m, y);
    })
    .getSplitwiseMonthEntries(m, y);
}

/* ═══════════════════════════════════════════
   ② NET POSITION
═══════════════════════════════════════════ */
function swPaintNet(){
  var box = document.getElementById('swm-net');
  var val = document.getElementById('swm-net-val');
  var sub = document.getElementById('swm-net-sub');
  if(!box || !val || !sub) return;

  if(!_swBal){ box.classList.add('loading'); val.textContent = '—'; sub.textContent = 'loading…'; return; }
  box.classList.remove('loading');

  if(!_swBal.success){
    val.textContent = '—';
    val.style.color = 'var(--red)';
    sub.textContent = '⚠ ' + swEsc(_swBal.error || 'could not read the sheet');
    return;
  }
  var bal = parseFloat(_swBal.sheetBalance) || 0;
  val.textContent  = swSigned(bal);
  val.style.color  = bal < 0 ? 'var(--red)' : bal > 0 ? 'var(--green)' : '#fff';
  sub.textContent  = bal < -1 ? 'You owe this much overall'
                   : bal >  1 ? 'This much is owed to you'
                   : 'All settled up 🎉';
}

/* ═══════════════════════════════════════════
   ③ MONTH DETAIL — newest day first
═══════════════════════════════════════════ */
function swPaintMonthLabel(){
  var lbl = document.getElementById('swm-month-lbl');
  if(lbl) lbl.textContent = SW_MON[_swM] + ' ' + _swY;
  var now = new Date();
  var next = document.getElementById('swm-next');
  if(next) next.disabled = (_swY > now.getFullYear() ||
                           (_swY === now.getFullYear() && _swM >= now.getMonth() + 1));
}

function swPaintMonth(m, y){
  var box = document.getElementById('swm-month');
  if(!box) return;
  swPaintMonthLabel();

  var data = _swMonthCache[swKey(m, y)];
  if(!data || data.pending){ box.innerHTML = '<div class="swm-skel"></div>'; return; }
  if(!data.success){
    box.innerHTML = '<div class="swm-err">⚠ ' + swEsc(data.error || 'Failed to load') + '</div>';
    return;
  }

  var iPaid = data.totalIPaid || 0, other = data.totalOther || 0;
  var net   = iPaid - other;
  var netCls = net < 0 ? 'red' : net > 0 ? 'green' : '';

  var html = '<div class="swm-sum">'
    + '<div class="swm-sum-card green"><div class="swm-sum-lbl">I Covered</div>'
      + '<div class="swm-sum-val green">' + swFmt(iPaid) + '</div></div>'
    + '<div class="swm-sum-card red"><div class="swm-sum-lbl">They Covered</div>'
      + '<div class="swm-sum-val red">' + swFmt(other) + '</div></div>'
    + '<div class="swm-sum-card"><div class="swm-sum-lbl">Net</div>'
      + '<div class="swm-sum-val ' + netCls + '">' + swSigned(net) + '</div></div>'
  + '</div>';

  /* month end → start, the way the sheet is read back */
  var days = (data.entries || []).slice().sort(function(a, b){ return b.day - a.day; });

  if(!days.length){
    html += '<div class="swm-empty">No entries in ' + SW_MON[m] + ' ' + y + '.</div>';
  } else {
    html += '<div class="swm-days">' + days.map(function(e){
      var dNet = (e.iPaid || 0) - (e.otherPaid || 0);
      var col  = dNet < 0 ? 'var(--red)' : dNet > 0 ? 'var(--green)' : 'rgba(255,255,255,.5)';
      var dow  = SW_DOW[new Date(y, m - 1, e.day).getDay()];
      var legs = '';
      if(e.iPaid > 0)     legs += '<span class="swm-leg i">I paid ' + swFmt(e.iPaid) + '</span>';
      if(e.otherPaid > 0) legs += '<span class="swm-leg o">They paid ' + swFmt(e.otherPaid) + '</span>';
      return '<div class="swm-day-card" style="--accent:' + col + '">'
        + '<div class="swm-day-tag"><span class="swm-day-num">' + e.day + '</span>'
          + '<span class="swm-day-dow">' + dow + '</span></div>'
        + '<div class="swm-day-mid">'
          + '<span class="swm-day-ref' + (e.reference ? '' : ' none') + '" title="' + swEsc(e.reference) + '">'
            + (e.reference ? swEsc(e.reference) : 'no reference') + '</span>'
          + '<span class="swm-day-legs">' + legs + '</span>'
        + '</div>'
        + '<span class="swm-day-net" style="color:' + col + '">' + swSigned(dNet) + '</span>'
      + '</div>';
    }).join('') + '</div>';
  }

  box.innerHTML = html;
}

function swMonthNav(dir){
  _swM += dir;
  if(_swM > 12){ _swM = 1;  _swY++; }
  if(_swM < 1) { _swM = 12; _swY--; }
  swPaintMonthLabel();
  var box = document.getElementById('swm-month');
  var cached = _swMonthCache[swKey(_swM, _swY)];
  if(box && (!cached || cached.pending)) box.innerHTML = '<div class="swm-skel"></div>';
  swFetchMonth(_swM, _swY);
}

/* ═══════════════════════════════════════════
   OPEN · CLOSE · REFRESH
═══════════════════════════════════════════ */
function swToggle(){
  var p = document.getElementById('sw-modal');
  if(!p) return;
  if(p.classList.contains('open')){ swClose(); return; }

  var now = new Date();
  if(!_swM){ _swM = now.getMonth() + 1; _swY = now.getFullYear(); }
  p.classList.add('open');

  /* paint whatever the prefetch already has, then fill the gaps */
  swPaintNet();
  swPaintMonth(_swM, _swY);
  if(!_swBal) swFetchBalance();
  swFetchMonth(_swM, _swY);
}

function swClose(){
  var p = document.getElementById('sw-modal');
  if(p) p.classList.remove('open');
}

/* the net position is one cell read — refresh it on its own, fast,
   and pull the visible month behind it */
function swRefresh(){
  var btn = document.getElementById('swm-refresh');
  if(btn) btn.classList.add('spin');
  swFetchBalance(function(){ if(btn) btn.classList.remove('spin'); });
  swFetchMonth(_swM, _swY, true);
  var box = document.getElementById('swm-month');
  if(box) box.innerHTML = '<div class="swm-skel"></div>';
}

/* ── Esc closes, header drags ── */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  var p = document.getElementById('sw-modal');
  if(p && p.classList.contains('open')) swClose();
});

document.addEventListener('DOMContentLoaded', function(){
  var panel = document.getElementById('sw-modal');
  if(!panel) return;
  var bar = document.getElementById('swm-hdr');
  if(!bar) return;
  var drag = false, ox = 0, oy = 0;

  function start(cx, cy){
    var r = panel.getBoundingClientRect();
    /* drop the centring transform on first drag so left/top are absolute */
    panel.style.transform = 'none';
    panel.style.left = r.left + 'px';
    panel.style.top  = r.top  + 'px';
    ox = cx - r.left; oy = cy - r.top; drag = true;
    bar.style.cursor = 'grabbing';
  }
  function move(cx, cy){
    if(!drag) return;
    var maxX = window.innerWidth  - panel.offsetWidth;
    var maxY = window.innerHeight - panel.offsetHeight;
    panel.style.left = Math.max(0, Math.min(cx - ox, maxX)) + 'px';
    panel.style.top  = Math.max(0, Math.min(cy - oy, maxY)) + 'px';
  }
  function end(){ drag = false; bar.style.cursor = 'grab'; }

  bar.addEventListener('mousedown', function(e){ if(e.target.closest('button')) return; start(e.clientX, e.clientY); });
  document.addEventListener('mousemove', function(e){ move(e.clientX, e.clientY); });
  document.addEventListener('mouseup', end);
  bar.addEventListener('touchstart', function(e){ if(e.target.closest('button')) return;
    var t = e.touches[0]; start(t.clientX, t.clientY); }, { passive:true });
  document.addEventListener('touchmove', function(e){ if(!drag) return; e.preventDefault();
    var t = e.touches[0]; move(t.clientX, t.clientY); }, { passive:false });
  document.addEventListener('touchend', end);
});
</script>

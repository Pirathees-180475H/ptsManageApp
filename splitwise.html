     SPLITWISE MODAL  —  small, tool-wheel opened

     Two things only: the overall balance, and the month detail.
     No page, no charts, no ledger table.

       ① header   🤝 title · ↻ refresh · ✕ close   (drag handle)

<script>
/* ═══════════════════════════════════════════
   SPLITWISE MODAL
   Prefetched at app start by swPrefetch() — see render.html onload.
═══════════════════════════════════════════ */
var SW_MON = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var SW_DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

var _swBal      = null;    /* {ok, value, from, error} once resolved */
var _swBalBusy  = false;
var _swMonthCache = {};    /* 'YYYY-M' -> payload from getSplitwiseMonthEntries */
var _swM = 0, _swY = 0;    /* month currently shown */

function swFmt(n){ return '₨ ' + Math.abs(Math.round(n||0)).toLocaleString('en-IN'); }
function swSigned(n){ n = n||0; return (n<0?'− ':n>0?'+ ':'') + swFmt(n); }
function swEsc(s){ return (s==null?'':s).toString()
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function swKey(m,y){ return y + '-' + m; }

/* ═══════════════════════════════════════════
   PREFETCH — fired from window.onload, never awaited
═══════════════════════════════════════════ */
function swPrefetch(){
  var now = new Date();
  if(!_swM){ _swM = now.getMonth() + 1; _swY = now.getFullYear(); }
  swFetchBalance();
  swFetchMonth(_swM, _swY);
}

/* Portfolio!B14 is the number of record. If that read fails we still owe
   the user a figure, so fall back to summing the ledger rather than
   showing a dash and nothing else. */
function swFetchBalance(cb){
  if(_swBalBusy){ if(cb) cb(); return; }
  _swBalBusy = true;
  var done = function(state){ _swBal = state; _swBalBusy = false; swPaintBalance(); if(cb) cb(); };

  google.script.run
    .withSuccessHandler(function(d){
      if(d && d.success){ done({ ok:true, value: parseFloat(d.sheetBalance) || 0, from:'sheet' }); }
      else swBalanceFromLedger((d && d.error) || 'sheet read failed', done);
    })
    .withFailureHandler(function(e){ swBalanceFromLedger((e && e.message) || e, done); })
    .getSplitwiseSheetBalance();
}

function swBalanceFromLedger(why, done){
  google.script.run
    .withSuccessHandler(function(d){
      if(d && d.success && d.entries){
        var net = 0;
        d.entries.forEach(function(e){ if(!e.isError) net += (e.amount || 0); });
        done({ ok:true, value:net, from:'ledger', error:why });
      } else {
        done({ ok:false, error:why });
      }
    })
    .withFailureHandler(function(){ done({ ok:false, error:why }); })
    .getSplitwiseLedger();
}

/* one flight per month — a second ask while it is in the air just waits */
function swFetchMonth(m, y, force){
  var k = swKey(m, y);
  var hit = _swMonthCache[k];
  if(hit && !force){
    if(hit.pending) return;          /* already on the wire */
    swPaintMonth(m, y);
    return;
  }
  _swMonthCache[k] = { pending:true };
  google.script.run
    .withSuccessHandler(function(d){
      _swMonthCache[k] = d || { success:false, error:'Empty response' };
      if(_swM === m && _swY === y) swPaintMonth(m, y);
    })
    .withFailureHandler(function(e){
      _swMonthCache[k] = { success:false, error:(e && e.message) || e };
      if(_swM === m && _swY === y) swPaintMonth(m, y);
    })
    .getSplitwiseMonthEntries(m, y);
}

/* ═══════════════════════════════════════════
   ② OVERALL BALANCE
═══════════════════════════════════════════ */
function swPaintBalance(){
  var amt = document.getElementById('swm-hero-amt');
  var del = document.getElementById('swm-deltas');
  if(!amt || !del) return;

  if(!_swBal){
    amt.className = 'swm-hero-amt dim';
    amt.textContent = '₨ —';
    del.innerHTML = '<span class="swm-delta flat">loading…</span>';
    return;
  }

  if(!_swBal.ok){
    amt.className = 'swm-hero-amt dim';
    amt.textContent = '₨ —';
    del.innerHTML = '<span class="swm-delta warn">⚠ ' + swEsc(_swBal.error || 'could not read the balance') + '</span>'
      + '<button class="swm-retry" type="button" onclick="swRefresh()">Retry</button>';
    return;
  }

  var v = _swBal.value;
  amt.className = 'swm-hero-amt ' + (v < 0 ? 'down' : v > 0 ? 'up' : '');
  amt.textContent = swSigned(v);

  var state = v < -1 ? '<span class="swm-delta down">▼ You owe this overall</span>'
            : v >  1 ? '<span class="swm-delta up">▲ Owed to you overall</span>'
            :          '<span class="swm-delta flat">→ All settled up 🎉</span>';
  if(_swBal.from === 'ledger') state += '<span class="swm-delta warn">⚠ from the ledger — sheet unreadable</span>';
  del.innerHTML = state;
}

/* ═══════════════════════════════════════════
   ③ MONTH DETAIL — newest day first
═══════════════════════════════════════════ */
function swPaintMonthLabel(){
  var lbl = document.getElementById('swm-month-lbl');
  if(lbl) lbl.textContent = SW_MON[_swM] + ' ' + _swY;
  var now = new Date();
  var next = document.getElementById('swm-next');
  if(next) next.disabled = (_swY > now.getFullYear() ||
                           (_swY === now.getFullYear() && _swM >= now.getMonth() + 1));
}

function swPaintMonth(m, y){
  var box = document.getElementById('swm-month');
  if(!box) return;
  swPaintMonthLabel();

  var data = _swMonthCache[swKey(m, y)];
  if(!data || data.pending){ box.innerHTML = '<div class="swm-skel"></div><div class="swm-skel"></div>'; return; }
  if(!data.success){
    box.innerHTML = '<div class="swm-err">⚠ ' + swEsc(data.error || 'Failed to load') + '</div>';
    return;
  }

  var iPaid = data.totalIPaid || 0, other = data.totalOther || 0;
  var net   = iPaid - other;
  var netCol = net < 0 ? '#ff4d8d' : net > 0 ? '#00ff88' : '#fff';

  var html = '<div class="swm-tiles">'
    + '<div class="swm-tile inn"><span class="swm-tile-glow" style="background:#00ff88"></span>'
      + '<span class="swm-tile-lbl">I Covered</span><span class="swm-tile-val">' + swFmt(iPaid) + '</span></div>'
    + '<div class="swm-tile out"><span class="swm-tile-glow" style="background:#ff4d8d"></span>'
      + '<span class="swm-tile-lbl">They Covered</span><span class="swm-tile-val">' + swFmt(other) + '</span></div>'
    + '<div class="swm-tile"><span class="swm-tile-glow" style="background:' + netCol + '"></span>'
      + '<span class="swm-tile-lbl">Net</span>'
      + '<span class="swm-tile-val" style="color:' + netCol + '">' + swSigned(net) + '</span></div>'
  + '</div>';

  /* month end → start, the way the sheet is read back */
  var days = (data.entries || []).slice().sort(function(a, b){ return b.day - a.day; });

  if(!days.length){
    html += '<div class="swm-empty">No entries in ' + SW_MON[m] + ' ' + y + '.</div>';
  } else {
    html += '<div class="swm-days">' + days.map(function(e, n){
      var dNet = (e.iPaid || 0) - (e.otherPaid || 0);
      var col  = dNet < 0 ? '#ff4d8d' : dNet > 0 ? '#00ff88' : 'rgba(255,255,255,.4)';
      var dow  = SW_DOW[new Date(y, m - 1, e.day).getDay()];
      var legs = '';
      if(e.iPaid > 0)     legs += '<span class="swm-leg i">I paid ' + swFmt(e.iPaid) + '</span>';
      if(e.otherPaid > 0) legs += '<span class="swm-leg o">They paid ' + swFmt(e.otherPaid) + '</span>';
      return '<div class="swm-day" style="animation-delay:' + Math.min(n * 35, 300) + 'ms">'
        + '<span class="swm-accent" style="background:' + col + '"></span>'
        + '<span class="swm-daytag"><span class="swm-daynum">' + e.day + '</span>'
          + '<span class="swm-daydow">' + dow + '</span></span>'
        + '<span class="swm-daymid">'
          + '<span class="swm-dayref' + (e.reference ? '' : ' none') + '" title="' + swEsc(e.reference) + '">'
            + (e.reference ? swEsc(e.reference) : 'no reference') + '</span>'
          + '<span class="swm-legs">' + legs + '</span>'
        + '</span>'
        + '<span class="swm-daynet" style="color:' + col + '">' + swSigned(dNet) + '</span>'
      + '</div>';
    }).join('') + '</div>';
  }

  box.innerHTML = html;
}

function swMonthNav(dir){
  _swM += dir;
  if(_swM > 12){ _swM = 1;  _swY++; }
  if(_swM < 1) { _swM = 12; _swY--; }
  swPaintMonthLabel();
  var box = document.getElementById('swm-month');
  var cached = _swMonthCache[swKey(_swM, _swY)];
  if(box && (!cached || cached.pending)) box.innerHTML = '<div class="swm-skel"></div><div class="swm-skel"></div>';
  swFetchMonth(_swM, _swY);
}

/* ═══════════════════════════════════════════
   OPEN · CLOSE · REFRESH
═══════════════════════════════════════════ */
function swToggle(){
  var p = document.getElementById('sw-modal');
  if(!p) return;
  if(p.classList.contains('open')){ swClose(); return; }

  var now = new Date();
  if(!_swM){ _swM = now.getMonth() + 1; _swY = now.getFullYear(); }

  if(window.innerWidth <= 700){ p.style.left = ''; p.style.top = ''; p.style.transform = ''; }
  p.classList.add('open');
  p.scrollTop = 0;          /* only lands once the element is displayed */

  /* paint whatever the prefetch already has, then fill the gaps */
  swPaintBalance();
  swPaintMonth(_swM, _swY);
  if(!_swBal) swFetchBalance();
  swFetchMonth(_swM, _swY);
}

function swClose(){
  var p = document.getElementById('sw-modal');
  if(p) p.classList.remove('open');
}

/* the balance is one cell read — refresh it on its own, fast,
   and pull the visible month in behind it */
function swRefresh(){
  var btn = document.getElementById('swm-refresh');
  if(btn) btn.classList.add('spin');
  _swBal = null;
  swPaintBalance();
  swFetchBalance(function(){ if(btn) btn.classList.remove('spin'); });
  swFetchMonth(_swM, _swY, true);
  var box = document.getElementById('swm-month');
  if(box) box.innerHTML = '<div class="swm-skel"></div><div class="swm-skel"></div>';
}

/* ── Esc closes, header drags ── */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  var p = document.getElementById('sw-modal');
  if(p && p.classList.contains('open')) swClose();
});

document.addEventListener('DOMContentLoaded', function(){
  var panel = document.getElementById('sw-modal');
  if(!panel) return;
  var bar = document.getElementById('swm-hdr');
  if(!bar) return;
  var drag = false, ox = 0, oy = 0;
  /* on a phone the modal is nearly full-bleed: dragging it has no value and
     its preventDefault would compete with the scroll */
  function canDrag(){ return window.innerWidth > 700; }

  function start(cx, cy){
    if(!canDrag()) return;
    var r = panel.getBoundingClientRect();
    /* drop the centring transform on first drag so left/top are absolute */
    panel.style.transform = 'none';
    panel.style.left = r.left + 'px';
    panel.style.top  = r.top  + 'px';
    ox = cx - r.left; oy = cy - r.top; drag = true;
    bar.style.cursor = 'grabbing';
  }
  function move(cx, cy){
    if(!drag) return;
    var maxX = window.innerWidth  - panel.offsetWidth;
    var maxY = window.innerHeight - panel.offsetHeight;
    panel.style.left = Math.max(0, Math.min(cx - ox, maxX)) + 'px';
    panel.style.top  = Math.max(0, Math.min(cy - oy, maxY)) + 'px';
  }
  function end(){ drag = false; bar.style.cursor = 'grab'; }

  bar.addEventListener('mousedown', function(e){ if(e.target.closest('button')) return; start(e.clientX, e.clientY); });
  document.addEventListener('mousemove', function(e){ move(e.clientX, e.clientY); });
  document.addEventListener('mouseup', end);
  bar.addEventListener('touchstart', function(e){ if(e.target.closest('button')) return;
    var t = e.touches[0]; start(t.clientX, t.clientY); }, { passive:true });
  document.addEventListener('touchmove', function(e){ if(!drag) return; e.preventDefault();
    var t = e.touches[0]; move(t.clientX, t.clientY); }, { passive:false });
  document.addEventListener('touchend', end);
});
</script>

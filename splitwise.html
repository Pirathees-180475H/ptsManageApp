<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splitwise</title>
<style>
  :root{
    --bg:#060b18; --red:#ff4d6d; --green:#00e676; --muted:rgba(255,255,255,.3);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:#fff; font-family:'Inter',system-ui,sans-serif;
    padding:18px; padding-bottom:16px;
  }

  .pg-corner-title{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
  .pg-ct-icon{font-size:1.15em;line-height:1;}
  .pg-ct-text{font-size:.72em;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.38);}

  .hero-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px;}
  .hero-card{border-radius:18px;padding:18px;border:1px solid;backdrop-filter:blur(20px);position:relative;overflow:hidden;transition:transform .25s ease;max-width:320px;}
  .hero-card.owe{background:linear-gradient(135deg,rgba(255,77,109,.09),rgba(255,77,109,.04));border-color:rgba(255,77,109,.25);}
  .hero-card.owed{background:linear-gradient(135deg,rgba(0,230,118,.09),rgba(0,230,118,.04));border-color:rgba(0,230,118,.25);}
  .hero-card.settled{background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);}
  .hero-card-glow{position:absolute;right:-30px;bottom:-30px;width:120px;height:120px;border-radius:50%;filter:blur(50px);opacity:.2;}
  .hero-card.owe .hero-card-glow{background:#ff4d6d;}
  .hero-card.owed .hero-card-glow{background:#00e676;}
  .hero-icon{font-size:1.6em;margin-bottom:7px;display:block;}
  .hero-label{font-size:.66em;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.38);margin-bottom:4px;}
  .hero-amount{font-size:1.6em;font-weight:800;letter-spacing:-1px;line-height:1;}
  .hero-card.owe .hero-amount{color:#ff4d6d;text-shadow:0 0 24px rgba(255,77,109,.4);}
  .hero-card.owed .hero-amount{color:#00e676;text-shadow:0 0 24px rgba(0,230,118,.4);}
  .hero-card.settled .hero-amount{color:rgba(255,255,255,.4);}
  .hero-sub{font-size:.7em;color:rgba(255,255,255,.3);margin-top:4px;}

  .sw-footnote{color:var(--muted);font-size:.7em;padding-top:6px;}

  .sw-spin-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;gap:14px;}
  .sw-spin{width:40px;height:40px;border:3px solid rgba(0,212,255,.15);border-top-color:#00d4ff;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .sw-err{color:var(--red);text-align:center;padding:40px 16px;font-size:.9em;}
</style>
</head>
<body>

  <div id="sw-body">
    <div class="sw-spin-wrap">
      <div class="sw-spin"></div>
      <div style="color:var(--muted);font-size:.82em;letter-spacing:2px;text-transform:uppercase">Loading…</div>
    </div>
  </div>

<script>
function swEscErr(e){ return (e && e.message) || e || 'Unknown error'; }

function swRender(data){
  var body = document.getElementById('sw-body');
  var ok      = data && data.success;
  var balance = ok ? (parseFloat(data.sheetBalance)||0) : 0;

  if(!ok){
    body.innerHTML = '<div class="sw-err">⚠ Failed to load sheet balance'
      + ((data && data.error) ? ': ' + data.error : '') + '</div>';
    return;
  }

  var cls = balance < 0 ? 'owe' : (balance > 0 ? 'owed' : 'settled');
  var ico = balance < 0 ? '📤' : (balance > 0 ? '📥' : '✅');
  var sub = balance < 0 ? 'You owe this' : balance > 0 ? 'You are owed' : 'All settled up!';

  body.innerHTML =
    '<div class="pg-corner-title"><span class="pg-ct-icon">👥</span><span class="pg-ct-text">Manage Fund Between Friends</span></div>'
    + '<div class="hero-row">'
      + '<div class="hero-card ' + cls + '">'
        + '<div class="hero-card-glow"></div>'
        + '<span class="hero-icon">' + ico + '</span>'
        + '<div class="hero-label">LKR Balance (Sheet)</div>'
        + '<div class="hero-amount">' + Math.abs(balance).toFixed(2) + '</div>'
        + '<div class="hero-sub">' + sub + '</div>'
      + '</div>'
    + '</div>'
    + '<div class="sw-footnote">Sourced from Portfolio sheet · Splitwise API integration removed</div>';
}

function swLoad(){
  google.script.run
    .withSuccessHandler(function(data){ swRender(data); })
    .withFailureHandler(function(err){
      document.getElementById('sw-body').innerHTML =
        '<div class="sw-err">⚠ Failed to load: ' + swEscErr(err) + '</div>';
    })
    .getSplitwiseSheetBalance();
}

swLoad();
</script>

</body>
</html>

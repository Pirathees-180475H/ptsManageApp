<script>
/* ═══════════════════════════════════════════
   MONEY FLOW — constants
═══════════════════════════════════════════ */
var MF_CATS   = ['CAL','NDB','Binance','Stock','FD','Gold','Sent Home'];
var MF_KEYS   = ['cal','ndb','binance','stock','fd','gold','sentHome'];
var MF_COLORS = ['#00d4ff','#a855f7','#f59e0b','#00e676','#ff6b35','#ffd700','#ff4d8d'];
var MF_EMOJIS = {cal:'🏦',ndb:'🏛️',binance:'₿',stock:'📊',fd:'🔒',gold:'🥇',sentHome:'🏠'};

var _mfCurMonth='', _mfCurStatus={}, _mfAllPlanData=[];
var _mfCurData=null;      /* the month object on screen */

var _mfBuzz = function(k){ if(typeof window.haptic === 'function') window.haptic(k); };

/* ═══ shared helpers ═══════════════════════════════════════ */
function mfK(n){ return n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(0)+'K':n.toFixed(0); }
function mfFmt(n){ return '₨'+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:0}); }

function mfHexA(hex,a){
  var h=String(hex).replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return 'rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)+','+a+')';
}
function mfClamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }

/* a month's categories that are in play — NTM (0) is not */
function mfActiveKeys(d){ return MF_KEYS.filter(function(k){ return d[k]>0 || d[k]===-1; }); }
/* stored status, falling back to what the amount implies */
function mfStatusOf(d,k){ var s=(d.status||{})[k]; if(s) return s; return d[k]===-1?'Failed':'Pending'; }
function mfInvested(d){ var t=0; MF_KEYS.forEach(function(k){ if(d[k]>0) t+=d[k]; }); return t; }
function mfSaveRate(d){
  var inc=d.income>0?d.income:0;
  return d.savingPct || (inc>0 ? mfInvested(d)/inc*100 : 0);
}
function mfRateCls(p){ return p>=80?'great':p>=60?'good':p>=45?'ok':'low'; }
function mfRateCol(p){ return p>=80?'#00e676':p>=60?'#00d4ff':p>=45?'#ffd700':'#ff4d8d'; }
function mfMonthShort(m){ return String(m||'').replace('/20','/'); }

var MF_SVG_NS='http://www.w3.org/2000/svg';
function mfSvg(tag,attrs){
  var el=document.createElementNS(MF_SVG_NS,tag);
  for(var k in attrs) if(attrs.hasOwnProperty(k)) el.setAttribute(k,attrs[k]);
  return el;
}

/* ═══ load ═════════════════════════════════════════════════ */
function mfLoad() {
  var _cmdHost=document.getElementById('mf-cmd-host');
  if(_cmdHost) _cmdHost.innerHTML='';        /* no stale month while loading */
  google.script.run
    .withSuccessHandler(mfRender)
    .withFailureHandler(function(err){
      document.getElementById('mf-cmd-host').innerHTML='';
      document.getElementById('mf-root').innerHTML=
        '<div style="text-align:center;padding:80px;color:#ff4d8d;font-size:.9em">⚠️ '+(err.message||err)+'</div>';
    })
    .getMoneyFlowData();
}

/* ═══ the page ═════════════════════════════════════════════ */
function mfRender(DATA) {
  if(!DATA||!DATA.length){
    document.getElementById('mf-cmd-host').innerHTML='';
    document.getElementById('mf-root').innerHTML=
      '<div style="text-align:center;padding:80px;color:rgba(255,255,255,.3)">No data found in "Money Flow and invest" sheet.</div>';
    return;
  }
  var mfFab=document.getElementById('mf-fab');
  if(mfFab && _activePage==='mf') mfFab.style.display='flex';

  /* ① COMMAND BAR — pinned above the scroller, never scrolls away */
  document.getElementById('mf-cmd-host').innerHTML=
    '<div class="mf-cmd">'+
      '<button class="mf-cmd-nav" id="mf-prev" type="button" onclick="mfStepMonth(-1)" title="Previous month">◀</button>'+
      '<select class="plan-month-sel" id="mf-planMonthSel" onchange="mfOnPlanMonthChange()"></select>'+
      '<button class="mf-cmd-nav" id="mf-next" type="button" onclick="mfStepMonth(1)" title="Next month">▶</button>'+
      '<span class="plan-overall-badge" id="mf-planOverallBadge"></span>'+
      '<div class="mf-cmd-flow" id="mf-cmd-flow"></div>'+
    '</div>';

  document.getElementById('mf-root').innerHTML=

    /* ② WHERE IT WENT  +  ③ THE PLAN */
    '<div class="mf-top">'+
      '<section class="mf-panel">'+
        '<div class="mf-panel-hdr"><i style="background:#00d4ff"></i>Where it went'+
          '<span class="mf-panel-sub" id="mf-where-month"></span>'+
          '<span class="mf-wv" id="mf-wv">'+
            '<button class="mf-wv-b" type="button" data-v="rose" onclick="mfSetWhereView(\'rose\')" title="Nightingale rose">✿</button>'+
            '<button class="mf-wv-b" type="button" data-v="grid" onclick="mfSetWhereView(\'grid\')" title="Rupee grid">▦</button>'+
          '</span></div>'+
        '<div class="mf-where" id="mf-where"></div>'+
      '</section>'+
      '<section class="mf-panel">'+
        '<div class="mf-panel-hdr"><i style="background:#00e676"></i>The plan'+
          '<span class="mf-panel-sub">tap a slot to edit</span></div>'+
        '<div class="plan-cards mf-slots" id="mf-planCards"></div>'+
        '<div class="mf-notes">'+
          '<textarea class="pne-ta" id="mf-planNotesTa" placeholder="Notes or reasons for this month…"></textarea>'+
          '<div class="mf-notes-foot">'+
            '<div class="pne-msg" id="mf-planNotesMsg"></div>'+
            '<button class="mf-save" type="button" onclick="mfSaveAll()">💾 Save Month</button>'+
          '</div>'+
        '</div>'+
      '</section>'+
    '</div>'+

    /* ④ THE RIVER */
    '<section class="mf-panel">'+
      '<div class="mf-panel-hdr"><i style="background:#a855f7"></i>The river'+
        '<span class="mf-panel-sub">every month · click to jump</span></div>'+
      '<div class="mf-rv" id="mf-rv"></div>'+
    '</section>'+

    /* ⑤ FOLLOW-THROUGH */
    '<section class="mf-panel">'+
      '<div class="mf-panel-hdr"><i style="background:#fbbf24"></i>Follow-through'+
        '<span class="mf-panel-sub">shade = amount · mark = status</span></div>'+
      '<div class="mf-grid-wrap" id="mf-grid"></div>'+
    '</section>'+

    /* ⑥ KPI STRIP */
    '<div class="mf-kpis" id="mf-kpis"></div>';

  mfRenderKpis(DATA);
  mfRenderRiver(DATA);
  mfRenderGrid(DATA);
  mfInitPlan(DATA);          /* renders the latest month → drives ①②③ */
}

/* ═══ month navigation — one path in, used by ①④⑤ ══════════ */
function mfSelectMonth(month, litKey){
  var found=null;
  for(var i=0;i<_mfAllPlanData.length;i++){
    if(_mfAllPlanData[i].month===month){ found=_mfAllPlanData[i]; break; }
  }
  if(!found) return;
  var sel=document.getElementById('mf-planMonthSel');
  if(sel && sel.value!==month) sel.value=month;
  mfRenderPlanForMonth(found);
  if(litKey) mfFlashSlot(litKey);
}

function mfStepMonth(dir){
  var i=-1;
  for(var j=0;j<_mfAllPlanData.length;j++) if(_mfAllPlanData[j].month===_mfCurMonth){ i=j; break; }
  if(i<0) return;
  var n=i+dir;
  if(n<0||n>=_mfAllPlanData.length){ _mfBuzz('warn'); return; }
  _mfBuzz('step');
  mfSelectMonth(_mfAllPlanData[n].month);
}

/* light a slot for a moment — used by the rupee grid and the month grid */
function mfFlashSlot(key){
  var card=document.getElementById('mf-pc-'+key);
  if(!card) return;
  card.classList.add('mf-lit');
  setTimeout(function(){ card.classList.remove('mf-lit'); }, 1400);
}

/* ═══ ① command bar contents ═══════════════════════════════ */
function mfUpdateCommand(cur){
  var inc=cur.income>0?cur.income:0, inv=mfInvested(cur);
  var pct=mfSaveRate(cur), cls=mfRateCls(pct);
  var el=document.getElementById('mf-cmd-flow');
  if(el){
    el.innerHTML=
      '<div class="mf-fstat"><span class="mf-fstat-l">Income</span>'+
        '<span class="mf-fstat-v" style="color:#00d4ff">'+(inc>0?mfFmt(inc):'—')+'</span></div>'+
      '<span class="mf-farrow">→</span>'+
      '<div class="mf-fstat"><span class="mf-fstat-l">Invested</span>'+
        '<span class="mf-fstat-v" style="color:#00e676">'+mfFmt(inv)+'</span></div>'+
      '<div class="mf-fbar"><i id="mf-fbar-i" style="background:'+mfRateCol(pct)+'"></i></div>'+
      '<span class="mf-fpct '+cls+'">'+pct.toFixed(1)+'%</span>';
    /* next frame so the bar animates out from zero */
    requestAnimationFrame(function(){
      var b=document.getElementById('mf-fbar-i');
      if(b) b.style.width=mfClamp(pct,0,100).toFixed(1)+'%';
    });
  }
  var i=-1;
  for(var j=0;j<_mfAllPlanData.length;j++) if(_mfAllPlanData[j].month===cur.month){ i=j; break; }
  var p=document.getElementById('mf-prev'), nx=document.getElementById('mf-next');
  if(p)  p.disabled  = (i<=0);
  if(nx) nx.disabled = (i<0 || i>=_mfAllPlanData.length-1);
}

/* ═══ ③ the plan slots ═════════════════════════════════════ */
function mfSlotCls(sv,isNTM){
  if(isNTM) return '';
  return sv==='DONE' ? ' is-done'
       : sv==='Partially Done' ? ' is-partial'
       : sv==='Failed' ? ' is-failed' : '';
}
/* keep the slot's shell in step with its status — called from the
   three places that can change it */
function mfSlotState(key){
  var card=document.getElementById('mf-pc-'+key);
  if(!card) return;
  var isNTM=card.dataset.ntm==='true';
  card.classList.remove('is-done','is-partial','is-failed');
  var c=mfSlotCls(_mfCurStatus[key]||'Pending',isNTM).trim();
  if(c) card.classList.add(c);
}

function mfRenderPlanForMonth(cur){
  _mfCurMonth=cur.month;
  _mfCurData=cur;
  _mfCurStatus=Object.assign({},cur.status||{});

  /* pre-seed status for the keys in play */
  MF_KEYS.forEach(function(k){
    if((cur[k]>0||cur[k]===-1)&&!_mfCurStatus[k]){
      _mfCurStatus[k]=cur[k]===-1?'Failed':'Pending';
    }
  });

  var cardsEl=document.getElementById('mf-planCards');
  if(cardsEl) cardsEl.innerHTML=MF_KEYS.map(function(k,i){
    var val=cur[k];
    var isFailed=val===-1;
    var isNTM=val===0;

    var cardCls=isNTM?'ntm':isFailed?'failed-card':'invested';
    var sv=_mfCurStatus[k]||'Pending';
    var pa=_mfCurStatus[k+'_partial']||'';
    var isP=sv==='Partially Done';
    var cls=sv==='DONE'?'done':sv==='Failed'?'failed':isP?'partial':'pending';
    var SVL=sv==='DONE'?'✅ Done':sv==='Failed'?'❌ Failed':isP?'🔸 Partial':'⏳ Pending';

    return '<div class="plan-card '+cardCls+mfSlotCls(sv,isNTM)+'" id="mf-pc-'+k+'" data-ntm="'+(isNTM?'true':'false')+'" data-key="'+k+'" style="--slot-glow:'+mfHexA(MF_COLORS[i],.55)+'">'+
      '<div class="pc-header">'+
        '<span class="pc-emoji">'+(MF_EMOJIS[k]||'💼')+'</span>'+
        '<div class="pc-header-right" style="display:flex;align-items:center;gap:4px;">'+
          '<div class="pst-dd '+(isNTM?'hidden':'')+'" id="mf-pst-dd-'+k+'">'+
            '<button class="pst-dd-btn '+cls+'" onclick="mfToggleDD(event,\''+k+'\')">'+
              '<span>'+SVL+'</span><span class="pst-dd-arrow">▾</span>'+
            '</button>'+
            '<div class="pst-dd-menu">'+
              '<div class="pst-dd-opt pending" onclick="mfSelectDD(\''+k+'\',\'Pending\')">⏳ Pending</div>'+
              '<div class="pst-dd-opt done"    onclick="mfSelectDD(\''+k+'\',\'DONE\')">✅ DONE</div>'+
              '<div class="pst-dd-opt partial" onclick="mfSelectDD(\''+k+'\',\'Partially Done\')">🔸 Partially Done</div>'+
              '<div class="pst-dd-opt failed"  onclick="mfSelectDD(\''+k+'\',\'Failed\')">❌ Failed</div>'+
            '</div>'+
          '</div>'+
          '<span class="pst-saved" id="mf-pst-saved-'+k+'"></span>'+
        '</div>'+
      '</div>'+
      '<div class="pc-name">'+MF_CATS[i]+'</div>'+
      '<div class="pc-body" onclick="mfCardClick(event,\''+k+'\')">'+
        '<div class="pc-ntm-view '+(isNTM?'':'hidden')+'">'+
          '<span class="pc-ntm-badge">NTM</span>'+
          '<span class="pc-ntm-hint">tap to add</span>'+
        '</div>'+
        '<div class="pc-value-view '+(isNTM?'hidden':'')+'">'+
          '<div class="pc-input-row">'+
            '<span class="pc-currency">₨</span>'+
            '<input type="number" class="pc-amount-input" id="mf-amt-'+k+'" value="'+(isFailed?'':val||'')+'" placeholder="0" '+(isFailed?'disabled':'')+' onclick="event.stopPropagation()">'+
          '</div>'+
          (isFailed?'<span class="pc-fail-badge">FAILED</span>':
          '<button class="pc-to-ntm-btn" onclick="mfSetNTM(event,\''+k+'\')">Mark NTM</button>')+
        '</div>'+
      '</div>'+
      '<div class="pc-partial '+(isP?'show':'')+'" id="mf-pst-partial-'+k+'">'+
        '<div class="pc-partial-row">'+
          '<span class="pc-partial-lbl">Partial ₨</span>'+
          '<input class="pc-partial-input" id="mf-pst-pinp-'+k+'" type="number" min="0" placeholder="amount" value="'+pa+'" onclick="event.stopPropagation()">'+
          '<button class="pc-partial-save" onclick="mfPstPartialSave(\''+k+'\')">✓</button>'+
        '</div>'+
        '<span class="pc-partial-msg" id="mf-pst-pmsg-'+k+'"></span>'+
      '</div>'+
      '</div>';
  }).join('');

  var ta=document.getElementById('mf-planNotesTa');
  if(ta) ta.value=cur.notes||'';
  mfUpdateOverallStatus();
  mfUpdateCommand(cur);
  mfHighlightMonth(cur.month);
  buildMFTicker(cur);
  mfRenderWhere(cur);
}

/* ═══ ⑥ KPI strip — 9 old tiles folded into 4 ══════════════ */
function mfRenderKpis(DATA){
  var host=document.getElementById('mf-kpis'); if(!host) return;

  var totInv=0, totInc=0, sumRate=0;
  var best=DATA[0], worst=DATA[0];
  DATA.forEach(function(d){
    totInv+=d.totalInvested; totInc+=d.income;
    sumRate+=d.savingPct;
    if(d.savingPct>best.savingPct) best=d;
    if(d.savingPct<worst.savingPct) worst=d;
  });
  var avg=sumRate/DATA.length;

  var done=0, partial=0, failed=0, all=0;
  DATA.forEach(function(d){
    mfActiveKeys(d).forEach(function(k){
      all++;
      var s=mfStatusOf(d,k);
      if(s==='DONE') done++;
      else if(s==='Partially Done') partial++;
      else if(s==='Failed') failed++;
    });
  });
  var follow = all>0 ? Math.round((done+partial*0.5)/all*100) : 0;

  /* trailing run of months where every active item landed */
  var streak=0;
  for(var i=DATA.length-1;i>=0;i--){
    var d=DATA[i], ak=mfActiveKeys(d);
    var allDone = ak.length>0 && ak.every(function(k){ return mfStatusOf(d,k)==='DONE'; });
    if(allDone) streak++; else break;
  }

  function tile(ic,color,label,value,sub){
    return '<div class="mf-kpi" style="--kc:'+color+'">'+
      '<span class="mf-kpi-ic">'+ic+'</span>'+
      '<div class="mf-kpi-l">'+label+'</div>'+
      '<div class="mf-kpi-v">'+value+'</div>'+
      '<div class="mf-kpi-s">'+sub+'</div></div>';
  }

  host.innerHTML=
    tile('💰','#00d4ff','Invested', mfFmt(totInv), 'of '+mfFmt(totInc)+' earned')+
    tile('📈','#a855f7','Avg Save',  avg.toFixed(1)+'%',
         'best '+mfMonthShort(best.month)+' · low '+mfMonthShort(worst.month))+
    tile('🎯', follow>=90?'#00e676':follow>=70?'#ffd700':'#ff4d8d','Follow-through',
         follow+'%', failed>0 ? failed+' failed of '+all : all+' tracked, none failed')+
    tile(streak>0?'🔥':'💤', streak>=3?'#ff6b35':'#94a3b8','Streak',
         streak+(streak===1?' month':' months'), streak>0?'every item done':'no run yet');
}

/* ═══ ④ THE RIVER ══════════════════════════════════════════ */
var _rvData=null, _rvBound=false, _rvT=null, _rvX={}, _rvStep=0, _rvGeom=null;

function mfRenderRiver(DATA){
  _rvData=DATA;
  mfDrawRiver();
  if(!_rvBound){
    _rvBound=true;
    window.addEventListener('resize',function(){
      clearTimeout(_rvT);
      _rvT=setTimeout(function(){ mfDrawRiver(); mfHighlightMonth(_mfCurMonth); },180);
    });
  }
}

/* smooth cubic segments through a list of points */
function mfRvBez(pts){
  var d='';
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i], p1=pts[i+1], cx=(p0[0]+p1[0])/2;
    d+='C'+cx.toFixed(1)+','+p0[1].toFixed(1)+' '+cx.toFixed(1)+','+p1[1].toFixed(1)+
       ' '+p1[0].toFixed(1)+','+p1[1].toFixed(1);
  }
  return d;
}
function mfRvArea(top,bot,halfW){
  if(top.length===1){                       /* a single month is a column */
    var x=top[0][0], w=halfW||26;
    return 'M'+(x-w)+','+top[0][1].toFixed(1)+'L'+(x+w)+','+top[0][1].toFixed(1)+
           'L'+(x+w)+','+bot[0][1].toFixed(1)+'L'+(x-w)+','+bot[0][1].toFixed(1)+'Z';
  }
  var rb=bot.slice().reverse();
  return 'M'+top[0][0].toFixed(1)+','+top[0][1].toFixed(1)+mfRvBez(top)+
         'L'+rb[0][0].toFixed(1)+','+rb[0][1].toFixed(1)+mfRvBez(rb)+'Z';
}
function mfRvLine(pts,halfW){
  if(pts.length===1){
    var x=pts[0][0], w=halfW||26;
    return 'M'+(x-w)+','+pts[0][1].toFixed(1)+'L'+(x+w)+','+pts[0][1].toFixed(1);
  }
  return 'M'+pts[0][0].toFixed(1)+','+pts[0][1].toFixed(1)+mfRvBez(pts);
}

function mfDrawRiver(){
  var host=document.getElementById('mf-rv');
  if(!host || !_rvData) return;
  var DATA=_rvData, n=DATA.length;
  host.innerHTML='';
  _rvX={};
  if(!n){ host.innerHTML='<div class="mf-rv-empty">No months recorded yet.</div>'; return; }

  var avail = Math.max(280, host.clientWidth||600);
  var padL=10, padR=88, padT=32, padB=26, MINSTEP=54;
  var plotW = Math.max((n-1)*MINSTEP, avail-padL-padR);
  var W     = plotW+padL+padR;
  var plotH = Math.round(mfClamp(avail*0.30,170,250));
  var H     = plotH+padT+padB;
  var step  = n>1 ? plotW/(n-1) : plotW;
  var halfW = Math.min(step * 0.4, 34);        /* column half-width when n===1 */
  _rvStep   = step;

  function X(i){ return n>1 ? padL+i*step : padL+plotW/2; }

  var maxY=0;
  DATA.forEach(function(d){ maxY=Math.max(maxY, d.income>0?d.income:0, mfInvested(d)); });
  if(maxY<=0) maxY=1;
  function Y(v){ return padT+plotH-(v/maxY)*plotH; }

  /* stack the categories bottom-up */
  var base=[]; for(var b=0;b<n;b++) base.push(0);
  var bands=[];
  MF_KEYS.forEach(function(k,ci){
    var top=[], bot=[], fails=[], any=false;
    for(var i=0;i<n;i++){
      var v=DATA[i][k], amt=v>0?v:0;
      if(amt>0) any=true;
      bot.push([X(i),Y(base[i])]);
      top.push([X(i),Y(base[i]+amt)]);
      if(v===-1) fails.push([X(i),Y(base[i])]);
      base[i]+=amt;
    }
    bands.push({key:k,name:MF_CATS[ci],color:MF_COLORS[ci],top:top,bot:bot,fails:fails,any:any});
  });

  var investedTop=[], incomeTop=[], gapTop=[];
  for(var i2=0;i2<n;i2++){
    var inc=DATA[i2].income>0?DATA[i2].income:0;
    investedTop.push([X(i2),Y(base[i2])]);
    incomeTop.push([X(i2),Y(inc)]);
    gapTop.push([X(i2),Y(Math.max(inc,base[i2]))]);
    _rvX[DATA[i2].month]=X(i2);
  }

  var svg=mfSvg('svg',{'class':'mf-rv-svg',viewBox:'0 0 '+W+' '+H,width:W,height:H,role:'img'});
  svg.style.setProperty('--rv-w', W+'px');

  var defs=mfSvg('defs');
  var pat=mfSvg('pattern',{id:'mfRvHatch',width:7,height:7,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'});
  pat.appendChild(mfSvg('line',{x1:0,y1:0,x2:0,y2:7,stroke:'rgba(255,255,255,.18)','stroke-width':1.2}));
  defs.appendChild(pat);
  var cp=mfSvg('clipPath',{id:'mfRvClip',clipPathUnits:'userSpaceOnUse'});
  cp.appendChild(mfSvg('rect',{'class':'mf-rv-clip',x:0,y:0,width:W,height:H}));
  defs.appendChild(cp);
  svg.appendChild(defs);

  /* selected-month marker sits under the water */
  var selW=mfClamp(step*0.72,18,64);           /* step is the whole plot when n is 1-2 */
  var sel=mfSvg('rect',{'class':'mf-rv-sel',id:'mf-rv-sel',x:0,y:padT-6,
                        width:selW,height:plotH+12,rx:5,opacity:0});
  svg.appendChild(sel);

  var water=mfSvg('g',{'clip-path':'url(#mfRvClip)'});

  /* the unfilled part of the channel */
  water.appendChild(mfSvg('path',{'class':'mf-rv-gap',d:mfRvArea(gapTop,investedTop,halfW)}));

  bands.forEach(function(bd){
    if(!bd.any) return;
    var p=mfSvg('path',{'class':'mf-rv-band',d:mfRvArea(bd.top,bd.bot,halfW),
                        fill:mfHexA(bd.color,.62),stroke:bd.color,'stroke-width':1});
    p.style.color=bd.color;
    bd.el=p;
    water.appendChild(p);
  });

  water.appendChild(mfSvg('path',{'class':'mf-rv-income',d:mfRvLine(incomeTop,halfW)}));
  svg.appendChild(water);

  /* income caption, pinned to the first month */
  var capY=Math.min.apply(null,incomeTop.map(function(p){return p[1];}));
  var cap=mfSvg('text',{'class':'mf-rv-caplbl',x:padL+2,y:Math.max(11,capY-7)});
  cap.textContent='INCOME CHANNEL';
  svg.appendChild(cap);

  /* a failed month gets a notch you cannot miss */
  bands.forEach(function(bd){
    bd.fails.forEach(function(pt){
      var g=mfSvg('g',{'class':'mf-rv-fail'});
      g.appendChild(mfSvg('circle',{cx:pt[0],cy:pt[1],r:6}));
      g.appendChild(mfSvg('path',{d:'M'+(pt[0]-2.6)+','+(pt[1]-2.6)+'L'+(pt[0]+2.6)+','+(pt[1]+2.6)+
                                    'M'+(pt[0]+2.6)+','+(pt[1]-2.6)+'L'+(pt[0]-2.6)+','+(pt[1]+2.6)}));
      svg.appendChild(g);
    });
  });

  /* right-edge category labels, where the band is thick enough to name */
  bands.forEach(function(bd){
    if(!bd.any) return;
    var t=bd.top[n-1][1], bo=bd.bot[n-1][1];
    if(bo-t < 11) return;
    var tx=mfSvg('text',{'class':'mf-rv-cat',x:W-padR+9,y:(t+bo)/2,
                         'dominant-baseline':'central',fill:mfHexA(bd.color,.95)});
    tx.textContent=bd.name;
    svg.appendChild(tx);
  });

  /* saved % — always on, sitting on the river's top edge */
  var pslots=Math.max(1,Math.floor(plotW/34));
  var pevery=Math.max(1,Math.ceil(n/pslots));
  for(var pi=0;pi<n;pi++){
    if(pi%pevery!==0 && pi!==n-1) continue;
    var prate=mfSaveRate(DATA[pi]);
    var ptop=Y(base[pi]);
    var pt2=mfSvg('text',{'class':'mf-rv-pct',x:X(pi),y:Math.max(10,ptop-7),fill:mfRateCol(prate)});
    pt2.textContent=Math.round(prate)+'%';
    svg.appendChild(pt2);
  }

  /* axis + month labels */
  svg.appendChild(mfSvg('line',{'class':'mf-rv-axis',x1:padL-4,y1:padT+plotH+1,x2:padL+plotW+4,y2:padT+plotH+1}));
  var slots=Math.max(1,Math.floor(plotW/46));
  var every=Math.max(1,Math.ceil(n/slots));
  for(var mi=0;mi<n;mi++){
    if(mi%every!==0 && mi!==n-1) continue;
    var t2=mfSvg('text',{'class':'mf-rv-mlbl','data-m':DATA[mi].month,x:X(mi),y:padT+plotH+15});
    t2.textContent=mfMonthShort(DATA[mi].month);
    svg.appendChild(t2);
  }

  svg.appendChild(mfSvg('line',{'class':'mf-rv-scrub',id:'mf-rv-scrub',x1:0,y1:padT-4,x2:0,y2:padT+plotH+4}));

  /* one hit surface: x picks the month, y picks the strand */
  var hitX=Math.max(0,padL-step/2);            /* keep the hit surface inside the SVG */
  var hit=mfSvg('rect',{'class':'mf-rv-hit',x:hitX,y:padT-6,
                        width:Math.min(W-hitX,plotW+step),height:plotH+12});
  svg.appendChild(hit);

  var tip=document.createElement('div');
  tip.className='mf-rv-tip';
  host.appendChild(tip);

  function colAt(sx){
    if(n===1) return 0;
    return Math.round(mfClamp((sx-padL)/step,0,n-1));
  }
  function bandAt(i,sy){
    for(var bi=0;bi<bands.length;bi++){
      var bd=bands[bi];
      if(!bd.any) continue;
      if(sy<=bd.bot[i][1] && sy>=bd.top[i][1] && bd.bot[i][1]-bd.top[i][1]>0.5) return bd;
    }
    return null;
  }
  function clearFocus(){
    svg.classList.remove('focus','scrubbing');
    bands.forEach(function(bd){ if(bd.el) bd.el.classList.remove('hot'); });
    tip.classList.remove('on');
  }

  function onMove(clientX,clientY){
    var r=svg.getBoundingClientRect();
    if(!r.width) return;
    var sx=(clientX-r.left)*(W/r.width);
    var sy=(clientY-r.top)*(H/r.height);
    var i=colAt(sx);
    var d=DATA[i];

    svg.classList.add('scrubbing');
    var sc=document.getElementById('mf-rv-scrub');
    if(sc){ sc.setAttribute('x1',X(i)); sc.setAttribute('x2',X(i)); }

    var bd=bandAt(i,sy);
    bands.forEach(function(x){ if(x.el) x.el.classList.toggle('hot', x===bd); });
    svg.classList.toggle('focus', !!bd);

    var inc=d.income>0?d.income:0, inv=mfInvested(d), rate=mfSaveRate(d);
    var rows=
      '<div class="mf-rv-tip-m">'+d.month+'</div>'+
      '<div class="mf-rv-tip-r"><span>Income</span><span>'+(inc>0?mfFmt(inc):'—')+'</span></div>'+
      '<div class="mf-rv-tip-r"><span>Invested</span><span>'+mfFmt(inv)+'</span></div>'+
      '<div class="mf-rv-tip-r"><span>Saved</span><span style="color:'+mfRateCol(rate)+'">'+rate.toFixed(1)+'%</span></div>';
    if(bd){
      var v=d[bd.key];
      rows+='<div class="mf-rv-tip-r" style="margin-top:4px"><span style="color:'+bd.color+'">'+bd.name+'</span>'+
            '<span>'+(v===-1?'FAILED':v>0?mfFmt(v):'NTM')+'</span></div>';
    }
    if(d.notes && d.notes!=='N/A') rows+='<div class="mf-rv-tip-n">📝 '+d.notes+'</div>';
    tip.innerHTML=rows;
    tip.classList.add('on');

    var tw=tip.offsetWidth||170;
    tip.style.left=mfClamp(X(i)-tw/2, 4, Math.max(4,W-tw-4))+'px';
    tip.style.top=(sy>H/2 ? 8 : H-tip.offsetHeight-8)+'px';
  }

  hit.addEventListener('mousemove',function(e){ onMove(e.clientX,e.clientY); });
  hit.addEventListener('mouseleave',clearFocus);
  hit.addEventListener('click',function(e){
    var r=svg.getBoundingClientRect();
    if(!r.width) return;
    var i=colAt((e.clientX-r.left)*(W/r.width));
    _mfBuzz('pop');
    mfSelectMonth(DATA[i].month);
  });
  hit.addEventListener('touchstart',function(e){
    var t=e.touches[0]; if(t) onMove(t.clientX,t.clientY);
  },{passive:true});
  hit.addEventListener('touchmove',function(e){
    var t=e.touches[0]; if(t) onMove(t.clientX,t.clientY);
  },{passive:true});
  hit.addEventListener('touchend',function(){ setTimeout(clearFocus,1600); },{passive:true});

  host.appendChild(svg);
  _rvGeom={padT:padT,plotH:plotH,step:step,W:W};
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ svg.classList.add('lit'); });
  });
}

/* keep river + grid pointing at the month the page is showing */
function mfHighlightMonth(month){
  var sel=document.getElementById('mf-rv-sel');
  if(sel && _rvGeom && _rvX[month]!==undefined){
    var w=mfClamp(_rvGeom.step*0.72,18,64);
    sel.setAttribute('x',(_rvX[month]-w/2).toFixed(1));
    sel.setAttribute('width',w.toFixed(1));
    sel.setAttribute('opacity','1');
  }
  var rv=document.getElementById('mf-rv');
  if(rv) rv.querySelectorAll('.mf-rv-mlbl').forEach(function(t){
    t.classList.toggle('on', t.getAttribute('data-m')===month);
  });
  var gr=document.getElementById('mf-grid');
  if(gr){
    gr.querySelectorAll('.mf-gr-c[data-m]').forEach(function(td){
      td.classList.toggle('sel', td.getAttribute('data-m')===month);
    });
    gr.querySelectorAll('.mf-gr-mh').forEach(function(th){
      th.classList.toggle('on', th.getAttribute('data-m')===month);
    });
  }
}

/* ═══ ⑤ FOLLOW-THROUGH GRID ═══════════════════════════════ */
function mfRenderGrid(DATA){
  var host=document.getElementById('mf-grid'); if(!host) return;
  if(!DATA.length){ host.innerHTML='<div class="mf-rv-empty">Nothing tracked yet.</div>'; return; }

  var SYM={'DONE':'✓','Partially Done':'◔','Pending':'·','Failed':'✕'};
  var CLS={'DONE':'done','Partially Done':'partial','Pending':'pending','Failed':'failed'};

  var peak={};
  MF_KEYS.forEach(function(k){
    var m=0;
    DATA.forEach(function(d){ if(d[k]>0 && d[k]>m) m=d[k]; });
    peak[k]=m||1;
  });

  var h='<table class="mf-gr"><thead><tr><th class="mf-gr-corner"></th>';
  DATA.forEach(function(d){
    h+='<th class="mf-gr-mh" data-m="'+d.month+'">'+mfMonthShort(d.month)+'</th>';
  });
  h+='</tr></thead><tbody>';

  MF_KEYS.forEach(function(k,ci){
    h+='<tr><th class="mf-gr-cat">'+(MF_EMOJIS[k]||'')+' '+MF_CATS[ci]+'</th>';
    DATA.forEach(function(d){
      var v=d[k];
      if(v===0){
        h+='<td class="mf-gr-c ntm" title="'+d.month+' · '+MF_CATS[ci]+' · not this month">—</td>';
        return;
      }
      var st=mfStatusOf(d,k);
      var shade=v>0 ? 0.14+(v/peak[k])*0.58 : 0.1;
      h+='<td class="mf-gr-c st-'+(CLS[st]||'pending')+'" data-m="'+d.month+'" data-k="'+k+'" '+
         'style="background:'+mfHexA(MF_COLORS[ci],shade)+'" '+
         'title="'+d.month+' · '+MF_CATS[ci]+' · '+(v===-1?'FAILED':mfFmt(v))+' · '+st+'">'+
         (SYM[st]||'?')+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody></table>';
  host.innerHTML=h;

  host.querySelectorAll('.mf-gr-c[data-m]').forEach(function(td){
    td.addEventListener('click',function(){
      _mfBuzz('pop');
      mfSelectMonth(td.getAttribute('data-m'), td.getAttribute('data-k'));
    });
  });
  host.querySelectorAll('.mf-gr-mh[data-m]').forEach(function(th){
    th.style.cursor='pointer';
    th.addEventListener('click',function(){ _mfBuzz('step'); mfSelectMonth(th.getAttribute('data-m')); });
  });
}

/* ═══════════════════════════════════════════
   PRESERVED — plan-card editing, add-month modal and the
   ticker, carried over unchanged apart from four one-line
   hooks (mfSlotState / haptics) marked in place.
═══════════════════════════════════════════ */
function mfInitPlan(DATA) {
  _mfAllPlanData=DATA;
  var sel=document.getElementById('mf-planMonthSel');
  if(sel){
    sel.innerHTML=DATA.slice().reverse().map(function(d){
      return '<option value="'+d.month+'">📅 '+d.month+'</option>';
    }).join('');
  }
  mfRenderPlanForMonth(DATA[DATA.length-1]);
}

function mfOnPlanMonthChange(){
  var sel=document.getElementById('mf-planMonthSel');
  if(!sel) return;
  var month=sel.value;
  var found=_mfAllPlanData.find(function(d){return d.month===month;});
  if(found) mfRenderPlanForMonth(found);
}

function mfUpdateOverallStatus(){
  var badge=document.getElementById('mf-planOverallBadge');
  if(!badge) return;
  var activeKeys=Object.keys(_mfCurStatus).filter(function(k){return !k.endsWith('_partial');});
  if(activeKeys.length===0){badge.textContent='';return;}
  var vals=activeKeys.map(function(k){return _mfCurStatus[k]||'Pending';});
  var cls,label;
  if(vals.some(function(v){return v==='Failed';})){cls='failed';label='❌ Failed';}
  else if(vals.every(function(v){return v==='DONE';})){cls='done';label='✅ All Done';}
  else if(vals.some(function(v){return v==='Partially Done';})){cls='partial';label='🔸 Partial';}
  else{cls='pending';label='⏳ Pending';}
  badge.className='plan-overall-badge '+cls;
  badge.textContent=label;
}

function mfCardClick(e,key){
  var card=document.getElementById('mf-pc-'+key);
  if(!card) return;
  var isNTM=card.dataset.ntm==='true';
  if(isNTM){
    // Switch to value mode
    mfSetValueMode(key);
  }
}

function mfSetNTM(e,key){
  e.stopPropagation();
  var card=document.getElementById('mf-pc-'+key);
  var inp=document.getElementById('mf-amt-'+key);
  if(!card) return;

  card.dataset.ntm='true';
  card.classList.remove('invested','failed-card');
  card.classList.add('ntm');

  var ntmView=card.querySelector('.pc-ntm-view');
  var valView=card.querySelector('.pc-value-view');
  var dd=card.querySelector('.pst-dd');
  var partial=card.querySelector('.pc-partial');

  if(ntmView) ntmView.classList.remove('hidden');
  if(valView) valView.classList.add('hidden');
  if(dd) dd.classList.add('hidden');
  if(partial) partial.classList.remove('show');
  if(inp) inp.value='';

  delete _mfCurStatus[key];
  delete _mfCurStatus[key+'_partial'];
  mfSlotState(key);
  mfUpdateOverallStatus();
}

function mfSetValueMode(key){
  var card=document.getElementById('mf-pc-'+key);
  var inp=document.getElementById('mf-amt-'+key);
  if(!card) return;

  card.dataset.ntm='false';
  card.classList.remove('ntm','failed-card');
  card.classList.add('invested');

  var ntmView=card.querySelector('.pc-ntm-view');
  var valView=card.querySelector('.pc-value-view');
  var dd=card.querySelector('.pst-dd');

  if(ntmView) ntmView.classList.add('hidden');
  if(valView) valView.classList.remove('hidden');
  if(dd) dd.classList.remove('hidden');
  if(inp){inp.focus();inp.select();}

  _mfCurStatus[key]='Pending';
  mfSlotState(key);
  mfUpdateOverallStatus();
}

function mfToggleDD(e,key){
  e.stopPropagation();
  var dd=document.getElementById('mf-pst-dd-'+key);
  var isOpen=dd.classList.contains('open');
  document.querySelectorAll('#page-mf .pst-dd.open').forEach(function(d){d.classList.remove('open');});
  if(!isOpen) dd.classList.add('open');
}

function mfSelectDD(key,sv){
  var dd=document.getElementById('mf-pst-dd-'+key);
  if(dd) dd.classList.remove('open');
  var isP=sv==='Partially Done';
  var cls=sv==='DONE'?'done':sv==='Failed'?'failed':isP?'partial':'pending';
  var SVL=sv==='DONE'?'✅ Done':sv==='Failed'?'❌ Failed':isP?'🔸 Partial':'⏳ Pending';
  var btn=dd&&dd.querySelector('.pst-dd-btn');
  if(btn){
    btn.className='pst-dd-btn '+cls;
    var span=btn.querySelector('span');
    if(span) span.textContent=SVL;
  }
  var pw=document.getElementById('mf-pst-partial-'+key);
  if(pw) pw.classList.toggle('show',isP);
  if(!isP) delete _mfCurStatus[key+'_partial'];
  _mfCurStatus[key]=sv;
  mfSlotState(key);
  _mfBuzz(sv==='DONE'?'success':'tick');
  mfUpdateOverallStatus();
  var ind=document.getElementById('mf-pst-saved-'+key);
  if(ind) ind.textContent='…';
  google.script.run
    .withSuccessHandler(function(){if(ind){ind.textContent='✓';setTimeout(function(){ind.textContent='';},1500);} })
    .withFailureHandler(function(){if(ind) ind.textContent='⚠';})
    .saveInvestmentStatus(_mfCurMonth,JSON.stringify(_mfCurStatus));
  if(sv==='Failed'){
    google.script.run
      .withSuccessHandler(function(){
        var card=document.getElementById('mf-pc-'+key);
        var amtInp=document.getElementById('mf-amt-'+key);
        if(amtInp){amtInp.disabled=true;amtInp.value='';}
        if(card){
          card.className='plan-card failed-card is-failed';
          var toNtmBtn=card.querySelector('.pc-to-ntm-btn');
          if(toNtmBtn) toNtmBtn.style.display='none';
          var valView=card.querySelector('.pc-value-view');
          if(valView&&!valView.querySelector('.pc-fail-badge')){
            valView.insertAdjacentHTML('beforeend','<span class="pc-fail-badge">FAILED</span>');
          }
        }
      })
      .withFailureHandler(function(e){console.warn('writeInvestmentFailed:',e);})
      .writeInvestmentFailed(_mfCurMonth,key);
  }
}

function mfPstPartialSave(key){
  var inp=document.getElementById('mf-pst-pinp-'+key);
  var msg=document.getElementById('mf-pst-pmsg-'+key);
  var ind=document.getElementById('mf-pst-saved-'+key);
  if(!inp) return;
  var amt=parseFloat(inp.value)||0;
  _mfCurStatus[key+'_partial']=amt;
  if(msg) msg.textContent='…';
  google.script.run
    .withSuccessHandler(function(){
      if(msg){msg.style.color='#00e676';msg.textContent='✓ Saved';setTimeout(function(){msg.textContent='';},2000);}
      if(ind){ind.textContent='✓';setTimeout(function(){ind.textContent='';},1500);}
    })
    .withFailureHandler(function(e){
      if(msg){msg.style.color='#ff4d6d';msg.textContent='⚠ '+(e.message||'Error');}
    })
    .saveInvestmentStatus(_mfCurMonth,JSON.stringify(_mfCurStatus));
}

function mfSaveAll(){
  var ta=document.getElementById('mf-planNotesTa');
  var msg=document.getElementById('mf-planNotesMsg');
  var amounts={};
  var errors=[];

  // Collect amounts and validate
  MF_KEYS.forEach(function(k){
    var card=document.getElementById('mf-pc-'+k);
    var inp=document.getElementById('mf-amt-'+k);
    if(!card||!inp) return;

    var isNTM=card.dataset.ntm==='true';
    var val=parseFloat(inp.value)||0;

    // Remove previous error highlight
    inp.classList.remove('input-error');

    if(isNTM){
      amounts[k]=0; // NTM = 0
    }else if(inp.disabled){
      // Failed card - skip, keep current value
    }else{
      if(val<=0){
        errors.push(k);
        inp.classList.add('input-error');
      }else{
        amounts[k]=val;
      }
    }
  });

  // Validation failed
  if(errors.length>0){
    if(msg){msg.className='pne-msg err';msg.textContent='⚠ Please enter values for highlighted cards';}
    // Scroll to first error
    var firstErr=document.getElementById('mf-amt-'+errors[0]);
    if(firstErr) firstErr.focus();
    return;
  }

  if(msg){msg.className='pne-msg';msg.textContent='Saving…';}
  google.script.run
    .withSuccessHandler(function(){
      google.script.run
        .withSuccessHandler(function(){_mfBuzz('success');if(msg){msg.className='pne-msg ok';msg.textContent='✓ Saved';setTimeout(function(){msg.textContent='';},2000);}})
        .withFailureHandler(function(e){if(msg){msg.className='pne-msg err';msg.textContent='⚠ '+(e.message||'Error');}})
        .saveMoneyFlowNotes(_mfCurMonth,ta?ta.value:'');
    })
    .withFailureHandler(function(e){if(msg){msg.className='pne-msg err';msg.textContent='⚠ '+(e.message||'Error');}})
    .saveMoneyFlowAmounts(_mfCurMonth,JSON.stringify(amounts),JSON.stringify(_mfCurStatus));
}

function mfAddOpen(){
  var bg=document.getElementById('mfadd-bg');
  if(!bg) return;
  bg.classList.add('open');
  mfAddInit();
}

function mfAddClose(){
  var bg=document.getElementById('mfadd-bg');
  if(bg) bg.classList.remove('open');
  _mfAddData = {};
}

function mfAddOutsideClose(e){
  if(e.target.id==='mfadd-bg') mfAddClose();
}

function mfAddInit(){
  // Calculate next month from last available data
  var lastMonth = _mfAllPlanData.length > 0 ? _mfAllPlanData[_mfAllPlanData.length-1].month : null;
  var nextMonth = mfCalcNextMonth(lastMonth);

  document.getElementById('mfadd-monthLabel').textContent = nextMonth;
  document.getElementById('mfadd-notesTa').value = '';
  document.getElementById('mfadd-incomeTa').value = '';
  document.getElementById('mfadd-msg').textContent = '';

  _mfAddData = { month: nextMonth, amounts: {} };

  // Initialize all categories as NTM
  MF_KEYS.forEach(function(k){ _mfAddData.amounts[k] = 0; });

  mfAddRenderCards();
}

function mfCalcNextMonth(lastMonth){
  if(!lastMonth) {
    var now = new Date();
    return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][now.getMonth()] + '/' + now.getFullYear();
  }
  // Parse "MMM/yyyy" format
  var parts = lastMonth.split('/');
  var monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var mIdx = monthNames.indexOf(parts[0]);
  var year = parseInt(parts[1]);

  if(mIdx === -1) mIdx = 0;
  mIdx++;
  if(mIdx > 11) { mIdx = 0; year++; }

  return monthNames[mIdx] + '/' + year;
}

function mfAddRenderCards(){
  var cardsEl = document.getElementById('mfadd-cards');
  if(!cardsEl) return;

  cardsEl.innerHTML = MF_KEYS.map(function(k, i){
    var val = _mfAddData.amounts[k] || 0;
    var isNTM = val === 0;
    var cardCls = isNTM ? 'ntm' : 'value';

    return '<div class="mfadd-card '+cardCls+'" id="mfadd-c-'+k+'" data-key="'+k+'" onclick="mfAddCardClick(\''+k+'\')">'+
      '<div class="mfadd-card-head">'+
        '<span class="mfadd-card-emoji">'+(MF_EMOJIS[k]||'💼')+'</span>'+
        '<span class="mfadd-card-name">'+MF_CATS[i]+'</span>'+
      '</div>'+
      '<div class="mfadd-ntm-view">'+
        '<span class="mfadd-ntm-badge">NTM</span>'+
        '<span class="mfadd-ntm-hint">tap to add</span>'+
      '</div>'+
      '<div class="mfadd-val-view">'+
        '<div class="mfadd-input-row">'+
          '<span class="mfadd-currency">₨</span>'+
          '<input type="number" class="mfadd-input" id="mfadd-inp-'+k+'" value="'+(val||'')+'" placeholder="0" onclick="event.stopPropagation()">'+
        '</div>'+
        '<button class="mfadd-to-ntm" onclick="mfAddSetNTM(event,\''+k+'\')">Mark NTM</button>'+
      '</div>'+
    '</div>';
  }).join('');
}

function mfAddCardClick(key){
  var card = document.getElementById('mfadd-c-'+key);
  if(!card) return;

  if(card.classList.contains('ntm')){
    // Switch to value mode
    card.classList.remove('ntm');
    card.classList.add('value');
    var inp = document.getElementById('mfadd-inp-'+key);
    if(inp) { inp.focus(); inp.select(); }
  }
}

function mfAddSetNTM(e, key){
  e.stopPropagation();
  var card = document.getElementById('mfadd-c-'+key);
  var inp = document.getElementById('mfadd-inp-'+key);
  if(!card) return;

  card.classList.remove('value');
  card.classList.add('ntm');
  if(inp) inp.value = '';
  _mfAddData.amounts[key] = 0;
}

function mfAddSave(){
  var msg = document.getElementById('mfadd-msg');
  var btn = document.getElementById('mfadd-saveBtn');
  var notesTa = document.getElementById('mfadd-notesTa');
  var errors = [];

  // Collect amounts and validate
  MF_KEYS.forEach(function(k){
    var card = document.getElementById('mfadd-c-'+k);
    var inp = document.getElementById('mfadd-inp-'+k);
    if(!card || !inp) return;

    inp.classList.remove('error');

    if(card.classList.contains('value')){
      var val = parseFloat(inp.value) || 0;
      if(val <= 0){
        errors.push(k);
        inp.classList.add('error');
      } else {
        _mfAddData.amounts[k] = val;
      }
    } else {
      _mfAddData.amounts[k] = 0; // NTM
    }
  });

  if(errors.length > 0){
    if(msg){ msg.className = 'mfadd-msg err'; msg.textContent = '⚠ Enter values for highlighted cards'; }
    var firstErr = document.getElementById('mfadd-inp-'+errors[0]);
    if(firstErr) firstErr.focus();
    return;
  }

  if(msg){ msg.className = 'mfadd-msg'; msg.textContent = 'Saving...'; }
  if(btn) btn.disabled = true;

  var incomeTa = document.getElementById('mfadd-incomeTa');
  var payload = {
    month: _mfAddData.month,
    amounts: _mfAddData.amounts,
    income: incomeTa ? (parseFloat(incomeTa.value) || 0) : 0,
    notes: notesTa ? notesTa.value : ''
  };

  google.script.run
    .withSuccessHandler(function(res){
      if(btn) btn.disabled = false;
      if(res && res.success){
        if(msg){ msg.className = 'mfadd-msg ok'; msg.textContent = '✓ Plan saved!'; }
        setTimeout(function(){
          mfAddClose();
          _spaLoaded.mf = false;
          mfLoad();
        }, 1500);
      } else {
        if(msg){ msg.className = 'mfadd-msg err'; msg.textContent = '⚠ '+(res && res.error ? res.error : 'Unknown error'); }
      }
    })
    .withFailureHandler(function(e){
      if(btn) btn.disabled = false;
      if(msg){ msg.className = 'mfadd-msg err'; msg.textContent = '⚠ '+(e.message || 'Error'); }
    })
    .addMoneyFlowMonth(JSON.stringify(payload));
}

function buildMFTicker(cur){
  var fmt = function(v){ return '₨'+Math.abs(v).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:0}); };
  var stIco = {'DONE':'<span class="tick-chg fr">✅</span>', 'Partially Done':'<span class="tick-chg" style="color:#fb923c">🔸</span>', 'Failed':'<span class="tick-chg fl">❌</span>', 'Pending':'<span class="tick-chg" style="color:#fbbf24">⏳</span>'};
  var items = MF_KEYS.map(function(k, i){
    var val = cur[k];
    if(!val || val === 0) return null;
    var isFailed = val === -1;
    var amtStr = isFailed ? 'FAILED' : fmt(val);
    var sv = (cur.status && cur.status[k]) || 'Pending';
    var ico = stIco[sv] || stIco['Pending'];
    return '<span class="tick-item">'
      + '<span class="tick-sym">' + MF_CATS[i] + '</span>'
      + ' ' + amtStr
      + ' ' + ico
      + '</span>';
  }).filter(Boolean);
  if(!items.length) return;
  _buildTick('mfTickerWrap', 'mfTickerTrack', items, 35);
}

function mfAnimCounter(el, target, dur) {
  if(dur===undefined) dur=1200;
  var s=performance.now();
  function tick(now){
    var p=Math.min((now-s)/dur,1), e=1-Math.pow(1-p,4);
    el.textContent='₨'+Math.round(target*e).toLocaleString('en-IN');
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function mfAnimPct(el, target, dur) {
  if(dur===undefined) dur=1200;
  var s=performance.now();
  function tick(now){
    var p=Math.min((now-s)/dur,1), e=1-Math.pow(1-p,4);
    el.textContent=(target*e).toFixed(1)+'%';
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ═══ ② WHERE IT WENT ════════════════════════════════════════
   Two views over identical data, switched in the panel header:
     ✿ rose  — Nightingale coxcomb, equal angles, AREA ∝ amount
     ▦ grid  — 100 squares, one per percent
   They share the allocation and the legend, so a comparison is
   about the picture and nothing else.
   (The toggle is a temporary aid — once one wins, the other goes.)
═══════════════════════════════════════════════════════════════ */
var _mfWhereView='rose';

function mfSetWhereView(v){
  if(v===_mfWhereView) return;
  _mfWhereView=v;
  _mfBuzz('step');
  if(_mfCurData) mfRenderWhere(_mfCurData);
}

/* ── shared data prep ───────────────────────────────────────
   Entries ALWAYS sum to the total, so a percentage is honest in
   either view. If income is recorded and exceeds what went out,
   the shortfall becomes its own entry; otherwise the total is
   simply what was invested. */
function mfWhereAlloc(cur){
  var inc = cur.income>0 ? cur.income : 0;
  var inv = mfInvested(cur);

  var ents=[], failed=[];
  MF_KEYS.forEach(function(k,i){
    var v=cur[k];
    if(v>0){
      ents.push({key:k,name:MF_CATS[i],ico:MF_EMOJIS[k],color:MF_COLORS[i],amt:v,muted:false});
    } else if(v===-1){
      failed.push({key:k,name:MF_CATS[i],ico:MF_EMOJIS[k],color:'#ff4d6d',amt:0,failed:true});
    }
    /* v === 0 is NTM — it never happened, so it gets nothing */
  });
  ents.sort(function(a,b){ return b.amt-a.amt; });

  var rest = inc-inv;
  if(rest > 0.5) ents.push({key:'__rest',name:'Not invested',ico:'💤',
                            color:'#64748b',amt:rest,muted:true});

  /* derive the total FROM the entries — never assume it matches income */
  var total=0; ents.forEach(function(e){ total+=e.amt; });
  if(!ents.length || total<=0) return {entries:[],failed:failed,total:0,basis:''};
  ents.forEach(function(e){ e.pct=e.amt/total*100; });

  return { entries:ents, failed:failed, total:total,
           basis: (inc>0 && inv<=inc) ? 'income' : 'invested' };
}

/* ── shared legend, so both views read identically ───────── */
function mfWhereLegend(A, footer){
  return '<div class="mf-lg">'+
    A.entries.map(function(e,ei){
      var dot = e.muted
        ? 'background:transparent;border:1.4px dashed rgba(255,255,255,.3)'
        : 'background:'+e.color+';box-shadow:0 0 8px '+mfHexA(e.color,.55);
      return '<button class="mf-lg-r" type="button" data-e="'+ei+'" data-k="'+e.key+'">'+
        '<i style="'+dot+'"></i>'+
        '<span class="mf-lg-n">'+(e.ico?e.ico+' ':'')+e.name+'</span>'+
        '<span class="mf-lg-p" style="color:'+(e.muted?'rgba(255,255,255,.45)':e.color)+'">'+
          (e.pct<1?e.pct.toFixed(1):Math.round(e.pct))+'%</span>'+
        '<span class="mf-lg-a">'+mfFmt(e.amt)+'</span>'+
      '</button>';
    }).join('')+
    A.failed.map(function(e){
      return '<button class="mf-lg-r failed" type="button" data-k="'+e.key+'">'+
        '<i></i><span class="mf-lg-n">'+e.ico+' '+e.name+'</span>'+
        '<span class="mf-lg-p" style="color:rgba(255,255,255,.25)">—</span>'+
        '<span class="mf-lg-a">FAILED</span></button>';
    }).join('')+
    '<div class="mf-lg-f">'+footer+'</div>'+
  '</div>';
}

/* ── shared focus wiring: chart ⇄ legend ⇄ plan slot ─────── */
function mfWhereWire(host, A, chartSel){
  var legs=host.querySelectorAll('.mf-lg-r');
  var marks=host.querySelectorAll(chartSel);

  function focus(ei,key){
    host.classList.add('focus');
    marks.forEach(function(m){ m.classList.toggle('hot', m.getAttribute('data-e')===String(ei)); });
    legs.forEach(function(l){ l.classList.toggle('hot', l.getAttribute('data-e')===String(ei)); });
    if(key && key!=='__rest'){
      var slot=document.getElementById('mf-pc-'+key);
      if(slot) slot.classList.add('mf-lit');
    }
  }
  function blur(){
    host.classList.remove('focus');
    marks.forEach(function(m){ m.classList.remove('hot'); });
    legs.forEach(function(l){ l.classList.remove('hot'); });
    MF_KEYS.forEach(function(k){
      var s=document.getElementById('mf-pc-'+k);
      if(s) s.classList.remove('mf-lit');
    });
  }
  function jump(key){
    if(!key || key==='__rest') return;
    _mfBuzz('pop');
    var slot=document.getElementById('mf-pc-'+key);
    if(slot) slot.scrollIntoView({block:'nearest',behavior:'smooth'});
    if(typeof mfFlashSlot==='function') mfFlashSlot(key);
  }

  legs.forEach(function(l){
    var ei=l.getAttribute('data-e'), key=l.getAttribute('data-k');
    l.addEventListener('mouseenter',function(){ focus(ei,key); });
    l.addEventListener('mouseleave',blur);
    l.addEventListener('click',function(){ jump(key); });
  });
  marks.forEach(function(m){
    var ei=m.getAttribute('data-e');
    var ent=A.entries[+ei];
    m.addEventListener('mouseenter',function(){ focus(ei, ent?ent.key:null); });
    m.addEventListener('mouseleave',blur);
    m.addEventListener('click',function(){ jump(ent?ent.key:null); });
  });
}

/* ═══ ✿ NIGHTINGALE ROSE ═════════════════════════════════════
   Equal angles, radius by sqrt so the AREA of each petal is
   proportional to its amount — the honest form of the chart,
   and the one Nightingale actually drew.
═══════════════════════════════════════════════════════════════ */
function mfRosePath(cx,cy,r0,r1,a0,a1){
  function pt(r,a){ var t=a*Math.PI/180; return [cx+r*Math.cos(t), cy+r*Math.sin(t)]; }
  if(a1-a0 >= 359.9){                       /* a lone entry is a full ring */
    return 'M'+(cx+r1)+','+cy+
           'A'+r1+','+r1+' 0 1 1 '+(cx-r1)+','+cy+
           'A'+r1+','+r1+' 0 1 1 '+(cx+r1)+','+cy+'Z'+
           'M'+(cx+r0)+','+cy+
           'A'+r0+','+r0+' 0 1 0 '+(cx-r0)+','+cy+
           'A'+r0+','+r0+' 0 1 0 '+(cx+r0)+','+cy+'Z';
  }
  var big=(a1-a0)>180?1:0;
  var o0=pt(r1,a0), o1=pt(r1,a1), i1=pt(r0,a1), i0=pt(r0,a0);
  return 'M'+o0[0].toFixed(2)+','+o0[1].toFixed(2)+
         'A'+r1+','+r1+' 0 '+big+' 1 '+o1[0].toFixed(2)+','+o1[1].toFixed(2)+
         'L'+i1[0].toFixed(2)+','+i1[1].toFixed(2)+
         'A'+r0+','+r0+' 0 '+big+' 0 '+i0[0].toFixed(2)+','+i0[1].toFixed(2)+'Z';
}

function mfDrawRose(host, A){
  var petals=A.entries.concat(A.failed);
  var n=petals.length;
  if(!n) return;

  var S=300, cx=S/2, cy=S/2;
  var RMIN=18, RMAX=S/2-30;
  var SPAN=360/n, GAP=n>1?1.6:0;
  var maxAmt=0; A.entries.forEach(function(e){ if(e.amt>maxAmt) maxAmt=e.amt; });
  if(maxAmt<=0) maxAmt=1;

  /* area of the petal between RMIN and r is ∝ amount */
  /* area ∝ amount, floored so a sub-1% slice is still a visible sliver */
  function R(v){ return Math.max(RMIN+4, Math.sqrt(RMIN*RMIN + (RMAX*RMAX-RMIN*RMIN)*(v/maxAmt))); }

  var svg='<svg class="mf-ro-svg" viewBox="0 0 '+S+' '+S+'" role="img">'+
    '<defs><clipPath id="mfRoseClip" clipPathUnits="userSpaceOnUse">'+
      '<circle class="mf-ro-clip" cx="'+cx+'" cy="'+cy+'" r="'+(RMAX+26)+'"/>'+
    '</clipPath></defs>';

  /* guide rings at a quarter, half, three-quarters and the max */
  [0.25,0.5,0.75,1].forEach(function(f){
    var r=R(maxAmt*f);
    svg+='<circle class="mf-ro-ring" cx="'+cx+'" cy="'+cy+'" r="'+r.toFixed(1)+'"/>';
    svg+='<text class="mf-ro-rl" x="'+(cx+3)+'" y="'+(cy-r+1).toFixed(1)+'">'+mfK(maxAmt*f)+'</text>';
  });

  svg+='<g clip-path="url(#mfRoseClip)">';
  petals.forEach(function(e,i){
    var mid=-90+i*SPAN+SPAN/2;
    var a0=-90+i*SPAN+GAP/2, a1=-90+(i+1)*SPAN-GAP/2;
    var isFail=!!e.failed;
    var r=isFail ? RMIN+7 : R(e.amt);
    var ei=isFail ? '' : String(A.entries.indexOf(e));
    svg+='<path class="mf-ro-p'+(isFail?' failed':'')+(e.muted?' muted':'')+'"'+
         (ei!==''?' data-e="'+ei+'"':'')+
         ' d="'+mfRosePath(cx,cy,RMIN,r,a0,a1)+'"'+
         ' fill="'+(isFail?'transparent':mfHexA(e.color,e.muted?.22:.55))+'"'+
         ' stroke="'+e.color+'" style="--c:'+e.color+';--d:'+(i*70)+'ms"></path>';
    /* the emoji sits just past its own petal */
    var t=(mid)*Math.PI/180, lr=r+13;
    svg+='<text class="mf-ro-ico" x="'+(cx+lr*Math.cos(t)).toFixed(1)+'" y="'+(cy+lr*Math.sin(t)).toFixed(1)+
         '" style="--d:'+(i*70+240)+'ms">'+(e.ico||'')+'</text>';
  });
  svg+='</g>';

  svg+='<circle class="mf-ro-hub" cx="'+cx+'" cy="'+cy+'" r="'+(RMIN-3)+'"/>';
  svg+='</svg>';

  host.className='mf-where mf-rose';
  host.innerHTML='<div class="mf-ro">'+svg+'</div>'+
    mfWhereLegend(A,'area ∝ amount · ring = '+mfK(maxAmt)+' · total '+mfFmt(A.total)+' '+A.basis);

  mfWhereWire(host, A, '.mf-ro-p[data-e]');
  var s=host.querySelector('.mf-ro-svg');
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ if(s) s.classList.add('lit'); });
  });
}

/* ═══ ▦ THE RUPEE GRID ═══════════════════════════════════════
   100 squares, one per percent, filled biggest-first; whatever was
   never invested stays hollow.
═══════════════════════════════════════════════════════════════ */
function mfDrawWaffle(host, A){
  /* largest remainder to exactly 100, with a floor of one square so a
     small but real allocation stays visible instead of rounding away */
  var raw=A.entries.map(function(e){ return e.pct; });
  var cells=raw.map(function(r){ return Math.max(1, Math.floor(r)); });
  var sum=0; cells.forEach(function(c){ sum+=c; });
  if(sum<100){
    var order=raw.map(function(r,i){ return {i:i,f:r-Math.floor(r)}; })
                 .sort(function(a,b){ return b.f-a.f; });
    var j=0;
    while(sum<100 && order.length){ cells[order[j%order.length].i]++; sum++; j++; }
  } else {
    while(sum>100){
      var bi=-1,big=-1;
      for(var i2=0;i2<cells.length;i2++) if(cells[i2]>1 && cells[i2]>big){ big=cells[i2]; bi=i2; }
      if(bi<0) break;
      cells[bi]--; sum--;
    }
  }

  var cellsHtml='', idx=0;
  A.entries.forEach(function(e,ei){
    for(var c=0;c<cells[ei];c++){
      cellsHtml+='<i class="mf-wf-c'+(e.muted?' hollow':'')+'" data-e="'+ei+'"'+
                 ' style="--c:'+e.color+';--d:'+(idx*8)+'ms"></i>';
      idx++;
    }
  });

  host.className='mf-where mf-waffle';
  host.innerHTML='<div class="mf-wf-grid">'+cellsHtml+'</div>'+
    mfWhereLegend(A,'100 squares = '+mfFmt(A.total)+' '+A.basis);

  mfWhereWire(host, A, '.mf-wf-c[data-e]');
  var g=host.querySelector('.mf-wf-grid');
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ if(g) g.classList.add('lit'); });
  });
}

/* ── entry point, called from mfRenderPlanForMonth ───────── */
function mfRenderWhere(cur){
  try{
    var host=document.getElementById('mf-where');
    if(!host || !cur) return;
    var ml=document.getElementById('mf-where-month');
    if(ml) ml.textContent=cur.month;

    document.querySelectorAll('#mf-wv .mf-wv-b').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-v')===_mfWhereView);
    });

    var A=mfWhereAlloc(cur);
    if(!A.entries.length){
      host.className='mf-where';
      host.innerHTML='<div class="mf-where-empty">Nothing recorded for this month yet.</div>';
      return;
    }
    if(_mfWhereView==='rose') mfDrawRose(host,A); else mfDrawWaffle(host,A);
  }catch(err){
    console.error('[mfWhere]',err);      /* never take the plan down with it */
  }
}

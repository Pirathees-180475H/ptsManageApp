<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#060b18;
  --blue:#00d4ff;
  --purple:#a855f7;
  --green:#00ff88;
  --red:#ff4d6d;
  --gold:#ffd700;
  --card:rgba(255,255,255,0.04);
  --border:rgba(255,255,255,0.08);
  --muted:rgba(255,255,255,0.35);
  --dim:rgba(255,255,255,0.10);
}

body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  overflow:hidden;
  position:relative;
}

/* ── animated orbs ── */
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.o1{position:absolute;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,212,255,.12) 0%,transparent 70%);
    top:-120px;left:-100px;animation:drift1 18s ease-in-out infinite;}
.o2{position:absolute;width:380px;height:380px;border-radius:50%;
    background:radial-gradient(circle,rgba(168,85,247,.10) 0%,transparent 70%);
    bottom:-80px;right:-80px;animation:drift2 22s ease-in-out infinite;}
.o3{position:absolute;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(0,255,136,.07) 0%,transparent 70%);
    top:40%;left:60%;animation:drift3 16s ease-in-out infinite;}
@keyframes drift1{0%,100%{transform:translate(0,0);}50%{transform:translate(40px,30px);}}
@keyframes drift2{0%,100%{transform:translate(0,0);}50%{transform:translate(-30px,-40px);}}
@keyframes drift3{0%,100%{transform:translate(0,0);}50%{transform:translate(-20px,25px);}}

/* dot grid */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:28px 28px;}

/* ── card ── */
.card{
  position:relative;z-index:1;
  width:92%;max-width:420px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:24px;
  padding:40px 36px 36px;
  backdrop-filter:blur(24px);
  box-shadow:0 24px 64px rgba(0,0,0,.5),
             inset 0 1px 0 rgba(255,255,255,.07);
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;border-radius:24px 24px 0 0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);}

@keyframes popIn{from{opacity:0;transform:scale(.88) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}

/* ── lock icon ── */
.lock-wrap{display:flex;justify-content:center;margin-bottom:22px;}
.lock-ring{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(168,85,247,.15));
  border:1.5px solid rgba(0,212,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;
  box-shadow:0 0 28px rgba(0,212,255,.18),inset 0 1px 0 rgba(255,255,255,.08);
  animation:lockPulse 3s ease-in-out infinite;
}
@keyframes lockPulse{0%,100%{box-shadow:0 0 28px rgba(0,212,255,.18),inset 0 1px 0 rgba(255,255,255,.08);}
                     50%{box-shadow:0 0 44px rgba(0,212,255,.34),inset 0 1px 0 rgba(255,255,255,.12);}}

/* ── title ── */
.title{text-align:center;margin-bottom:6px;
  font-size:1.35em;font-weight:800;letter-spacing:-.4px;
  background:linear-gradient(135deg,#fff 30%,rgba(255,255,255,.55));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.subtitle{text-align:center;color:var(--muted);font-size:.78em;
  letter-spacing:.2px;margin-bottom:28px;font-weight:400;}

/* ── input ── */
.input-wrap{position:relative;margin-bottom:16px;}
.pw-input{
  width:100%;padding:13px 16px;
  background:rgba(0,212,255,.04);
  border:1.5px solid rgba(0,212,255,.2);
  border-radius:12px;
  color:#fff;font-size:1em;font-weight:600;
  font-family:inherit;letter-spacing:2px;
  transition:border-color .2s,box-shadow .2s,background .2s;
  outline:none;
}
.pw-input:focus{
  border-color:var(--blue);
  background:rgba(0,212,255,.07);
  box-shadow:0 0 0 3px rgba(0,212,255,.14),inset 0 1px 0 rgba(0,212,255,.08);
}
.pw-input::placeholder{color:rgba(255,255,255,.2);font-weight:400;letter-spacing:.5px;}
.pw-input.wrong{border-color:var(--red);background:rgba(255,77,109,.06);
  box-shadow:0 0 0 3px rgba(255,77,109,.14);}

/* ── button ── */
.btn{
  width:100%;padding:13px;border:none;border-radius:12px;
  font-family:inherit;font-size:.9em;font-weight:700;
  letter-spacing:.8px;text-transform:uppercase;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),#0099cc,var(--purple));
  background-size:200% 200%;
  color:#fff;
  box-shadow:0 4px 20px rgba(0,212,255,.25);
  transition:transform .18s,box-shadow .18s,opacity .18s;
  animation:gradShift 4s ease infinite;
}
@keyframes gradShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,212,255,.38);}
.btn:active:not(:disabled){transform:translateY(0);}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}

/* ── feedback ── */
.feedback{
  margin-top:14px;padding:11px 14px;border-radius:10px;
  font-size:.8em;font-weight:600;letter-spacing:.2px;
  display:none;text-align:center;
  animation:feedIn .3s cubic-bezier(.34,1.4,.64,1);
}
@keyframes feedIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
.feedback.err{
  background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.25);color:#ff8fa3;
  display:block;
}
.feedback.ok{
  background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.25);color:var(--green);
  display:block;
}

/* ── attempt counter ── */
.attempt-bar{display:flex;justify-content:center;gap:5px;margin-top:18px;}
.a-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.12);
  transition:background .3s,transform .3s;}
.a-dot.hit{background:var(--red);transform:scale(1.25);}

/* ── shake ── */
@keyframes shake{
  0%,100%{transform:translateX(0);}
  15%{transform:translateX(-9px);}
  35%{transform:translateX(9px);}
  55%{transform:translateX(-6px);}
  75%{transform:translateX(6px);}
}
.shake{animation:shake .4s ease;}
</style>
</head>
<body>

<div class="orbs"><div class="o1"></div><div class="o2"></div><div class="o3"></div></div>

<div class="card" id="card">
  <div class="lock-wrap">
    <div class="lock-ring" id="lockIcon">🔐</div>
  </div>

  <div class="title">Portfolio Access</div>
  <div class="subtitle" id="subtitle">Prove you're you. The money won't unlock itself.</div>

  <div class="input-wrap">
    <input class="pw-input" type="password" id="password"
           placeholder="••••••••••" autocomplete="off"
           onkeypress="if(event.key==='Enter')checkPassword()">
  </div>

  <button class="btn" id="submitBtn" onclick="checkPassword()">🔓 Unlock Dashboard</button>

  <div class="feedback" id="feedback"></div>

  <div class="attempt-bar" id="attemptBar">
    <div class="a-dot" id="d0"></div>
    <div class="a-dot" id="d1"></div>
    <div class="a-dot" id="d2"></div>
    <div class="a-dot" id="d3"></div>
    <div class="a-dot" id="d4"></div>
  </div>
</div>

<script>
var _attempts = 0;
var _locked = false;

var FAIL_MSGS = [
  "🤔 That's not it. Did you forget already?",
  "😅 Still nope. Maybe it's your cat's name?",
  "🫠 Wrong again. Are you even the owner here?",
  "👀 Buddy... this is getting embarrassing.",
  "🚨 SECURITY BREACH DETECTED. Just kidding. But also stop.",
  "🧠 Hint: it's not '1234'. Or is it? ...It's not.",
  "😂 You're locked out of your own money. Classic.",
  "🕵️ I'm logging this. (I'm not. But I could be.)",
  "☕ Take a break. Come back with the actual password.",
  "🤖 I've seen smarter brute-force attacks. Genuinely."
];

var SUBTITLES = [
  "Prove you're you. The money won't unlock itself.",
  "Still trying? Respect the persistence. 💪",
  "Two wrong. One more and the vibes go bad.",
  "Bro. BRO. Do you not know your own password?",
  "At this point I'm judging you. Just a little."
];

function getFailMsg() {
  return FAIL_MSGS[Math.min(_attempts - 1, FAIL_MSGS.length - 1)];
}

function updateSubtitle() {
  var idx = Math.min(Math.floor(_attempts / 2), SUBTITLES.length - 1);
  if (_attempts > 0) {
    document.getElementById('subtitle').textContent = SUBTITLES[Math.min(_attempts, SUBTITLES.length-1)];
  }
}

function checkPassword() {
  if (_locked) return;
  var pw = document.getElementById('password').value;
  var fb = document.getElementById('feedback');
  var btn = document.getElementById('submitBtn');

  if (!pw) {
    showFeedback('err', '🙄 You need to actually type something first.');
    shakeInput();
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳ Checking…';
  fb.className = 'feedback';

  google.script.run
    .withSuccessHandler(function(ok) {
      btn.disabled = false;
      btn.textContent = '🔓 Unlock Dashboard';
      if (ok) {
        showFeedback('ok', '✅ Welcome back, boss! Loading your empire…');
        document.getElementById('lockIcon').textContent = '🔓';
        document.getElementById('lockIcon').style.boxShadow = '0 0 44px rgba(0,255,136,.4)';
        setTimeout(function(){ google.script.host.close(); }, 800);
      } else {
        _attempts++;
        hitDot(_attempts - 1);
        updateSubtitle();
        shakeInput();
        showFeedback('err', getFailMsg());
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
        if (_attempts >= 5) {
          _locked = true;
          btn.disabled = true;
          btn.textContent = '🚫 Too Many Attempts';
          showFeedback('err', '🚔 You've been locked out. Close the window and reflect on your choices.');
        }
      }
    })
    .withFailureHandler(function() {
      btn.disabled = false;
      btn.textContent = '🔓 Unlock Dashboard';
      showFeedback('err', '😬 Something broke on our end. Not your fault this time.');
    })
    .verifyPasswordAndShowPortfolio(pw);
}

function showFeedback(type, msg) {
  var fb = document.getElementById('feedback');
  fb.className = 'feedback ' + type;
  fb.textContent = msg;
}

function shakeInput() {
  var inp = document.getElementById('password');
  inp.classList.add('wrong','shake');
  setTimeout(function(){ inp.classList.remove('shake'); }, 450);
  setTimeout(function(){ inp.classList.remove('wrong'); }, 1400);
}

function hitDot(i) {
  var d = document.getElementById('d'+i);
  if (d) d.classList.add('hit');
}

document.getElementById('password').focus();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #fff;
    }

    .container {
      background: #212121;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      width: 90%;
      max-width: 400px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    h2 {
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 10px;
      color: #fff;
    }

    p {
      color: #aaa;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .input-group {
      position: relative;
      margin-bottom: 24px;
    }

    input[type="password"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #3a3a3a;
      border-radius: 8px;
      background: #1a1a1a;
      color: #fff;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="password"]:focus {
      border-color: #3ea6ff;
      background: #0f0f0f;
      box-shadow: 0 0 0 4px rgba(62, 166, 255, 0.1);
    }

    input[type="password"]::placeholder {
      color: #666;
    }

    button {
      width: 100%;
      background: linear-gradient(90deg, #3ea6ff 0%, #0066cc 100%);
      color: white;
      padding: 14px;
      font-size: 16px;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    button:hover {
      background: linear-gradient(90deg, #5cb8ff 0%, #0080ff 100%);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(62, 166, 255, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    .error {
      background: rgba(255, 59, 48, 0.1);
      border-left: 3px solid #ff3b30;
      color: #ff6b6b;
      padding: 12px 16px;
      margin-top: 16px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    .error.show {
      display: block;
    }

    .loading {
      display: none;
      margin-top: 16px;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      border: 3px solid #3a3a3a;
      border-top: 3px solid #3ea6ff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔐</div>
    <h2>Portfolio Access</h2>
    <p>Enter your password to continue</p>
    
    <div class="input-group">
      <input 
        type="password" 
        id="password" 
        placeholder="Enter password" 
        onkeypress="handleKeyPress(event)"
        autocomplete="off"
      >
    </div>
    
    <button onclick="checkPassword()" id="submitBtn">
      Access Dashboard
    </button>

    <div id="loading" class="loading">
      <div class="spinner"></div>
    </div>
    
    <div id="error" class="error">
      ❌ Incorrect password. Please try again.
    </div>
  </div>

  <script>
    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        checkPassword();
      }
    }

    function checkPassword() {
      var password = document.getElementById('password').value;
      var errorDiv = document.getElementById('error');
      var loadingDiv = document.getElementById('loading');
      var submitBtn = document.getElementById('submitBtn');

      if (!password) {
        showError('Please enter a password');
        return;
      }

      // Hide error and show loading
      errorDiv.classList.remove('show');
      loadingDiv.classList.add('show');
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.6';
      
      google.script.run
        .withSuccessHandler(function(isCorrect) {
          loadingDiv.classList.remove('show');
          submitBtn.disabled = false;
          submitBtn.style.opacity = '1';
          
          if (isCorrect) {
            google.script.host.close();
          } else {
            showError('❌ Incorrect password. Please try again.');
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
          }
        })
        .withFailureHandler(function(error) {
          loadingDiv.classList.remove('show');
          submitBtn.disabled = false;
          submitBtn.style.opacity = '1';
          showError('An error occurred. Please try again.');
        })
        .verifyPasswordAndShowPortfolio(password);
    }

    function showError(message) {
      var errorDiv = document.getElementById('error');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
      
      // Auto-hide after 3 seconds
      setTimeout(function() {
        errorDiv.classList.remove('show');
      }, 3000);
    }

    // Auto-focus on password field
    document.getElementById('password').focus();
  </script>
</body>
</html>

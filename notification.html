<style>
  /* Toast Notification Container */
  #notif-container {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 10005;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
    max-width: 400px;
  }

  .notif-toast {
    background: #0d1220;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 12px 16px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: auto;
    animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    backdrop-filter: blur(10px);
    border-left: 4px solid var(--purple);
  }

  @keyframes toastIn {
    from { opacity: 0; transform: translateX(50px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes toastOut {
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(50px); }
  }

  .notif-toast.closing {
    animation: toastOut 0.2s forwards;
  }

  .notif-toast-msg {
    flex: 1;
    font-size: 0.85em;
    color: rgba(255, 255, 255, 0.9);
    white-space: nowrap;
    overflow: hidden;
    position: relative;
    height: 1.2em; /* Ensure consistent height */
  }

  .notif-marquee {
    display: inline-block;
    padding-left: 100%;
    animation: marquee 15s linear infinite;
  }

  @keyframes marquee {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-100%, 0); }
  }

  .notif-toast-close {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.4);
    cursor: pointer;
    font-size: 1.1em;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    transition: color 0.2s;
  }

  .notif-toast-close:hover {
    color: #ff4d6d;
  }

  .notif-toast-btn {
    font-size: 0.7em;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .notif-toast-btn.danger {
    background: rgba(255, 77, 109, 0.15);
    border-color: rgba(255, 77, 109, 0.3);
    color: #ff4d6d;
  }
  .notif-toast-btn.danger:hover {
    background: rgba(255, 77, 109, 0.25);
    transform: translateY(-1px);
  }
  .notif-toast-btn.success {
    background: rgba(0, 230, 118, 0.15);
    border-color: rgba(0, 230, 118, 0.3);
    color: #00e676;
  }
  .notif-toast-btn.success:hover {
    background: rgba(0, 230, 118, 0.25);
    transform: translateY(-1px);
  }
</style>

<div id="notif-container"></div>

<script>
  function renderNotifications(notes) {
    var now = new Date();
    var container = document.getElementById('notif-container');

    // ── 1. Filter notes ──────────────────────────────────────────
    var toNotify = notes.filter(function(n) {
      var parts = n.date.split('-');
      var nYear = parseInt(parts[0], 10);
      var nMonth = parseInt(parts[1], 10) - 1;
      var nDay = parseInt(parts[2], 10);
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var target;

      if (n.yearly) {
        target = new Date(now.getFullYear(), nMonth, nDay);
      } else {
        target = new Date(nYear, nMonth, nDay);
      }

      var diffDays = (target - today) / (1000 * 60 * 60 * 24);

      if (diffDays <= 7 && diffDays >= 0 && !n.weeklyNotified) return true;
      if (diffDays <= 30 && diffDays >= 0 && !n.monthlyNotified) return true;
      return false;
    });

    // ── 2. Group by reference ────────────────────────────────────
    // Items with the same non-empty reference are treated as a single entity.
    // Items with empty/blank reference stay as individual entries.
    var groupMap = {};
    toNotify.forEach(function(n) {
      var refKey = (n.reference || '').trim();
      if (!refKey) {
        // No reference — treat as standalone, use "row" as unique key
        refKey = '__single__' + n.row;
      }
      if (!groupMap[refKey]) {
        groupMap[refKey] = {
          reference: n.reference,
          rows: [],
          dates: [],
          weeklyDone: true,
          monthlyDone: true
        };
      }
      groupMap[refKey].rows.push(n.row);
      groupMap[refKey].dates.push(n.date);
      // A group is "weekly not done" if ANY row is not weeklyNotified
      if (!n.weeklyNotified) groupMap[refKey].weeklyDone = false;
      if (!n.monthlyNotified) groupMap[refKey].monthlyDone = false;
    });

    // ── 3. Render one toast per group ────────────────────────────
    Object.keys(groupMap).forEach(function(key) {
      createToast(groupMap[key]);
    });
  }

  function createToast(group) {
    var container = document.getElementById('notif-container');

    // Prevent duplicate: check by the first row in the group
    var existingCheck = document.querySelector('[data-rows="' + group.rows.join(',') + '"]');
    if (existingCheck) return;

    var toast = document.createElement('div');
    toast.className = 'notif-toast';
    toast.dataset.rows = group.rows.join(',');
    toast.dataset.reference = group.reference;

    // Build message: date range or single date, then reference
    var dateDisplay;
    if (group.dates.length === 1) {
      dateDisplay = group.dates[0];
    } else {
      // Sort dates and show first → last
      var sorted = group.dates.slice().sort();
      dateDisplay = sorted[0] + ' → ' + sorted[sorted.length - 1];
    }

    var countBadge = group.rows.length > 1
      ? ' <span style="background:rgba(255,255,255,0.1);border-radius:10px;padding:1px 6px;font-size:0.7em;">' + group.rows.length + '</span>'
      : '';

    var msg = dateDisplay + ': ' + group.reference + countBadge;

    var wClass = group.weeklyDone ? 'success' : 'danger';
    var mClass = group.monthlyDone ? 'success' : 'danger';

    toast.innerHTML =
      '<div class="notif-toast-msg" title="' + group.reference + ' (' + group.rows.length + ' entries)"><span class="notif-marquee">' + msg + '</span></div>' +
      '<div style="display:flex;gap:6px;">' +
        '<button class="notif-toast-btn ' + wClass + '" onclick="notifToggleStatusBulk(\'' + group.rows.join(',') + '\', \'weeklyNotified\', this)">w-notified' + countBadge + '</button>' +
        '<button class="notif-toast-btn ' + mClass + '" onclick="notifToggleStatusBulk(\'' + group.rows.join(',') + '\', \'monthlyNotified\', this)">m-notified' + countBadge + '</button>' +
      '</div>' +
      '<button class="notif-toast-close" onclick="closeToast(this)">✕</button>';

    container.appendChild(toast);
  }

  function closeToast(btn) {
    if (!btn) return;
    var toast = btn.closest('.notif-toast');
    if (!toast) return;

    if (toast.classList.contains('closing')) return;

    toast.classList.add('closing');
    setTimeout(function() {
      if (toast && toast.parentNode) {
        toast.remove();
      }
    }, 200);
  }

  function notifToggleStatusBulk(rowsCsv, field, btn) {
    if (!btn || !btn.classList) return;
    var isCurrentlyDone = btn.classList.contains('success');
    var newValue = !isCurrentlyDone;

    var rows = rowsCsv.split(',').map(function(r) { return parseInt(r, 10); });

    // Disable buttons to prevent double-clicks
    var parent = btn.parentElement;
    if (!parent) return;

    var buttons = parent.querySelectorAll('button');
    buttons.forEach(function(b) { b.disabled = true; b.style.opacity = '0.5'; });

    var originalText = btn.innerText;
    btn.innerText = 'Updating...';

    google.script.run
      .withSuccessHandler(function(res) {
        if (!btn || !btn.classList) return;

        if (res.success) {
          btn.innerText = 'notified ✓';
          btn.classList.remove('danger');
          btn.classList.add('success');

          setTimeout(function() {
            closeToast(btn);
          }, 1000);
        } else {
          btn.innerText = originalText;
          if (btn.parentElement) {
            var btns = btn.parentElement.querySelectorAll('button');
            btns.forEach(function(b) { b.disabled = false; b.style.opacity = '1'; });
          }
          console.error('Bulk update failed:', res.error);
        }
      })
      .withFailureHandler(function(err) {
        if (!btn) return;
        btn.innerText = originalText;
        if (btn.parentElement) {
          var btns = btn.parentElement.querySelectorAll('button');
          btns.forEach(function(b) { b.disabled = false; b.style.opacity = '1'; });
        }
        console.error('Script error:', err);
      })
      .updateNoteStatusBulk(rows, field, newValue);
  }

  function checkNotifications() {
     google.script.run.withSuccessHandler(function(res) {
      if (res.success) {
        renderNotifications(res.data);
      }
    }).getNotesData();
  }
</script>

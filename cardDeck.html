<!-- ═══════════════════════════════════════════════════════════════
     CARD DECK  —  the credit cards, rendered as actual cards
     ───────────────────────────────────────────────────────────
     Real 1.586:1 card faces in glossy brand gradients, laid in an
     isometric pile by default with a leader label per card, so every
     card's due reads at a glance.

       • tap a card      → it moves to the top of the pile / front of
                           the stack and its detail panel swaps in
       • Pile · Fan · Stack → isometric pile (default), a fanned hand,
                           or a Wallet-style stack where each card's top
                           edge shows its bank and due
       • drag sideways   → flick through the cards
       • hover (desktop) → parallax tilt + a holo sheen that
                           tracks the cursor across the face (fan/stack)

     The detail panel beside the deck is the card sheet that
     cardAnalysis.html renders into each .cd-detail[data-i]. This file
     owns only the contract, not the contents:
       #cd-deck      holds one .cd-card[data-i][data-brand][data-soft],
                     each wrapping a .cd-face with .cd-sheen and .cd-pip
       #cd-dots      one .cd-dot per card
       #cd-views     the Pile / Fan / Stack switch, one button[data-v] each
       #cd-details   one .cd-detail[data-i] per card; the active one
                     gets .on and the brand's --bk-soft border
     Anything may live inside a .cd-detail — the deck only switches
     which one is shown.

     Included from render.html via:  <?!= include('cardDeck'); ?>
     Driven by cardDeckInit() at the end of ccDisplayData().
═══════════════════════════════════════════════════════════════ -->
<style>
/* ═══ Deck shell ═══════════════════════════════════════════ */
/* --cd-w lives here so the wide-screen grid can size its deck
   column from the same value the deck and toolbar use. */
.cd-wrap{ --cd-w:360px; margin-bottom:14px; animation:fadeUp .5s ease .12s both; }

.cd-deck{
  position:relative;
  width:100%;
  max-width:var(--cd-w,360px);
  margin:0 auto;
  height:var(--cd-deck-h,300px);
  perspective:1400px;
  touch-action:pan-y;
  -webkit-tap-highlight-color:transparent;
  transition:height .42s cubic-bezier(.34,1.4,.64,1);
}

/* ═══ A card ═══════════════════════════════════════════════ */
.cd-card{
  position:absolute;
  left:0; right:0; top:0;
  height:var(--cd-h,227px);
  border-radius:16px;
  cursor:pointer;
  transform-style:preserve-3d;
  transform:translate3d(var(--cd-x,0px),var(--cd-y,0px),0) scale(var(--cd-s,1)) rotate(var(--cd-r,0deg))
            rotateX(var(--cd-ix,0deg)) rotateZ(var(--cd-iz,0deg));
  transition:transform .46s cubic-bezier(.34,1.4,.64,1),
             opacity .3s ease, filter .3s ease;
  will-change:transform;
}
.cd-card.cd-dragging{ transition:none; }

/* the physical face */
.cd-face{
  position:absolute;inset:0;
  border-radius:16px;
  overflow:hidden;
  background:var(--brand-bg,linear-gradient(135deg,#a855f7,#7c3aed));
  box-shadow:0 10px 30px rgba(0,0,0,.45),
             0 2px 6px rgba(0,0,0,.4),
             inset 0 0 0 1px rgba(255,255,255,.14),
             inset 0 1px 0 rgba(255,255,255,.4),
             inset 0 -1px 0 rgba(0,0,0,.25);
  transform:rotateX(var(--cd-rx,0deg)) rotateY(var(--cd-ry,0deg));
  transition:transform .3s cubic-bezier(.2,.8,.3,1), box-shadow .3s ease;
  will-change:transform;
}
.cd-card.cd-tilting .cd-face{ transition:box-shadow .3s ease; }
.cd-card.cd-active .cd-face{
  box-shadow:0 18px 46px rgba(0,0,0,.55),
             0 0 0 1px var(--brand-soft,rgba(255,255,255,.18)),
             0 0 34px var(--brand-glow,rgba(168,85,247,.28)),
             inset 0 1px 0 rgba(255,255,255,.28),
             inset 0 -1px 0 rgba(0,0,0,.3);
}

/* darkening veil so cards behind recede */
.cd-face::before{
  content:'';position:absolute;inset:0;border-radius:16px;
  background:rgba(3,6,14,var(--cd-dim,0));
  transition:background .36s ease;
  pointer-events:none;z-index:3;
}

/* holo sheen — a moving specular band, follows the cursor */
.cd-sheen{
  position:absolute;inset:-40%;
  background:
    radial-gradient(circle at var(--mx,50%) var(--my,50%),
      rgba(255,255,255,.34) 0%, rgba(255,255,255,.10) 22%, rgba(255,255,255,0) 48%),
    linear-gradient(105deg, transparent 38%, rgba(255,255,255,.16) 46%,
      rgba(255,255,255,.30) 50%, rgba(255,255,255,.16) 54%, transparent 62%);
  opacity:0;
  transition:opacity .3s ease;
  pointer-events:none;
  mix-blend-mode:overlay;
  z-index:2;
}
.cd-card.cd-tilting .cd-sheen{ opacity:1; }

/* gloss: a lacquered top-left highlight, a diagonal band of light and
   fine engraved waves, so the gradient reads as a polished card */
.cd-guilloche{
  position:absolute;inset:0;
  pointer-events:none;z-index:1;
  background-image:
    linear-gradient(158deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,.07) 34%, rgba(255,255,255,0) 35%),
    linear-gradient(118deg, transparent 46%, rgba(255,255,255,.10) 46% 56%, transparent 56%),
    radial-gradient(120% 90% at 0% 0%, rgba(255,255,255,.14), transparent 55%),
    repeating-radial-gradient(ellipse at 120% 130%,
      transparent 0 9px, rgba(255,255,255,.03) 9px 10px);
}

/* ═══ Face contents ════════════════════════════════════════ */
/* bank + due on the top edge, so a Stack shows them on every card */
.cd-body{ position:absolute;inset:0;z-index:4;padding:13px 17px 14px;
          display:flex;flex-direction:column;color:#fff; }
.cd-mono{ font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums; }

.cd-row1{ display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:20px; }
.cd-brand{
  font-size:15px;font-weight:800;letter-spacing:1px;line-height:1;
  text-shadow:0 1px 3px rgba(0,0,0,.45);
}
.cd-top-due{ font-size:13px;font-weight:800;white-space:nowrap;line-height:1; }
.cd-top-due.paid{ color:#c9f5e1; }

.cd-row2{ display:flex;align-items:center;gap:10px;margin-top:12px; }
.cd-chip{
  width:34px;height:26px;border-radius:5px;flex-shrink:0;
  background:linear-gradient(135deg,#f3d98b 0%,#c9a84c 42%,#f7e6a8 62%,#b8912f 100%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.22), 0 1px 2px rgba(0,0,0,.35);
  position:relative;
}
.cd-chip::before,.cd-chip::after{
  content:'';position:absolute;background:rgba(0,0,0,.28);
}
.cd-chip::before{ left:0;right:0;top:50%;height:1px; }
.cd-chip::after { top:4px;bottom:4px;left:50%;width:1px; }
.cd-nfc{ width:16px;height:16px;opacity:.6; }

.cd-mid{ flex:1;display:flex;flex-direction:column;justify-content:center;margin-top:2px;min-width:0; }
.cd-due-lbl{
  display:flex;align-items:center;gap:8px;
  font-size:8.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.62);margin-bottom:4px;
}
.cd-due{
  font-size:25px;font-weight:800;letter-spacing:-1px;line-height:1.05;
  text-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap;
}
.cd-avail{
  margin-top:6px;font-size:10px;font-weight:500;letter-spacing:.3px;
  color:rgba(255,255,255,.62);white-space:nowrap;
}
.cd-avail b{ color:#c9f5e1;font-weight:700;margin-left:6px; }

.cd-row3{ display:flex;align-items:flex-end;justify-content:space-between;gap:10px; }
.cd-bank{
  font-size:10px;font-weight:500;color:rgba(255,255,255,.66);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.cd-due-date{ text-align:right;flex-shrink:0;font-size:10.5px;font-weight:700;white-space:nowrap; }

/* status pip — beside the TOTAL DUE label */
.cd-pip{
  z-index:5;flex-shrink:0;
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 7px;border-radius:999px;
  font-size:7.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.16);
}
.cd-pip i{ width:5px;height:5px;border-radius:50%;display:block;font-style:normal; }
.cd-pip.settled{ color:#7cffb2; } .cd-pip.settled i{ background:#00e676;box-shadow:0 0 6px #00e676; }
.cd-pip.pending{ color:#ffd08a; } .cd-pip.pending i{ background:#ff9800;box-shadow:0 0 6px #ff9800;
                                                     animation:cdPulse 1.7s ease-in-out infinite; }
@keyframes cdPulse{0%,100%{opacity:1}50%{opacity:.3}}

/* "watch out" ring — an inset overlay, so it composes with the
   active card's glow instead of replacing its box-shadow */
.cd-card.cd-warn .cd-face::after{
  content:'';position:absolute;inset:0;border-radius:16px;
  box-shadow:inset 0 0 0 1.5px rgba(255,77,109,.6),
             inset 0 0 24px rgba(255,77,109,.2);
  pointer-events:none;z-index:5;
}

/* ═══ Deck toolbar ═════════════════════════════════════════ */
.cd-bar{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:12px auto 0;max-width:var(--cd-w,360px);
}
.cd-dots{ display:flex;align-items:center;gap:6px;flex:1; }
.cd-dot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.16);cursor:pointer;padding:0;border:none;
  transition:all .25s ease;
}
.cd-dot.on{ width:20px;border-radius:4px;background:var(--dot,#a855f7);
            box-shadow:0 0 10px var(--dot,#a855f7); }
.cd-views{
  display:flex;gap:2px;padding:2px;border-radius:9px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
}
.cd-views button{
  background:none;border:0;border-radius:7px;padding:5px 10px;
  color:rgba(255,255,255,.5);
  font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  font-family:inherit;cursor:pointer;transition:all .18s;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.cd-views button:hover{ color:#fff; }
.cd-views button.on{ background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); }

/* ═══ Pile labels — a leader line from each card to its figures ═══ */
.cd-iso-lbls{ position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s ease; }
.cd-deck.cd-v-iso{ perspective:none; }
.cd-deck.cd-v-iso .cd-iso-lbls{ opacity:1; }
.cd-iso-lbl{
  position:absolute;right:0;
  display:flex;flex-direction:column;gap:1px;align-items:flex-start;
  padding:0 0 0 18px;background:none;border:0;cursor:pointer;text-align:left;min-width:0;
  font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;color:#fff;
  transform:translateY(-50%);transition:opacity .25s ease, top .46s cubic-bezier(.34,1.4,.64,1);
  pointer-events:auto;opacity:.55;-webkit-tap-highlight-color:transparent;
}
.cd-deck:not(.cd-v-iso) .cd-iso-lbl{ pointer-events:none; }
.cd-iso-lbl::before{
  content:'';position:absolute;left:0;top:50%;width:12px;height:0;
  border-top:1px dashed var(--lc,#fff);
}
.cd-iso-lbl::after{
  content:'';position:absolute;left:-3px;top:50%;width:5px;height:5px;margin-top:-2.5px;
  border-radius:50%;background:var(--lc,#fff);
}
.cd-iso-lbl b{ font-size:10px;font-weight:800;letter-spacing:.8px;white-space:nowrap; }
.cd-iso-lbl span{ font-size:10.5px;font-weight:700;color:#ffb4a8;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis; }
.cd-iso-lbl span.paid{ color:#9fe3c4; }
.cd-iso-lbl small{ font-size:8.5px;font-weight:500;letter-spacing:0;color:rgba(255,255,255,.45);white-space:nowrap; }
.cd-iso-lbl.on{ opacity:1; }

/* ═══ Detail panel ═════════════════════════════════════════ */
.cd-details{ margin-top:14px;position:relative; }
.cd-detail{ display:none; }
.cd-detail.on{
  display:block;
  animation:cdDetailIn .34s cubic-bezier(.34,1.4,.64,1) both;
}
@keyframes cdDetailIn{
  from{ opacity:0; transform:translateY(-12px) scale(.985); }
  to  { opacity:1; transform:none; }
}
/* colour the detail card to match the active brand */
.cd-detail.on > .cc-card{ border-color:var(--brand-soft,var(--bdr)) !important; }

/* ═══ Responsive ═══════════════════════════════════════════ */
/* Laptop and up: deck + toolbar on the left, the active card's
   detail panel beside it, instead of a tall column of dead space. */
@media(min-width:900px){
  .cd-wrap{
    --cd-w:420px;
    display:grid;
    grid-template-columns:var(--cd-w) minmax(0,1fr);
    grid-template-rows:auto auto;
    column-gap:22px;
    align-items:start;
  }
  .cd-deck   { grid-column:1; grid-row:1; margin:0; }
  .cd-bar    { grid-column:1; grid-row:2; margin:12px 0 0; }
  .cd-details{ grid-column:2; grid-row:1 / span 2; margin-top:0; min-width:0; }
}
@media(min-width:1500px){
  .cd-wrap{ --cd-w:470px; column-gap:28px; }
}
@media(max-width:420px){
  .cd-due{ font-size:22px; }
  .cd-brand{ font-size:13.5px; }
  .cd-top-due{ font-size:12px; }
  .cd-body{ padding:12px 14px 13px; }
  .cd-row2{ margin-top:9px; }
  .cd-iso-lbl b{ font-size:9px; } .cd-iso-lbl span{ font-size:9.5px; } .cd-iso-lbl small{ font-size:8px; }
}
@media(prefers-reduced-motion:reduce){
  .cd-card,.cd-face,.cd-deck{ transition-duration:.01ms !important; }
  .cd-detail.on{ animation:none; }
  .cd-pip.pending i{ animation:none; }
}
</style>

<script>
(function(){
  'use strict';

  var buzz = function(k){ if(typeof window.haptic === 'function') window.haptic(k); };

  var deck, details, dotsWrap, viewsWrap, lblWrap;
  var cards   = [];       // { el, i, brand }
  var active  = 0;
  var view    = 'iso';    // 'iso' pile (default) · 'fan' · 'stack' — kept across reloads
  var order   = [];       // stack order, front → back

  var STEP_Y  = 38;       // px of each card behind that shows above the front one
  var CARD_AR = 1.586;    // ISO/IEC 7810 ID-1 — a real credit card

  var FAN_ROT   = 7;      // degrees between neighbours when fanned
  var FAN_LIFT  = 10;     // px each step out from centre rises
  var FAN_BASE  = 16;     // px the whole fan sits down from the top
  var FAN_SCALE = 0.88;   // shrink when fanned so rotated cards stay in width

  /* the pile: cards scaled down and laid flat at an isometric angle,
     left of centre so the leader labels fit on the right */
  var ISO_S   = 0.54;     // card scale in the pile
  var ISO_RX  = 58, ISO_RZ = -38;
  var ISO_CX  = 0.345;    // pile centre, as a share of deck width
  var ISO_STEP = 0.075;   // gap between cards, share of deck width
  var ISO_PAD  = 8;       // px above the top card

  /* ── Layout ───────────────────────────────────────────── */
  var curW = 360, curH = 227, curRot = FAN_ROT;

  function maxOff(){ return Math.max(0, (cards.length - 1) / 2); }

  /* Rotating a card this wide swings its corners past its own box, so
     with enough cards the outermost one would poke out of the deck and
     give the page a horizontal scrollbar. Back the angle off until the
     widest rotated card fits. */
  function fanRot(w, h){
    var mo = maxOff();
    if(mo <= 0) return 0;
    var rot = FAN_ROT;
    while(rot > 1){
      var rad = mo * rot * Math.PI / 180;
      if(w * FAN_SCALE * Math.cos(rad) + h * FAN_SCALE * Math.sin(rad) <= w - 4) break;
      rot -= 0.5;
    }
    return rot;
  }

  /* Vertical room the fan needs beyond the plain card height. */
  function fanExtent(w, h, rot){
    var rad  = Math.abs(maxOff() * rot) * Math.PI / 180;
    var rotH = w * FAN_SCALE * Math.sin(rad) + h * FAN_SCALE * Math.cos(rad);
    var half = Math.max(0, (rotH - h) / 2);
    return maxOff() * FAN_LIFT + FAN_BASE + half + 10;
  }

  /* projected height of one card lying in the pile */
  function isoH(w, h){
    var z = -ISO_RZ * Math.PI / 180, x = ISO_RX * Math.PI / 180;
    return ISO_S * (w * Math.sin(z) + h * Math.cos(z)) * Math.cos(x);
  }

  function sizeDeck(){
    if(!deck) return;
    curW   = deck.clientWidth || 360;
    curH   = Math.round(curW / CARD_AR);
    curRot = fanRot(curW, curH);
    deck.style.setProperty('--cd-h', curH + 'px');
    var behind = Math.max(0, cards.length - 1), dh;
    if(view === 'fan')        dh = curH + fanExtent(curW, curH, curRot);
    else if(view === 'stack') dh = curH + behind * STEP_Y;
    else                      dh = ISO_PAD + isoH(curW, curH) + behind * curW * ISO_STEP + 8;
    deck.style.setProperty('--cd-deck-h', Math.round(dh) + 'px');
  }

  function layout(){
    if(!deck) return;
    sizeDeck();
    deck.classList.toggle('cd-v-iso', view === 'iso');

    // order: active first, then the rest in their natural order
    order = [active];
    for(var k = 0; k < cards.length; k++) if(k !== active) order.push(k);
    var n = cards.length;

    order.forEach(function(idx, depth){
      var c = cards[idx], el = c.el, face = el.querySelector('.cd-face');
      var x = 0, y, s, r = 0, ix = 0, iz = 0, z, dim;
      if(view === 'fan'){
        var off = idx - maxOff();
        y = Math.abs(off) * FAN_LIFT + FAN_BASE;
        s = idx === active ? FAN_SCALE + 0.05 : FAN_SCALE;
        r = off * curRot;
        // z-index must be an integer — off is fractional for even card counts
        z = idx === active ? 100 : Math.round(50 - Math.abs(off) * 2);
        dim = idx === active ? 0 : 0.14;
      } else if(view === 'stack'){
        // Wallet: the front card sits lowest; each one behind shows its top edge
        y = (n - 1 - depth) * STEP_Y; s = 1;
        z = 100 - depth;
        dim = depth === 0 ? 0 : Math.min(0.3, 0.08 + depth * 0.06);
      } else {
        // pile: the active card lies on top, the rest settle beneath it
        // in order, each one a step lower and a shade darker
        var cy = ISO_PAD + isoH(curW, curH) / 2 + depth * curW * ISO_STEP;
        x = curW * (ISO_CX - 0.5); y = cy - curH / 2; s = ISO_S; ix = ISO_RX; iz = ISO_RZ;
        z = 100 - depth;
        dim = depth === 0 ? 0 : Math.min(0.4, 0.12 + depth * 0.06);
        c.lblY = cy;
      }
      el.style.setProperty('--cd-x', x.toFixed(1) + 'px');
      el.style.setProperty('--cd-y', y.toFixed(1) + 'px');
      el.style.setProperty('--cd-s', s.toFixed(3));
      el.style.setProperty('--cd-r', r.toFixed(2) + 'deg');
      el.style.setProperty('--cd-ix', ix + 'deg');
      el.style.setProperty('--cd-iz', iz + 'deg');
      el.style.zIndex = z;
      face.style.setProperty('--cd-dim', dim.toFixed(2));
      el.classList.toggle('cd-active', idx === active);
    });

    // pile labels sit level with their card, right of the pile
    if(lblWrap){
      lblWrap.querySelectorAll('.cd-iso-lbl').forEach(function(l){
        var i = +l.getAttribute('data-i'), c = cards[i];
        if(c && c.lblY != null) l.style.top = c.lblY.toFixed(1) + 'px';
        l.style.left = (curW * (ISO_CX + 0.335)).toFixed(0) + 'px';
        l.classList.toggle('on', i === active);
      });
    }

    // detail panels
    if(details){
      details.querySelectorAll('.cd-detail').forEach(function(d){
        var on = (+d.getAttribute('data-i') === active);
        d.classList.toggle('on', on);
        if(on && cards[active]) d.style.setProperty('--brand-soft', cards[active].soft);
      });
    }

    // dots
    if(dotsWrap){
      dotsWrap.querySelectorAll('.cd-dot').forEach(function(d, i){
        d.classList.toggle('on', i === active);
        d.style.setProperty('--dot', cards[i] ? cards[i].brand : '#a855f7');
      });
    }
  }

  function setActive(i, quiet){
    if(i < 0 || i >= cards.length || i === active) return;
    active = i;
    if(!quiet) buzz('pop');
    layout();
  }

  /* ── Tilt + sheen (pointer parallax) ──────────────────── */
  function bindTilt(c){
    var el = c.el, face = el.querySelector('.cd-face'), sheen = el.querySelector('.cd-sheen');
    if(!face) return;

    function move(e){
      if(view === 'iso') return;      // the pile already lies at an angle
      var r  = el.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width;
      var py = (e.clientY - r.top)  / r.height;
      face.style.setProperty('--cd-ry', ((px - .5) *  16).toFixed(2) + 'deg');
      face.style.setProperty('--cd-rx', ((py - .5) * -12).toFixed(2) + 'deg');
      if(sheen){
        sheen.style.setProperty('--mx', (px * 100).toFixed(1) + '%');
        sheen.style.setProperty('--my', (py * 100).toFixed(1) + '%');
      }
    }
    el.addEventListener('mouseenter', function(){ el.classList.add('cd-tilting'); });
    el.addEventListener('mousemove', move);
    el.addEventListener('mouseleave', function(){
      el.classList.remove('cd-tilting');
      face.style.setProperty('--cd-ry','0deg');
      face.style.setProperty('--cd-rx','0deg');
    });
  }

  /* ── Horizontal drag → fan / cycle ──────────────────────
     Deck-level listeners are rebound on every init (they die with the
     old markup), but the window-level ones are bound exactly once —
     ccDisplayData() re-renders on each reload, and stacking duplicate
     window handlers would fire every gesture twice. */
  var sx = 0, sy = 0, dragging = false, moved = false, decided = false, horiz = false;
  var windowDragBound = false, resizeBound = false;

  function dragDown(x, y){ sx = x; sy = y; dragging = true; moved = false; decided = false; horiz = false; }
  function dragMove(x, y, e){
    if(!dragging) return;
    var dx = x - sx, dy = y - sy;
    if(!decided && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){
      decided = true;
      horiz = Math.abs(dx) > Math.abs(dy);
      if(!horiz) dragging = false;      // it's a page scroll — let go of it
    }
    if(!horiz) return;
    if(e && e.cancelable) e.preventDefault();   // we own this gesture now
    moved = true;
    if(view === 'stack' && Math.abs(dx) > 26) setView('fan');
  }
  function dragUp(x){
    if(!dragging) return;
    var dx = x - sx;
    dragging = false;
    if(horiz && Math.abs(dx) > 44 && cards.length > 1){
      // a decisive flick cycles the active card
      setActive((active + (dx < 0 ? 1 : cards.length - 1)) % cards.length);
    }
    setTimeout(function(){ moved = false; }, 0);
  }

  function bindDrag(){
    deck.addEventListener('mousedown', function(e){ dragDown(e.clientX, e.clientY); });
    deck.addEventListener('touchstart', function(e){
      var t = e.touches[0]; if(t) dragDown(t.clientX, t.clientY);
    }, { passive:true });
    deck.addEventListener('touchmove', function(e){
      var t = e.touches[0]; if(t) dragMove(t.clientX, t.clientY, e);
    }, { passive:false });
    deck.addEventListener('touchend', function(e){
      var t = e.changedTouches[0]; if(t) dragUp(t.clientX);
    }, { passive:true });
    deck.addEventListener('touchcancel', function(){ dragging = false; moved = false; }, { passive:true });

    // suppress the click that follows a drag
    deck.addEventListener('click', function(e){
      if(moved){ e.stopPropagation(); e.preventDefault(); }
    }, true);

    if(!windowDragBound){
      windowDragBound = true;
      window.addEventListener('mousemove', function(e){ dragMove(e.clientX, e.clientY, e); });
      window.addEventListener('mouseup',   function(e){ dragUp(e.clientX); });
    }
  }

  function syncViews(){
    if(!viewsWrap) return;
    viewsWrap.querySelectorAll('button[data-v]').forEach(function(b){
      var on = b.getAttribute('data-v') === view;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on);
    });
  }

  function setView(v){
    if(view === v) return;
    view = v;
    syncViews();
    buzz('step');
    layout();
  }

  /* one leader label per card for the pile, read off the card's own face */
  function buildLabels(){
    lblWrap = document.createElement('div');
    lblWrap.className = 'cd-iso-lbls';
    lblWrap.innerHTML = cards.map(function(c){
      var q = function(sel){ var e = c.el.querySelector(sel); return e ? e.textContent : ''; };
      var paid = !!c.el.querySelector('.cd-top-due.paid');
      var when = q('.cd-due-date').split('·').pop().trim();   // "3d", "today", "2d ago"
      return '<button type="button" class="cd-iso-lbl" data-i="' + c.i + '" style="--lc:' + c.brand + '">' +
        '<b>' + q('.cd-brand') + (when && !paid ? ' <small>' + when + '</small>' : '') + '</b>' +
        '<span class="' + (paid ? 'paid' : '') + '">' + q('.cd-top-due') + '</span></button>';
    }).join('');
    deck.appendChild(lblWrap);
    lblWrap.querySelectorAll('.cd-iso-lbl').forEach(function(l){
      l.addEventListener('click', function(){ setActive(+l.getAttribute('data-i')); });
    });
  }

  /* ── Public entry point, called by ccDisplayData() ────── */
  function init(){
    deck     = document.getElementById('cd-deck');
    details  = document.getElementById('cd-details');
    dotsWrap = document.getElementById('cd-dots');
    viewsWrap = document.getElementById('cd-views');
    if(!deck) return;

    active = 0; cards = [];

    deck.querySelectorAll('.cd-card').forEach(function(el, i){
      var c = {
        el:    el,
        i:     i,
        brand: el.getAttribute('data-brand') || '#a855f7',
        soft:  el.getAttribute('data-soft')  || 'rgba(255,255,255,.18)'
      };
      cards.push(c);
      bindTilt(c);
      // tapping a card selects it; the current view stays as it is
      el.addEventListener('click', function(){ setActive(i); });
    });
    if(!cards.length) return;

    if(dotsWrap){
      dotsWrap.querySelectorAll('.cd-dot').forEach(function(d, i){
        d.addEventListener('click', function(){ setActive(i); });
      });
    }
    if(viewsWrap){
      syncViews();
      viewsWrap.querySelectorAll('button[data-v]').forEach(function(b){
        b.addEventListener('click', function(){ setView(b.getAttribute('data-v')); });
      });
    }
    buildLabels();

    bindDrag();
    layout();
    // re-measure once fonts/layout settle, and on resize (bound once only)
    setTimeout(layout, 60);
    if(!resizeBound){
      resizeBound = true;
      window.addEventListener('resize', function(){ if(deck && deck.isConnected !== false) layout(); });
    }
  }

  window.cardDeckInit      = init;
  window.cardDeckSetActive = function(i){ setActive(i); };
  window.cardDeckActive    = function(){ return active; };
})();
</script>

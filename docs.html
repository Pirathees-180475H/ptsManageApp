<!-- ═══ DOCS MODAL CSS ═══ -->
<style>
#docs-modal-bg {
  position: fixed; inset: 0; z-index: 9000;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(12px);
  display: none; align-items: center; justify-content: center;
}
#docs-modal-bg.open { display: flex; }
#docs-modal {
  background: #0d1220; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 26px; width: 95%; max-width: 1100px; height: 85vh;
  display: flex; flex-direction: column; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  overflow: hidden; animation: docsModalIn 0.3s cubic-bezier(0.2,1,0.2,1);
  position: relative;
}
@media (max-width: 800px) {
  #docs-modal { width: 100%; height: 100%; border-radius: 0; border: none; }
}
@keyframes docsModalIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }

.docs-hdr {
  padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0;
  background: rgba(255,255,255,0.02);
}
.docs-title { font-size: 0.9em; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.9); display: flex; align-items: center; gap: 10px; }
.docs-close { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.3);
              border-radius: 12px; width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.docs-close:hover { background: rgba(255,77,109,0.2); color: #fff; border-color: rgba(255,77,109,0.3); }

.docs-layout { flex: 1; display: flex; overflow: hidden; position: relative; }

/* Sidebar */
.docs-sidebar {
  width: 280px; border-right: 1px solid rgba(255,255,255,0.05);
  display: flex; flex-direction: column; background: rgba(0,0,0,0.2);
  flex-shrink: 0;
}
@media (max-width: 800px) {
  .docs-sidebar { width: 100%; }
  .docs-layout.item-open .docs-sidebar { display: none; }
}

.docs-sidebar-hdr { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.03); }
.docs-search-container { position: relative; }
.docs-search { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
               border-radius: 14px; padding: 10px 14px 10px 36px; color: #fff; font-size: 0.85em; outline: none; transition: all 0.2s; box-sizing: border-box; }
.docs-search:focus { border-color: var(--blue); background: rgba(255,255,255,0.08); }
.docs-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: 0.3; font-size: 0.8em; }

.docs-sidebar-list { flex: 1; overflow-y: auto; padding: 10px; }
.doc-nav-item {
  display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 16px;
  cursor: pointer; transition: all 0.2s; border: 1px solid transparent; margin-bottom: 4px;
}
.doc-nav-item:hover { background: rgba(255,255,255,0.03); }
.doc-nav-item.active { background: rgba(0,212,255,0.08); border-color: rgba(0,212,255,0.15); }
.doc-nav-icon { width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,0.05);
                display: flex; align-items: center; justify-content: center; font-size: 1.2em; flex-shrink: 0; }
.doc-nav-info { flex: 1; min-width: 0; }
.doc-nav-name { font-size: 0.82em; font-weight: 600; color: rgba(255,255,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-nav-meta { font-size: 0.65em; color: rgba(255,255,255,0.3); margin-top: 2px; }

/* Main Content Area */
.docs-main { flex: 1; display: flex; flex-direction: column; background: #080b14; position: relative; }
@media (max-width: 800px) {
  .docs-main { display: none; }
  .docs-layout.item-open .docs-main { display: flex; }
}

.docs-main-hdr {
  padding: 12px 20px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.1);
}
.docs-back-btn { display: none; background: none; border: none; color: #fff; font-size: 1.2em; cursor: pointer; padding-right: 15px; }
@media (max-width: 800px) { .docs-back-btn { display: block; } }

.docs-title-wrapper { flex: 1; display: flex; align-items: center; min-width: 0; background: rgba(255,255,255,0.03); border-radius: 12px; padding: 4px 8px; margin-right: 15px; border: 1px solid rgba(255,255,255,0.05); transition: all 0.2s; }
.docs-title-wrapper:focus-within { background: rgba(255,255,255,0.06); border-color: var(--blue); }
.docs-main-title { font-size: 0.85em; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: none; border: none; outline: none; flex: 1; padding: 4px; }
.docs-rename-btn { background: none; border: none; color: var(--blue); cursor: pointer; font-size: 0.7em; font-weight: 800; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; display: none; }
.docs-rename-btn:hover { background: rgba(0,212,255,0.1); }
.docs-main-actions { display: flex; gap: 8px; flex-shrink: 0; }
.docs-action-btn {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6);
  padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 0.8em; font-weight: 600; transition: all 0.2s;
  display: flex; align-items: center; gap: 6px;
}
.docs-action-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
.docs-action-btn.del:hover { background: rgba(255,77,109,0.15); color: var(--red); border-color: rgba(255,77,109,0.2); }

.docs-view-container { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.docs-view-empty { text-align: center; color: rgba(255,255,255,0.15); }
.docs-view-empty i { font-size: 4em; display: block; margin-bottom: 15px; }

#main-preview-frame { width: 100%; height: 100%; border: none; background: #fff; }
#main-preview-img { max-width: 95%; max-height: 95%; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); object-fit: contain; }

/* Floating Upload Button */
.docs-fab {
  position: absolute; bottom: 24px; right: 24px; width: 56px; height: 56px;
  border-radius: 50%; background: linear-gradient(135deg, var(--blue), #0099ff);
  color: #fff; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 1.8em; box-shadow: 0 8px 25px rgba(0,212,255,0.4); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index: 100;
}
.docs-fab:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 12px 30px rgba(0,212,255,0.5); }
.docs-fab:active { transform: scale(0.9); }

.docs-empty { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.2); font-size: 0.9em; font-style: italic; grid-column: 1 / -1; }
.docs-loading { text-align: center; padding: 60px; grid-column: 1 / -1; color: rgba(255,255,255,0.4); }

/* Custom Confirm Modal */
#docs-confirm-bg {
  position: fixed; inset: 0; z-index: 9500;
  background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center;
}
#docs-confirm-bg.open { display: flex; }
.confirm-box {
  background: #0d1220; border: 1px solid rgba(255,255,255,0.1);
  border-radius: 26px; width: 90%; max-width: 340px; padding: 32px 28px;
  text-align: center; box-shadow: 0 40px 100px rgba(0,0,0,0.8);
  animation: docsModalIn 0.25s ease;
}
.confirm-title { font-weight: 800; font-size: 1.25em; margin-bottom: 12px; display: block; color: #fff; letter-spacing: -0.5px; }
.confirm-msg { font-size: 0.88em; color: rgba(255,255,255,0.4); margin-bottom: 32px; display: block; line-height: 1.6; }
.confirm-btns { display: flex; gap: 14px; }
.confirm-btn { flex: 1; padding: 14px; border-radius: 16px; border: none; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit; font-size: 0.9em; }
.btn-cancel { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.1); }
.btn-cancel:hover { background: rgba(255,255,255,0.1); color: #fff; }
.btn-confirm { background: linear-gradient(135deg, var(--red), #ff1f4b); color: #fff; box-shadow: 0 8px 25px rgba(255,77,109,0.3); }
.btn-confirm:hover { transform: translateY(-1px); opacity: 0.9; box-shadow: 0 6px 20px rgba(255,77,109,0.4); }

/* Preview Overlay */
#doc-preview-bg {
  position: fixed; inset: 0; z-index: 9100; background: rgba(6,11,24,0.95);
  backdrop-filter: blur(10px);
  display: none; flex-direction: column; align-items: center; justify-content: center;
}
#doc-preview-bg.open { display: flex; }
.preview-close { position: absolute; top: 24px; right: 24px; color: #fff; background: rgba(255,255,255,0.1);
               border: 1px solid rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 700; z-index: 9101; transition: all 0.2s; }
.preview-close:hover { background: rgba(255,77,109,0.2); border-color: rgba(255,77,109,0.3); }
#preview-content { width: 92%; height: 88%; display: flex; align-items: center; justify-content: center; position: relative; }
#preview-frame { width: 100%; height: 100%; border: none; background: #fff; border-radius: 20px; box-shadow: 0 30px 100px rgba(0,0,0,0.8); }
#preview-img { max-width: 100%; max-height: 100%; border-radius: 20px; box-shadow: 0 30px 100px rgba(0,0,0,0.8); object-fit: contain; }
</style>

<div id="docs-modal-bg">
  <div id="docs-modal">
    <div class="docs-hdr">
      <span class="docs-title">📂 Document Vault</span>
      <button class="docs-close" onclick="docsToggle()">✕</button>
    </div>
    
    <div class="docs-layout" id="docs-layout">
      <!-- Sidebar -->
      <div class="docs-sidebar">
        <div class="docs-sidebar-hdr">
          <div class="docs-search-container">
            <span class="docs-search-icon">🔍</span>
            <input type="text" class="docs-search" id="docs-search-input" placeholder="Search..." oninput="docsLocalSearch()">
          </div>
        </div>
        <div id="docs-sidebar-list" class="docs-sidebar-list">
          <!-- List items here -->
        </div>
      </div>

      <!-- Main Content -->
      <div class="docs-main" id="docs-main-area">
        <div class="docs-main-hdr" id="docs-detail-hdr" style="display:none">
          <button class="docs-back-btn" onclick="docsBackToList()">←</button>
          <div class="docs-title-wrapper">
            <input type="text" class="docs-main-title" id="docs-selected-name" oninput="docsCheckRenameChange(this)" onkeydown="if(event.key==='Enter')docsRenameSave()">
            <button class="docs-rename-btn" id="docs-btn-rename" onclick="docsRenameSave()">Save</button>
          </div>
          <div class="docs-main-actions">
            <button class="docs-action-btn" id="docs-btn-download" title="Download">⬇️</button>
            <button class="docs-action-btn del" id="docs-btn-delete" title="Delete">🗑️</button>
          </div>
        </div>
        
        <div class="docs-view-container" id="docs-view-pane">
          <div class="docs-view-empty">
            <div class="ld-spin" id="docs-main-loader" style="display:none; margin: 0 auto 15px;"></div>
            <i id="docs-empty-icon">📂</i>
            <p id="docs-empty-msg">Select a document to preview</p>
          </div>
        </div>
      </div>

      <!-- Floating Upload Button -->
      <button class="docs-fab" onclick="document.getElementById('docs-file-input').click()" title="Upload Document">+</button>
      <input type="file" id="docs-file-input" style="display:none" onchange="docsHandleUpload(this)" accept="image/*,application/pdf">
    </div>
  </div>
</div>

<!-- Custom Delete Confirmation -->
<div id="docs-confirm-bg">
  <div class="confirm-box">
    <span class="confirm-title">Delete Document?</span>
    <span class="confirm-msg" id="docs-confirm-msg">Are you sure you want to delete this file?</span>
    <div class="confirm-btns">
      <button class="confirm-btn btn-cancel" onclick="docsDeleteConfirm(false)">Cancel</button>
      <button class="confirm-btn btn-confirm" onclick="docsDeleteConfirm(true)">Delete</button>
    </div>
  </div>
</div>


<script>
  (function() {
    var _docsData = [];
    var _deleteTargetId = null;
    var _selectedId = null;
    var _docsView = 'files'; // 'files' | 'bills'
    var _billsData = [];

    window.docsToggle = function() {
    var modal = document.getElementById('docs-modal-bg');
    var isOpening = !modal.classList.contains('open');
    modal.classList.toggle('open', isOpening);
    
    document.querySelectorAll('.pg-docs-btn').forEach(function(b) {
      b.classList.toggle('docs-active', isOpening);
    });

    if (isOpening) {
      docsLoadList();
    }
  };

    window.docsLoadList = function() {
      _docsView = 'files';
      var sidebar = document.getElementById('docs-sidebar-list');
      sidebar.innerHTML = '<div style="padding:40px; text-align:center"><div class="ld-spin" style="margin:0 auto"></div></div>';

      google.script.run
        .withSuccessHandler(function(files) {
          _docsData = files;
          docsRenderList(files);
        })
        .withFailureHandler(function(err) {
          sidebar.innerHTML = '<div style="padding:20px; color:var(--red); font-size:0.8em">' + (err.message || err) + '</div>';
        })
        .listMyDocs('');
    };

    window.docsRenderList = function(files) {
      var sidebar = document.getElementById('docs-sidebar-list');
      
      var html = '<div class="doc-nav-item" onclick="docsLoadBills()" style="border-color:rgba(0,212,255,.12);background:rgba(0,212,255,.04);margin-bottom:8px;">';
      html += '  <div class="doc-nav-icon" style="background:rgba(0,212,255,.1);">📁</div>';
      html += '  <div class="doc-nav-info">';
      html += '    <div class="doc-nav-name" style="color:var(--blue);">Bills</div>';
      html += '    <div class="doc-nav-meta">Saved from Expense Divider</div>';
      html += '  </div>';
      html += '</div>';

      if (!files || files.length === 0) {
        html += '<div style="padding:40px; text-align:center; opacity:0.3; font-size:0.8em">No documents</div>';
        sidebar.innerHTML = html;
        return;
      }

      files.forEach(function(f) {
        var icon = '📄';
        if (f.mimeType.indexOf('image/') === 0) icon = '🖼️';
        if (f.mimeType === 'application/pdf') icon = '📕';
        
        var dateStr = new Date(f.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        var activeClass = (_selectedId === f.id) ? 'active' : '';

        html += '<div class="doc-nav-item ' + activeClass + '" onclick="docsSelectItem(\'' + f.id + '\')">';
        html += '  <div class="doc-nav-icon">' + icon + '</div>';
        html += '  <div class="doc-nav-info">';
        html += '    <div class="doc-nav-name">' + f.name + '</div>';
        html += '    <div class="doc-nav-meta">' + dateStr + '</div>';
        html += '  </div>';
        html += '</div>';
      });
      sidebar.innerHTML = html;
    };

    window.docsLoadBills = function() {
      _docsView = 'bills';
      _selectedId = null;
      
      // Update sidebar active state
      document.querySelectorAll('.doc-nav-item').forEach(function(el) { el.classList.remove('active'); });
      
      // Hide detail header, show bills grid
      document.getElementById('docs-detail-hdr').style.display = 'none';
      document.getElementById('docs-layout').classList.remove('item-open');
      
      var pane = document.getElementById('docs-view-pane');
      pane.innerHTML = '<div style="text-align:center;padding:40px;"><div class="ld-spin" style="margin:0 auto"></div><p style="font-size:.8em;color:rgba(255,255,255,.3);margin-top:12px;">Loading bills…</p></div>';

      google.script.run
        .withSuccessHandler(function(bills) {
          _billsData = bills;
          docsRenderBills(bills);
        })
        .withFailureHandler(function(err) {
          pane.innerHTML = '<div style="padding:20px;text-align:center;color:var(--red);font-size:.85em;">Failed to load bills: ' + (err.message || err) + '</div>';
        })
        .listBills();
    };

    window.docsRenderBills = function(bills) {
      var pane = document.getElementById('docs-view-pane');
      
      if (!bills || bills.length === 0) {
        pane.innerHTML = '<div class="docs-view-empty"><i>📭</i><p>No bills saved yet</p><p style="font-size:.75em;margin-top:6px;">Use Save to Docs in Expense Divider</p></div>';
        return;
      }

      var html = '<div style="padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05);">';
      html += '<div style="display:flex;align-items:center;gap:10px;">';
      html += '<button onclick="docsLoadList()" style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:6px 14px;cursor:pointer;font-size:.8em;">← Back to Files</button>';
      html += '<span style="font-weight:700;font-size:.85em;color:var(--blue);">📁 Bills</span>';
      html += '<span style="font-size:.7em;color:rgba(255,255,255,.25);">' + bills.length + ' file(s)</span>';
      html += '</div></div>';

      html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:20px;overflow-y:auto;flex:1;">';
      
      bills.forEach(function(b) {
        var thumbUrl = 'https://drive.google.com/thumbnail?id=' + b.id + '&sz=w400';
        var displayName = b.name.replace(/\.png$/i, '').replace(/_/g, ' ');
        var dateStr = new Date(b.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        
        html += '<div class="doc-bill-card" onclick="docsPreviewBill(\'' + b.id + '\')" style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:16px;overflow:hidden;cursor:pointer;transition:all .25s;display:flex;flex-direction:column;">';
        html += '  <div style="aspect-ratio:1;background:#0a0e1a;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;">';
        html += '    <img src="' + thumbUrl + '" alt="' + displayName + '" style="width:100%;height:100%;object-fit:cover;transition:transform .3s;" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">';
        html += '    <div style="display:none;align-items:center;justify-content:center;font-size:2em;opacity:.3;position:absolute;inset:0;">🖼️</div>';
        html += '  </div>';
        html += '  <div style="padding:10px 12px;">';
        html += '    <div style="font-size:.78em;font-weight:600;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + displayName + '</div>';
        html += '    <div style="font-size:.65em;color:rgba(255,255,255,.3);margin-top:3px;">' + dateStr + '</div>';
        html += '  </div>';
        html += '</div>';
      });
      
      html += '</div>';
      pane.innerHTML = html;
      
      // Add hover effect via style
      var style = document.createElement('style');
      style.textContent = '.doc-bill-card:hover { border-color: rgba(0,212,255,.2) !important; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,.3); } .doc-bill-card:hover img { transform: scale(1.05); }';
      pane.appendChild(style);
    };

    window.docsPreviewBill = function(id) {
      var bill = _billsData.find(function(b) { return b.id === id; });
      if (!bill) return;
      
      var name = bill.name.replace(/\.png$/i, '').replace(/_/g, ' ');
      var thumbUrl = 'https://drive.google.com/thumbnail?id=' + bill.id + '&sz=w1200';
      
      var pane = document.getElementById('docs-view-pane');
      pane.innerHTML = '<div style="display:flex;flex-direction:column;height:100%;">';
      pane.innerHTML += '<div style="padding:12px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0;">';
      pane.innerHTML += '  <div style="display:flex;align-items:center;gap:10px;">';
      pane.innerHTML += '    <button onclick="docsLoadBills()" style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:6px 14px;cursor:pointer;font-size:.8em;">← Back</button>';
      pane.innerHTML += '    <span style="font-weight:600;font-size:.82em;color:rgba(255,255,255,.8);max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + name + '</span>';
      pane.innerHTML += '  </div>';
      pane.innerHTML += '  <div style="display:flex;gap:8px;">';
      pane.innerHTML += '    <button onclick="window.open(\'' + (bill.downloadUrl || bill.viewUrl) + '\',\'_blank\')" style="background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:6px 14px;cursor:pointer;font-size:.8em;">⬇️ Download</button>';
      pane.innerHTML += '    <button onclick="docsDeleteBill(\'' + bill.id + '\')" style="background:rgba(255,255,255,.05);border:1px solid rgba(255,77,109,.2);color:var(--red);border-radius:10px;padding:6px 14px;cursor:pointer;font-size:.8em;">🗑️ Delete</button>';
      pane.innerHTML += '  </div>';
      pane.innerHTML += '</div>';
      pane.innerHTML += '<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;background:#080b14;">';
      pane.innerHTML += '  <img src="' + thumbUrl + '" style="max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);object-fit:contain;">';
      pane.innerHTML += '</div></div>';
    };

    window.docsDeleteBill = function(id) {
      _deleteTargetId = id;
      var bill = _billsData.find(function(b) { return b.id === id; });
      var name = bill ? bill.name.replace(/'/g, "\\'") : 'this bill';
      document.getElementById('docs-confirm-msg').innerText = "Delete '" + (bill ? bill.name : 'bill') + "' permanently?";
      document.getElementById('docs-confirm-bg').classList.add('open');
    };

    window.docsSelectItem = function(id) {
      _selectedId = id;
      var file = _docsData.find(function(f) { return f.id === id; });
      if (!file) return;

      // Update UI selection
      document.querySelectorAll('.doc-nav-item').forEach(function(el, idx) {
        el.classList.toggle('active', _docsData[idx] && _docsData[idx].id === id);
      });

      // Show detail view
      document.getElementById('docs-layout').classList.add('item-open');
      document.getElementById('docs-detail-hdr').style.display = 'flex';
      var nameEl = document.getElementById('docs-selected-name');
      nameEl.value = file.name;
      nameEl.dataset.old = file.name;
      document.getElementById('docs-btn-rename').style.display = 'none';
      
      // Update actions
      document.getElementById('docs-btn-download').onclick = function() { docsDownload(file.id); };
      document.getElementById('docs-btn-delete').onclick = function() { docsDeleteReq(file.id, file.name.replace(/'/g, "\\'")); };

      // Load Preview
      var pane = document.getElementById('docs-view-pane');
      pane.innerHTML = '<div class="ld-spin"></div>';

      google.script.run
        .withSuccessHandler(function(data) {
          if (data.mimeType.indexOf('image/') === 0) {
            var thumbUrl = 'https://drive.google.com/thumbnail?id=' + data.id + '&sz=w1200';
            pane.innerHTML = '<img id="main-preview-img" src="' + thumbUrl + '">';
          } else {
            pane.innerHTML = '<iframe id="main-preview-frame" src="' + data.viewUrl.replace(/\/view.*$/, '/preview') + '"></iframe>';
          }
        })
        .withFailureHandler(function(err) {
          pane.innerHTML = '<div style="color:var(--red)">Preview failed: ' + err + '</div>';
        })
        .getDocPreview(id);
    };

    window.docsBackToList = function() {
      document.getElementById('docs-layout').classList.remove('item-open');
    };

    window.docsLocalSearch = function() {
      var query = document.getElementById('docs-search-input').value.toLowerCase();
      // If viewing bills, switch back to files view for search
      if (_docsView === 'bills') {
        _docsView = 'files';
      }
      var filtered = _docsData.filter(function(f) {
        return f.name.toLowerCase().indexOf(query) !== -1;
      });
      docsRenderList(filtered);
    };

    window.docsCheckRenameChange = function(input) {
      var btn = document.getElementById('docs-btn-rename');
      var isChanged = input.value.trim() !== "" && input.value !== input.dataset.old;
      btn.style.display = isChanged ? 'block' : 'none';
    };

    window.docsRenameSave = function() {
      var input = document.getElementById('docs-selected-name');
      var newName = input.value.trim();
      var oldName = input.dataset.old;
      if (!newName || newName === oldName) return;

      var btn = document.getElementById('docs-btn-rename');
      var oldBtnText = btn.innerText;
      btn.innerText = '...';
      btn.disabled = true;

      google.script.run
        .withSuccessHandler(function() {
          input.dataset.old = newName;
          btn.style.display = 'none';
          btn.innerText = oldBtnText;
          btn.disabled = false;
          docsLoadList(); // Refresh list to show new name
        })
        .withFailureHandler(function(err) {
          alert("Rename failed: " + err);
          btn.innerText = oldBtnText;
          btn.disabled = false;
        })
        .renameDoc(_selectedId, newName);
    };

    window.docsHandleUpload = function(input) {
      var file = input.files[0];
      if (!file) return;

      var pane = document.getElementById('docs-view-pane');
      var oldContent = pane.innerHTML;
      pane.innerHTML = '<div style="text-align:center"><div class="ld-spin" style="margin:0 auto 15px"></div><p style="font-size:0.8em; color:var(--blue)">Uploading ' + file.name + '...</p></div>';

      var reader = new FileReader();
      reader.onload = function(e) {
        var content = e.target.result.split(',')[1];
        google.script.run
          .withSuccessHandler(function() {
            input.value = '';
            docsLoadList();
            pane.innerHTML = '<div class="docs-view-empty"><i>✅</i><p>Upload Successful</p></div>';
          })
          .withFailureHandler(function(err) {
            alert("Upload failed: " + err);
            pane.innerHTML = oldContent;
          })
          .uploadDoc(content, file.name, file.type || 'application/octet-stream');
      };
      reader.readAsDataURL(file);
    };

    window.docsDeleteReq = function(id, name) {
      _deleteTargetId = id;
      document.getElementById('docs-confirm-msg').innerText = "Delete '" + name + "' permanently?";
      document.getElementById('docs-confirm-bg').classList.add('open');
    };

    window.docsDeleteConfirm = function(yes) {
      document.getElementById('docs-confirm-bg').classList.remove('open');
      var targetId = _deleteTargetId;
      _deleteTargetId = null;
      if (yes && targetId) {
        var wasBills = (_docsView === 'bills');
        google.script.run
          .withSuccessHandler(function() {
            if (wasBills) {
              docsLoadBills();
            } else {
              _selectedId = null;
              docsLoadList();
              document.getElementById('docs-detail-hdr').style.display = 'none';
              document.getElementById('docs-view-pane').innerHTML = '<div class="docs-view-empty"><i>🗑️</i><p>Document Deleted</p></div>';
            }
          })
          .withFailureHandler(function(err) {
            alert("Delete failed: " + err);
          })
          .deleteDoc(targetId);
      }
    };


    window.docsDownload = function(id) {
      var file = _docsData.find(function(f) { return f.id === id; });
      if (file && file.downloadUrl) {
        window.open(file.downloadUrl, '_blank');
      }
    };

})();
</script>
